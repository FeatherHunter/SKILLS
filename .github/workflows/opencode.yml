name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    if: contains(github.event.comment.body, '/oc') || contains(github.event.comment.body, '/opencode')
    runs-on: self-hosted
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Add Git Bash to PATH (Windows self-hosted)
        if: runner.os == 'Windows'
        shell: "C:\\Program Files\\Git\\bin\\bash.exe --noprofile --norc -e -o pipefail {0}"
        run: echo "C:\Program Files\Git\bin;C:\Program Files\Git\usr\bin" >> $GITHUB_PATH

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run OpenCode
        uses: anomalyco/opencode/github@latest
        env:
          ZEN_API_KEY: ${{ secrets.ZEN_API_KEY }}
        with:
          model: zen-go/deepseek-v4-flash
