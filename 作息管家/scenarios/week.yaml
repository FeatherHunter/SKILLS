# 作息管家 · 周视图场景片段(T8 注册 · 2026-08-09 · G2-A6 + T6 实现)
# 合并通道: scripts/update_scenarios.py 合并器读本目录 *.yaml 片段 →
#           校验字段契约(§07 §2.2) → 按 scenario_id 合并写回 references/scenarios.yaml。
# 设计依据:
# - G1-功能定标清单 A6(周视图 · 广度 · record): 周视图 = 一周作息总览
# - 对抗式审查矛盾 4: 复用 record_category 24h×N 热力图组件 + 扩展全分类总览
# - T6 交付(实施): week_view.py 域模块(COMMANDS{"render-record-week"}) +
#   week_view.html(7×24 全分类热力图 + 每日汇总 + 健康分);T6 不碰 scenarios.yaml(归 T8 注册)
- wake_word: 周视图
  scenario_id: week_view
  scenario_title: 周视图(7×24 全分类总览)
  dimensions:
    week: 目标周(默认本周;锚点日期 YYYY-MM-DD)
  prompt: 请帮我看看这一周的作息总览(唤醒词:周视图)
  status: ''
  result: render-record-week [日期] → 7×24 全分类热力图(复用 record_category 组件)+ 分类总览 + 每日汇总 + 健康分 + 复制 prompt 按钮
