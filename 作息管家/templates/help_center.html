<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>作息管家 · HELP 中心 · §07 契约</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --fg:#1d1d1f;--fg2:#6e6e73;--fg3:#86868b;--bg:#fafafa;
    --card:#fff;--line:#d2d2d7;--soft:#f5f8ff;
    --blue:#007aff;--blue2:#0a63ce;
    --good:#34c759;--warn:#ff9500;--danger:#ff3b30;--mute:#9b9ba0;
    --shadow:0 1px 3px rgba(0,0,0,.04),0 12px 36px rgba(0,0,0,.06);
  }
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Apple Color Emoji","Segoe UI Emoji",emoji,sans-serif;background:var(--bg);color:var(--fg);line-height:1.7;-webkit-font-smoothing:antialiased}
  .wrap{max-width:960px;margin:0 auto;padding:48px 24px 96px}

  /* Hero */
  .hero{background:linear-gradient(135deg,#e8f0ff 0%,#d6e5ff 100%);border-radius:24px;padding:40px 36px;margin-bottom:24px;box-shadow:var(--shadow)}
  .hero .eyebrow{font-size:12px;color:var(--blue);font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px}
  .hero h1{font-size:34px;line-height:1.15;letter-spacing:-.025em;margin-bottom:12px}
  .hero .lead{font-size:15px;color:var(--fg2);max-width:720px;margin-bottom:18px}
  .hero .stats{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--fg2)}
  .hero .stats b{color:var(--blue2);font-variant-numeric:tabular-nums}

  /* Search */
  .search{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 18px;margin-bottom:20px;display:flex;align-items:center;gap:12px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
  .search input{flex:1;border:none;outline:none;font-size:15px;background:transparent;color:var(--fg);font-family:inherit}
  .search input::placeholder{color:var(--fg3)}
  .search .icon{color:var(--fg3);font-size:16px}

  /* Wake word section */
  .wake-section{background:var(--card);border:1px solid var(--line);border-radius:18px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.04);overflow:hidden}
  .wake-section > .wake-header{padding:18px 22px;cursor:pointer;user-select:none;display:flex;align-items:center;gap:12px;transition:background .15s;border-bottom:1px solid transparent}
  .wake-section > .wake-header:hover{background:#fafbff}
  .wake-section.open > .wake-header{border-bottom-color:var(--line)}
  .wake-section > .wake-header .toggle{font-size:18px;color:var(--fg3);width:18px;text-align:center;transition:transform .2s}
  .wake-section.open > .wake-header .toggle{transform:rotate(90deg);color:var(--blue2)}
  .wake-section > .wake-header .name{font-size:16px;font-weight:600;color:var(--fg);letter-spacing:-.01em}
  .wake-section > .wake-header .count{font-size:12px;color:var(--fg3);background:#f0f0f2;padding:3px 10px;border-radius:6px;font-weight:600}
  .wake-section > .wake-header .pending{font-size:12px;color:var(--danger);background:#ffe5e0;padding:3px 10px;border-radius:6px;font-weight:600;display:none}
  .wake-section.has-pending > .wake-header .pending{display:inline-block}

  .wake-section > .scenarios{display:none;padding:0 22px 18px}
  .wake-section.open > .scenarios{display:block}

  /* Scenario card */
  .scenario{padding:14px 0;border-bottom:1px dashed var(--line)}
  .scenario:last-child{border-bottom:none}
  .scenario .title{font-size:14px;font-weight:600;color:var(--fg);margin-bottom:6px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .scenario .badge{font-size:11px;padding:2px 8px;border-radius:4px;font-weight:600;letter-spacing:.02em}
  .scenario .badge.avail{background:#e3f9e5;color:#1f8c3d}
  .scenario .badge.pending{background:#ffe5e0;color:#d63a1a}
  .scenario .id{font-size:11px;color:var(--fg3);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;margin-bottom:8px;display:block}
  .scenario .dimensions{font-size:12px;color:var(--fg3);margin-bottom:8px}
  .scenario .dimensions b{color:var(--fg2);font-weight:600}
  .scenario .prompt{background:var(--soft);border-radius:10px;padding:10px 14px;font-size:13px;color:var(--fg);margin-bottom:8px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-word}
  .scenario .result{font-size:12px;color:var(--fg2);margin-bottom:10px}
  .scenario .result b{color:var(--fg);font-weight:600}
  .scenario .copy-btn{font-size:12px;color:var(--blue);background:#e8f0ff;border:1px solid #c5d9f5;border-radius:8px;padding:6px 12px;cursor:pointer;font-weight:600;font-family:inherit;transition:all .15s}
  .scenario .copy-btn:hover{background:var(--blue);color:#fff}
  .scenario .copy-btn.copied{background:var(--good);color:#fff;border-color:var(--good)}
  .scenario .copy-btn.failed{background:var(--danger);color:#fff;border-color:var(--danger)}

  /* Footer */
  .footer{margin-top:48px;padding-top:24px;border-top:1px solid var(--line);font-size:12px;color:var(--fg3);text-align:center}

  /* Empty state */
  .empty{text-align:center;padding:60px 24px;color:var(--fg3);font-size:14px}

  /* Mobile */
  @media (max-width: 640px) {
    .wrap{padding:24px 16px 64px}
    .hero{padding:28px 22px;border-radius:18px}
    .hero h1{font-size:24px}
    .hero .stats{gap:12px;font-size:12px}
    .wake-section > .wake-header{padding:14px 16px}
    .wake-section > .scenarios{padding:0 16px 14px}
    .scenario .prompt{font-size:12px}
  }
</style>
</head>
<body>
<div class="wrap">

  <!-- ============ HERO ============ -->
  <div class="hero">
    <div class="eyebrow">§07 HELP · 场景完备性契约</div>
    <h1>作息管家 · 能力速查</h1>
    <div class="lead">所有业务唤醒词的合法场景清单 + 稳定 prompt(可直接复制给 AI)。prompt 不暴露 CLI / 数据库 / 模板路径,只描述用户意图与预期结果。</div>
    <div class="stats">
      <span><b id="stat-wakewords">—</b> 唤醒词</span>
      <span><b id="stat-scenarios">—</b> 场景</span>
      <span><b id="stat-pending" style="color:var(--danger)">—</b> 待开发</span>
      <span>生成于 <b id="stat-generated">—</b></span>
    </div>
  </div>

  <!-- ============ SEARCH ============ -->
  <div class="search">
    <span class="icon">🔍</span>
    <input id="search" type="text" placeholder="搜索唤醒词 / 场景标题 / prompt 关键词..." autocomplete="off">
  </div>

  <!-- ============ WAKE WORD SECTIONS ============ -->
  <div id="sections">
    <!--INJECT-SECTIONS-->
  </div>

  <!-- ============ EMPTY STATE ============ -->
  <div class="empty" id="empty" style="display:none">没有匹配的场景</div>

  <!-- ============ FOOTER ============ -->
  <div class="footer">
    作息管家 HELP 中心 · 由 <code>scripts/help_render.py</code> 生成 · 数据源 <code>references/scenarios.yaml</code><br>
    遵循总纲 V1.0 §07 HELP 与场景完备性契约 · 不展示 HELP 唤醒词自身
  </div>

</div>

<script>
window.__SCENARIOS__ = <!--INJECT-DATA-->;

(function(){
  // === 1. 渲染统计 ===
  var data = window.__SCENARIOS__;
  document.getElementById('stat-wakewords').textContent = data.wakeword_count;
  document.getElementById('stat-scenarios').textContent = data.scenario_count;
  document.getElementById('stat-pending').textContent = data.pending_count;
  document.getElementById('stat-generated').textContent = data.generated_at;

  // === 2. 渲染 sections (按 wake_word 分组) ===
  var sectionsEl = document.getElementById('sections');
  data.sections.forEach(function(sec){
    var el = document.createElement('div');
    el.className = 'wake-section';
    if (sec.pending_count > 0) el.classList.add('has-pending');
    el.setAttribute('data-wake', sec.wake_word.toLowerCase());
    el.innerHTML =
      '<div class="wake-header" onclick="this.parentElement.classList.toggle(\'open\')">' +
        '<span class="toggle">▸</span>' +
        '<span class="name">' + escapeHTML(sec.wake_word) + '</span>' +
        '<span class="count">' + sec.scenarios.length + ' 场景</span>' +
        '<span class="pending">' + sec.pending_count + ' 待开发</span>' +
      '</div>' +
      '<div class="scenarios">' +
        sec.scenarios.map(renderScenario).join('') +
      '</div>';
    sectionsEl.appendChild(el);
  });

  function renderScenario(s){
    var badge = s.status === '【待开发】'
      ? '<span class="badge pending">【待开发】</span>'
      : '<span class="badge avail">✓ 可用</span>';
    var dims = Object.keys(s.dimensions || {}).length
      ? Object.keys(s.dimensions).map(function(k){return '<b>' + escapeHTML(k) + '</b>: ' + escapeHTML(String(s.dimensions[k]))}).join(' · ')
      : '—';
    return '<div class="scenario" data-search="' + (escapeHTML(s.wake_word) + ' ' + escapeHTML(s.scenario_title) + ' ' + escapeHTML(s.prompt)).toLowerCase() + '">' +
      '<div class="title">' + escapeHTML(s.scenario_title) + badge + '</div>' +
      '<div class="id">scenario_id: <code>' + escapeHTML(s.scenario_id) + '</code></div>' +
      '<div class="dimensions">维度: ' + dims + '</div>' +
      '<div class="prompt">' + escapeHTML(s.prompt) + '</div>' +
      '<div class="result"><b>预期结果:</b> ' + escapeHTML(s.result || '—') + '</div>' +
      '<button class="copy-btn" data-prompt="' + escapeHTML(s.prompt) + '">📋 复制 prompt</button>' +
    '</div>';
  }

  function escapeHTML(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  // === 3. 默认打开前 3 个 ===
  var allSections = sectionsEl.querySelectorAll('.wake-section');
  for (var i = 0; i < Math.min(3, allSections.length); i++) allSections[i].classList.add('open');

  // === 4. 复制按钮 ===
  sectionsEl.addEventListener('click', function(e){
    if (!e.target.classList.contains('copy-btn')) return;
    var btn = e.target;
    var text = btn.getAttribute('data-prompt');
    var done = function(){
      btn.textContent = '✅ 已复制 · 粘贴给 AI';
      btn.classList.add('copied');
      setTimeout(function(){
        btn.textContent = '📋 复制 prompt';
        btn.classList.remove('copied');
      }, 2000);
    };
    var fallback = function(){
      // 降级:选中文本让用户手动复制
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try {
        document.execCommand('copy');
        done();
      } catch (err) {
        btn.textContent = '❌ 复制失败 · 请手动选择';
        btn.classList.add('failed');
      }
      document.body.removeChild(ta);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done).catch(fallback);
    } else {
      fallback();
    }
  });

  // === 5. 搜索 ===
  document.getElementById('search').addEventListener('input', function(e){
    var q = e.target.value.toLowerCase().trim();
    var any = false;
    allSections.forEach(function(sec){
      var matched = 0;
      sec.querySelectorAll('.scenario').forEach(function(sc){
        var text = sc.getAttribute('data-search');
        var hit = q === '' || text.indexOf(q) >= 0 || sec.getAttribute('data-wake').indexOf(q) >= 0;
        sc.style.display = hit ? '' : 'none';
        if (hit) matched++;
      });
      if (q !== '' && matched > 0) sec.classList.add('open');
      sec.style.display = (q === '' || matched > 0) ? '' : 'none';
      if (sec.style.display !== 'none') any = true;
    });
    document.getElementById('empty').style.display = any ? 'none' : '';
  });

  // === 6. 5 状态 fallback ===
  if (data.error) {
    sectionsEl.innerHTML = '<div class="empty" style="color:var(--danger)">' +
      '⚠ 加载失败: ' + escapeHTML(data.error) + '<br>请检查 references/scenarios.yaml 是否存在且合法' +
      '</div>';
  }
})();
</script>
</body>
</html>
