<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>📚 作息管家 · 唤醒词速查台</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f5f6f7; --card: #fff; --text: #1c1c1e; --sub: #6b6b6f;
    --accent: #0071e3; --green: #34c759; --orange: #ff9500; --red: #ff3b30;
    --code-bg: #f0f0f2; --border: #e5e5e7; --warn-bg: #fff7e6;
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.04);
    --r: 8px; --r-sm: 6px; --r-lg: 14px;
  }
  html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased;
    min-height: 100vh; padding: 0 0 80px;
  }
  .container { max-width: 920px; margin: 0 auto; padding: 0 16px 40px; }

  /* ===== HERO ===== */
  .hero { background: linear-gradient(135deg, #fafbfc, #f0f4f8); padding: 16px 0 12px; }
  .hero h1 { font-size: 20px; font-weight: 700; letter-spacing: -.3px; line-height: 1.15; margin: 0 0 2px; }
  .hero .sub { color: var(--accent); font-size: 13px; font-weight: 500; margin: 0 0 6px; }
  .hero .stats { margin: 4px 0 0; display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--sub); }
  .hero .stats b { color: var(--text); font-variant-numeric: tabular-nums; }

  /* ===== 搜索 + 折叠控制 ===== */
  .controls {
    display: flex; gap: 8px; align-items: center;
    padding: 10px 0; position: sticky; top: 0; z-index: 10;
    background: rgba(245, 246, 247, 0.92);
    backdrop-filter: saturate(180%) blur(12px); -webkit-backdrop-filter: saturate(180%) blur(12px);
  }
  .controls input {
    flex: 1; padding: 7px 12px; border: 1px solid var(--border); border-radius: var(--r-sm);
    background: var(--card); font-size: 13px; outline: none;
    transition: border-color .15s;
  }
  .controls input:focus { border-color: var(--accent); }
  .controls button {
    padding: 6px 12px; border: 1px solid var(--border); background: var(--card);
    border-radius: var(--r-sm); font-size: 12px; cursor: pointer;
    color: var(--text); font-weight: 500; transition: all .15s;
  }
  .controls button:hover { background: #fafbfc; border-color: var(--accent); color: var(--accent); }

  /* ===== 3 层折叠 details ===== */
  .cat-block { margin-bottom: 12px; border-radius: var(--r); overflow: hidden; box-shadow: var(--shadow); background: var(--card); }
  .cat-block > summary {
    list-style: none; cursor: pointer; user-select: none;
    padding: 11px 14px; display: flex; align-items: center; gap: 8px;
    font-weight: 600; font-size: 14px;
    transition: background .15s;
  }
  .cat-block > summary:hover { background: #fafbfc; }
  .cat-block > summary::-webkit-details-marker { display: none; }
  .cat-block > summary::before {
    content: '▸'; font-size: 12px; color: var(--sub);
    transition: transform .2s; width: 14px; display: inline-block;
  }
  .cat-block[open] > summary::before { transform: rotate(90deg); color: var(--accent); }
  .cat-block > summary > * { pointer-events: none; }
  .cat-block .cat-icon { font-size: 16px; }
  .cat-block .cat-name { flex: 1; }
  .cat-block .cat-count { font-size: 11px; color: var(--sub); background: var(--code-bg); padding: 2px 8px; border-radius: 4px; font-weight: 500; }
  .cat-block .cat-pending { font-size: 11px; color: var(--orange); background: var(--warn-bg); padding: 2px 8px; border-radius: 4px; font-weight: 500; display: none; }
  .cat-block.has-pending .cat-pending { display: inline-block; }
  .cat-block .cat-desc { font-size: 11px; color: var(--sub); font-weight: 400; margin-top: 2px; flex-basis: 100%; }
  .cat-block > .cat-content { padding: 0 14px 12px; }

  .ww-block { margin-top: 8px; border-left: 2px solid var(--code-bg); border-radius: 0 var(--r-sm) var(--r-sm) 0; background: #fafbfc; }
  .ww-block > summary {
    list-style: none; cursor: pointer; user-select: none;
    padding: 7px 12px; display: flex; align-items: center; gap: 6px;
    font-weight: 500; font-size: 13px; color: var(--text);
    transition: background .15s;
  }
  .ww-block > summary:hover { background: #f5f6f7; }
  .ww-block > summary::-webkit-details-marker { display: none; }
  .ww-block > summary::before {
    content: '▸'; font-size: 11px; color: var(--sub);
    transition: transform .2s; width: 12px; display: inline-block;
  }
  .ww-block[open] > summary::before { transform: rotate(90deg); color: var(--accent); }
  .ww-block > summary > * { pointer-events: none; }
  .ww-block .ww-name { flex: 1; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  .ww-block .ww-count { font-size: 11px; color: var(--sub); background: var(--card); padding: 1px 7px; border-radius: 3px; }
  .ww-block .ww-pending { font-size: 11px; color: var(--orange); background: var(--warn-bg); padding: 1px 7px; border-radius: 3px; margin-left: 4px; display: none; }
  .ww-block.has-pending .ww-pending { display: inline-block; }
  .ww-block > .ww-content { padding: 0 12px 8px 18px; }

  .sc-block {
    margin-top: 6px; padding: 8px 10px;
    background: var(--card); border-radius: var(--r-sm); border: 1px solid var(--border);
  }
  .sc-block.pending { border-left: 3px solid var(--orange); }
  .sc-block > summary {
    list-style: none; cursor: pointer; user-select: none;
    padding: 0; display: flex; align-items: center; gap: 6px;
    font-size: 13px; font-weight: 500; color: var(--text);
  }
  .sc-block > summary::-webkit-details-marker { display: none; }
  .sc-block > summary::before {
    content: '▸'; font-size: 10px; color: var(--sub);
    transition: transform .2s; width: 10px; display: inline-block;
  }
  .sc-block[open] > summary::before { transform: rotate(90deg); color: var(--accent); }
  .sc-block > summary > * { pointer-events: none; }
  .sc-block .sc-id { font-size: 10px; color: var(--sub); font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  .sc-block .sc-status { font-size: 10px; padding: 1px 6px; border-radius: 3px; font-weight: 600; margin-left: auto; }
  .sc-block .sc-status.avail { background: #e8f5e9; color: #2e7d32; }
  .sc-block .sc-status.pending { background: var(--warn-bg); color: var(--orange); }
  .sc-block > .sc-content { padding: 8px 0 0 16px; }
  .sc-dim-list { display: flex; flex-wrap: wrap; gap: 4px; margin: 6px 0; }
  .sc-dim { font-size: 10px; color: var(--sub); background: var(--code-bg); padding: 2px 7px; border-radius: 3px; }
  .sc-prompt {
    background: var(--code-bg); border-radius: var(--r-sm); padding: 8px 12px;
    font-size: 12px; color: var(--text); margin: 6px 0;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    white-space: pre-wrap; word-break: break-word; line-height: 1.45;
  }
  .sc-result { font-size: 11px; color: var(--sub); margin-bottom: 8px; }
  .sc-result b { color: var(--text); font-weight: 500; }
  .copy-btn {
    padding: 5px 10px; border: 1px solid var(--border); background: var(--card);
    border-radius: var(--r-sm); font-size: 11px; cursor: pointer;
    color: var(--accent); font-weight: 500; transition: all .15s;
  }
  .copy-btn:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
  .copy-btn.copied { background: var(--green); color: #fff; border-color: var(--green); }
  .copy-btn.failed { background: var(--red); color: #fff; border-color: var(--red); }

  /* ===== Empty / 隐藏 ===== */
  .empty { text-align: center; padding: 40px 20px; color: var(--sub); font-size: 13px; }
  .cat-block.hidden, .ww-block.hidden, .sc-block.hidden { display: none; }

  /* ===== Toast ===== */
  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: rgba(28, 28, 30, 0.92); color: #fff; padding: 9px 16px;
    border-radius: var(--r); font-size: 13px; z-index: 100;
    opacity: 0; transition: opacity .2s; pointer-events: none;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  }
  .toast.show { opacity: 1; }

  /* ===== Footer ===== */
  .footer { text-align: center; color: var(--sub); font-size: 11px; padding: 16px 0; }

  /* ===== Mobile ===== */
  @media (max-width: 640px) {
    .container { padding: 0 12px 32px; }
    .hero h1 { font-size: 18px; }
    .cat-block > summary { padding: 9px 12px; font-size: 13px; }
    .ww-block > summary { padding: 7px 10px; font-size: 12px; }
    .sc-block > summary { font-size: 12px; }
    .controls button { padding: 5px 10px; font-size: 11px; }
  }
</style>
</head>
<body>

<div class="hero">
  <div class="container">
    <h1>📚 作息管家 · 唤醒词速查台</h1>
    <div class="sub">▸ 模块 → 唤醒词 → 场景 → 复制 prompt → 贴给 AI</div>
    <div class="stats">
      <span><b id="stat-categories">—</b> 模块</span>
      <span><b id="stat-wakewords">—</b> 唤醒词</span>
      <span><b id="stat-scenarios">—</b> 场景</span>
      <span><b id="stat-pending" style="color:var(--orange)">—</b> 待开发</span>
      <span>生成于 <b id="stat-generated">—</b></span>
    </div>
  </div>
</div>

<div class="container">
  <div class="controls">
    <input id="search" type="search" placeholder="🔍 搜索唤醒词 / 场景 / prompt..." autocomplete="off">
    <button id="expandAll" type="button">📂 全部展开</button>
    <button id="collapseAll" type="button">📁 全部折叠</button>
  </div>

  <div id="mainContent"></div>

  <div class="footer">
    作息管家 · <code>scripts/help_render.py</code> 渲染 · 数据源 <code>references/scenarios.yaml</code><br>
    遵循总纲 V1.0 §07 HELP 与场景完备性契约 · 3 层折叠 · 默认折叠
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
window.__SCENARIOS__ = <!--INJECT-DATA-->;

(function(){
  // === 工具函数 ===
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(function(){ t.classList.remove('show'); }, 1800);
  }

  // === 1. 渲染统计 ===
  const data = window.__SCENARIOS__;
  if (!data) {
    document.getElementById('mainContent').innerHTML = '<div class="empty">⚠ 数据加载失败</div>';
    return;
  }
  document.getElementById('stat-categories').textContent = data.category_count;
  document.getElementById('stat-wakewords').textContent = data.wakeword_count;
  document.getElementById('stat-scenarios').textContent = data.scenario_count;
  document.getElementById('stat-pending').textContent = data.pending_count;
  document.getElementById('stat-generated').textContent = data.generated_at;

  // === 2. 渲染 3 层折叠(默认折叠)===
  const mainEl = document.getElementById('mainContent');

  function renderCategory(cat) {
    const wws = cat.wake_words || [];
    const pendingCount = cat.pending_count || 0;
    const allWw = wws.map(renderWakeWord).join('');
    return '<details class="cat-block' + (pendingCount > 0 ? ' has-pending' : '') + '">' +
      '<summary>' +
        '<span class="cat-icon">' + esc(cat.icon) + '</span>' +
        '<span class="cat-name">' + esc(cat.name) + '</span>' +
        '<span class="cat-count">' + esc(wws.length) + ' 唤醒词</span>' +
        (pendingCount > 0 ? '<span class="cat-pending">' + pendingCount + ' 待开发</span>' : '') +
        (cat.desc ? '<div class="cat-desc">' + esc(cat.desc) + '</div>' : '') +
      '</summary>' +
      '<div class="cat-content">' + allWw + '</div>' +
    '</details>';
  }

  function renderWakeWord(ww) {
    const scs = ww.scenarios || [];
    const pending = ww.pending_count || 0;
    return '<details class="ww-block' + (pending > 0 ? ' has-pending' : '') + '">' +
      '<summary>' +
        '<span class="ww-name">' + esc(ww.wake_word) + '</span>' +
        '<span class="ww-count">' + scs.length + ' 场景</span>' +
        (pending > 0 ? '<span class="ww-pending">' + pending + ' 待开发</span>' : '') +
      '</summary>' +
      '<div class="ww-content">' + scs.map(renderScenario).join('') + '</div>' +
    '</details>';
  }

  function renderScenario(sc) {
    const isPending = sc.status === '【待开发】';
    const dims = sc.dimensions || {};
    const dimBadges = Object.entries(dims).map(function(e){
      return '<span class="sc-dim">' + esc(e[0]) + ': ' + esc(String(e[1])) + '</span>';
    }).join('');
    const statusBadge = isPending
      ? '<span class="sc-status pending">【待开发】</span>'
      : '<span class="sc-status avail">✓ 可用</span>';
    const dataSearch = (sc.wake_word + ' ' + sc.scenario_title + ' ' + sc.prompt + ' ' + (sc.result || '')).toLowerCase();
    return '<details class="sc-block' + (isPending ? ' pending' : '') + '" data-search="' + esc(dataSearch) + '">' +
      '<summary>' +
        '<span class="sc-id">' + esc(sc.scenario_id) + '</span>' +
        esc(sc.scenario_title) +
        statusBadge +
      '</summary>' +
      '<div class="sc-content">' +
        (dimBadges ? '<div class="sc-dim-list">' + dimBadges + '</div>' : '') +
        '<div class="sc-prompt">' + esc(sc.prompt) + '</div>' +
        (sc.result ? '<div class="sc-result"><b>预期结果:</b> ' + esc(sc.result) + '</div>' : '') +
        '<button class="copy-btn" data-prompt="' + esc(sc.prompt) + '">📋 复制 prompt</button>' +
      '</div>' +
    '</details>';
  }

  if (!data.categories || !data.categories.length) {
    mainEl.innerHTML = '<div class="empty">📭 暂无模块数据</div>';
  } else {
    mainEl.innerHTML = data.categories.map(renderCategory).join('');
  }

  // === 3. 默认折叠(全部 details 都不带 open 属性)===
  // (CSS 端无 [open] 即折叠,HTML 端我们也不加 open,默认就是折叠的)

  // === 4. 复制按钮 ===
  mainEl.addEventListener('click', function(e){
    const btn = e.target.closest('.copy-btn');
    if (!btn) return;
    const text = btn.getAttribute('data-prompt') || '';
    const done = function(){
      btn.textContent = '✅ 已复制';
      btn.classList.add('copied');
      showToast('已复制 prompt · 粘贴给 AI');
      setTimeout(function(){
        btn.textContent = '📋 复制 prompt';
        btn.classList.remove('copied');
      }, 1800);
    };
    const fallback = function(){
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0;';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); done(); } catch(e) { btn.textContent = '❌ 复制失败'; btn.classList.add('failed'); }
      document.body.removeChild(ta);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done).catch(fallback);
    } else {
      fallback();
    }
  });

  // === 5. 全部展开 / 全部折叠 ===
  function setAll(open) {
    mainEl.querySelectorAll('details').forEach(function(d){ d.open = open; });
  }
  document.getElementById('expandAll').addEventListener('click', function(){ setAll(true); });
  document.getElementById('collapseAll').addEventListener('click', function(){ setAll(false); });

  // === 6. 搜索(自动展开匹配项)===
  document.getElementById('search').addEventListener('input', function(e){
    const q = e.target.value.toLowerCase().trim();
    const allCats = mainEl.querySelectorAll('.cat-block');
    let anyVisible = false;
    allCats.forEach(function(cat){
      let catHasMatch = false;
      const wws = cat.querySelectorAll('.ww-block');
      wws.forEach(function(ww){
        let wwHasMatch = false;
        const scs = ww.querySelectorAll('.sc-block');
        scs.forEach(function(sc){
          const hit = q === '' || (sc.getAttribute('data-search') || '').indexOf(q) >= 0;
          sc.classList.toggle('hidden', !hit);
          if (hit) wwHasMatch = true;
        });
        ww.classList.toggle('hidden', !wwHasMatch);
        if (wwHasMatch) {
          ww.open = true;
          catHasMatch = true;
        }
      });
      cat.classList.toggle('hidden', !catHasMatch);
      if (catHasMatch) {
        cat.open = true;
        anyVisible = true;
      } else if (q === '') {
        anyVisible = true;
        cat.open = false;
      }
    });
    if (q !== '' && !anyVisible) {
      mainEl.insertAdjacentHTML('beforeend', '<div class="empty">🔍 无匹配场景</div>');
    } else {
      const e = mainEl.querySelector('.empty');
      if (e && e.textContent.indexOf('无匹配') >= 0) e.remove();
    }
  });
})();
</script>

</body>
</html>
