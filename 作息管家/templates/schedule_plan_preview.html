<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>商量计划 · {{ date }}</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --fg:#1d1d1f;--fg2:#6e6e73;--fg3:#78787e;--bg:#fafafa;
    --card:#fff;--line:#d2d2d7;--soft:#f5f8ff;
    --blue:#007aff;--blue2:#0a63ce;
    --good:#34c759;--warn:#ff9500;--danger:#ff3b30;--mute:#9b9ba0;
    --shadow:0 1px 3px rgba(0,0,0,.04),0 12px 36px rgba(0,0,0,.06);
  }
  html{scroll-behavior:smooth}
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Apple Color Emoji","Segoe UI Emoji",emoji,sans-serif;background:var(--bg);color:var(--fg);line-height:1.7;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1280px;margin:0 auto;padding:48px 28px 80px}

  /* ① Hero: 标题即日期 + 状态徽章(短判定) */
  .hero{background:linear-gradient(180deg,#fff 0%,#f8fbff 100%);border-radius:24px;padding:28px 32px;margin-bottom:20px;box-shadow:var(--shadow)}
  h1{font-size:30px;line-height:1.25;letter-spacing:-.02em;margin-bottom:10px}
  .lead{font-size:15px;color:var(--fg2);max-width:780px;line-height:1.6}
  .status-badge{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:999px;font-size:13px;font-weight:600;margin-top:14px;width:fit-content}
  .status-badge.ok{background:#e6f7ec;color:#1f8c3d}
  .status-badge.conflict{background:#fff5e0;color:#a25b00}
  .status-badge.bad{background:#fff0ee;color:#a83228}

  /* ② 4 卡摘要 */
  .summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin:8px 0 24px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;box-shadow:0 1px 3px rgba(0,0,0,.04);display:flex;flex-direction:column;gap:4px}
  .stat .n{font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
  .stat .l{font-size:12px;color:var(--fg3);letter-spacing:.05em;margin-top:2px}
  .stat .d{font-size:12px;color:var(--fg2);margin-top:2px;line-height:1.5}
  .stat.good .n{color:var(--good)}
  .stat.warn .n{color:var(--warn)}
  .stat.danger .n{color:var(--danger)}
  .stat.blue .n{color:var(--blue)}

  section{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px 26px;margin:16px 0;box-shadow:0 1px 2px rgba(0,0,0,.03)}
  section h2{font-size:20px;letter-spacing:-.01em;margin-bottom:4px}
  section .sub{color:var(--fg2);font-size:13px;margin-bottom:14px;line-height:1.65}

  /* ③ 24h 时间块 */
  .tl{display:grid;grid-template-columns:repeat(24,1fr);gap:1px;background:var(--line);border-radius:8px;overflow:hidden;margin:10px 0 6px}
  .tl .seg{background:var(--soft);padding:6px 2px;font-size:9.5px;font-weight:600;color:var(--fg2);text-align:center;line-height:1.1;min-height:38px;display:flex;align-items:center;justify-content:center;cursor:default;position:relative;overflow:hidden}
  .tl .seg[data-tip]:hover::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);background:var(--fg);color:#fff;padding:6px 10px;border-radius:6px;font-size:11px;white-space:normal;z-index:10;line-height:1.4;max-width:240px;width:max-content}
  .tl .seg.filled{background:#007AFF;color:#fff;font-weight:700}
  .tl .seg.locked{background:#FF9500;color:#fff;font-weight:700}
  .tl .seg.gap{background:#fff5e0;color:#a25b00}
  .tl-labels{display:grid;grid-template-columns:repeat(24,1fr);gap:1px;margin-top:4px}
  .tl-labels span{font-size:9.5px;color:var(--fg3);text-align:center;font-variant-numeric:tabular-nums}

  /* ④ 候选事件列表 */
  .event-list{margin:12px 0 0}
  .event-item{display:flex;align-items:flex-start;gap:12px;padding:10px 12px;background:#fafbfc;border:1px solid var(--line);border-radius:10px;margin-bottom:8px}
  .event-item .time{flex-shrink:0;min-width:88px;font-size:13px;font-weight:600;color:var(--blue2);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .event-item .info{flex:1;min-width:0}
  .event-item .info .title{font-size:14px;font-weight:600;color:var(--fg);margin-bottom:2px}
  .event-item .info .cat{display:inline-block;font-size:10.5px;padding:2px 7px;border-radius:999px;background:#eaf2ff;color:#0a63ce;margin-right:6px;font-weight:600}
  .event-item .info .notes{font-size:12px;color:var(--fg2);margin-top:3px;line-height:1.55}
  .event-item .info .locked-tag{display:inline-block;font-size:10px;background:#fff5e0;color:#a25b00;padding:1px 6px;border-radius:4px;margin-left:6px;font-weight:600}
  .event-item .info .conflict-tag{display:inline-block;font-size:10px;background:#fff0ee;color:#a83228;padding:1px 6px;border-radius:4px;margin-left:6px;font-weight:600}

  /* ⑤ 冲突与调整: 移动优先 · 候选/锁定颜色分层 + 泳道可视化重叠(2026-08-13 用户拍板) */
  .conflict-card{background:#fff;border:1px solid #ffe3a3;border-radius:14px;padding:14px 16px;margin:10px 0;box-shadow:0 1px 2px rgba(0,0,0,.03)}
  .tag{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:999px;margin-right:6px;vertical-align:1px}
  .tag.cand{background:#eaf2ff;color:#0a63ce}
  .tag.lock{background:#fff5e0;color:#a25b00}
  .cf-main{font-size:15px;font-weight:600;color:var(--fg);margin-bottom:4px}
  .cf-main b{color:var(--blue2);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .cf-lock{font-size:13px;color:var(--fg2);margin:3px 0}
  .cf-lock b{color:#a25b00;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .cf-overlap{font-size:13px;font-weight:600;color:#a83228;margin:4px 0 2px}
  .cf-overlap b{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  /* 泳道: 上=候选(蓝) 中=重叠(红斜纹) 下=锁定(橙);背景竖线=24h 刻度 */
  .lane{position:relative;height:34px;margin:6px 0 10px;border-radius:8px;border:1px solid var(--line);overflow:hidden;background:repeating-linear-gradient(90deg,rgba(0,0,0,.05) 0 1px,transparent 1px calc(100%/24))}
  .lane .bar{position:absolute;border-radius:4px;height:11px}
  .lane .bar.cand{background:var(--blue);top:3px}
  .lane .bar.lock{background:var(--warn);top:19px}
  .lane .bar.overlap{top:12px;height:5px;background:repeating-linear-gradient(45deg,#ff3b30 0 3px,transparent 3px 6px)}
  .adjust-row{margin-top:10px;font-size:13px;color:var(--fg);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .adjust-row input[type=time]{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:14px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;min-width:96px}
  .adjust-row input[type=time]:focus{outline:none;border-color:var(--blue)}
  .adjust-hint{font-size:12px;color:var(--fg2);margin:6px 2px 0}

  /* ⑥ 底部动作卡: 唯一主动作(2026-08-13 用户拍板:复制动作放底部,复制数据/日志之上) */
  .act-card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px 24px;margin:24px 0 8px;box-shadow:var(--shadow)}
  .act-row{display:flex;align-items:center;gap:20px}
  .act-ctx{flex:1;min-width:0}
  .act-status{font-size:15px;font-weight:600;color:var(--fg)}
  .act-status.ok{color:#1f8c3d}
  .act-status.warn{color:#a25b00}
  .act-status.bad{color:#a83228}
  .act-hint{font-size:12.5px;color:var(--fg2);margin-top:4px}
  .copy-btn{background:var(--blue);color:#fff;border:none;padding:14px 26px;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;transition:all .15s;font-family:inherit;white-space:nowrap}
  .copy-btn:hover{background:var(--blue2);transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,122,255,.3)}
  .copy-btn:active{transform:translateY(0)}

  /* ⑦ 底部: 次级动作(复制数据/复制日志 · 08 硬标准)+ 生成信息 */
  .footer{margin-top:8px;text-align:center;color:var(--fg3);font-size:12px;line-height:1.7}
  .gen-meta{color:var(--fg3);font-size:11.5px;margin-top:6px}

  @media(max-width:760px){
    .wrap{padding:32px 14px 64px}
    .hero{padding:22px 18px;border-radius:20px}
    h1{font-size:24px}
    .summary{grid-template-columns:repeat(2,1fr)}
    section{padding:18px 16px}
    section h2{font-size:18px}
    .act-card{padding:16px}
    .act-row{flex-direction:column;align-items:stretch;gap:12px}
    .copy-btn{width:100%;justify-self:stretch}
    .tl .seg{font-size:8px;min-height:32px}
  }
</style>
<style><!--SHARED-CSS--></style>
<style>
  /* 模板级 token 覆盖(#324 审查: base.css 后注入会覆盖同名 :root, 此处再覆盖回本页需要的弱化文字对比度) */
  :root{--fg3:#78787e}
</style>
</head>
<body>
<div class="wrap">

<!-- ① Hero -->
<header class="hero">
  <h1 id="page-title">商量计划 · 加载中…</h1>
  <p class="lead" id="page-subtitle">候选计划 + 冲突检测 + 24h 覆盖率检查 · 只读预览,写库由 AI 完成</p>
  <div class="status-badge" id="status-badge">加载中…</div>
</header>

<!-- ② 4 卡摘要 -->
<div class="summary">
  <div class="stat blue">
    <div class="n" id="stat-candidate">—</div>
    <div class="l">候选事件数</div>
    <div class="d">AI 多轮对话产出</div>
  </div>
  <div class="stat good">
    <div class="n" id="stat-coverage">—</div>
    <div class="l">24h 覆盖率</div>
    <div class="d">需 100% 满</div>
  </div>
  <div class="stat danger">
    <div class="n" id="stat-conflicts">—</div>
    <div class="l">冲突数</div>
    <div class="d">候选 vs 已有 locked</div>
  </div>
  <div class="stat warn">
    <div class="n" id="stat-locked">—</div>
    <div class="l">已锁定事件数</div>
    <div class="d">今日已有 schedule_plans</div>
  </div>
</div>

<!-- ③ 24h 时间块 -->
<section>
  <h2>24h 时间块</h2>
  <p class="sub">蓝 = 候选事件 · 橙 = 已有锁定事件 · 黄 = 24h 缺口。悬停(手机上长按)查看详情。</p>
  <div class="tl" id="timeline"></div>
  <div class="tl-labels" id="tl-labels"></div>
</section>

<!-- ④ 候选事件列表 -->
<section>
  <h2>候选事件</h2>
  <p class="sub">AI 多轮对话生成的候选计划。🔒 = 与已锁定事件重叠 · ⚠ = 与候选冲突。</p>
  <div class="event-list" id="event-list"></div>
</section>

<!-- ⑤ 冲突与调整: 重叠明细 + 填表式调整 -->
<section id="conflict-section" style="display:none">
  <h2>冲突与调整</h2>
  <p class="sub" id="conflict-summary"></p>
  <div id="conflict-list"></div>
  <p class="adjust-hint" id="adjust-hint"></p>
</section>

<!-- ⑥ 底部动作卡: 复制计划给 AI(唯一主动作 · 无预览区,复制即走) -->
<div class="act-card">
  <div class="act-row">
    <div class="act-ctx">
      <div class="act-status" id="act-status">加载中…</div>
      <div class="act-hint">点击按钮复制指令 → 粘贴给 AI → AI 按流程执行</div>
    </div>
    <button class="copy-btn" id="copy-btn">复制计划给 AI</button>
  </div>
</div>

<!-- ⑦ 底部: 次级动作 + 生成信息 -->
<footer class="footer">
  <!-- #269 补齐: 复制数据/复制日志(Base actionBar · 08 规范硬标准) -->
  <div id="actionbar-zone"></div>
  <div class="gen-meta" id="gen-meta">…</div>
</footer>

</div>

<script id="payload" type="application/json"><!--INJECT-DATA--></script><script><!--SHARED-HELPERS--></script>
<script>
(function(){
  "use strict";

  function esc(s){
    return String(s ?? "").replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;","&gt;":"&gt;","\"":"&quot;","'":"&#39;"}[c];
    });
  }

  var raw = document.getElementById("payload");
  var payload, err = null;
  try { payload = JSON.parse(raw.textContent || "{}"); }
  catch(e){ err = e.message; }

  if (err) {
    document.getElementById("root") && (document.getElementById("root").innerHTML =
      '<div class="error"><h3>❌ 数据解析失败</h3><pre>' + esc(err) + '</pre></div>');
    return;
  }

  if (payload.status !== "ok" || !payload.data) {
    document.body.insertAdjacentHTML("afterbegin",
      '<div style="background:#fff0ee;color:#a83228;padding:16px;text-align:center">❌ 数据加载失败:' + esc(payload.message || "未知错误") + '</div>');
    return;
  }

  var data = payload.data;
  var meta = data.meta || {};
  var planEvents = data.plan_events || [];
  var lockedEvents = data.locked_events || [];
  var conflicts = data.conflicts || [];
  var status = data.status || "ok";
  var coverage = data.coverage_pct || 0;

  // ① Hero(副标题保持静态,避免与 4 卡重复)
  document.getElementById("page-title").textContent = "商量计划 · " + (meta.date || "");

  // ② 状态判定: 徽章 = 短判定;动作卡状态行 = 动作后果(互补,不重复)
  var badge = document.getElementById("status-badge");
  var actStatus = document.getElementById("act-status");
  if (status === "ok" && conflicts.length === 0) {
    badge.className = "status-badge ok";
    badge.textContent = "✅ 可写库 · 无冲突";
    actStatus.className = "act-status ok";
    actStatus.textContent = "AI 将按流程写库,并询问是否同步飞书";
  } else if (conflicts.length > 0) {
    badge.className = "status-badge conflict";
    badge.textContent = "⚠ 有 " + conflicts.length + " 处冲突";
    actStatus.className = "act-status warn";
    actStatus.textContent = "复制指令后,AI 会先与你确认冲突调整再写库";
  } else {
    badge.className = "status-badge bad";
    badge.textContent = "❌ 候选不完整";
    actStatus.className = "act-status bad";
    actStatus.textContent = "需补满 24h 缺口后再写库";
  }

  // ③ 4 卡摘要
  document.getElementById("stat-candidate").textContent = planEvents.length;
  document.getElementById("stat-coverage").textContent = coverage + "%";
  document.getElementById("stat-conflicts").textContent = conflicts.length;
  document.getElementById("stat-locked").textContent = lockedEvents.length;
  var coverageEl = document.getElementById("stat-coverage");
  if (coverage === 100) coverageEl.parentElement.className = "stat good";
  else if (coverage >= 80) coverageEl.parentElement.className = "stat warn";
  else coverageEl.parentElement.className = "stat danger";

  // ④ 24h 时间块
  var tl = document.getElementById("timeline");
  var tlLabels = document.getElementById("tl-labels");
  var segsByHour = {};
  for (var h = 0; h < 24; h++) {
    segsByHour[h] = { type: "empty", tip: h + ":00" };
  }
  planEvents.forEach(function(ev){
    var sh = parseInt((ev.time_start || "0:0").split(":")[0], 10);
    var eh = parseInt((ev.time_end || "0:0").split(":")[0], 10);
    for (var h = sh; h < eh; h++) {
      if (h >= 0 && h < 24) {
        segsByHour[h] = {
          type: "filled",
          tip: ev.time_start + "–" + ev.time_end + " · " + (ev.title || "") + " · " + (ev.category || "")
        };
      }
    }
  });
  lockedEvents.forEach(function(ev){
    var sh = parseInt((ev.time_start || "0:0").split(":")[0], 10);
    var eh = parseInt((ev.time_end || "0:0").split(":")[0], 10);
    for (var h = sh; h < eh; h++) {
      if (h >= 0 && h < 24 && segsByHour[h].type === "empty") {
        segsByHour[h] = {
          type: "locked",
          tip: "🔒 " + ev.time_start + "–" + ev.time_end + " · " + (ev.title || "")
        };
      }
    }
  });
  for (var h = 0; h < 24; h++) {
    var seg = segsByHour[h];
    var tipText = h + ":00 · 空";
    if (seg.type === "filled") tipText = h + ":00 · " + seg.tip;
    else if (seg.type === "locked") tipText = h + ":00 · " + seg.tip;
    tl.insertAdjacentHTML("beforeend",
      '<div class="seg ' + seg.type + '" data-tip="' + esc(tipText) + '" title="' + esc(tipText) + '"></div>');
  }
  var labelStep = window.innerWidth <= 760 ? 2 : 3;
  for (var h2 = 0; h2 < 24; h2++) {
    if (h2 % labelStep === 0) {
      tlLabels.insertAdjacentHTML("beforeend", '<span>' + h2 + '</span>');
    } else {
      tlLabels.insertAdjacentHTML("beforeend", '<span></span>');
    }
  }

  // ⑤ 候选事件列表
  var eventList = document.getElementById("event-list");
  var conflictIds = {};
  conflicts.forEach(function(cf){
    (cf.candidate_ids || []).forEach(function(id){ conflictIds[id] = true; });
  });
  var lockedRanges = lockedEvents.map(function(ev){
    return ev.time_start + "–" + ev.time_end;
  });
  planEvents.forEach(function(ev, i){
    var isConflict = conflictIds[ev._index !== undefined ? ev._index : i] || conflictIds[i];
    var inLocked = false;
    lockedEvents.forEach(function(lk){
      if (lk.time_start <= ev.time_start && ev.time_end <= lk.time_end) inLocked = true;
    });
    var html = '<div class="event-item">';
    html += '<div class="time">' + esc(ev.time_start) + '–' + esc(ev.time_end) + '</div>';
    html += '<div class="info">';
    html += '<div class="title">' + esc(ev.title || "(无标题)");
    if (inLocked) html += '<span class="locked-tag">🔒 与已锁定事件重叠</span>';
    if (isConflict) html += '<span class="conflict-tag">⚠ 冲突</span>';
    html += '</div>';
    if (ev.category) html += '<span class="cat">' + esc(ev.category) + '</span>';
    if (ev.notes) html += '<div class="notes">' + esc(ev.notes) + '</div>';
    html += '</div></div>';
    eventList.insertAdjacentHTML("beforeend", html);
  });

  // ⑥ 冲突区: 移动优先 · 候选/锁定颜色分层 + 泳道可视化重叠 + 填表式调整
  var conflictSection = document.getElementById("conflict-section");
  var adjustments = {};
  var adjustedCount = 0;
  var adjustHint = document.getElementById("adjust-hint");

  function toMin(hhmm){
    var p = String(hhmm).split(":");
    return parseInt(p[0], 10) * 60 + parseInt(p[1] || "0", 10);
  }

  function laneBar(s, e, kind){
    if (!s || !e) return "";
    var sm = toMin(s), em = toMin(e);
    var left = sm / 1440 * 100;
    var width = (em - sm) / 1440 * 100;
    if (width < 1.2) width = 1.2;
    return '<div class="bar ' + kind + '" style="left:' + left.toFixed(2) + '%;width:' + width.toFixed(2) + '%"></div>';
  }

  function refreshAdjustHint(){
    if (adjustedCount > 0) {
      adjustHint.textContent = "已调整 " + adjustedCount + " 段候选时段 · 复制的指令将使用调整后的时段(写库前 AI 会与你确认)";
    } else {
      adjustHint.textContent = "";
    }
  }

  if (conflicts.length > 0) {
    conflictSection.style.display = "block";
    document.getElementById("conflict-summary").textContent =
      "检测到 " + conflicts.length + " 处候选与已锁定事件时间重叠。可直接修改候选时段,或复制指令后与 AI 讨论。";
    var list = document.getElementById("conflict-list");
    // 按候选事件分组(一个候选可能同时与多条锁定重叠)
    var byCand = {};
    conflicts.forEach(function(cf){
      var key = String(cf.candidate_idx !== undefined ? cf.candidate_idx : 0);
      (byCand[key] = byCand[key] || []).push(cf);
    });
    Object.keys(byCand).forEach(function(key){
      var idx = Number(key);
      var ev = planEvents[idx];
      if (!ev) return;
      var cfs = byCand[key];
      var html = '<div class="conflict-card"><div class="ctxt">';
      // 主: 本次候选(蓝)
      html += '<div class="cf-main"><span class="tag cand">本次候选</span>「' + esc(ev.title || "(无标题)") + '」<b>' +
        esc(ev.time_start) + '–' + esc(ev.time_end) + '</b></div>';
      // 泳道(候选条 + 各锁定条 + 重叠斜纹)
      html += '<div class="lane">';
      html += laneBar(ev.time_start, ev.time_end, "cand");
      cfs.forEach(function(cf){
        var op = String(cf.overlap || "").split("–");
        if (op.length === 2) html += laneBar(op[0], op[1], "overlap");
        var lt = String(cf.locked_time || "").split("–");
        if (lt.length === 2) html += laneBar(lt[0], lt[1], "lock");
      });
      html += '</div>';
      // 次: 各锁定事件(橙)
      cfs.forEach(function(cf){
        html += '<div class="cf-lock"><span class="tag lock">已锁定</span>「' + esc(cf.locked) + '」<b>' +
          esc(cf.locked_time) + '</b>(写库保留 · 不可改)</div>';
        html += '<div class="cf-overlap">重叠时段 <b>' + esc(cf.overlap || "—") + '</b> · ' +
          (cf.overlap_minutes || 0) + ' 分钟</div>';
      });
      // 填表式调整
      html += '<div class="adjust-row">调整候选时段: ' +
        '<input type="time" data-idx="' + idx + '" data-field="s" value="' + esc(ev.time_start) + '">' +
        '<span>–</span>' +
        '<input type="time" data-idx="' + idx + '" data-field="e" value="' + esc(ev.time_end) + '">' +
        '</div>';
      html += '</div></div>';
      list.insertAdjacentHTML("beforeend", html);
    });
    list.querySelectorAll("input[type=time]").forEach(function(inp){
      inp.addEventListener("change", function(){
        var idx = Number(inp.getAttribute("data-idx"));
        var field = inp.getAttribute("data-field");
        var adj = adjustments[idx] || { s: planEvents[idx].time_start, e: planEvents[idx].time_end };
        adj[field] = inp.value;
        adjustments[idx] = adj;
        adjustedCount = Object.keys(adjustments).length;
        refreshAdjustHint();
      });
    });
  }

  // ⑦ 复制 prompt: 客户端组装(技能 + 唤醒词 + 参数 · 与服务端同格式;调整时段后自动带入)
  function buildPrompt(){
    var evs = planEvents.map(function(ev, i){
      var adj = adjustments[i];
      if (!adj) return ev;
      return Object.assign({}, ev, { time_start: adj.s || ev.time_start, time_end: adj.e || ev.time_end });
    });
    var hasAdj = adjustedCount > 0;
    var lines = [];
    lines.push("① 技能与唤醒词: 作息管家 · 「商量计划」");
    lines.push("");
    lines.push("② 参数:");
    lines.push("  - 日期: " + (meta.date || ""));
    lines.push("  - 候选事件(" + evs.length + " 段 · 24h 覆盖 " + coverage + "%" + (hasAdj ? " · 候选时段已由用户调整" : "") + "):");
    var jsonStr = JSON.stringify(evs, null, 2).split("\n").map(function(l){
      return l.trim() ? "    " + l : l;
    }).join("\n");
    lines.push(jsonStr);
    if (lockedEvents.length) {
      lines.push("  - 已锁定事件(" + lockedEvents.length + " 段 · 写库时保留保护):");
      lockedEvents.forEach(function(e){
        lines.push("    - " + e.time_start + "–" + e.time_end + " " + (e.title || "—"));
      });
    }
    lines.push("  - 冲突(" + conflicts.length + " 处" + (hasAdj ? " · 调整后请与用户确认是否已消除" : "") + "):");
    if (conflicts.length) {
      conflicts.forEach(function(c){
        lines.push("    - 「" + c.candidate + "」(" + c.candidate_time + ")与「" + c.locked + "」(" + c.locked_time + ")重叠 " + (c.overlap || "—") + " · " + (c.overlap_minutes || 0) + " 分钟");
      });
    } else {
      lines.push("    (无)");
    }
    lines.push("");
    lines.push("③ 执行: 按「商量计划」流程把候选事件写入 " + (meta.date || "") + " 的计划" +
      (hasAdj ? ",写库前先与用户确认调整结果" : "") + ",写库后询问是否同步飞书");
    return lines.join("\n");
  }

  // 复制主按钮(Base copyText v2: 反馈走 Toast;不展示预览区)
  document.getElementById("copy-btn").addEventListener("click", function(){
    window.copyText(buildPrompt());
  });

  // ⑧ 生成信息 + 底部次级动作(复制数据/复制日志 · Base actionBar · 08 规范硬标准)
  document.getElementById("gen-meta").textContent =
    (meta.date || "") + " · 生成于 " + (meta.generated_at || "—") + " · 商量计划预览 · 只读";
  var abZone = document.getElementById("actionbar-zone");
  if (abZone && window.actionBar) {
    abZone.innerHTML = window.actionBar(payload);
  }
})();
</script>
</body>
</html>
