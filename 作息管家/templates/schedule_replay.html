<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>{{ title }}</title>
<style>
/* === Phase E · 复盘 start-end · T08 视觉打磨 (4 卡 + 4 段叙事 + 复制 prompt + 移动端适配) ===
 * Spec: .scratch/replay-start-end/spec.md § 4 段叙事 + § 5 状态 fallback
 * 总纲 §04 原则 10: 单工铁律,过程型 HTML 必有"复制 prompt"按钮 + 4 部分结构
 */
*,*::before,*::after { box-sizing: border-box; }
* { margin: 0; padding: 0; }
:root {
  --fg: #1d1d1f;
  --fg2: #6e6e73;
  --fg3: #86868b;
  --bg: #f5f5f7;
  --card: #fff;
  --line: #d2d2d7;
  --soft: #f0f4ff;
  --blue: #007aff;
  --good: #34c759;
  --warn: #ff9500;
  --danger: #ff3b30;
  --mute: #9b9ba0;
}
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg); color: var(--fg);
  line-height: 1.65; -webkit-font-smoothing: antialiased;
  padding-bottom: 60px;
}
.wrap { max-width: 1080px; margin: 0 auto; padding: 32px 24px 96px; min-width: 0; }

/* === Offline 横幅(顶部非阻塞) === */
.offline-banner {
  background: rgba(255, 149, 0, 0.15);
  border: 1px solid rgba(255, 149, 0, 0.4);
  border-radius: 8px; padding: 8px 12px; margin-bottom: 16px;
  text-align: center; color: #a25b00; font-size: 12px;
}

/* === Hero === */
.hero {
  background: linear-gradient(180deg, #fff 0%, #f8fbff 100%);
  border-radius: 24px; padding: 28px 32px; margin-bottom: 20px;
  box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 12px 36px rgba(0,0,0,.06);
}
.hero .eyebrow { font-size: 11px; color: var(--blue); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; margin-bottom: 6px; }
.hero h1 { font-size: 28px; line-height: 1.2; letter-spacing: -.025em; margin-bottom: 6px; }
.hero .lead { font-size: 14px; color: var(--fg2); max-width: 780px; margin-bottom: 8px; }
.hero .meta { margin-top: 8px; color: var(--fg3); font-size: 11px; display: flex; gap: 12px; flex-wrap: wrap; }
.hero .status-badge {
  display: inline-block; padding: 2px 10px; border-radius: 999px;
  font-size: 11px; font-weight: 600;
  background: var(--soft); color: var(--blue);
}
.hero .status-badge.good { background: rgba(52,199,89,0.12); color: var(--good); }
.hero .status-badge.empty { background: rgba(155,155,160,0.12); color: var(--mute); }
.hero .status-badge.warn { background: rgba(255,149,0,0.12); color: var(--warn); }
.hero .status-badge.error { background: rgba(255,59,48,0.12); color: var(--danger); }

/* === 4 卡总览 grid(总时长 / 记录数 / 完成率 / 健康分)=== */
.cards-4 {
  display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 12px; margin-bottom: 20px;
}
.card-stat {
  background: var(--card); border-radius: 16px; padding: 18px 20px;
  box-shadow: 0 1px 2px rgba(0,0,0,.04);
  border: 1px solid var(--line);
}
.card-stat .label { font-size: 11px; color: var(--fg3); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 6px; font-weight: 600; }
.card-stat .value { font-size: 28px; font-weight: 700; line-height: 1.1; color: var(--fg); font-variant-numeric: tabular-nums; }
.card-stat .delta { font-size: 11px; color: var(--fg2); margin-top: 4px; }
.card-stat.good .value { color: var(--good); }
.card-stat.warn .value { color: var(--warn); }
.card-stat.danger .value { color: var(--danger); }
.card-stat.mute .value { color: var(--mute); }

/* === 4 段叙事 segment === */
.segment {
  background: var(--card); border-radius: 16px; padding: 20px 24px;
  margin-bottom: 16px;
  box-shadow: 0 1px 2px rgba(0,0,0,.04);
}
.segment h2 { font-size: 15px; margin-bottom: 14px; color: var(--fg2); text-transform: uppercase; letter-spacing: .06em; display: flex; align-items: center; gap: 8px; font-weight: 600; }
.segment h2 .icon { font-size: 18px; }
.segment .incomplete-mark {
  background: rgba(255,149,0,0.12); color: var(--warn);
  padding: 2px 10px; border-radius: 999px; font-size: 11px; font-weight: 600;
  margin-left: auto;
}

/* Top-N 折叠:cat-row 列表(默认 10 + "展开全部"按钮) */
.cat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.cat-row {
  display: flex; align-items: center; gap: 8px; padding: 10px 12px;
  background: var(--soft); border-radius: 8px; min-height: 44px;
}
.cat-row.hidden { display: none; }
.cat-row .emoji { font-size: 18px; width: 24px; text-align: center; flex-shrink: 0; }
.cat-row .name { flex: 1; font-size: 12px; font-weight: 500; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cat-row .dur { font-size: 11px; color: var(--fg2); font-variant-numeric: tabular-nums; flex-shrink: 0; }
.cat-row .bar { height: 3px; background: #e5e5e5; border-radius: 2px; margin-top: 4px; overflow: hidden; }
.cat-row .bar-fill { height: 100%; border-radius: 2px; transition: width .6s ease; }
.expand-btn {
  display: block; width: 100%; padding: 12px; margin-top: 12px;
  border: 1px solid var(--line); background: var(--card);
  border-radius: 8px; color: var(--fg); font-size: 13px;
  cursor: pointer; font-family: inherit;
  min-height: 44px;  /* 移动端触控友好(总纲 §04 原则 12) */
}

/* 6 类 completion 分布堆叠柱 */
.completion-bar {
  display: flex; height: 32px; border-radius: 8px; overflow: hidden;
  background: var(--line); margin-bottom: 16px;
}
.completion-bar > div {
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; color: #fff; font-weight: 600; padding: 0 6px;
  min-width: 0; overflow: hidden; white-space: nowrap;
}
.completion-bar .c-done { background: var(--good); }
.completion-bar .c-done-late { background: #5acd5a; }
.completion-bar .c-partial { background: var(--warn); }
.completion-bar .c-undone { background: var(--danger); }
.completion-bar .c-undone-force { background: #ff6b62; }
.completion-bar .c-unreviewed { background: var(--mute); }

.completion-legend {
  display: flex; flex-wrap: wrap; gap: 12px; margin-top: 8px;
  font-size: 11px; color: var(--fg2);
}
.completion-legend span::before {
  content: '● '; font-size: 14px; vertical-align: middle;
}
.completion-legend .l-done::before { color: var(--good); }
.completion-legend .l-done-late::before { color: #5acd5a; }
.completion-legend .l-partial::before { color: var(--warn); }
.completion-legend .l-undone::before { color: var(--danger); }
.completion-legend .l-undone-force::before { color: #ff6b62; }
.completion-legend .l-unreviewed::before { color: var(--mute); }

/* 跨域对比清单 */
.cross-list { display: grid; gap: 8px; }
.cross-item {
  display: flex; gap: 12px; padding: 10px 12px;
  background: var(--soft); border-radius: 8px; font-size: 13px;
  align-items: baseline; min-height: 44px;
}
.cross-item.overrun-high { background: rgba(255,59,48,0.08); }
.cross-item.overrun-medium { background: rgba(255,149,0,0.08); }
.cross-item .title { flex: 1; font-weight: 500; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cross-item .meta { font-size: 11px; color: var(--fg2); font-variant-numeric: tabular-nums; }

/* AI 洞察 */
.ai-section { background: linear-gradient(180deg, #fff5e0 0%, #fffbf0 100%); border: 1px solid #ffd9a8; border-radius: 16px; padding: 16px 20px; margin-bottom: 16px; }
.ai-section h2 { color: #a25b00; }
.ai-anomaly, .ai-suggestion {
  background: var(--card); border-radius: 8px; padding: 10px 14px;
  margin-bottom: 6px; font-size: 13px;
  border-left: 3px solid var(--warn);
}
.ai-anomaly.high { border-left-color: var(--danger); }
.ai-anomaly.medium { border-left-color: var(--warn); }

/* 复制 prompt 按钮(单工铁律) */
.copy-prompt-zone {
  background: linear-gradient(180deg, #f0f4ff 0%, #fff 100%);
  border: 2px solid var(--blue); border-radius: 14px;
  padding: 18px 20px; margin: 20px 0;
}
.copy-prompt-zone h3 { font-size: 15px; font-weight: 700; color: var(--fg); margin-bottom: 10px; }
.copy-preview {
  background: #fff; border: 1px dashed var(--line); border-radius: 8px;
  padding: 10px 12px; font-size: 11.5px; color: var(--fg2);
  font-family: ui-monospace, "SF Mono", Menlo, monospace;
  line-height: 1.55; max-height: 120px; overflow: auto;
  white-space: pre-wrap; word-break: break-word; margin: 0 0 10px;
}
.copy-prompt-btn {
  background: var(--blue); color: #fff; border: none;
  padding: 12px 20px; border-radius: 10px;
  font-size: 13px; font-weight: 600; cursor: pointer;
  font-family: inherit; white-space: nowrap;
  min-height: 44px; transition: background .15s, transform .1s;
}
.copy-prompt-btn:hover { background: #0a63ce; }
.copy-prompt-btn:active { transform: scale(0.97); }
.copy-prompt-btn.copied { background: var(--good); }
.copy-prompt-btn.failed { background: var(--danger); }

/* Toast(总纲 §04 原则 4 · 5 状态 fallback 友好提示) */
.toast {
  position: fixed; left: 50%; bottom: 32px;
  transform: translateX(-50%) scale(0.9); opacity: 0;
  background: rgba(28,28,30,0.94);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  backdrop-filter: blur(20px) saturate(180%);
  color: #f0f0f0; border-radius: 14px;
  padding: 13px 14px 13px 16px; max-width: 480px; min-width: 320px;
  box-shadow: 0 10px 32px rgba(0,0,0,0.32);
  display: flex; align-items: flex-start; gap: 12px;
  pointer-events: none;
  transition: opacity 0.22s ease-out, transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
  z-index: 9999;
}
.toast.show { opacity: 1; transform: translateX(-50%) scale(1); pointer-events: auto; }

/* Footer */
.footer { margin-top: 32px; text-align: center; color: var(--fg3); font-size: 11px; line-height: 1.6; }
.footer code {
  font-family: ui-monospace, "SF Mono", Menlo, monospace;
  font-size: 11px; color: var(--fg2);
  background: var(--soft); padding: 1px 6px; border-radius: 4px;
}

/* === 移动端 / 平板适配 === */
@media (max-width: 768px) {
  .cards-4 { grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .card-stat { padding: 14px 16px; }
  .card-stat .value { font-size: 24px; }
  .cat-grid { grid-template-columns: 1fr; }
  .wrap { padding: 20px 12px 60px; }
  .hero { padding: 20px 18px; border-radius: 18px; }
  .hero h1 { font-size: 22px; }
  .segment { padding: 16px 18px; }
  .copy-prompt-zone { padding: 14px 16px; }
}
@media (max-width: 480px) {
  .cards-4 { grid-template-columns: 1fr 1fr; }
  .card-stat .value { font-size: 20px; }
  .hero .meta { flex-direction: column; gap: 4px; }
}
@media (max-width: 360px) {
  .cards-4 { grid-template-columns: 1fr; }
  .card-stat { padding: 12px 14px; }
  .card-stat .value { font-size: 22px; }
  .hero h1 { font-size: 20px; }
  .copy-prompt-btn { width: 100%; }
}
</style>
</head>
<body>
<div class="wrap">
<div class="offline-banner" id="offline-banner" style="display:none">📡 网络不可用 · 本页面仍可查看离线数据</div>

<header class="hero">
  <div class="eyebrow">区间复盘</div>
  <h1 id="page-title">…</h1>
  <p class="lead" id="page-subtitle">加载中…</p>
  <div class="meta">
    <span id="page-meta">由作息管家 · schedule_cli render-replay 生成</span>
    <span class="status-badge" id="status-badge" style="display:none">—</span>
  </div>
</header>

<!-- 4 卡总览 -->
<div class="cards-4" id="cards-overview"></div>

<!-- 4 段叙事容器 -->
<div id="segments-container"></div>

<!-- 复制 prompt 4 部分结构(单工铁律) -->
<div class="copy-prompt-zone" id="copy-prompt-zone">
  <h3>📋 复制 4 部分 prompt 给 AI</h3>
  <pre class="copy-preview" id="copy-preview"></pre>
  <button class="copy-prompt-btn" id="copy-prompt-btn" type="button">复制完整 prompt</button>
</div>

<div class="footer">
  数据源:<code>schedule_records</code> + <code>schedule_plans</code> · 模板:<code>{{ template_name }}</code> · 输出:<code>SKILLS_DB_PATH/schedule_html/replay/</code>
</div>
</div>

<!-- Toast(5 状态 fallback 友好提示) -->
<div id="toast" class="toast" role="status" aria-live="polite">
  <div class="toast-icon">📋</div>
  <div class="toast-body">
    <div class="toast-title">已复制 prompt</div>
    <div class="toast-detail">粘贴给 AI(微信/飞书/任何 AI 工具),复盘跨域分析会基于此上下文给出洞察</div>
  </div>
</div>

<script id="payload" type="application/json"></script>
<script>
/* === Phase E · schedule_replay.html · T08 完整渲染(4 卡 + 4 段叙事 + 复制 prompt)=== */
(function(){
  "use strict";
  function safeJSON(s){ try { return JSON.parse(s); } catch(e){ return null; } }
  function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; });
  }
  function fmtMin(m){ if (!m) return "0m"; var h = Math.floor(m / 60), mn = m % 60; return h > 0 ? h + "h" + (mn > 0 ? mn + "m" : "") : mn + "m"; }

  // === 1. 读 payload + hero ===
  var raw = document.getElementById("payload");
  if (!raw) return;
  var payload = safeJSON(raw.textContent || "");
  if (!payload || !payload.data || !payload.data.meta) {
    document.getElementById("page-title").textContent = "数据加载失败";
    return;
  }
  var d = payload.data;
  var meta = d.meta;
  document.getElementById("page-title").textContent = meta.title || ("区间复盘 · " + meta.start + " ~ " + meta.end);
  document.getElementById("page-subtitle").textContent = meta.subtitle || (meta.days + " 天 · " + meta.total_records + " 条记录");

  // === 2. 状态徽章(5 状态 fallback)===
  var badge = meta.status_badge || "✅ ok";
  var badgeEl = document.getElementById("status-badge");
  badgeEl.textContent = badge;
  badgeEl.style.display = "inline-block";
  if (badge.indexOf("ok") >= 0) badgeEl.className = "status-badge good";
  else if (badge.indexOf("empty") >= 0) badgeEl.className = "status-badge empty";
  else if (badge.indexOf("incomplete") >= 0) badgeEl.className = "status-badge warn";
  else if (badge.indexOf("error") >= 0) badgeEl.className = "status-badge error";
  else badgeEl.className = "status-badge";

  // offline 横幅
  if (badge.indexOf("offline") >= 0) {
    document.getElementById("offline-banner").style.display = "block";
  }

  // === 3. 4 卡总览 ===
  var totalHours = Math.round(meta.total_minutes / 60);
  var completionRate = (d.plan_aggregate && d.plan_aggregate.completion_rate != null) ? Math.round(d.plan_aggregate.completion_rate * 100) : 0;
  // 健康分代理:维持(睡眠/用餐等)占总时长比例,50% 满分配
  var dimTotals = (d.record_aggregate && d.record_aggregate.dim_totals) || {};
  var dimSum = 0; var maintainSum = 0;
  for (var k in dimTotals) { if (dimTotals.hasOwnProperty(k)) { dimSum += dimTotals[k] || 0; if (k === "维持") maintainSum += dimTotals[k] || 0; } }
  var healthScore = dimSum > 0 ? Math.round(maintainSum / dimSum * 100) : 0;
  var cards = [
    { label: "总时长", value: fmtMin(meta.total_minutes), delta: totalHours + " 小时" },
    { label: "记录数", value: meta.total_records + " 条", delta: meta.days + " 天" },
    { label: "完成率", value: completionRate + "%", delta: d.plan_aggregate && d.plan_aggregate.incomplete ? "⚠️ 数据不全" : "按时完成", variant: completionRate >= 80 ? "good" : (completionRate >= 50 ? "warn" : "danger") },
    { label: "健康分", value: healthScore + "%", delta: "维持(睡眠)占比 · T08 代理", variant: healthScore >= 35 ? "good" : (healthScore >= 25 ? "warn" : "mute") },
  ];
  var cardsHtml = "";
  for (var i = 0; i < cards.length; i++) {
    var c = cards[i];
    cardsHtml += '<div class="card-stat ' + (c.variant || "") + '">' +
                 '<div class="label">' + esc(c.label) + '</div>' +
                 '<div class="value">' + esc(c.value) + '</div>' +
                 '<div class="delta">' + esc(c.delta) + '</div>' +
                 '</div>';
  }
  document.getElementById("cards-overview").innerHTML = cardsHtml;

  // === 4. 4 段叙事渲染 ===
  var segsHtml = "";

  // 4.1 record_aggregate
  var ra = d.record_aggregate || {};
  var incompleteRa = !!ra.incomplete;
  segsHtml += '<section class="segment" id="seg-record">' +
              '<h2><span class="icon">📊</span>实际作息' +
              (incompleteRa ? '<span class="incomplete-mark">⚠️ 记录域 incomplete</span>' : '') +
              '</h2>';
  if (incompleteRa) {
    segsHtml += '<p style="color:var(--warn);font-size:13px">⚠️ 此区间只有计划无作息记录,记录域无数据。</p>';
  } else if ((ra.summary_items || []).length > 0) {
    // Top-N 折叠
    var items = ra.summary_items;
    var visible = ra.top_n_visible || 10;
    var gridHtml = '<div class="cat-grid">';
    for (var i = 0; i < items.length; i++) {
      var it = items[i];
      var cls = i >= visible ? "cat-row hidden" : "cat-row";
      gridHtml += '<div class="' + cls + '" data-idx="' + i + '">' +
                  '<span class="emoji">' + esc(it.emoji) + '</span>' +
                  '<div style="flex:1;min-width:0">' +
                    '<div style="display:flex;justify-content:space-between"><span class="name">' + esc(it.category) + '</span><span class="dur">' + esc(it.duration_text) + '</span></div>' +
                    '<div class="bar"><div class="bar-fill" style="width:' + Math.min(100, it.pct || 0) + '%;background:' + esc(it.color || '#999') + '"></div></div>' +
                  '</div>' +
                  '</div>';
    }
    gridHtml += '</div>';
    if (items.length > visible) {
      gridHtml += '<button class="expand-btn" id="expand-cat-rows" type="button">展开全部 ' + items.length + ' 个分类</button>';
    }
    segsHtml += gridHtml;
  } else {
    segsHtml += '<p style="color:var(--fg3);font-size:13px">📭 此区间无作息记录</p>';
  }
  segsHtml += '</section>';

  // 4.2 plan_aggregate
  var pa = d.plan_aggregate || {};
  var incompletePa = !!pa.incomplete;
  segsHtml += '<section class="segment" id="seg-plan">' +
              '<h2><span class="icon">📅</span>计划执行' +
              (incompletePa ? '<span class="incomplete-mark">⚠️ 计划域 incomplete</span>' : '') +
              '</h2>';
  if (incompletePa) {
    segsHtml += '<p style="color:var(--warn);font-size:13px">⚠️ 此区间只有作息无计划事件,计划域无数据。</p>';
  } else {
    var dist = pa.completion_distribution || {};
    var totalP = (dist["已完成"] || 0) + (dist["已完成(超时)"] || 0) + (dist["部分完成"] || 0) + (dist["未完成"] || 0) + (dist["未完成(不可抗力)"] || 0) + (dist["未复盘"] || 0);
    if (totalP > 0) {
      var barHtml = '<div class="completion-bar">';
      var segs = [["已完成","c-done"],["已完成(超时)","c-done-late"],["部分完成","c-partial"],["未完成","c-undone"],["未完成(不可抗力)","c-undone-force"],["未复盘","c-unreviewed"]];
      for (var i = 0; i < segs.length; i++) {
        var k = segs[i][0], cls = segs[i][1];
        var v = dist[k] || 0;
        if (v > 0) barHtml += '<div class="' + cls + '" style="width:' + (v / totalP * 100) + '%">' + v + '</div>';
      }
      barHtml += '</div>';
      var legendHtml = '<div class="completion-legend">';
      for (var i = 0; i < segs.length; i++) {
        var k = segs[i][0], cls = segs[i][1];
        legendHtml += '<span class="l-' + cls.replace("c-", "") + '">' + k + ': ' + (dist[k] || 0) + '</span>';
      }
      legendHtml += '</div>';
      segsHtml += barHtml + legendHtml;
    } else {
      segsHtml += '<p style="color:var(--fg3);font-size:13px">📭 此区间无计划事件</p>';
    }
  }
  segsHtml += '</section>';

  // 4.3 cross_domain
  var cd = d.cross_domain || {};
  segsHtml += '<section class="segment" id="seg-cross">' +
              '<h2><span class="icon">🔀</span>跨域对比</h2>';
  var hasCross = (cd.planned_actual_pairs || []).length > 0 || (cd.unexecuted_plans || []).length > 0 ||
                 (cd.unexpected_records || []).length > 0 || (cd.overrun_plans || []).length > 0;
  if (!hasCross) {
    segsHtml += '<p style="color:var(--fg3);font-size:13px">📭 此区间无跨域对比数据</p>';
  } else {
    var listHtml = '<div class="cross-list">';
    (cd.planned_actual_pairs || []).forEach(function(p){
      listHtml += '<div class="cross-item"><span class="title">📋 ' + esc(p.title) + '</span><span class="meta">计划 ' + p.plan_duration_minutes + 'min / 实际 ' + p.actual_duration_minutes + 'min (Δ ' + (p.delta_minutes >= 0 ? '+' : '') + p.delta_minutes + ')</span></div>';
    });
    (cd.unexecuted_plans || []).forEach(function(p){
      listHtml += '<div class="cross-item"><span class="title">⚠️ 未执行:' + esc(p.title) + '</span><span class="meta">' + esc(p.time_start) + '-' + esc(p.time_end) + ' · ' + esc(p.completion) + '</span></div>';
    });
    (cd.unexpected_records || []).forEach(function(r){
      listHtml += '<div class="cross-item"><span class="title">🆕 意外:' + esc(r.activity) + '</span><span class="meta">' + esc(r.time_start) + '-' + esc(r.time_end) + ' · ' + esc(r.category) + '</span></div>';
    });
    (cd.overrun_plans || []).forEach(function(o){
      var sev = o.severity === "high" ? "overrun-high" : "overrun-medium";
      listHtml += '<div class="cross-item ' + sev + '"><span class="title">⏰ 超时:' + esc(o.title) + '</span><span class="meta">' + o.plan_duration_minutes + 'min / ' + o.actual_duration_minutes + 'min (' + o.ratio + 'x)</span></div>';
    });
    listHtml += '</div>';
    segsHtml += listHtml;
  }
  segsHtml += '</section>';

  // 4.4 ai_insights
  var ai = d.ai_insights || {};
  segsHtml += '<section class="ai-section" id="seg-ai"><h2><span class="icon">🤖</span>AI 洞察(mock)</h2>';
  var anomalies = ai.anomalies || [];
  var suggestions = ai.suggestions || [];
  if (anomalies.length === 0 && suggestions.length === 0) {
    segsHtml += '<p style="color:var(--fg2);font-size:13px">📊 区间数据平稳,无显著异常</p>';
  } else {
    anomalies.forEach(function(a){
      segsHtml += '<div class="ai-anomaly ' + esc(a.severity) + '">' +
                  '<b>' + esc(a.category) + '</b> · ' +
                  'baseline ' + a.baseline_value + 'min → current ' + a.current_value + 'min ' +
                  '(ratio ' + a.ratio + ', ' + a.severity + ')' +
                  '</div>';
    });
    suggestions.forEach(function(s){
      segsHtml += '<div class="ai-suggestion">💡 ' + esc(s.text) + '</div>';
    });
  }
  segsHtml += '</section>';

  document.getElementById("segments-container").innerHTML = segsHtml;

  // 5. Top-N 折叠按钮绑定(如果存在)
  var expandBtn = document.getElementById("expand-cat-rows");
  if (expandBtn) {
    expandBtn.addEventListener("click", function(){
      var hidden = document.querySelectorAll(".cat-row.hidden");
      for (var i = 0; i < hidden.length; i++) hidden[i].classList.remove("hidden");
      expandBtn.style.display = "none";
    });
  }

  // === 6. 复制 prompt 按钮(总纲 §04 原则 10)===
  var previewEl = document.getElementById("copy-preview");
  var btnEl = document.getElementById("copy-prompt-btn");
  if (previewEl && d.copy_prompt) {
    var text = String(d.copy_prompt);
    var cap = 200;
    previewEl.textContent = text.length > cap ? text.substring(0, cap) + "…" : text;
  }
  if (btnEl) {
    btnEl.addEventListener("click", function(){
      var text = d.copy_prompt || "";
      var done = function(){
        btnEl.textContent = "✓ 已复制";
        btnEl.classList.add("copied");
        setTimeout(function(){
          btnEl.textContent = "复制完整 prompt";
          btnEl.classList.remove("copied");
        }, 2200);
        // Toast 提示
        var toast = document.getElementById("toast");
        if (toast) {
          toast.classList.add("show");
          setTimeout(function(){ toast.classList.remove("show"); }, 4500);
        }
      };
      var fail = function(){
        btnEl.textContent = "✗ 复制失败";
        btnEl.classList.add("failed");
        setTimeout(function(){
          btnEl.textContent = "复制完整 prompt";
          btnEl.classList.remove("failed");
        }, 2200);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done).catch(function(){
          // fallback 到 execCommand
          var ta = document.createElement("textarea");
          ta.value = text; ta.style.cssText = "position:fixed;top:0;left:-9999px;opacity:0";
          document.body.appendChild(ta); ta.select();
          try { document.execCommand("copy"); done(); } catch(e) { fail(); }
          document.body.removeChild(ta);
        });
      } else {
        var ta = document.createElement("textarea");
        ta.value = text; ta.style.cssText = "position:fixed;top:0;left:-9999px;opacity:0";
        document.body.appendChild(ta); ta.select();
        try { document.execCommand("copy"); done(); } catch(e) { fail(); }
        document.body.removeChild(ta);
      }
    });
  }
})();
</script>
</body>
</html>
