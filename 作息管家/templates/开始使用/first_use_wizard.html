<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>首次使用 · {{ title }}</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--fg:#1d1d1f;--fg2:#6e6e73;--fg3:#86868b;--bg:#f5f5f7;--card:#fff;--line:#d2d2d7;--blue:#007aff;--green:#34c759;--orange:#ff9500;--red:#ff3b30;--soft:#f5f8ff;--shadow:0 1px 2px rgba(0,0,0,.04),0 12px 36px rgba(0,0,0,.06)}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--fg);line-height:1.65;-webkit-font-smoothing:antialiased}
.wrap{max-width:980px;margin:0 auto;padding:56px 22px 90px}
.hero{background:linear-gradient(180deg,#fff,#f8fbff);border-radius:28px;padding:34px;box-shadow:var(--shadow);margin-bottom:18px}
.eyebrow{color:var(--blue);font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px}
h1{font-size:34px;letter-spacing:-.035em;line-height:1.12;margin-bottom:10px}
.lead{color:var(--fg2);font-size:16px;max-width:760px}
.stage-chip{display:inline-block;margin-top:12px;padding:5px 14px;border-radius:999px;font-size:12.5px;font-weight:700;background:#eaf2ff;color:var(--blue);border:1px solid #cfe0ff}
.stage-chip.warn{background:#fff4e6;color:#b26a00;border:1px solid #ffe0b3}
.stage-chip.ok{background:#e9f8ef;color:#1d7a3f;border:1px solid #c6ecd5}
.stage-chip.fail{background:#ffecec;color:#c22e2e;border:1px solid #ffd0d0}
section{background:var(--card);border-radius:20px;padding:22px;box-shadow:0 1px 3px rgba(0,0,0,.04);margin:18px 0}
h2{font-size:20px;letter-spacing:-.02em;margin-bottom:12px}
h3{font-size:15px;margin:14px 0 8px;color:var(--fg2)}
.row{display:grid;grid-template-columns:160px 1fr;gap:12px;padding:10px 0;border-bottom:1px solid #ececf1}.row:last-child{border-bottom:none}.k{color:var(--fg2)}.v{font-weight:600;word-break:break-word}
.pill{display:inline-block;border:1px solid var(--line);background:#fbfbfd;border-radius:999px;padding:4px 10px;margin:3px;font-size:13px}
.pill.warn{border-color:#ffe0b3;background:#fff4e6;color:#b26a00}
.pill.fail{border-color:#ffd0d0;background:#ffecec;color:#c22e2e}
.ok{color:var(--green)}.warn{color:var(--orange)}.bad{color:var(--red)}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 6px}
.step{flex:1;min-width:96px;background:#f2f4f8;border-radius:12px;padding:10px 8px;text-align:center;font-size:12.5px;color:var(--fg2)}
.step b{display:block;font-size:15px;margin-bottom:2px}
.step.done{background:#e9f8ef;color:#1d7a3f}.step.done b{color:var(--green)}
.step.cur{background:var(--soft);border:1.5px solid var(--blue);color:var(--blue)}
.step.fail{background:#ffecec;color:#c22e2e}
.cmd{background:#1d1d1f;color:#f5f5f7;border-radius:16px;padding:16px;overflow:auto;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;line-height:1.6;white-space:pre-wrap;word-break:break-all}
.copy{border:none;background:var(--blue);color:#fff;border-radius:999px;padding:10px 16px;font-weight:700;cursor:pointer;margin:10px 8px 0 0;font-size:14px}
.copy.alt{background:#1d1d1f}.copy.ghost{background:#fff;color:var(--blue);border:1.5px solid var(--blue)}
.copy.copied{background:var(--green)}
.actions{margin-top:14px;display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
.env-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:16px 0}
.env-card{background:#fafbfd;border-radius:14px;padding:14px}
.env-card b{display:block;font-size:12.5px;color:var(--fg2);margin-bottom:6px}
.env-card span{font-size:13.5px;font-weight:650;word-break:break-word}
.empty{color:var(--fg3)}
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(120px);background:#1d1d1f;color:#fff;border-radius:999px;padding:11px 22px;font-size:14px;font-weight:600;transition:.3s;z-index:99;box-shadow:0 8px 30px rgba(0,0,0,.25)}
.toast.show{transform:translateX(-50%) translateY(0)}
@media(max-width:820px){.wrap{padding:30px 14px 70px}.hero{padding:26px 20px}h1{font-size:26px}.row{grid-template-columns:1fr}.env-grid{grid-template-columns:1fr}.step{min-width:100%}}
</style>
</head>
<body>
<div class="wrap">
<header class="hero">
<div class="eyebrow">Setup · 初始化工作流 · 唤醒词「首次使用」</div>
<h1 id="title">作息管家 · 首次使用</h1>
<p class="lead" id="lead">6 步向导完成初始化:环境检测 → 路径确认 → 建库 → 状态确认 → 初始化报告 → 完成。默认即确认,想改可改;幂等可重试,已有库不重置。</p>
<div id="stagechip"></div>
</header>
<div id="app"></div>
</div>
<script id="payload" type="application/json"><!--INJECT-DATA--></script>
<div class="toast" id="toast"></div>
<script>
var toastTimer=null;
function toastText(t){var el=document.getElementById('toast');el.textContent=t;el.classList.add('show');if(toastTimer)clearTimeout(toastTimer);toastTimer=setTimeout(function(){el.classList.remove('show')},3000);}
function esc(s){if(s===null||s===undefined)return '';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function arr(x){return Object.prototype.toString.call(x)==='[object Array]'?x:(x?[x]:[])}
function fallbackCopy(text){try{var ta=document.createElement('textarea');ta.value=text;ta.style.cssText='position:fixed;left:-9999px;top:0';document.body.appendChild(ta);ta.focus();ta.select();var ok=false;try{ok=document.execCommand('copy')}catch(e){ok=false}document.body.removeChild(ta);return ok}catch(e){return false}}
function safeWriteText(text){if(navigator.clipboard&&navigator.clipboard.writeText){return navigator.clipboard.writeText(text).then(function(){return true}).catch(function(){return fallbackCopy(text)})}return Promise.resolve(fallbackCopy(text))}
function flashBtn(btn,msg,ms){var old=btn.textContent;btn.textContent=msg;btn.classList.add('copied');setTimeout(function(){btn.textContent=old;btn.classList.remove('copied')},ms||1800)}
function copyBtn(label,text,cls){return '<button class="copy '+(cls||'')+'" onclick="safeWriteText(this.dataset.p).then(function(ok){flashBtn(this,ok?\'✓ 已复制\':\'✗ 复制失败\',2000)}.bind(this))" data-p="'+esc(text)+'">'+esc(label)+'</button>'}
var app=document.getElementById('app');
var STAGE_TITLES={need_path:'待确认路径',need_init:'待建库',already:'已初始化',done:'完成',error:'异常'};
function render(){
var payload;try{payload=JSON.parse(document.getElementById('payload').textContent)}catch(e){app.innerHTML='<section><h2 class="bad">数据解析失败</h2></section>';return}
var d=payload.data||{}, s=d.scene||{}, m=d.meta||{}, cd=d.copy_data||{}, cl=d.copy_log||{}, err=d.error||{};
document.getElementById('title').textContent='作息管家 · '+(err.title||'首次使用');
var wiz=s.wizard||{}, stage=wiz.stage||'error', env=s.env||{}, init=s.init||{}, feishu=s.feishu||{};
var next=s.next||{}, extra=arr(s.next_extra);
var steps=arr(wiz.steps);
var stageTitle=(err.title||'首次使用')+' · '+(STAGE_TITLES[stage]||stage);
var chip=document.getElementById('stagechip');
if(stage==='already'||stage==='done'){chip.innerHTML='<span class="stage-chip ok">✅ '+esc(stageTitle)+'</span>';}
else if(stage==='error'){chip.innerHTML='<span class="stage-chip fail">✗ '+esc(stageTitle)+'</span>';}
else{chip.innerHTML='<span class="stage-chip warn">⏳ '+esc(stageTitle)+'</span>';}
var stepsHtml=steps.length?('<div class="steps">'+steps.map(function(st,i){
  var cls='step';
  if(st.status==='done')cls+=' done';
  else if(st.status==='current')cls+=' cur';
  else if(st.status==='fail')cls+=' fail';
  return '<div class="'+cls+'"><b>'+(i+1)+'</b>'+esc(st.title)+'</div>';
}).join('')+'</div>'):'';
var hint='';
if(stage==='need_path'||stage==='need_init'){hint='<section><h2>下一步动作</h2><p class="warn" style="font-weight:650">请确认数据保存路径(预填为建议值,默认即确认,想改可改)。确认后点击「开始初始化」,AI 将执行建库(幂等)。</p></section>';}
else if(stage==='already'||stage==='done'){hint='<section><h2>状态</h2><p class="ok" style="font-weight:650">✅ 环境已就绪,数据库已初始化,可以开始使用了。</p><p class="warn" style="margin-top:8px">💡 顺路提醒:说「作息管家 help」可浏览全部功能;说「记录」记第一条作息。</p></section>';}
else if(stage==='error'){hint='<section><h2>状态</h2><p class="bad" style="font-weight:650">❌ 初始化未完成,请按下方指引修正后重试。</p></section>';}
var envHtml=env.os?('<section><h2>环境信息</h2><div class="env-grid">'
  +'<div class="env-card"><b>操作系统</b><span>'+esc(env.os)+'</span></div>'
  +'<div class="env-card"><b>Python</b><span>'+esc(env.python)+'</span></div>'
  +'<div class="env-card"><b>数据目录</b><span>'+esc(env.db_dir)+'</span></div>'
  +'<div class="env-card"><b>目录可写</b><span class="'+(env.db_dir_writable?'ok':'bad')+'">'+(env.db_dir_writable?'✓ 可写':'✗ 不可写')+'</span></div>'
  +'<div class="env-card"><b>数据库状态</b><span class="'+(env.db_ready?'ok':'warn')+'">'+(env.db_ready?'✓ 已建('+esc(String(env.db_tables))+' 表)':'✗ 未建('+esc(String(env.db_tables))+'/'+esc(String(4))+' 表)')+'</span></div>'
  +'<div class="env-card"><b>SKILLS_DB_PATH</b><span>'+esc(env.env_skills_db_path)+'</span></div>'
  +'</div></section>'):'';
var badgeMap={'ok':'<span class="ok">✓</span>','warn':'<span class="warn">!</span>','err':'<span class="bad">✗</span>','fail':'<span class="bad">✗</span>','skip':'<span class="warn">◐</span>'};
var itemsHtml=(function(){
  var items=d.items||[];
  if(!items.length)return '';
  return '<section><h2>检查项</h2>'+items.map(function(it){
    return '<div class="row"><span class="k">'+(badgeMap[it.status]||'')+' '+esc(it.name)+'</span><span class="v">'+esc(it.desc||'')+(it.action?' <span class="pill '+(it.status==='fail'?'fail':it.status==='warn'?'warn':'')+'">'+esc(it.action)+'</span>':'')+'</span></div>';
  }).join('')+'</section>';
})();
var initHtml=(function(){
  var rows=[];
  if(init.db_path)rows.push(['数据库位置',init.db_path]);
  if(init.db_status)rows.push(['数据库状态',init.db_status]);
  if(init.tables)rows.push(['数据表',init.tables]);
  if(init.whitelist)rows.push(['分类白名单',init.whitelist]);
  if(init.feishu)rows.push(['飞书联动',init.feishu]);
  if(!rows.length)return '';
  return '<section><h2>初始化结果</h2>'+rows.map(function(r){
    return '<div class="row"><span class="k">'+esc(r[0])+'</span><span class="v">'+esc(r[1])+'</span></div>';
  }).join('')+'</section>';
})();
var feishuHtml='';
if(feishu&&feishu.full!==true){
  feishuHtml='<section><h2>飞书联动(强烈建议配置)</h2>'
    +'<p style="margin-bottom:10px">'+esc(feishu.recommended||'')+'</p>'
    +'<h3>安装步骤(装好后说「配置飞书」走非阻塞授权)</h3>'
    +(arr(feishu.install_cmds).map(function(c){return '<div class="cmd" style="margin-bottom:10px">'+esc(c)+'</div>'+copyBtn('复制该命令',c,'alt')}).join(''))
    +(feishu.auth_note?'<p class="warn" style="margin-top:10px">'+esc(feishu.auth_note)+'</p>':'')
    +'</section>';
}
var todosHtml=(function(){
  var todos=d.todos||[];
  if(!todos.length)return '';
  return '<section><h2>待办指引</h2>'+todos.map(function(t){
    return '<div class="row"><span class="k">'+esc(t.title)+'</span><span class="v">'+esc(arr(t.steps).join(' → '))+'</span></div>';
  }).join('')+'</section>';
})();
var verifyHtml=(function(){
  var v=d.verify||[];
  if(!v.length)return '';
  return '<section><h2>完成验证清单(用户可勾选)</h2>'+v.map(function(it){
    if(it&&typeof it==='object'&&it.text!==undefined){
      var st=it.status||'';
      var badge=st==='ok'?'<span class="ok">✓</span>':(st==='fail'?'<span class="bad">✗</span>':(st==='warn'||st==='skip')?'<span class="warn">◐</span>':'');
      return '<div class="row"><span class="k">'+badge+' '+esc(it.text)+'</span></div>';
    }
    return '<div class="row"><span class="k">□ '+esc(it)+'</span></div>';
  }).join('')+'</section>';
})();
var errHtml=err.title?('<section><h2 class="bad">'+esc(err.title)+'</h2><p>'+esc(err.desc||'')+'</p>'+(err.cmd?'<div class="cmd">'+esc(err.cmd)+'</div>':'')+'</section>'):'';
var nextBtns='';
if(next.prompt){nextBtns+=copyBtn(next.label||'下一步',next.prompt);}
extra.forEach(function(x){if(x&&x.prompt)nextBtns+=copyBtn(x.label||'下一步',x.prompt,'ghost');});
var copyDataBtn=cd.text?copyBtn(cd.label||'复制数据',cd.text,'alt'):'';
var copyLogBtn=cl.text?copyBtn(cl.label||'复制日志',cl.text,'ghost'):'';
app.innerHTML=stepsHtml+hint+envHtml+itemsHtml+initHtml+feishuHtml+todosHtml+verifyHtml+errHtml
+'<section><h2>下一步</h2><div class="actions">'+nextBtns+copyDataBtn+copyLogBtn+'</div></section>';
}
render();
</script>
</body>
</html>
