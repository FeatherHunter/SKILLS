<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>作息管家 · 唤醒词速查台</title>
<style>
  *,*::before,*::after { box-sizing: border-box; }
  * { margin: 0; padding: 0; }
  :root {
    /* Apple 风设计令牌(对照 _assets/style.css) */
    --fg: #1d1d1f;
    --fg2: #6e6e73;
    --fg3: #86868b;
    --bg: #fbfbfd;
    --card: #ffffff;
    --line: #d2d2d7;
    --soft: #f5f5f7;
    --blue: #007aff;
    --blue2: #0a63ce;
    --green: #34c759;
    --orange: #ff9500;
    --red: #ff3b30;
    --shadow-sm: 0 1px 2px rgba(0,0,0,.04);
    --shadow-md: 0 2px 8px rgba(0,0,0,.06);
    --r-md: 12px;
    --r-lg: 16px;
    --r-xl: 20px;
  }
  html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
  body {
    background: var(--bg); color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Microsoft YaHei", "Apple Color Emoji", "Segoe UI Emoji", sans-serif;
    font-size: 15px; line-height: 1.55; -webkit-font-smoothing: antialiased;
    letter-spacing: -.01em;
    min-height: 100vh; padding-bottom: 60px;
  }
  .wrap { max-width: 880px; margin: 0 auto; padding: 0 20px; }

  /* ===== HERO ===== */
  .hero {
    background: linear-gradient(180deg, #ffffff 0%, var(--bg) 100%);
    border-bottom: 1px solid var(--line);
    padding: 56px 0 40px;
  }
  .hero h1 {
    font-size: 40px; font-weight: 700; letter-spacing: -.025em;
    line-height: 1.1; color: var(--fg);
    margin-bottom: 8px;
  }
  .hero .sub {
    color: var(--fg2); font-size: 17px; font-weight: 400;
    letter-spacing: -.01em;
    margin-bottom: 20px;
  }
  .hero .stats {
    display: flex; gap: 24px; flex-wrap: wrap;
    font-size: 13px; color: var(--fg3);
  }
  .hero .stats b {
    color: var(--fg); font-weight: 600;
    font-variant-numeric: tabular-nums;
    margin-right: 4px;
  }

  /* ===== 工具栏(搜索 + 折叠控制)===== */
  .toolbar {
    position: sticky; top: 0; z-index: 20;
    background: rgba(251, 251, 253, 0.85);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    backdrop-filter: saturate(180%) blur(20px);
    padding: 12px 0; margin: 0 -20px 24px;
    padding-left: 20px; padding-right: 20px;
    border-bottom: 1px solid var(--line);
  }
  .toolbar-row {
    display: flex; gap: 8px; align-items: center;
  }
  .toolbar input {
    flex: 1; padding: 10px 14px;
    border: 1px solid var(--line); border-radius: var(--r-md);
    background: var(--card); font-size: 14px; color: var(--fg);
    font-family: inherit; outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  .toolbar input::placeholder { color: var(--fg3); }
  .toolbar input:focus {
    border-color: var(--blue);
    box-shadow: 0 0 0 4px rgba(0, 122, 255, 0.12);
  }
  .toolbar button {
    padding: 9px 14px; border: 1px solid var(--line); background: var(--card);
    border-radius: var(--r-md); font-size: 13px;
    color: var(--fg); font-weight: 500; font-family: inherit;
    cursor: pointer; transition: all .15s;
    white-space: nowrap;
  }
  .toolbar button:hover {
    background: var(--soft); border-color: var(--fg3);
  }
  .toolbar button:active {
    background: #e8e8ed; transform: scale(.97);
  }

  /* ===== L1 模块(大卡片)===== */
  .cat-block {
    margin-bottom: 16px;
    background: var(--card);
    border-radius: var(--r-xl);
    box-shadow: var(--shadow-md);
    overflow: hidden;
  }
  .cat-block > summary {
    list-style: none; cursor: pointer; user-select: none;
    padding: 24px 28px;
    display: flex; align-items: center; gap: 16px;
    transition: background .15s;
  }
  .cat-block > summary:hover { background: rgba(0,0,0,.02); }
  .cat-block > summary::-webkit-details-marker,
  .cat-block > summary::marker { display: none; }
  .cat-block > summary::before {
    content: '›';
    font-size: 22px; font-weight: 300; color: var(--fg3);
    width: 16px; text-align: center;
    transition: transform .25s, color .15s;
    line-height: 1;
  }
  .cat-block[open] > summary::before {
    transform: rotate(90deg);
    color: var(--blue);
  }
  .cat-block > summary > * { pointer-events: none; }
  .cat-icon {
    font-size: 28px; width: 48px; height: 48px;
    display: flex; align-items: center; justify-content: center;
    background: var(--soft); border-radius: var(--r-md);
    flex-shrink: 0;
  }
  .cat-body { flex: 1; min-width: 0; }
  .cat-name {
    font-size: 20px; font-weight: 600; color: var(--fg);
    letter-spacing: -.02em; line-height: 1.25;
  }
  .cat-desc {
    font-size: 13px; color: var(--fg2);
    margin-top: 4px; line-height: 1.4;
  }
  .cat-meta {
    display: flex; gap: 6px; flex-shrink: 0;
  }
  .cat-pill {
    font-size: 12px; font-weight: 500; color: var(--fg2);
    background: var(--soft); padding: 4px 10px;
    border-radius: 999px;
    font-variant-numeric: tabular-nums;
  }
  .cat-pill.pending {
    color: var(--orange); background: rgba(255, 149, 0, 0.1);
  }
  .cat-content {
    border-top: 1px solid var(--line);
    padding: 8px 28px 16px;
  }

  /* ===== L2 唤醒词(行式列表)===== */
  .ww-block {
    padding: 14px 0; border-bottom: 1px solid var(--line);
  }
  .ww-block:last-child { border-bottom: none; }
  .ww-block > summary {
    list-style: none; cursor: pointer; user-select: none;
    display: flex; align-items: center; gap: 12px;
    transition: color .15s;
  }
  .ww-block > summary:hover { color: var(--blue); }
  .ww-block > summary::-webkit-details-marker,
  .ww-block > summary::marker { display: none; }
  .ww-block > summary::before {
    content: '›';
    font-size: 18px; font-weight: 300; color: var(--fg3);
    width: 14px; text-align: center;
    transition: transform .25s, color .15s;
    line-height: 1;
  }
  .ww-block[open] > summary::before {
    transform: rotate(90deg);
    color: var(--blue);
  }
  .ww-block > summary > * { pointer-events: none; }
  .ww-num {
    font-size: 12px; font-weight: 600; color: var(--fg3);
    background: var(--soft); padding: 3px 9px;
    border-radius: 6px;
    font-variant-numeric: tabular-nums;
    letter-spacing: .03em;
    min-width: 32px; text-align: center;
    flex-shrink: 0;
  }
  .ww-name {
    font-size: 16px; font-weight: 500; color: var(--fg);
    letter-spacing: -.01em; flex: 1;
  }
  .ww-meta {
    display: flex; gap: 6px; flex-shrink: 0;
  }
  .ww-pill {
    font-size: 11px; font-weight: 500; color: var(--fg3);
    background: transparent; padding: 2px 8px;
    border-radius: 999px;
    font-variant-numeric: tabular-nums;
  }
  .ww-pill.pending {
    color: var(--orange); background: rgba(255, 149, 0, 0.1);
  }
  .ww-content { margin-top: 12px; padding-left: 26px; }

  /* ===== L3 场景(简化卡片)===== */
  .sc-block {
    background: var(--bg); border-radius: var(--r-md);
    padding: 16px 18px; margin-bottom: 10px;
    border: 1px solid transparent;
    transition: border-color .15s, background .15s;
  }
  .sc-block.pending { border-left: 3px solid var(--orange); }
  .sc-block > summary {
    list-style: none; cursor: pointer; user-select: none;
    display: flex; align-items: center; gap: 10px;
    flex-wrap: wrap;
  }
  .sc-block > summary::-webkit-details-marker,
  .sc-block > summary::marker { display: none; }
  .sc-block > summary::before {
    content: '›';
    font-size: 14px; font-weight: 300; color: var(--fg3);
    width: 12px; text-align: center;
    transition: transform .25s, color .15s;
    line-height: 1;
  }
  .sc-block[open] > summary::before {
    transform: rotate(90deg);
    color: var(--blue);
  }
  .sc-block > summary > * { pointer-events: none; }
  .sc-title {
    font-size: 15px; font-weight: 500; color: var(--fg);
    letter-spacing: -.01em; flex: 1;
  }
  .sc-status {
    font-size: 11px; font-weight: 600; padding: 2px 8px;
    border-radius: 4px; flex-shrink: 0;
  }
  .sc-status.avail {
    color: var(--green); background: rgba(52, 199, 89, 0.12);
  }
  .sc-status.pending {
    color: var(--orange); background: rgba(255, 149, 0, 0.12);
  }
  .sc-content { padding-top: 12px; }
  .sc-dim-list {
    display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px;
  }
  .sc-dim {
    font-size: 12px; color: var(--fg2); background: var(--card);
    padding: 3px 10px; border-radius: 6px;
    border: 1px solid var(--line);
  }
  .sc-dim b { color: var(--fg); font-weight: 500; }
  .sc-prompt {
    background: var(--card); border-radius: var(--r-md);
    padding: 14px 16px; margin-bottom: 10px;
    font-size: 14px; color: var(--fg);
    font-family: ui-monospace, "SF Mono", "Menlo", monospace;
    border: 1px solid var(--line);
    white-space: pre-wrap; word-break: break-word; line-height: 1.5;
  }
  .sc-result {
    font-size: 13px; color: var(--fg2); margin-bottom: 12px;
    line-height: 1.5;
  }
  .sc-result b { color: var(--fg); font-weight: 500; }
  .copy-btn {
    padding: 8px 14px; border: none;
    background: var(--blue); color: #fff;
    border-radius: var(--r-md); font-size: 13px; cursor: pointer;
    font-weight: 500; font-family: inherit;
    transition: background .15s, transform .1s;
  }
  .copy-btn:hover { background: var(--blue2); }
  .copy-btn:active { transform: scale(.97); }
  .copy-btn.copied { background: var(--green); }
  .copy-btn.failed { background: var(--red); }

  /* ===== Empty / 隐藏 ===== */
  .empty {
    text-align: center; padding: 60px 20px;
    color: var(--fg3); font-size: 15px;
  }
  .cat-block.hidden, .ww-block.hidden, .sc-block.hidden { display: none; }

  /* ===== Toast(iOS 通知风格 · 对标卡路里 v2.4.12) ===== */
  .toast {
    position: fixed; left: 50%; bottom: 32px;
    transform: translateX(-50%) scale(0.9);
    opacity: 0;
    background: rgba(28, 28, 30, 0.94);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    backdrop-filter: blur(20px) saturate(180%);
    color: #f0f0f0;
    border-radius: 14px;
    padding: 13px 14px 13px 16px;
    display: flex; align-items: flex-start; gap: 12px;
    max-width: 480px; min-width: 320px;
    box-shadow: 0 10px 32px rgba(0, 0, 0, 0.32), 0 0 0 0.5px rgba(255,255,255,0.08) inset;
    pointer-events: none;
    transition: opacity 0.22s ease-out, transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
    z-index: 9999;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) scale(1);
    pointer-events: auto;
  }
  .toast-icon {
    font-size: 22px; line-height: 1; padding-top: 1px; flex-shrink: 0;
  }
  .toast-body { flex: 1; min-width: 0; }
  .toast-title {
    font-weight: 600; font-size: 13px; line-height: 1.4;
    color: #fff; margin-bottom: 3px;
  }
  .toast-title em {
    font-style: normal; color: #4dd96b; font-weight: 600;
  }
  .toast-detail {
    font-size: 11.5px; line-height: 1.55;
    color: #c8c8cc;
  }
  .toast-close {
    background: rgba(255, 255, 255, 0.10);
    color: #4dd96b;
    border: 0;
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 11px;
    font-weight: 500;
    font-family: inherit;
    cursor: pointer;
    white-space: nowrap;
    margin-left: 6px; flex-shrink: 0;
    transition: background 0.12s;
  }
  .toast-close:hover { background: rgba(255, 255, 255, 0.18); }
  .toast-close:active { transform: scale(0.96); }
  /* 移动端 toast 适配(对标卡路里) */
  @media (max-width: 640px) {
    .toast {
      left: 12px; right: 12px;
      bottom: calc(12px + env(safe-area-inset-bottom, 0));
      transform: translateX(0) scale(0.95);
      max-width: none; min-width: 0;
      padding: 12px 12px 12px 14px;
    }
    .toast.show { transform: translateX(0) scale(1); }
    .toast-icon { font-size: 20px; }
    .toast-title { font-size: 12.5px; }
    .toast-detail { font-size: 11px; }
  }

  /* ===== Footer ===== */
  .footer {
    text-align: center; color: var(--fg3);
    font-size: 12px; padding: 32px 0 16px;
    line-height: 1.6;
  }
  .footer code {
    font-family: ui-monospace, "SF Mono", "Menlo", monospace;
    font-size: 11px; color: var(--fg2);
    background: var(--soft); padding: 1px 6px; border-radius: 4px;
  }

  /* ===== 兼容 fallback ===== */
  /* 不支持 :where() / gap / backdrop-filter 的老浏览器降级 */
  @supports not (backdrop-filter: blur(1px)) {
    .toolbar { background: var(--card); }
  }

  /* ===== Mobile ===== */
  @media (max-width: 640px) {
    body { font-size: 14px; }
    .wrap { padding: 0 16px; }
    .hero { padding: 36px 0 28px; }
    .hero h1 { font-size: 28px; }
    .hero .sub { font-size: 15px; }
    .hero .stats { gap: 16px; font-size: 12px; }
    .toolbar { margin: 0 -16px 16px; padding-left: 16px; padding-right: 16px; }
    .cat-block > summary { padding: 18px 20px; gap: 12px; }
    .cat-icon { font-size: 24px; width: 40px; height: 40px; }
    .cat-name { font-size: 17px; }
    .cat-desc { font-size: 12px; }
    .cat-content { padding: 6px 20px 12px; }
    .ww-name { font-size: 15px; }
    .ww-content { padding-left: 22px; }
    .sc-block { padding: 14px 16px; }
    .sc-title { font-size: 14px; }
  }
</style>
</head>

<div class="hero">
  <div class="wrap">

</div>

(function(){
  // === 工具 ===
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  // === Toast 控制器(对标卡路里 v2.4.12 · iOS 通知风格) ===
  // showToast(wake):wake 是被复制的唤醒词名(如 "#6 查作息" / "#14 复盘"),
  // toast 标题显示 "已复制 #6 查作息",副标题固定提示用户粘给 AI + 飞书闭环
  const toastEl = document.getElementById('toast');
  const toastWakeEl = document.getElementById('toastWake');
  const toastCloseEl = document.getElementById('toastClose');
  let toastTimer = null;

  function showToast(wake) {
    // wake 可以是唤醒词字符串;若未传则用 "prompt" 占位
    const wakeText = (wake && String(wake).trim()) || 'prompt';
    if (toastWakeEl) toastWakeEl.textContent = wakeText;
    if (toastEl) {
      toastEl.classList.add('show');
      clearTimeout(toastTimer);
      // 4.5s 自动消失(对标卡路里,够用户读完副标题)
      toastTimer = setTimeout(function(){ toastEl.classList.remove('show'); }, 4500);
    }
  }
  // 关闭按钮:点击立即消失
  if (toastCloseEl) {
    toastCloseEl.addEventListener('click', function(){
      toastEl.classList.remove('show');
      clearTimeout(toastTimer);
    });
  }
  function wakeNum(wake) {
    // "#0 记作息" → "00"
    const m = String(wake || '').match(/^#?(\d+|[A-Z]\d+)/);
    return m ? m[1].padStart(2, '0') : '';
  }
  function wakeName(wake) {
    // "#0 记作息" → "记作息"(去掉 #N 前缀)
    return String(wake || '').replace(/^#\S+\s*/, '').trim();
  }

  // === 1. 数据 ===
  const data = window.__SCENARIOS__;
  if (!data) {
    document.getElementById('mainContent').innerHTML = '<div class="empty">⚠ 数据加载失败</div>';
    return;
  }
  document.getElementById('stat-categories').textContent = data.category_count;
  document.getElementById('stat-wakewords').textContent = data.wakeword_count;
  document.getElementById('stat-scenarios').textContent = data.scenario_count;
  document.getElementById('stat-pending').textContent = data.pending_count;
  document.getElementById('stat-generated').textContent = data.generated_at;

  // === 2. 渲染 ===
  const mainEl = document.getElementById('mainContent');

  function renderCategory(cat) {
    const wws = cat.wake_words || [];
    const pendingCount = cat.pending_count || 0;
    const totalSc = wws.reduce(function(s, w){ return s + (w.scenarios || []).length; }, 0);
    const pendingPill = pendingCount > 0
      ? '<span class="cat-pill pending">' + pendingCount + ' 待开发</span>' : '';
    return '<details class="cat-block">' +
      '<summary>' +
        '<span class="cat-icon">' + esc(cat.icon) + '</span>' +
        '<div class="cat-body">' +
          '<div class="cat-name">' + esc(cat.name) + '</div>' +
          (cat.desc ? '<div class="cat-desc">' + esc(cat.desc) + '</div>' : '') +
        '</div>' +
        '<div class="cat-meta">' +
          '<span class="cat-pill">' + wws.length + ' 唤醒词</span>' +
          '<span class="cat-pill">' + totalSc + ' 场景</span>' +
          pendingPill +
        '</div>' +
      '</summary>' +
      '<div class="cat-content">' + wws.map(renderWakeWord).join('') + '</div>' +
    '</details>';
  }

  function renderWakeWord(ww) {
    const scs = ww.scenarios || [];
    const pending = ww.pending_count || 0;
    const num = wakeNum(ww.wake_word);
    const name = wakeName(ww.wake_word);
    const pendingPill = pending > 0
      ? '<span class="ww-pill pending">' + pending + ' 待开发</span>' : '';
    return '<details class="ww-block">' +
      '<summary>' +
        (num ? '<span class="ww-num">' + esc(num) + '</span>' : '') +
        '<span class="ww-name">' + esc(name) + '</span>' +
        '<div class="ww-meta">' +
          '<span class="ww-pill">' + scs.length + ' 场景</span>' +
          pendingPill +
        '</div>' +
      '</summary>' +
      '<div class="ww-content">' + scs.map(renderScenario).join('') + '</div>' +
    '</details>';
  }

  function renderScenario(sc) {
    const isPending = sc.status === '【待开发】';
    const dims = sc.dimensions || {};
    const dimBadges = Object.entries(dims).map(function(e){
      return '<span class="sc-dim"><b>' + esc(e[0]) + '</b> ' + esc(String(e[1])) + '</span>';
    }).join('');
    const statusBadge = isPending
      ? '<span class="sc-status pending">待开发</span>'
      : '<span class="sc-status avail">可用</span>';
    const dataSearch = (sc.wake_word + ' ' + sc.scenario_title + ' ' + sc.prompt + ' ' + (sc.result || '')).toLowerCase();
    return '<details class="sc-block' + (isPending ? ' pending' : '') + '" data-search="' + esc(dataSearch) + '">' +
      '<summary>' +
        '<span class="sc-title">' + esc(sc.scenario_title) + '</span>' +
        statusBadge +
      '</summary>' +
      '<div class="sc-content">' +
        (dimBadges ? '<div class="sc-dim-list">' + dimBadges + '</div>' : '') +
        '<div class="sc-prompt">' + esc(sc.prompt) + '</div>' +
        (sc.result ? '<div class="sc-result"><b>预期 ·</b> ' + esc(sc.result) + '</div>' : '') +
        '<button class="copy-btn" data-prompt="' + esc(sc.prompt) + '">复制 prompt</button>' +
      '</div>' +
    '</details>';
  }

  if (!data.categories || !data.categories.length) {
    mainEl.innerHTML = '<div class="empty">暂无模块数据</div>';
  } else {
    mainEl.innerHTML = data.categories.map(renderCategory).join('');
  }

  // === 3. 默认折叠(全部 details 不加 open 属性)==

  // === 4. 复制按钮 ===
  mainEl.addEventListener('click', function(e){
    const btn = e.target.closest('.copy-btn');
    if (!btn) return;
    const text = btn.getAttribute('data-prompt') || '';
    // 找到所属场景的唤醒词(对标卡路里):toast 显示"已复制 #6 查作息 · 单条添加"
    // sc-block 自身只含 scenario_title,wake_word 在父级 .ww-block > .ww-name
    let wake = '';
    const scBlock = btn.closest('.sc-block');
    if (scBlock) {
      const scTitleEl = scBlock.querySelector('.sc-title');
      if (scTitleEl) wake = scTitleEl.textContent.trim();
      const wwBlock = scBlock.closest('.ww-block');
      if (wwBlock) {
        const wwNameEl = wwBlock.querySelector('.ww-name');
        if (wwNameEl) wake = wwNameEl.textContent.trim() + ' · ' + wake;
      }
    }
    showToast(wake || 'prompt');

    const done = function(){
      btn.textContent = '✓ 已复制';
      btn.classList.add('copied');
      // toast 已在 showToast(wake) 中显示,这里只控制按钮视觉
      setTimeout(function(){
        btn.textContent = '复制 prompt';
        btn.classList.remove('copied');
      }, 2200);
    };
    const fallback = function(){
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0;';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); done(); } catch(e) {
        btn.textContent = '✗ 复制失败';
        btn.classList.add('failed');
      }
      document.body.removeChild(ta);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done).catch(fallback);
    } else {
      fallback();
    }
  });

  // === 5. 全部展开 / 全部折叠 ===
  function setAll(open) {
    mainEl.querySelectorAll('details').forEach(function(d){ d.open = open; });
  }
  document.getElementById('expandAll').addEventListener('click', function(){ setAll(true); });
  document.getElementById('collapseAll').addEventListener('click', function(){ setAll(false); });

  // === 6. 搜索 ===
  document.getElementById('search').addEventListener('input', function(e){
    const q = e.target.value.toLowerCase().trim();
    const allCats = mainEl.querySelectorAll('.cat-block');
    let anyVisible = false;
    allCats.forEach(function(cat){
      let catHasMatch = false;
      const wws = cat.querySelectorAll('.ww-block');
      wws.forEach(function(ww){
        let wwHasMatch = false;
        const scs = ww.querySelectorAll('.sc-block');
        scs.forEach(function(sc){
          const hit = q === '' || (sc.getAttribute('data-search') || '').indexOf(q) >= 0;
          sc.classList.toggle('hidden', !hit);
          if (hit) wwHasMatch = true;
        });
        ww.classList.toggle('hidden', !wwHasMatch);
        if (wwHasMatch) { ww.open = true; catHasMatch = true; }
      });
      cat.classList.toggle('hidden', !catHasMatch);
      if (catHasMatch) { cat.open = true; anyVisible = true; }
      else if (q === '') { anyVisible = true; cat.open = false; }
    });
    let empty = mainEl.querySelector('.empty-search');
    if (q !== '' && !anyVisible) {
      if (!empty) {
        empty = document.createElement('div');
        empty.className = 'empty empty-search';
        empty.textContent = '无匹配场景';
        mainEl.appendChild(empty);
      }
    } else if (empty) {
      empty.remove();
    }
  });
})();
</script>
