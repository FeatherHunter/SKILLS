<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HELP 原型 · V4 三级目录版</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  :root{--fg:#1d1d1f;--fg2:#6e6e73;--fg3:#86868b;--bg:#f2f2f7;--card:#fff;--line:#d1d1d6;--blue:#007aff;--blue2:#0a63ce;--soft:#f0f6ff;--ok:#34c759;--orange:#ff9500;--red:#ff3b30;--shadow:0 1px 2px rgba(0,0,0,.04),0 4px 14px rgba(0,0,0,.05)}
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--fg);line-height:1.5;-webkit-font-smoothing:antialiased;font-size:14px}
  button{font-family:inherit}
  .stage{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:24px 16px 60px;background:var(--bg)}
  .stage-title{color:#3a3a3c;font-size:15px;font-weight:700;text-align:center}
  .stage-sub{color:#6e6e73;font-size:12px;text-align:center;margin:3px 0 14px}
  .phone{width:680px;max-width:100%;height:auto;background:transparent;border-radius:0;border:0;overflow:visible;position:relative;box-shadow:none}
  .screen{height:auto;overflow:visible;-webkit-overflow-scrolling:touch;background:transparent;scrollbar-width:none;overscroll-behavior-y:auto}
  .screen::-webkit-scrollbar{display:none}
  .notch{display:none}
  .app{padding:12px 0 74px}
  .app-inner{padding:0 6px}
  .hero{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:8px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .h-left{flex:1;min-width:0}
  .eyebrow{font-size:9px;color:var(--blue);font-weight:800;letter-spacing:.07em;text-transform:uppercase}
  h1{font-size:19px;line-height:1.15;letter-spacing:-.02em}
  .lead{color:var(--fg2);font-size:11.5px}
  .hero-steps{display:flex;align-items:center;gap:4px;flex-basis:100%;margin-top:6px}
  .hero-steps .step{background:var(--soft);border:1px solid #d7e6ff;color:var(--blue2);font-weight:700;font-size:10.5px;padding:3px 10px;border-radius:999px;white-space:nowrap}
  .hero-steps .arrow{color:var(--blue);font-weight:800;font-size:11px}
  .h-badge{background:var(--soft);border:1px solid #d7e6ff;color:var(--blue2);font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap;flex-shrink:0}
  /* ===== D4 首次使用横幅（可配 · 未初始化时显示 · 可手动关闭）===== */
  .init-banner{background:linear-gradient(135deg,#0a63ce,#007aff 55%,#34c759);color:#fff;border-radius:12px;padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:relative}
  .init-banner .ib-text{flex:1;min-width:200px;padding-right:26px}
  .init-banner .ib-title{font-size:14px;font-weight:800;margin-bottom:2px}
  .init-banner .ib-sub{font-size:11.5px;opacity:.9;line-height:1.5}
  .init-banner .copy-btn{background:#fff;color:var(--blue);min-height:30px;font-weight:700;border-radius:999px;padding:0 11px;font-size:11.5px;flex-shrink:0;margin-right:26px}
  .init-banner .ib-close{position:absolute;top:8px;right:8px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(255,255,255,.22);color:#fff;font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1;flex-shrink:0}
  /* 初始化步骤卡（可选 · 技能传 steps 显示 · >4 步横向滑动）*/
  .init-steps{display:flex;gap:6px;flex-basis:100%;margin-top:4px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding-bottom:2px}
  .init-steps::-webkit-scrollbar{display:none}
  .init-step{flex:0 0 calc(25% - 4.5px);background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);border-radius:10px;padding:7px 5px;text-align:center;min-width:0}
  .init-step .s-n{width:20px;height:20px;border-radius:50%;background:#fff;color:var(--blue2);font-weight:800;font-size:10px;display:flex;align-items:center;justify-content:center;margin:0 auto 4px}
  .init-step .s-t{font-size:9.5px;font-weight:700;color:#fff;line-height:1.3;word-break:break-all}
  .init-step .s-d{font-size:8px;color:rgba(255,255,255,.75);margin-top:1px;line-height:1.3;word-break:break-all}
  /* ===== 关于 Tab（最后 · 域概览 + 联系作者 + 版本）===== */
  .about-sec{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:8px;overflow:hidden}
  .about-sec .as-head{padding:9px 12px;font-size:13px;font-weight:800;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:7px}
  .about-sec .as-body{padding:4px 12px 8px}
  .about-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:12.5px}
  .about-row:last-child{border-bottom:0}
  .about-row .a-ico{width:30px;height:30px;border-radius:9px;background:var(--soft);color:var(--blue2);display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
  .about-row .a-ico svg{width:17px;height:17px;display:block}
  .about-row .a-t{flex:1;min-width:0}
  .about-row .a-t b{font-size:12.5px;display:block}
  .about-row .a-t span{font-size:10.5px;color:var(--fg3)}
  .about-row .a-badge{font-size:9.5px;color:var(--fg3);background:var(--bg);border-radius:999px;padding:1px 8px;flex-shrink:0}
  .about-row .a-link{color:var(--blue);font-size:10.5px;word-break:break-all}
  .about-row .a-copy{min-height:28px;padding:0 10px;font-size:10.5px;border-radius:8px;flex-shrink:0}
  /* ===== D4 联系作者（可配）===== */
  .contact-box{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-top:10px;overflow:hidden}
  .contact-box>summary{min-height:44px;padding:0 13px;cursor:pointer;font-size:13.5px;font-weight:700;list-style:none;display:flex;align-items:center;gap:8px;user-select:none}
  .contact-box>summary::-webkit-details-marker{display:none}
  .contact-box>summary::before{content:"▸";font-size:11px;color:var(--fg3);transition:transform .15s;flex-shrink:0}
  .contact-box[open]>summary::before{transform:rotate(90deg);color:var(--blue)}
  .contact-body{padding:4px 13px 12px}
  .contact-item{display:flex;gap:10px;align-items:center;font-size:12.5px;color:var(--fg2);padding:7px 0;border-bottom:1px dashed var(--line)}
  .contact-item:last-child{border-bottom:0}
  .contact-item .k{font-weight:700;color:var(--fg);min-width:64px;flex-shrink:0}
  .contact-item a{color:var(--blue);text-decoration:none;word-break:break-all}
  .contact-copy{margin-top:10px}
  .search-wrap{position:sticky;top:0;z-index:400;background:rgba(242,242,247,.92);-webkit-backdrop-filter:saturate(180%) blur(14px);backdrop-filter:saturate(180%) blur(14px);padding:5px 0;margin-bottom:2px}
  .search-box{position:relative}
  .search-box input{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 34px 9px 34px;font-size:13.5px;background:#fff;outline:none}
  .search-box input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(0,122,255,.13)}
  .s-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);font-size:13px;color:var(--fg3);pointer-events:none}
  .s-clear{position:absolute;right:9px;top:50%;transform:translateY(-50%);width:20px;height:20px;border-radius:50%;border:0;background:var(--bg);color:var(--fg3);font-size:12px;cursor:pointer;display:none;align-items:center;justify-content:center;line-height:1}
  .hitcount{font-size:11px;color:var(--fg2);margin-bottom:5px;text-align:center}
  .search-empty{background:var(--card);border:1.5px dashed var(--line);border-radius:12px;padding:20px 12px;text-align:center;color:var(--fg3);font-size:12.5px}
  .chip{display:inline-block;background:var(--soft);color:var(--blue2);padding:1px 7px;border-radius:999px;font-size:9.5px;font-weight:700;flex-shrink:0;line-height:1.55}
  .type-badge{display:inline-block;padding:1px 7px;border-radius:999px;font-size:9px;font-weight:700;flex-shrink:0;background:#e9e9ee;color:#666;line-height:1.55}
  .t-view{background:#e8f2ff;color:#0a63ce}
  .t-wizard{background:#e2f7f5;color:#00897b}
  .t-collect{background:#e7f8ee;color:#1a7a3a}
  .t-result{background:#e8f2ff;color:#0a63ce}
  .t-batch{background:#f3e9fb;color:#8e3fc9}
  .t-dev{background:#fff1e2;color:#b25b00}
  .copy-btn{display:inline-flex;align-items:center;justify-content:center;border:0;background:var(--blue);color:#fff;border-radius:8px;padding:0 9px;font-size:11.5px;font-weight:600;cursor:pointer;white-space:nowrap;flex-shrink:0;min-height:36px;transition:background .12s}
  .copy-btn:active{background:var(--blue2)}
  .copy-btn.ghost{background:#fff;color:var(--blue);border:1px solid var(--blue)}
  mark{background:#ffe08a;border-radius:3px;padding:0 1px;color:inherit}

  /* ===== 横向滑动容器（ViewPager）===== */
  .pages{display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;scrollbar-width:none;scroll-behavior:smooth;align-items:flex-start}
  .pages::-webkit-scrollbar{display:none}
  .page{flex:0 0 100%;scroll-snap-align:start}

  /* ===== 二级：子功能折叠组 ===== */
  .page{display:flex;flex-direction:column}
  .subgroup{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:8px;overflow:hidden;display:flex;flex-direction:column}
  .subgroup>summary{min-height:44px;padding:0 12px;display:flex;align-items:center;gap:8px;list-style:none;cursor:pointer;font-size:13.5px;font-weight:700;user-select:none;flex-shrink:0}
  .subgroup>summary::-webkit-details-marker{display:none}
  .subgroup>summary::before{content:"▸";font-size:11px;color:var(--fg3);transition:transform .15s;flex-shrink:0}
  .subgroup[open]>summary::before{transform:rotate(90deg);color:var(--blue)}
  .subgroup .sg-count{font-size:10px;color:var(--fg3);font-weight:600;margin-left:auto;background:var(--bg);border-radius:999px;padding:1px 8px}
  .subgroup .sg-body{padding:7px 8px 9px;display:flex;flex-direction:column;flex:1;min-height:0}
  .subgroup:not([open]) .sg-body{display:none}

  /* ===== 三级：2 列场景卡片 ===== */
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
  .mini{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:9px;display:flex;flex-direction:column;gap:6px;cursor:pointer;box-shadow:none;transition:transform .08s;min-width:0;overflow:hidden}
  .mini:active{transform:scale(.985);background:#eaeaef}
  .mini .m-top{display:flex;align-items:center;justify-content:space-between;gap:4px;min-height:18px}
  .mini .m-top .chip{max-width:65%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex-shrink:0}
  .mini .m-top .type-badge{flex-shrink:0;white-space:nowrap}
  .mini .m-bottom{display:flex;align-items:center;gap:8px;min-width:0}
  .mini .m-name{flex:1;min-width:0;font-size:12.5px;font-weight:700;line-height:1.35;word-break:break-all;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;padding-left:7px}
  .mini .copy-btn{min-height:26px;padding:0 9px;font-size:11px;border-radius:9px;flex-shrink:0}

  /* ===== 底部 Tab（可横向滑动）===== */
  .tab-bar{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.94);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:1px solid var(--line);display:flex;z-index:600;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0));gap:6px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;touch-action:pan-x}
  /* 宽屏: Tab 栏宽度对齐主体内容区（居中限宽, 不横跨全屏）; 手机端保持全宽（见 media query）*/
  @media(min-width:501px){
    .tab-bar{width:680px;max-width:100%;left:50%;transform:translateX(-50%);border-left:1px solid var(--line);border-right:1px solid var(--line);border-radius:0}
  }
  .tab-bar::-webkit-scrollbar{display:none}
  .tab{flex:0 0 auto;min-width:66px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 10px 4px;cursor:pointer;font-size:10px;color:var(--fg3);font-weight:600;min-height:54px;justify-content:center;border:0;background:none;border-radius:14px;transition:background .08s,color .08s,box-shadow .08s;white-space:nowrap}
  .tab .t-ico{width:22px;height:22px;display:flex;align-items:center;justify-content:center;line-height:1}
  .tab .t-ico svg{width:20px;height:20px;display:block}
  .tab .t-ico .t-emoji{font-size:16px;line-height:1}
  .tab.active{background:var(--blue);color:#fff;box-shadow:0 4px 12px rgba(0,122,255,.3)}
  .tab.active .t-ico{transform:scale(1.05)}

  /* ===== Sheet 弹层（高度自适应内容 · 不满屏不滚动）===== */
  .sheet-mask{position:fixed;left:8px;right:8px;top:8px;bottom:8px;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .25s;z-index:900;border-radius:36px}
  .sheet-mask.show{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:8px;right:8px;bottom:8px;background:var(--card);border-radius:22px 22px 36px 36px;padding:10px 16px calc(8px + env(safe-area-inset-bottom,0));transform:translateY(105%);transition:transform .32s cubic-bezier(.32,.72,.24,1);z-index:901;max-height:82%;display:flex;flex-direction:column;box-shadow:0 -8px 40px rgba(0,0,0,.25)}
  .sheet.show{transform:translateY(0)}
  .sheet .grip{width:38px;height:4.5px;border-radius:999px;background:var(--line);margin:0 auto 12px;flex-shrink:0}
  .sheet .s-scroll{overflow-y:auto;flex:1;min-height:0;scrollbar-width:none;padding-bottom:66px}
  .sheet .s-scroll::-webkit-scrollbar{display:none}
  .sheet .s-head{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:4px}
  .sheet .s-title{font-size:17px;font-weight:700;flex-basis:100%;line-height:1.3}
  .sheet .s-close{position:absolute;top:16px;right:16px;width:30px;height:30px;border-radius:50%;border:0;background:var(--bg);color:var(--fg3);font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .sheet .prompt-box{background:#1d1d1d;color:#f5f5f7;border-radius:12px;padding:11px 13px;white-space:pre-wrap;font-family:ui-monospace,Menlo,monospace;font-size:12px;line-height:1.65;margin-top:9px;word-break:break-all}
  .sheet .pform{margin-top:9px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:9px 10px}
  .sheet .pfield{display:flex;align-items:center;gap:7px;margin-bottom:7px}
  .sheet .pfield:last-of-type{margin-bottom:0}
  .sheet .pfield label{font-size:12px;color:var(--fg2);font-weight:600;flex-shrink:0;min-width:72px}
  .sheet .pfield label em{color:var(--fg3);font-weight:400;font-size:9px}
  .sheet .pfield input{flex:1;min-width:0;border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:13px;background:#fff;outline:none;font-family:inherit;color:var(--fg)}
  .sheet .pfield input:focus{border-color:var(--blue);box-shadow:0 0 0 2px rgba(0,122,255,.12)}
  /* 未填时：灰淡背景 + 提示文字（placeholder 由技能方提供）*/
  .sheet .pfield input:placeholder-shown{background:#f2f2f4;border-color:#e0e0e4;color:#8e8e93}
  .sheet .pfield input:placeholder-shown:focus{background:#fff;border-color:var(--blue)}
  .sheet .pprev{margin-top:9px;background:#1d1d1d;color:#f5f5f7;border-radius:12px;padding:11px 13px;font-size:12px;line-height:1.65;word-break:break-all;white-space:pre-wrap;font-family:ui-monospace,Menlo,monospace}
  .sheet .pprev .pv-label{font-size:9px;color:#8e8e93;display:block;letter-spacing:.05em;margin-bottom:4px}
  .sheet .s-actions{position:absolute;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0));display:flex;gap:8px;flex-shrink:0}
  .sheet .s-actions .copy-btn{flex:1;min-height:48px;font-size:13px;font-weight:600;border-radius:12px;background:var(--blue);color:#fff;border:0;box-shadow:none}
  @media(max-width:500px){
    body{background:var(--bg)}
    .stage{padding:0;background:var(--bg)}
    .stage-title,.stage-sub{display:none}
    .phone{width:100%;height:100vh;border:0;border-radius:0;max-height:none;background:var(--bg);overflow:hidden}
    .screen{height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--bg);overscroll-behavior-y:contain}
    .notch{display:none}
    .sheet-mask{left:0;right:0;top:0;bottom:0;border-radius:0}
    .sheet{left:0;right:0;bottom:0;border-radius:22px 22px 0 0}
  }
</style>
</head>
<body>

<div class="stage">
  <div class="stage-title">📱 HELP 原型 · V4 三级目录版（B1-B4 拍板全落地）</div>
  <div class="stage-sub">Tab→子功能折叠→场景卡 · 参数=prompt+key:value · 复制不自动关 · 无参数显prompt · 手机打开全屏真机</div>

  <div class="phone"><div class="notch"></div><div class="screen" id="screen"></div></div>

  <div class="sheet-mask" id="sheetMask"></div>
  <div class="sheet" id="sheet">
    <div class="grip"></div>
    <button class="s-close" id="sheetClose">✕</button>
    <div class="s-scroll">
      <div class="s-head" id="shHead"></div>
      <div id="shBody"></div>
    </div>
    <div class="s-actions">
      <button class="copy-btn" id="shCopy">复制</button>
    </div>
  </div>

  <div class="toast" id="toast" style="display:none"></div>
</div>

<!-- 公共组件注入管线 -->
<script id="help-data" type="application/json"><!--INJECT-DATA--></script>
<script>
<!--SHARED-HELPERS-->
</script>
<style>
<!--SHARED-CSS-->
</style>

<script>
/* ===== 技能身份与数据（scene-data 契约 v1 · 全外部注入）===== */
var HELP = JSON.parse(document.getElementById('help-data').textContent);
var SKILL_NAME = HELP.skill_name || '';
var TITLE = HELP.title || '能力速查台';
var SUBTITLE = HELP.subtitle || '';
var META_BLOCKS = HELP.meta_blocks || [];
var INIT_BANNER = HELP.init_banner || null;
var CONTACT = HELP.contact || null;
var SKILL_VERSION = HELP.version || '';
var ABOUT_EXTRA = {};
var RECOMMENDATIONS = HELP.recommendations || [];

/* 契约 v1 (groups[{id,icon,label,subgroups[{id,label,scenes[]}]}])
   -> 原型内部结构 (key/icon/name + subgroups[{name,scenes}]) */
function normalizeScenes(scenes){
  return (scenes || []).map(function(s){
    return {
      id: s.id,
      name: s.title,
      chip: s.wake_word,
      types: (s.types && s.types.length ? s.types : []),
      dev: (s.status === '【待开发】'),
      prompt: s.prompt_template,
      params: (s.editable_fields || []).map(function(f){
        return { key: f.name, label: f.label, value: f.value || '', req: !!f.required, hint: f.hint || '' };
      })
    };
  });
}
var GROUPS = (HELP.groups || []).map(function(g){
  return {
    key: g.id, icon: g.icon || 'grid', name: g.label,
    subgroups: (g.subgroups || []).map(function(sg){
      return { name: sg.label, scenes: normalizeScenes(sg.scenes) };
    })
  };
});

/* ===== 扁平化索引（原型逻辑 · 渲染/卡片/搜索依赖）===== */
var ALL = [];
var SCENE = {};
GROUPS.forEach(function(g){
  g.subgroups.forEach(function(sg){
    sg.scenes.forEach(function(s){
      s.g = g.name; s.gkey = g.key; s.gico = g.icon; s.sg = sg.name;
      ALL.push(s); SCENE[s.id] = s;
    });
  });
});

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
/* 类型徽章: types 数组元素可为字符串(默认配色)或 {text,bg,fg}(调用者自定义颜色, 缺省走默认) */
var TYPE_DEFAULT = {
  '采集':  {bg:'#e7f8ee', fg:'#1a7a3a'},
  '查看':  {bg:'#e8f2ff', fg:'#0a63ce'},
  '结果':  {bg:'#e8f2ff', fg:'#0a63ce'},
  '向导':  {bg:'#e2f7f5', fg:'#00897b'},
  '批量':  {bg:'#f3e9fb', fg:'#8e3fc9'},
  '校验':  {bg:'#e8f2ff', fg:'#0a63ce'},

/* ===== 自然滚动: 内容跟手, 搜索栏 sticky 吸顶(CSS) =====
   旧版两段式 transform 抵消导致: 吸顶前内容不跟手、短页(关于)滚不到吸顶 → 全部移除 */
/* 页面高度 = 内容自然高度（不撑高）: 内容短则页面短, 滑到底即停, 不出灰色空白
   （原实现 pg.style.minHeight = screen.clientHeight 把短页撑到一屏高,
     内容下方露出透明 page 背景 → 灰色底被顶上来;#289 用户验收拍板）*/

/* ===== 滑动切页（ViewPager）===== */
var pages = document.getElementById('pages');
var tabs = Array.prototype.slice.call(document.querySelectorAll('.tab'));
var screen = document.querySelector('.screen');
/* ③ 容器高度锁定: 用内容实际全高(而非首屏高), 防空白可滑也防内容被截断 */
function lockPagesHeight(idx){
  if (idx === undefined) idx = Math.min(curIndex(), pages.children.length - 1);
  var pg = pages.children[idx];
  if (!pg) return;
  pages.style.height = pg.scrollHeight + 'px';
}
function curIndex(){ return Math.round(pages.scrollLeft / pages.clientWidth); }
function syncTab(){
  var i = Math.min(curIndex(), tabs.length - 1);
  tabs.forEach(function(t, j){ t.classList.toggle('active', j === i); });
}
pages.addEventListener('scroll', function(){
  clearTimeout(syncTab._t);
  syncTab._t = setTimeout(function(){
    if (Date.now() < syncTab._lockUntil) return;  /* 点击后的滚动动画期不覆盖 active */
    syncTab();
    lockPagesHeight();  /* 横向滑动结束也校准高度 */
  }, 15);
}, {passive:true});
tabs.forEach(function(t){
  t.addEventListener('click', function(){
    var i = tabs.indexOf(t);
    tabs.forEach(function(x, j){ x.classList.toggle('active', j === i); });
    syncTab._lockUntil = Date.now() + 900;  /* 锁 ~0.9s: 覆盖点击动画期即可, 缩短滑动跟手延迟 */
    /* 切换立即: ① 归零纵向滚动(防旧位置灰色遮挡) ② 立即锁定新页高度(防内容截断/滑不动) */
    /* 手机端: .screen 是滚动容器, scrollTop=0 = 回到内容顶部（页面不跳）;
       宽屏: .screen overflow:visible, 真正滚动的是 window —— 定位到 pages 容器顶部(搜索栏处), 不跳整页最上层 */
    if (screen.scrollTop !== undefined && screen.clientHeight > 0 && screen.scrollHeight > screen.clientHeight) {
      screen.scrollTop = 0;
    } else {
      var pagesTop = pages.getBoundingClientRect().top + (window.pageYOffset || document.documentElement.scrollTop || 0);
      window.scrollTo(0, Math.max(0, pagesTop - 8));
    }
    pages.style.scrollSnapType = 'none';
    pages.scrollTo({left: i * pages.clientWidth, behavior:'smooth'});
    lockPagesHeight(i);  /* 直接传目标索引, 不等动画 */
    /* 点击的 Tab 尽可能居中显示(首尾贴边) */
    centerTab(t);
    setTimeout(function(){
      pages.style.scrollSnapType = '';
      syncTab._lockUntil = 0;  /* 动画结束立即解锁, 之后滑动变色实时跟手 */
      lockPagesHeight(i);  /* 动画结束后再校准一次 */
    }, 900);
  });
});
/* ===== Tab 条: 点击的 Tab 居中显示 ===== */
function centerTab(tab){
  var bar = document.getElementById('tabBar');
  var max = bar.scrollWidth - bar.clientWidth;
  var target = tab.offsetLeft + tab.offsetWidth / 2 - bar.clientWidth / 2;
  target = Math.max(0, Math.min(target, max));
  bar.scrollTo({left: target, behavior: 'smooth'});
}

function doCopy(text){
  var ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';

  var text = b.dataset.c;
  if (s && s.params && s.params.length) {
    var v = readParams(s.id);
    var miss = getMissing(s, v);
    if (miss.length) { toastMsg(miss.join('、')); return; }
    text = buildPrompt(s, v);
  }
  doCopy(text);
  showToast();

});

/* ===== 搜索（全局跨 Tab + 自动跳转 + 高亮）===== */
var sB = document.getElementById('sB');
var sClear = document.getElementById('sClear');
var lastQuery = '';
function doSearch(){
  var q = sB.value.trim().toLowerCase();
  sClear.style.display = q ? 'flex' : 'none';
  if (!q) {
    var cur = curIndex();
    Array.prototype.forEach.call(pages.children, function(pg, i){
      pg.querySelectorAll('.mini').forEach(function(m){
        m.style.display = '';
        m.querySelector('.m-name').innerHTML = esc(SCENE[m.dataset.key].name);
      });
      pg.querySelectorAll('.subgroup').forEach(function(sg){ sg.style.display = ''; });
    });
    if (lastQuery) pages.scrollTo({left: cur * pages.clientWidth, behavior:'smooth'});
    lastQuery = '';
    document.getElementById('hitC').hidden = true;
    document.getElementById('emptyC').hidden = true;
    return;
  }
  lastQuery = q;
  var total = 0, firstHitPage = -1;
  Array.prototype.forEach.call(pages.children, function(pg, i){
    var pageHit = 0;
    pg.querySelectorAll('.mini').forEach(function(m){
      var show = m.textContent.toLowerCase().indexOf(q) > -1;
      m.style.display = show ? '' : 'none';
      if (show) pageHit++;
      var orig = SCENE[m.dataset.key].name;
      var i2 = orig.toLowerCase().indexOf(q);
      if (q && i2 >= 0) m.querySelector('.m-name').innerHTML = esc(orig.slice(0,i2)) + '<mark>' + esc(orig.slice(i2,i2+q.length)) + '</mark>' + esc(orig.slice(i2+q.length));
      else m.querySelector('.m-name').innerHTML = esc(orig);
    });
    /* 子功能组：无命中则隐藏 */
    pg.querySelectorAll('.subgroup').forEach(function(sg){
      var vis = sg.querySelectorAll('.mini:not([style*="none"])').length > 0;
      sg.style.display = vis ? '' : 'none';
      if (q && vis) sg.open = true;
    });
    total += pageHit;
    if (pageHit > 0 && firstHitPage === -1) firstHitPage = i;
  });
  if (firstHitPage >= 0 && firstHitPage !== curIndex()) {
    pages.scrollTo({left: firstHitPage * pages.clientWidth, behavior:'smooth'});
  }
  document.getElementById('hitC').hidden = false;
  document.getElementById('hitC').textContent = '匹配 ' + total + ' 个场景';
  document.getElementById('emptyC').hidden = total > 0;
}
sB.addEventListener('input', doSearch);
sClear.addEventListener('click', function(){ sB.value = ''; doSearch(); sB.focus(); });
/* 初始锁定 + 子功能组折叠/展开时高度校准 */
lockPagesHeight();
document.addEventListener('click', function(e){
  var sg = e.target.closest('.subgroup > summary');
  if (sg) setTimeout(lockPagesHeight, 60);  /* details 切换后重算 */
});
</script>
