<!DOCTYPE html>
<html lang="zh-CN">
<head>
<style><!--SHARED-CSS--></style>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>卡路里 · 自动分析诊断</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --fg:#1d1d1f; --fg2:#6e6e73; --fg3:#86868b; --bg:#fafafa;
    --card:#fff; --border:#d2d2d7; --accent:#0071e3;
    --good:#34c759; --warn:#ff9500; --bad:#ff3b30; --soft:#f5f5f7;
  }
  body { font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
         line-height:1.6; color:var(--fg); background:var(--bg);
         max-width:920px; margin:0 auto; padding:56px 24px 80px; -webkit-font-smoothing:antialiased; }
  h1 { font-size:28px; font-weight:700; letter-spacing:-.02em; margin-bottom:4px; }
  .sub { font-size:14px; color:var(--fg3); margin-bottom:24px; }
  .pill { display:inline-block; padding:2px 9px; border-radius:10px; font-size:11px; font-weight:600; margin-right:4px; }
  .pill-good { background:rgba(52,199,89,.15); color:var(--good); }
  .pill-warn { background:rgba(255,149,0,.15); color:var(--warn); }
  .pill-bad  { background:rgba(255,59,48,.15); color:var(--bad); }
  .pill-info { background:rgba(0,113,227,.15); color:var(--accent); }
  .finding { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:16px 20px; margin-bottom:12px; }
  .finding h3 { font-size:15px; font-weight:600; margin-bottom:6px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .finding .evidence { font-size:13px; color:var(--fg2); background:var(--soft); border-radius:8px; padding:8px 12px; margin-bottom:8px; }
  .finding .action { font-size:13px; color:var(--fg); }
  .finding .action b { color:var(--accent); }
  .conf { font-size:11px; padding:2px 8px; border-radius:8px; font-weight:600; }
  .conf-高 { background:rgba(255,59,48,.12); color:var(--bad); }
  .conf-中 { background:rgba(255,149,0,.15); color:var(--warn); }
  .conf-低 { background:rgba(134,134,139,.15); color:var(--fg3); }
  .degrade { background:rgba(255,149,0,.1); border:1px solid rgba(255,149,0,.3); border-radius:14px; padding:16px 20px; margin-bottom:16px; font-size:13.5px; color:#9a6b00; }
  .insight { background:var(--soft); border-radius:12px; padding:14px 18px; font-size:13.5px; margin-top:4px; }
  .insight b { color:var(--accent); }
  .meta-bar { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; }
  .meta-bar .left { font-size:12px; color:var(--fg2); }
  .meta-bar .type-badge { font-size:11px; padding:3px 10px; border-radius:6px; background:var(--soft); color:var(--fg2); font-weight:600; }
  .footer { margin-top:24px; padding:14px 18px; background:var(--soft); border-radius:12px; display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; }
  .footer .src { font-size:12px; color:var(--fg3); }
  .btn { border:1px solid var(--border); background:var(--card); padding:7px 14px; border-radius:8px; cursor:pointer; font-size:13px; color:var(--fg); }
  .btn:hover { background:var(--accent); color:#fff; border-color:var(--accent); }
  @media (max-width: 640px) {
    .section  { padding: 14px 16px; }
    body { padding: 40px 14px 60px; }
  }
</style>
</head>
<body>

<script id="payload" type="application/json"><!--INJECT-DATA--></script><script><!--SHARED-HELPERS--></script><script>window.__P__=(function(){try{return JSON.parse(document.getElementById('payload').textContent||'{}');}catch(e){return null;}})();</script>

<div class="meta-bar">
  <div class="left" id="metaLeft">--</div>
  <div class="type-badge">自动分析 · 诊断</div>
</div>

<h1 id="title">--</h1>
<p class="sub" id="sub">--</p>

<div class="degrade" id="degrade" style="display:none"></div>

<div id="findings"></div>

<div class="insight" id="insight">--</div>

<div class="footer">
  <div class="src" id="srcLine">📊 数据来源:--</div>
  <button class="btn" id="copyDxBtn">📋 复制诊断结论</button>
  
</div>

<script>
(function(){
  const D = ((window.__P__ && typeof window.__P__ === 'object' && window.__P__.data) ? window.__P__.data : window.__P__);
  document.getElementById('metaLeft').textContent = `${D.start || '--'} ~ ${D.end || '--'} · 共 ${D.days || 0} 天`;
  document.getElementById('title').textContent = D.title || '诊断';
  document.getElementById('sub').textContent = `窗口:${D.window || '自定义'} · 规则引擎取证`;
  document.getElementById('insight').innerHTML = `<b>💡 一句话洞察:</b> ${D.insight || '--'}`;

  document.getElementById('copyDxBtn').addEventListener('click', () => {
    const text = (D.findings || []).map((f, i) => `${i + 1}. ${f.cause}(${f.confidence}置信)\n   证据:${f.evidence}\n   建议:${f.action || '—'}`).join('\n')
      + `\n\n💡 ${D.insight || ''}`;
    window.copyText(text);
  });

  if (D.degraded) {
    const d = document.getElementById('degrade');
    d.style.display = '';
    d.textContent = '⚠️ ' + (D.degrade_msg || '数据不足,已降级');
  }

  const box = document.getElementById('findings');
  (D.findings || []).forEach((f, i) => {
    const conf = f.confidence || '中';
    const confClass = conf === '高' ? 'conf-高' : conf === '低' ? 'conf-低' : 'conf-中';
    const actionHtml = f.action ? `<div class="action"><b>👉 行动建议:</b> ${f.action.replace(/</g, '&lt;')}</div>` : '';
    box.insertAdjacentHTML('beforeend', `
      <div class="finding">
        <h3><span>${i + 1}. ${f.cause.replace(/</g, '&lt;')}</span><span class="conf ${confClass}">${conf}置信</span></h3>
        <div class="evidence">📋 ${f.evidence.replace(/</g, '&lt;')}</div>
        ${actionHtml}
      </div>`);
  });

  document.getElementById('srcLine').textContent = `📊 自动分析 · ${D.title} · render_analysis.py --view anomaly`;})();


</script>
<div id="actionbar-zone"></div>

<script>(function(){var z=document.getElementById('actionbar-zone');if(z&&window.actionBar&&window.__P__){z.innerHTML=window.actionBar(window.__P__);}})();</script>
</body>
</html>
