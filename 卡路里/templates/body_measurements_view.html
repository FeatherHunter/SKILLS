<!doctype html>
<html lang="zh-CN">
<head>
<style><!--SHARED-CSS--></style>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>围度 · 卡路里</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --fg: #1d1d1d; --fg2: #6e6e73; --fg3: #86868b;
    --bg: #f5f5f7; --card: #fff; --border: #e3e3e8;
    --accent: #0071e3; --accent-soft: #e3f0ff; --red: #ff3b30; --soft: #f2f2f7;
    --green: #34c759; --shadow: 0 1px 2px rgba(0,0,0,.05), 0 4px 16px rgba(0,0,0,.06);
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    line-height: 1.6; color: var(--fg); background: var(--bg);
    max-width: 760px; margin: 0 auto; padding: 24px 16px 40px;
    -webkit-font-smoothing: antialiased;
  }
  /* 08 规范骨架:头部 = 场景名 + 唤醒词 + 时间戳 + 阶段指示 */
  .head { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 16px; }
  .head .h-icon {
    flex: 0 0 auto; width: 44px; height: 44px; border-radius: 12px;
    background: linear-gradient(135deg, #0071e3, #2aa4ff); color: #fff;
    display: flex; align-items: center; justify-content: center; font-size: 22px;
    box-shadow: 0 4px 10px rgba(0,113,227,.25);
  }
  .head h1 { font-size: 24px; font-weight: 700; letter-spacing: -.02em; line-height: 1.25; }
  .head .meta { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .head .chip {
    font-size: 11px; color: var(--fg2); background: #fff; border: 1px solid var(--border);
    border-radius: 999px; padding: 2px 10px; font-family: ui-monospace, Menlo, monospace;
  }
  .head .chip.wake { color: var(--accent); border-color: #cfe2ff; background: var(--accent-soft); font-family: inherit; }
  .head .chip.stage { color: var(--green); border-color: #c9efd2; background: #eafaf0; font-family: inherit; }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    padding: 16px 18px; margin-bottom: 14px; box-shadow: var(--shadow);
  }
  .card h2 { font-size: 15px; font-weight: 600; margin-bottom: 12px; }
  .kpi-row { display: flex; gap: 10px; flex-wrap: wrap; }
  .kpi { flex: 1; min-width: 88px; background: var(--soft); border-radius: 12px; padding: 12px; text-align: center; }
  .kpi .v { font-size: 22px; font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; }
  .kpi .l { font-size: 11.5px; color: var(--fg3); margin-top: 2px; }
  .kpi .v.down { color: var(--green); }
  .kpi .v.up { color: var(--red); }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .chip { padding: 6px 14px; border-radius: 999px; border: 1px solid var(--border); background: var(--card); font-size: 13px; cursor: pointer; color: var(--fg2); transition: all .15s; }
  .chip:hover { border-color: var(--accent); color: var(--accent); }
  .chip.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .table-scroll table { min-width: 560px; border-collapse: collapse; font-size: 13px; }
  .table-scroll th, .table-scroll td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  .table-scroll th { color: var(--fg3); font-weight: 500; font-size: 12px; background: var(--soft); position: sticky; top: 0; }
  .table-scroll tbody tr:hover { background: #f7f9ff; }
  .table-scroll tr:last-child td { border-bottom: none; }
  .empty { text-align: center; color: var(--fg3); padding: 28px 0; font-size: 13.5px; }
  .empty .go { margin-top: 10px; display: inline-block; color: var(--accent); font-size: 13px; }
  .tip { background: rgba(0,113,227,.06); border-left: 3px solid var(--accent); border-radius: 8px; padding: 10px 14px; font-size: 12.5px; color: var(--fg2); }
  .note { font-size: 12px; color: var(--fg3); margin-top: 6px; }
  .delta { font-weight: 700; font-variant-numeric: tabular-nums; }
  .delta.neg { color: var(--green); }
  .delta.pos { color: var(--red); }
  .compare-summary { background: var(--accent-soft); border: 1px solid var(--accent); border-radius: 12px; padding: 14px 16px; margin-bottom: 12px; }
  .compare-summary .cs-big { font-size: 16px; font-weight: 600; }
  .compare-summary .cs-sub { font-size: 12px; color: var(--fg3); margin-top: 4px; }

  /* 图表(#317 迁 Base charts.js, 样式由组件自注入) */
  .chart { width: 100%; }

  /* 当前值锚点(2026-08-05 图表价值提升) */
  .current-anchor {
    display: flex; align-items: center; justify-content: space-between;
    background: linear-gradient(135deg, var(--accent-soft), #f7fbff);
    border: 1px solid #cfe2ff; border-radius: 12px; padding: 12px 16px;
  }
  .ca-label { font-size: 11px; color: var(--fg3); }
  .ca-value { font-size: 26px; font-weight: 700; color: var(--fg); font-variant-numeric: tabular-nums; }
  .ca-unit { font-size: 13px; color: var(--fg3); margin-left: 4px; font-weight: 500; }
  .ca-delta { font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .ca-delta .delta { font-size: 15px; }
  .ca-sub { font-size: 11px; color: var(--fg3); text-align: right; }

  /* 点按 tooltip(移动端) */
  .chart-tip {
    position: absolute; background: rgba(29,29,31,.94); color: #fff; border-radius: 8px;
    padding: 6px 10px; font-size: 12px; z-index: 20; pointer-events: none;
    box-shadow: 0 4px 12px rgba(0,0,0,.2); white-space: nowrap;
  }
  .chart { position: relative; }

  /* 叠加对比模式 */
  .mode-toggle {
    padding: 4px 12px; border: 1px solid var(--accent); background: #fff; color: var(--accent);
    border-radius: 999px; font-size: 12px; font-weight: 600; cursor: pointer; transition: all .15s;
  }
  .mode-toggle.on { background: var(--accent); color: #fff; }
  .chart .dot.multi { stroke-width: 2; }
  .legend { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 8px; }
  .legend .lg-item { display: flex; align-items: center; gap: 5px; font-size: 11.5px; color: var(--fg2); }
  .legend .lg-dot { width: 10px; height: 10px; border-radius: 3px; }

  /* 08 规范:复制数据/复制日志 + toast */
  .copy-bar {
    margin-top: 18px;
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    padding: 14px 16px;
  }
  .copy-bar .inner { max-width: 760px; margin: 0 auto; display: flex; gap: 8px; }
  .copy-bar .btn {
    flex: 1; min-height: 42px; border: 1px solid var(--border); background: var(--card);
    border-radius: 10px; font-size: 13.5px; font-weight: 600; cursor: pointer; color: var(--fg);
    transition: all .15s;
  }
  .copy-bar .btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .copy-bar .btn-primary:hover { background: #005bb0; }
  .copy-bar .btn:hover { background: var(--soft); }
  .copy-bar .btn.copied { background: var(--green); color: #fff; border-color: var(--green); }
  #toast {
    position: fixed; left: 50%; bottom: 76px; transform: translateX(-50%) translateY(8px);
    background: rgba(29,29,31,.92); color: #fff; padding: 10px 18px; border-radius: 999px;
    font-size: 13px; font-weight: 500; opacity: 0; pointer-events: none; z-index: 99;
    transition: opacity .25s, transform .25s; max-width: 86vw; text-align: center;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  @media (max-width: 640px) {
    body { padding: 18px 12px 96px; }
    .head h1 { font-size: 21px; }
    .table-scroll th, .table-scroll td { padding: 8px 7px; font-size: 12px; }
    /* 手机端:宽表改卡片布局(2026-08-05 验收反馈:不要横向拖动) */
    .table-scroll { display: none; }
    .card-list { display: block; }
  }
  @media (min-width: 641px) {
    .card-list { display: none; }
  }
  .card-list .rec-card {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 12px 14px; margin-bottom: 10px; box-shadow: var(--shadow);
  }
  .card-list .rec-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .card-list .rec-date { font-size: 14px; font-weight: 700; }
  .card-list .rec-note { font-size: 11px; color: var(--fg3); max-width: 55%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card-list .rec-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; }
  .card-list .rec-item { display: flex; justify-content: space-between; font-size: 12.5px; padding: 4px 8px; background: var(--soft); border-radius: 7px; }
  .card-list .rec-item .k { color: var(--fg3); }
  .card-list .rec-item .v { font-weight: 600; font-variant-numeric: tabular-nums; }
  .card-list .rec-empty { color: var(--fg3); font-size: 12px; padding: 4px 0; }
</style>
</head>
<body>

<div class="head">
  <div class="h-icon">📐</div>
  <div>
    <h1 id="sceneTitle">围度</h1>
    <div class="meta" id="metaBar"></div>
  </div>
</div>

<div id="listMode">
  <div class="card">
    <h2>部位筛选</h2>
    <div class="chips" id="metricChips"></div>
    <div class="tip">只看某部位的历史:选中部位后仅显示该部位非空的测量日。</div>
  </div>
  <div class="card">
    <h2>历史记录</h2>
    <div id="histTableWrap"></div>
  </div>
</div>

<div id="trendMode" style="display:none">
  <div class="card">
    <h2 style="display:flex;align-items:center;justify-content:space-between;">
      <span>部位选择</span>
      <button class="mode-toggle" id="multiToggle">🔀 叠加对比</button>
    </h2>
    <div class="chips" id="trendMetricChips"></div>
    <p class="note" id="trendSelNote"></p>
  </div>
  <div class="card" id="currentAnchorCard" style="display:none">
    <div class="current-anchor">
      <div>
        <div class="ca-label" id="caLabel">当前值</div>
        <div class="ca-value"><span id="caValue">—</span><span class="ca-unit" id="caUnit"></span></div>
      </div>
      <div class="ca-delta" id="caDelta"></div>
    </div>
  </div>
  <div class="card">
    <h2>趋势 KPI</h2>
    <div class="kpi-row">
      <div class="kpi"><div class="v" id="tDelta">—</div><div class="l">📉 区间变化 Δ</div></div>
      <div class="kpi"><div class="v" id="tAvg">—</div><div class="l">⚖️ 平均值</div></div>
      <div class="kpi"><div class="v" id="tMin">—</div><div class="l">▾ 最低</div></div>
      <div class="kpi"><div class="v" id="tMax">—</div><div class="l">▴ 最高</div></div>
    </div>
  </div>
  <div class="card">
    <h2>折线图</h2>
    <div class="chart" id="trendChart"></div>
    <p class="note" id="trendNote"></p>
    <div class="chart-tip" id="chartTip" style="display:none"></div>
  </div>
</div>

<div id="compareMode" style="display:none">
  <div class="card">
    <h2>13 项围度变化</h2>
    <div id="compareWrap"></div>
  </div>
</div>

<script id="payload" type="application/json"><!--INJECT-DATA--></script><script><!--SHARED-HELPERS--></script><script><!--CHARTS-HELPERS--></script><script>window.__P__=(function(){try{return JSON.parse(document.getElementById('payload').textContent||'{}');}catch(e){return null;}})();</script>


<div id="toast"></div>

<script>
const DATA = (typeof window.__P__ === 'object' && window.__P__) || null;
  if (!DATA || DATA.status !== 'ok') { document.body.innerHTML = window.errorReceipt({message: '数据未注入或状态非 ok'}); throw new Error('payload-not-ok'); }
const D = DATA && DATA.data || {};
const META = D.meta || {};

function esc(s) { return String(s == null ? '—' : s); }
function deltaClass(v) { return v < 0 ? 'neg' : (v > 0 ? 'pos' : ''); }
function deltaSign(v) { return v > 0 ? '+' + v : v; }

// ---------- 08 规范头部 ----------
(function renderMeta() {
  const bar = document.getElementById('metaBar');
  const stage = D.mode === 'list' ? '查看' : D.mode === 'trend' ? '趋势' : '对比';
  bar.innerHTML = [
    `<span class="chip wake">⚡ ${esc(META.wake_word || '看围度')}</span>`,
    `<span class="chip stage">● ${stage}</span>`,
    `<span class="chip">🕒 ${esc(META.fetched_at || '')}</span>`,
  ].join('');
})();

// ---------- 08 规范:复制数据(5 段)/复制日志(6 段) ----------
function payloadData() {
  return {
    mode: D.mode,
    rows: D.rows || null,
    filter: D.filter || null,
    metric: D.metric || null,
    metric_label: D.metric_label || null,
    series: D.series || null,
    kpi: D.kpi || null,
    date1: D.date1 || null,
    date2: D.date2 || null,
    deltas: D.deltas || null,
    n_compared: D.n_compared || null,
  };
}


let _toastTimer = null;

// ---------- 图表 · #317 迁 Base charts.line(像素级自绘 → 组件) ----------
const PALETTE = ['#0071e3', '#ff9500', '#34c759', '#af52de', '#ff3b30', '#00c7be', '#ff2d55', '#5e5ce6'];
const chartTip = document.getElementById('chartTip');

function showChartTip(text, x, y) {
  chartTip.textContent = text;
  chartTip.style.display = 'block';
  chartTip.style.left = Math.min(x + 8, document.querySelector('.chart').clientWidth - 130) + 'px';
  chartTip.style.top = Math.max(y - 34, 0) + 'px';
}

function renderLineChart(el, rows, unit, color, showTip) {
  const vals = rows.map(r => r.avg_val).filter(v => v != null);
  if (!vals.length) { el.innerHTML = ''; return; }
  const mx = Math.max(...vals), mn = Math.min(...vals);
  const rng = (mx - mn) || 1;
  const pad = rng * 0.12;
  const yMin = mn - pad, yMax = mx + pad;
  const c = color || PALETTE[0];
  window.charts.line(el,
    rows.map(r => ({ label: r.date.slice(5), value: r.avg_val })),
    { height: el.clientWidth < 520 ? 180 : 220,
      yMin, yMax,
      area: true, showValues: false,
      labels: rows.length <= 8 ? 'all' : 'select',
      format: v => `${v}${unit}`,
      tooltip: true,
      color: c,
    });
}

// 多部位叠加图(2026-08-05) · #317 迁 Base charts.line 多序列
function renderMultiChart(el, seriesMap, unit) {
  const keys = Object.keys(seriesMap);
  if (!keys.length) { el.innerHTML = ''; return; }
  const allVals = keys.flatMap(k => (seriesMap[k].rows || []).map(r => r.avg_val).filter(v => v != null));
  if (!allVals.length) { el.innerHTML = ''; return; }
  const mx = Math.max(...allVals), mn = Math.min(...allVals);
  const rng = (mx - mn) || 1;
  const yMin = mn - rng * 0.12, yMax = mx + rng * 0.12;
  const series = keys.map((k, ki) => ({
    name: k,
    color: PALETTE[ki % PALETTE.length],
    items: (seriesMap[k].rows || []).map(r => ({ label: r.date.slice(5), value: r.avg_val })),
  })).filter(s => s.items.length >= 2);
  if (!series.length) { el.innerHTML = ''; return; }
  window.charts.line(el, series[0].items, {
    height: el.clientWidth < 520 ? 180 : 220,
    yMin, yMax,
    labels: 'select',
    format: v => `${v}${unit}`,
    tooltip: true,
    legend: true,
    series,
  });
  const oldLegend = el.nextElementSibling;
  if (oldLegend && oldLegend.classList && oldLegend.classList.contains('legend')) {
    oldLegend.remove();
  }
}

function kpiHtml(kpi, ids) {
  const dEl = document.getElementById(ids.delta);
  animateNum(dEl, kpi.delta, deltaSign);
  dEl.className = 'v ' + (kpi.delta != null ? deltaClass(kpi.delta) : '');
  animateNum(document.getElementById(ids.avg), kpi.avg);
  animateNum(document.getElementById(ids.min), kpi.min);
  animateNum(document.getElementById(ids.max), kpi.max);
}
// 数字滚动动画
function animateNum(el, val, fmt) {
  if (val == null) { el.textContent = '—'; return; }
  const target = fmt ? fmt(val) : val;
  const start = performance.now(), dur = 380;
  const numeric = parseFloat(target);
  function tick(now) {
    const t = Math.min((now - start) / dur, 1);
    const eased = 1 - Math.pow(1 - t, 3);
    const cur = numeric * eased;
    el.textContent = fmt ? fmt(cur) : (Math.round(cur * 100) / 100);
    if (t < 1) requestAnimationFrame(tick);
    else el.textContent = target;
  }
  requestAnimationFrame(tick);
}

if (D.mode === 'list') {
  document.getElementById('sceneTitle').textContent = '看围度';
  document.getElementById('listMode').style.display = '';
  const chips = document.getElementById('metricChips');
  const all = document.createElement('button');
  all.className = 'chip' + (!D.filter.active ? ' active' : '');
  all.textContent = '全部';
  all.onclick = () => { D.filter.active = ''; setChips(); renderHist(); };
  chips.appendChild(all);
  (D.filter.items || []).forEach(it => {
    const c = document.createElement('button');
    c.className = 'chip' + (it.value === D.filter.active ? ' active' : '');
    c.textContent = `${it.label} (${it.n})`;
    c.onclick = () => { D.filter.active = it.value; setChips(); renderHist(); };
    chips.appendChild(c);
  });
  function setChips() {
    [...chips.children].forEach(c => c.classList.remove('active'));
    const idx = D.filter.active ? (D.filter.items.findIndex(f => f.value === D.filter.active) + 1) : 0;
    if (chips.children[idx]) chips.children[idx].classList.add('active');
  }
  const wrap = document.getElementById('histTableWrap');
  function renderHist() {
    const activeCol = D.filter.active && D.metric_cli[D.filter.active];
    const rows = D.rows.filter(r => !activeCol || r[activeCol] != null);
    if (!rows.length) {
      wrap.innerHTML = window.emptyState({icon: '📐', text: '暂无记录', hint: '→ 记围度:量了哪项填哪项,第一条就是基线'});
      return;
    }
    // 桌面:宽表(横向滚动容器)
    let html = '<table><thead><tr><th>日期</th>';
    const cols = Object.keys(D.metric_labels);
    cols.forEach(c => { html += `<th>${D.metric_labels[c]}(cm)</th>`; });
    html += '<th>备注</th></tr></thead><tbody>';
    rows.forEach(r => {
      html += `<tr><td>${esc(r.date)}</td>`;
      cols.forEach(c => { html += `<td>${r[c] == null ? '—' : esc(r[c])}</td>`; });
      html += `<td>${esc(r.note)}</td></tr>`;
    });
    html += '</tbody></table>';
    // 手机:卡片布局(只展示已填部位,无横向拖动)
    let cards = '';
    rows.forEach(r => {
      const items = cols
        .filter(c => r[c] != null)
        .map(c => `<div class="rec-item"><span class="k">${D.metric_labels[c]}</span><span class="v">${esc(r[c])}cm</span></div>`)
        .join('');
      const noteTxt = r.note ? `<span class="rec-note">${esc(r.note)}</span>` : '';
      cards += `<div class="rec-card"><div class="rec-head"><span class="rec-date">${esc(r.date)}</span>${noteTxt}</div><div class="rec-grid">${items || '<div class="rec-empty">未填围度</div>'}</div></div>`;
    });
    wrap.innerHTML = `<div class="table-scroll">${html}</div><div class="card-list">${cards}</div>`;
  }
  renderHist();
}

if (D.mode === 'trend') {
  document.getElementById('sceneTitle').textContent = '看围度趋势';
  document.getElementById('listMode').style.display = 'none';
  document.getElementById('trendMode').style.display = '';
  const chips = document.getElementById('trendMetricChips');
  const active = D.metric;
  const selected = new Set([active]);
  let multiMode = false;

  Object.keys(D.series || {}).forEach(cli => {
    const c = document.createElement('button');
    c.className = 'chip' + (cli === active ? ' active' : '');
    c.textContent = D.series[cli].label;
    c.dataset.cli = cli;
    c.onclick = () => {
      if (multiMode) {
        if (selected.has(cli)) selected.delete(cli); else selected.add(cli);
        c.classList.toggle('active');
        renderTrend();
      } else {
        selected.clear(); selected.add(cli);
        [...chips.children].forEach(x => x.classList.remove('active'));
        c.classList.add('active');
        renderTrend();
      }
    };
    chips.appendChild(c);
  });

  const multiToggle = document.getElementById('multiToggle');
  multiToggle.onclick = () => {
    multiMode = !multiMode;
    multiToggle.classList.toggle('on', multiMode);
    multiToggle.textContent = multiMode ? '✓ 叠加中(点部位多选)' : '🔀 叠加对比';
    if (multiMode) {
      [...chips.children].forEach(x => x.classList.add('active'));
      selected.clear();
      Object.keys(D.series || {}).forEach(cli => selected.add(cli));
    } else {
      [...chips.children].forEach(x => x.classList.remove('active'));
      selected.clear(); selected.add(active);
      [...chips.children].forEach(x => { if (x.dataset.cli === active) x.classList.add('active'); });
    }
    renderTrend();
  };

  const chart = document.getElementById('trendChart');
  const selNote = document.getElementById('trendSelNote');
  const anchorCard = document.getElementById('currentAnchorCard');

  function kpiFor(rows) {
    const values = rows.map(r => r.avg_val).filter(v => v != null);
    return {
      count: values.length,
      avg: values.length ? Math.round(values.reduce((a, b) => a + b, 0) / values.length * 100) / 100 : null,
      min: values.length ? Math.min(...values) : null,
      max: values.length ? Math.max(...values) : null,
      delta: values.length >= 2 ? Math.round((values[values.length - 1] - values[0]) * 100) / 100 : null,
    };
  }
  function renderAnchor(rows, label, unit) {
    if (!rows.length) { anchorCard.style.display = 'none'; return; }
    const last = rows[rows.length - 1];
    const prev = rows.length >= 2 ? rows[rows.length - 2] : null;
    anchorCard.style.display = '';
    document.getElementById('caLabel').textContent = label + ' · 当前';
    document.getElementById('caValue').textContent = last.avg_val;
    document.getElementById('caUnit').textContent = unit;
    const dEl = document.getElementById('caDelta');
    if (prev) {
      const d = Math.round((last.avg_val - prev.avg_val) * 100) / 100;
      dEl.innerHTML = `<span class="delta ${deltaClass(d)}">${deltaSign(d)}</span><div class="ca-sub">较上次(${prev.date.slice(5)})</div>`;
    } else {
      dEl.innerHTML = '<span class="delta">首次记录</span>';
    }
  }
  function renderTrend() {
    chart.innerHTML = '';
    const legend = chart.parentElement.querySelector('.legend');
    if (legend) legend.remove();
    selNote.textContent = multiMode ? `已选 ${selected.size} 个部位,同图叠加对比` : '';
    if (multiMode) {
      const map = {};
      selected.forEach(cli => { if (D.series[cli]) map[D.series[cli].label] = D.series[cli]; });
      if (selected.size < 2) {
        chart.innerHTML = window.emptyState({text: '叠加模式请至少选 2 个部位'});
        anchorCard.style.display = 'none';
        kpiHtml({delta: null, avg: null, min: null, max: null}, {delta:'tDelta', avg:'tAvg', min:'tMin', max:'tMax'});
        return;
      }
      renderMultiChart(chart, map, 'cm');
      anchorCard.style.display = 'none';
      kpiHtml({delta: null, avg: null, min: null, max: null}, {delta:'tDelta', avg:'tAvg', min:'tMin', max:'tMax'});
      document.getElementById('trendNote').textContent = '叠加对比:同图多部位走势,可比较变化节奏';
      return;
    }
    const cli = [...selected][0];
    const s = D.series[cli] || {label: '', rows: []};
    const rows = s.rows || [];
    if (!rows.length) {
      chart.innerHTML = window.emptyState({text: '该部位暂无趋势数据'});
      document.getElementById('trendNote').textContent = '';
      anchorCard.style.display = 'none';
      kpiHtml({delta: null, avg: null, min: null, max: null}, {delta:'tDelta', avg:'tAvg', min:'tMin', max:'tMax'});
      return;
    }
    renderLineChart(chart, rows, 'cm', PALETTE[0], true);
    kpiHtml(kpiFor(rows), {delta:'tDelta', avg:'tAvg', min:'tMin', max:'tMax'});
    renderAnchor(rows, s.label, 'cm');
    document.getElementById('trendNote').textContent =
      `${rows.length} 个测量日 · 最近 ${D.days} 天 · ${s.label}`;
  }
  renderTrend();
}

if (D.mode === 'compare') {
  document.getElementById('sceneTitle').textContent = '对比围度';
  document.getElementById('listMode').style.display = 'none';
  document.getElementById('compareMode').style.display = '';
  const wrap = document.getElementById('compareWrap');
  if (D.error) { wrap.innerHTML = window.emptyState({text: esc(D.error)}); }
  else if (!D.deltas || !D.deltas.length) { wrap.innerHTML = window.emptyState({text: '两个日期无共同可对比部位'}); }
  else {
    const top = D.deltas[0];
    let html = `<div class="compare-summary"><div class="cs-big">最大变化 <strong>${esc(top.label)}</strong> <span class="delta ${deltaClass(top.delta)}">${deltaSign(top.delta)}cm</span></div><div class="cs-sub">共 ${D.n_compared} 项可对比 · ${esc(D.date1)} → ${esc(D.date2)}</div></div>`;
    html += `<div class="tip">13 项围度变化,按变化幅度从大到小排列</div><table><thead><tr><th>部位</th><th>${esc(D.date1)}(cm)</th><th>${esc(D.date2)}(cm)</th><th>Δ(cm)</th><th>变化率</th></tr></thead><tbody>`;
    D.deltas.forEach(d => {
      html += `<tr><td>${d.label}</td><td>${d.before}</td><td>${d.after}</td>` +
              `<td class="delta ${deltaClass(d.delta)}">${deltaSign(d.delta)}</td>` +
              `<td class="delta ${deltaClass(d.delta)}">${d.pct == null ? '—' : deltaSign(d.pct) + '%'}</td></tr>`;
    });
    html += '</tbody></table>';
    wrap.innerHTML = `<div class="table-scroll">${html}</div>`;
  }
}

// 窗口 resize → 图表像素级重绘
let _resizeTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(_resizeTimer);
  _resizeTimer = setTimeout(() => {
    if (D.mode === 'trend') {
      const chartEl = document.getElementById('trendChart');
      const legend = chartEl.parentElement.querySelector('.legend');
      if (legend) legend.remove();
      if (multiMode) {
        const map = {};
        selected.forEach(cli => { if (D.series[cli]) map[D.series[cli].label] = D.series[cli]; });
        if (selected.size >= 2) renderMultiChart(chartEl, map, 'cm');
      } else {
        const cli = [...selected][0];
        const s = D.series && D.series[cli] || {rows: []};
        if (s.rows && s.rows.length) renderLineChart(chartEl, s.rows, 'cm', PALETTE[0], true);
      }
    }
  }, 150);
});
</script>
