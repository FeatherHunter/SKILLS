<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>记围度 · 卡路里</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --fg: #1d1d1d; --fg2: #6e6e73; --fg3: #86868b;
    --bg: #fafafa; --card: #fff; --border: #d2d2d7;
    --accent: #0071e3; --red: #ff3b30; --soft: #f5f5f7;
    --green: #34c759;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    line-height: 1.6; color: var(--fg); background: var(--bg);
    max-width: 800px; margin: 0 auto; padding: 32px 20px 80px;
    -webkit-font-smoothing: antialiased;
  }
  h1 { font-size: 30px; font-weight: 700; letter-spacing: -.025em; margin-bottom: 4px; }
  .sub { font-size: 14px; color: var(--fg3); margin-bottom: 20px; }

  .tip {
    background: rgba(0,113,227,.06); border-left: 3px solid var(--accent); border-radius: 6px;
    padding: 12px 16px; margin-bottom: 16px; font-size: 13px; color: var(--fg2); line-height: 1.7;
  }
  .tip strong { color: var(--accent); }

  .section { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 20px 22px; margin-bottom: 14px; }
  .section h2 { font-size: 16px; font-weight: 600; margin-bottom: 12px; }

  .form-group { margin-bottom: 14px; }
  .form-group label { display: block; font-size: 13px; color: var(--fg2); margin-bottom: 6px; font-weight: 500; }
  .form-group label .required { color: var(--red); }
  .form-group input, .form-group select, .form-group textarea {
    width: 100%; padding: 9px 12px; border: 1px solid var(--border); border-radius: 7px;
    font-size: 14px; font-family: inherit; background: #fff; color: var(--fg);
  }
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
    outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(0,113,227,.1);
  }
  .form-group textarea { min-height: 60px; resize: vertical; font-family: inherit; }
  .form-group .hint { font-size: 11px; color: var(--fg3); margin-top: 4px; line-height: 1.5; }

  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  .tag-chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .tag-chip {
    padding: 5px 12px; border: 1px solid var(--border); background: var(--card);
    border-radius: 999px; font-size: 12px; cursor: pointer; user-select: none;
  }
  .tag-chip.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .tag-chip:hover:not(.active) { background: var(--soft); }

  .prompt-box {
    background: #1d1d1f; color: #f5f5f7; padding: 18px 22px; border-radius: 12px;
    font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12.5px;
    line-height: 1.7; white-space: pre-wrap; word-break: break-word;
    min-height: 120px; margin-bottom: 12px;
  }

  .footer { margin-top: 24px; padding: 16px 18px; background: var(--soft); border-radius: 12px; font-size: 12px; color: var(--fg3); }

  .btn-copy {
    width: 100%; padding: 14px; border: none; background: var(--accent);
    color: #fff; border-radius: 10px; font-size: 15px; font-weight: 600;
    cursor: pointer; transition: all .15s;
  }
  .btn-copy:hover { background: #005bb5; }
  .btn-copy.copied { background: var(--green); }
</style>
</head>
<body>

<h1>📏 记围度</h1>
<p class="sub">配置型向导 · 填好围度后复制 prompt 给 AI 执行</p>

<div class="tip">
  <strong>ℹ️ 工作流</strong>:填日期 → 填至少 1 个围度(cm) → 加备注 → 点下方"📋 复制 prompt 给 AI" → AI 收到后调 <code>body_measurements.py add</code> 写入数据库。
</div>

<div class="section">
  <h2>1️⃣ 日期</h2>
  <div class="form-group">
    <label>测量日期<span class="required"> *</span></label>
    <input type="date" id="measureDate">
    <div class="hint">默认今天,可在改写</div>
  </div>
  <div class="form-group">
    <label>场景标签(tag)</label>
    <div class="tag-chips" id="tagChips">
      <span class="tag-chip" data-tag="围度测">围度测</span>
      <span class="tag-chip" data-tag="减脂期">减脂期</span>
      <span class="tag-chip" data-tag="增肌期">增肌期</span>
      <span class="tag-chip" data-tag="晨起空腹">晨起空腹</span>
      <span class="tag-chip" data-tag="训练前">训练前</span>
      <span class="tag-chip" data-tag="训练后">训练后</span>
    </div>
    <input type="text" id="customTag" placeholder="或自定义 tag" maxlength="20" style="margin-top:6px">
  </div>
</div>

<div class="section">
  <h2>2️⃣ 围度(cm,至少填 1 项)</h2>

  <div class="form-row">
    <div class="form-group">
      <label>胸围 chest</label>
      <input type="number" id="chest_cm" step="0.1" min="20" max="200" placeholder="如 95.0">
    </div>
    <div class="form-group">
      <label>腰围 waist</label>
      <input type="number" id="waist_cm" step="0.1" min="20" max="200" placeholder="如 75.0">
    </div>
  </div>

  <div class="form-row">
    <div class="form-group">
      <label>腹围 abdomen</label>
      <input type="number" id="abdomen_cm" step="0.1" min="20" max="200" placeholder="如 78.0">
    </div>
    <div class="form-group">
      <label>臀围 hip</label>
      <input type="number" id="hip_cm" step="0.1" min="20" max="200" placeholder="如 92.0">
    </div>
  </div>

  <div class="form-row">
    <div class="form-group">
      <label>左大腿 left_thigh</label>
      <input type="number" id="left_thigh_cm" step="0.1" min="10" max="100" placeholder="如 55.0">
    </div>
    <div class="form-group">
      <label>右大腿 right_thigh</label>
      <input type="number" id="right_thigh_cm" step="0.1" min="10" max="100" placeholder="如 55.0">
    </div>
  </div>

  <div class="form-row">
    <div class="form-group">
      <label>左小腿 left_calf</label>
      <input type="number" id="left_calf_cm" step="0.1" min="10" max="80" placeholder="如 36.0">
    </div>
    <div class="form-group">
      <label>右小腿 right_calf</label>
      <input type="number" id="right_calf_cm" step="0.1" min="10" max="80" placeholder="如 36.0">
    </div>
  </div>

  <div class="form-row">
    <div class="form-group">
      <label>左臂 left_arm</label>
      <input type="number" id="left_arm_cm" step="0.1" min="10" max="60" placeholder="如 32.0">
    </div>
    <div class="form-group">
      <label>右臂 right_arm</label>
      <input type="number" id="right_arm_cm" step="0.1" min="10" max="60" placeholder="如 32.0">
    </div>
  </div>

  <div class="form-row">
    <div class="form-group">
      <label>左前臂 left_forearm</label>
      <input type="number" id="left_forearm_cm" step="0.1" min="10" max="50" placeholder="如 26.0">
    </div>
    <div class="form-group">
      <label>右前臂 right_forearm</label>
      <input type="number" id="right_forearm_cm" step="0.1" min="10" max="50" placeholder="如 26.0">
    </div>
  </div>

  <div class="form-group">
    <label>肩宽 shoulder</label>
    <input type="number" id="shoulder_cm" step="0.1" min="20" max="200" placeholder="如 45.0">
  </div>
</div>

<div class="section">
  <h2>3️⃣ 备注(可选)</h2>
  <div class="form-group">
    <textarea id="note" placeholder="例:7/1 早上空腹 / 减脂期第 30 天 / 体脂钳测同日"></textarea>
  </div>
</div>

<div class="section">
  <h2>📋 复制 prompt 给 AI</h2>
  <div class="prompt-box" id="promptBox">// 完成上方表单后,prompt 自动生成</div>
  <button class="btn-copy" id="copyBtn">📋 复制 prompt 给 AI</button>
</div>

<div class="footer">卡路里 · body_measurements_wizard v1.0</div>

<script>
(function(){
  const measureDate = document.getElementById('measureDate');
  const tagChips = document.getElementById('tagChips');
  const customTag = document.getElementById('customTag');
  const noteEl = document.getElementById('note');
  const promptBox = document.getElementById('promptBox');
  const copyBtn = document.getElementById('copyBtn');

  const FIELDS = [
    'chest_cm','waist_cm','abdomen_cm','hip_cm',
    'left_thigh_cm','right_thigh_cm',
    'left_calf_cm','right_calf_cm',
    'left_arm_cm','right_arm_cm',
    'left_forearm_cm','right_forearm_cm',
    'shoulder_cm',
  ];

  let activeTag = '';

  // 默认今天
  measureDate.value = new Date().toISOString().slice(0, 10);

  tagChips.querySelectorAll('.tag-chip').forEach(chip => {
    chip.onclick = () => {
      tagChips.querySelectorAll('.tag-chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      activeTag = chip.dataset.tag;
      customTag.value = '';
      updatePrompt();
    };
  });

  customTag.oninput = () => {
    if (customTag.value) {
      tagChips.querySelectorAll('.tag-chip').forEach(c => c.classList.remove('active'));
      activeTag = customTag.value;
      updatePrompt();
    }
  };

  function getCurrentTag() {
    return (customTag.value || activeTag || '').trim();
  }

  function getFilledMetrics() {
    const out = {};
    FIELDS.forEach(f => {
      const v = document.getElementById(f).value.trim();
      if (v !== '') out[f] = v;
    });
    return out;
  }

  function buildPrompt() {
    const date = measureDate.value;
    const tag = getCurrentTag();
    const note = noteEl.value.trim();
    const metrics = getFilledMetrics();
    const filledKeys = Object.keys(metrics);

    if (!date) return '// 请填日期(上方第 1 步)';
    if (filledKeys.length === 0) return '// 请至少填 1 个围度(上方第 2 步)';

    const argsList = [`--date ${date}`];
    if (tag) argsList.push(`--tag "${tag}"`);
    filledKeys.forEach(k => argsList.push(`--${k} ${metrics[k]}`));
    if (note) argsList.push(`--note "${note.replace(/"/g, '\\"')}"`);

    const metricsText = filledKeys.map(k => `  - ${k}: ${metrics[k]} cm`).join('\n');

    return `请帮我记录围度到卡路里

参数:
- 日期:${date}
${tag ? `- tag:${tag}` : ''}
- 围度(${filledKeys.length} 项):
${metricsText}
${note ? `- 备注:${note}` : ''}

命令:
\`\`\`bash
python scripts/body_measurements.py add ${argsList.join(' ')}
\`\`\`

完成后用 crud_receipt.html 返回回执。`;
  }

  function updatePrompt() {
    promptBox.textContent = buildPrompt();
  }

  // 监听所有变化
  measureDate.oninput = updatePrompt;
  noteEl.oninput = updatePrompt;
  FIELDS.forEach(f => {
    document.getElementById(f).addEventListener('input', updatePrompt);
  });

  copyBtn.onclick = function() {
    const text = promptBox.textContent;
    if (text.startsWith('// 请')) {
      alert('请先填好所有必填项');
      return;
    }
    navigator.clipboard.writeText(text).then(() => {
      this.textContent = '✓ 已复制';
      this.classList.add('copied');
      setTimeout(() => {
        this.textContent = '📋 复制 prompt 给 AI';
        this.classList.remove('copied');
      }, 2000);
    });
  };

  // 初始
  updatePrompt();
})();
</script>

<!--INJECT-DATA-->

</body>
</html>
