<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>卡路里 · 对比两张照片</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --fg:#1d1d1d; --fg2:#6e6e73; --fg3:#86868b; --bg:#fafafa;
    --card:#fff; --border:#d2d2d7; --accent:#0071e3;
    --good:#34c759; --warn:#ff9500; --bad:#ff3b30; --soft:#f5f5f7;
  }
  body { font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
         line-height:1.6; color:var(--fg); background:var(--bg);
         max-width:860px; margin:0 auto; padding:40px 20px 80px;
         -webkit-font-smoothing:antialiased; }
  .meta-bar { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
  .meta-bar .left { font-size:12px; color:var(--fg2); }
  .meta-bar .type-badge { font-size:11px; padding:3px 10px; border-radius:6px; background:var(--accent); color:#fff; font-weight:700; }
  h1 { font-size:28px; font-weight:700; letter-spacing:-.025em; margin-bottom:4px; }
  .sub { font-size:14px; color:var(--fg3); margin-bottom:20px; }
  /* 间隔天数横幅 */
  .interval-banner { background:linear-gradient(135deg,#e8f5e8,#f0f8ff); border:1px solid var(--good);
                     border-radius:14px; padding:14px 20px; text-align:center; margin-bottom:20px; font-size:14px; }
  .interval-banner b { font-size:26px; color:var(--good); font-variant-numeric:tabular-nums; }
  /* 并排 */
  .compare { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  .photo-card { background:var(--card); border:1px solid var(--border); border-radius:16px; overflow:hidden; }
  .photo-card .imgwrap { aspect-ratio:3/4; background:var(--soft); display:flex; align-items:center; justify-content:center; }
  .photo-card img { width:100%; height:100%; object-fit:cover; display:block; }
  .photo-card .broken { color:var(--fg3); font-size:13px; padding:20px; text-align:center; }
  .photo-card .cap { padding:12px 14px; }
  .photo-card .cap .who { font-size:12px; font-weight:700; color:var(--fg2); margin-bottom:4px; }
  .photo-card .cap .date { font-size:16px; font-weight:700; }
  .photo-card .cap .tags { margin-top:6px; }
  .photo-card .cap .tags span { display:inline-block; background:rgba(0,113,227,.12); color:var(--accent);
                                border-radius:8px; padding:1px 8px; margin-right:4px; font-size:11px; }
  .photo-card .cap .note { font-size:12px; color:var(--fg3); margin-top:6px; }
  .vs-badge { font-size:15px; font-weight:800; color:var(--fg3); }
  /* Footer 按钮 */
  .footer { margin-top:24px; padding:16px 18px; background:var(--soft); border-radius:12px; display:flex; justify-content:flex-end; }
  .footer .btn-group { display:flex; gap:8px; flex-wrap:wrap; }
  .btn { border:1px solid var(--border); background:var(--card); padding:8px 16px; border-radius:8px;
         cursor:pointer; font-size:13px; color:var(--fg); min-height:36px; }
  .btn:hover { background:var(--accent); color:#fff; border-color:var(--accent); }
  .btn-primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  .btn-primary:hover { background:#005bb0; }
  @media (max-width:640px) {
    body { padding:20px 14px 80px; }
    h1 { font-size:22px; }
    .compare { grid-template-columns:1fr; gap:12px; }  /* 窄屏单列 */
    .footer .btn-group { justify-content:stretch; }
    .footer .btn-group .btn { flex:1 1 45%; min-height:44px; }
  }
</style>
</head>
<body>

<!--INJECT-DATA-->

<div class="meta-bar">
  <div class="left" id="metaLeft">--</div>
  <div class="type-badge">结果型 · 对比两张照片</div>
</div>

<h1>🆚 对比两张照片</h1>
<p class="sub" id="sub">--</p>

<div class="interval-banner" id="banner">间隔 <b id="intervalDays">--</b> 天</div>

<div class="compare">
  <div class="photo-card">
    <div class="imgwrap" id="img1"></div>
    <div class="cap">
      <div class="who">照片 1</div>
      <div class="date" id="date1">--</div>
      <div class="tags" id="tags1"></div>
      <div class="note" id="note1"></div>
    </div>
  </div>
  <div class="photo-card">
    <div class="imgwrap" id="img2"></div>
    <div class="cap">
      <div class="who">照片 2</div>
      <div class="date" id="date2">--</div>
      <div class="tags" id="tags2"></div>
      <div class="note" id="note2"></div>
    </div>
  </div>
</div>

<div class="footer">
  <div class="btn-group">
    <button class="btn" id="copyDataBtn">📋 复制数据</button>
    <button class="btn btn-primary" id="copyLogBtn">📋 复制日志</button>
  </div>
</div>

<script>
(function(){
  const D = window.__DATA__;
  if (!D || D.status !== 'ok') {
    document.body.innerHTML = '<div style="padding:60px;text-align:center;color:#86868b">⚠ 数据未注入或状态非 ok</div>';
    return;
  }
  const d = D.data;
  const meta = d.meta;
  document.getElementById('metaLeft').textContent = meta.action_at;
  document.getElementById('sub').textContent = `照片 #${d.photo1.id} vs #${d.photo2.id} · 间隔 ${d.interval_days} 天`;
  document.getElementById('intervalDays').textContent = d.interval_days;

  function fill(which, p) {
    const imgWrap = document.getElementById('img' + which);
    imgWrap.innerHTML = p.photo_data_base64
      ? `<img src="${p.photo_data_base64}" alt="照片 ${p.id}">`
      : `<div class="broken">📷 无图</div>`;
    document.getElementById('date' + which).textContent = `${p.date} ${p.time || ''}`;
    document.getElementById('tags' + which).innerHTML =
      (p.tag_list || []).map(t => `<span>${t}</span>`).join('') || '<span style="font-size:11px;color:var(--fg3)">无标签</span>';
    document.getElementById('note' + which).textContent = p.note ? '📝 ' + p.note : '';
  }
  fill(1, d.photo1);
  fill(2, d.photo2);

  // 复制工具
  function showToast(msg) {
    let t = document.getElementById('copyToast');
    if (!t) {
      t = document.createElement('div');
      t.id = 'copyToast';
      t.style.cssText = 'position:fixed;left:50%;bottom:24px;transform:translateX(-50%);' +
        'background:rgba(28,28,30,.92);color:#fff;padding:10px 18px;border-radius:10px;' +
        'font-size:13px;z-index:999;max-width:86vw;text-align:center;';
      document.body.appendChild(t);
    }
    t.textContent = msg; t.style.display = 'block';
    clearTimeout(t._timer); t._timer = setTimeout(() => { t.style.display = 'none'; }, 3200);
  }
  function fallbackCopy(text) {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.focus(); ta.select();
    try { document.execCommand('copy'); } catch(e) {}
    document.body.removeChild(ta);
  }
  function copyText(text, btn, okMsg) {
    const after = () => {
      const orig = btn.textContent; btn.textContent = '✓ 已复制';
      setTimeout(() => btn.textContent = orig, 2000); showToast(okMsg);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(after).catch(() => { fallbackCopy(text); after(); });
    } else { fallbackCopy(text); after(); }
  }
  function fmt(p) {
    return `#${p.id} ${p.date} ${p.time || ''} | ${(p.tag_list || []).join('、') || '无标签'}` +
      (p.note ? ` | ${p.note}` : '');
  }
  function buildDataText() {
    return [
      `对比两张照片(${meta.action_at})`,
      '',
      `间隔天数: ${d.interval_days}`,
      `照片 1: ${fmt(d.photo1)}`,
      `照片 2: ${fmt(d.photo2)}`,
    ].join('\n');
  }
  function buildLogText() {
    const lines = [`[对比两张照片 排障日志]`, ''];
    lines.push(`唤醒词: ${meta.wake_word || '(未知)'}`);
    lines.push(`渲染命令: ${meta.render_cmd || '(未知)'}`);
    lines.push(`数据来源: ${meta.source || '(未知)'}`);
    lines.push(`操作时间: ${meta.action_at || '(未知)'}`);
    lines.push('');
    lines.push('AI 思考链:');
    lines.push(meta.chain || '(未注入 · 渲染时未传 --chain)');
    lines.push('');
    lines.push('原始数据:');
    lines.push(JSON.stringify({photo1: {...d.photo1, photo_data_base64: undefined}, photo2: {...d.photo2, photo_data_base64: undefined}, interval_days: d.interval_days}, null, 2));
    return lines.join('\n');
  }
  document.getElementById('copyDataBtn').onclick = function() {
    copyText(buildDataText(), this, '对比两张照片 数据复制成功 ✓');
  };
  document.getElementById('copyLogBtn').onclick = function() {
    copyText(buildLogText(), this, '排障日志复制成功 ✓ 可将日志发给开发者/AI 定位问题');
  };
})();
</script>

</body>
</html>
