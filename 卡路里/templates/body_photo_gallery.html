<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>身材照画廊 · 卡路里</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --fg: #1d1d1d; --fg2: #6e6e73; --fg3: #86868b;
    --bg: #fafafa; --card: #fff; --border: #d2d2d7;
    --accent: #0071e3; --red: #ff3b30; --soft: #f5f5f7;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    line-height: 1.6; color: var(--fg); background: var(--bg);
    max-width: 1200px; margin: 0 auto; padding: 32px 20px 80px;
    -webkit-font-smoothing: antialiased;
  }
  h1 { font-size: 30px; font-weight: 700; letter-spacing: -.025em; margin-bottom: 4px; }
  .sub { font-size: 14px; color: var(--fg3); margin-bottom: 20px; }

  .filter-bar {
    display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
    padding: 14px 18px; background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; margin-bottom: 16px;
  }
  .filter-bar label { font-size: 13px; color: var(--fg2); margin-right: 4px; }
  .filter-bar select, .filter-bar input {
    padding: 6px 10px; border: 1px solid var(--border); border-radius: 6px;
    font-size: 13px; background: #fff; color: var(--fg);
  }
  .filter-bar button {
    padding: 6px 14px; border: 1px solid var(--accent); background: var(--accent);
    color: #fff; border-radius: 6px; font-size: 13px; cursor: pointer;
  }
  .filter-bar button.secondary { background: var(--card); color: var(--accent); }

  .actions-bar { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .btn { border: 1px solid var(--border); background: var(--card); padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 13px; color: var(--fg); text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
  .btn:hover { background: var(--soft); }
  .btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn-primary:hover { background: #005bb5; }
  .btn-danger { color: var(--red); border-color: var(--red); }
  .btn-danger:hover { background: var(--red); color: #fff; }

  .tag-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
  .tag-tab {
    padding: 6px 14px; border: 1px solid var(--border); background: var(--card);
    border-radius: 999px; font-size: 13px; cursor: pointer;
    text-decoration: none; color: var(--fg);
  }
  .tag-tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }

  .gallery {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 14px; margin-bottom: 20px;
  }
  .photo-card {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    overflow: hidden; cursor: pointer; transition: all .15s;
  }
  .photo-card:hover { box-shadow: 0 4px 12px rgba(0,0,0,.08); transform: translateY(-2px); }
  .photo-card .img-wrap { aspect-ratio: 3/4; background: #000; overflow: hidden; display: flex; align-items: center; justify-content: center; }
  .photo-card .img-wrap img { width: 100%; height: 100%; object-fit: cover; }
  .photo-card .meta { padding: 10px 12px; font-size: 12px; color: var(--fg2); display: flex; justify-content: space-between; }
  .photo-card .meta .id { color: var(--fg3); font-family: ui-monospace, monospace; }
  .photo-card .meta .date { font-weight: 500; }
  .empty { padding: 60px 20px; text-align: center; color: var(--fg3); font-size: 14px; background: var(--card); border: 1px dashed var(--border); border-radius: 12px; }

  .tip { background: rgba(0,113,227,.06); border-left: 3px solid var(--accent); border-radius: 6px; padding: 10px 14px; margin-bottom: 14px; font-size: 13px; color: var(--fg2); }
  .tip strong { color: var(--accent); }

  .footer { margin-top: 24px; padding: 16px 18px; background: var(--soft); border-radius: 12px; font-size: 12px; color: var(--fg3); }

  /* 选定 GIF 模式的 checkbox 风格 */
  .gif-select-card {
    border: 2px solid var(--accent); background: rgba(0,113,227,.04);
    padding: 14px 18px; border-radius: 12px; margin-bottom: 16px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .gif-select-card .label { font-size: 14px; font-weight: 600; }
  .gif-select-card .count { font-size: 12px; color: var(--fg2); margin-left: 8px; }
</style>
</head>
<body>

<h1>📸 身材照画廊</h1>
<p class="sub" id="sub">--</p>

<div class="tip">
  <strong>💡 工作流</strong>:查身材照 → 在网格里**点图进入单图查看**;或**多选 + 生成 GIF** → 进入 gif_planner.html 选顺序 + 裁剪。
</div>

<!-- Tag tabs -->
<div class="tag-tabs" id="tagTabs">
  <a href="#" class="tag-tab active" data-tag="all">全部</a>
  <!-- 动态生成 -->
</div>

<!-- 筛选 -->
<div class="filter-bar">
  <label>日期范围:</label>
  <input type="number" id="daysInput" value="30" min="1" max="365" style="width: 70px;">
  <span style="font-size: 12px; color: var(--fg3);">天</span>
  <button onclick="applyFilter()">应用</button>
  <button class="secondary" onclick="document.getElementById('daysInput').value='30'; applyFilter()">重置</button>
  <span style="flex: 1"></span>
  <span id="countLabel" style="font-size: 13px; color: var(--fg2);">--</span>
</div>

<div class="actions-bar">
  <a href="#" class="btn btn-primary" id="addBtn">➕ 记录新照片</a>
  <a href="#" class="btn" id="gifBtn" style="display:none">🎬 生成 GIF (已选 <span id="gifCount">0</span> 张)</a>
  <span style="flex: 1"></span>
  <a href="home_dashboard.html" class="btn">← 主页</a>
</div>

<!-- GIF 选定状态(浮在底部) -->
<div class="gif-select-card" id="gifSelectCard" style="display:none">
  <div>
    <span class="label">🎬 已选 <span id="gifCountBig">0</span> 张</span>
    <span class="count" id="gifTagsSummary"></span>
  </div>
  <a href="#" class="btn btn-primary" id="goGifPlanner">📋 进入 GIF planner →</a>
</div>

<!-- 网格 -->
<div class="gallery" id="gallery">
  <!-- 动态生成 -->
</div>

<div class="footer" id="srcLine">卡路里 · body_photo_gallery v1.0</div>

<script>
(function(){
  const D = window.__DATA__;
  if (!D || D.status !== 'ok') return;
  const { photos, tags, current_tag, days } = D.data;

  document.getElementById('sub').textContent = `共 ${photos.length} 张${current_tag !== 'all' ? ' · tag: ' + current_tag : ''} · ${days || 30} 天内`;

  // Tag tabs
  const tagTabs = document.getElementById('tagTabs');
  tags.forEach(t => {
    const a = document.createElement('a');
    a.className = 'tag-tab' + (t === current_tag ? ' active' : '');
    a.dataset.tag = t;
    a.href = `body_photo_gallery.html?tag=${encodeURIComponent(t)}&days=${days || 30}`;
    a.textContent = t === 'all' ? '全部' : t;
    tagTabs.appendChild(a);
  });

  // GIF 多选状态(localStorage 持久)
  const STORAGE_KEY = 'body_photo_gif_selection';
  function loadSelection() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); } catch { return []; }
  }
  function saveSelection(arr) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(arr));
    updateGifUI();
  }
  function updateGifUI() {
    const sel = loadSelection();
    document.getElementById('gifCount').textContent = sel.length;
    document.getElementById('gifCountBig').textContent = sel.length;
    document.getElementById('gifSelectCard').style.display = sel.length > 0 ? 'flex' : 'none';
    document.getElementById('gifBtn').style.display = sel.length > 0 ? 'inline-flex' : 'none';

    // tags 汇总
    const selTags = [...new Set(sel.map(s => s.tag))];
    document.getElementById('gifTagsSummary').textContent = selTags.length ? ' · tag: ' + selTags.join(', ') : '';

    // 每张卡 checkbox 状态
    document.querySelectorAll('.photo-card .gif-check').forEach(cb => {
      cb.checked = sel.some(s => s.id == cb.dataset.id);
    });
  }

  // 网格
  const gallery = document.getElementById('gallery');
  if (photos.length === 0) {
    gallery.innerHTML = '<div class="empty">暂无照片。点上方"➕ 记录新照片"开始。</div>';
  } else {
    photos.forEach(p => {
      const card = document.createElement('div');
      card.className = 'photo-card';
      card.innerHTML = `
        <div class="img-wrap">
          <img src="${p.photo_url || p.photo_path}" alt="${p.tag} ${p.date}" loading="lazy">
        </div>
        <div class="meta">
          <span class="date">${p.date.slice(5)}</span>
          <span class="id">#${p.id}</span>
        </div>
        <label style="display:flex; align-items:center; gap:6px; padding:8px 12px; border-top:1px solid var(--border); font-size:12px; color:var(--fg2);">
          <input type="checkbox" class="gif-check" data-id="${p.id}" data-tag="${p.tag}" data-date="${p.date}" style="cursor:pointer">
          🎬 加入 GIF
        </label>
      `;
      // 点击图片进 viewer
      card.querySelector('.img-wrap').onclick = () => {
        window.location.href = `body_photo_viewer.html?id=${p.id}`;
      };
      // checkbox 不冒泡
      card.querySelector('.gif-check').onchange = (e) => {
        e.stopPropagation();
        const sel = loadSelection();
        if (e.target.checked) {
          if (!sel.some(s => s.id == p.id)) {
            sel.push({ id: p.id, tag: p.tag, date: p.date });
          }
        } else {
          const idx = sel.findIndex(s => s.id == p.id);
          if (idx >= 0) sel.splice(idx, 1);
        }
        saveSelection(sel);
      };
      gallery.appendChild(card);
    });
  }

  document.getElementById('countLabel').textContent = photos.length + ' 张';

  // 链接
  document.getElementById('addBtn').href = 'body_photo_log_wizard.html';
  document.getElementById('goGifPlanner').onclick = (e) => {
    e.preventDefault();
    const sel = loadSelection();
    if (!sel.length) return alert('请先选照片');
    const idsParam = sel.map(s => s.id).join(',');
    const tagsParam = [...new Set(sel.map(s => s.tag))].join(',');
    window.location.href = `body_photo_gif_planner.html?ids=${idsParam}&tags=${encodeURIComponent(tagsParam)}`;
  };
  document.getElementById('gifBtn').onclick = (e) => {
    e.preventDefault();
    document.getElementById('goGifPlanner').click();
  };

  // 初始化 UI
  updateGifUI();
})();

function applyFilter() {
  const days = document.getElementById('daysInput').value || 30;
  const tag = new URLSearchParams(location.search).get('tag') || 'all';
  location.href = `body_photo_gallery.html?tag=${encodeURIComponent(tag)}&days=${days}`;
}
</script>

</body>
</html>
