<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>卡路里 · 生成身材照 GIF</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --fg:#1d1d1d; --fg2:#6e6e73; --fg3:#86868b; --bg:#fafafa;
    --card:#fff; --border:#d2d2d7; --accent:#0071e3;
    --good:#34c759; --warn:#ff9500; --bad:#ff3b30; --soft:#f5f5f7;
  }
  body { font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
         line-height:1.6; color:var(--fg); background:var(--bg);
         max-width:720px; margin:0 auto; padding:40px 20px 80px;
         -webkit-font-smoothing:antialiased; }
  .meta-bar { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
  .meta-bar .left { font-size:12px; color:var(--fg2); }
  .meta-bar .type-badge { font-size:11px; padding:3px 10px; border-radius:6px; background:var(--accent); color:#fff; font-weight:700; }
  h1 { font-size:28px; font-weight:700; letter-spacing:-.025em; margin-bottom:4px; }
  .sub { font-size:14px; color:var(--fg3); margin-bottom:20px; }
  /* GIF 预览 */
  .gif-stage { background:var(--card); border:1px solid var(--border); border-radius:16px;
               padding:20px; margin-bottom:16px; text-align:center; }
  .gif-stage img { max-width:100%; max-height:520px; border-radius:10px; background:#000; }
  .gif-stage .nolink { color:var(--fg3); font-size:13px; padding:40px 0; }
  /* 信息卡 */
  .info-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:16px; }
  .info { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:14px 16px; }
  .info .label { font-size:11px; color:var(--fg2); margin-bottom:3px; }
  .info .value { font-size:17px; font-weight:700; font-variant-numeric:tabular-nums; }
  .info .value.small { font-size:13px; font-weight:500; word-break:break-all; }
  /* Footer 按钮 */
  .footer { margin-top:24px; padding:16px 18px; background:var(--soft); border-radius:12px; display:flex; justify-content:flex-end; }
  .footer .btn-group { display:flex; gap:8px; flex-wrap:wrap; }
  .btn { border:1px solid var(--border); background:var(--card); padding:8px 16px; border-radius:8px;
         cursor:pointer; font-size:13px; color:var(--fg); min-height:36px; }
  .btn:hover { background:var(--accent); color:#fff; border-color:var(--accent); }
  .btn-primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  .btn-primary:hover { background:#005bb0; }
  @media (max-width:640px) {
    body { padding:20px 14px 80px; }
    h1 { font-size:22px; }
    .info-grid { grid-template-columns:1fr 1fr; gap:8px; }
    .footer .btn-group { justify-content:stretch; }
    .footer .btn-group .btn { flex:1 1 45%; min-height:44px; }
  }
</style>
</head>
<body>

<!--INJECT-DATA-->

<div class="meta-bar">
  <div class="left" id="metaLeft">--</div>
  <div class="type-badge">结果型 · 生成身材照 GIF</div>
</div>

<h1>🎞 生成身材照 GIF</h1>
<p class="sub" id="sub">--</p>

<div class="gif-stage">
  <div id="gifWrap"></div>
</div>

<div class="info-grid">
  <div class="info"><div class="label">合成照片总数</div><div class="value" id="vCount">--</div></div>
  <div class="info"><div class="label">时间跨度</div><div class="value" id="vSpan">--</div></div>
  <div class="info"><div class="label">首张日期</div><div class="value" id="vFirst">--</div></div>
  <div class="info"><div class="label">末张日期</div><div class="value" id="vLast">--</div></div>
  <div class="info"><div class="label">标签</div><div class="value small" id="vTag">--</div></div>
  <div class="info"><div class="label">文件位置</div><div class="value small" id="vPath">--</div></div>
</div>

<div class="footer">
  <div class="btn-group">
    <button class="btn" id="copyDataBtn">📋 复制数据</button>
    <button class="btn btn-primary" id="copyLogBtn">📋 复制日志</button>
  </div>
</div>

<script>
(function(){
  const D = window.__DATA__;
  if (!D || D.status !== 'ok') {
    document.body.innerHTML = '<div style="padding:60px;text-align:center;color:#86868b">⚠ 数据未注入或状态非 ok</div>';
    return;
  }
  const d = D.data;
  const g = d.gif;
  const meta = d.meta;
  document.getElementById('metaLeft').textContent = meta.action_at;
  document.getElementById('sub').textContent = `标签「${g.tag}」 · ${g.photo_count} 张照片合成`;

  const wrap = document.getElementById('gifWrap');
  if (g.gif_data_base64) {
    wrap.innerHTML = `<img src="${g.gif_data_base64}" alt="身材变化 GIF">`;
  } else {
    wrap.innerHTML = `<div class="nolink">GIF 文件较大未内嵌,请本地打开:<br><code style="font-size:11px">${g.path}</code></div>`;
  }

  document.getElementById('vCount').textContent = g.photo_count + ' 张';
  document.getElementById('vSpan').textContent = (g.first_date && g.last_date) ? `${g.first_date} ~ ${g.last_date}` : '—';
  document.getElementById('vFirst').textContent = g.first_date || '—';
  document.getElementById('vLast').textContent = g.last_date || '—';
  document.getElementById('vTag').textContent = g.tag;
  document.getElementById('vPath').textContent = g.path;

  // 复制工具
  function showToast(msg) {
    let t = document.getElementById('copyToast');
    if (!t) {
      t = document.createElement('div');
      t.id = 'copyToast';
      t.style.cssText = 'position:fixed;left:50%;bottom:24px;transform:translateX(-50%);' +
        'background:rgba(28,28,30,.92);color:#fff;padding:10px 18px;border-radius:10px;' +
        'font-size:13px;z-index:999;max-width:86vw;text-align:center;';
      document.body.appendChild(t);
    }
    t.textContent = msg; t.style.display = 'block';
    clearTimeout(t._timer); t._timer = setTimeout(() => { t.style.display = 'none'; }, 3200);
  }
  function fallbackCopy(text) {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.focus(); ta.select();
    try { document.execCommand('copy'); } catch(e) {}
    document.body.removeChild(ta);
  }
  function copyText(text, btn, okMsg) {
    const after = () => {
      const orig = btn.textContent; btn.textContent = '✓ 已复制';
      setTimeout(() => btn.textContent = orig, 2000); showToast(okMsg);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(after).catch(() => { fallbackCopy(text); after(); });
    } else { fallbackCopy(text); after(); }
  }
  function buildDataText() {
    return [
      `生成身材照 GIF(${meta.action_at})`,
      '',
      `标签: ${g.tag}`,
      `合成照片: ${g.photo_count} 张`,
      `时间跨度: ${g.first_date} ~ ${g.last_date}`,
      `首张: ${g.first_date} · 末张: ${g.last_date}`,
      `文件: ${g.path}`,
    ].join('\n');
  }
  function buildLogText() {
    const lines = [`[生成身材照 GIF 排障日志]`, ''];
    lines.push(`唤醒词: ${meta.wake_word || '(未知)'}`);
    lines.push(`渲染命令: ${meta.render_cmd || '(未知)'}`);
    lines.push(`数据来源: ${meta.source || '(未知)'}`);
    lines.push(`操作时间: ${meta.action_at || '(未知)'}`);
    lines.push('');
    lines.push('AI 思考链:');
    lines.push(meta.chain || '(未注入 · 渲染时未传 --chain)');
    lines.push('');
    lines.push('原始数据:');
    lines.push(JSON.stringify({...g, gif_data_base64: undefined}, null, 2));
    return lines.join('\n');
  }
  document.getElementById('copyDataBtn').onclick = function() {
    copyText(buildDataText(), this, '生成身材照 GIF 数据复制成功 ✓');
  };
  document.getElementById('copyLogBtn').onclick = function() {
    copyText(buildLogText(), this, '排障日志复制成功 ✓ 可将日志发给开发者/AI 定位问题');
  };
})();
</script>

</body>
</html>
