<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>卡路里 · 身材照片回执</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --fg:#1d1d1d; --fg2:#6e6e73; --fg3:#86868b; --bg:#fafafa;
    --card:#fff; --border:#d2d2d7; --accent:#0071e3;
    --good:#34c759; --warn:#ff9500; --bad:#ff3b30; --soft:#f5f5f7;
  }
  body { font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
         line-height:1.6; color:var(--fg); background:var(--bg);
         max-width:780px; margin:0 auto; padding:48px 24px 80px;
         -webkit-font-smoothing:antialiased; }
  .meta-bar { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
  .meta-bar .left { font-size:12px; color:var(--fg2); }
  .meta-bar .type-badge { font-size:11px; padding:3px 10px; border-radius:6px; background:var(--good); color:#fff; font-weight:700; }
  .meta-bar .type-badge.warn { background:var(--warn); }
  .meta-bar .type-badge.bad { background:var(--bad); }
  h1 { font-size:32px; font-weight:700; letter-spacing:-.025em; margin-bottom:4px; }
  .sub { font-size:14px; color:var(--fg3); margin-bottom:24px; }
  .pill { display:inline-block; padding:2px 9px; border-radius:10px; font-size:11px; font-weight:600; margin-right:4px; }
  .pill-good { background:rgba(52,199,89,.15); color:var(--good); }
  .pill-warn { background:rgba(255,149,0,.15); color:var(--warn); }
  .pill-bad  { background:rgba(255,59,48,.15); color:var(--bad); }
  .pill-info { background:rgba(0,113,227,.15); color:var(--accent); }
  .pill-neutral { background:rgba(110,110,115,.15); color:var(--fg2); }
  /* 顶部 ID 卡 */
  .id-card { background:linear-gradient(135deg,#e8f5e8,#f0f8ff); border:1px solid var(--good);
             border-radius:16px; padding:28px 32px; text-align:center; margin-bottom:16px; }
  .id-card.delete { background:linear-gradient(135deg,#ffeaea,#fff5f5); border-color:var(--bad); }
  .id-card.update { background:linear-gradient(135deg,#fff5e5,#fffaf0); border-color:var(--warn); }
  .id-card .icon { font-size:44px; margin-bottom:6px; }
  .id-card .title { font-size:18px; font-weight:700; margin-bottom:4px; }
  .id-card .id { font-size:30px; font-weight:800; color:var(--fg); font-variant-numeric:tabular-nums; margin:6px 0; }
  .id-card .meta { font-size:13px; color:var(--fg2); }
  .id-card .summary { margin-top:10px; font-size:14px; color:var(--fg2); }
  .id-card .head { display:flex; align-items:center; justify-content:center; gap:10px; margin-bottom:4px; }
  .id-card .head .icon { font-size:24px; margin-bottom:0; }
  .id-card .head .title { font-size:20px; font-weight:600; margin-bottom:0; }
  .id-card .head .id { font-size:34px; margin:0; font-weight:800; color:var(--accent); font-variant-numeric:tabular-nums; }
  .id-card.delete .head .id { color:var(--bad); }
  .id-card.update .head .id { color:var(--warn); }
  /* 照片明细卡(存/删) */
  .items-card { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:20px 24px; margin-bottom:16px; }
  .items-card h2 { font-size:16px; font-weight:600; margin-bottom:14px; }
  .photo-row { display:flex; gap:14px; padding:12px 0; border-bottom:1px solid var(--border); align-items:flex-start; }
  .photo-row:last-child { border-bottom:none; }
  .thumb { width:76px; height:96px; flex-shrink:0; border-radius:10px; overflow:hidden; background:var(--soft); display:flex; align-items:center; justify-content:center; }
  .thumb img { width:100%; height:100%; object-fit:cover; }
  .thumb .noimg { font-size:20px; color:var(--fg3); }
  .pinfo { flex:1; min-width:0; font-size:13px; }
  .pinfo .ptag { font-weight:600; }
  .pinfo .ptag span { display:inline-block; background:rgba(0,113,227,.12); color:var(--accent); border-radius:8px; padding:1px 8px; margin-right:4px; font-size:11px; }
  .pinfo .pmeta { color:var(--fg2); font-size:12px; margin-top:2px; }
  .pinfo .pnote { color:var(--fg3); font-size:12px; margin-top:2px; }
  .pstatus { text-align:right; flex-shrink:0; }
  .pstatus .st { font-size:12px; font-weight:600; }
  .st-ok { color:var(--good); } .st-fail { color:var(--bad); } .st-skip { color:var(--warn); }
  /* 标签 diff 卡 */
  .diff-card { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:20px 24px; margin-bottom:16px; }
  .diff-card h2 { font-size:16px; font-weight:600; margin-bottom:14px; }
  .diff-block { margin-bottom:10px; }
  .diff-block:last-child { margin-bottom:0; }
  .diff-label { font-size:12px; color:var(--fg2); margin-bottom:4px; }
  .tag-chips { display:flex; flex-wrap:wrap; gap:6px; }
  .chip { font-size:12px; padding:3px 10px; border-radius:10px; font-weight:600; }
  .chip-old { background:#ffeaea; color:#c7254e; text-decoration:line-through; }
  .chip-new { background:rgba(52,199,89,.15); color:var(--good); }
  .chip-none { background:var(--soft); color:var(--fg3); }
  .diff-arrow { font-size:16px; color:var(--fg3); padding:2px 0; }
  /* 规律拍照提示卡 */
  .dist-card { background:linear-gradient(135deg,#f0f6ff,#f8fbff); border:1px solid rgba(0,113,227,.25);
               border-radius:14px; padding:14px 20px; margin-bottom:16px; font-size:13px; color:var(--fg2); }
  .dist-card b { color:var(--accent); font-size:18px; }
  /* Footer 按钮 */
  .footer { margin-top:24px; padding:16px 18px; background:transparent; border-radius:12px; display:flex; justify-content:flex-end; align-items:center; }
  .footer .btn-group { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .btn { border:1px solid var(--border); background:var(--card); padding:8px 16px; border-radius:8px;
         cursor:pointer; font-size:13px; color:var(--fg); min-height:36px; white-space:nowrap; }
  .btn:hover { background:var(--accent); color:#fff; border-color:var(--accent); }
  .btn-primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  .btn-primary:hover { background:#005bb0; }
  .footer .btn-group .btn { min-width:116px; }
  @media (max-width:640px) {
    body { padding:20px 14px 80px; }
    h1 { font-size:22px; }
    .id-card { padding:22px 18px; }
    .photo-row { gap:10px; }
    .thumb { width:64px; height:84px; }
    .pstatus .st { font-size:11px; }
    .footer .btn-group { justify-content:stretch; }
    .footer .btn-group .btn { flex:1 1 45%; min-height:44px; }
    .diff-card, .items-card { padding:16px 16px; }
  }
</style>
</head>
<body>

<!--INJECT-DATA-->

<div class="meta-bar">
  <div class="left" id="metaLeft">--</div>
  <div class="type-badge" id="typeBadge">回执型</div>
</div>

<h1 id="h1Title">✅ 操作回执</h1>
<p class="sub" id="sub">--</p>

<div class="id-card" id="idCard">
  <div class="head">
    <div class="icon" id="icon">✓</div>
    <div class="title" id="opTitle">--</div>
    <div class="id" id="recordId" style="display:none">--</div>
  </div>
  <div class="meta" id="recordMeta">--</div>
  <div class="summary" id="summaryLine" style="display:none"></div>
</div>

<div class="dist-card" id="distCard" style="display:none"></div>

<div class="items-card" id="itemsCard" style="display:none">
  <h2 id="itemsTitle">📷 照片明细</h2>
  <div id="itemsList"></div>
</div>

<div class="diff-card" id="tagDiffCard" style="display:none">
  <h2>🏷 标签变更</h2>
  <div class="diff-block">
    <div class="diff-label">改前</div>
    <div class="tag-chips" id="tagsBefore"></div>
  </div>
  <div class="diff-arrow">↓</div>
  <div class="diff-block">
    <div class="diff-label">改后</div>
    <div class="tag-chips" id="tagsAfter"></div>
  </div>
</div>

<div class="footer">
  <div class="btn-group">
    <button class="btn" id="copyDataBtn">📋 复制数据</button>
    <button class="btn" id="copyLogBtn">📋 复制日志</button>
  </div>
</div>

<script>
(function(){
  const D = window.__DATA__;
  if (!D || D.status !== 'ok') {
    document.body.innerHTML = '<div style="padding:60px;text-align:center;color:#86868b">⚠ 数据未注入或状态非 ok</div>';
    return;
  }
  const d = D.data;
  const { scene, action, op, record_id, summary, items, tag_diff, distance, no_change, meta } = d;

  document.getElementById('metaLeft').textContent = meta.action_at;
  const badge = document.getElementById('typeBadge');
  badge.textContent = (op === 'delete' ? '删除回执' : op === 'update' ? '变更回执' : '存入回执') + ' · ' + scene;
  badge.className = 'type-badge ' + (op === 'delete' ? 'bad' : op === 'update' ? 'warn' : '');

  document.getElementById('sub').innerHTML =
    `<span class="pill pill-${op === 'delete' ? 'bad' : op === 'update' ? 'warn' : 'good'}">${op === 'delete' ? '删除' : op === 'update' ? '修改' : '新增'}</span> ${scene} ${op === 'delete' ? '已删除' : op === 'update' ? '已更新' : '已存入'}`;

  const idCard = document.getElementById('idCard');
  idCard.className = 'id-card ' + (op === 'delete' ? 'delete' : op === 'update' ? 'update' : '');
  document.getElementById('icon').textContent = op === 'delete' ? '✕' : op === 'update' ? '✎' : '✓';
  document.getElementById('opTitle').textContent =
    (op === 'delete' ? '删除成功' : op === 'update' ? '修改成功' : '存入成功');
  if (record_id) {
    document.getElementById('recordId').textContent = '#' + record_id;
    document.getElementById('recordId').style.display = 'block';
  }
  document.getElementById('recordMeta').textContent = meta.action_at + ' · ' + meta.entity_type;
  if (summary) {
    const sl = document.getElementById('summaryLine');
    sl.textContent = '💬 ' + summary;
    sl.style.display = 'block';
  }

  // 规律拍照提示(距上次同标签拍照间隔)
  if (distance) {
    const dc = document.getElementById('distCard');
    dc.style.display = 'block';
    dc.innerHTML = `📸 距上次「<b>${distance.tag}</b>」拍照已隔 <b>${distance.days}</b> 天` +
      (distance.days >= 14 ? ' · 建议保持规律拍照节奏,变化对比更清晰' : ' · 节奏不错,继续保持');
  }

  // 照片明细(存/删)
  if (items && items.length) {
    document.getElementById('itemsCard').style.display = 'block';
    document.getElementById('itemsTitle').textContent =
      (items.length > 1 ? '📷 照片明细 · ' + items.length + ' 张' : '📷 照片明细');
    const list = document.getElementById('itemsList');
    items.forEach(p => {
      const img = p.photo_data_base64
        ? `<img src="${p.photo_data_base64}" alt="照片">`
        : `<div class="noimg">📷</div>`;
      const tags = (p.tag_list || []).map(t => `<span>${t}</span>`).join('') || '<span style="background:rgba(134,134,139,.15);color:var(--fg3)">无</span>';
      const stCls = p.status === '成功' || p.status === '已删除' ? 'st-ok' : (p.status === '失败' ? 'st-fail' : 'st-skip');
      const reason = p.reason ? `<div class="pnote">原因:${p.reason}</div>` : '';
      list.insertAdjacentHTML('beforeend',
        `<div class="photo-row">
           <div class="thumb">${img}</div>
           <div class="pinfo">
             <div class="ptag">${tags}</div>
             <div class="pmeta">#${p.id ?? '—'} · ${p.date ?? ''} ${p.time ?? ''}</div>
             <div class="pnote">${p.note ? '📝 ' + p.note : ''}</div>
           </div>
           <div class="pstatus"><span class="st ${stCls}">${p.status || '—'}</span></div>
         </div>` + (reason ? `<div class="pnote" style="padding:0 0 10px 90px;color:var(--bad)">${reason}</div>` : ''));
    });
  }

  // 标签 diff(改/加/删标签)
  if (tag_diff) {
    const dcard = document.getElementById('tagDiffCard');
    dcard.style.display = 'block';
    const chips = (arr, cls) => (arr && arr.length)
      ? arr.map(t => `<span class="chip ${cls}">${t}</span>`).join('')
      : '<span class="chip chip-none">(无)</span>';
    document.getElementById('tagsBefore').innerHTML = chips(tag_diff.before, 'chip-old');
    document.getElementById('tagsAfter').innerHTML = chips(tag_diff.after, 'chip-new');
    if (no_change) {
      const dc2 = document.getElementById('tagDiffCard');
      dc2.innerHTML = dc2.innerHTML.replace('<h2>🏷 标签变更</h2>', '<h2>🏷 标签(未变化)</h2>');
    }
  }

  // 复制工具:clipboard + textarea fallback + toast(2026-08-02 对齐 crud_receipt)
  function showToast(msg) {
    let t = document.getElementById('copyToast');
    if (!t) {
      t = document.createElement('div');
      t.id = 'copyToast';
      t.style.cssText = 'position:fixed;left:50%;bottom:24px;transform:translateX(-50%);' +
        'background:rgba(28,28,30,.92);color:#fff;padding:10px 18px;border-radius:10px;' +
        'font-size:13px;z-index:999;max-width:86vw;text-align:center;box-shadow:0 4px 16px rgba(0,0,0,.2);';
      document.body.appendChild(t);
    }
    t.textContent = msg;
    t.style.display = 'block';
    clearTimeout(t._timer);
    t._timer = setTimeout(() => { t.style.display = 'none'; }, 3200);
  }
  function copyText(text, btn, okMsg) {
    const after = () => {
      showToast(okMsg);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(after).catch(() => { fallbackCopy(text); after(); });
    } else { fallbackCopy(text); after(); }
  }
  function fallbackCopy(text) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.focus(); ta.select();
    try { document.execCommand('copy'); } catch(e) {}
    document.body.removeChild(ta);
  }

  function fmtTags(arr) { return (arr && arr.length) ? arr.join('、') : '(无)'; }
  function buildDataText() {
    const lines = [`${scene}${op === 'delete' ? '已删除' : op === 'update' ? '已更新' : '已存入'}` +
      (record_id ? ` #${record_id}` : '') + ` (${meta.action_at})`, ''];
    if (summary) lines.push(`💬 ${summary}`, '');
    if (items && items.length) {
      lines.push('照片明细:');
      items.forEach(p => {
        lines.push(`  #${p.id ?? '—'} ${p.date ?? ''} ${p.time ?? ''} | 标签:${fmtTags(p.tag_list)} | 状态:${p.status || '—'}` +
          (p.reason ? ` | 原因:${p.reason}` : '') + (p.note ? ` | 备注:${p.note}` : ''));
      });
      lines.push('');
    }
    if (tag_diff) {
      lines.push(`标签变更: ${fmtTags(tag_diff.before)} → ${fmtTags(tag_diff.after)}`, '');
    }
    if (distance) lines.push(`距上次「${distance.tag}」拍照: ${distance.days} 天`);
    return lines.join('\n');
  }
  function buildLogText() {
    const lines = [`[${scene} 排障日志]`, ''];
    lines.push(`唤醒词: ${meta.wake_word || '(未知)'}`);
    lines.push(`渲染命令: ${meta.render_cmd || '(未知)'}`);
    lines.push(`数据来源: ${meta.source || '(未知)'}`);
    lines.push(`操作时间: ${meta.action_at || '(未知)'}`);
    lines.push('');
    if (meta.chain) {
      lines.push('AI 思考链:');
      lines.push(meta.chain);
    } else {
      lines.push('AI 思考链: (未注入 · 渲染时未传 --chain,AI 执行时用 --chain 附上处理步骤)');
    }
    if (items && items.length) {
      lines.push('');
      lines.push('原始数据:');
      lines.push(JSON.stringify(items.map(({photo_data_base64, ...rest}) => rest), null, 2));
    }
    if (tag_diff) {
      lines.push('');
      lines.push(`标签改前: ${JSON.stringify(tag_diff.before)}`);
      lines.push(`标签改后: ${JSON.stringify(tag_diff.after)}`);
    }
    return lines.join('\n');
  }

  document.getElementById('copyDataBtn').onclick = function() {
    copyText(buildDataText(), this, `${scene} 数据复制成功 ✓`);
  };
  document.getElementById('copyLogBtn').onclick = function() {
    copyText(buildLogText(), this, '排障日志复制成功 ✓ 可将日志发给开发者/AI 定位问题');
  };
})();
</script>

</body>
</html>
