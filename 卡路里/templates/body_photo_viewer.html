<!doctype html>
<html lang="zh-CN">
<head>
<style><!--SHARED-CSS--></style>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>身材照查看 · 卡路里</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --fg: #1d1d1d; --fg2: #6e6e73; --fg3: #86868b;
    --bg: #fafafa; --card: #fff; --border: #d2d2d7;
    --accent: #0071e3; --red: #ff3b30; --soft: #f5f5f7;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    line-height: 1.6; color: var(--fg); background: var(--bg);
    max-width: 900px; margin: 0 auto; padding: 32px 20px 80px;
    -webkit-font-smoothing: antialiased;
  }
  h1 { font-size: 28px; font-weight: 700; letter-spacing: -.025em; margin-bottom: 6px; }
  .sub { font-size: 14px; color: var(--fg3); margin-bottom: 20px; }
  .meta-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .meta-bar .left { font-size: 12px; color: var(--fg2); }
  .meta-bar .badge { font-size: 11px; padding: 3px 10px; border-radius: 6px; background: var(--accent); color: #fff; font-weight: 700; }

  .photo-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; margin-bottom: 16px; }
  .photo-card .photo-wrap { background: #000; display: flex; align-items: center; justify-content: center; max-height: 75vh; overflow: hidden; }
  .photo-card img { max-width: 100%; max-height: 75vh; object-fit: contain; }
  .photo-card .info { padding: 18px 22px; border-top: 1px solid var(--border); }
  .photo-card .info .date { font-size: 18px; font-weight: 600; margin-bottom: 4px; }
  .photo-card .info .tag { display: inline-block; font-size: 12px; padding: 2px 10px; border-radius: 4px; background: var(--soft); color: var(--fg2); margin-right: 6px; }
  .photo-card .info .note { font-size: 14px; color: var(--fg2); margin-top: 8px; line-height: 1.6; }

  .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
  .btn { border: 1px solid var(--border); background: var(--card); padding: 9px 16px; border-radius: 9px; cursor: pointer; font-size: 13px; color: var(--fg); transition: all .15s; }
  .btn:hover { background: var(--soft); }
  .btn-danger { color: var(--red); border-color: var(--red); }
  .btn-danger:hover { background: var(--red); color: #fff; }
  .btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn-primary:hover { background: #005bb5; }

  .prev-next { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 16px; }
  .prev-next .pn-btn { font-size: 13px; color: var(--accent); text-decoration: none; }
  .prev-next .pn-btn.disabled { color: var(--fg3); pointer-events: none; }

  .tip { background: rgba(0,113,227,.06); border-left: 3px solid var(--accent); border-radius: 6px; padding: 10px 14px; margin-bottom: 14px; font-size: 13px; color: var(--fg2); }
  .tip strong { color: var(--accent); }

  .footer { margin-top: 24px; padding: 16px 18px; background: var(--soft); border-radius: 12px; font-size: 12px; color: var(--fg3); }
  /* Phase 3c:mobile 断点(640px 以下单列堆叠 + 缩 padding) */
  @media (max-width:640px) {
    body { padding:20px 14px 80px; }
    h1 { font-size:22px; }
    .section { padding:16px 18px; border-radius:12px; }
    .kpi-grid { grid-template-columns:1fr 1fr; gap:10px; }
    .food-card .macros { grid-template-columns:1fr 1fr; }
  }
  /* table 在小屏内滚 */
  .table-wrap { overflow-x:auto; -webkit-overflow-scrolling:touch; }

</style>
</head>
<body>

<div class="meta-bar">
  <div class="left" id="metaLeft">--</div>
  <div class="badge">报告型 · 单图查看</div>
</div>

<h1>📸 身材照</h1>
<p class="sub" id="sub">--</p>

<div class="prev-next" id="prevNext" style="display:none">
  <a href="#" class="pn-btn" id="prevBtn">← 上一张</a>
  <a href="#" class="pn-btn" id="nextBtn">下一张 →</a>
</div>

<div class="photo-card">
  <div class="photo-wrap">
    <img id="mainPhoto" src="" alt="身材照">
  </div>
  <div class="info">
    <div class="date" id="photoDate">--</div>
    <span class="tag" id="photoTag">--</span>
    <span class="tag" id="photoId">#--</span>
    <div class="note" id="photoNote">--</div>
  </div>
</div>

<div class="actions">
  <button class="btn btn-danger" id="deleteBtn">🗑️ 删除这张</button>
  <a href="#" class="btn" id="tagBtn">✏️ 修改标签</a>
  <a href="#" class="btn btn-primary" id="backBtn">← 返回画廊</a>
</div>

<div class="tip">
  <strong>💡 提示</strong>:删除照片只删 DB 记录,文件本身保留在 <code>photos/</code> 目录,可手动清理。
</div>

<div class="footer" id="srcLine">卡路里 · body_photo_viewer v1.0</div>

<script>
(function(){
  // v2.3.4(2026-07-25 fix):<img id="mainPhoto"> 已在 Python 渲染时填好 base64 src
  // JS 只负责元数据填充和交互,不重设 src
  const D = window.__P__;
  if (!D || D.status !== 'ok') return;
  const { photo_meta: photo, prev_id, next_id } = D.data;

  document.getElementById('metaLeft').textContent = `生成于 ${D.data.fetched_at || new Date().toISOString()}`;
  document.getElementById('sub').textContent = `${photo.date} · ${photo.tag} · #${photo.id}`;
  // 不再覆盖 src(已经是 base64)
  const mainImg = document.getElementById('mainPhoto');
  if (mainImg) {
    if (!mainImg.src || mainImg.src === window.location.href) {
      // 兜底:如果 mainPhoto 还没 src,显示 broken
      mainImg.alt = `${photo.date} ${photo.tag} (图加载失败)`;
    } else {
      mainImg.alt = `${photo.date} ${photo.tag}`;
    }
  }
  document.getElementById('photoDate').textContent = photo.date + ' ' + (photo.time || '');
  document.getElementById('photoTag').textContent = photo.tag;
  document.getElementById('photoId').textContent = '#' + photo.id;
  document.getElementById('photoNote').textContent = photo.note || '(无备注)';

  // 前后导航
  if (prev_id || next_id) {
    document.getElementById('prevNext').style.display = 'flex';
    if (prev_id) {
      document.getElementById('prevBtn').href = 'body_photo_viewer.html?id=' + prev_id;
    } else {
      document.getElementById('prevBtn').classList.add('disabled');
    }
    if (next_id) {
      document.getElementById('nextBtn').href = 'body_photo_viewer.html?id=' + next_id;
    } else {
      document.getElementById('nextBtn').classList.add('disabled');
    }
  }

  // 返回画廊
  const tag = encodeURIComponent(photo.tag);
  document.getElementById('backBtn').href = `body_photo_gallery.html?tag=${tag}`;

  // 修改标签
  document.getElementById('tagBtn').href = `body_photo_gallery.html?action=retag&id=${photo.id}&tag=${tag}`;

  // 删除(走 crud_receipt.html 流程,本质调用 crud CLI)
  document.getElementById('deleteBtn').onclick = function() {
    if (!confirm(`确认删除照片 #${photo.id} (${photo.date} ${photo.tag})?\n将返回 crud_receipt.html 回执。`)) return;
    const prompt = `删除身材照 #${photo.id} (${photo.date} ${photo.tag})`;
    window.copyText(prompt);
  };
})();
</script>

<script id="payload" type="application/json"><!--INJECT-DATA--></script><script><!--SHARED-HELPERS--></script><script>window.__P__=(function(){try{return JSON.parse(document.getElementById('payload').textContent||'{}');}catch(e){return null;}})();</script>

<div id="actionbar-zone"></div>

<script>(function(){var z=document.getElementById('actionbar-zone');if(z&&window.actionBar&&window.__P__){z.innerHTML=window.actionBar(window.__P__);}})();</script>
</body>
</html>
