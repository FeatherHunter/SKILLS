<!DOCTYPE html>
<html lang="zh-CN">
<head>
<style><!--SHARED-CSS--></style>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>卡路里 · 组合分析</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --fg:#1d1d1f; --fg2:#6e6e73; --fg3:#86868b; --bg:#fafafa;
    --card:#fff; --border:#d2d2d7; --accent:#0071e3;
    --good:#34c759; --warn:#ff9500; --bad:#ff3b30; --soft:#f5f5f7;
    --b:#ff9500;
  }
  body { font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
         line-height:1.6; color:var(--fg); background:var(--bg);
         max-width:920px; margin:0 auto; padding:56px 24px 80px;
         -webkit-font-smoothing:antialiased; }
  h1 { font-size:28px; font-weight:700; letter-spacing:-.02em; margin-bottom:4px; }
  .sub { font-size:14px; color:var(--fg3); margin-bottom:24px; }





  .kpi-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:18px; }
  .kpi { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:14px 16px; }
  .kpi .label { font-size:12px; color:var(--fg2); margin-bottom:6px; }
  .kpi .value { font-size:22px; font-weight:700; }
  .kpi .extra { font-size:11px; color:var(--fg3); margin-top:4px; }
  .section { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:20px 24px; margin-bottom:16px; }
  .section h2 { font-size:16px; font-weight:600; margin-bottom:12px; }
  .legend { font-size:12px; color:var(--fg2); margin-top:10px; display:flex; gap:16px; flex-wrap:wrap; }
  .legend span { display:inline-flex; align-items:center; gap:6px; }
  .legend i { display:inline-block; width:16px; height:2px; }
  .legend .a { background:var(--accent); }
  .legend .b { border-top:2px dashed var(--b); background:transparent; height:0; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th,td { padding:8px 10px; text-align:left; border-bottom:1px solid var(--border); }
  th { color:var(--fg2); font-weight:500; font-size:12px; }
  tr:last-child td { border-bottom:none; }
  .insight { background:var(--soft); border-radius:12px; padding:14px 18px; font-size:13.5px; margin-top:4px; }
  .insight b { color:var(--accent); }
  .meta-bar { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; }
  .meta-bar .left { font-size:12px; color:var(--fg2); }
  .meta-bar .type-badge { font-size:11px; padding:3px 10px; border-radius:6px; background:var(--soft); color:var(--fg2); font-weight:600; }
  .footer { margin-top:24px; padding:14px 18px; background:var(--soft); border-radius:12px; display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; }
  .footer .src { font-size:12px; color:var(--fg3); }
  .btn { border:1px solid var(--border); background:var(--card); padding:7px 14px; border-radius:8px; cursor:pointer; font-size:13px; color:var(--fg); }
  .btn:hover { background:var(--accent); color:#fff; border-color:var(--accent); }
  @media (max-width: 640px) {
    .kpi-grid { grid-template-columns: repeat(2, 1fr); }
    .section  { padding: 14px 16px; }
    body { padding: 40px 14px 60px; }
    .table-wrap { overflow-x:auto; }
  }
</style>
</head>
<body>

<script id="payload" type="application/json"><!--INJECT-DATA--></script><script><!--SHARED-HELPERS--></script><script><!--CHARTS-HELPERS--></script><script>window.__P__=(function(){try{return JSON.parse(document.getElementById('payload').textContent||'{}');}catch(e){return null;}})();</script>

<div class="meta-bar">
  <div class="left" id="metaLeft">--</div>
  <div class="type-badge">组合分析 · 双轴+相关</div>
</div>

<h1 id="title">--</h1>
<p class="sub" id="sub">--</p>

<div class="kpi-grid">
  <div class="kpi"><div class="label">相关系数 r</div><div class="value" id="kpiR">--</div><div class="extra" id="kpiRExtra">--</div></div>
  <div class="kpi"><div class="label">A 均值</div><div class="value" id="kpiA">--</div><div class="extra" id="kpiAExtra">--</div></div>
  <div class="kpi"><div class="label">B 均值</div><div class="value" id="kpiB">--</div><div class="extra" id="kpiBExtra">--</div></div>
  <div class="kpi"><div class="label">对齐样本</div><div class="value" id="kpiN">--</div><div class="extra">双侧有数据的天数</div></div>
</div>

<div class="section">
  <h2>双轴走势</h2>
  <div id="dualChart"></div>
  <div class="legend">
    <span><i class="a"></i> <span id="legA">--</span></span>
    <span><i class="b"></i> <span id="legB">--</span></span>
  </div>
</div>

<div class="section">
  <h2>相关性与回归</h2>
  <div id="scatterChart"></div>
</div>

<div class="section" id="lagSection">
  <h2>延迟相关性(前 N 天 B 值 vs 当日 A 值)</h2>
  <table>
    <thead><tr><th>滞后天数</th><th>相关系数 r</th><th>解读</th></tr></thead>
    <tbody id="lagTable"></tbody>
  </table>
</div>

<div class="section" id="stratSection">
  <h2>分层对比</h2>
  <div class="table-wrap">
    <table>
      <thead><tr><th>分组</th><th>天数</th><th>A 净变化</th><th>B 均值</th></tr></thead>
      <tbody id="stratTable"></tbody>
    </table>
  </div>
</div>

<div class="insight" id="insight">--</div>

<div class="footer">
  <div class="src" id="srcLine">📊 数据来源:--</div>
  
</div>

<script>
(function(){
  const D = ((window.__P__ && typeof window.__P__ === 'object' && window.__P__.data) ? window.__P__.data : window.__P__);
  if (!window.__P__ || window.__P__.status !== 'ok') { document.body.innerHTML = window.errorReceipt({message: '数据未注入或状态非 ok'}); return; }
  const A = D.labels.a, B = D.labels.b;
  document.getElementById('metaLeft').textContent = `${D.start} ~ ${D.end} · 共 ${D.days} 天`;
  document.getElementById('title').textContent = `看 ${A.replace('(kg)','').replace('(卡)','').replace('(g)','').replace('(ml)','').replace('(%)','')} vs ${B.replace('(kg)','').replace('(卡)','').replace('(g)','').replace('(ml)','').replace('(%)','')}`;
  document.getElementById('sub').textContent = `${A} vs ${B} · ${D.window} 窗口`;

  const r = D.correlation.r;
  document.getElementById('kpiR').textContent = r === null || r === undefined ? '—' : r.toFixed(3);
  document.getElementById('kpiRExtra').textContent = r === null ? '数据不足' : (Math.abs(r)>=0.5?'强相关':Math.abs(r)>=0.3?'中等相关':'弱相关');
  document.getElementById('kpiA').textContent = D.a_avg ?? '—';
  document.getElementById('kpiAExtra').textContent = `Δ ${D.a_delta ?? 0 >= 0 ? '+' : ''}${D.a_delta ?? 0} · ${D.a_count} 天`;
  document.getElementById('kpiB').textContent = D.b_avg ?? '—';
  document.getElementById('kpiBExtra').textContent = `Δ ${D.b_delta ?? 0 >= 0 ? '+' : ''}${D.b_delta ?? 0} · ${D.b_count} 天`;
  document.getElementById('kpiN').textContent = D.correlation.n;

  document.getElementById('legA').textContent = A;
  document.getElementById('legB').textContent = B;

  // #317 迁 Base charts.line 双系列: 各轴独立 min-max → 归一化共享 0-100 域近似
  // (charts.line 无双轴独立刻度 — 记偏离)
  const line = D.line || [];
  if (line.length === 0) {
    document.getElementById('dualChart').innerHTML = '<div style="text-align:center;color:#86868b;padding:40px">窗口内无数据</div>';
  } else {
    const aVals = line.map(p => p.a).filter(v => v !== null && v !== undefined);
    const bVals = line.map(p => p.b).filter(v => v !== null && v !== undefined);
    const norm = (vals, get) => {
      if (!vals.length) return null;
      const mn = Math.min(...vals), mx = Math.max(...vals);
      // #317 验收修复: 数据恒定(mx==mn)时归一化给 50(居中水平线), 否则全 0 贴底视觉"线消失"
      const range = (mx - mn) || 1;
      const flat = mx === mn;
      return line.map(p => {
        const v = get(p);
        return { label: p.date.slice(5), value: (v === null || v === undefined) ? null : (flat ? 50 : (v - mn) / range * 100) };
      });
    };
    const aItems = norm(aVals, p => p.a);
    const bItems = norm(bVals, p => p.b);
    const first = aItems || bItems;
    if (first) {
      const series = [];
      if (aItems) series.push({ name: A, items: aItems, color: '#0071e3' });
      if (bItems) series.push({ name: B, items: bItems, color: '#ff9500', dashed: true });
      window.charts.line(document.getElementById('dualChart'), first, {
        height: 240,
        yMin: 0, yMax: 100,
        labels: 'select',
        tooltip: true,
        series,
      });
    }
  }

  // #317 散点+回归无图表接口 → 降级为回归方程文字行(记偏离)
  const sc = document.getElementById('scatterChart');
  const pts = D.scatter || [];
  if (pts.length === 0) {
    sc.innerHTML = '<div style="text-align:center;color:#86868b;padding:40px">无对齐样本,无法画散点</div>';
  } else if (D.regression) {
    const { slope, intercept } = D.regression;
    const rv = D.correlation && D.correlation.r;
    sc.innerHTML =
      `<div style="display:flex;gap:14px;flex-wrap:wrap;align-items:center;padding:8px 2px">` +
      `<div style="font-size:13px;color:var(--fg2)">回归方程</div>` +
      `<div style="font-size:15px;font-weight:700;color:var(--good)">y = ${slope}x ${intercept >= 0 ? '+' : ''}${intercept}</div>` +
      (rv !== null && rv !== undefined ?
        `<div style="font-size:13px;color:var(--fg2)">相关系数 r = ${rv.toFixed(3)} · 样本 ${pts.length} 对</div>` : '') +
      `</div>`;
  }

  // 滞后相关
  const lagT = document.getElementById('lagTable');
  const lag = D.lag || [];
  if (lag.length === 0) {
    document.getElementById('lagSection').style.display = 'none';
  } else {
    lag.forEach(l => {
      const rv = l.r === null ? '—' : l.r.toFixed(3);
      const note = l.r === null ? '样本不足' : Math.abs(l.r) >= 0.3 ? '存在延迟关联' : '关联弱';
      lagT.insertAdjacentHTML('beforeend', `<tr><td>前 ${l.lag} 天</td><td>${rv}</td><td>${note}</td></tr>`);
    });
  }

  // 分层
  const st = D.strat || {};
  const stratT = document.getElementById('stratTable');
  const rows = st.rows || [];
  const extras = st.extra || [];
  if (rows.length === 0 && extras.length === 0) {
    document.getElementById('stratSection').style.display = 'none';
  } else {
    rows.forEach(r => {
      stratT.insertAdjacentHTML('beforeend',
        `<tr><td>${r.label}${r.note ? ` <span style="color:var(--warn);font-size:11px">(${r.note})</span>` : ''}</td><td>${r.days ?? '—'}</td><td>${r.a_delta === undefined || r.a_delta === null ? '—' : (r.a_delta >= 0 ? '+' : '') + r.a_delta}</td><td>${r.b_avg ?? '—'}</td></tr>`);
    });
    if (extras.length) {
      extras.forEach(e => stratT.insertAdjacentHTML('beforeend',
        `<tr><td colspan="4" style="color:var(--fg2);font-size:12px">${e.replace(/</g, '&lt;')}</td></tr>`));
    }
  }

  // 超标日标注(看体重 vs 摄入)
  const over = D.over_limit_days || [];
  const buckets = D.deficit_buckets || [];
  let extraNote = '';
  if (over.length) extraNote += window.statusBadge('warn', `⚠ 超标日 ${over.length} 天`);
  if (buckets.length) extraNote += buckets.map(b => `${b.label}: ${b.days}天`).join(' · ');
  if (extraNote) {
    document.querySelector('.meta-bar .left').insertAdjacentHTML('afterend', `<div style="margin-left:auto;display:flex;gap:4px;flex-wrap:wrap">${extraNote}</div>`);
  }

  document.getElementById('insight').innerHTML = `<b>💡 一句话洞察:</b> ${D.insight || '--'}`;
  document.getElementById('srcLine').textContent = `📊 组合分析 · ${A} vs ${B} · render_analysis.py --view combined`;})();


</script>


<div id="actionbar-zone"></div>
<script>(function(){var z=document.getElementById('actionbar-zone');if(z&&window.actionBar&&window.__P__){z.innerHTML=window.actionBar(window.__P__);}})();</script>
</body>
</html>
