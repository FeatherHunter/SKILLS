<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>卡路里 · 操作回执</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --fg:#1d1d1d; --fg2:#6e6e73; --fg3:#86868b; --bg:#fafafa;
    --card:#fff; --border:#d2d2d7; --accent:#0071e3;
    --good:#34c759; --warn:#ff9500; --bad:#ff3b30; --soft:#f5f5f7;
  }
  body { font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
         line-height:1.6; color:var(--fg); background:var(--bg);
         max-width:780px; margin:0 auto; padding:48px 24px 80px;
         -webkit-font-smoothing:antialiased; }
  .meta-bar { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
  .meta-bar .left { font-size:12px; color:var(--fg2); }
  .meta-bar .type-badge { font-size:11px; padding:3px 10px; border-radius:6px; background:var(--good); color:#fff; font-weight:700; }
  h1 { font-size:32px; font-weight:700; letter-spacing:-.025em; margin-bottom:4px; }
  .sub { font-size:14px; color:var(--fg3); margin-bottom:24px; }
  .pill { display:inline-block; padding:2px 9px; border-radius:10px; font-size:11px; font-weight:600; margin-right:4px; }
  .pill-good { background:rgba(52,199,89,.15); color:var(--good); }
  .pill-warn { background:rgba(255,149,0,.15); color:var(--warn); }
  .pill-bad  { background:rgba(255,59,48,.15); color:var(--bad); }
  .pill-info { background:rgba(0,113,227,.15); color:var(--accent); }
  /* 顶部 ID 卡 */
  .id-card { background:linear-gradient(135deg,#e8f5e8,#f0f8ff); border:1px solid var(--good);
             border-radius:16px; padding:24px; text-align:center; margin-bottom:20px; }
  .id-card.delete { background:linear-gradient(135deg,#ffeaea,#fff5f5); border-color:var(--bad); }
  .id-card.update { background:linear-gradient(135deg,#fff5e5,#fffaf0); border-color:var(--warn); }
  .id-card .headline { display:flex; align-items:center; justify-content:center; gap:10px; flex-wrap:wrap; }
  .id-card .icon { font-size:24px; margin:0; }
  .id-card .title { font-size:18px; font-weight:700; margin:0; }
  .id-card .id { font-size:13px; font-weight:600; color:var(--fg3); font-variant-numeric:tabular-nums; margin:0; }
  .id-card .meta { font-size:13px; color:var(--fg2); display:none; } /* #44 审查:时间·场景行去掉(时间已在页眉) */
  .id-card .summary { flex-basis:100%; margin-top:12px; font-size:15px; color:var(--fg); line-height:1.7; }
  .id-card .sum-line { margin-top:10px; }
  .id-card .sum-nums { color:var(--accent); font-weight:600; } /* #44 审查:核心数据(克数/卡)颜色强调 */
.sum-old { color:#c7254e; text-decoration:line-through; font-weight:500; } /* 2026-08-03 场景 6 终审:汇总句 旧→新 变更语义(与 diff 卡同约定) */
.sum-new { color:var(--good); font-weight:600; }
  .id-card .sum-kpis { margin-top:6px; display:flex; align-items:baseline; justify-content:center; gap:8px; flex-wrap:wrap; }
  .id-card .sum-label { font-size:12px; color:var(--fg3); }
  .id-card .sum-val { font-size:16px; font-weight:600; color:var(--fg); font-variant-numeric:tabular-nums; }
  .id-card .sum-remain { font-size:22px; font-weight:700; font-variant-numeric:tabular-nums; }
  .id-card .sum-remain.good { color:var(--good); }
  .id-card .sum-remain.warn { color:var(--warn); }
  .id-card .sum-remain.bad { color:var(--bad); }
  .id-card .sum-dot { color:var(--fg3); }
  /* KPI 4 卡 */
  .kpi-grid { display:none; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:20px; } /* 默认隐藏,有数据才显示(2026-08-02) */
  .kpi { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:16px 18px; }
  .kpi .label { font-size:11px; color:var(--fg2); margin-bottom:4px; }
  .kpi .value { font-size:18px; font-weight:700; }
  .kpi .extra { font-size:11px; color:var(--fg3); margin-top:3px; }
  /* 字段对比卡(改/删时显示)*/
  .diff-card { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:22px 26px; margin-bottom:16px; }
  .diff-card h2 { font-size:17px; font-weight:600; margin-bottom:14px; }
.diff-row { display:grid; grid-template-columns:1fr auto 1fr; gap:12px; padding:10px 0; border-bottom:1px solid var(--border); align-items:center; }
.diff-row:last-child { border-bottom:none; }
.diff-label { font-size:12px; color:var(--fg2); }
.diff-old { padding:8px 12px; background:#ffeaea; border-radius:8px; font-size:13px; color:#c7254e; font-weight:500; text-decoration:line-through; }
.diff-new { padding:8px 12px; background:rgba(52,199,89,.15); border-radius:8px; font-size:13px; color:var(--good); font-weight:600; }
.diff-arrow { font-size:18px; color:var(--fg3); }
/* 影响提示:独立行(diff-row 之外 · 2026-08-02 修复红绿框水平不对齐) */
.diff-impact { font-size:11px; color:var(--fg2); padding:2px 0 8px 12px; border-bottom:1px solid var(--border); }
.diff-row:has(+ .diff-impact) { border-bottom:none; }
  /* 上下文卡(增/改时显示今日累计)*/
  .ctx-card { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:22px 26px; margin-bottom:16px; }
  .ctx-card h2 { font-size:17px; font-weight:600; margin-bottom:14px; }
  .ctx-row { display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--border); font-size:14px; }
  .ctx-row:last-child { border-bottom:none; }
  .ctx-row .label { color:var(--fg2); }
  .ctx-row .value { font-weight:600; font-variant-numeric:tabular-nums; }
  .ctx-row .pct { font-size:11px; color:var(--fg3); margin-left:6px; }
  /* Footer 按钮 */
  .footer { margin-top:24px; padding:16px 18px; background:transparent; border-radius:12px; display:flex; justify-content:flex-end; align-items:center; }
  .footer .btn-group { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .btn { border:1px solid var(--border); background:var(--card); padding:8px 16px; border-radius:8px;
         cursor:pointer; font-size:13px; color:var(--fg); min-height:36px; }
  .btn:hover { background:var(--accent); color:#fff; border-color:var(--accent); }
  .btn-primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  .btn-primary:hover { background:#005bb0; }
  /* 2026-08-03 · ticket #43 场景 6 终审:删除 .copied 点击变绿(仅 toast 反馈) */
  /* 移动端触屏:tap 后不粘 hover 色(2026-08-03 运动验收:点击后按钮不应变色) */
  @media (hover: none) {
    .btn:hover { background:var(--card); color:var(--fg); border-color:var(--border); }
    .btn-primary:hover { background:var(--accent); color:#fff; }
  }
  /* Phase 3c:mobile 断点(640px 以下单列堆叠 + 缩 padding) */
  @media (max-width:640px) {
    body { padding:20px 14px 80px; }
    h1 { font-size:22px; }
    .section { padding:16px 18px; border-radius:12px; }
    .kpi-grid { grid-template-columns:1fr 1fr; gap:10px; }
    .food-card .macros { grid-template-columns:1fr 1fr; }
    /* 移动端:footer 纵向排(来源行在上,按钮组在下占满宽) · 2026-08-02 */
    .footer { flex-direction:row; justify-content:flex-end; }
    .footer .btn-group { justify-content:stretch; }
    .footer .btn-group .btn { flex:1 1 45%; min-height:44px; margin-left:0; }
    /* 移动端:diff 三列改上下结构(字段名/旧值/新值各占一行,影响文本不被挤压) · 2026-08-02 · #44 审查:去掉 label 后 ::after 箭头(视觉残留),旧值删除线红 + 新值绿已足够表达变更 */
    .diff-row { grid-template-columns:1fr; gap:4px; }
    .diff-arrow { display:none; }
    .diff-label { font-size:12px; color:var(--fg2); font-weight:600; }
    .diff-impact { white-space:normal; word-break:break-word; }
  }
  /* table 在小屏内滚 */
  .table-wrap { overflow-x:auto; -webkit-overflow-scrolling:touch; }

</style>
</head>
<body>

<!--INJECT-DATA-->

<div class="meta-bar">
  <div class="left" id="metaLeft">--</div>
  <div class="type-badge">回执型 · 通用 CRUD</div>
</div>

<h1 id="h1Title">✅ 操作回执</h1>
<p class="sub" id="sub">--</p>

<div class="id-card" id="idCard">
  <div class="headline">
    <div class="icon" id="icon">✓</div>
    <div class="title" id="opTitle">--</div>
    <div class="id" id="recordId">--</div>
  </div>
  <div class="meta" id="recordMeta">--</div>
  <div class="summary" id="summaryLine" style="display:none"></div>
</div>

<div class="kpi-grid" id="kpiGrid"></div>

<div class="diff-card" id="diffCard" style="display:none">
  <h2>📋 字段变更</h2>
  <div id="diffList"></div>
</div>

<div class="ctx-card" id="ctxCard">
  <h2>📊 今日累计</h2>
  <div id="ctxList"></div>
</div>

<div class="footer">
  <div class="btn-group">
    <button class="btn" id="undoBtn">↩ 撤销(复制指令)</button>
    <button class="btn btn-primary" id="copyDataBtn">📋 复制数据</button>
    <button class="btn" id="copyLogBtn">📋 复制日志</button>
  </div>
</div>

<script>
(function(){
  const D = window.__DATA__;
  if (!D || D.status !== 'ok') {
    document.body.innerHTML = '<div style="padding:60px;text-align:center;color:#86868b">⚠ 数据未注入或状态非 ok</div>';
    return;
  }
  const { op, record_id, old_record, new_record, context, meta } = D.data;

  function escapeHTML(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => (
      {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]
    ));
  }

  document.getElementById('metaLeft').textContent = meta.action_at;
  const opLabels = {add:'新增', create:'新增', update:'修改', delete:'删除'};
  const opColors = {add:'good', create:'good', update:'warn', delete:'bad'};
  const opIcons  = {add:'✓', create:'✓', update:'✎', delete:'✕'};
  const opLabel = opLabels[op] || op;
  const opClass = opColors[op] || 'good';
  const opIcon  = opIcons[op]  || '✓';

  // 顶部 ID 卡
  const idCard = document.getElementById('idCard');
  idCard.className = 'id-card ' + (op === 'delete' ? 'delete' : op === 'update' ? 'update' : '');
  document.getElementById('icon').textContent = opIcon;
  document.getElementById('opTitle').textContent = opLabel + '成功';
  document.getElementById('recordId').textContent = '#' + record_id;
  document.getElementById('recordMeta').style.display = 'none';  // #44 审查:时间·场景行去掉(时间已在页眉 meta-bar)
  document.getElementById('recordMeta').textContent = meta.action_at + ' · ' + meta.entity_type;

  document.getElementById('sub').innerHTML =
    `<span class="pill pill-${opClass}">${opLabel}</span> ${meta.entity_type} ${opLabel}成功`;

  // KPI 卡(仅当数据提供 kpis 时渲染;profile 场景已不填,见 render_crud_receipt.py · 2026-08-02)
  const kpiGrid = document.getElementById('kpiGrid');
  if (context && context.kpis && context.kpis.length) {
    kpiGrid.style.display = 'grid';
    context.kpis.forEach(k => {
      kpiGrid.insertAdjacentHTML('beforeend',
        `<div class="kpi"><div class="label">${k.label}</div>` +
        `<div class="value">${k.value}</div>` +
        (k.extra ? `<div class="extra">${k.extra}</div>` : '') +
        `</div>`);
    });
  }

  // 1 句话总结(2026-08-02 用户拍板:prompt 承诺的总结必须在 HTML 有对应物)
  // #44 审查(2026-08-03 用户拍板):关键数字突出设计——一句话常规,「今日累计 X/Y · 剩余 Z」拆为数字行(大号主色),不加背景不全加粗
  if (D.data.summary) {
    const sl = document.getElementById('summaryLine');
    const s = D.data.summary;
    // #44 审查:累计段兼容「今日/当日累计」+ 单位 卡|ml + 标记 剩余/超标/超过;核心数字 accent 色强调
    const m = s.match(/(?:今日|当日)累计\s*([\d,]+)\s*\/\s*([\d,]+)\s*(卡|ml)\s*[,，]?\s*[（(]?\s*(?:剩余|超标|超过)\s*(-?[\d,]+)\s*(卡|ml)\s*[）)]?/);
    if (m) {
      const head = s.slice(0, m.index).replace(/[;；]\s*$/, '');
      // 剩余量状态驱动配色——充裕绿 / 接近上限橙 / 已超红;单位随场景(卡|ml)
      const unit = m[5] || m[3];
      const rawRemain = parseInt(m[4].replace(/,/g, ''), 10);
      const isOver = /超过|超标/.test(m[0]);   // 「超过/超标 X」= 已超出,X 为正数
      const remain = isOver ? -Math.abs(rawRemain) : rawRemain;
      const target = parseInt(m[2].replace(/,/g, ''), 10);
      let cls = 'good', remainTxt = `剩余 ${rawRemain} ${unit}`;
      if (isOver || remain < 0) { cls = 'bad'; remainTxt = `已超 ${Math.abs(rawRemain)} ${unit}`; }
      else if (target > 0 && remain <= Math.round(target * 0.2)) { cls = 'warn'; }
      sl.innerHTML =
        `<div class="sum-line">💬 ${escapeHTML(head).replace(/\(([\d.]+)g, ([\d.]+)卡\)/, '(<span class="sum-nums">$1g, $2卡</span>)')}</div>` +
        `<div class="sum-kpis"><span class="sum-label">${m[0].includes('当日') ? '当日累计' : '今日累计'}</span>` +
        `<span class="sum-val">${m[1]} / ${m[2]} ${m[3]}</span>` +
        `<span class="sum-dot">·</span>` +
        `<span class="sum-remain ${cls}">${remainTxt}</span></div>`;
    } else {
      // 2026-08-03 运动验收:一句话总结中的关键数值(数字+单位:卡/分钟/克/步/km/条等)accent 色强化
      // 2026-08-03 场景 6 终审:「旧→新」变更对子按 diff 卡约定着色(旧值红删除线/新值绿),
      // 其余关键数字保持 accent 蓝(占位符防嵌套)
      const isChange = op === 'update' || op === 'delete';
      const parts = [];
      let s2 = escapeHTML(s);
      if (isChange) {
        s2 = s2.replace(/([^\s,，;；→]+?)→([^\s,，;；]+)/g, (m, a, b) => {
          parts.push(`<span class="sum-old">${a}</span>→<span class="sum-new">${b}</span>`);
          return '\u0000' + (parts.length - 1) + '\u0000';
        });
      }
      s2 = s2.replace(/(\d+(?:\.\d+)?\s*(?:卡|分钟|克|步|km|ml|组|kg|次|条))/g, '<span class="sum-nums">$1</span>');
      s2 = s2.replace(/\u0000(\d+)\u0000/g, (m, i) => parts[+i]);
      sl.innerHTML = '💬 ' + s2;
    }
    sl.style.display = 'block';
  }

  // diff 卡(只 update 模式;字段用中文标签 · 2026-08-02 用户拍板)
  // 2026-08-02 扩充(ticket #3 饮食):食物/克数/热量/蛋白/碳水/脂肪/餐别/时间 + 食品库字段
  const FIELD_LABELS = {height_cm:'身高', age:'年龄', gender:'性别', activity_level:'活动量', note:'备注', weight_kg:'体重', bmi:'BMI',
    food_name:'食物名', grams:'克数', calories:'热量', protein:'蛋白', carbs:'碳水', fat:'脂肪',
    meal:'餐别', time:'时间', date:'日期', ml:'饮水量', from:'来源日期', to:'目标日期',
    start:'开始日期', end:'结束日期', today_total_ml:'今日累计', target_ml:'目标', remaining_ml:'剩余',
    product_name:'食品名', brand:'品牌', saturated_fat:'饱和脂肪', carbohydrates:'碳水',
    sugar:'糖', dietary_fiber:'膳食纤维', sodium:'钠', category:'分类', source:'来源',
    is_deprecated:'下架状态', updated_at:'更新时间', created_at:'创建时间',
    exercise_type:'运动类型', duration_minutes:'时长', calories_burned:'消耗', distance_km:'距离',
    avg_heart_rate:'平均心率', max_heart_rate:'最高心率', steps:'步数', set_index:'组号',
    load_kg:'单侧重量', reps:'次数', is_backfill:'补录', difficulty:'强度',
    exercise_goal:'运动目标', copied:'复制条数', skipped:'跳过条数', written:'写入条数',
    failed:'失败条数', failures:'失败明细', deleted_count:'删除条数', matched:'命中条数',
    source_date:'来源日期', target_date:'目标日期', start_date:'开始日期', end_date:'结束日期',
    'period':'时段'};
  const ACT_LABELS = {sedentary:'久坐', light:'轻度活动', moderate:'中度活动', active:'活跃', very_active:'高度活跃'};
  const UNIT_LABELS = {grams:'g', calories:'卡', protein:'g', carbs:'g', fat:'g', ml:'ml', sodium:'mg'};
  function fmtVal(k, v) {
    if (k === 'activity_level') return ACT_LABELS[v] || v;
    if (k === 'gender') return v === 'male' ? '男' : v === 'female' ? '女' : v;
    if (k === 'is_deprecated') return v == 1 ? '已下架' : '正常';
    if (v === null || v === undefined) return '—';
    const unit = UNIT_LABELS[k];
    return unit ? `${v} ${unit}` : v;
  }
  if (op === 'update' && old_record && new_record) {
    const diffCard = document.getElementById('diffCard');
    diffCard.style.display = 'block';
    const diffList = document.getElementById('diffList');
    const keys = Object.keys(new_record);
    keys.forEach(k => {
      if (k === 'id' || k === 'created_at' || k === 'updated_at') return;
      if (k.startsWith('__impact_')) return;  // 影响提示由下方按字段映射渲染
      const oldV = old_record[k];
      const newV = new_record[k];
      if (oldV === newV) return;
      const impact = new_record['__impact_' + k];
      const label = FIELD_LABELS[k] || k;
      // impact 放 diff-row 之外独立一行(2026-08-02 修复:挂新值列内会撑高绿框导致红绿框水平不对齐)
      diffList.insertAdjacentHTML('beforeend',
        `<div class="diff-row">` +
        `<div><div class="diff-label">${label}</div><div class="diff-old">${fmtVal(k, oldV)}</div></div>` +
        `<div class="diff-arrow">→</div>` +
        `<div><div class="diff-label">新值</div><div class="diff-new">${fmtVal(k, newV)}</div></div>` +
        `</div>` +
        (impact ? `<div class="diff-impact">${impact}</div>` : ''));
    });
    // 无实际变更行 → 不显示空白的字段变更卡(2026-08-02 用户反馈:重复设置相同值时空卡)
    if (diffList.children.length === 0) {
      diffCard.style.display = 'none';
    }
  } else if (op === 'delete' && old_record && Object.keys(old_record).length) {
    // 删除前快照(2026-08-02 · ticket #3:删饮食记录/删一餐/删某日/批量删 的「删除前快照」承诺)
    const diffCard = document.getElementById('diffCard');
    diffCard.style.display = 'block';
    const diffList = document.getElementById('diffList');
    Object.keys(old_record).forEach(k => {
      if (k === 'id' || k === 'created_at' || k === 'updated_at') return;
      if (k.startsWith('__impact_')) return;
      const v = old_record[k];
      if (v === null || v === undefined || v === '' || v === 0) return;
      const label = FIELD_LABELS[k] || k;
      diffList.insertAdjacentHTML('beforeend',
        `<div class="diff-row">` +
        `<div><div class="diff-label">${label}</div><div class="diff-old">${fmtVal(k, v)}</div></div>` +
        `<div class="diff-arrow">→</div>` +
        `<div><div class="diff-label">已删除</div><div class="diff-new">—</div></div>` +
        `</div>`);
    });
    if (diffList.children.length === 0) {
      diffCard.style.display = 'none';
    }
  } else if (op === 'create' && new_record && Object.keys(new_record).length) {
    // 新增内容(ticket #3:记一餐/记喝水/存食品 的「食物名/克数/营养 + 餐别 + 时间」承诺)
    const diffCard = document.getElementById('diffCard');
    diffCard.style.display = 'block';
    const diffList = document.getElementById('diffList');
    Object.keys(new_record).forEach(k => {
      if (k === 'id' || k === 'created_at' || k === 'updated_at') return;
      if (k.startsWith('__impact_')) return;
      const v = new_record[k];
      if (v === null || v === undefined || v === '' || v === 0) return;
      const label = FIELD_LABELS[k] || k;
      diffList.insertAdjacentHTML('beforeend',
        `<div class="diff-row">` +
        `<div><div class="diff-label">${label}</div><div class="diff-new" style="text-decoration:none;color:var(--fg);font-weight:600">${fmtVal(k, v)}</div></div>` +
        `<div class="diff-arrow" style="visibility:hidden">→</div>` +
        `<div></div>` +
        `</div>`);
    });
    if (diffList.children.length === 0) {
      diffCard.style.display = 'none';
    }
  }

  // context 卡(今日累计)
  if (context && context.totals) {
    const ctxList = document.getElementById('ctxList');
    context.totals.forEach(t => {
      const pct = t.target ? `<span class="pct">/ ${t.target} (${Math.round(t.value / t.target * 100)}%)</span>` : '';
      ctxList.insertAdjacentHTML('beforeend',
        `<div class="ctx-row">` +
        `<div class="label">${t.label}</div>` +
        `<div><span class="value">${t.value} ${t.unit || ''}</span>${pct}</div>` +
        `</div>`);
    });
  } else {
    document.getElementById('ctxCard').style.display = 'none';
  }



  // 撤销按钮:只在 meta.undo_cli 存在时启用(围度/体脂/记吃场景不传 undo_cli → 自动隐藏)
  const undoBtn = document.getElementById('undoBtn');
  if (meta.undo_cli) {
    undoBtn.style.display = 'inline-block';
    undoBtn.onclick = () => {
      if (undoBtn.disabled) return;
      const undoCmd = `请撤销刚才的${opLabel}${meta.entity_type}(操作时间 ${meta.action_at}),执行细节请按技能流程处理`;
      const done = () => {
        // 2026-08-03 · ticket #43 场景 6 终审:取消变绿闪烁,仅 toast
        showToast('✓ 撤销指令已复制');
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(undoCmd).then(done).catch(() => { fallbackCopy(undoCmd); done(); });
      } else { fallbackCopy(undoCmd); done(); }
    };
  } else {
    undoBtn.style.display = 'none';
  }

  // 复制工具:clipboard API + textarea fallback + toast(2026-08-02 对齐 crud_view)
  function showToast(msg) {
    let t = document.getElementById('copyToast');
    if (!t) {
      t = document.createElement('div');
      t.id = 'copyToast';
      t.style.cssText = 'position:fixed;left:50%;bottom:24px;transform:translateX(-50%);' +
        'background:rgba(28,28,30,.92);color:#fff;padding:10px 18px;border-radius:10px;' +
        'font-size:13px;z-index:999;max-width:86vw;text-align:center;box-shadow:0 4px 16px rgba(0,0,0,.2);';
      document.body.appendChild(t);
    }
    t.textContent = msg;
    t.style.display = 'block';
    clearTimeout(t._timer);
    t._timer = setTimeout(() => { t.style.display = 'none'; }, 3200);
  }
  function copyText(text, btn, okMsg) {
    const after = () => {
      // 2026-08-03 · ticket #43 场景 6 终审:取消按钮变绿闪烁(原 .copied),仅 toast 反馈
      showToast(okMsg);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(after).catch(() => { fallbackCopy(text); after(); });
    } else { fallbackCopy(text); after(); }
  }
  function fallbackCopy(text) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.focus(); ta.select();
    try { document.execCommand('copy'); } catch(e) {}
    document.body.removeChild(ta);
  }

  // 复制数据:用户关心信息的人类可读文本
  function buildDataText() {
    const lines = [`${opLabel}${meta.entity_type}成功 #${record_id} (${meta.action_at})`, ''];
    if (D.data.summary) lines.push(`💬 ${D.data.summary}`, '');
    if (context && context.kpis) {
      context.kpis.forEach(k => lines.push(`${k.label}: ${k.value}${k.extra ? ' ' + k.extra : ''}`));
      lines.push('');
    }
    if (op === 'update' && old_record && new_record) {
      lines.push('字段变更:');
      Object.keys(new_record).forEach(k => {
        if (k.startsWith('__impact_') || k === 'created_at' || k === 'updated_at') return;
        if (old_record[k] !== new_record[k]) {
          lines.push(`  ${FIELD_LABELS[k] || k}: ${fmtVal(k, old_record[k])} → ${fmtVal(k, new_record[k])}`);
          const imp = new_record['__impact_' + k];
          if (imp) lines.push(`    影响: ${imp}`);
        }
      });
    }
    return lines.join('\n');
  }

  // 复制日志:排障信息(含思考链/改前改后/撤销指令/原始数据)
  function buildLogText() {
    const lines = [`[${meta.entity_type} 排障日志]`, ''];
    lines.push(`唤醒词: ${meta.wake_word || '(未知)'}`);
    lines.push(`渲染命令: ${meta.render_cmd || '(未知)'}`);
    lines.push(`数据来源: ${meta.source || '(未知)'}`);
    lines.push(`操作时间: ${meta.action_at || '(未知)'}`);
    lines.push('');
    if (meta.chain) {
      lines.push(`AI 思考链:`);
      lines.push(meta.chain);
    } else {
      lines.push(`AI 思考链: (未注入 · 渲染时未传 --chain,AI 执行时用 --chain 附上处理步骤)`);
    }
    if (old_record && new_record) {
      lines.push('');
      lines.push(`改前:`);
      lines.push(JSON.stringify(old_record, null, 2));
      lines.push(`改后:`);
      lines.push(JSON.stringify(new_record, null, 2));
    }
    if (meta.undo_cli) {
      lines.push('');
      lines.push(`撤销指令: 请撤销 ${opLabel} ${meta.entity_type} #${record_id} (${meta.action_at})`);
      lines.push(`执行: ${meta.undo_cli}`);
    }
    return lines.join('\n');
  }

  document.getElementById('copyDataBtn').onclick = function() {
    copyText(buildDataText(), this, `${meta.entity_type} 数据复制成功 ✓`);
  };
  document.getElementById('copyLogBtn').onclick = function() {
    copyText(buildLogText(), this, '排障日志复制成功 ✓ 可将日志发给开发者/AI 定位问题');
  };
})();
</script>

</body>
