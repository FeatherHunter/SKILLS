<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>卡路里 · 饮食总览</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --fg:#1d1d1d; --fg2:#6e6e73; --fg3:#86868b; --bg:#fafafa;
    --card:#fff; --border:#d2d2d7; --accent:#0071e3;
    --good:#34c759; --warn:#ff9500; --bad:#ff3b30; --soft:#f5f5f7;
  }
  body { font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
         line-height:1.6; color:var(--fg); background:var(--bg);
         max-width:760px; margin:0 auto; padding:48px 24px 80px;
         -webkit-font-smoothing:antialiased; }
  h1 { font-size:28px; font-weight:700; letter-spacing:-.02em; margin-bottom:4px; }
  .sub { font-size:14px; color:var(--fg3); margin-bottom:24px; }
  .period { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:20px 24px; margin-bottom:16px; }
  .period h2 { font-size:17px; font-weight:600; margin-bottom:4px; }
  .period .range { font-size:12px; color:var(--fg3); margin-bottom:14px; }
  .kpi-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-bottom:14px; }
  .kpi { background:var(--soft); border-radius:12px; padding:12px 14px; }
  .kpi .label { font-size:11px; color:var(--fg2); margin-bottom:4px; }
  .kpi .value { font-size:20px; font-weight:700; }
  .chart { height:70px; display:flex; align-items:flex-end; gap:3px; }
  .chart .day { flex:1; background:var(--accent); opacity:.75; border-radius:3px 3px 0 0; min-height:2px; }
  .chart .day.empty { background:var(--soft); opacity:1; min-height:1px; }
  .chart .day:hover { opacity:1; }
  .footer { margin-top:24px; padding:14px 18px; background:var(--soft); border-radius:12px; display:flex; justify-content:space-between; align-items:center; }
  .footer .src { font-size:12px; color:var(--fg3); }
  .footer .btn-group { display:flex; gap:6px; }  /* #44:与全场景统一 */
  .btn { border:1px solid var(--border); background:var(--card); padding:6px 12px; border-radius:8px; cursor:pointer; font-size:12px; color:var(--fg); white-space:nowrap; }
  .btn:hover { background:var(--accent); color:#fff; border-color:var(--accent); }
  .btn.copied { background:var(--good); color:#fff; border-color:var(--good); }
  @media (max-width:640px) {
    body { padding:20px 14px 40px; }  /* #44:底部空白减半 */
    h1 { font-size:22px; }
    .period { padding:16px 18px; border-radius:12px; }
    /* #44:手机按钮纵向 + 均分不换行(与全场景统一) */
    .footer { flex-direction:column; align-items:stretch; gap:8px; }
    .footer .btn-group { justify-content:space-between; }
    .footer .btn-group .btn { flex:1; margin:0 4px; min-height:44px; }
    .footer .btn-group .btn:first-child { margin-left:0; }
    .footer .btn-group .btn:last-child { margin-right:0; }
  }
</style>
</head>
<body>

<!--INJECT-DATA-->

<h1>🍱 饮食总览</h1>
<p class="sub" id="sub">--</p>

<div class="period" id="weekBox">
  <h2>本周累计</h2>
  <div class="range" id="weekRange">--</div>
  <div class="kpi-grid">
    <div class="kpi"><div class="label">总热量</div><div class="value" id="wCal">--</div></div>
    <div class="kpi"><div class="label">日均热量</div><div class="value" id="wAvg">--</div></div>
    <div class="kpi"><div class="label">总蛋白</div><div class="value" id="wPro">--</div></div>
    <div class="kpi"><div class="label">有记录天数</div><div class="value" id="wDays">--</div></div>
  </div>
  <div class="chart" id="weekChart"></div>
</div>

<div class="period" id="monthBox">
  <h2>本月累计</h2>
  <div class="range" id="monthRange">--</div>
  <div class="kpi-grid">
    <div class="kpi"><div class="label">总热量</div><div class="value" id="mCal">--</div></div>
    <div class="kpi"><div class="label">日均热量</div><div class="value" id="mAvg">--</div></div>
    <div class="kpi"><div class="label">总蛋白</div><div class="value" id="mPro">--</div></div>
    <div class="kpi"><div class="label">有记录天数</div><div class="value" id="mDays">--</div></div>
  </div>
  <div class="chart" id="monthChart"></div>
</div>

<div class="footer">
  <div class="src" id="srcLine">📊 数据来源:--</div>
  <div class="btn-group">
    <button class="btn" id="copyBtn">📋 复制数据</button>
    <button class="btn" id="copyLogBtn">📋 复制日志</button>
  </div>
</div>

<script>
// #44:复制工具全局函数(统一标准:文字不变 + 绿闪 + toast + .catch fallback)
let toastTimer = null;
function showToast(msg) {
  let t = document.getElementById('copyToast');
  if (!t) {
    t = document.createElement('div');
    t.id = 'copyToast';
    t.style.cssText = 'position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:rgba(28,28,30,.92);color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;z-index:999;box-shadow:0 4px 12px rgba(0,0,0,.2);transition:opacity .3s;';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.style.opacity = '1';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.style.opacity = '0'; }, 2000);
}
function fallbackCopyText(txt) {
  const ta = document.createElement('textarea');
  ta.value = txt; ta.style.position = 'fixed'; ta.style.left = '-9999px';
  document.body.appendChild(ta); ta.focus(); ta.select();
  try { document.execCommand('copy'); } catch (e) {}
  document.body.removeChild(ta);
}
(function(){
  const D = window.__DATA__;
  if (!D || D.status !== 'ok') {
    document.body.innerHTML = '<div style="padding:60px;text-align:center;color:#86868b">⚠ 数据未注入或状态非 ok</div>';
    return;
  }
  const { week, month, meta } = D.data;
  document.getElementById('sub').textContent = `看饮食总览 · 周期累计(不含今日) · ${meta.today}`;
  document.getElementById('weekRange').textContent = `${week.start} ~ ${week.end} · 共 ${week.days} 天`;
  document.getElementById('wCal').textContent = week.total_cal.toLocaleString() + ' 卡';
  document.getElementById('wAvg').textContent = week.avg_cal.toLocaleString() + ' 卡/天';
  document.getElementById('wPro').textContent = week.total_pro + 'g';
  document.getElementById('wDays').textContent = week.with_data_days + ' 天';
  document.getElementById('monthRange').textContent = `${month.start} ~ ${month.end} · 共 ${month.days} 天`;
  document.getElementById('mCal').textContent = month.total_cal.toLocaleString() + ' 卡';
  document.getElementById('mAvg').textContent = month.avg_cal.toLocaleString() + ' 卡/天';
  document.getElementById('mPro').textContent = month.total_pro + 'g';
  document.getElementById('mDays').textContent = month.with_data_days + ' 天';

  function renderChart(elId, daily) {
    const el = document.getElementById(elId);
    const max = Math.max(...daily.map(d => d.cal), 1);
    daily.forEach(d => {
      // #44:无记录天 1px 空柱占位(趋势连续)
      const has = d.cal > 0;
      const h = has ? Math.max(2, Math.round(d.cal / max * 68)) : 1;
      const bar = document.createElement('div');
      bar.className = 'day' + (has ? '' : ' empty');
      bar.style.height = h + 'px';
      bar.title = `${d.date} · ${d.cal} 卡`;
      el.appendChild(bar);
    });
  }
  renderChart('weekChart', week.daily);
  renderChart('monthChart', month.daily);

  document.getElementById('srcLine').textContent = `📊 数据来源:food_log · 周期累计 · 不含今日`;
  document.getElementById('copyBtn').onclick = function() {
    let r = `饮食总览 (不含今日, ${meta.today})\n`;
    r += `本周(${week.start}~${week.end}): 总热量 ${week.total_cal} 卡, 日均 ${week.avg_cal} 卡, 总蛋白 ${week.total_pro}g\n`;
    r += `本月(${month.start}~${month.end}): 总热量 ${month.total_cal} 卡, 日均 ${month.avg_cal} 卡, 总蛋白 ${month.total_pro}g\n`;
    const done = () => { this.classList.add('copied'); setTimeout(() => this.classList.remove('copied'), 2000); showToast('饮食总览数据复制成功 ✓'); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(r).then(done).catch(() => { fallbackCopyText(r); done(); });
    } else { fallbackCopyText(r); done(); }
  };
})();

  // 复制日志(#44 审查补 · R3 排障):数据来源/生成时间/思考链/原始数据
  (function () {
    const logBtn = document.getElementById('copyLogBtn');
    if (!logBtn) return;
    const D0 = window.__DATA__ || {};
    const META = (D0.data && D0.data.meta) || D0.meta || {};
    const srcTxt = (document.getElementById('srcLine') || {}).textContent || '';
    const title = (document.querySelector('h1') || {}).textContent || '结果';
    logBtn.onclick = function () {
      const lines = ['[' + title + ' 排障日志]', ''];
      lines.push('数据来源: ' + srcTxt);
      lines.push('生成时间: ' + (META.today || META.date || META.start || ''));
      if (META.chain) { lines.push('AI 思考链:'); lines.push(META.chain); }
      else { lines.push('AI 思考链: (未注入 · 渲染时未传 --chain,AI 执行时用 --chain 附上处理步骤)'); }
      lines.push('');
      lines.push('原始数据:');
      lines.push(JSON.stringify(D0, null, 2));
      const txt = lines.join('\n');
      // #44:统一标准——文字不变 + 绿闪 + toast + .catch fallback
      const done = function () {
        logBtn.classList.add('copied');
        setTimeout(function () { logBtn.classList.remove('copied'); }, 2000);
        showToast('排障日志已复制 ✓');
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(txt).then(done).catch(function () { fallbackCopyText(txt); done(); });
      } else { fallbackCopyText(txt); done(); }
    };
  })();
</script>

</body>
</html>
