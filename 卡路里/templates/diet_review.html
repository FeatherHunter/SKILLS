<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>卡路里 · 饮食复盘</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --fg:#1d1d1d; --fg2:#6e6e73; --fg3:#86868b; --bg:#fafafa;
    --card:#fff; --border:#d2d2d7; --accent:#0071e3;
    --good:#34c759; --warn:#ff9500; --bad:#ff3b30; --soft:#f5f5f7;
  }
  body { font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
         line-height:1.6; color:var(--fg); background:var(--bg);
         max-width:760px; margin:0 auto; padding:48px 24px 80px;
         -webkit-font-smoothing:antialiased; }
  h1 { font-size:28px; font-weight:700; letter-spacing:-.02em; margin-bottom:4px; }
  .sub { font-size:14px; color:var(--fg3); margin-bottom:24px; }
  .kpi-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:20px; }
  .kpi { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:16px 18px; }
  .kpi .label { font-size:12px; color:var(--fg2); margin-bottom:6px; }
  .kpi .value { font-size:22px; font-weight:700; }
  .kpi .extra { font-size:11px; color:var(--fg3); margin-top:3px; }
  .section { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:22px 26px; margin-bottom:16px; }
  .section h2 { font-size:17px; font-weight:600; margin-bottom:14px; }
  .chart { height:110px; display:flex; align-items:flex-end; gap:3px; }
  .chart .day { flex:1; background:var(--accent); opacity:.75; border-radius:3px 3px 0 0; min-height:2px; }
  .chart .day:hover { opacity:1; }
  .top-list { list-style:none; }
  .top-list li { display:flex; justify-content:space-between; padding:9px 4px; border-bottom:1px solid var(--border); font-size:13px; }
  .top-list li:last-child { border-bottom:none; }
  .top-list .rank { color:var(--fg3); font-weight:600; margin-right:10px; }
  .top-list .cnt { color:var(--fg2); font-variant-numeric:tabular-nums; }
  .one-line { background:rgba(0,113,227,.08); border:1px solid rgba(0,113,227,.25); border-radius:10px; padding:12px 16px; font-size:13.5px; color:var(--accent); font-weight:500; }
  .footer { margin-top:24px; padding:14px 18px; background:var(--soft); border-radius:12px; display:flex; justify-content:space-between; align-items:center; }
  .footer .src { font-size:12px; color:var(--fg3); }
  .btn { border:1px solid var(--border); background:var(--card); padding:6px 12px; border-radius:8px; cursor:pointer; font-size:12px; color:var(--fg); }
  .btn:hover { background:var(--accent); color:#fff; border-color:var(--accent); }
  @media (max-width:640px) {
    body { padding:20px 14px 80px; }
    h1 { font-size:22px; }
    .section { padding:16px 18px; border-radius:12px; }
    .kpi-grid { grid-template-columns:1fr 1fr; gap:10px; }
  }
</style>
</head>
<body>

<!--INJECT-DATA-->

<h1>📝 饮食复盘</h1>
<p class="sub" id="sub">--</p>

<div class="one-line" id="oneLine">--</div>
<div style="height:14px"></div>

<div class="kpi-grid">
  <div class="kpi"><div class="label">总热量</div><div class="value" id="kCal">--</div></div>
  <div class="kpi"><div class="label">日均热量</div><div class="value" id="kAvg">--</div></div>
  <div class="kpi"><div class="label">总蛋白</div><div class="value" id="kPro">--</div></div>
  <div class="kpi"><div class="label">日均蛋白</div><div class="value" id="kAvgPro">--</div></div>
</div>

<div class="section">
  <h2>每日热量趋势</h2>
  <div class="chart" id="chart"></div>
</div>

<div class="section">
  <h2>高频食物 TOP5</h2>
  <ul class="top-list" id="top5"></ul>
</div>

<div class="footer">
  <div class="src" id="srcLine">📊 数据来源:--</div>
  <button class="btn" id="copyBtn">📋 复制数据</button>
</div>

<script>
(function(){
  const D = window.__DATA__;
  if (!D || D.status !== 'ok') {
    document.body.innerHTML = '<div style="padding:60px;text-align:center;color:#86868b">⚠ 数据未注入或状态非 ok</div>';
    return;
  }
  const { summary, top5, daily, meta } = D.data;
  document.getElementById('sub').textContent = `饮食复盘 · ${meta.start} ~ ${meta.end} · ${summary.days} 天`;
  document.getElementById('oneLine').textContent = summary.one_line;
  document.getElementById('kCal').textContent = summary.total_cal.toLocaleString() + ' 卡';
  document.getElementById('kAvg').textContent = summary.avg_cal.toLocaleString() + ' 卡/天';
  document.getElementById('kPro').textContent = summary.total_pro + 'g';
  document.getElementById('kAvgPro').textContent = summary.avg_pro + 'g/天';

  const chart = document.getElementById('chart');
  const max = Math.max(...daily.map(d => d.cal), 1);
  daily.forEach(d => {
    const bar = document.createElement('div');
    bar.className = 'day';
    bar.style.height = Math.max(2, Math.round(d.cal / max * 106)) + 'px';
    bar.title = `${d.date} · ${d.cal} 卡`;
    chart.appendChild(bar);
  });

  const list = document.getElementById('top5');
  if (!top5.length) {
    list.innerHTML = '<li style="color:#86868b">该时间段无高频食物</li>';
  }
  top5.forEach((t, i) => {
    list.insertAdjacentHTML('beforeend',
      `<li><span><span class="rank">#${i+1}</span>${t.food}</span><span class="cnt">${t.count} 次</span></li>`);
  });

  document.getElementById('srcLine').textContent = `📊 数据来源:food_log · 饮食专属复盘 · ${meta.start} → ${meta.end}`;
  document.getElementById('copyBtn').onclick = function() {
    let r = `饮食复盘 ${meta.start} ~ ${meta.end}\n`;
    r += `${summary.one_line}\n`;
    r += `总热量 ${summary.total_cal} 卡 | 日均 ${summary.avg_cal} 卡 | 总蛋白 ${summary.total_pro}g\n`;
    top5.forEach((t, i) => { r += `TOP${i+1}: ${t.food} (${t.count} 次)\n`; });
    navigator.clipboard.writeText(r).then(() => {
      this.textContent = '✓ 已复制';
      setTimeout(() => this.textContent = '📋 复制数据', 2000);
    });
  };
})();
</script>

</body>
</html>
