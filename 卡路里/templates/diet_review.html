<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>卡路里 · 饮食复盘</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --fg:#1d1d1d; --fg2:#6e6e73; --fg3:#86868b; --bg:#fafafa;
    --card:#fff; --border:#d2d2d7; --accent:#0071e3;
    --good:#34c759; --warn:#ff9500; --bad:#ff3b30; --soft:#f5f5f7;
  }
  body { font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
         line-height:1.6; color:var(--fg); background:var(--bg);
         max-width:760px; margin:0 auto; padding:48px 24px 80px;
         -webkit-font-smoothing:antialiased; }
  h1 { font-size:28px; font-weight:700; letter-spacing:-.02em; margin-bottom:4px; }
  .sub { font-size:14px; color:var(--fg3); margin-bottom:24px; }
  .kpi-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:20px; }
  .kpi { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:16px 18px; }
  .kpi .label { font-size:12px; color:var(--fg2); margin-bottom:6px; }
  .kpi .value { font-size:22px; font-weight:700; }
  .kpi .extra { font-size:11px; color:var(--fg3); margin-top:3px; }
  .section { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:22px 26px; margin-bottom:16px; }
  .section h2 { font-size:17px; font-weight:600; margin-bottom:14px; }
  .chart-title { font-size:12px; color:var(--fg2); font-weight:600; margin-bottom:8px; }
  .chart-title .chart-hint { font-weight:400; color:var(--fg3); font-size:11px; margin-left:8px; }
  .chart { height:110px; display:flex; align-items:flex-end; gap:3px; justify-content:center; }
  .chart .day { flex:1 1 0; max-width:48px; background:var(--accent); opacity:.75; border-radius:3px 3px 0 0; min-height:2px; }
  .chart .day.empty { background:var(--soft); opacity:1; min-height:4px; }  /* #44:空柱 4px 可见(无记录天明显) */
  .chart .day:hover { opacity:1; }
  .top-list { list-style:none; }
  .top-list li { display:flex; justify-content:space-between; padding:9px 4px; border-bottom:1px solid var(--border); font-size:13px; }
  .top-list li:last-child { border-bottom:none; }
  .top-list .rank { color:var(--fg3); font-weight:600; margin-right:10px; }
  .top-list .cnt { color:var(--fg2); font-variant-numeric:tabular-nums; }
  .one-line { background:rgba(0,113,227,.08); border:1px solid rgba(0,113,227,.25); border-radius:10px; padding:12px 16px; font-size:13.5px; color:var(--accent); font-weight:500; }
  .footer { margin-top:24px; padding:14px 18px; background:var(--soft); border-radius:12px; display:flex; justify-content:space-between; align-items:center; }
  .footer .src { font-size:12px; color:var(--fg3); }
  .footer .btn-group { display:flex; gap:6px; }  /* #44:与全场景统一 */
  .btn { border:1px solid var(--border); background:var(--card); padding:6px 12px; border-radius:8px; cursor:pointer; font-size:12px; color:var(--fg); white-space:nowrap; }
  .btn:hover { background:var(--accent); color:#fff; border-color:var(--accent); }
  .btn.copied { background:var(--good); color:#fff; border-color:var(--good); }
  @media (max-width:640px) {
    body { padding:20px 14px 40px; }  /* #44:底部空白减半 */
    h1 { font-size:22px; }
    .section { padding:16px 18px; border-radius:12px; }
    .kpi-grid { grid-template-columns:1fr 1fr; gap:10px; }
    /* #44:手机按钮纵向 + 均分不换行(与全场景统一) */
    .footer { flex-direction:column; align-items:stretch; gap:8px; }
    .footer .btn-group { justify-content:space-between; }
    .footer .btn-group .btn { flex:1; margin:0 4px; min-height:44px; }
    .footer .btn-group .btn:first-child { margin-left:0; }
    .footer .btn-group .btn:last-child { margin-right:0; }
  }
</style>
</head>
<body>

<!--INJECT-DATA-->

<h1>📝 饮食复盘</h1>
<p class="sub" id="sub">--</p>

<div class="one-line" id="oneLine">--</div>
<div style="height:14px"></div>

<div class="kpi-grid">
  <div class="kpi"><div class="label">总热量</div><div class="value" id="kCal">--</div></div>
  <div class="kpi"><div class="label">日均热量</div><div class="value" id="kAvg">--</div></div>
  <div class="kpi"><div class="label">总蛋白</div><div class="value" id="kPro">--</div></div>
  <div class="kpi"><div class="label">日均蛋白</div><div class="value" id="kAvgPro">--</div></div>
</div>

<div class="section">
  <h2>每日热量趋势</h2>
  <div class="chart-title">每日热量(卡)<span class="chart-hint">每根柱 = 一天 · 灰柱 = 无记录 · 悬停看数值</span></div>
  <div class="chart" id="chart"></div>
</div>

<div class="section">
  <h2>高频食物 TOP5</h2>
  <ul class="top-list" id="top5"></ul>
</div>

<div class="footer">
  <div class="src" id="srcLine">📊 数据来源:--</div>
  <div class="btn-group">
    <button class="btn" id="copyBtn">📋 复制数据</button>
    <button class="btn" id="copyLogBtn">📋 复制日志</button>
  </div>
</div>

<script>
// #44:复制工具全局函数(统一标准:文字不变 + 绿闪 + toast + .catch fallback)
let toastTimer = null;
function showToast(msg) {
  let t = document.getElementById('copyToast');
  if (!t) {
    t = document.createElement('div');
    t.id = 'copyToast';
    t.style.cssText = 'position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:rgba(28,28,30,.92);color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;z-index:999;box-shadow:0 4px 12px rgba(0,0,0,.2);transition:opacity .3s;';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.style.opacity = '1';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.style.opacity = '0'; }, 2000);
}
function fallbackCopyText(txt) {
  const ta = document.createElement('textarea');
  ta.value = txt; ta.style.position = 'fixed'; ta.style.left = '-9999px';
  document.body.appendChild(ta); ta.focus(); ta.select();
  try { document.execCommand('copy'); } catch (e) {}
  document.body.removeChild(ta);
}
(function(){
  const D = window.__DATA__;
  if (!D || D.status !== 'ok') {
    document.body.innerHTML = '<div style="padding:60px;text-align:center;color:#86868b">⚠ 数据未注入或状态非 ok</div>';
    return;
  }
  const { summary, top5, daily, meta } = D.data;
  document.getElementById('sub').textContent = `饮食复盘 · ${meta.start} ~ ${meta.end} · ${summary.days} 天`;
  document.getElementById('oneLine').textContent = summary.one_line;
  document.getElementById('kCal').textContent = summary.total_cal.toLocaleString() + ' 卡';
  document.getElementById('kAvg').textContent = summary.avg_cal.toLocaleString() + ' 卡/天';
  document.getElementById('kPro').textContent = summary.total_pro + 'g';
  document.getElementById('kAvgPro').textContent = summary.avg_pro + 'g/天';

  const chart = document.getElementById('chart');
  // #44:完整窗口(无记录天 1px 空柱占位)+ 点击 toast(触屏)
  const allDays = [];
  {
    const d0 = new Date(meta.start + 'T00:00:00');
    const d1 = new Date(meta.end + 'T00:00:00');
    const by = {};
    daily.forEach(d => { by[d.date] = d.cal; });
    const fmtD = dt => `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}-${String(dt.getDate()).padStart(2, '0')}`;
    for (let t = d0; t <= d1; t.setDate(t.getDate() + 1)) {
      const iso = fmtD(t);
      allDays.push({date: iso, cal: by[iso] || 0});
    }
  }
  const max = Math.max(...allDays.map(d => d.cal), 1);
  // #44:降采样——窗口 > 62 天按周聚合(216 日柱视觉崩 · 31 周柱合理)
  let renderDays = allDays;
  if (allDays.length > 62) {
    renderDays = [];
    for (let i = 0; i < allDays.length; i += 7) {
      const chunk = allDays.slice(i, i + 7);
      const sum = chunk.reduce((a, d) => a + (d.cal || 0), 0);
      renderDays.push({date: chunk[0].date + '~' + chunk[chunk.length - 1].date, cal: sum});
    }
  }
  renderDays.forEach(d => {
    const has = d.cal > 0;
    const bar = document.createElement('div');
    bar.className = 'day' + (has ? '' : ' empty');
    bar.style.height = (has ? Math.max(2, Math.round(d.cal / max * 106)) : 4) + 'px';
    bar.title = `${d.date} · ${d.cal} 卡`;
    bar.onclick = () => showToast(`${d.date} · ${d.cal} 卡`);
    chart.appendChild(bar);
  });

  const list = document.getElementById('top5');
  if (!top5.length) {
    list.innerHTML = '<li style="color:#86868b">该时间段无高频食物</li>';
  }
  top5.forEach((t, i) => {
    list.insertAdjacentHTML('beforeend',
      `<li><span><span class="rank">#${i+1}</span>${t.food}</span><span class="cnt">${t.count} 次</span></li>`);
  });

  document.getElementById('srcLine').textContent = `📊 数据来源:food_log · 饮食专属复盘 · ${meta.start} → ${meta.end}`;
  document.getElementById('copyBtn').onclick = function() {
    let r = `饮食复盘 ${meta.start} ~ ${meta.end}\n`;
    r += `${summary.one_line}\n`;
    r += `总热量 ${summary.total_cal} 卡 | 日均 ${summary.avg_cal} 卡 | 总蛋白 ${summary.total_pro}g\n`;
    top5.forEach((t, i) => { r += `TOP${i+1}: ${t.food} (${t.count} 次)\n`; });
    // #44:统一标准——文字不变 + 绿闪 + toast + .catch fallback
    const done = () => { this.classList.add('copied'); setTimeout(() => this.classList.remove('copied'), 2000); showToast('复盘数据复制成功 ✓'); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(r).then(done).catch(() => { fallbackCopyText(r); done(); });
    } else { fallbackCopyText(r); done(); }
  };
})();

  // 复制日志(#44 审查补 · R3 排障):数据来源/生成时间/思考链/原始数据
  (function () {
    const logBtn = document.getElementById('copyLogBtn');
    if (!logBtn) return;
    const D0 = window.__DATA__ || {};
    const META = (D0.data && D0.data.meta) || D0.meta || {};
    const srcTxt = (document.getElementById('srcLine') || {}).textContent || '';
    const title = (document.querySelector('h1') || {}).textContent || '结果';
    logBtn.onclick = function () {
      const lines = ['[' + title + ' 排障日志]', ''];
      lines.push('数据来源: ' + srcTxt);
      lines.push('生成时间: ' + (META.today || META.date || META.start || ''));
      if (META.chain) { lines.push('AI 思考链:'); lines.push(META.chain); }
      else { lines.push('AI 思考链: (未注入 · 渲染时未传 --chain,AI 执行时用 --chain 附上处理步骤)'); }
      lines.push('');
      lines.push('原始数据:');
      lines.push(JSON.stringify(D0, null, 2));
      const txt = lines.join('\n');
      // #44:统一标准——文字不变 + 绿闪 + toast + .catch fallback
      const done = function () {
        logBtn.classList.add('copied');
        setTimeout(function () { logBtn.classList.remove('copied'); }, 2000);
        showToast('排障日志已复制 ✓');
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(txt).then(done).catch(function () { fallbackCopyText(txt); done(); });
      } else { fallbackCopyText(txt); done(); }
    };
  })();
</script>

</body>
</html>
