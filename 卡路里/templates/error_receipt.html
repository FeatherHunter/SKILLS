<!doctype html>
<html lang="zh-CN">
<head>
<style><!--SHARED-CSS--></style>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>操作失败 · 卡路里</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --fg: #1d1d1d; --fg2: #6e6e73; --fg3: #86868b;
    --bg: #f5f5f7; --card: #fff; --border: #e3e3e8;
    --red: #ff3b30; --red-soft: #ffe5e3; --accent: #0071e3; --accent-soft: #e3f0ff;
    --green: #34c759; --orange: #ff9500; --soft: #f2f2f7;
    --shadow: 0 1px 2px rgba(0,0,0,.05), 0 4px 16px rgba(0,0,0,.06);
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    line-height: 1.6; color: var(--fg); background: var(--bg);
    max-width: 760px; margin: 0 auto; padding: 24px 16px 40px;
    -webkit-font-smoothing: antialiased;
  }
  .head { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 16px; }
  .head .h-icon {
    flex: 0 0 auto; width: 44px; height: 44px; border-radius: 12px;
    background: linear-gradient(135deg, #ff3b30, #ff7a45); color: #fff;
    display: flex; align-items: center; justify-content: center; font-size: 22px;
    box-shadow: 0 4px 10px rgba(255,59,48,.25);
  }
  .head h1 { font-size: 24px; font-weight: 700; letter-spacing: -.02em; line-height: 1.25; }
  .head .meta { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; align-items: center; }
  .head .chip {
    font-size: 11px; color: var(--fg2); background: #fff; border: 1px solid var(--border);
    border-radius: 999px; padding: 2px 10px; font-family: ui-monospace, Menlo, monospace;
  }
  .head .chip.wake { color: var(--accent); border-color: #cfe2ff; background: var(--accent-soft); font-family: inherit; }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    padding: 16px 18px; margin-bottom: 14px; box-shadow: var(--shadow);
  }
  .card h2 { font-size: 15px; font-weight: 600; margin-bottom: 10px; }
  .data-box {
    background: #1d1d1f; color: #f5f5f7; border-radius: 10px; padding: 12px 14px;
    font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px;
    white-space: pre-wrap; word-break: break-word; line-height: 1.6;
  }
  .suggest-list { list-style: none; }
  .suggest-list li {
    display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px;
    background: var(--soft); border-radius: 10px; margin-bottom: 8px; font-size: 13.5px;
  }
  .suggest-list li .n {
    flex: 0 0 auto; width: 20px; height: 20px; border-radius: 50%; background: var(--accent);
    color: #fff; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; margin-top: 2px;
  }
  @media (max-width: 640px) {
    body { padding: 18px 12px 110px; }
    .head h1 { font-size: 21px; }
  }
</style>
</head>
<body>

<div class="head">
  <div class="h-icon">✕</div>
  <div>
    <h1 id="sceneTitle">操作失败</h1>
    <div class="meta" id="metaBar"></div>
  </div>
</div>

<div id="errCard"></div>

<div class="card" id="dataCard" style="display:none">
  <h2>📋 关键数据</h2>
  <div class="data-box" id="dataBox">—</div>
</div>

<div class="card" id="suggestCard" style="display:none">
  <h2>💡 建议下一步</h2>
  <ul class="suggest-list" id="suggestList"></ul>
</div>

<script id="payload" type="application/json"><!--INJECT-DATA--></script><script><!--SHARED-HELPERS--></script><script>window.__P__=(function(){try{return JSON.parse(document.getElementById('payload').textContent||'{}');}catch(e){return null;}})();</script>

<script>
const DATA = (typeof window.__P__ === 'object' && window.__P__) || null;
const D = DATA && DATA.data || {};
const META = D.meta || {};

(function renderMeta() {
  document.getElementById('sceneTitle').textContent = D.scene_name || '操作失败';
  const stage = window.statusBadge('danger', '失败');
  document.getElementById('metaBar').innerHTML = [
    `<span class="chip wake">⚡ ${esc(META.wake_word || D.scene_name || '(未知)')}</span>`,
    stage,
    `<span class="chip">🕒 ${esc(META.fetched_at || '')}</span>`,
  ].join('');
})();

// ---------- 错误回执 = Base errorReceipt 控件(#315 波② · data/log 字符串直传) ----------
const logText = (typeof window.buildLogText === 'function' && DATA)
  ? (function(){ try { return window.buildLogText(DATA); } catch(e) { return ''; } })()
  : '';
document.getElementById('errCard').innerHTML = window.errorReceipt({
  message: `${D.op || '操作未完成'}：${D.reason || '(未知原因)'}`,
  retryPrompt: D.fix_prompt || '',
  data: D.data_text || '',
  log: logText,
  payload: DATA,
});

// ---------- 关键数据展示区(#315: 保留展示, 复制内容与控件 data 同源) ----------
const dataCard = document.getElementById('dataCard');
if (D.data_text) {
  document.getElementById('dataBox').textContent = D.data_text;
  dataCard.style.display = 'block';
}

// ---------- 建议下一步(内容区, 非状态控件) ----------
const sug = document.getElementById('suggestList');
if (D.suggestions && D.suggestions.length) {
  document.getElementById('suggestCard').style.display = 'block';
  (D.suggestions || ['修正后重试', '更换参数/目标', '联系开发者']).forEach((s, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="n">${i + 1}</span><span>${esc(s)}</span>`;
    sug.appendChild(li);
  });
}
</script>
</body>
</html>
