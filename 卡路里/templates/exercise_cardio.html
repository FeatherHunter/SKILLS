<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>卡路里 · 有氧训练总览</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --fg:#1d1d1d; --fg2:#6e6e73; --fg3:#86868b; --bg:#fafafa;
          --card:#fff; --border:#d2d2d7; --accent:#0071e3; --soft:#f5f5f7; }
  body { font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
         line-height:1.6; color:var(--fg); background:var(--bg);
         max-width:780px; margin:0 auto; padding:48px 24px 80px; -webkit-font-smoothing:antialiased; }
  .meta-bar { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
  .meta-bar .left { font-size:12px; color:var(--fg2); }
  h1 { font-size:32px; font-weight:700; letter-spacing:-.025em; margin-bottom:4px; }
  .sub { font-size:14px; color:var(--fg3); margin-bottom:24px; }
  .kpi-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:16px; }
  .kpi { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:16px 18px; }
  .kpi .label { font-size:11px; color:var(--fg2); margin-bottom:4px; }
  .kpi .value { font-size:20px; font-weight:700; }
  .kpi .extra { font-size:11px; color:var(--fg3); margin-top:3px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:16px;
          padding:20px 22px; margin-bottom:16px; }
  .card h2 { font-size:16px; font-weight:600; margin-bottom:12px; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th, td { padding:9px 10px; text-align:left; border-bottom:1px solid var(--border); }
  th { color:var(--fg2); font-size:12px; font-weight:600; }
  td.num, th.num { text-align:right; font-variant-numeric:tabular-nums; }
  .footer { margin-top:24px; padding:16px 18px; background:var(--soft); border-radius:12px;
            display:flex; justify-content:flex-end; }
  .btn { border:1px solid var(--border); background:var(--card); padding:8px 16px; border-radius:8px;
         cursor:pointer; font-size:13px; color:var(--fg); min-height:36px; }
  .btn:hover { background:var(--accent); color:#fff; border-color:var(--accent); }
  @media (max-width:640px) {
    body { padding:20px 14px 80px; }
    h1 { font-size:22px; }
    .kpi-grid { grid-template-columns:1fr 1fr; gap:10px; }
    .footer { justify-content:stretch; }
    .footer .btn { flex:1; min-height:44px; }
    .card { padding:14px 14px; overflow-x:auto; }
  }

  @keyframes fadeup{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
</style>
</head>
<body>
<!--INJECT-DATA-->

<div class="meta-bar"><div class="left" id="metaLeft">--</div></div>
<h1>🏃 有氧训练总览</h1>
<p class="sub" id="subTitle">--</p>

<div class="kpi-grid" id="kpiGrid"></div>

<div class="card">
  <h2>📋 按类型聚合</h2>
  <table>
    <thead id="tHead"></thead>
    <tbody id="tBody"></tbody>
  </table>
</div>

<div class="footer"><div class="btn" id="copyLogBtn">📋 复制日志</div></div>

<script>
(function(){
  const D = window.__DATA__;
  if (!D || D.status !== 'ok') { document.body.innerHTML = '<div style="padding:60px;text-align:center;color:#86868b">⚠ 数据未注入或状态非 ok</div>'; return; }
  const d = D.data;
  document.getElementById('metaLeft').textContent = d.meta.today;
  document.getElementById('subTitle').textContent = d.summary.subtitle;

  ['k1','k2','k3','k4'].forEach(k => {
    const s = d.summary[k];
    document.getElementById('kpiGrid').insertAdjacentHTML('beforeend',
      `<div class="kpi"><div class="label">${s.label}</div><div class="value">${s.value}</div>` +
      (s.extra ? `<div class="extra">${s.extra}</div>` : '') + `</div>`);
  });

  document.getElementById('tHead').innerHTML = d.summary.table_header;
  const body = document.getElementById('tBody');
  (d.items || []).forEach(i => {
    body.insertAdjacentHTML('beforeend',
      `<tr><td>${i.name}</td><td class="num">${i.count}</td><td class="num">${i.minutes} 分</td>` +
      `<td class="num">${i.distance ? i.distance + ' km' : '—'}</td>` +
      `<td class="num">${i.pace ? i.pace + ' 分/km' : '—'}</td></tr>`);
  });
  if (!(d.items || []).length) {
    body.insertAdjacentHTML('beforeend', '<tr><td colspan="5" style="color:#86868b">暂无有氧训练记录</td></tr>');
  }

  document.getElementById('copyLogBtn').addEventListener('click', function(){
    const text = ['[有氧训练总览 · 排障日志]', '',
      '唤醒词: ' + (d.meta.wake_word || '--'), '思考链: ' + (d.meta.chain || '--'),
      '时间: ' + d.meta.today, '', '原始数据: ' + JSON.stringify(d)].join('\n');
    navigator.clipboard.writeText(text).then(() => { toast('已复制'); }).catch(() => {
      const ta = document.createElement('textarea'); ta.value = text;
      document.body.appendChild(ta); ta.select(); document.execCommand('copy');
      document.body.removeChild(ta); toast('已复制');
    });
  });
})();

  function toast(msg){var t=document.createElement('div');t.style.cssText='position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0));transform:translateX(-50%) scale(.9);opacity:0;background:rgba(28,28,30,.94);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);color:#f0f0f0;border-radius:14px;padding:13px 14px 13px 16px;display:flex;align-items:flex-start;gap:12px;max-width:min(480px,calc(100vw - 24px));min-width:300px;box-shadow:0 10px 32px rgba(0,0,0,.32),0 0 0 .5px rgba(255,255,255,.08) inset;z-index:9999;transition:opacity .22s ease-out,transform .22s cubic-bezier(.34,1.56,.64,1)';t.innerHTML='<div style="font-size:20px;line-height:1;padding-top:1px;flex-shrink:0">📋</div><div style="flex:1;min-width:0"><div style="font-weight:600;font-size:12.5px;line-height:1.4;color:#fff;margin-bottom:2px">已复制 <em style="font-style:normal;color:#34c759;font-weight:600">'+msg+'</em></div><div style="font-size:11px;line-height:1.5;color:#c8c8cc">粘贴给 AI,卡路里技能会自动执行这个流程,完成后你会拿到结果 HTML + 一句话总结。</div></div><button style="background:rgba(255,255,255,.10);color:#34c759;border:0;border-radius:8px;padding:5px 9px;font-size:10.5px;font-weight:500;cursor:pointer;white-space:nowrap;margin-left:6px;flex-shrink:0">✓ 知道了</button>';document.body.appendChild(t);requestAnimationFrame(function(){t.style.opacity='1';t.style.transform='translateX(-50%) scale(1)';});var close=function(){t.style.opacity='0';t.style.transform='translateX(-50%) scale(.9)';setTimeout(function(){t.remove();},220);};t.querySelector('button').addEventListener('click',close);setTimeout(close,4500);}
</script>
</body>
</html>
