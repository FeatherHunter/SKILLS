<!DOCTYPE html>
<html lang="zh-CN">
<head>
<style><!--SHARED-CSS--></style>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>卡路里 · 运动目标达成</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --fg:#1d1d1d; --fg2:#6e6e73; --fg3:#86868b; --bg:#fafafa;
          --card:#fff; --border:#d2d2d7; --accent:#0071e3;
          --good:#34c759; --warn:#ff9500; --bad:#ff3b30; --soft:#f5f5f7; }
  body { font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
         line-height:1.6; color:var(--fg); background:var(--bg);
         max-width:780px; margin:0 auto; padding:48px 24px 80px; -webkit-font-smoothing:antialiased; }
  .meta-bar { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
  .meta-bar .left { font-size:12px; color:var(--fg2); }
  h1 { font-size:32px; font-weight:700; letter-spacing:-.025em; margin-bottom:4px; }
  .sub { font-size:14px; color:var(--fg3); margin-bottom:24px; }
  .ring-card { background:var(--card); border:1px solid var(--border); border-radius:20px;
               padding:32px 24px; text-align:center; margin-bottom:16px; }
.ring-wrap { position:relative; width:220px; height:220px; margin:0 auto 16px; }
.ring-center { position:absolute; inset:0; display:flex; flex-direction:column;
                 align-items:center; justify-content:center; }
  .ring-pct { font-size:44px; font-weight:800; letter-spacing:-.02em; }
  .ring-label { font-size:12px; color:var(--fg2); }
  .verdict { display:inline-block; padding:6px 18px; border-radius:20px; font-size:14px;
             font-weight:700; }
  .verdict.ok { background:rgba(52,199,89,.15); color:var(--good); }
  .verdict.no { background:rgba(255,59,48,.15); color:var(--bad); }
  .kpi-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:16px; }
  .kpi { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:16px 18px; }
  .kpi .label { font-size:11px; color:var(--fg2); margin-bottom:4px; }
  .kpi .value { font-size:20px; font-weight:700; }
  .kpi .extra { font-size:11px; color:var(--fg3); margin-top:3px; }
  .summary-card { background:var(--soft); border-radius:14px; padding:16px 20px;
                  font-size:15px; color:var(--fg); margin-bottom:16px; }
  
  .footer { margin-top:24px; padding:16px 18px; background:var(--soft); border-radius:12px;
            display:flex; justify-content:flex-end; align-items:center; }
  .btn { border:1px solid var(--border); background:var(--card); padding:8px 16px; border-radius:8px;
         cursor:pointer; font-size:13px; color:var(--fg); min-height:36px; }
  .btn:hover { background:var(--accent); color:#fff; border-color:var(--accent); }
  .btn-primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  @media (max-width:640px) {
    body { padding:20px 14px 80px; }
    h1 { font-size:22px; }
    .kpi-grid { grid-template-columns:1fr 1fr; gap:10px; }
    .ring-wrap { width:180px; height:180px; }
    .footer { justify-content:stretch; }
    .footer .btn { flex:1 1 45%; min-height:44px; }
  }

  @keyframes fadeup{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
</style>
</head>
<body>
<script id="payload" type="application/json"><!--INJECT-DATA--></script><script><!--SHARED-HELPERS--></script><script><!--CHARTS-HELPERS--></script><script>window.__P__=(function(){try{return JSON.parse(document.getElementById('payload').textContent||'{}');}catch(e){return null;}})();</script>

<div class="meta-bar"><div class="left" id="metaLeft">--</div></div>
<h1 id="h1Title">🎯 运动目标达成</h1>
<p class="sub" id="subTitle">--</p>

<div id="emptyBox" style="display:none"></div>

<div id="content" style="display:none">
  <div class="ring-card">
    <div class="ring-wrap">
      <div id="ringBar"></div>
      <div class="ring-center">
        <div class="ring-pct" id="ringPct">--</div>
        <div class="ring-label" id="ringLabel">完成度</div>
      </div>
    </div>
    <div><span class="verdict" id="verdict">--</span></div>
  </div>

  <div class="kpi-grid">
    <div class="kpi"><div class="label">目标</div><div class="value" id="kGoal">--</div><div class="extra" id="kGoalExtra"></div></div>
    <div class="kpi"><div class="label">实际消耗</div><div class="value" id="kActual">--</div><div class="extra" id="kActualExtra"></div></div>
    <div class="kpi"><div class="label">距目标</div><div class="value" id="kGap">--</div><div class="extra" id="kGapExtra"></div></div>
    <div class="kpi"><div class="label">区间</div><div class="value" id="kRange">--</div><div class="extra" id="kRangeExtra"></div></div>
  </div>

  <div class="summary-card" id="summaryLine">--</div>
</div>

<div class="footer">
  
</div>

<script>
(function(){
  const D = window.__P__;
  if (!D || D.status !== 'ok') { document.body.innerHTML = window.errorReceipt({message: '数据未注入或状态非 ok'}); return; }
  const d = D.data;
  document.getElementById('metaLeft').textContent = d.meta.today;
  document.getElementById('subTitle').textContent =
    d.period === 'week' ? '本周目标达成(周目标 = 每日目标 × 7)' : '今日目标达成';

  if (d.goal == null) {
document.getElementById('emptyBox').innerHTML = window.emptyState({text: '⚠ ' + d.summary});
    document.getElementById('emptyBox').style.display = 'block';
    return;
  }

  document.getElementById('content').style.display = 'block';
  const pct = Math.min(d.pct, 100);
  // #317 迁 Base charts.donut 单段(进度环);中心值 + 完成度文案保留
  // #317 验收修复: 中心文字由 HTML .ring-center 覆盖层显示(组件 centerValue 会双重显示 + format 叠出 "%%"; 未传 centerValue 默认 total 也会显示)
  window.charts.donut(document.getElementById('ringBar'),
    [{ label: '完成度', value: pct, color: d.achieved ? '#34c759' : '#0071e3' }],
    { size: 220, ringWidth: 16, legend: 'none', showPercent: false, centerLabel: '', centerValue: '' });
  document.getElementById('ringPct').textContent = d.pct + '%';
  const verdict = document.getElementById('verdict');
  verdict.textContent = d.verdict;
  verdict.className = 'verdict ' + (d.achieved ? 'ok' : 'no');

  const fmt = n => (n > 0 ? '+' : '') + n;
  document.getElementById('kGoal').textContent = d.goal + ' 卡';
  document.getElementById('kGoalExtra').textContent = d.period === 'week' ? '每日 ' + d.meta.daily_goal + ' 卡 × 7' : '每日运动消耗目标';
  document.getElementById('kActual').textContent = d.actual + ' 卡';
  document.getElementById('kActualExtra').textContent = d.period === 'week' ? '本周累计消耗' : '今日累计消耗';
  document.getElementById('kGap').textContent = d.achieved ? '超额 ' + Math.abs(d.gap) + ' 卡' : '差 ' + Math.abs(d.gap) + ' 卡';
  document.getElementById('kGapExtra').textContent = d.achieved ? '已超额完成' : '还需再练';
  document.getElementById('kRange').textContent = d.range.start.slice(5) + ' ~ ' + d.range.end.slice(5);
  document.getElementById('kRangeExtra').textContent = d.period === 'week' ? '本周' : '今天';
  document.getElementById('summaryLine').textContent = '💬 ' + d.summary;})();

  
</script>


<div id="actionbar-zone"></div>
<script>(function(){var z=document.getElementById('actionbar-zone');if(z&&window.actionBar&&window.__P__){z.innerHTML=window.actionBar(window.__P__);}})();</script>
</body>
</html>
