<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>卡路里 · 运动复盘</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --fg:#1d1d1d; --fg2:#6e6e73; --fg3:#86868b; --bg:#fafafa;
          --card:#fff; --border:#d2d2d7; --accent:#0071e3; --good:#34c759; --soft:#f5f5f7; }
  body { font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
         line-height:1.6; color:var(--fg); background:var(--bg);
         max-width:780px; margin:0 auto; padding:48px 24px 80px; -webkit-font-smoothing:antialiased; }
  .meta-bar { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
  .meta-bar .left { font-size:12px; color:var(--fg2); }
  h1 { font-size:32px; font-weight:700; letter-spacing:-.025em; margin-bottom:4px; }
  .sub { font-size:14px; color:var(--fg3); margin-bottom:24px; }
  .kpi-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:16px; }
  .kpi { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:16px 18px; }
  .kpi .label { font-size:11px; color:var(--fg2); margin-bottom:4px; }
  .kpi .value { font-size:20px; font-weight:700; }
  .kpi .extra { font-size:11px; color:var(--fg3); margin-top:3px; }
  .one-line { background:var(--soft); border-radius:14px; padding:16px 20px;
              font-size:15px; margin-bottom:16px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:16px;
          padding:20px 22px; margin-bottom:16px; }
  .card h2 { font-size:16px; font-weight:600; margin-bottom:12px; }
  .dist-row { display:flex; align-items:center; gap:10px; padding:6px 0; font-size:14px; }
  .dist-name { width:64px; color:var(--fg2); }
  .dist-bar { flex:1; height:12px; background:var(--soft); border-radius:6px; overflow:hidden; }
  .dist-fill { height:100%; background:var(--accent); border-radius:6px; }
  .dist-val { width:48px; text-align:right; font-variant-numeric:tabular-nums; }
  .chip { display:inline-block; background:var(--soft); border-radius:8px; padding:4px 10px;
          font-size:13px; margin:0 6px 6px 0; }
  .chip b { color:var(--accent); }
  .trend-wrap { overflow-x:auto; -webkit-overflow-scrolling:touch; }
  .trend { display:flex; align-items:flex-end; gap:2px; height:90px; min-width:260px; }
  .trend-bar { flex:1; background:var(--good); border-radius:2px 2px 0 0; min-height:2px; }
  .footer { margin-top:24px; padding:16px 18px; background:var(--soft); border-radius:12px;
            display:flex; justify-content:flex-end; }
  .btn { border:1px solid var(--border); background:var(--card); padding:8px 16px; border-radius:8px;
         cursor:pointer; font-size:13px; color:var(--fg); min-height:36px; }
  .btn:hover { background:var(--accent); color:#fff; border-color:var(--accent); }
  @media (max-width:640px) {
    body { padding:20px 14px 80px; }
    h1 { font-size:22px; }
    .kpi-grid { grid-template-columns:1fr 1fr; gap:10px; }
    .footer { justify-content:stretch; }
    .footer .btn { flex:1; min-height:44px; }
    .card { padding:14px 14px; }
  }
</style>
</head>
<body>
<!--INJECT-DATA-->

<div class="meta-bar"><div class="left" id="metaLeft">--</div></div>
<h1>📊 运动复盘</h1>
<p class="sub" id="subTitle">--</p>

<div class="one-line" id="oneLine">--</div>

<div class="kpi-grid" id="kpiGrid"></div>

<div class="card">
  <h2>🧩 类型分布</h2>
  <div id="distBox"></div>
</div>

<div class="card">
  <h2>🔥 高频运动</h2>
  <div id="topBox"></div>
</div>

<div class="card">
  <h2>📈 每日消耗趋势</h2>
  <div class="trend-wrap"><div class="trend" id="trendBox"></div></div>
</div>

<div class="footer"><div class="btn" id="copyLogBtn">📋 复制日志</div></div>

<script>
(function(){
  const D = window.__DATA__;
  if (!D || D.status !== 'ok') { document.body.innerHTML = '<div style="padding:60px;text-align:center;color:#86868b">⚠ 数据未注入或状态非 ok</div>'; return; }
  const d = D.data;
  document.getElementById('metaLeft').textContent = d.meta.today + ' · ' + d.meta.period;
  document.getElementById('subTitle').textContent = d.summary.subtitle;
  document.getElementById('oneLine').textContent = '💬 ' + d.one_line;

  ['k1','k2','k3','k4'].forEach(k => {
    const s = d.summary[k];
    document.getElementById('kpiGrid').insertAdjacentHTML('beforeend',
      `<div class="kpi"><div class="label">${s.label}</div><div class="value">${s.value}</div>` +
      (s.extra ? `<div class="extra">${s.extra}</div>` : '') + `</div>`);
  });

  const distBox = document.getElementById('distBox');
  const cats = d.cat_items || [];
  const maxC = Math.max(...cats.map(c => c.count), 1);
  cats.forEach(c => {
    distBox.insertAdjacentHTML('beforeend',
      `<div class="dist-row"><div class="dist-name">${c.name}</div>` +
      `<div class="dist-bar"><div class="dist-fill" style="width:${Math.round(c.count / maxC * 100)}%"></div></div>` +
      `<div class="dist-val">${c.count} 次</div></div>`);
  });
  if (!cats.length) distBox.innerHTML = '<div style="color:#86868b;font-size:13px">暂无数据</div>';

  const topBox = document.getElementById('topBox');
  (d.top_movements || []).forEach(m => {
    topBox.insertAdjacentHTML('beforeend', `<span class="chip">${m.name} <b>×${m.count}</b></span>`);
  });
  if (!(d.top_movements || []).length) topBox.innerHTML = '<div style="color:#86868b;font-size:13px">暂无数据</div>';

  const trend = d.trend || [];
  const maxCal = Math.max(...trend.map(t => t.calories), 1);
  trend.forEach(t => {
    const b = document.createElement('div');
    b.className = 'trend-bar';
    b.style.height = Math.max(2, Math.round(t.calories / maxCal * 86)) + 'px';
    b.title = t.date + ' ' + t.calories + ' 卡';
    document.getElementById('trendBox').appendChild(b);
  });
  if (!trend.length) document.getElementById('trendBox').innerHTML =
    '<div style="color:#86868b;font-size:13px">暂无数据</div>';

  document.getElementById('copyLogBtn').addEventListener('click', function(){
    const text = ['[运动复盘 · 排障日志]', '',
      '唤醒词: ' + (d.meta.wake_word || '--'), '渲染命令: ' + (d.meta.render_cmd || '--'),
      '数据来源: ' + (d.meta.source || '--'), '思考链: ' + (d.meta.chain || '--'),
      '时间: ' + d.meta.today, '', '原始数据: ' + JSON.stringify(d)].join('\n');
    navigator.clipboard.writeText(text).then(() => { this.textContent = '✓ 已复制';
      setTimeout(() => { this.textContent = '📋 复制日志'; }, 1500); }).catch(() => {
      const ta = document.createElement('textarea'); ta.value = text;
      document.body.appendChild(ta); ta.select(); document.execCommand('copy');
      document.body.removeChild(ta); this.textContent = '✓ 已复制';
      setTimeout(() => { this.textContent = '📋 复制日志'; }, 1500);
    });
  });
})();
</script>
</body>
</html>
