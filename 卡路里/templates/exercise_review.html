<!doctype html>
<html lang="zh-CN">
<head>
<style><!--SHARED-CSS--></style>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>训练复盘 · 卡路里</title>
<style>
:root{
  --fg:#1d1d1f;--fg2:#6e6e73;--fg3:#86868b;
  --bg:#fafafa;--card:#fff;--border:#d2d2d7;
  --accent:#0071e3;--accent-soft:#f5f5f7;
  --green:#34c759;--green-soft:#E8F5E9;
  --orange:#FF9500;--orange-soft:#FFF3E0;
  --red:#FF3B30;--red-soft:#FFEBEE;
  --gray:#8E8E93;--gray-soft:#F2F2F7;
  --shadow:0 1px 3px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--fg);
  line-height:1.7;-webkit-font-smoothing:antialiased;
}
.wrap{max-width:960px;margin:0 auto;padding:40px 24px 80px}

.hero{
  background:linear-gradient(180deg,#fff 0%,var(--accent-soft) 100%);
  padding:32px 32px 28px;border-radius:20px;
  margin-bottom:24px;box-shadow:var(--shadow);
  text-align:center;
}
.hero h1{font-size:28px;font-weight:700;letter-spacing:-.5px;margin-bottom:8px}
.hero .sub{font-size:14px;color:var(--fg2)}

/* SUMMARY STATS */
.stats{
  display:grid;grid-template-columns:repeat(4,1fr);
  gap:12px;margin-bottom:24px;
}
.stat{
  background:var(--card);border-radius:14px;
  padding:16px 18px;text-align:center;
  box-shadow:var(--shadow);
}
.stat .label{font-size:11px;color:var(--fg2);font-weight:500;margin-bottom:6px}
.stat .value{font-size:24px;font-weight:700;letter-spacing:-.5px}
.stat .value.good{color:var(--green)}
.stat .value.warn{color:var(--orange)}
.stat .value.bad{color:var(--red)}
.stat .hint{font-size:11px;color:var(--fg3);margin-top:4px}

/* HEATMAP */
.section{
  background:var(--card);border-radius:16px;
  padding:20px 24px;margin-bottom:14px;
  box-shadow:var(--shadow);
}
.section h2{
  font-size:16px;font-weight:600;margin-bottom:14px;
  display:flex;align-items:center;gap:8px;
}
.section h2::before{
  content:'';width:4px;height:16px;
  background:var(--accent);border-radius:2px;
}
.heatmap{
  display:grid;grid-template-columns:repeat(7,minmax(0,1fr));
  gap:6px;
}
.day-cell{
  aspect-ratio:1;border-radius:10px;
  background:var(--bg);display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:8px;font-size:11px;color:var(--fg3);
  border:1px solid var(--border);
  overflow:hidden;text-align:center;
}
.day-cell.r100{background:var(--green);color:#fff;border-color:var(--green)}
.day-cell.r50-99{background:var(--orange);color:#fff;border-color:var(--orange)}
.day-cell.r0-49{background:var(--red);color:#fff;border-color:var(--red)}
.day-cell.rest{background:var(--gray-soft);color:var(--gray)}
.day-cell.weekend{font-weight:600}
.day-cell .date{font-size:10px;opacity:.85;margin-bottom:2px}
.day-cell .pct{font-size:14px;font-weight:700}
.day-cell .note{font-size:9px;opacity:.75;margin-top:2px}

.legend{
  display:flex;gap:14px;justify-content:center;
  margin-top:14px;font-size:11px;color:var(--fg2);
}
.legend .item{display:flex;align-items:center;gap:4px}
.legend .dot{width:10px;height:10px;border-radius:3px}

/* TABLE */
.table-wrap{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}
table{
  width:100%;border-collapse:collapse;
  background:var(--card);border-radius:14px;
  overflow:hidden;box-shadow:var(--shadow);
  margin-bottom:20px;
}
thead{background:var(--accent-soft)}
th{
  text-align:left;padding:12px 14px;font-size:12px;
  font-weight:600;color:var(--fg);border-bottom:1px solid var(--border);
}
td{
  padding:12px 14px;border-bottom:1px solid #ececec;
  font-size:13.5px;vertical-align:middle;
}
tr:last-child td{border-bottom:none}
tbody tr:hover td{background:var(--accent-soft)}
.rate-cell{font-weight:700}
.rate-cell.good{color:var(--green)}
.rate-cell.warn{color:var(--orange)}
.rate-cell.bad{color:var(--red)}
.rate-cell.rest{color:var(--gray)}
.anomaly{
  display:inline-block;padding:2px 8px;border-radius:4px;
  font-size:11px;font-weight:600;margin:2px 4px 2px 0;
}
.anomaly.warn{background:var(--orange-soft);color:var(--orange)}
.anomaly.bad{background:var(--red-soft);color:var(--red)}

/* COPY */
.copy-section{
  background:var(--card);border-radius:14px;
  padding:16px 20px;margin-top:20px;
  box-shadow:var(--shadow);
}

/* VOLUME CHARTS (#257) */
.chart-box{width:100%;overflow-x:auto}
.chart-box svg{display:block;width:100%;height:auto}
.chart-note{font-size:12px;color:var(--fg2);margin-top:8px}
.chart-legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px;font-size:11.5px;color:var(--fg2)}
.chart-legend .item{display:flex;align-items:center;gap:5px}
.legend-line{width:16px;height:3px;border-radius:2px}
.legend-dot{width:10px;height:10px;border-radius:3px;flex-shrink:0}
.empty-tip{
  background:var(--orange-soft);color:var(--orange);
  font-size:12.5px;font-weight:600;
  padding:10px 14px;border-radius:10px;margin-top:8px;
}
.copy-section h3{font-size:13px;font-weight:600;margin-bottom:10px;color:var(--fg2)}
.copy-actions{display:flex;gap:10px;margin-bottom:10px}
.copy-actions .btn{flex:1;justify-content:center;padding:9px 0}
.copy-ext{display:none;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.copy-ext.show{display:flex}
.btn-ext{
  border:1px solid var(--accent);background:#fff;color:var(--accent);
  font-size:12px;font-weight:600;padding:6px 14px;border-radius:8px;
  cursor:pointer;transition:all .15s;
}
.btn-ext:hover{background:var(--accent-soft)}
.btn-ext.active{background:var(--accent);color:#fff}
.copy-section pre{
  background:#1d1d1f;color:#f5f5f7;
  padding:12px 16px;border-radius:10px;
  font-size:11.5px;line-height:1.55;
  overflow-x:auto;margin:6px 0 10px;
  font-family:"SF Mono",monospace;white-space:pre-wrap;
}
.btn{
  display:inline-flex;align-items:center;gap:6px;
  background:var(--accent);color:#fff;
  padding:7px 14px;border-radius:8px;
  font-size:12px;font-weight:600;
  border:none;cursor:pointer;
}
.btn:hover{opacity:.85}

#backTop{
  position:fixed;bottom:24px;right:24px;
  background:var(--card);color:var(--accent);
  width:42px;height:42px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  text-decoration:none;box-shadow:var(--shadow);
  font-size:18px;border:1px solid var(--border);
}

footer{
  text-align:center;color:var(--fg3);
  font-size:12px;padding-top:28px;
  border-top:1px solid var(--border);margin-top:36px;
}

@media (max-width:640px){
  .wrap{padding:24px 16px 60px}
  .hero{padding:24px 20px;border-radius:16px}
  .hero h1{font-size:22px}
  .stats{grid-template-columns:repeat(2,1fr)}
  th,td{padding:8px 10px;font-size:12px}
  .heatmap{gap:4px}
  .day-cell{padding:4px 2px;aspect-ratio:auto;min-height:52px;border-radius:8px}
  .day-cell .date{font-size:9px;margin-bottom:1px}
  .day-cell .pct{font-size:12px}
  .day-cell .note{display:none}
}
</style>
</head>

<script>
const DATA = (() => {
  if (typeof window.__P__ !== 'object' || window.__P__ === null) return null;
  return window.__P__;
})();

function escapeHTML(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}




function copyRelated(name) {
  // 激活态：当前扩展按钮高亮，其余取消
  document.querySelectorAll('.btn-ext').forEach(b => {
    b.classList.toggle('active', b.dataset.scene === name);
  });
  const root = window.__P__ || {};
  const meta = (root.__meta__) || {};
  const rs = (meta.related_scenes || []).find(s => s.name === name);
  _copyNow(rs ? rs.prompt : '', name);
}

function classifyDay(rate) {
  if (rate === null || rate === undefined) return 'rest';
  if (rate >= 100) return 'r100';
  if (rate >= 50) return 'r50-99';
  return 'r0-49';
}

function rateClass(rate) {
  if (rate === null || rate === undefined) return 'rest';
  if (rate >= 100) return 'good';
  if (rate >= 50) return 'warn';
  return 'bad';
}

function fmtK(n) {
  if (n >= 10000) return (n / 10000).toFixed(1).replace(/\.0$/, '') + '万';
  if (n >= 1000) return (n / 1000).toFixed(1).replace(/\.0$/, '') + 'k';
  return String(Math.round(n));
}

/* ---------- #257 周容量双柱 ---------- */
function renderVolume(volume) {
  const el = document.getElementById('volumeChart');
  const note = document.getElementById('volumeNote');
  if (!volume || !volume.weeks || !volume.weeks.length) {
    el.innerHTML = '<p class="chart-note">暂无容量数据</p>';
    return;
  }
  const weeks = volume.weeks;
  const W = 640, H = 248, PL = 46, PR = 14, PT = 36, PB = 36;
  const iw = W - PL - PR, ih = H - PT - PB;
  const maxV = Math.max(1, ...weeks.map(w => Math.max(w.plan || 0, w.actual || 0)));
  // Y 轴刻度：向上取整
  const rawStep = maxV / 4;
  const mag = Math.pow(10, Math.floor(Math.log10(rawStep)));
  const step = Math.ceil(rawStep / mag) * mag;
  const yMax = step * 4;
  const y = v => PT + ih - (v / yMax) * ih;

  const groupW = iw / weeks.length;
  const barW = Math.min(34, groupW * 0.32);
  const gap = 6;
  const half = barW / 2 + gap / 2;

  let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="周训练容量计划 vs 实做柱状图">`;
  // 网格 + Y 刻度
  for (let i = 0; i <= 4; i++) {
    const v = step * i, yy = y(v);
    svg += `<line x1="${PL}" y1="${yy}" x2="${W - PR}" y2="${yy}" stroke="#ececec" stroke-width="1"/>`;
    svg += `<text x="${PL - 8}" y="${yy + 4}" text-anchor="end" font-size="13.5" fill="#6e6e73">${fmtK(v)}</text>`;
  }
  // X 标签 + 柱子
  weeks.forEach((wk, i) => {
    const cx = PL + groupW * i + groupW / 2;
    const p = wk.plan || 0, a = wk.actual || 0;
    const py = y(p), ay = y(a);
    // 计划柱（浅蓝描边）
    svg += `<rect x="${cx - half}" y="${py}" width="${barW}" height="${Math.max(0, PT + ih - py)}" rx="4" fill="rgba(0,113,227,.18)" stroke="var(--accent)" stroke-width="2"/>`;
    // 实做柱（绿）
    svg += `<rect x="${cx - half + barW + gap}" y="${ay}" width="${barW}" height="${Math.max(0, PT + ih - ay)}" rx="4" fill="${wk.actual > 0 ? 'var(--green)' : 'var(--gray)'}" opacity="${wk.actual > 0 ? 1 : .35}"/>`;
    svg += `<text x="${cx}" y="${PT + ih + 26}" text-anchor="middle" font-size="13.5" fill="#86868b">${escapeHTML(wk.label)}</text>`;
    if (p > 0) svg += `<text x="${cx}" y="${py - 6}" text-anchor="middle" font-size="13" fill="#6e6e73">${fmtK(p)}</text>`;
    if (a > 0) svg += `<text x="${cx + barW + gap - 0}" y="${ay - 6}" text-anchor="middle" font-size="13" fill="#2ea24b" transform="translate(${barW/2+gap/2},0)">${fmtK(a)}</text>`;
  });
  svg += '</svg>';
  el.innerHTML = svg;
  if (!volume.has_actual) {
    note.innerHTML = '<div class="empty-tip">⚠️ 实做数据不足：当前范围无带重量实绩，仅显示计划容量</div>';
  } else {
    const last = weeks[weeks.length - 1];
    const pct = last.plan > 0 ? Math.round((last.actual / last.plan) * 100) : 0;
    note.innerHTML = `本周容量 ${fmtK(last.actual)} / 计划 ${fmtK(last.plan)}（${pct}%）· 累计实做 ${fmtK(volume.total_actual)} / 计划 ${fmtK(volume.total_plan)}`;
  }
}

/* ---------- #257 主项动作负荷折线 ---------- */
const MOV_COLORS = ['#0071e3', '#34c759', '#FF9500', '#AF52DE'];

function catmull(points) {
  if (points.length < 3) return points.map(p => [p.x, p.y]);
  const d = [];
  for (let i = 0; i < points.length; i++) {
    const p0 = points[Math.max(0, i - 1)], p1 = points[i],
          p2 = points[Math.min(points.length - 1, i + 1)], p3 = points[Math.min(points.length - 1, i + 2)];
    const c1 = { x: p1.x + (p2.x - p0.x) / 6, y: p1.y + (p2.y - p0.y) / 6 };
    const c2 = { x: p2.x - (p3.x - p1.x) / 6, y: p2.y - (p3.y - p1.y) / 6 };
    d.push((d.length ? 'C' : 'M') + `${c1.x.toFixed(1)},${c1.y.toFixed(1)} ${c2.x.toFixed(1)},${c2.y.toFixed(1)} ${p2.x.toFixed(1)},${p2.y.toFixed(1)}`);
  }
  return d;
}

function renderMovements(volume) {
  const el = document.getElementById('movementChart');
  const note = document.getElementById('movementNote');
  const legendEl = document.getElementById('movementLegend');
  if (!volume || !volume.movements || !volume.movements.length) {
    el.innerHTML = '<p class="chart-note">暂无主项动作数据</p>';
    return;
  }
  const movs = volume.movements;
  const weeks = (volume.weeks || []).map(w => w.label);
  const W = 640, H = 248, PL = 46, PR = 14, PT = 36, PB = 36;
  const iw = W - PL - PR, ih = H - PT - PB;
  const placedLabels = [];
  // 最大值：计划或实做
  const allV = [];
  movs.forEach(m => m.weeks.forEach(w => { if (w.plan) allV.push(w.plan); if (w.actual) allV.push(w.actual); }));
  const maxV = Math.max(1, ...allV);
  const rawStep = maxV / 4;
  const mag = Math.pow(10, Math.floor(Math.log10(rawStep)));
  const step = Math.ceil(rawStep / mag) * mag;
  const yMax = step * 4;
  const y = v => PT + ih - (v / yMax) * ih;
  const x = i => weeks.length <= 1 ? PL + iw / 2 : PL + (iw * i) / (weeks.length - 1);

  let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="主项动作每周负荷趋势折线图">`;
  for (let i = 0; i <= 4; i++) {
    const v = step * i, yy = y(v);
    svg += `<line x1="${PL}" y1="${yy}" x2="${W - PR}" y2="${yy}" stroke="#ececec" stroke-width="1"/>`;
    svg += `<text x="${PL - 8}" y="${yy + 4}" text-anchor="end" font-size="13.5" fill="#6e6e73">${fmtK(v)}</text>`;
  }
  weeks.forEach((lb, i) => {
    svg += `<text x="${x(i)}" y="${PT + ih + 26}" text-anchor="middle" font-size="13.5" fill="#86868b">${escapeHTML(lb)}</text>`;
  });
  movs.forEach((m, mi) => {
    const color = MOV_COLORS[mi % MOV_COLORS.length];
    // 实做折线（实线）
    const pts = m.weeks.map((w, i) => ({ x: x(i), y: y(w.actual || 0), v: w.actual || 0 })).filter(p => p.v > 0);
    const hasActual = pts.length > 0;
    if (hasActual) {
      const line = catmull(pts);
      svg += `<path d="${line.join(' ')}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linecap="round"/>`;
      // 标签只标首尾点；同列多线靠拢时跳过（碰撞检测），避免重叠
      pts.forEach((p, pi) => {
        svg += `<circle cx="${p.x}" cy="${p.y}" r="3.5" fill="#fff" stroke="${color}" stroke-width="2"/>`;
        if (pi === 0 || pi === pts.length - 1) {
          if (!placedLabels.some(L => Math.abs(L.x - p.x) < 34 && Math.abs(L.y - p.y) < 16)) {
            placedLabels.push({ x: p.x, y: p.y });
            // 首点标签从点右侧展开（避开左侧 Y 轴刻度带），末点居中
            const anchor = pi === 0 ? 'start' : 'middle';
            const lx = pi === 0 ? p.x + 7 : p.x;
            svg += `<text x="${lx}" y="${p.y - 14}" text-anchor="${anchor}" font-size="13" fill="${color}" font-weight="600">${fmtK(p.v)}</text>`;
          }
        }
      });
    }
    // 计划线（浅色虚线）
    const pPts = m.weeks.map((w, i) => ({ x: x(i), y: y(w.plan || 0), v: w.plan || 0 })).filter(p => p.v > 0);
    if (pPts.length > 1) {
      const line = catmull(pPts);
      svg += `<path d="${line.join(' ')}" fill="none" stroke="${color}" stroke-width="1.5" stroke-dasharray="5 4" opacity=".45"/>`;
    }
  });
  svg += '</svg>';
  el.innerHTML = svg;

  legendEl.innerHTML = movs.map((m, mi) => {
    const color = MOV_COLORS[mi % MOV_COLORS.length];
    const pct = m.plan_total > 0 ? Math.round((m.actual_total / m.plan_total) * 100) : 0;
    return `<div class="item"><span class="legend-line" style="background:${color}"></span>${escapeHTML(m.name)}<span style="color:var(--fg3)">实做 ${fmtK(m.actual_total)} / 计划 ${fmtK(m.plan_total)}（${pct}%）</span></div>`;
  }).join('');

  if (volume.has_actual) {
    note.innerHTML = '实线 = 每周实做负荷 · 浅色虚线 = 计划目标 · 圆点数值 = 该周 Σ(kg×次数)';
  } else {
    note.innerHTML = '<div class="empty-tip">⚠️ 实做数据不足：当前范围无带重量实绩，仅显示计划参考线</div>';
  }
}

function render() {
  if (!DATA) {
    document.querySelector('.hero h1').textContent = '❌ 数据加载失败';
    return;
  }

  // 解包：__DATA__ 可能带 {status,data,message} 包装；消费纯日期 dict
  const raw = DATA;
  const root = (raw && raw.data && typeof raw.data === 'object' && !raw.data.hasOwnProperty('completion_rate')) ? raw.data : raw;
  const dates = Object.keys(root).filter(k => !['__meta__', 'meta', 'scene', 'copy_log'].includes(k)).sort();
  const days = dates.map(d => root[d]);
  if (dates.length === 0) {
    document.getElementById('subtitle').textContent = '暂无数据';
    return;
  }
  document.getElementById('subtitle').textContent =
    `${dates[0]} ~ ${dates[dates.length - 1]}  ·  ${dates.length} 天`;

  // STATS
  const validDays = days.filter(d => d.completion_rate !== null && !d.is_rest_day);
  const totalDays = days.length;
  const trainDays = validDays.length;
  const restDays = totalDays - trainDays;
  const avgRate = validDays.length > 0
    ? Math.round(validDays.reduce((s, d) => s + d.completion_rate, 0) / validDays.length)
    : 0;
  const anomaliesCount = days.reduce((s, d) => s + (d.anomalies ? d.anomalies.length : 0), 0);

  document.getElementById('stats').innerHTML = `
    <div class="stat">
      <div class="label">训练天数</div>
      <div class="value">${trainDays}<span style="font-size:14px;color:var(--fg2);margin-left:4px">/ ${totalDays}</span></div>
      <div class="hint">${restDays} 天休息</div>
    </div>
    <div class="stat">
      <div class="label">平均完成率</div>
      <div class="value ${avgRate >= 100 ? 'good' : avgRate >= 50 ? 'warn' : 'bad'}">${avgRate}<span style="font-size:14px;color:var(--fg2);margin-left:4px">%</span></div>
      <div class="hint">${avgRate >= 80 ? '✓ 稳定' : avgRate >= 50 ? '需加强' : '需调整'}</div>
    </div>
    <div class="stat">
      <div class="label">异常天</div>
      <div class="value ${anomaliesCount === 0 ? 'good' : anomaliesCount > 2 ? 'bad' : 'warn'}">${anomaliesCount}</div>
      <div class="hint">漏做 / 超额</div>
    </div>
    <div class="stat">
      <div class="label">实做总组数</div>
      <div class="value">${days.reduce((s, d) => s + (d.actual_total_sets || 0), 0)}</div>
      <div class="hint">计划 ${days.reduce((s, d) => s + (d.plan_total_sets || 0), 0)} 组</div>
    </div>
  `;

  // HEATMAP
  const heatmap = document.getElementById('heatmap');
  heatmap.innerHTML = dates.map((d, i) => {
    const data = root[d];
    const dateObj = new Date(d);
    const dayOfWeek = dateObj.getDay();
    const isWeekend = dayOfWeek === 0 || dayOfWeek === 6;
    const dowLabel = ['日', '一', '二', '三', '四', '五', '六'][dayOfWeek];
    const monthDay = `${dateObj.getMonth() + 1}/${dateObj.getDate()}`;
    const cls = classifyDay(data.completion_rate);
    const finalCls = isWeekend ? `${cls} weekend` : cls;
    const pctStr = data.completion_rate !== null ? `${Math.round(data.completion_rate)}%` :
                   data.is_rest_day ? '休' : '—';
    const note = data.note ? `<div class="note">${escapeHTML(data.note)}</div>` : '';
    return `<div class="day-cell ${finalCls}">
      <div class="date">${monthDay} 周${dowLabel}</div>
      <div class="pct">${pctStr}</div>
      ${note}
    </div>`;
  }).join('');

  // TABLE
  const tbody = document.getElementById('tbody');
  tbody.innerHTML = dates.map(d => {
    const data = root[d];
    const rate = data.completion_rate;
    const rateStr = rate !== null ? `${Math.round(rate)}%` : '休';
    const rateCls = rateClass(rate);
    const sessions = (data.sessions || []).filter(Boolean);
    const sessionsStr = sessions.length ? sessions.join(' / ') : '—';
    const anomaliesHTML = (data.anomalies || []).map(a => {
      const type = a.type || '';
      const cls = (type === 'low_completion' || type === 'over_completion') ? 'warn' : 'bad';
      return `<span class="anomaly ${cls}">${escapeHTML(a.msg)}</span>`;
    }).join('');
    return `<tr>
      <td><strong>${d}</strong></td>
      <td>W${data.plan_week || '?'}</td>
      <td style="font-size:12px;color:var(--fg2)">${escapeHTML(sessionsStr)}</td>
      <td>${data.plan_total_sets}</td>
      <td>${data.actual_total_sets}</td>
      <td class="rate-cell ${rateCls}">${rateStr}</td>
      <td>${anomaliesHTML}</td>
    </tr>`;
  }).join('');

  // COPY：数据摘要（人类可读纯文本）写入 copyDataStore；日志写入 copyLogStore
  const meta = (root.__meta__) || {};
  let txt = `训练复盘 (${dates[0]} ~ ${dates[dates.length-1]})\n`;
  txt += `训练 ${trainDays}/${totalDays} 天，平均完成率 ${avgRate}%\n`;
  txt += `异常: ${anomaliesCount} 条\n`;
  if (meta.volume) {
    const vol = meta.volume;
    txt += `容量: 实做 ${fmtK(vol.total_actual)} / 计划 ${fmtK(vol.total_plan)} kg×次\n`;
    vol.weeks.forEach(w => {
      txt += `  ${w.label}: 实做 ${fmtK(w.actual)} / 计划 ${fmtK(w.plan)}\n`;
    });
  }
  document.getElementById('copyDataStore').textContent = txt;

  let log = `训练复盘日志 (${dates[0]} ~ ${dates[dates.length-1]})\n`;
  log += `训练 ${trainDays}/${totalDays} 天，平均完成率 ${avgRate}% · 异常 ${anomaliesCount} 条\n`;
  if (meta.volume) {
    const vol = meta.volume;
    log += `容量: 实做 ${fmtK(vol.total_actual)} / 计划 ${fmtK(vol.total_plan)} kg×次\n`;
  }
  log += `\n每日明细:\n`;
  dates.forEach(d => {
    const data = root[d];
    const r = data.completion_rate;
    const rStr = r !== null ? `${Math.round(r)}%` : '休';
    const sessions = (data.sessions || []).filter(Boolean).join(' / ');
    log += `  ${d} [W${data.plan_week || '?'}] ${rStr} (${data.actual_total_sets}/${data.plan_total_sets})`;
    if (sessions) log += ` · ${sessions}`;
    if (data.note) log += ` - ${data.note}`;
    log += '\n';
  });
  document.getElementById('copyLogStore').textContent = log;

  // 扩展按钮（related_scenes）：本周页面给出「计划复盘本月/全部」入口
  const extEl = document.getElementById('copyExt');
  const related = meta.related_scenes || [];
  if (related.length) {
    extEl.innerHTML = related.map(s =>
      `<button class="btn-ext" data-scene="${s.name.replace(/"/g, '&quot;')}" onclick="copyRelated('${s.name.replace(/'/g, "\\'")}')">${escapeHTML(s.name)}</button>`
    ).join('');
    extEl.classList.add('show');
  }

  // #257 容量/负荷图表（数据在 __meta__.volume）
  renderVolume(meta.volume || null);
  renderMovements(meta.volume || null);
}

render();


</script>


<div id="actionbar-zone"></div>
<script>(function(){var z=document.getElementById('actionbar-zone');if(z&&window.actionBar&&window.__P__){z.innerHTML=window.actionBar(window.__P__);}})();</script>
</body>
