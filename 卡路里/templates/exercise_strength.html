<!DOCTYPE html>
<html lang="zh-CN">
<head>
<style><!--SHARED-CSS--></style>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>卡路里 · 力量训练总览</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --fg:#1d1d1d; --fg2:#6e6e73; --fg3:#86868b; --bg:#fafafa;
          --card:#fff; --border:#d2d2d7; --accent:#0071e3;
          --good:#34c759; --soft:#f5f5f7; }
  body { font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
         line-height:1.6; color:var(--fg); background:var(--bg);
         max-width:780px; margin:0 auto; padding:48px 24px 80px; -webkit-font-smoothing:antialiased; }
  .meta-bar { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
  .meta-bar .left { font-size:12px; color:var(--fg2); }
  h1 { font-size:32px; font-weight:700; letter-spacing:-.025em; margin-bottom:4px; }
  .sub { font-size:14px; color:var(--fg3); margin-bottom:24px; }
  .kpi-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:16px; }
  .kpi { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:16px 18px; }
  .kpi .label { font-size:11px; color:var(--fg2); margin-bottom:4px; }
  .kpi .value { font-size:20px; font-weight:700; }
  .kpi .extra { font-size:11px; color:var(--fg3); margin-top:3px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:16px;
          padding:20px 22px; margin-bottom:16px; }
  .card h2 { font-size:16px; font-weight:600; margin-bottom:12px; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th, td { padding:9px 10px; text-align:left; border-bottom:1px solid var(--border); }
  th { color:var(--fg2); font-size:12px; font-weight:600; }
  td.num, th.num { text-align:right; font-variant-numeric:tabular-nums; }
  .trend-wrap { overflow-x:auto; -webkit-overflow-scrolling:touch; }
  .trend-row { display:flex; align-items:flex-end; gap:3px; height:56px; margin-top:8px; }
  .trend-bar { width:14px; background:var(--accent); border-radius:3px 3px 0 0; min-height:2px; }
  .trend-date { font-size:10px; color:var(--fg3); margin-top:4px; }
  .footer { margin-top:24px; padding:16px 18px; background:var(--soft); border-radius:12px;
            display:flex; justify-content:flex-end; }
  .btn { border:1px solid var(--border); background:var(--card); padding:8px 16px; border-radius:8px;
         cursor:pointer; font-size:13px; color:var(--fg); min-height:36px; }
  .btn:hover { background:var(--accent); color:#fff; border-color:var(--accent); }
  @media (max-width:640px) {
    body { padding:20px 14px 80px; }
    h1 { font-size:22px; }
    .kpi-grid { grid-template-columns:1fr 1fr; gap:10px; }
    .footer { justify-content:stretch; }
    .footer .btn { flex:1; min-height:44px; }
    .card { padding:14px 14px; overflow-x:auto; }
  }

  @keyframes fadeup{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
</style>
</head>
<body>
<script id="payload" type="application/json"><!--INJECT-DATA--></script><script><!--SHARED-HELPERS--></script><script>window.__P__=(function(){try{return JSON.parse(document.getElementById('payload').textContent||'{}');}catch(e){return null;}})();</script>

<div class="meta-bar"><div class="left" id="metaLeft">--</div></div>
<h1>💪 力量训练总览</h1>
<p class="sub" id="subTitle">--</p>

<div class="kpi-grid" id="kpiGrid"></div>

<div class="card">
  <h2>📋 按动作聚合</h2>
  <table>
    <thead id="tHead"></thead>
    <tbody id="tBody"></tbody>
  </table>
</div>

<div class="card">
  <h2>📈 重量轨迹(最近 10 个训练日 · 单侧口径 Σkg×次数)</h2>
  <div id="trendBox"></div>
</div>

<div class="footer"></div>

<script>
(function(){
  const D = window.__P__;
  if (!D || D.status !== 'ok') { document.body.innerHTML = '<div style="padding:60px;text-align:center;color:#86868b">⚠ 数据未注入或状态非 ok</div>'; return; }
  const d = D.data;
  document.getElementById('metaLeft').textContent = d.meta.today;
  document.getElementById('subTitle').textContent = d.summary.subtitle;

  const grid = document.getElementById('kpiGrid');
  ['k1','k2','k3','k4'].forEach(k => {
    const s = d.summary[k];
    grid.insertAdjacentHTML('beforeend',
      `<div class="kpi"><div class="label">${s.label}</div><div class="value">${s.value}</div>` +
      (s.extra ? `<div class="extra">${s.extra}</div>` : '') + `</div>`);
  });

  document.getElementById('tHead').innerHTML = d.summary.table_header;
  const body = document.getElementById('tBody');
  (d.actions || []).forEach(a => {
    body.insertAdjacentHTML('beforeend',
      `<tr><td>${a.name}</td><td class="num">${a.sets}</td><td class="num">${a.weight} kg</td><td class="num">${a.reps}</td></tr>`);
  });
  if (!(d.actions || []).length) {
    body.insertAdjacentHTML('beforeend', '<tr><td colspan="4" style="color:#86868b">暂无力量训练记录</td></tr>');
  }

  const box = document.getElementById('trendBox');
  (d.trends || []).forEach(t => {
    const max = Math.max(...t.points.map(p => p.weight), 1);
    const row = document.createElement('div');
    row.style.cssText = 'margin-bottom:14px';
    row.innerHTML = `<div style="font-size:12px;color:#6e6e73;margin-bottom:2px">${t.action}</div>`;
    const bars = document.createElement('div');
    bars.className = 'trend-row';
    t.points.forEach(p => {
      const h = Math.max(2, Math.round(p.weight / max * 54));
      const b = document.createElement('div');
      b.className = 'trend-bar';
      b.style.height = h + 'px';
      b.title = p.date + ' ' + p.weight + ' kg';
      bars.appendChild(b);
    });
    row.appendChild(bars);
    box.appendChild(row);
  });
  if (!(d.trends || []).length) {
    box.innerHTML = '<div style="color:#86868b;font-size:13px">暂无数据</div>';
  }})();

  
</script>


<div id="actionbar-zone"></div>
<script>(function(){var z=document.getElementById('actionbar-zone');if(z&&window.actionBar&&window.__P__){z.innerHTML=window.actionBar(window.__P__);}})();</script>
</body>
</html>
