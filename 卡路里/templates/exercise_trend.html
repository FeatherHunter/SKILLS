<!DOCTYPE html>
<html lang="zh-CN">
<head>
<style><!--SHARED-CSS--></style>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>卡路里 · 运动趋势</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --fg:#1d1d1d; --fg2:#6e6e73; --fg3:#86868b; --bg:#fafafa;
          --card:#fff; --border:#d2d2d7; --accent:#0071e3; --good:#34c759; --soft:#f5f5f7; }
  body { font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
         line-height:1.6; color:var(--fg); background:var(--bg);
         max-width:780px; margin:0 auto; padding:48px 24px 80px; -webkit-font-smoothing:antialiased; }
  .meta-bar { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
  .meta-bar .left { font-size:12px; color:var(--fg2); }
  h1 { font-size:32px; font-weight:700; letter-spacing:-.025em; margin-bottom:4px; }
  .sub { font-size:14px; color:var(--fg3); margin-bottom:24px; }
  .kpi-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:16px; }
  .kpi { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:16px 18px; }
  .kpi .label { font-size:11px; color:var(--fg2); margin-bottom:4px; }
  .kpi .value { font-size:20px; font-weight:700; }
  .kpi .extra { font-size:11px; color:var(--fg3); margin-top:3px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:16px;
          padding:20px 22px; margin-bottom:16px; }
  .card h2 { font-size:16px; font-weight:600; margin-bottom:12px; }
  .chart-wrap { overflow-x:auto; -webkit-overflow-scrolling:touch; }
  .chart { display:flex; align-items:flex-end; gap:2px; height:120px; min-width:320px; }
  .bar { flex:1; background:var(--accent); border-radius:2px 2px 0 0; position:relative; }
  .bar.min { background:var(--soft); border:1px solid var(--border); }
  .bar-label { position:absolute; bottom:-16px; left:0; right:0; text-align:center;
               font-size:9px; color:var(--fg3); transform:rotate(-45deg); }
  .legend { display:flex; gap:16px; font-size:12px; color:var(--fg2); margin-bottom:8px; }
  .legend i { display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:4px; }
  .footer { margin-top:24px; padding:16px 18px; background:var(--soft); border-radius:12px;
            display:flex; justify-content:flex-end; }
  .btn { border:1px solid var(--border); background:var(--card); padding:8px 16px; border-radius:8px;
         cursor:pointer; font-size:13px; color:var(--fg); min-height:36px; }
  .btn:hover { background:var(--accent); color:#fff; border-color:var(--accent); }
  @media (max-width:640px) {
    body { padding:20px 14px 80px; }
    h1 { font-size:22px; }
    .kpi-grid { grid-template-columns:1fr 1fr; gap:10px; }
    .footer { justify-content:stretch; }
    .footer .btn { flex:1; min-height:44px; }
    .card { padding:14px 14px; }
  }

  @keyframes fadeup{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
</style>
</head>
<body>
<script id="payload" type="application/json"><!--INJECT-DATA--></script><script><!--SHARED-HELPERS--></script><script>window.__P__=(function(){try{return JSON.parse(document.getElementById('payload').textContent||'{}');}catch(e){return null;}})();</script>

<div class="meta-bar"><div class="left" id="metaLeft">--</div></div>
<h1>📈 运动趋势</h1>
<p class="sub" id="subTitle">--</p>

<div class="kpi-grid" id="kpiGrid"></div>

<div class="card">
  <h2>🔥 每日消耗(卡)</h2>
  <div class="legend"><span><i style="background:#0071e3"></i>消耗</span><span><i style="background:#34c759"></i>时长</span></div>
  <div class="chart-wrap"><div class="chart" id="calChart"></div></div>
</div>

<div class="card">
  <h2>🗓️ 每周运动频次(次)</h2>
  <div class="chart-wrap"><div class="chart" id="weekChart" style="height:80px"></div></div>
</div>

<div class="footer"></div>

<script>
(function(){
  const D = window.__P__;
  if (!D || D.status !== 'ok') { document.body.innerHTML = '<div style="padding:60px;text-align:center;color:#86868b">⚠ 数据未注入或状态非 ok</div>'; return; }
  const d = D.data;
  document.getElementById('metaLeft').textContent = d.meta.today;
  document.getElementById('subTitle').textContent = d.summary.subtitle;

  ['k1','k2','k3','k4'].forEach(k => {
    const s = d.summary[k];
    document.getElementById('kpiGrid').insertAdjacentHTML('beforeend',
      `<div class="kpi"><div class="label">${s.label}</div><div class="value">${s.value}</div>` +
      (s.extra ? `<div class="extra">${s.extra}</div>` : '') + `</div>`);
  });

  const calChart = document.getElementById('calChart');
  const daily = d.daily || [];
  const maxCal = Math.max(...daily.map(x => x.calories), 1);
  const maxMin = Math.max(...daily.map(x => x.minutes), 1);
  daily.forEach(x => {
    const cal = document.createElement('div');
    cal.className = 'bar' + (x.calories === 0 ? ' min' : '');
    cal.style.height = Math.max(2, Math.round(x.calories / maxCal * 96)) + 'px';
    cal.style.background = '#0071e3';
    cal.title = x.date + ' ' + x.calories + ' 卡';
    const min = document.createElement('div');
    min.className = 'bar';
    min.style.height = Math.max(2, Math.round(x.minutes / maxMin * 60)) + 'px';
    min.style.background = '#34c759';
    min.style.marginTop = '-2px';
    min.title = x.date + ' ' + x.minutes + ' 分';
    const cell = document.createElement('div');
    cell.style.cssText = 'flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:2px';
    cell.appendChild(cal);
    cell.appendChild(min);
    if (daily.length <= 35) {
      const lb = document.createElement('div');
      lb.className = 'bar-label';
      lb.textContent = x.date.slice(5);
      cell.appendChild(lb);
    }
    calChart.appendChild(cell);
  });

  const weekChart = document.getElementById('weekChart');
  const weekly = d.weekly || [];
  const maxW = Math.max(...weekly.map(x => x.count), 1);
  weekly.forEach(x => {
    const b = document.createElement('div');
    b.className = 'bar' + (x.count === 0 ? ' min' : '');
    b.style.height = Math.max(2, Math.round(x.count / maxW * 60)) + 'px';
    b.title = x.label + ' ' + x.count + ' 次';
    const lb = document.createElement('div');
    lb.className = 'bar-label';
    lb.textContent = x.label.slice(-2);
    const cell = document.createElement('div');
    cell.style.cssText = 'flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:2px';
    cell.appendChild(b); cell.appendChild(lb);
    weekChart.appendChild(cell);
  });
  if (!weekly.length) weekChart.innerHTML = '<div style="color:#86868b;font-size:13px">暂无数据</div>';})();

  
</script>


<div id="actionbar-zone"></div>
<script>(function(){var z=document.getElementById('actionbar-zone');if(z&&window.actionBar&&window.__P__){z.innerHTML=window.actionBar(window.__P__);}})();</script>
</body>
</html>
