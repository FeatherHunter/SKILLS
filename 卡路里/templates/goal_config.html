<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>目标配置 · 卡路里</title>
<style>
:root{
  --bg:#fff;--bg-soft:#f5f5f7;--card:#fff;
  --ink:#1d1d1d;--ink2:#3c3c43;--ink3:#8e8e93;
  --line:rgba(60,60,67,.12);--lineS:rgba(60,60,67,.06);
  --accent:#007aff;--accent-soft:rgba(0,122,255,.08);
  --green:#34c759;--green-soft:rgba(52,199,89,.10);
  --orange:#ff9500;--orange-soft:rgba(255,149,0,.10);
  --shadow:0 1px 3px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.04);
  --r-sm:8px;--r:14px;--r-lg:20px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg-soft);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:920px;margin:0 auto;padding:32px 20px 80px}
.hero{padding:32px 28px 28px;margin-bottom:20px;background:linear-gradient(135deg,#fff,#f5f8ff);border-radius:20px;box-shadow:var(--shadow)}
.hero h1{font-size:30px;font-weight:700;letter-spacing:-.5px;margin-bottom:6px}
.hero .sub{font-size:15px;color:var(--ink3);font-weight:400}
.section{background:var(--card);border-radius:20px;padding:24px 28px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.04);border:1px solid rgba(60,60,67,.06)}
.section-title{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:18px}
.section-title h2{font-size:17px;font-weight:600;letter-spacing:-.2px}
.section-title .hint{font-size:12px;color:var(--ink3)}
.slider-row{display:grid;grid-template-columns:140px 1fr 90px;gap:14px;align-items:center;padding:14px 0;border-top:1px solid var(--lineS)}
.slider-row:first-child{border-top:none}
.slider-row .name{font-size:14px;font-weight:600}
.slider-row .name .unit{font-size:12px;color:var(--ink3);font-weight:400;margin-left:4px}
.slider-row input[type="range"]{width:100%;accent-color:var(--accent)}
.slider-row .value{font-size:18px;font-weight:600;text-align:right;font-feature-settings:"tnum";color:var(--ink)}
.slider-row .value .unit{font-size:12px;color:var(--ink3);font-weight:400;margin-left:2px}
.mini-chart{margin:18px 0;padding:16px;background:var(--bg-soft);border-radius:12px}
.mini-chart h3{font-size:14px;font-weight:600;margin-bottom:12px;color:var(--ink2)}
.mini-row{display:grid;grid-template-columns:100px 1fr 110px;align-items:center;gap:10px;padding:6px 0}
.mini-label{font-size:13px;font-weight:500}
.mini-bar-bg{height:10px;background:#e5e5ea;border-radius:5px;overflow:hidden;position:relative}
.mini-bar-fg{position:absolute;top:0;left:0;height:100%;background:var(--accent);border-radius:5px;transition:width .3s}
.mini-bar-actual{position:absolute;top:0;left:0;height:100%;border-right:2px solid var(--orange);border-radius:5px 0 0 5px;transition:width .3s;background:transparent}
.mini-num{font-size:12px;color:var(--ink2);text-align:right;font-feature-settings:"tnum"}
.copy-section{background:linear-gradient(135deg,var(--card),#f8fbff);border-radius:20px;padding:28px 32px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.04);border:1px solid rgba(60,60,67,.06)}
.copy-section h2{font-size:19px;font-weight:600;letter-spacing:-.3px;margin-bottom:6px}
.copy-section .sub{font-size:13.5px;color:var(--ink2);margin-bottom:18px;line-height:1.6}
.copy-section code{background:var(--bg-soft);padding:1px 6px;border-radius:4px;font-size:12px;font-family:"SF Mono",monospace}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:11px 20px;border-radius:999px;font-size:14px;font-weight:600;cursor:pointer;border:none;transition:opacity .15s;font-family:inherit}
.btn:hover{opacity:.85}
.btn.primary{background:var(--ink);color:#fff}
.btn.secondary{background:var(--bg-soft);color:var(--ink);border:1px solid var(--line)}
.btn.warning{background:var(--orange-soft);color:var(--orange)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.copied{background:var(--green)!important;color:#fff!important;border-color:var(--green)!important}
.weight-progress{padding:18px 22px;background:linear-gradient(135deg,var(--accent-soft),#fff);border-radius:14px;margin-top:14px}
.weight-progress h3{font-size:15px;font-weight:600;margin-bottom:10px;color:var(--accent)}
.weight-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:8px}
.weight-stat{padding:10px 14px;background:var(--card);border-radius:10px}
.weight-stat .label{font-size:11px;color:var(--ink3);margin-bottom:4px;text-transform:uppercase;letter-spacing:.4px}
.weight-stat .value{font-size:20px;font-weight:700;font-feature-settings:"tnum"}
footer{text-align:center;color:var(--ink3);font-size:12px;padding-top:20px;border-top:1px solid var(--lineS);margin-top:36px}
#backTop{position:fixed;bottom:24px;right:24px;width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.85);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border:1px solid var(--line);color:var(--ink);text-decoration:none;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:600;box-shadow:var(--shadow)}
@media(max-width:640px){.wrap{padding:20px 16px 60px}.hero{padding:24px 20px 20px}.hero h1{font-size:24px}.section,.copy-section{padding:18px 20px}.section-title{flex-direction:column;align-items:flex-start;gap:4px}.slider-row{grid-template-columns:1fr auto;grid-template-areas:"name value""bar bar";gap:8px 10px}.slider-row .name{grid-area:name}.slider-row .value{grid-area:value;text-align:right}.slider-row input[type="range"]{grid-area:bar}.weight-grid{grid-template-columns:1fr}.mini-row{grid-template-columns:1fr;gap:6px}.mini-num{text-align:left}}
</style>
</head>
<body>
<div class="wrap">
<header class="hero">
<div class="eyebrow" id="eyebrow">卡路里 · 目标配置</div>
<h1 id="title">目标配置</h1>
<div class="sub" id="subtitle">加载中…</div>
</header>
<section class="section">
<div class="section-title">
<h2>每日营养目标 (5 项)</h2>
<span class="hint">拖动 slider 调整 · 实时显示昨日 vs 新目标</span>
</div>
<div id="sliders"></div>
<div class="mini-chart" id="miniChart" style="display:none">
<h3>📊 昨日 vs 新目标 (mini chart)</h3>
<div id="chartRows"></div>
</div>
<div class="weight-progress" id="bmrWarning" style="display:none;background:var(--orange-soft);margin-top:14px">
<h3 style="color:var(--orange)">⚠️ BMR 低值提示</h3>
<p id="bmrWarningText" style="font-size:13px;color:var(--ink2);margin-top:6px"></p>
</div>
</section>
<section class="section" id="weightSection" style="display:none">
<div class="section-title">
<h2>体重目标进度</h2>
<span class="hint" id="weightHint"></span>
</div>
<div class="weight-progress">
<h3>当前 → 目标</h3>
<div class="weight-grid" id="weightGrid"></div>
</div>
</section>
<section class="section" id="diffSection" style="display:none">
<div class="section-title">
<h2>改前 vs 改后</h2>
<span class="hint">修改影响预估</span>
</div>
<div id="diffRows"></div>
</section>
<section class="copy-section">
<h2>更改配置</h2>
<p class="sub">拖动滑块调整目标,点击「更改配置」复制指令,粘到 AI 对话框即可按新配置写入。</p>
<div class="btn-row">
<button class="btn primary" id="btnAdopt" onclick="copyConfig()">✏️ 更改配置</button>
<button class="btn secondary" id="copyDataBtn" onclick="copyData()">📋 复制数据</button>
<button class="btn secondary" id="copyLogBtn" onclick="copyLog()">📋 复制日志</button>
</div>
</section>
</div>
<a id="backTop" href="#top" title="回到顶部">↑</a>
<!--INJECT-DATA-->
<script>
const DATA=(()=>{if(typeof window.__DATA__!=='object'||window.__DATA__===null)return null;return window.__DATA__})();
const META=(DATA&&DATA.data&&DATA.data.meta)||{};
const PAGE_TITLE=DATA&&DATA.data&&DATA.data.page_title?DATA.data.page_title:'目标配置';
const CURRENT=DATA&&DATA.data&&DATA.data.current_goal?DATA.data.current_goal:{};
const YESTERDAY=DATA&&DATA.data&&DATA.data.yesterday_actual?DATA.data.yesterday_actual:{};
const WEIGHT=DATA&&DATA.data&&DATA.data.weight_progress?DATA.data.weight_progress:null;
const WATER_ONLY=!!(DATA&&DATA.data&&DATA.data.water_only);
// 2026-08-02 对抗审查拍板:所有目标下限 0;热量 slider 上限 = 宏量上限的 4/4/9 总和(4550)
const MACRO_MAX={protein_goal:300,carbs_goal:500,fat_goal:150};
const FIELDS=[
  {key:'calorie_goal',label:'热量',unit:'卡',min:0,max:MACRO_MAX.protein_goal*4+MACRO_MAX.carbs_goal*4+MACRO_MAX.fat_goal*9,step:5,yesterdayKey:'calorie'},
  {key:'protein_goal',label:'蛋白',unit:'g',min:0,max:MACRO_MAX.protein_goal,step:1,yesterdayKey:'protein'},
  {key:'carbs_goal',label:'碳水',unit:'g',min:0,max:MACRO_MAX.carbs_goal,step:1,yesterdayKey:'carbs'},
  {key:'fat_goal',label:'脂肪',unit:'g',min:0,max:MACRO_MAX.fat_goal,step:1,yesterdayKey:'fat'},
  {key:'water_goal',label:'饮水',unit:'ml',min:0,max:4000,step:100,yesterdayKey:'water'}
];
const ACTIVE_FIELDS=WATER_ONLY?FIELDS.filter(f=>f.key==='water_goal'):FIELDS;
const state={};
// 比例锚定(2026-08-04 场景19 对抗审查定稿):拖热量全程用锚定比例,不用实时比例(避免漂移)
// - 加载时:初始宏量非零 → 锚定为初始比例;全 0 → 默认 30/50/20
// - 拖热量归零时:锚定归零前比例(归零后拖回比例保持)
// - 手动从全 0 设非零宏量:锚定用户设定
let savedRatio=null;
let dragDir=0;
function saveRatio(p,c,f){
  const sum=(p||0)*4+(c||0)*4+(f||0)*9;
  if(sum>=60)savedRatio={p:p*4/sum,c:c*4/sum,f:f*9/sum};
}
ACTIVE_FIELDS.forEach(f=>{state[f.key]=CURRENT[f.key]||f.min});
saveRatio(state.protein_goal||0,state.carbs_goal||0,state.fat_goal||0);
function renderHeader(){
  document.getElementById('title').textContent=PAGE_TITLE;
  document.getElementById('subtitle').textContent=
    `目标日 ${fmtNum(CURRENT.calorie_goal||'?')} 卡 · 蛋白 ${fmtNum(CURRENT.protein_goal||'?')}g · 碳水 ${fmtNum(CURRENT.carbs_goal||'?')}g · 脂肪 ${fmtNum(CURRENT.fat_goal||'?')}g · 饮水 ${fmtNum(CURRENT.water_goal||'?')}ml`;
}
function renderSliders(){
  const html=ACTIVE_FIELDS.map(f=>{
    return `<div class="slider-row">
      <div class="name">${f.label}<span class="unit">${f.unit}</span></div>
      <input type="range" min="${f.min}" max="${f.max}" step="${f.step}" value="${state[f.key]}" data-key="${f.key}" oninput="onSlider(this)">
      <div class="value">${state[f.key]}<span class="unit">${f.unit}</span></div>
    </div>`;
  }).join('');
  document.getElementById('sliders').innerHTML=html;
}
function onSlider(el){
  const key=el.dataset.key;
  const prev=state[key];
  state[key]=parseInt(el.value,10);
  dragDir=(state[key]<prev)?-1:((state[key]>prev)?1:0);
  if(key==='calorie_goal'){
    scaleMacros(state.calorie_goal);
  }else if(key!=='water_goal'){
    const curSum=(state.protein_goal||0)+(state.carbs_goal||0)+(state.fat_goal||0);
    if(state[key]>0&&curSum>0){
      saveRatio(state.protein_goal||0,state.carbs_goal||0,state.fat_goal||0);
    }
    recalcCalorie();
  }
  syncSliderValues();
  updateMiniChart();
}
// 宏量联动 v2(2026-08-03 用户验收 #2 修复):
// - 热量 slider:min 0 / max 4550(=宏量上限 4/4/9 能量和)/ step 5
// - 拖热量 → 宏量按锚定比例分配(全 0 起手 = 默认 30/50/20;有锚定 = 锚定比例);
//   单个宏量封顶后剩余能量按比例重分配,总能量跟踪热量(偏差 ≤4 卡,无累积漂移)
// - 拖宏量 → 热量按 4/4/9 精确重算(step 5 取整)
function macroSum(){return ((state.protein_goal||0)*4)+((state.carbs_goal||0)*4)+((state.fat_goal||0)*9);}
function clampV(v,min,max){return Math.min(max,Math.max(min,v));}
function roundStep(v,step){return Math.round(v/step)*step;}
function fmtNum(v){const n=Math.round((Number(v)||0)*100)/100;return String(n);}
function distributeMacros(newCal){
  const pMax=fieldMax('protein_goal'),cMax=fieldMax('carbs_goal'),fMax=fieldMax('fat_goal');
  const capP=pMax*4,capC=cMax*4,capF=fMax*9;
  const sumE=macroSum();
  let dP,dC,dF;
  if(dragDir<0){
    // 向左(2026-08-04 用户拍板):按当前宏量实时比例同步缩小,满项立即动
    let shP,shC,shF;
    if(sumE>0){
      shP=(state.protein_goal||0)*4/sumE;shC=(state.carbs_goal||0)*4/sumE;shF=(state.fat_goal||0)*9/sumE;
    }else if(savedRatio){
      shP=savedRatio.p;shC=savedRatio.c;shF=savedRatio.f;
    }else{shP=4/17;shC=4/17;shF=9/17;}
    dP=newCal*shP;dC=newCal*shC;dF=newCal*shF;
  }else{
  // 满项锁定(2026-08-04 用户拍板):当前已在上限的宏量保持满值,剩余能量按锚定比例(未满项归一)分配
  const pFull=state.protein_goal>=pMax, cFull=state.carbs_goal>=cMax, fFull=state.fat_goal>=fMax;
  const lockedE=(pFull?capP:0)+(cFull?capC:0)+(fFull?capF:0);
  if(savedRatio&&newCal>lockedE){
    let shP=pFull?0:savedRatio.p, shC=cFull?0:savedRatio.c, shF=fFull?0:savedRatio.f;
    const t=shP+shC+shF;
    if(t>0){
      shP/=t;shC/=t;shF/=t;
    }else{
      // 锚定比例全落在满项上(如手动设脂肪独占后脂肪已满)→ 未满项回退默认 1:1:1 分配
      shP=pFull?0:4/17;shC=cFull?0:4/17;shF=fFull?0:9/17;
      const t2=shP+shC+shF;
      if(t2>0){shP/=t2;shC/=t2;shF/=t2;}
    }
    const budget=newCal-lockedE;
    dP=pFull?capP:budget*shP;
    dC=cFull?capC:budget*shC;
    dF=fFull?capF:budget*shF;
  }else if(savedRatio){
    dP=newCal*savedRatio.p;dC=newCal*savedRatio.c;dF=newCal*savedRatio.f;
  }else{
    dP=newCal*4/17;dC=newCal*4/17;dF=newCal*9/17;
  }
  }
  let excess=0;
  if(dP>capP){excess+=dP-capP;dP=capP;}
  if(dC>capC){excess+=dC-capC;dC=capC;}
  if(dF>capF){excess+=dF-capF;dF=capF;}
  let guard=0;
  while(excess>0.5&&guard<6){
    guard++;
    const roomP=capP-dP,roomC=capC-dC,roomF=capF-dF;
    const total=roomP+roomC+roomF;
    if(total<=0)break;
    const aP=Math.min(roomP,excess*roomP/total);
    const aC=Math.min(roomC,excess*roomC/total);
    const aF=Math.min(roomF,excess*roomF/total);
    dP+=aP;dC+=aC;dF+=aF;
    excess-=(aP+aC+aF);
  }
  return roundGrams(dP/4,dC/4,dF/9,newCal);
}
function roundGrams(p,c,f,newCal){
  // 2026-08-04 用户拍板:向左拖动(减少)用 floor 立即响应(满项不锁);向右用 round(满项保持)
  let gP=dragDir<0?Math.floor(p):Math.round(p);
  let gC=dragDir<0?Math.floor(c):Math.round(c);
  let gF=dragDir<0?Math.floor(f):Math.round(f);
  const pMax=fieldMax('protein_goal'),cMax=fieldMax('carbs_goal'),fMax=fieldMax('fat_goal');
  for(let i=0;i<4;i++){
    const e=gP*4+gC*4+gF*9;
    const diff=newCal-e;
    if(Math.abs(diff)<=4)break;
    if(diff>0){
      const opts=[];
      if(gP<pMax)opts.push({k:'p',frac:p-Math.floor(p)});
      if(gC<cMax)opts.push({k:'c',frac:c-Math.floor(c)});
      if(gF<fMax)opts.push({k:'f',frac:f-Math.floor(f)});
      if(!opts.length)break;
      opts.sort((a,b)=>b.frac-a.frac);
      if(opts[0].k==='p')gP++;else if(opts[0].k==='c')gC++;else gF++;
    }else{
      const opts=[];
      if(gP>0&&gP<pMax)opts.push({k:'p',frac:p-Math.floor(p)});
      if(gC>0&&gC<cMax)opts.push({k:'c',frac:c-Math.floor(c)});
      if(gF>0&&gF<fMax)opts.push({k:'f',frac:f-Math.floor(f)});
      if(!opts.length)break;
      opts.sort((a,b)=>a.frac-b.frac);
      if(opts[0].k==='p')gP--;else if(opts[0].k==='c')gC--;else gF--;
    }
  }
  return [clampV(gP,0,pMax),clampV(gC,0,cMax),clampV(gF,0,fMax)];
}
function scaleMacros(newCal){
  if(newCal===0)saveRatio(state.protein_goal||0,state.carbs_goal||0,state.fat_goal||0);
  const r=distributeMacros(newCal);
  state.protein_goal=r[0];
  state.carbs_goal=r[1];
  state.fat_goal=r[2];
}
function recalcCalorie(){
  const f=FIELDS.find(x=>x.key==='calorie_goal');
  state.calorie_goal=roundStep(clampV(macroSum(),0,f.max),f.step);
}
function fieldMax(key){return FIELDS.find(f=>f.key===key).max;}
function syncSliderValues(){
  ACTIVE_FIELDS.forEach(f=>{
    const input=document.querySelector('input[data-key="'+f.key+'"]');
    if(!input)return;
    input.value=state[f.key];
    const cell=input.parentElement.querySelector('.value');
    if(cell)cell.innerHTML=state[f.key]+'<span class="unit">'+f.unit+'</span>';
  });
  document.querySelectorAll('#diffRows .slider-row[data-key]').forEach(row=>{
    const k=row.dataset.key;
    if(k&&state[k]!=null){
      const b=row.querySelector('b');
      if(b)b.textContent=state[k];
    }
  });
}
function updateMiniChart(){
  if(!YESTERDAY||Object.keys(YESTERDAY).length===0)return;
  document.getElementById('miniChart').style.display='block';
  const hasData=ACTIVE_FIELDS.some(f=>(YESTERDAY[f.yesterdayKey]||0)>0);
  if(!hasData){
    document.getElementById('chartRows').innerHTML=
      '<div class="mini-num" style="padding:6px 0;text-align:center;color:var(--ink3)">昨日无饮食记录,暂无对比数据</div>';
    return;
  }
  const rows=ACTIVE_FIELDS.map(f=>{
    const actual=YESTERDAY[f.yesterdayKey]||0;
    const target=state[f.key];
    const maxVal=Math.max(actual,target,1)*1.2;
    const targetPct=target/maxVal*100;
    const actualPct=actual/maxVal*100;
    const diff=actual-target;
    const diffText=(diff>0?'+':'')+fmtNum(diff);
    const diffColor=diff>0?'var(--orange)':'var(--green)';
    return `<div class="mini-row">
      <div class="mini-label">${f.label}(${f.unit})</div>
      <div class="mini-bar-bg">
        <div class="mini-bar-fg" style="width:${targetPct}%"></div>
        <div class="mini-bar-actual" style="width:${actualPct}%" title="昨日实际: ${fmtNum(actual)}"></div>
      </div>
      <div class="mini-num" style="color:${diffColor}">${fmtNum(actual)}/${fmtNum(target)} (${diffText})</div>
    </div>`;
  }).join('');
  document.getElementById('chartRows').innerHTML=rows;
}
function renderWeight(){
  if(!WEIGHT)return;
  document.getElementById('weightSection').style.display='block';
  document.getElementById('weightHint').textContent=
    '目标 '+fmtNum(WEIGHT.target)+'kg · '+WEIGHT.days_left+'天剩余';
  const diff=fmtNum(WEIGHT.current-WEIGHT.target);
  document.getElementById('weightGrid').innerHTML=
    '<div class="weight-stat"><div class="label">当前</div><div class="value">'+fmtNum(WEIGHT.current)+' kg</div></div>'+
    '<div class="weight-stat"><div class="label">目标</div><div class="value">'+fmtNum(WEIGHT.target)+' kg</div></div>'+
    '<div class="weight-stat"><div class="label">距离</div><div class="value">'+diff+' kg</div></div>';
}
function renderDiff(){
  const DIFF=DATA&&DATA.data&&DATA.data.diff?DATA.data.diff:null;
  if(!DIFF||!DIFF.items||!DIFF.items.length)return;
  document.getElementById('diffSection').style.display='block';
  const rows=DIFF.items.map(it=>{
    const oldV=it.old!=null?it.old:'未设';
    const newV=(it.key&&state[it.key]!=null)?state[it.key]:(it.new!=null?it.new:'未设');
    const impact=it.impact?`<div class="mini-num" style="color:var(--ink2)">影响: ${it.impact}</div>`:'';
    return `<div class="slider-row" data-key="${it.key||''}">
      <div class="name">${it.label}<span class="unit">${it.unit||''}</span></div>
      <div class="value" style="text-align:left;font-size:14px;color:var(--ink3)">${oldV} → <b style="color:var(--ink)">${newV}</b></div>
      <div></div>
    </div>${impact}`;
  }).join('');
  document.getElementById('diffRows').innerHTML=rows;
}
function renderBmrWarning(){
  const W=DATA&&DATA.data&&DATA.data.bmr_warning?DATA.data.bmr_warning:null;
  if(!W)return;
  document.getElementById('bmrWarning').style.display='block';
  document.getElementById('bmrWarningText').textContent=W.text;
  if(!W.below){
    // 安全: 转绿色确认样式(语义映射可审计: AI 检查过 BMR)
    const box=document.getElementById('bmrWarning');
    box.style.background='var(--green-soft)';
    box.querySelector('h3').style.color='var(--green)';
    box.querySelector('h3').textContent='✅ BMR 安全确认';
  }
}
function buildConfigPrompt(){
  const scene=META.wake_word||'定营养目标';
  let p='我已调整目标配置,请按「'+scene+'」流程写入数据库。\n\n';
  p+='营养目标:\n';
  p+='  热量 '+state.calorie_goal+' 卡\n';
  p+='  蛋白 '+state.protein_goal+' g\n';
  p+='  碳水 '+state.carbs_goal+' g\n';
  p+='  脂肪 '+state.fat_goal+' g\n';
  p+='  饮水 '+state.water_goal+' ml\n\n';
  p+='昨日实际(对比参考):\n';
  ACTIVE_FIELDS.forEach(f=>{
    const actual=YESTERDAY[f.yesterdayKey]||0;
    const diff=actual-state[f.key];
    p+='  '+f.label+': 目标 '+state[f.key]+f.unit+' · 昨日 '+(hasYesterdayData()?fmtNum(actual):'无记录')+' · 差 '+(diff>0?'+':'')+fmtNum(diff)+f.unit+'\n';
  });
  p+='\n数据来源: 目标配置 v1 · render_goal_config.py · '+new Date().toISOString().split('T')[0];
  return p;
}
function hasYesterdayData(){
  return YESTERDAY&&Object.keys(YESTERDAY).length>0&&ACTIVE_FIELDS.some(f=>(YESTERDAY[f.yesterdayKey]||0)>0);
}
function copyConfig(){doCopy(buildConfigPrompt(),'btnAdopt','✓ 已复制配置指令,粘给 AI 即可');}
renderHeader();
renderSliders();
renderWeight();
renderDiff();
renderBmrWarning();
updateMiniChart();

// R2 双按钮:复制数据(用户口径)/ 复制日志(排障口径) · 2026-08-02 对齐 #8
function buildDataText(){
  const lines=['目标配置'+(META.fetched_at?' ('+META.fetched_at+')':''),''];
  ACTIVE_FIELDS.forEach(f=>lines.push(`${f.label}: ${state[f.key]}${f.unit}`));
  if(WEIGHT)lines.push(`体重: 当前 ${WEIGHT.current}kg → 目标 ${WEIGHT.target}kg (${WEIGHT.days_left}天)`);
  const DIFF=DATA&&DATA.data&&DATA.data.diff?DATA.data.diff:null;
  if(DIFF&&DIFF.items&&DIFF.items.length){
    lines.push('');
    DIFF.items.forEach(it=>lines.push(`改前 ${it.label}: ${it.old!=null?it.old:'未设'} → 改后 ${it.new!=null?it.new:'待定'}`));
  }
  return lines.join('\n');
}
function buildLogText(){
  const lines=['[目标配置 排障日志]',''];
  lines.push(`唤醒词: ${META.wake_word||'(未知)'}`);
  lines.push(`渲染命令: ${META.render_cmd||'(未知)'}`);
  lines.push(`数据来源: ${META.source||'(未知)'}`);
  lines.push(`渲染时间: ${META.fetched_at||'(未知)'}`);
  lines.push('');
  if(META.chain){lines.push('AI 思考链:');lines.push(META.chain);}
  else{lines.push('AI 思考链: (未注入 · 渲染时未传 --chain,AI 执行时用 --chain 附上处理步骤)');}
  lines.push('');
  lines.push('原始数据:');
  lines.push(JSON.stringify(DATA&&DATA.data?DATA.data:null,null,2));
  return lines.join('\n');
}
function showToast(msg){
  let t=document.getElementById('copyToast');
  if(!t){t=document.createElement('div');t.id='copyToast';t.style.cssText='position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:rgba(28,28,30,.92);color:#fff;padding:10px 18px;border-radius:999px;font-size:13px;z-index:99;display:none;max-width:80vw';document.body.appendChild(t);}
  t.textContent=msg;t.style.display='block';
  setTimeout(()=>{t.style.display='none';},2000);
}
function doCopy(text,btnId,msg){
  const done=()=>{const b=document.getElementById(btnId);if(b){b.classList.add('copied');setTimeout(()=>b.classList.remove('copied'),600);}showToast(msg);};
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(()=>fallbackCopy(text,done));
  } else { fallbackCopy(text,done); }
  function fallbackCopy(txt,ok){
    const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();
    try{document.execCommand('copy');ok();}catch(e){}document.body.removeChild(ta);
  }
}
function copyData(){doCopy(buildDataText(),'copyDataBtn','目标配置 数据复制成功 ✓');}
function copyLog(){doCopy(buildLogText(),'copyLogBtn','排障日志复制成功 ✓ 可将日志发给开发者/AI 定位问题');}
