<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>目标进度 · 卡路里</title>
<style>
:root{--bg:#f5f5f7;--card:#fff;--ink:#1d1d1f;--ink2:#3c3c43;--ink3:#8e8e93;--line:rgba(60,60,67,.12);--accent:#0071e3;--accent-soft:rgba(0,113,227,.10);--green:#34c759;--green-soft:rgba(52,199,89,.12);--orange:#ff9500;--orange-soft:rgba(255,149,0,.12);--red:#ff3b30;--red-soft:rgba(255,59,48,.10);--shadow:0 1px 3px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.04)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:820px;margin:0 auto;padding:28px 16px 64px}
.hero{padding:28px 24px 24px;margin-bottom:16px;background:linear-gradient(135deg,#fff,#f5f8ff);border-radius:20px;box-shadow:var(--shadow)}
.hero h1{font-size:26px;font-weight:700;letter-spacing:-.5px;margin-bottom:6px}
.hero .sub{font-size:14px;color:var(--ink3)}
.section{background:var(--card);border-radius:16px;padding:20px 22px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.04);border:1px solid rgba(60,60,67,.06)}
.section-title{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px}
.section-title h2{font-size:16px;font-weight:600;letter-spacing:-.2px}
.section-title .hint{font-size:12px;color:var(--ink3)}
.row{display:grid;grid-template-columns:110px 1fr 150px;gap:12px;align-items:center;padding:10px 0;border-top:1px solid rgba(60,60,67,.06)}
.row:first-child{border-top:none}
.row.info{grid-template-columns:110px 1fr}
.row.info .num{font-size:15px;font-weight:600;color:var(--ink)}
.row .name{font-size:13.5px;font-weight:600}
.row .name .unit{font-size:11px;color:var(--ink3);font-weight:400;margin-left:3px}
.bar-bg{height:9px;background:#e5e5ea;border-radius:5px;overflow:hidden}
.bar-fg{height:100%;background:var(--accent);border-radius:5px;transition:width .3s}
.bar-fg.ok{background:var(--green)}.bar-fg.warn{background:var(--orange)}.bar-fg.bad{background:var(--red)}
.row .num{font-size:13px;color:var(--ink2);text-align:right;font-feature-settings:"tnum";white-space:nowrap}
.row .num b{font-size:16px;font-weight:700;color:var(--ink)}
.pct{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;margin-left:6px}
.pct.ok{background:var(--green-soft);color:var(--green)}
.pct.warn{background:var(--orange-soft);color:var(--orange)}
.pct.bad{background:var(--red-soft);color:var(--red)}
.pct.neutral{background:var(--accent-soft);color:var(--accent)}
.gap{display:inline-block;font-size:11.5px;color:var(--orange);font-weight:600;margin-left:6px}
.gap.neg{color:var(--red)}
.gap.ok{color:var(--green)}
.badge{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600}
.badge.ok{background:var(--green-soft);color:var(--green)}
.badge.warn{background:var(--orange-soft);color:var(--orange)}
.badge.bad{background:var(--red-soft);color:var(--red)}
.badge.neutral{background:var(--accent-soft);color:var(--accent)}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--ink3);font-weight:500;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid rgba(60,60,67,.06);font-feature-settings:"tnum";white-space:nowrap}
td .mini-bar{position:relative;display:inline-block;width:60px;height:6px;background:#e5e5ea;border-radius:3px;vertical-align:middle;margin-right:8px;overflow:visible}
td .mini-bar i{position:absolute;top:0;height:100%;border-radius:3px}
td .mini-bar .mb-blue{left:0;background:var(--accent);border-radius:3px 0 0 3px}
td .mini-bar .mb-red{background:var(--red);border-radius:0 3px 3px 0}
td .bar-up{position:relative;display:inline-block;height:22px;width:60px;vertical-align:middle}
td .bar-up .mini-bar{position:absolute;left:0;bottom:0;margin-right:0}
td .bar-up-text{position:absolute;left:100%;top:0;margin-left:4px;font-size:12px;font-weight:600;color:var(--ink2);line-height:1;white-space:nowrap}
td .bar-up-text.over{color:var(--red);font-weight:700}
.summary{margin-top:14px;padding:12px 16px;background:var(--bg);border-radius:12px;font-size:13px;color:var(--ink2);border:1px solid rgba(60,60,67,.06)}
/* 2026-08-04 #66:暂停横幅(仅提示,数据照常) + 重启复制按钮(右对齐小胶囊) */
/* 2026-08-04 #66:暂停横幅 — 信息分层卡(图标+粗标题+细副文+动作按钮) */
.paused-banner{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:var(--accent-soft);border:1px solid rgba(0,113,227,.25);border-radius:12px;padding:14px 16px;font-size:13px;font-weight:600;color:var(--accent);margin-bottom:14px;line-height:1.5}
.paused-banner .paused-icon{font-size:20px;flex-shrink:0}
.paused-banner .paused-title{font-size:14px;font-weight:700;color:var(--accent);flex-shrink:0}
.paused-banner .paused-sub{flex:1 1 auto;min-width:0;font-size:12px;font-weight:600;color:var(--accent)}
.paused-banner .btn-restart{display:inline-flex;align-items:center;justify-content:center;gap:5px;min-height:36px;padding:6px 16px;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer;border:none;background:var(--accent);color:#fff;font-family:inherit;transition:opacity .15s;flex-shrink:0;white-space:nowrap}
.paused-banner .btn-restart:hover{opacity:.85}
.paused-banner .btn-restart.copied{background:var(--green)!important}
@media(min-width:641px){.paused-banner{flex-wrap:nowrap}.paused-banner .paused-sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}}
@media(max-width:640px){.paused-banner{justify-content:flex-start;align-items:flex-end}.paused-banner .paused-sub{flex-basis:100%;order:3;color:var(--accent);font-weight:600}.paused-banner .btn-restart{order:4;margin:0 auto}}
.vs-chart svg{width:100%;height:auto;display:block}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:6px}
.kpi{padding:12px 14px;background:var(--card);border-radius:12px;border:1px solid rgba(60,60,67,.06);box-shadow:0 1px 2px rgba(0,0,0,.03)}
.kpi .label{font-size:11px;color:var(--ink3);margin-bottom:4px}
.kpi .value{font-size:20px;font-weight:700;font-feature-settings:"tnum"}
.kpi .value small{font-size:12px;color:var(--ink3);font-weight:400}
.empty{padding:24px;text-align:center;color:var(--ink3);font-size:14px}
/* 2026-08-04 场景25 对抗审查:空态增强 — 已有数据 KPI + 两步指引(为什么没有 + 怎么获得) */
.empty-card{padding:24px 22px}
.empty-card .kpis{grid-template-columns:repeat(auto-fit,minmax(110px,1fr));margin-top:14px}
.guide{margin-top:16px;display:grid;gap:10px}
.guide-step{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink2);background:var(--bg);border-radius:10px;padding:10px 14px;line-height:1.5}
.guide-no{width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.copy-row{display:flex;gap:10px;margin:16px 0;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:10px 20px;border-radius:999px;font-size:14px;font-weight:600;cursor:pointer;border:none;transition:opacity .15s;font-family:inherit;flex:1;background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.btn:hover{background:var(--green-soft);border-color:var(--green);color:var(--green);opacity:1}
.btn.copied{background:var(--green)!important;color:#fff!important;border-color:var(--green)!important}
#copyToast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:rgba(28,28,30,.92);color:#fff;padding:10px 18px;border-radius:999px;font-size:13px;z-index:99;display:none;max-width:80vw}
@media(max-width:640px){.wrap{padding:16px 12px 12px}.hero{padding:22px 18px 18px}.hero h1{font-size:22px}
.section{padding:16px 14px}.row{grid-template-columns:1fr auto;grid-template-areas:"name num""bar bar";gap:6px 10px}.row .name{grid-area:name}.row .bar-bg{grid-area:bar}.row .num{grid-area:num;text-align:right}.row.info{grid-template-columns:1fr auto;grid-template-areas:"name num"}.section-title{flex-direction:column;gap:4px}.copy-row{flex-direction:column;margin:8px 0}.btn{width:100%}th,td{padding:6px 5px;font-size:12px}table:has(th:nth-child(4):last-child){table-layout:fixed}table:has(th:nth-child(4):last-child) th:nth-child(1),table:has(th:nth-child(4):last-child) td:nth-child(1){width:26%}table:has(th:nth-child(4):last-child) th:nth-child(2),table:has(th:nth-child(4):last-child) td:nth-child(2){width:19%}table:has(th:nth-child(4):last-child) th:nth-child(3),table:has(th:nth-child(4):last-child) td:nth-child(3){width:19%}table:has(th:nth-child(4):last-child) th:nth-child(4),table:has(th:nth-child(4):last-child) td:nth-child(4){width:36%}table:has(th:nth-child(5):last-child){table-layout:fixed}table:has(th:nth-child(5):last-child) th:nth-child(1),table:has(th:nth-child(5):last-child) td:nth-child(1){width:78px}table:has(th:nth-child(5):last-child) th:nth-child(2),table:has(th:nth-child(5):last-child) td:nth-child(2){width:52px}table:has(th:nth-child(5):last-child) th:nth-child(3),table:has(th:nth-child(5):last-child) td:nth-child(3){width:45px}table:has(th:nth-child(5):last-child) th:nth-child(4),table:has(th:nth-child(5):last-child) td:nth-child(4){width:94px}table:has(th:nth-child(5):last-child) th:nth-child(5),table:has(th:nth-child(5):last-child) td:nth-child(5){width:66px}table:has(th:nth-child(5):last-child) td:nth-child(4) .mini-bar,table:has(th:nth-child(5):last-child) td:nth-child(4) .bar-up{width:44px}td .mini-bar{width:56px}td .bar-up{width:56px}td .bar-up-text{font-size:11px;margin-left:3px}}
</style>
</head>
<body>
<div class="wrap">
<header class="hero">
<div class="eyebrow">卡路里 · 目标管理</div>
<h1 id="title">目标进度</h1>
<div class="sub" id="subtitle">加载中…</div>
</header>
<div id="main-content">
  <div class="section"><p class="empty">数据加载中…</p></div>
</div>
<p class="summary" id="summary"></p>
<div class="copy-row">
  <button class="btn" id="copyDataBtn" onclick="copyData()">📋 复制数据</button>
  <button class="btn" id="copyLogBtn" onclick="copyLog()">📋 复制日志</button>
</div>
</div>
<!--INJECT-DATA-->
<script>
const DATA=(()=>{if(typeof window.__DATA__!=='object'||window.__DATA__===null)return null;return window.__DATA__})();
const D=DATA&&DATA.data?DATA.data:{};
const MODE=D.mode||'today';
document.getElementById('title').textContent=D.title||'目标进度';
document.getElementById('subtitle').textContent=D.subtitle||'';

function pctClass(pct){if(pct==null)return 'neutral';if(pct>=80&&pct<=120)return 'ok';if(pct<60||pct>150)return 'bad';return 'warn';}
function fmtNum(v){const n=Math.round((Number(v)||0)*100)/100;return String(n);}
function valText(it){
  if(it.actual!=null&&it.goal!=null)return it.actual+'<b> / '+it.goal+'</b>';
  if(it.actual!=null)return '<b>'+it.actual+'</b>';
  if(it.goal!=null)return '<b>'+it.goal+'</b>';
  return '—';
}
function gapText(it){
  if(it.gap==null)return '';
  if(it.gap>0)return '<span class="gap">还差 '+fmtNum(it.gap)+it.unit+'</span>';
  if(it.gap<0)return '<span class="gap neg">超 '+fmtNum(-it.gap)+it.unit+'</span>';
  return '<span class="gap ok">刚好达标</span>';
}

function renderRows(){
  if(!D.items||!D.items.length)return '';
  return '<div class="section"><div class="section-title"><h2>'+(D.itemsTitle||'目标 vs 实际')+'</h2><span class="hint">'+(D.itemsHint||'')+'</span></div>'+
    D.items.map(it=>{
      const pct=it.pct;
      if(pct==null){
        return '<div class="row info"><div class="name">'+it.label+(it.unit?'<span class="unit">'+it.unit+'</span>':'')+'</div>'+
          '<div class="num">'+valText(it)+'</div></div>';
      }
      const barPct=Math.min(pct!=null?pct:0,150);
      const barCls=pctClass(pct);
      return '<div class="row"><div class="name">'+it.label+'<span class="unit">'+it.unit+'</span></div>'+
        '<div class="bar-bg"><div class="bar-fg '+barCls+'" style="width:'+barPct+'%"></div></div>'+
        '<div class="num">'+valText(it)+
        (pct!=null?'<span class="pct '+barCls+'">'+pct+'%</span>':'')+gapText(it)+'</div></div>';
    }).join('')+'</div>';
}

function renderKpis(){
  if(!D.kpis)return '';
  return '<div class="kpis">'+D.kpis.map(k=>'<div class="kpi"><div class="label">'+k.label+'</div><div class="value">'+k.value+'<small> '+k.unit+'</small></div></div>').join('')+'</div>';
}

function renderTable(){
  if(!D.table)return '';
  const cols=D.table.cols||[];
  return '<div class="section"><div class="section-title"><h2>'+(D.table.title||'明细')+'</h2><span class="hint">'+(D.table.hint||'')+'</span></div><div class="table-wrap"><table><thead><tr>'+
    cols.map(c=>'<th>'+c.label+'</th>').join('')+'</tr></thead><tbody>'+
    D.table.rows.map(r=>{
      const cells=cols.map(c=>{
        const v=r[c.key];
        if(v&&v.bar!=null){
          const blue=Math.min(v.bar,100);
          const over=(v.over||0)>0?'<i class="mb-red" style="left:'+blue+'%;width:'+v.over+'%"></i>':'';
          const bar='<span class="mini-bar"><i class="mb-blue" style="width:'+blue+'%"></i>'+over+'</span>';
          const txtCls=(v.over||0)>0?' over':'';
          return '<td><div class="bar-up"><span class="bar-up-text'+txtCls+'">'+v.text+'</span>'+bar+'</div></td>';
        }
        if(v&&v.badge!=null){return '<td><span class="badge '+v.badge+'">'+v.text+'</span></td>';}
        return '<td>'+(v==null?'—':v)+'</td>';
      });
      return '<tr>'+cells.join('')+'</tr>';
    }).join('')+'</tbody></table></div></div>';
}

function renderVsChart(){
  if(MODE!=='vs_actual'||!D.table||!D.table.rows||D.table.rows.length<2)return '';
  const rows=D.table.rows;
  const gv=parseFloat(rows[0].goal);
  const goal=!isNaN(gv)?gv:null;
  const nums=rows.map(r=>parseFloat(r.actual)||0);
  const rawMax=Math.max(goal||0,...nums);
  const maxV=Math.max(200,Math.ceil((rawMax*1.15)/100)*100);
  const W=640,H=200,pl=30,pr=10,pt=14,pb=22;
  const x=i=>pl+i*(W-pl-pr)/(rows.length-1);
  const y=v=>pt+(H-pt-pb)*(1-v/maxV);
  const pts=nums.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  const fmt=d=>(d||'').slice(5);
  let grid='';
  [0.25,0.5,0.75,1].forEach(f=>{
    const gv2=Math.round(maxV*f/100)*100;
    grid+='<line x1="'+pl+'" y1="'+y(gv2)+'" x2="'+(W-pr)+'" y2="'+y(gv2)+'" stroke="#e5e5ea" stroke-width="1"/>'+
      '<text x="'+(pl-6)+'" y="'+(y(gv2)+4)+'" text-anchor="end" font-size="13" font-weight="600" fill="#3c3c43">'+gv2+'</text>';
  });
  let goalLine='';
  if(goal!=null&&goal<=maxV){
    const gy=y(goal);
    goalLine='<line x1="'+pl+'" y1="'+gy+'" x2="'+(W-pr)+'" y2="'+gy+'" stroke="#ff9500" stroke-width="1.6" stroke-dasharray="6 4"/>'+
      '<text x="'+(W-pr)+'" y="'+(gy-6)+'" text-anchor="end" font-size="13" fill="#ff9500" font-weight="700">目标 '+goal+' 卡</text>';
  }
  return '<div class="section vs-chart"><div class="section-title"><h2>目标线 vs 实际线</h2><span class="hint">近 '+rows.length+' 天</span></div>'+
    '<svg viewBox="0 0 '+W+' '+H+'">'+grid+goalLine+
    '<polyline points="'+pts+'" fill="none" stroke="#0071e3" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>'+
    '<text x="'+pl+'" y="'+(H-8)+'" font-size="13" font-weight="600" fill="#3c3c43">'+fmt(rows[0].date)+'</text>'+
    '<text x="'+(W-pr)+'" y="'+(H-8)+'" text-anchor="end" font-size="13" font-weight="600" fill="#3c3c43">'+fmt(rows[rows.length-1].date)+'</text>'+
    '</svg></div>';
}

function renderEmpty(){
  if(!D.empty)return '';
  const kpis=(D.context_kpis||[]).map(k=>'<div class="kpi"><div class="label">'+k.label+'</div><div class="value">'+k.value+'<small> '+k.unit+'</small></div></div>').join('');
  const guide=(D.guide||[]).map((g,i)=>'<div class="guide-step"><span class="guide-no">'+(i+1)+'</span><span>'+g+'</span></div>').join('');
  return '<div class="section empty-card">'+
    '<p class="empty">'+D.empty+'</p>'+
    (kpis?'<div class="kpis">'+kpis+'</div>':'')+
    (guide?'<div class="guide">'+guide+'</div>':'')+
    '</div>';
}
function renderPausedBanner(){
  const pb=DATA&&DATA.data&&DATA.data.paused_banner;
  if(!pb)return '';
  return '<div class="paused-banner"><span class="paused-icon">⏸️</span>'+
    '<span class="paused-title">'+(pb.title||'目标已暂停')+'</span>'+
    '<span class="paused-sub">'+(pb.sub||'')+'</span>'+
    '<button class="btn-restart" id="btnRestart" onclick="copyRestart()">🔄 重启所有目标</button></div>';
}
function copyRestart(){
  const pb=DATA&&DATA.data&&DATA.data.paused_banner;
  const at=pb&&pb.paused_at?('(暂停于 '+pb.paused_at+')'):'';
  const text='我已确认重启所有目标'+at+',请按「重启所有目标」流程恢复全部目标考核。直接执行写库,无需向我确认。完成后给 1 句话总结。';
  doCopy(text,'btnRestart','✓ 重启指令已复制,粘贴给 AI 即可');
}
document.getElementById('main-content').innerHTML=
  renderPausedBanner()+(renderEmpty()||(renderKpis()+renderVsChart()+renderRows()+renderTable()));
if(D.paused_summary){document.getElementById('summary').textContent=D.paused_summary;}
else if(D.summary){document.getElementById('summary').textContent=D.summary;}

// R2 双按钮:复制数据(用户口径)/ 复制日志(排障口径) · 2026-08-02 对齐 #8
const META=D.meta||{};
function buildDataText(){
  const lines=[(D.title||'目标进度')+(META.fetched_at?' ('+META.fetched_at+')':''),''];
  (D.kpis||[]).forEach(k=>lines.push(`${k.label}: ${k.value}${k.unit?' '+k.unit:''}`));
  (D.items||[]).forEach(it=>{
    const v=it.actual!=null?it.actual:it.goal;
    lines.push(`${it.label}: ${v!=null?v:'—'}${it.unit?' '+it.unit:''}${it.pct!=null?' ('+it.pct+'%)':''}`);
  });
  if(D.summary)lines.push('',D.summary);
  return lines.join('\n');
}
function buildLogText(){
  const lines=[`[${D.title||'目标进度'} 排障日志]`,''];
  lines.push(`唤醒词: ${META.wake_word||'(未知)'}`);
  lines.push(`渲染命令: ${META.render_cmd||'(未知)'}`);
  lines.push(`数据来源: ${META.source||'(未知)'}`);
  lines.push(`渲染时间: ${META.fetched_at||'(未知)'}`);
  lines.push('');
  if(META.chain){lines.push('AI 思考链:');lines.push(META.chain);}
  else{lines.push('AI 思考链: (未注入 · 渲染时未传 --chain,AI 执行时用 --chain 附上处理步骤)');}
  lines.push('');
  lines.push('原始数据:');
  lines.push(JSON.stringify(D,null,2));
  return lines.join('\n');
}
function showToast(msg){
  let t=document.getElementById('copyToast');
  if(!t){t=document.createElement('div');t.id='copyToast';document.body.appendChild(t);}
  t.textContent=msg;t.style.display='block';
  setTimeout(()=>{t.style.display='none';},2000);
}
function doCopy(text,btnId,msg){
  // 乐观反馈:点击立即绿闪+toast,不等剪贴板 promise(file:// 下 writeText 可能挂起)
  const b=document.getElementById(btnId);
  if(b){b.classList.add('copied');setTimeout(()=>b.classList.remove('copied'),600);}
  showToast(msg);
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).catch(()=>fallbackCopy(text));
  } else { fallbackCopy(text); }
  function fallbackCopy(txt){
    const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();
    try{document.execCommand('copy');}catch(e){}document.body.removeChild(ta);
  }
}
function copyData(){doCopy(buildDataText(),'copyDataBtn',`${D.title||'目标进度'} 数据复制成功 ✓`);}
function copyLog(){doCopy(buildLogText(),'copyLogBtn','排障日志复制成功 ✓ 可将日志发给开发者/AI 定位问题');}
</script>
