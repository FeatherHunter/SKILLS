<!DOCTYPE html>
<html lang="zh-CN">
<head>
<style><!--SHARED-CSS--></style>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>目标推荐 · 卡路里</title>
<style>
:root{--bg:#f5f5f7;--card:#fff;--ink:#1d1d1f;--ink2:#3c3c43;--ink3:#8e8e93;--line:rgba(60,60,67,.12);--accent:#0071e3;--accent-soft:rgba(0,113,227,.10);--green:#34c759;--green-soft:rgba(52,199,89,.12);--orange:#ff9500;--orange-soft:rgba(255,149,0,.12);--shadow:0 1px 3px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.04)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:820px;margin:0 auto;padding:28px 16px 64px}
.hero{padding:28px 24px 24px;margin-bottom:16px;background:linear-gradient(135deg,#fff,#f5f8ff);border-radius:20px;box-shadow:var(--shadow)}
.hero h1{font-size:26px;font-weight:700;letter-spacing:-.5px;margin-bottom:6px}
.hero .sub{font-size:14px;color:var(--ink3)}
.section{background:var(--card);border-radius:16px;padding:20px 22px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.04);border:1px solid rgba(60,60,67,.06)}
.section-title{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px}
.section-title h2{font-size:16px;font-weight:600;letter-spacing:-.2px}
.section-title .hint{font-size:12px;color:var(--ink3)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:6px}
.kpi{padding:12px 14px;background:var(--card);border-radius:12px;border:1px solid rgba(60,60,67,.06);box-shadow:0 1px 2px rgba(0,0,0,.03)}
.kpi .label{font-size:11px;color:var(--ink3);margin-bottom:4px}
.kpi .value{font-size:20px;font-weight:700;font-feature-settings:"tnum"}
.kpi .value small{font-size:12px;color:var(--ink3);font-weight:400}
.row{display:grid;grid-template-columns:110px 1fr;gap:12px;align-items:center;padding:10px 0;border-top:1px solid rgba(60,60,67,.06)}
.row:first-child{border-top:none}
.row .name{font-size:13.5px;font-weight:600}
.row .name .unit{font-size:11px;color:var(--ink3);font-weight:400;margin-left:3px}
.row .num{font-size:13px;color:var(--ink2);text-align:right;font-feature-settings:"tnum"}
.row .num b{font-size:16px;font-weight:700;color:var(--ink)}
.reasons{margin-top:4px}
.reason{display:flex;gap:8px;padding:8px 0;border-top:1px solid rgba(60,60,67,.06);font-size:13px;color:var(--ink2)}
.reason:first-child{border-top:none}
.reason .dot{color:var(--accent);flex-shrink:0}
.missing{background:var(--orange-soft);border-radius:10px;padding:10px 14px;font-size:12.5px;color:var(--orange);margin-top:12px}
.copy-section{background:linear-gradient(135deg,var(--card),#f8fbff);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.04);border:1px solid rgba(60,60,67,.06)}
.copy-section h2{font-size:17px;font-weight:600;letter-spacing:-.3px;margin-bottom:6px}
.copy-section .sub{font-size:13px;color:var(--ink2);margin-bottom:14px;line-height:1.6}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:11px 20px;border-radius:999px;font-size:14px;font-weight:600;cursor:pointer;border:none;transition:opacity .15s;font-family:inherit}
.btn:hover{opacity:.85}
.btn.primary{background:var(--ink);color:#fff}
.btn.secondary{background:var(--bg-soft,#f5f5f7);color:var(--ink);border:1px solid var(--line)}
.btn.copied{background:var(--green)!important;color:#fff!important}
.copy-preview{background:var(--bg-soft,#f5f5f7);border-radius:12px;padding:14px 16px;font-family:"SF Mono",monospace;font-size:12px;line-height:1.65;color:var(--ink2);white-space:pre-wrap;word-break:break-word;max-height:360px;overflow-y:auto;border:1px solid rgba(60,60,67,.06)}
footer{text-align:center;color:var(--ink3);font-size:12px;padding-top:16px;border-top:1px solid rgba(60,60,67,.08);margin-top:28px}
@media(max-width:640px){.wrap{padding:16px 12px 48px}.hero{padding:22px 18px 18px}.hero h1{font-size:22px}.section,.copy-section{padding:16px 14px}.row{grid-template-columns:1fr;gap:6px}.row .num{text-align:left}.section-title{flex-direction:column;gap:4px}}
</style>
</head>
<body>
<div class="wrap">
<header class="hero">
<div class="eyebrow">卡路里 · 目标管理</div>
<h1 id="title">目标推荐</h1>
<div class="sub" id="subtitle">加载中…</div>
</header>
<div class="section">
<div class="section-title"><h2>推荐方案</h2><span class="hint" id="profileHint"></span></div>
<div class="kpis" id="kpis"></div>
<div id="rows"></div>
<div id="missing"></div>
</div>
<div class="section" id="reasonsSection" style="display:none">
<div class="section-title"><h2>推荐依据</h2><span class="hint">为什么这么推荐</span></div>
<div class="reasons" id="reasons"></div>
</div>
<section class="copy-section">
<h2>采纳推荐</h2>
<p class="sub">确认无误后,复制下方指令发给 AI,AI 会调用写库。</p>
<div class="btn-row">
<button class="btn primary" id="btnAdopt" onclick="copyAdopt()">✓ 采纳全部推荐</button>


</div>
<div class="copy-preview" id="copyPreview">预览将复制给 AI 的内容</div>
</section>
<footer>卡路里 Skill · 目标推荐 · 2026-08-02</footer>
</div>
<script id="payload" type="application/json"><!--INJECT-DATA--></script><script><!--SHARED-HELPERS--></script><script>window.__P__=(function(){try{return JSON.parse(document.getElementById('payload').textContent||'{}');}catch(e){return null;}})();</script>
<script>
const DATA=(()=>{if(typeof window.__P__!=='object'||window.__P__===null)return null;return window.__P__})();
const D=DATA&&DATA.data?DATA.data:{};
const R=D.recommend||{};
const GOAL=D.current_goal||{};
document.getElementById('title').textContent=D.title||'目标推荐';
document.getElementById('subtitle').textContent=D.subtitle||'';
document.getElementById('profileHint').textContent=R.profile_label?('方案: '+R.profile_label+(R.weekly_rate_kg!=null?' · 每周 '+R.weekly_rate_kg+' kg':'')):'';

function renderKpis(){
  const kpis=[];
  if(R.tdee!=null)kpis.push({label:'TDEE',value:R.tdee,unit:'卡'});
  if(R.bmr!=null)kpis.push({label:'BMR',value:R.bmr,unit:'卡'});
  if(R.weekly_rate_kg!=null)kpis.push({label:'每周速率',value:R.weekly_rate_kg,unit:'kg'});
  if(D.old_water_goal!=null&&GOAL.water_goal!=null)kpis.push({label:'饮水 旧→新',value:GOAL.water_goal,unit:'ml'});
  document.getElementById('kpis').innerHTML=kpis.map(k=>
    '<div class="kpi"><div class="label">'+k.label+'</div><div class="value">'+k.value+'<small> '+k.unit+'</small></div></div>').join('');
}
function renderRows(){
  const FIELDS=[
    {key:'calorie_goal',label:'热量',unit:'卡'},{key:'protein_goal',label:'蛋白',unit:'g'},
    {key:'carbs_goal',label:'碳水',unit:'g'},{key:'fat_goal',label:'脂肪',unit:'g'},
    {key:'water_goal',label:'饮水',unit:'ml'}
  ];
  const rows=FIELDS.map(f=>{
    const v=GOAL[f.key];
    if(v==null)return '';
    const oldV=(D.old_goal&&D.old_goal[f.key]!=null)?D.old_goal[f.key]:null;
    return '<div class="row"><div class="name">'+f.label+'<span class="unit">'+f.unit+'</span></div>'+
      '<div class="num">'+(oldV!=null?'<span style="color:var(--ink3);font-weight:400">'+oldV+' → </span>':'')+'<b>'+v+'</b> '+f.unit+'</div></div>';
  }).join('');
  document.getElementById('rows').innerHTML=rows;
}
function renderReasons(){
  if(!R.plan_reasons||!R.plan_reasons.length)return;
  document.getElementById('reasonsSection').style.display='block';
  document.getElementById('reasons').innerHTML=R.plan_reasons.map(r=>
    '<div class="reason"><span class="dot">●</span><span>'+r+'</span></div>').join('');
}
function renderMissing(){
  if(!R.missing||!R.missing.length)return;
  document.getElementById('missing').innerHTML='⚠️ 档案缺: '+R.missing.join(' / ')+' — 已用默认值估算,建议先设置档案';
}
function buildAdoptPrompt(){
  const wake=META.wake_word||'定营养目标(自动算)';
  let p='我已确认推荐目标,请按「'+wake+'」流程写入数据库。\n\n';
  const hasMacro=GOAL.calorie_goal!=null||GOAL.protein_goal!=null||GOAL.carbs_goal!=null||GOAL.fat_goal!=null;
  const rows=[];
  if(GOAL.calorie_goal!=null)rows.push('  热量 '+GOAL.calorie_goal+' 卡');
  if(GOAL.protein_goal!=null)rows.push('  蛋白 '+GOAL.protein_goal+' g');
  if(GOAL.carbs_goal!=null)rows.push('  碳水 '+GOAL.carbs_goal+' g');
  if(GOAL.fat_goal!=null)rows.push('  脂肪 '+GOAL.fat_goal+' g');
  if(GOAL.water_goal!=null)rows.push('  饮水 '+GOAL.water_goal+' ml');
  p+=(hasMacro?'营养目标':'饮水目标')+':\n'+rows.join('\n')+'\n\n';
  if(R.plan_reasons)p+='推荐理由:\n'+R.plan_reasons.map(x=>'  - '+x).join('\n')+'\n\n';
  return p;
}
function copyAdopt(){window.copyText(buildAdoptPrompt(),'btnAdopt','采纳指令已复制,粘贴给 AI 即可写入 ✓');}
renderKpis();
renderRows();
renderReasons();
renderMissing();
// R2 双按钮:复制数据(用户口径)/ 复制日志(排障口径) · 2026-08-02 对齐 #8
const META=D.meta||{};
document.getElementById('copyPreview').textContent=buildAdoptPrompt();







</script>
<div id="actionbar-zone"></div>

<script>(function(){var z=document.getElementById('actionbar-zone');if(z&&window.actionBar&&window.__P__){z.innerHTML=window.actionBar(window.__P__);}})();</script>
</body>
</html>
