<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>目标状态 · 卡路里</title>
<style>
:root{--bg:#f5f5f7;--card:#fff;--ink:#1d1d1f;--ink2:#3c3c43;--ink3:#8e8e93;--line:rgba(60,60,67,.12);--accent:#0071e3;--accent-soft:rgba(0,113,227,.10);--green:#34c759;--green-soft:rgba(52,199,89,.12);--orange:#ff9500;--orange-soft:rgba(255,149,0,.12);--shadow:0 1px 3px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.04)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:720px;margin:0 auto;padding:28px 16px 64px}
.hero{padding:28px 24px 24px;margin-bottom:16px;background:linear-gradient(135deg,#fff,#f5f8ff);border-radius:20px;box-shadow:var(--shadow)}
.hero h1{font-size:26px;font-weight:700;letter-spacing:-.5px;margin-bottom:6px}
.hero .sub{font-size:14px;color:var(--ink3)}
.section{background:var(--card);border-radius:16px;padding:20px 22px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.04);border:1px solid rgba(60,60,67,.06)}
.status-badge{display:inline-flex;align-items:center;gap:8px;padding:12px 20px;border-radius:999px;font-size:16px;font-weight:700}
.status-badge.paused{background:var(--orange-soft);color:var(--orange)}
.status-badge.resumed{background:var(--green-soft);color:var(--green)}
.note{margin-top:14px;padding:12px 16px;background:var(--bg);border-radius:12px;font-size:13.5px;color:var(--ink2);line-height:1.6;border:1px solid rgba(60,60,67,.06)}
.restore{margin-top:12px;padding:12px 16px;background:var(--accent-soft);border-radius:12px;font-size:13.5px;color:var(--accent)}
.receipt{margin-top:14px;padding:12px 16px;background:var(--bg);border-radius:12px;font-size:12.5px;color:var(--ink3);font-family:"SF Mono",monospace;border:1px solid rgba(60,60,67,.06)}
.copy-row{display:flex;gap:10px;margin:16px 0;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:10px 20px;border-radius:999px;font-size:14px;font-weight:600;cursor:pointer;border:none;transition:opacity .15s;font-family:inherit;flex:1;background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.btn:hover{opacity:.85}
.btn.copied{background:var(--green)!important;color:#fff!important;border-color:var(--green)!important}
#copyToast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:rgba(28,28,30,.92);color:#fff;padding:10px 18px;border-radius:999px;font-size:13px;z-index:99;display:none;max-width:80vw}
footer{text-align:center;color:var(--ink3);font-size:12px;padding-top:16px;border-top:1px solid rgba(60,60,67,.08);margin-top:28px}
@media(max-width:640px){.wrap{padding:16px 12px 48px}.hero{padding:22px 18px 18px}.hero h1{font-size:22px}.section{padding:16px 14px}.copy-row{flex-direction:column}.btn{width:100%}}
</style>
</head>
<body>
<div class="wrap">
<header class="hero">
<div class="eyebrow">卡路里 · 目标管理</div>
<h1 id="title">目标状态</h1>
<div class="sub" id="subtitle">加载中…</div>
</header>
<div class="section">
<div class="section-title"><h2>状态</h2><span class="hint" id="timeHint"></span></div>
<div id="badge"></div>
<div class="note" id="note" style="display:none"></div>
<div class="restore" id="restore" style="display:none"></div>
<div class="receipt" id="receipt" style="display:none"></div>
<div class="copy-row">
  <button class="btn" id="copyDataBtn" onclick="copyData()">📋 复制数据</button>
  <button class="btn" id="copyLogBtn" onclick="copyLog()">📋 复制日志</button>
</div>
</div>
<footer>卡路里 Skill · 目标状态 · 2026-08-02</footer>
</div>
<!--INJECT-DATA-->
<script>
const DATA=(()=>{if(typeof window.__DATA__!=='object'||window.__DATA__===null)return null;return window.__DATA__})();
const D=DATA&&DATA.data?DATA.data:{};
document.getElementById('title').textContent=D.title||'目标状态';
document.getElementById('subtitle').textContent=D.subtitle||'';
if(D.timeHint)document.getElementById('timeHint').textContent=D.timeHint;
const badge=document.getElementById('badge');
if(D.paused){
  badge.innerHTML='<span class="status-badge paused">⏸ 全部目标已暂停</span>';
  if(D.note){const n=document.getElementById('note');n.style.display='block';n.textContent=D.note;}
  if(D.restoreHint){const r=document.getElementById('restore');r.style.display='block';r.textContent='🔁 '+D.restoreHint;}
}else{
  badge.innerHTML='<span class="status-badge resumed">▶ 全部目标运行中</span>';
}
if(D.receipt){const r=document.getElementById('receipt');r.style.display='block';r.textContent=D.receipt;}

// R2 双按钮:复制数据(用户口径)/ 复制日志(排障口径) · 2026-08-02 对齐 #8
const META=D.meta||{};
function buildDataText(){
  const lines=[(D.title||'目标状态')+(META.fetched_at?' ('+META.fetched_at+')':''),''];
  lines.push(D.paused?'状态: 全部目标已暂停':'状态: 全部目标运行中');
  if(D.note)lines.push(D.note);
  if(D.restoreHint)lines.push(D.restoreHint);
  if(D.receipt)lines.push('',D.receipt);
  return lines.join('\n');
}
function buildLogText(){
  const lines=[`[${D.title||'目标状态'} 排障日志]`,''];
  lines.push(`唤醒词: ${META.wake_word||'(未知)'}`);
  lines.push(`渲染命令: ${META.render_cmd||'(未知)'}`);
  lines.push(`数据来源: ${META.source||'(未知)'}`);
  lines.push(`渲染时间: ${META.fetched_at||'(未知)'}`);
  lines.push('');
  if(META.chain){lines.push('AI 思考链:');lines.push(META.chain);}
  else{lines.push('AI 思考链: (未注入 · 渲染时未传 --chain,AI 执行时用 --chain 附上处理步骤)');}
  lines.push('');
  lines.push('原始数据:');
  lines.push(JSON.stringify(D,null,2));
  return lines.join('\n');
}
function showToast(msg){var t=document.createElement('div');t.style.cssText='position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0));transform:translateX(-50%) scale(.9);opacity:0;background:rgba(28,28,30,.94);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);color:#f0f0f0;border-radius:14px;padding:13px 14px 13px 16px;display:flex;align-items:flex-start;gap:12px;max-width:min(480px,calc(100vw - 24px));min-width:300px;box-shadow:0 10px 32px rgba(0,0,0,.32),0 0 0 .5px rgba(255,255,255,.08) inset;z-index:9999;transition:opacity .22s ease-out,transform .22s cubic-bezier(.34,1.56,.64,1)';t.innerHTML='<div style="font-size:20px;line-height:1;padding-top:1px;flex-shrink:0">📋</div><div style="flex:1;min-width:0"><div style="font-weight:600;font-size:12.5px;line-height:1.4;color:#fff;margin-bottom:2px">已复制 <em style="font-style:normal;color:#34c759;font-weight:600">'+msg+'</em></div><div style="font-size:11px;line-height:1.5;color:#c8c8cc">粘贴给 AI,卡路里技能会自动执行这个流程,完成后你会拿到结果 HTML + 一句话总结。</div></div><button style="background:rgba(255,255,255,.10);color:#34c759;border:0;border-radius:8px;padding:5px 9px;font-size:10.5px;font-weight:500;cursor:pointer;white-space:nowrap;margin-left:6px;flex-shrink:0">✓ 知道了</button>';document.body.appendChild(t);requestAnimationFrame(function(){t.style.opacity='1';t.style.transform='translateX(-50%) scale(1)';});var close=function(){t.style.opacity='0';t.style.transform='translateX(-50%) scale(.9)';setTimeout(function(){t.remove();},220);};t.querySelector('button').addEventListener('click',close);setTimeout(close,4500);}
function doCopy(text,btnId,msg){
  const done=()=>{const b=document.getElementById(btnId);if(b){b.classList.add('copied');setTimeout(()=>b.classList.remove('copied'),2200);}showToast(msg);};
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(()=>fallbackCopy(text,done));
  } else { fallbackCopy(text,done); }
  function fallbackCopy(txt,ok){
    const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();
    try{document.execCommand('copy');ok();}catch(e){}document.body.removeChild(ta);
  }
}
function copyData(){doCopy(buildDataText(),'copyDataBtn',`${D.title||'目标状态'} 数据复制成功 ✓`);}
function copyLog(){doCopy(buildLogText(),'copyLogBtn','排障日志复制成功 ✓ 可将日志发给开发者/AI 定位问题');}
</script>
</body>
</html>
