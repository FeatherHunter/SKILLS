<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>体重目标 · 卡路里</title>
<style>
:root{--bg:#f5f5f7;--card:#fff;--ink:#1d1d1f;--ink2:#3c3c43;--ink3:#8e8e93;--line:rgba(60,60,67,.12);--accent:#0071e3;--accent-soft:rgba(0,113,227,.10);--green:#34c759;--green-soft:rgba(52,199,89,.12);--orange:#ff9500;--orange-soft:rgba(255,149,0,.12);--red:#ff3b30;--red-soft:rgba(255,59,48,.10);--shadow:0 1px 3px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.04)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:820px;margin:0 auto;padding:28px 16px 64px}
.hero{padding:28px 24px 24px;margin-bottom:16px;background:linear-gradient(135deg,#fff,#f5f8ff);border-radius:20px;box-shadow:var(--shadow)}
.hero h1{font-size:26px;font-weight:700;letter-spacing:-.5px;margin-bottom:6px}
.hero .sub{font-size:14px;color:var(--ink3)}
.section{background:var(--card);border-radius:16px;padding:20px 22px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.04);border:1px solid rgba(60,60,67,.06)}
.section-title{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px}
.section-title h2{font-size:16px;font-weight:600;letter-spacing:-.2px}
.section-title .hint{font-size:12px;color:var(--ink3)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:6px}
.kpi{padding:12px 14px;background:var(--card);border-radius:12px;border:1px solid rgba(60,60,67,.06);box-shadow:0 1px 2px rgba(0,0,0,.03)}
.kpi .label{font-size:11px;color:var(--ink3);margin-bottom:4px}
.kpi .value{font-size:20px;font-weight:700;font-feature-settings:"tnum"}
.kpi .value small{font-size:12px;color:var(--ink3);font-weight:400}
.field-row{display:grid;grid-template-columns:140px 1fr;gap:12px;align-items:center;padding:12px 0;border-top:1px solid rgba(60,60,67,.06)}
.field-row:first-child{border-top:none}
.field-row .name{font-size:14px;font-weight:600}
.field-row .name .unit{font-size:12px;color:var(--ink3);font-weight:400;margin-left:4px}
.field-row input{width:100%;padding:10px 14px;border-radius:10px;border:1px solid var(--line);font-size:16px;font-family:inherit;background:var(--bg);color:var(--ink);font-feature-settings:"tnum"}
.field-row input:focus{outline:none;border-color:var(--accent)}
.check{background:var(--green-soft);border-radius:10px;padding:10px 14px;font-size:13px;color:var(--green);margin-top:8px}
.warn{background:var(--red-soft);border-radius:10px;padding:10px 14px;font-size:13px;color:var(--red);margin-top:8px}
.info{background:var(--accent-soft);border-radius:10px;padding:10px 14px;font-size:13px;color:var(--accent);margin-top:8px}
.copy-section{background:linear-gradient(135deg,var(--card),#f8fbff);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.04);border:1px solid rgba(60,60,67,.06)}
.copy-section h2{font-size:17px;font-weight:600;letter-spacing:-.3px;margin-bottom:6px}
.copy-section .sub{font-size:13px;color:var(--ink2);margin-bottom:14px;line-height:1.6}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:11px 20px;border-radius:999px;font-size:14px;font-weight:600;cursor:pointer;border:none;transition:opacity .15s;font-family:inherit}
.btn:hover{opacity:.85}
.btn.primary{background:var(--ink);color:#fff}
.btn.copied{background:var(--green)!important;color:#fff!important}
.copy-preview{background:var(--bg);border-radius:12px;padding:14px 16px;font-family:"SF Mono",monospace;font-size:12px;line-height:1.65;color:var(--ink2);white-space:pre-wrap;word-break:break-word;max-height:360px;overflow-y:auto;border:1px solid rgba(60,60,67,.06)}
footer{text-align:center;color:var(--ink3);font-size:12px;padding-top:16px;border-top:1px solid rgba(60,60,67,.08);margin-top:28px}
@media(max-width:640px){.wrap{padding:16px 12px 48px}.hero{padding:22px 18px 18px}.hero h1{font-size:22px}.section,.copy-section{padding:16px 14px}.field-row{grid-template-columns:1fr;gap:6px}.section-title{flex-direction:column;gap:4px}}
</style>
</head>
<body>
<div class="wrap">
<header class="hero">
<div class="eyebrow">卡路里 · 目标管理</div>
<h1 id="title">体重目标</h1>
<div class="sub" id="subtitle">加载中…</div>
</header>
<div class="section">
<div class="section-title"><h2>当前状态</h2><span class="hint">体重目标进度</span></div>
<div class="kpis" id="kpis"></div>
</div>
<div class="section">
<div class="section-title"><h2 id="fieldTitle">设置目标</h2><span class="hint">填写你的目标</span></div>
<div id="fields"></div>
<div id="resultBox"></div>
</div>
<section class="copy-section">
<h2>确认目标</h2>
<p class="sub">确认无误后,复制下方指令发给 AI,AI 会调用写库。</p>
<div class="btn-row">
<button class="btn primary" id="btnAdopt" onclick="copyAdopt()">✓ 采纳</button>
<button class="btn secondary" id="copyDataBtn" onclick="copyData()">📋 复制数据</button>
<button class="btn secondary" id="copyLogBtn" onclick="copyLog()">📋 复制日志</button>
</div>
<div class="copy-preview" id="copyPreview">预览将复制给 AI 的内容</div>
</section>
<footer>卡路里 Skill · 体重目标 · 2026-08-02</footer>
</div>
<!--INJECT-DATA-->
<script>
const DATA=(()=>{if(typeof window.__DATA__!=='object'||window.__DATA__===null)return null;return window.__DATA__})();
const D=DATA&&DATA.data?DATA.data:{};
document.getElementById('title').textContent=D.title||'体重目标';
document.getElementById('subtitle').textContent=D.subtitle||'';
document.getElementById('fieldTitle').textContent=D.fieldTitle||'设置目标';

function renderKpis(){
  const kpis=[];
  if(D.current_weight!=null)kpis.push({label:'当前体重',value:D.current_weight,unit:'kg'});
  if(D.target_weight!=null)kpis.push({label:'目标',value:D.target_weight,unit:'kg'});
  if(D.delta_kg!=null)kpis.push({label:'差距',value:D.delta_kg,unit:'kg'});
  if(D.deadline!=null)kpis.push({label:'截止',value:D.deadline,unit:''});
  if(D.est_deadline!=null)kpis.push({label:'推算截止',value:D.est_deadline,unit:''});
  if(D.suggested_rate!=null)kpis.push({label:'建议速率',value:D.suggested_rate,unit:'kg/周'});
  if(D.start_date!=null)kpis.push({label:'起始日',value:D.start_date,unit:''});
  if(D.start_weight!=null)kpis.push({label:'起点体重',value:D.start_weight,unit:'kg'});
  document.getElementById('kpis').innerHTML=kpis.map(k=>
    '<div class="kpi"><div class="label">'+k.label+'</div><div class="value">'+k.value+'<small> '+k.unit+'</small></div></div>').join('');
}
function renderFields(){
  const FIELDS=D.fields||[];
  document.getElementById('fields').innerHTML=FIELDS.map(f=>
    '<div class="field-row"><div class="name">'+f.label+'<span class="unit">'+f.unit+'</span></div>'+
    '<input type="text" data-key="'+f.key+'" placeholder="'+f.placeholder+'"></div>').join('');
}
function renderResult(){
  const box=document.getElementById('resultBox');
  if(D.rate_check){
    if(D.rate_check.ok)box.innerHTML='<div class="check">✅ 速率校验通过: '+D.rate_check.text+'</div>';
    else box.innerHTML='<div class="warn">⚠️ 速率校验: '+D.rate_check.text+'</div>';
  }else if(D.note){
    box.innerHTML='<div class="info">'+D.note+'</div>';
  }
}
function buildPrompt(){
  let p=D.promptHead||'我已确认体重目标,请帮我写入数据库。\n\n';
  const FIELDS=D.fields||[];
  const values={};
  document.querySelectorAll('#fields input').forEach(i=>{values[i.dataset.key]=i.value.trim();});
  if(D.cliLabel)p+=D.cliLabel+'\n';
  FIELDS.forEach(f=>{
    const v=values[f.key]||f.placeholder;
    p+='  --'+f.key+' '+v+'\n';
  });
  if(D.extraPrompt)p+='\n'+D.extraPrompt+'\n';
  p+='\n数据来源: 体重目标 v1 · render_goal_weight.py · '+new Date().toISOString().split('T')[0];
  return p;
}
function copyAdopt(){
  const text=buildPrompt();
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(()=>{flash('✓ 已复制');});}
  else{const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');flash('✓ 已复制');}catch(e){}document.body.removeChild(ta);}
}
function flash(msg){const b=document.getElementById('btnAdopt');const orig=b.textContent;b.textContent=msg;b.classList.add('copied');setTimeout(()=>{b.textContent=orig;b.classList.remove('copied');},2200);}
renderKpis();
renderFields();
renderResult();
document.getElementById('copyPreview').textContent=buildPrompt();

// R2 双按钮:复制数据(用户口径)/ 复制日志(排障口径) · 2026-08-02 对齐 #8
const META=D.meta||{};
function buildDataText(){
  const lines=[(D.title||'体重目标')+(META.fetched_at?' ('+META.fetched_at+')':''),''];
  if(D.current_weight!=null)lines.push(`当前体重: ${D.current_weight} kg`);
  if(D.target_weight!=null)lines.push(`目标: ${D.target_weight} kg`);
  if(D.deadline!=null)lines.push(`截止: ${D.deadline}`);
  if(D.suggested_rate!=null)lines.push(`建议速率: ${D.suggested_rate} kg/周`);
  const values={};
  document.querySelectorAll('#fields input').forEach(i=>{values[i.dataset.key]=i.value.trim();});
  (D.fields||[]).forEach(f=>lines.push(`${f.label}: ${values[f.key]||f.placeholder}`));
  return lines.join('\n');
}
function buildLogText(){
  const lines=[`[${D.title||'体重目标'} 排障日志]`,''];
  lines.push(`唤醒词: ${META.wake_word||'(未知)'}`);
  lines.push(`渲染命令: ${META.render_cmd||'(未知)'}`);
  lines.push(`数据来源: ${META.source||'(未知)'}`);
  lines.push(`渲染时间: ${META.fetched_at||'(未知)'}`);
  lines.push('');
  if(META.chain){lines.push('AI 思考链:');lines.push(META.chain);}
  else{lines.push('AI 思考链: (未注入 · 渲染时未传 --chain,AI 执行时用 --chain 附上处理步骤)');}
  lines.push('');
  lines.push('原始数据:');
  lines.push(JSON.stringify(D,null,2));
  return lines.join('\n');
}
function showToast(msg){
  let t=document.getElementById('copyToast');
  if(!t){t=document.createElement('div');t.id='copyToast';t.style.cssText='position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:rgba(28,28,30,.92);color:#fff;padding:10px 18px;border-radius:999px;font-size:13px;z-index:99;display:none;max-width:80vw';document.body.appendChild(t);}
  t.textContent=msg;t.style.display='block';
  setTimeout(()=>{t.style.display='none';},2000);
}
function doCopy(text,btnId,msg){
  const done=()=>{const b=document.getElementById(btnId);if(b){b.classList.add('copied');setTimeout(()=>b.classList.remove('copied'),2200);}showToast(msg);};
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(()=>fallbackCopy(text,done));
  } else { fallbackCopy(text,done); }
  function fallbackCopy(txt,ok){
    const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();
    try{document.execCommand('copy');ok();}catch(e){}document.body.removeChild(ta);
  }
}
function copyData(){doCopy(buildDataText(),'copyDataBtn',`${D.title||'体重目标'} 数据复制成功 ✓`);}
function copyLog(){doCopy(buildLogText(),'copyLogBtn','排障日志复制成功 ✓ 可将日志发给开发者/AI 定位问题');}
</script>
</body>
</html>
