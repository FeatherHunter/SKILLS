<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>体重目标已写入 · 卡路里</title>
<style>
:root{--bg:#f5f5f7;--card:#fff;--ink:#1d1d1f;--ink2:#3c3c43;--ink3:#8e8e93;--line:rgba(60,60,67,.12);--accent:#0071e3;--accent-soft:rgba(0,113,227,.10);--green:#34c759;--green-soft:rgba(52,199,89,.12);--orange:#ff9500;--orange-soft:rgba(255,149,0,.12);--red:#ff3b30;--red-soft:rgba(255,59,48,.10);--shadow:0 1px 3px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.04)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:820px;margin:0 auto;padding:28px 16px 64px}
.hero{padding:28px 24px 22px;margin-bottom:14px;background:linear-gradient(135deg,#fff,#f2fbf4);border-radius:20px;box-shadow:var(--shadow);border:1px solid rgba(52,199,89,.14)}
.hero .eyebrow{font-size:12px;color:var(--green);font-weight:700;letter-spacing:.2px;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.hero .eyebrow .dot{width:8px;height:8px;border-radius:50%;background:var(--green);display:inline-block}
.hero .hero-num{font-size:44px;font-weight:800;letter-spacing:-1.5px;line-height:1.05;font-feature-settings:"tnum"}
.hero .hero-num small{font-size:20px;font-weight:600;color:var(--ink3);letter-spacing:0;margin-left:4px}
.hero .hero-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:4px}
.hero .hero-label{font-size:13px;color:var(--ink3)}
.hero .deadline-pill{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:12px;font-weight:600;white-space:nowrap}
.hero .sub{font-size:13px;color:var(--ink3);margin-top:10px}
.summary{background:var(--card);border-radius:16px;padding:16px 20px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.04);border:1px solid rgba(60,60,67,.06);font-size:15px;font-weight:600;display:flex;gap:8px;align-items:flex-start}
.summary .ico{color:var(--green);flex:none;margin-top:1px}
.section{background:var(--card);border-radius:16px;padding:20px 22px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.04);border:1px solid rgba(60,60,67,.06)}
.section-title{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px}
.section-title h2{font-size:16px;font-weight:600;letter-spacing:-.2px}
.section-title .hint{font-size:12px;color:var(--ink3)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.kpi{padding:12px 14px;background:var(--bg);border-radius:12px;border:1px solid rgba(60,60,67,.05)}
.kpi .label{font-size:11px;color:var(--ink3);margin-bottom:4px}
.kpi .value{font-size:20px;font-weight:700;font-feature-settings:"tnum"}
.kpi .value small{font-size:12px;color:var(--ink3);font-weight:400}
.journey-track{position:relative;height:10px;border-radius:999px;background:var(--bg);border:1px solid rgba(60,60,67,.06);margin:18px 0 8px}
.journey-fill{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:linear-gradient(90deg,var(--green),#30d158)}
.journey-marker{position:absolute;top:50%;width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid var(--green);transform:translate(-50%,-50%);box-shadow:0 1px 4px rgba(0,0,0,.18)}
.journey-labels{display:flex;justify-content:space-between;font-size:12px;color:var(--ink3)}
.journey-labels b{color:var(--ink);font-weight:600}
.journey-meta{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:12px;font-size:13px;color:var(--ink2)}
.journey-meta .chip{background:var(--green-soft);color:var(--green);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600}
.check{background:var(--green-soft);border-radius:10px;padding:10px 14px;font-size:13px;color:var(--green);margin-top:8px}
.warn{background:var(--red-soft);border-radius:10px;padding:10px 14px;font-size:13px;color:var(--red);margin-top:8px}
.info{background:var(--accent-soft);border-radius:10px;padding:10px 14px;font-size:13px;color:var(--accent);margin-top:8px}
.rate-formula{margin-top:8px;padding:10px 14px;background:var(--bg);border-radius:10px;font-family:"SF Mono",Consolas,monospace;font-size:12px;color:var(--ink2);border:1px solid rgba(60,60,67,.06);word-break:break-all}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:11px 20px;border-radius:999px;font-size:14px;font-weight:600;cursor:pointer;border:none;transition:opacity .15s;font-family:inherit}
.btn:hover{opacity:.85}
.btn.primary{background:var(--ink);color:#fff}
.btn.copied{background:var(--green)!important;color:#fff!important}
footer{text-align:center;color:var(--ink3);font-size:12px;padding-top:16px;border-top:1px solid rgba(60,60,67,.08);margin-top:28px}
@media(max-width:640px){.wrap{padding:16px 12px 48px}.hero{padding:22px 18px 16px}.hero .hero-num{font-size:36px}.section{padding:16px 14px}.journey-labels{font-size:11px}}
</style>
</head>
<body>
<div class="wrap">
<header class="hero">
<div class="eyebrow"><span class="dot"></span>已写入 · 卡路里 目标管理</div>
<div class="hero-num" id="heroNum">—<small>kg</small></div>
<div class="hero-meta"><span class="hero-label">目标体重</span><span class="deadline-pill" id="deadlinePill" style="display:none"></span></div>
<div class="sub" id="subtitle">加载中…</div>
</header>
<div class="summary" id="oneLine"><span class="ico">✓</span><span>加载中…</span></div>
<div class="section">
<div class="section-title"><h2>已写入字段</h2><span class="hint">数据库 daily_goal 实际值</span></div>
<div class="kpis" id="kpis"></div>
</div>
<div class="section" id="journeySection" style="display:none">
<div class="section-title"><h2>目标旅程</h2><span class="hint">起点 → 目标</span></div>
<div class="journey-track"><div class="journey-fill" id="journeyFill"></div><div class="journey-marker" id="journeyMarker"></div></div>
<div class="journey-labels"><span id="journeyStart">起点</span><span id="journeyTarget">目标</span></div>
<div class="journey-meta" id="journeyMeta"></div>
</div>
<div class="section">
<div class="section-title"><h2>当前进度</h2><span class="hint">算式透明 · 极端目标会警示</span></div>
<div id="rateBox"></div>
</div>
<div class="section">
<div class="section-title"><h2>回执数据</h2><span class="hint">可分享 · 可转发 · 可截图</span></div>
<div class="btn-row">
<button class="btn primary" id="copyDataBtn" onclick="copyData()">📋 复制数据</button>
<button class="btn primary" id="copyLogBtn" onclick="copyLog()">📋 复制日志</button>
</div>
</div>
<footer>卡路里 Skill · 体重目标结果回执 · 2026-08-05</footer>
</div>
<!--INJECT-DATA-->
<script>
const DATA=(()=>{if(typeof window.__DATA__!=='object'||window.__DATA__===null)return null;return window.__DATA__})();
const D=DATA&&DATA.data?DATA.data:{};
const W=D.written||{};
const META=D.meta||{};
document.getElementById('heroNum').innerHTML=(W.weight_goal!=null?W.weight_goal:'—')+'<small>kg</small>';
const pill=document.getElementById('deadlinePill');
if(W.deadline){pill.style.display='inline-flex';pill.textContent='截止 '+W.deadline;}
document.getElementById('subtitle').textContent=(META.wake_word?META.wake_word+' · ':'')+'写入时间 '+(META.fetched_at||'');
document.getElementById('oneLine').querySelector('span:last-child').textContent=D.one_line||'';
document.title=(W.weight_goal!=null?'体重目标已写入 '+W.weight_goal+'kg':'体重目标已写入')+' · 卡路里';

// 起点行 #52 去重:起点==当前(刚设定默认态)时隐藏起点/起始日
const showStart=W.start_weight!=null&&D.current_weight!=null&&Math.abs(W.start_weight-D.current_weight)>=0.1;
const kpis=[];
if(D.current_weight!=null)kpis.push({label:'当前体重',value:D.current_weight,unit:'kg'});
if(W.weight_goal!=null)kpis.push({label:'目标',value:W.weight_goal,unit:'kg'});
if(D.gap!=null)kpis.push({label:'差距',value:Math.abs(D.gap),unit:'kg'});
if(W.deadline)kpis.push({label:'截止',value:W.deadline,unit:''});
if(D.days_left!=null)kpis.push({label:'剩余天数',value:D.days_left,unit:'天'});
if(D.rate)kpis.push({label:'建议速率',value:D.rate.per_week,unit:'kg/周'});
if(showStart&&W.start_date!=null)kpis.push({label:'起始日',value:W.start_date,unit:''});
if(showStart&&W.start_weight!=null)kpis.push({label:'起点体重',value:W.start_weight,unit:'kg'});
document.getElementById('kpis').innerHTML=kpis.map(k=>
  '<div class="kpi"><div class="label">'+k.label+'</div><div class="value">'+k.value+'<small> '+k.unit+'</small></div></div>').join('');

// 目标旅程:起点 → 目标 进度条 + 完成% + 推算达成(对抗审查 2026-08-05 补)
const J=D.journey;
if(J){
  document.getElementById('journeySection').style.display='';
  document.getElementById('journeyFill').style.width=J.pct+'%';
  const marker=document.getElementById('journeyMarker');
  marker.style.left=J.pct+'%';
  if(J.pct<=2){marker.style.left='10px';}
  else if(J.pct>=98){marker.style.left='calc(100% - 10px)';}
  document.getElementById('journeyStart').innerHTML='起点 <b>'+J.start+'kg</b>';
  document.getElementById('journeyTarget').innerHTML='目标 <b>'+J.target+'kg</b>';
  const meta=[];
  meta.push('<span class="chip">已完成 '+J.pct+'%</span>');
  meta.push('已减 '+J.done+' / '+J.total+' kg');
  if(D.est_date)meta.push('按 0.5kg/周 推算达成: '+D.est_date);
  if(D.days_left!=null)meta.push('剩余 '+D.days_left+' 天');
  document.getElementById('journeyMeta').innerHTML=meta.join('');
}

// 速率横幅(#78):极端目标红色警示 / 合理绿色 / 偏低蓝色,公式一行给全
const box=document.getElementById('rateBox');
if(D.rate){
  if(D.rate.extreme)box.innerHTML='<div class="warn">'+D.rate.text+'</div>';
  else if(D.rate.ok)box.innerHTML='<div class="check">'+D.rate.text+'</div>';
  else box.innerHTML='<div class="info">'+D.rate.text+'</div>';
  box.insertAdjacentHTML('beforeend','<div class="rate-formula">'+D.rate.formula+'</div>');
}else{
  box.innerHTML='<div class="info">未设置截止日期,无法计算建议速率。</div>';
}

// 复制数据(2026-08-04 跨技能标准:JSON 固定 5 段)
function payloadData(){
  return {
    written: W,
    current_weight: D.current_weight,
    gap: D.gap,
    days_left: D.days_left,
    rate: D.rate,
    journey: D.journey,
    est_date: D.est_date,
    one_line: D.one_line,
  };
}
function buildDataText(){
  const data5={
    scene_id: META.scene_id||'goal_set_weight',
    command_cn: (META.wake_word||'定体重目标')+' 结果回执',
    occurred_at: META.fetched_at||'',
    target: 'daily_goal(id=1) · 体重目标(weight_goal/goal_deadline/start_weight/start_date)',
    payload: payloadData(),
  };
  return JSON.stringify(data5,null,2);
}
// 复制日志(2026-08-04 跨技能标准:6 段)
function buildLogText(){
  const lines=[];
  lines.push('① 场景标识');
  lines.push(`  command_cn: ${META.wake_word||'(未知)'} 结果回执`);
  lines.push(`  唤醒词: ${META.wake_word||'(未知)'}`);
  lines.push(`  场景名: ${META.wake_word||'(未知)'}(scene_id=${META.scene_id||'goal_set_weight'})`);
  lines.push('');
  lines.push('② AI 思考链');
  lines.push('  '+(META.chain||'(未注入 · 渲染时未传 --chain)'));
  lines.push('');
  lines.push('③ 底层数据结构');
  lines.push('  payload: '+JSON.stringify(payloadData()));
  lines.push('  DB 操作: UPDATE daily_goal SET weight_goal/goal_deadline/start_weight/start_date WHERE id=1(weight_goal.set_weight_goal)');
  lines.push('');
  lines.push('④ 调用链');
  lines.push('  渲染脚本: '+(META.render_cmd||'(未知)'));
  lines.push('  数据来源: '+(META.source||'(未知)'));
  lines.push('');
  lines.push('⑤ 时间戳 + 版本');
  lines.push('  本地时间: '+(META.fetched_at||'(未知)'));
  lines.push('  skill 版本: 卡路里 v1.0');
  lines.push('');
  lines.push('⑥ 异常信息');
  lines.push('  无');
  return lines.join('\n');
}
function showToast(msg){
  let t=document.getElementById('copyToast');
  if(!t){t=document.createElement('div');t.id='copyToast';t.style.cssText='position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:rgba(28,28,30,.92);color:#fff;padding:10px 18px;border-radius:999px;font-size:13px;z-index:99;display:none;max-width:80vw';document.body.appendChild(t);}
  t.textContent=msg;t.style.display='block';
  setTimeout(()=>{t.style.display='none';},2000);
}
function doCopy(text,btnId,msg){
  const done=()=>{const b=document.getElementById(btnId);if(b){b.classList.add('copied');setTimeout(()=>b.classList.remove('copied'),600);}showToast(msg);};
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(()=>fallbackCopy(text,done));
  } else { fallbackCopy(text,done); }
  function fallbackCopy(txt,ok){
    const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();
    try{document.execCommand('copy');ok();}catch(e){}document.body.removeChild(ta);
  }
}
function copyData(){doCopy(buildDataText(),'copyDataBtn','数据复制成功 ✓(JSON 5 段标准)');}
function copyLog(){doCopy(buildLogText(),'copyLogBtn','排障日志复制成功 ✓ 可将日志发给开发者/AI 定位问题');}
</script>
</body>
</html>
