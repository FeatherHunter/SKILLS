<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📚 卡路里 · 唤醒词速查台</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:#f5f6f7; --card:#fff; --text:#1c1c1e; --sub:#6b6b6f;
  --accent:#0071e3; --green:#34c759; --border:#e5e5e7;
  --code-bg:#f0f0f2; --shadow:0 1px 2px rgba(0,0,0,.04);
  --orange:#ff9500; --purple:#af52de; --gray:#8e8e93;
}
html { scroll-behavior: smooth; }
body {
  background: var(--bg); color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
  font-size: 13px; line-height: 1.4; -webkit-font-smoothing: antialiased;
}
.container { max-width: 960px; margin: 0 auto; padding: 0 12px 40px; }

/* === HERO === */
.hero {
  background: linear-gradient(135deg, #fafbfc, #f0f4f8);
  padding: 10px 0 2px;
  border-bottom: 0;
}
.hero h1 {
  font-size: 220%; font-weight: 700; letter-spacing: -.3px;
  line-height: 1.15;
  display: flex; align-items: center; gap: 6px;
  margin: 0 0 1px;
}
.hero .sub {
  color: var(--accent);
  font-size: 105%; font-weight: 500;
  margin: 0 0 4px;
  line-height: 1.4;
}
.hero .stats {
  margin: 2px 0 0;
  display: flex; gap: 10px; flex-wrap: wrap;
  font-size: 115%; color: var(--sub);
  line-height: 1.3;
}
.hero .stats b { color: var(--text); font-weight: 600; }

/* === CATEGORY (L1) === */
.cat-block {
  background: var(--card); border-radius: 8px;
  margin: 3px 0; box-shadow: var(--shadow); overflow: hidden;
}
.cat-block:first-of-type { margin-top: 0; }
.cat-block:last-of-type { margin-bottom: 0; }
.cat-block > summary,
.sub-block > summary,
.scene-card {
  cursor: pointer; list-style: none;
  display: flex; align-items: center; gap: 6px;
  -webkit-tap-highlight-color: transparent;
  tap-highlight-color: transparent;
  touch-action: manipulation;
  -webkit-user-select: none;
  user-select: none;
}
.cat-block > summary::-webkit-details-marker,
.sub-block > summary::-webkit-details-marker { display: none; }
.cat-block > summary::before,
.sub-block > summary::before {
  content: '▸'; font-size: 10px; color: var(--sub);
  transition: transform .12s;
  pointer-events: none;
}
.cat-block[open] > summary::before,
.sub-block[open] > summary::before { transform: rotate(90deg); }
.cat-block > summary > *,
.sub-block > summary > * { pointer-events: none; }

/* ticket 07 兼容:summary 层复制按钮需可点击(覆盖上面 pointer-events:none) */
.word-card > summary > .copy-btn.copy-main { pointer-events: auto; }

/* === L1 cat 样式 === */
.cat-block > summary {
  padding: 7px 12px; font-size: 13px; font-weight: 600;
  background: #fafbfc;
  min-height: 36px;
}
.cat-block > summary::before {
  content: '▸'; font-size: 10px; color: var(--sub);
  transition: transform .12s;
}
.cat-block[open] > summary::before { transform: rotate(90deg); }
.cat-block > summary .count-pill {
  margin-left: auto; font-size: 10px; font-weight: 500;
  color: var(--sub); background: #e5e5e7;
  padding: 1px 6px; border-radius: 999px;
}
.cat-content { padding: 4px 12px 10px; }

/* === SUBFUNCTION (L2) === */
.sub-block {
  background: #fff; border: 1px solid var(--border);
  border-radius: 6px; margin: 4px 0;
}
.sub-block > summary {
  padding: 5px 10px; font-size: 12.5px; font-weight: 500;
  color: var(--text);
  background: #fcfcfd;
  min-height: 28px;
}
.sub-block > summary::before {
  content: '▸'; font-size: 9px; color: var(--sub);
  transition: transform .12s;
}
.sub-block[open] > summary::before { transform: rotate(90deg); }
.sub-block > summary .sub-count {
  margin-left: auto; font-size: 10px; color: var(--sub);
  font-weight: 400;
}
.sub-content { padding: 4px 10px 8px; }

/* === SCENE CARD (L3 平铺) === */
.scene-card {
  display: flex; flex-direction: column; gap: 4px;
  background: #fff;
  padding: 7px 9px 8px;
  margin: 4px 0;
  border: 1px solid #f0f0f2;
  border-radius: 5px;
  cursor: default;     /* 不可整体点击(只有按钮可点) */
  -webkit-user-select: text;
  user-select: text;
}
.scene-header {
  display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
}
.scene-name { font-weight: 600; font-size: 12.5px; color: var(--text); }
.scene-wake {
  font-size: 10.5px; color: var(--sub);
  background: #f0f0f2; padding: 1px 5px; border-radius: 3px;
  font-family: "SF Mono", Consolas, monospace;
}
.scene-output {
  font-size: 9.5px; padding: 1px 5px; border-radius: 3px;
  font-weight: 500; text-transform: uppercase; letter-spacing: .3px;
}
.scene-output.process { background: #fff3e0; color: var(--orange); }
.scene-output.result  { background: #e3f2fd; color: var(--accent); }
.scene-output.receipt { background: #e8f5e9; color: var(--green); }
.scene-ext {
  font-size: 9.5px; color: var(--orange); font-weight: 500;
}
.scene-desc {
  font-size: 11.5px; color: var(--sub); line-height: 1.45;
}
.scene-cli {
  background: var(--code-bg); padding: 3px 6px;
  border-radius: 4px; font-family: "SF Mono", Consolas, monospace;
  font-size: 10.5px; color: var(--text);
  word-break: break-all; line-height: 1.35;
  align-self: flex-start;
  max-width: 100%;
}
.scene-actions {
  display: flex; gap: 4px; flex-wrap: wrap; align-items: center;
  margin-top: 1px;
}
.scene-prompt-preview {
  background: #f0f7ff; border-left: 2px solid var(--accent);
  padding: 5px 7px; border-radius: 4px; margin-top: 3px;
  font-family: "SF Mono", Consolas, monospace; font-size: 10.5px;
  white-space: pre-wrap; word-break: break-word; line-height: 1.4;
  color: #1c1c1e;
  max-height: 0; overflow: hidden;
  transition: max-height .18s ease;
}
.scene-card.expanded .scene-prompt-preview { max-height: 800px; }
.scene-prompt-toggle {
  font-size: 10px; color: var(--accent); cursor: pointer;
  background: none; border: none; padding: 0;
  font-family: inherit;
}
.scene-prompt-toggle:hover { text-decoration: underline; }

/* === COPY BUTTON === */
.copy-btn {
  font: inherit; font-size: 11px; padding: 4px 8px;
  border-radius: 5px; border: 1px solid var(--accent);
  background: #fff; color: var(--accent);
  cursor: pointer; margin: 3px 0;
  transition: background .12s, color .12s, transform .15s, box-shadow .25s;
  white-space: nowrap;
  -webkit-tap-highlight-color: transparent;
}
.copy-btn:hover { background: var(--accent); color: #fff; }
.copy-btn:active { transform: scale(0.94); background: var(--accent); color: #fff; }
.copy-btn.copied {
  background: var(--green); border-color: var(--green); color: #fff;
  transform: scale(1.05);
  animation: copySuccess 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
}
@keyframes copySuccess {
  0%   { transform: scale(0.94); box-shadow: 0 0 0 0 rgba(52, 199, 89, 0); }
  50%  { transform: scale(1.10); box-shadow: 0 0 0 8px rgba(52, 199, 89, 0.30); }
  100% { transform: scale(1.05); box-shadow: 0 0 0 4px rgba(52, 199, 89, 0.18); }
}
.copy-btn-sm {
  padding: 3px 7px; font-size: 10.5px;
}

/* ticket 07 兼容:summary 层主 prompt 复制按钮 */
.copy-btn.copy-main {
  background: var(--accent); color: #fff; border: none;
  padding: 4px 12px; border-radius: 8px; font-size: 12px;
  cursor: pointer; margin-left: auto; flex-shrink: 0;
}
.copy-btn.copy-main:hover { background: var(--accent); opacity: 0.88; }

/* === TOAST === */
.toast {
  position: fixed; left: 50%; bottom: 32px;
  transform: translateX(-50%) scale(0.9);
  opacity: 0;
  background: rgba(28, 28, 30, 0.94);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  backdrop-filter: blur(20px) saturate(180%);
  color: #f0f0f0;
  border-radius: 14px;
  padding: 13px 14px 13px 16px;
  display: flex; align-items: flex-start; gap: 12px;
  max-width: 480px; min-width: 320px;
  box-shadow: 0 10px 32px rgba(0, 0, 0, 0.32), 0 0 0 0.5px rgba(255,255,255,0.08) inset;
  pointer-events: none;
  transition: opacity 0.22s ease-out, transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
  z-index: 9999;
}
.toast.show {
  opacity: 1;
  transform: translateX(-50%) scale(1);
  pointer-events: auto;
}
.toast-icon {
  font-size: 22px; line-height: 1; padding-top: 1px; flex-shrink: 0;
}
.toast-body { flex: 1; min-width: 0; }
.toast-title {
  font-weight: 600; font-size: 13px; line-height: 1.4;
  color: #fff; margin-bottom: 3px;
}
.toast-title em {
  font-style: normal; color: #4dd96b; font-weight: 600;
}
.toast-detail {
  font-size: 11.5px; line-height: 1.55;
  color: #c8c8cc;
}
.toast-close {
  background: rgba(255, 255, 255, 0.10);
  color: #4dd96b;
  border: 0;
  border-radius: 8px;
  padding: 6px 10px;
  font-size: 11px;
  font-weight: 500;
  font-family: inherit;
  cursor: pointer;
  white-space: nowrap;
  margin-left: 6px; flex-shrink: 0;
  transition: background .12s;
}
.toast-close:hover { background: rgba(255, 255, 255, 0.18); }
.toast-close:active { transform: scale(0.96); }

/* === EMPTY / FOOTER === */
.empty {
  text-align: center; padding: 24px; color: var(--sub); font-size: 13px;
}
footer {
  text-align: center; color: var(--sub); font-size: 10px;
  padding: 12px 0 0; margin-top: 16px;
}

/* === MOBILE (≤600px) === */
@media (max-width: 600px) {
  body { font-size: 12.5px; }
  .container { padding: 0 8px 60px; }
  .hero { padding: 8px 0 5px; }
  .hero h1 { font-size: 18px; }
  .hero .sub { font-size: 11px; }
  .hero .stats { gap: 8px; font-size: 11px; }
  .cat-block > summary { padding: 8px 10px; font-size: 12.5px; }
  .cat-content { padding: 4px 10px 8px; }
  .sub-block > summary { padding: 6px 9px; font-size: 12px; }
  .sub-content { padding: 4px 9px 7px; }
  .scene-card { padding: 6px 8px 7px; }
  .scene-name { font-size: 12px; }
  .scene-wake { font-size: 10px; }
  .copy-btn { padding: 5px 9px; font-size: 11.5px; }
  .copy-btn-sm { padding: 4px 8px; font-size: 11px; }
  .toast {
    left: 12px; right: 12px;
    bottom: calc(12px + env(safe-area-inset-bottom, 0));
    transform: translateX(0) scale(0.95);
    max-width: none; min-width: 0;
    padding: 12px 12px 12px 14px;
  }
  .toast.show { transform: translateX(0) scale(1); }
  .toast-icon { font-size: 20px; }
  .toast-title { font-size: 12.5px; }
  .toast-detail { font-size: 11px; }
  body { padding-bottom: env(safe-area-inset-bottom, 0); }
}

/* === TABLET (601-900px) === */
@media (min-width: 601px) and (max-width: 900px) {
  .container { max-width: 720px; }
}
</style>
</head>
<body>

<div class="hero"><div class="container">
  <h1>📚 卡路里 · 唤醒词速查台</h1>
  <div class="sub">💡 点 ▸ 类别 → 选子功能 → 复制 prompt → 贴给 AI</div>
  <div class="stats" id="heroStats"></div>
</div></div>

<div class="container">
<main id="mainContent"><div class="empty">加载中…</div></main>
<footer id="footer"></footer>
</div>

<!-- Toast(iOS 通知风格) -->
<div id="toast" class="toast" role="status" aria-live="polite">
  <div class="toast-icon">📋</div>
  <div class="toast-body">
    <div class="toast-title">已复制 <em id="toastWake">prompt</em></div>
    <div class="toast-detail">粘贴给 AI(微信/飞书/任何 AI 工具),卡路里技能会自动执行这个流程,完成后你会在飞书收到 HTML</div>
  </div>
  <button class="toast-close" id="toastClose">✓ 知道了</button>
</div>

<!--INJECT-DATA-->

<script>
/* === v3.0 · 2 层(分类 + 子功能) + 平铺场景(无变体) === */
const DATA = window.__DATA__ && window.__DATA__.status === 'ok' ? window.__DATA__ : null;
const META = DATA ? DATA.meta : null;
const SOURCE = META ? META.source : 'unknown';

function escapeHTML(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

function copyText(text, btn) {
  let wake = btn && btn.dataset ? (btn.dataset.wake || '') : '';
  showToast(wake || 'prompt');
  const after = () => {
    if (!btn) return;
    const orig = btn.textContent;
    btn.textContent = '✓ 已复制';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = orig; btn.classList.remove('copied'); }, 2000);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(after).catch(() => { fallback(text); after(); });
  } else { fallback(text); after(); }
}

function fallback(text) {
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.csssheet = 'position:fixed;opacity:0';
  document.body.appendChild(ta); ta.focus(); ta.select();
  try { document.execCommand('copy'); } catch(e) {}
  document.body.removeChild(ta);
}

/* === Toast 控制器 === */
const toastEl = document.getElementById('toast');
const toastWakeEl = document.getElementById('toastWake');
const toastCloseEl = document.getElementById('toastClose');
let toastTimer = null;

function showToast(wake) {
  if (toastWakeEl) toastWakeEl.textContent = wake;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 4500);
}
if (toastCloseEl) {
  toastCloseEl.addEventListener('click', () => {
    toastEl.classList.remove('show');
    clearTimeout(toastTimer);
  });
}

function toggleScenePrompt(btn) {
  const card = btn.closest('.scene-card');
  if (card) card.classList.toggle('expanded');
}

function renderScene(scene, sceneIndex) {
  const extTag = scene.depends_on_external
    ? '<span class="scene-ext" title="依赖外部技能/接口(P4 最后开发)">🔗 联动</span>'
    : '';
  const cli = scene.data_source
    ? `<div class="scene-cli">${escapeHTML(scene.data_source)}</div>`
    : '';
  return `<div class="scene-card">` +
    `<div class="scene-header">` +
      `<span class="scene-name">${escapeHTML(scene.name)}</span>` +
      `<span class="scene-wake">${escapeHTML(scene.wake_word)}</span>` +
      `<span class="scene-output ${escapeHTML(scene.output_type || 'result')}">${escapeHTML(scene.output_type || 'result')}</span>` +
      extTag +
    `</div>` +
    (scene.user_intent ? `<div class="scene-desc">${escapeHTML(scene.user_intent)}</div>` : '') +
    cli +
    `<div class="scene-actions">` +
      `<button class="copy-btn copy-btn-sm" data-prompt-index="${sceneIndex}" data-wake="${escapeHTML(scene.wake_word)}">📋 复制 prompt</button>` +
      `<button class="scene-prompt-toggle" onclick="toggleScenePrompt(this)">👁 查看 prompt 文本</button>` +
    `</div>` +
    `<div class="scene-prompt-preview">${escapeHTML(scene.prompt)}</div>` +
  `</div>`;
}

function renderSubBlock(subName, subScenes, sceneBaseIndex) {
  return `<details class="sub-block" open>` +
    `<summary><span>${escapeHTML(subName)}</span>` +
    `<span class="sub-count">${subScenes.length} 场景</span></summary>` +
    `<div class="sub-content">` +
      subScenes.map((s, i) => renderScene(s, sceneBaseIndex + i)).join('') +
    `</div></details>`;
}

function render() {
  if (!DATA) {
    document.getElementById('mainContent').innerHTML = '<div class="empty">❌ 数据加载失败</div>';
    return;
  }
  const { summary, categories, scenes } = DATA.data;

  // hero stats
  document.getElementById('heroStats').innerHTML =
    `<span><b>${summary.total_categories}</b> 分类</span>` +
    `<span><b>${summary.total_scenes}</b> 场景</span>` +
    `<span><b>${summary.total_prompts}</b> prompt</span>` +
    `<span style="color:var(--gray)">· 数据源:${SOURCE}</span>`;

  // group by category → subfunction
  const byCat = {};   // cat → sub → scenes[]
  const indexOf = {}; // key → global scene index
  scenes.forEach((s, i) => {
    indexOf[s.key] = i;
    (byCat[s.category] = byCat[s.category] || {})[s.subfunction] = (byCat[s.category][s.subfunction] || []).concat([s]);
  });

  // 排序:category 顺序固定,subfunction 按 order 升序,scene 按 order 升序
  const catOrder = categories.map(c => c.name);
  const rendered = [];
  for (const cat of categories) {
    const subs = byCat[cat.name] || {};
    const subNames = Object.keys(subs).sort((a, b) => {
      const oa = Math.min(...subs[a].map(s => s.order ?? 9999));
      const ob = Math.min(...subs[b].map(s => s.order ?? 9999));
      return oa - ob;
    });
    let runningIndex = 0;
    // 起始 base index for this cat
    const catScenes = subNames.flatMap(n => subs[n]);
    const baseIndex = scenes.indexOf(catScenes[0]);
    const subHtml = subNames.map(n => {
      const subScenes = subs[n].sort((a, b) => (a.order ?? 9999) - (b.order ?? 9999));
      const subBase = scenes.indexOf(subScenes[0]);
      return renderSubBlock(n, subScenes, subBase);
    }).join('');
    const totalScenes = catScenes.length;
    rendered.push(
      `<details class="cat-block" id="cat-${escapeHTML(cat.key)}" data-cat-name="${escapeHTML(cat.name)}" open>` +
        `<summary><span>${escapeHTML(cat.icon)}</span><span>${escapeHTML(cat.name)}</span>` +
        `<span class="count-pill">${totalScenes}</span></summary>` +
        `<div class="cat-content">${subHtml}</div></details>`
    );
  }

  document.getElementById('mainContent').innerHTML = rendered.join('') || '<div class="empty">暂无场景</div>';

  // 数据源标记(footer)
  if (META) {
    document.getElementById('footer').textContent =
      `卡路里 · 唤醒词速查台 · 数据源:${META.source} · 渲染时间:${META.rendered_at || ''}`;
  }

  bindCopyButtons();
  bindFallbackToggle();
}

function bindFallbackToggle() {
  /* 移动端 WebView 偶发 <details> 不响应 click,50ms 兜底 */
  const sums = document.querySelectorAll('.cat-block > summary, .sub-block > summary');
  sums.forEach(sum => {
    if (sum.__bound_fb) return;
    sum.__bound_fb = true;
    sum.addEventListener('click', () => {
      const det = sum.parentElement;
      const wasOpen = det.open;
      setTimeout(() => {
        if (det.open === wasOpen) det.open = !wasOpen;
      }, 50);
    }, { passive: true });
  });
}

function bindCopyButtons() {
  document.querySelectorAll('.copy-btn').forEach(btn => {
    if (btn.__bound) return;
    // ticket 07 兼容:summary 层 .copy-main 走 onclick=copyMainPrompt(i),不在此绑定
    if (btn.classList.contains('copy-main')) return;
    btn.__bound = true;
    btn.addEventListener('click', () => {
      const idx = parseInt(btn.dataset.promptIndex || '-1', 10);
      const s = DATA.data.scenes[idx];
      const text = s ? s.prompt : '';
      copyText(text, btn);
    });
  });
}

/* ticket 07 兼容:summary 层主 prompt 复制按钮(读全局 trigger 索引) */
function copyMainPrompt(i) {
  const t = DATA && DATA.data && DATA.data.triggers && DATA.data.triggers[i];
  const text = t && t.main_prompt ? t.main_prompt.text : '';
  const btn = document.querySelector(`.word-card:nth-of-type(${i + 1}) .copy-btn.copy-main`) || null;
  copyText(text, btn);
}

render();
</script>
</body>
</html>
