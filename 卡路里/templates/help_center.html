<!DOCTYPE html>
<!--
  卡路里 v1.0 HELP HTML 模板(v4 · 4 层架构)
  ----------------------------------------------------
  设计原则:docs/adr/0008-help-html-design-principles.md (Phase 2/3 必读)
  ① 用户导向,不是开发者文档 — 不要展示底层原理
  ② 展示功能,不展示实现 — 别名 / output_type 详情 / data_fields 不该出现
  ③ data_source 必须带 `python ` 前缀(.py 脚本)
  ----------------------------------------------------
  修改前请读 ADR-0008
-->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📚 卡路里 · 唤醒词速查台</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
:root {
  /* 对齐居家管家 HELP 视觉基准(跨技能一致 · issue #245) */
  --bg:#f5f5f7; --card:#fff; --line:#d2d2d7;
  --fg:#1d1d1f; --fg2:#6e6e73; --fg3:#86868b;
  --blue:#007aff; --blue2:#0a63ce; --soft:#f5f8ff; --ok:#34c759;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 12px 36px rgba(0,0,0,.06);
  /* 兼容别名(既有引用) */
  --text:var(--fg); --sub:var(--fg2); --accent:var(--blue);
  --green:var(--ok); --border:var(--line); --code-bg:var(--soft); --orange:#ff9500;
}
html { scroll-behavior: smooth; }
body {
  background: var(--bg); color: var(--fg);
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  font-size: 14px; line-height: 1.65; -webkit-font-smoothing: antialiased;
  padding-bottom: 48px;
}
.container { max-width: 860px; margin: 0 auto; padding: 28px 20px 40px; }
.hero .container { padding: 0; } /* hero 卡内间距由 .hero padding 负责(避免继承页面底部 60px safe-area) */

/* === HERO(对齐居家管家:大圆角渐变卡片 + 步骤引导) === */
.hero {
  background: linear-gradient(180deg,#fff 0%,#f8fbff 100%);
  border-radius: 24px; padding: 28px 30px;
  margin-bottom: 20px; box-shadow: var(--shadow);
}
.hero h1 {
  font-size: 220%; font-weight: 700; letter-spacing: -.02em;
  line-height: 1.2;
  display: flex; align-items: center; gap: 6px;
  margin: 0 0 8px;
}
.hero-steps { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
.hero-steps .step {
  background: var(--soft); border: 1px solid #d7e6ff; color: var(--blue2);
  font-weight: 700; font-size: 13px; padding: 6px 14px; border-radius: 999px;
  box-shadow: 0 1px 3px rgba(0,122,255,.10); white-space: nowrap;
}
.hero-steps .arrow { color: var(--blue); font-weight: 800; font-size: 15px; }
.hero .stats {
  margin: 14px 0 0;
  display: flex; gap: 8px; flex-wrap: wrap;
  font-size: 12px; color: var(--fg2); line-height: 1.3;
}
.hero .stats span {
  background: #fff; border: 1px solid var(--line); color: var(--fg2);
  font-size: 12px; font-weight: 700; padding: 6px 12px; border-radius: 999px;
  white-space: nowrap;
}
.hero .stats b { color: var(--fg); font-weight: 700; }

/* === SEARCH(顶部 sticky · 对齐居家管家:blur 毛玻璃) === */
.search-wrap {
  position: sticky; top: 0; z-index: 50;
  background: rgba(245,245,247,.92);
  -webkit-backdrop-filter: saturate(180%) blur(14px);
  backdrop-filter: saturate(180%) blur(14px);
  padding: 8px 0 6px;
  margin-bottom: 6px;
}
.search-box { position: relative; }
.search {
  width: 100%; padding: 10px 16px;
  border: 1px solid var(--line); border-radius: 999px;
  background: #fff;
  font: inherit; font-size: 14px; outline: none;
  box-shadow: 0 1px 4px rgba(0,0,0,.05);
  -webkit-appearance: none;
}
.search:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(0,122,255,.15); }
/* 搜索命中反馈(仅搜索时有词时显示 · 不占常驻高度) */
.hit-count {
  position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
  font-size: 11.5px; color: var(--blue2); background: var(--soft);
  padding: 2px 10px; border-radius: 999px;
  display: none; pointer-events: none; white-space: nowrap;
}

/* === L1 分类(cat-block · 对齐居家管家 module:16px 白卡) === */
.cat-block {
  background: var(--card); border-radius: 16px;
  margin: 0 0 12px; box-shadow: 0 1px 3px rgba(0,0,0,.04);
  overflow: hidden;
}
.cat-block:first-of-type { margin-top: 0; }
.cat-block:last-of-type { margin-bottom: 0; }
.cat-block > summary,
.sub-block > summary,
.scene-card > summary {
  cursor: pointer; list-style: none;
  display: flex; align-items: center; gap: 6px;
  -webkit-tap-highlight-color: transparent;
  tap-highlight-color: transparent;
  touch-action: manipulation;
  -webkit-user-select: none;
  user-select: none;
}
.cat-block > summary::-webkit-details-marker,
.sub-block > summary::-webkit-details-marker,
.scene-card > summary::-webkit-details-marker { display: none; }
.cat-block > summary::before,
.sub-block > summary::before,
.scene-card > summary::before {
  pointer-events: none;
}
.cat-block > summary > *,
.sub-block > summary > *,
.scene-card > summary > * { pointer-events: none; }
.scene-card > summary > .copy-btn { pointer-events: auto; }  /* 复制按钮可点击 */

.cat-block > summary {
  padding: 9px 14px; font-size: 14.5px; font-weight: 700;
  color: var(--fg);
  min-height: 36px;
  transition: background .15s;
}
/* issue #47(2026-08-09):icon 固定占位宽度,保证各分类「文字起点」垂直对齐
   (🛠 ZWJ 组合 emoji 宽度与其他单字符不一致曾导致「基础信息」左偏) */
.cat-block > summary > span:first-child {
  display: inline-block;
  width: 1.6em;
  text-align: center;
  flex-shrink: 0;
}
.cat-block > summary::before {
  content: '▶'; font-size: 9px; color: var(--fg3);
  transition: transform .15s;
  flex-shrink: 0;
}
.cat-block[open] > summary::before { transform: rotate(90deg); color: var(--blue); }
.cat-block > summary:hover { background: var(--soft); }
.cat-block > summary .count-pill {
  margin-left: auto; font-size: 11.5px; font-weight: 500;
  color: var(--fg3);
  padding: 2px 8px; border-radius: 999px;
  background: var(--soft);
}
.cat-content { padding: 4px 12px 8px; }

/* === L2 子功能(sub-block · 对齐居家管家 sub-module:12px 卡) === */
.sub-block {
  background: var(--card); border: 1px solid var(--line);
  border-radius: 12px; margin: 6px 0;
  overflow: hidden;
}
.sub-block > summary {
  padding: 10px 14px; cursor: pointer; list-style: none;
  display: flex; align-items: center; gap: 6px;
  font-size: 13px; font-weight: 600;
  color: var(--fg2);
  transition: background .15s;
}
.sub-block > summary::before {
  content: '▸'; font-size: 10px; color: var(--fg3);
  transition: transform .15s;
  flex-shrink: 0;
}
.sub-block[open] > summary::before { transform: rotate(90deg); color: var(--blue); }
.sub-block > summary:hover { background: var(--soft); }
.sub-block > summary .sub-count {
  margin-left: auto; font-size: 11px; color: var(--fg3); font-weight: 400;
}
.sub-content { padding: 4px 10px 8px; }

/* === L3 场景(scene-card · 对齐居家管家 scene:14px 卡 + 胶囊 chip) === */
.scene-card {
  background: var(--bg); border: 1px solid var(--line);
  border-radius: 14px; margin: 0 0 10px;
  overflow: hidden;
}
.scene-card > summary {
  padding: 14px 16px; cursor: pointer; list-style: none;
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  font-size: 13px;
  transition: background .15s;
}
.scene-card > summary::before {
  content: '▸'; font-size: 11px; color: var(--fg3);
  transition: transform .15s;
  flex-shrink: 0;
}
.scene-card[open] > summary::before { transform: rotate(90deg); color: var(--blue); }
.scene-card > summary:hover { background: var(--soft); }
.scene-name { font-weight: 600; font-size: 15px; color: var(--fg); flex: 1; min-width: 180px; }
.scene-wake {
  font-size: 11.5px; padding: 2px 9px; border-radius: 999px;
  background: var(--soft); color: var(--blue2);
  font-weight: 700;
  font-family: ui-monospace, Menlo, monospace;
}
.scene-output {
  font-size: 11px; padding: 2px 9px; border-radius: 999px;
  font-weight: 700;
}
.scene-output.process { background: #fff1e2; color: #c2540a; }
.scene-output.result  { background: #e8f2ff; color: var(--blue2); }
.scene-output.receipt { background: #e7f8ee; color: #1a7a3a; }
.scene-ext {
  font-size: 11px; color: var(--orange); font-weight: 500;
}
.scene-empty { margin-left: auto; }
.scene-content { padding: 0 16px 14px; }

/* === L4 详情(scene-detail · 对齐居家管家:prompt 深色块) === */
.scene-detail {
  margin: 0;
  font-size: 12.5px; color: var(--fg);
}
.scene-detail .intent {
  color: var(--fg2); margin: 10px 0 8px; line-height: 1.5;
}
.scene-detail .prompt-pre {
  background: #1d1d1d; color: #f5f5f7;
  border-radius: 12px;
  padding: 12px 14px;
  font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12.5px;
  white-space: pre-wrap; word-break: break-word; line-height: 1.7;
}
.scene-detail .meta {
  margin-top: 8px; font-size: 11px; color: var(--fg3);
  display: flex; flex-direction: column; gap: 2px;
}
.scene-detail .meta span { background: #fff; padding: 2px 8px; border-radius: 8px; word-break: break-all; border: 1px solid var(--line); }

/* === COPY BUTTON(对齐居家管家:蓝底白字胶囊 · 行高与基准一致) === */
.copy-btn {
  font-size: 12.5px; padding: 7px 13px;
  border-radius: 999px; border: 0;
  background: var(--blue); color: #fff;
  cursor: pointer;
  transition: background .15s;
  white-space: nowrap;
  -webkit-tap-highlight-color: transparent;
  margin-left: auto;
  flex-shrink: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
.copy-btn.copy-main { /* ticket 07 兼容:summary 行复制按钮 */ }
.copy-btn:hover { background: var(--blue2); }
.copy-btn:active { transform: scale(0.94); background: var(--blue2); }
.copy-btn.copied {
  background: var(--green);
  transform: scale(1.05);
  animation: copySuccess 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
}
@keyframes copySuccess {
  0%   { transform: scale(0.94); box-shadow: 0 0 0 0 rgba(52, 199, 89, 0); }
  50%  { transform: scale(1.10); box-shadow: 0 0 0 8px rgba(52, 199, 89, 0.30); }
  100% { transform: scale(1.05); box-shadow: 0 0 0 4px rgba(52, 199, 89, 0.18); }
}

/* === TOAST(沿用 v2.4.12 iOS 风格) === */
.toast {
  position: fixed; left: 50%; bottom: 32px;
  transform: translateX(-50%) scale(0.9);
  opacity: 0;
  background: rgba(28, 28, 30, 0.94);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  backdrop-filter: blur(20px) saturate(180%);
  color: #f0f0f0;
  border-radius: 14px;
  padding: 13px 14px 13px 16px;
  display: flex; align-items: flex-start; gap: 12px;
  max-width: 480px; min-width: 320px;
  box-shadow: 0 10px 32px rgba(0, 0, 0, 0.32), 0 0 0 0.5px rgba(255,255,255,0.08) inset;
  pointer-events: none;
  transition: opacity 0.22s ease-out, transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
  z-index: 9999;
}
.toast.show {
  opacity: 1;
  transform: translateX(-50%) scale(1);
  pointer-events: auto;
}
.toast-icon { font-size: 22px; line-height: 1; padding-top: 1px; flex-shrink: 0; }
.toast-body { flex: 1; min-width: 0; }
.toast-title { font-weight: 600; font-size: 13px; line-height: 1.4; color: #fff; margin-bottom: 3px; }
.toast-title em { font-style: normal; color: #4dd96b; font-weight: 600; }
.toast-detail { font-size: 11.5px; line-height: 1.55; color: #c8c8cc; }
.toast-close {
  background: rgba(255, 255, 255, 0.10); color: #4dd96b;
  border: 0; border-radius: 8px; padding: 6px 10px;
  font-size: 11px; font-weight: 500; font-family: inherit;
  cursor: pointer; white-space: nowrap; margin-left: 6px; flex-shrink: 0;
  transition: background .12s;
}
.toast-close:hover { background: rgba(255, 255, 255, 0.18); }
.toast-close:active { transform: scale(0.96); }

/* === EMPTY / FOOTER === */
.empty { text-align: center; padding: 24px; color: var(--fg3); font-size: 13px; }
.empty.results { padding: 16px; font-size: 12px; }
footer {
  text-align: center; color: var(--fg3); font-size: 11px;
  padding: 20px 0 0; margin-top: 8px;
}

/* === HIDDEN(hit by search) === */
.scene-card.hidden,
.sub-block.hidden,
.cat-block.hidden { display: none; }

/* === MOBILE (≤600px · 对齐居家管家 375px 验收) === */
@media (max-width: 600px) {
  body { font-size: 13px; }
  .container { padding: 12px 12px 60px; }
  .hero { padding: 12px 16px; margin-bottom: 12px; }
  .hero h1 { font-size: 24px; }
  .hero .stats { display: none; }
  .hero-steps { gap: 5px; width: 100%; }
  .hero-steps .step { font-size: 11.5px; padding: 4px 7px; }
  .hero-steps .arrow { font-size: 12px; margin: 0 -3px; }
  .search-wrap { padding: 6px 0; }
  .search { padding: 10px 14px 10px 38px; font-size: 13.5px; }
  .cat-block > summary { padding: 9px 14px; font-size: 13.5px; }
  .cat-content { padding: 4px 10px 8px; }
  .sub-block > summary { padding: 10px 14px; font-size: 13px; }
  .sub-content { padding: 4px 9px 7px; }
  .scene-card > summary { flex-wrap: nowrap; gap: 4px; padding: 9px 10px; }
  .scene-name { font-size: 13.5px; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .scene-wake { font-size: 10.5px; padding: 1px 7px; }
  .scene-output { font-size: 10px; padding: 1px 7px; }
  .scene-content { padding: 0 10px 10px; }
  .copy-btn { min-height: 28px; min-width: 56px; padding: 0 10px; font-size: 11px; }
  .toast {
    left: 12px; right: 12px;
    bottom: calc(12px + env(safe-area-inset-bottom, 0));
    transform: translateX(0) scale(0.95);
    max-width: none; min-width: 0;
    padding: 12px 12px 12px 14px;
  }
  .toast.show { transform: translateX(0) scale(1); }
  .toast-icon { font-size: 20px; }
  .toast-title { font-size: 12.5px; }
  .toast-detail { font-size: 11px; }
  body { padding-bottom: env(safe-area-inset-bottom, 0); }
}

/* === TABLET (601-900px) === */
@media (min-width: 601px) and (max-width: 900px) {
  .container { max-width: 720px; }
}

  @keyframes fadeup{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
</style>
</head>
<body>

<div class="hero"><div class="container">
  <h1>📚 卡路里 · 唤醒词速查台</h1>
  <div class="hero-steps"><span class="step">🔍 找场景</span><span class="arrow">→</span><span class="step">📋 复制 prompt</span><span class="arrow">→</span><span class="step">💬 发给 AI</span></div>
  <div class="stats" id="heroStats"></div>
</div></div>

<div class="container">
<div class="search-wrap">
  <div class="search-box">
    <input class="search" id="searchInput" placeholder="🔍 搜索场景名 / 唤醒词 / 分类" autocomplete="off" />
    <span class="hit-count" id="hitCount"></span>
  </div>
</div>
<main id="mainContent"><div class="empty">加载中…</div></main>
<footer id="footer"></footer>
</div>

<!-- Toast(iOS 通知风格) -->
<div id="toast" class="toast" role="status" aria-live="polite">
  <div class="toast-icon">📋</div>
  <div class="toast-body">
    <div class="toast-title">已复制 <em id="toastWake">prompt</em></div>
    <div class="toast-detail">粘贴给 AI(微信/飞书/任何 AI 工具),卡路里技能会自动执行这个流程,完成后你会在飞书收到 HTML</div>
  </div>
  <button class="toast-close" id="toastClose">✓ 知道了</button>
</div>

<!--INJECT-DATA-->

<script>
/* === 卡路里 v1.0 HELP · 4 层架构(分类 → 子功能 → 场景 → 详情) === */
const DATA = window.__DATA__ && window.__DATA__.status === 'ok' ? window.__DATA__ : null;
const META = DATA ? (DATA.meta || {}) : {};

function escapeHTML(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

function copyText(text, btn) {
  let wake = '';
  if (btn && btn.dataset) {
    wake = btn.dataset.wake || '';
  }
  showToast('已复制');

  const after = () => {};
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(after).catch(() => { fallback(text); after(); });
  } else { fallback(text); after(); }
}

/* ticket 07 兼容:旧版 copyMainPrompt 全局函数(V4 用引号 fallback 不需要,但保留测试期望) */
function copyMainPrompt(i) {
  const s = DATA && DATA.data && DATA.data.scenes && DATA.data.scenes[i];
  const text = s ? (s.prompt_template || s.prompt || '') : '';
  const btn = document.querySelector(`.scene-card .copy-btn[data-prompt-index="${i}"]`) || null;
  copyText(text, btn);
}

function fallback(text) {
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.cssText = 'position:fixed;opacity:0';
  document.body.appendChild(ta); ta.focus(); ta.select();
  try { document.execCommand('copy'); } catch(e) {}
  document.body.removeChild(ta);
}

/* === Toast 控制器 === */
const toastEl = document.getElementById('toast');
const toastWakeEl = document.getElementById('toastWake');
const toastCloseEl = document.getElementById('toastClose');
let toastTimer = null;

  function showToast(msg){var t=document.createElement('div');t.style.cssText='position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0));transform:translateX(-50%) scale(.9);opacity:0;background:rgba(28,28,30,.94);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);color:#f0f0f0;border-radius:14px;padding:13px 14px 13px 16px;display:flex;align-items:flex-start;gap:12px;max-width:min(480px,calc(100vw - 24px));min-width:300px;box-shadow:0 10px 32px rgba(0,0,0,.32),0 0 0 .5px rgba(255,255,255,.08) inset;z-index:9999;transition:opacity .22s ease-out,transform .22s cubic-bezier(.34,1.56,.64,1)';t.innerHTML='<div style="font-size:20px;line-height:1;padding-top:1px;flex-shrink:0">📋</div><div style="flex:1;min-width:0"><div style="font-weight:600;font-size:12.5px;line-height:1.4;color:#fff;margin-bottom:2px">已复制 <em style="font-style:normal;color:#34c759;font-weight:600">'+msg+'</em></div><div style="font-size:11px;line-height:1.5;color:#c8c8cc">粘贴给 AI,卡路里技能会自动执行这个流程,完成后你会拿到结果 HTML + 一句话总结。</div></div><button style="background:rgba(255,255,255,.10);color:#34c759;border:0;border-radius:8px;padding:5px 9px;font-size:10.5px;font-weight:500;cursor:pointer;white-space:nowrap;margin-left:6px;flex-shrink:0">✓ 知道了</button>';document.body.appendChild(t);requestAnimationFrame(function(){t.style.opacity='1';t.style.transform='translateX(-50%) scale(1)';});var close=function(){t.style.opacity='0';t.style.transform='translateX(-50%) scale(.9)';setTimeout(function(){t.remove();},220);};t.querySelector('button').addEventListener('click',close);setTimeout(close,4500);}
if (toastCloseEl) {
  toastCloseEl.addEventListener('click', () => {
    toastEl.classList.remove('show');
    clearTimeout(toastTimer);
  });
}

function renderSceneDetail(s) {
  const metaBits = [];
  if (s.data_source)     metaBits.push(`<span>📦 ${escapeHTML(s.data_source)}</span>`);
  if (s.html_template)   metaBits.push(`<span>🎨 ${escapeHTML(s.html_template)}</span>`);
  if (s.depends_on_external) metaBits.push('<span>🔗 依赖外部</span>');
  if (s.data_fields && s.data_fields.length) {
    metaBits.push(`<span>📋 ${escapeHTML(s.data_fields.join(', '))}</span>`);
  }
  const meta = metaBits.length ? `<div class="meta">${metaBits.join('')}</div>` : '';
  const intent = s.user_intent ? `<div class="intent">${escapeHTML(s.user_intent)}</div>` : '';
  const prompt = s.prompt_template ? `<pre class="prompt-pre">${escapeHTML(s.prompt_template)}</pre>` : '';
  // 顺序(2026-08-02 用户拍板):intent → prompt → meta(📦/🎨/📋);底部 cli 已删(meta 📦 已含 data_source)
  return `<div class="scene-detail">${intent}${prompt}${meta}</div>`;
}

function renderScene(s, i) {
  const extTag = s.depends_on_external
    ? '<span class="scene-ext" title="依赖外部技能/接口(P4 最后开发)">🔗</span>'
    : '';
  const empty = '';  // 让 flex gap 撑开
  // output_type 中文标签(2026-08-02 用户拍板)
  const otLabels = { process: '过程', result: '结果', receipt: '回执' };
  const otLabel = otLabels[s.output_type] || s.output_type || '结果';
  // wake_word 与 name 相同时不重复展示(2026-08-02 用户拍板)
  const wakeSpan = s.wake_word && s.wake_word !== s.name
    ? `<span class="scene-wake">${escapeHTML(s.wake_word || s.name || '')}</span>`
    : '';
  return `<details class="scene-card" data-key="${escapeHTML(s.key || '')}" data-cat="${escapeHTML(s.category || '')}" data-sub="${escapeHTML(s.subfunction || '')}">` +
    `<summary>` +
      `<span class="scene-name">${escapeHTML(s.name || '')}</span>` +
      wakeSpan +
      `<span class="scene-output ${escapeHTML(s.output_type || 'result')}">${escapeHTML(otLabel)}</span>` +
      extTag +
      `<button class="copy-btn copy-main" data-prompt-index="${i}" data-wake="${escapeHTML(s.wake_word || s.name || '')}">📋 复制</button>` +
    `</summary>` +
    `<div class="scene-content">${renderSceneDetail(s)}</div>` +
    `</details>`;
}

function renderSubBlock(subName, subScenes, sceneBaseIndex) {
  return `<details class="sub-block" data-sub="${escapeHTML(subName)}" open>` +
    `<summary>` +
      `<span>${escapeHTML(subName)}</span>` +
      `<span class="sub-count">${subScenes.length} 场景</span>` +
    `</summary>` +
    `<div class="sub-content">` +
      subScenes.map((s, i) => renderScene(s, sceneBaseIndex + i)).join('') +
    `</div></details>`;
}

function render() {
  if (!DATA) {
    document.getElementById('mainContent').innerHTML = '<div class="empty">❌ 数据加载失败</div>';
    return;
  }
  const { summary, categories, scenes } = DATA.data;

  // hero stats
  document.getElementById('heroStats').innerHTML =
    `<span><b>${summary.total_categories}</b> 分类</span>` +
    `<span><b>${summary.total_scenes}</b> 场景</span>` +
    `<span><b>${summary.total_prompts}</b> prompt</span>`;

  // footer
  document.getElementById('footer').textContent = META.rendered_at
    ? `卡路里 · 唤醒词速查台 · 渲染时间:${META.rendered_at}`
    : '卡路里 · 唤醒词速查台';

  // group by category → subfunction
  const byCat = {};
  scenes.forEach((s, i) => {
    const cat = s.category || '?';
    const sub = s.subfunction || '既有唤醒词';
    (byCat[cat] = byCat[cat] || {})[sub] = (byCat[cat][sub] || []).concat([[s, i]]);
  });

  // render in categories order
  const mainEl = document.getElementById('mainContent');
  const blocks = categories.map(cat => {
    const subs = byCat[cat.name] || {};
    const subNames = Object.keys(subs).sort((a, b) => {
      const ia = Math.min(...subs[a].map(([, idx]) => idx));
      const ib = Math.min(...subs[b].map(([, idx]) => idx));
      return ia - ib;
    });
    const totalScenes = subNames.reduce((n, sn) => n + subs[sn].length, 0);
    if (!totalScenes) return '';
    const subHtml = subNames.map(sn => {
      const subScenes = subs[sn].sort((a, b) => (a[0].order ?? 9999) - (b[0].order ?? 9999));
      const baseIndex = subScenes[0][1];
      return renderSubBlock(sn, subScenes.map(([s]) => s), baseIndex);
    }).join('');
    return `<details class="cat-block" id="cat-${escapeHTML(cat.key)}" data-cat="${escapeHTML(cat.name)}">` +
      `<summary><span>${escapeHTML(cat.icon || '')}</span><span>${escapeHTML(cat.name)}</span>` +
      `<span class="count-pill">${totalScenes}</span></summary>` +
      `<div class="cat-content">${subHtml}</div></details>`;
  }).filter(Boolean);

  mainEl.innerHTML = blocks.join('') || '<div class="empty">暂无场景</div>';

  bindCopyButtons();
  bindFallbackToggle();
  bindSearch();
  updateSearchCount();
}

function bindFallbackToggle() {
  /* 移动端 WebView 偶发 <details> 不响应 click,50ms 兜底 */
  const sums = document.querySelectorAll('.cat-block > summary, .sub-block > summary, .scene-card > summary');
  sums.forEach(sum => {
    if (sum.__bound_fb) return;
    sum.__bound_fb = true;
    sum.addEventListener('click', (e) => {
      // 复制按钮被点击时,不触发 details toggle
      if (e.target.closest('.copy-btn')) return;
      const det = sum.parentElement;
      const wasOpen = det.open;
      setTimeout(() => {
        if (det.open === wasOpen) det.open = !wasOpen;
      }, 50);
    }, { passive: true });
  });
}

function bindCopyButtons() {
  document.querySelectorAll('.scene-card .copy-btn').forEach(btn => {
    if (btn.__bound) return;
    btn.__bound = true;
    btn.addEventListener('click', (e) => {
      e.preventDefault(); e.stopPropagation();
      const idx = parseInt(btn.dataset.promptIndex || '-1', 10);
      const s = DATA.data.scenes[idx];
      const text = s ? (s.prompt_template || s.prompt || '') : '';
      copyText(text, btn);
    });
  });
}

function bindSearch() {
  const input = document.getElementById('searchInput');
  if (!input) return;
  input.addEventListener('input', () => {
    const q = input.value.trim().toLowerCase();
    if (!q) {
      // 清空:恢复目录视图(全部显示 + 折叠恢复) + 隐藏命中计数
      document.querySelectorAll('.scene-card,.sub-block,.cat-block').forEach(el => el.classList.remove('hidden'));
      document.querySelectorAll('.cat-block,.sub-block').forEach(el => { el.open = false; });
      updateSearchCount();
      return;
    }
    const cards = document.querySelectorAll('.scene-card');
    let matched = 0;
    cards.forEach(card => {
      const key = (card.dataset.key || '').toLowerCase();
      const cat = (card.dataset.cat || '').toLowerCase();
      const sub = (card.dataset.sub || '').toLowerCase();
      const name = (card.querySelector('.scene-name')?.textContent || '').toLowerCase();
      const wake = (card.querySelector('.scene-wake')?.textContent || '').toLowerCase();
      const hit = !q || key.includes(q) || cat.includes(q) || sub.includes(q) || name.includes(q) || wake.includes(q);
      card.classList.toggle('hidden', !hit);
      if (hit) matched++;
    });
    // 自动展开包含匹配的 cat + sub
    document.querySelectorAll('.cat-block').forEach(cat => {
      const hasVisible = cat.querySelectorAll('.scene-card:not(.hidden)').length > 0;
      cat.classList.toggle('hidden', !hasVisible);
      cat.open = hasVisible && q.length > 0;
    });
    document.querySelectorAll('.sub-block').forEach(sub => {
      const hasVisible = sub.querySelectorAll('.scene-card:not(.hidden)').length > 0;
      sub.classList.toggle('hidden', !hasVisible);
      sub.open = hasVisible && q.length > 0;
    });
    updateSearchCount(matched);
  });
}

function updateSearchCount(matched) {
  const el = document.getElementById('hitCount');
  if (!el) return;
  const total = DATA && DATA.data ? DATA.data.scenes.length : 0;
  if (matched === undefined) {
    el.style.display = 'none';
  } else {
    el.style.display = 'inline-flex';
    el.textContent = matched === 0 ? '无匹配' : `匹配 ${matched} / ${total}`;
  }
}

render();
</script>
</body>
</html>
