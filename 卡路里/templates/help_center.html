<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📚 卡路里 · 唤醒词速查台</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:#f5f6f7; --card:#fff; --text:#1c1c1e; --sub:#6b6b6f;
  --accent:#0071e3; --green:#34c759; --border:#e5e5e7;
  --code-bg:#f0f0f2; --shadow:0 1px 2px rgba(0,0,0,.04);
}
html { scroll-behavior: smooth; }
body {
  background: var(--bg); color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
  font-size: 13px; line-height: 1.4; -webkit-font-smoothing: antialiased;
}
.container { max-width: 960px; margin: 0 auto; padding: 0 12px 40px; }

/* === HERO (紧凑) === */
.hero {
  background: linear-gradient(135deg, #fafbfc, #f0f4f8);
  padding: 8px 0 4px;
  border-bottom: 1px solid var(--border);
}
.hero h1 {
  font-size: 16px; font-weight: 700; letter-spacing: -.3px;
  line-height: 1.2;
  display: flex; align-items: center; gap: 6px;
  margin-bottom: 2px;
}
.hero .sub { color: var(--sub); font-size: 11px; margin-top: 0; line-height: 1.3; }
.hero .stats {
  margin-top: 3px; display: flex; gap: 8px; flex-wrap: wrap;
  font-size: 11px; color: var(--sub);
  line-height: 1.3;
}
.hero .stats b { color: var(--text); font-weight: 600; }

/* === STICKY CONTROLS 已删除(v2.4.10) === */

/* === CATEGORY (L1) === */
.cat-block {
  background: var(--card); border-radius: 8px;
  margin: 3px 0; box-shadow: var(--shadow); overflow: hidden;
}
.cat-block:first-of-type { margin-top: 0; }
.cat-block:last-of-type { margin-bottom: 0; }
.cat-block > summary,
.word-card > summary,
.variant-block > summary {
  cursor: pointer; list-style: none;
  display: flex; align-items: center; gap: 6px;
  /* === 移动端点击硬化(v2.4.10 抗审查修 · L1+L2+L3 全覆盖) === */
  -webkit-tap-highlight-color: transparent;
  tap-highlight-color: transparent;
  touch-action: manipulation;
  -webkit-user-select: none;
  user-select: none;
}
.cat-block > summary::-webkit-details-marker,
.word-card > summary::-webkit-details-marker,
.variant-block > summary::-webkit-details-marker { display: none; }
.cat-block > summary::before,
.word-card > summary::before,
.variant-block > summary::before {
  pointer-events: none;
}
.cat-block > summary > *,
.word-card > summary > *,
.variant-block > summary > * { pointer-events: none; }

/* === L1 cat-block 专属样式 === */
.cat-block > summary {
  padding: 7px 12px; font-size: 13px; font-weight: 600;
  background: #fafbfc;
  min-height: 36px;
}
.cat-block > summary::before {
  content: '▸'; font-size: 10px; color: var(--sub);
  transition: transform .12s;
}
.cat-block[open] > summary::before { transform: rotate(90deg); }
.cat-block > summary .count-pill {
  margin-left: auto; font-size: 10px; font-weight: 500;
  color: var(--sub); background: #e5e5e7;
  padding: 1px 6px; border-radius: 999px;
}
.cat-content { padding: 4px 12px 10px; }

/* === WAKE WORD (L2) === */
.word-card {
  background: #fff; border: 1px solid var(--border);
  border-radius: 6px; margin: 4px 0;
}
.word-card > summary {
  padding: 6px 10px; cursor: pointer; list-style: none;
  display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
}
.word-card > summary::-webkit-details-marker { display: none; }
.word-card > summary::before {
  content: '▸'; font-size: 9px; color: var(--sub);
  transition: transform .12s;
}
.word-card[open] > summary::before { transform: rotate(90deg); }
.ww-name { font-weight: 600; font-size: 13px; color: var(--text); }
.ww-aliases { font-size: 11px; color: var(--sub); }
.ww-aliases span { background: #f0f0f2; padding: 0 4px; border-radius: 3px; margin-right: 3px; }
.ww-count { margin-left: auto; font-size: 10px; color: var(--sub); }
.word-content { padding: 0 10px 8px; }
.ww-desc { color: var(--sub); font-size: 11.5px; margin: 3px 0 5px; }

/* === MAIN PROMPT === */
.prompt-main {
  background: #f0f7ff; border-left: 2px solid var(--accent);
  padding: 6px 8px; border-radius: 4px; margin: 4px 0;
  font-family: "SF Mono", Consolas, monospace; font-size: 11.5px;
  white-space: pre-wrap; word-break: break-word; line-height: 1.35;
}
.prompt-cli {
  background: var(--code-bg); padding: 3px 6px;
  border-radius: 4px; font-family: "SF Mono", Consolas, monospace;
  font-size: 11px; display: inline-block;
  margin: 2px 0; word-break: break-all; line-height: 1.3;
}

/* === VARIANTS (L3) === */
.variants-section {
  margin-top: 6px; border-top: 1px dashed var(--border); padding-top: 5px;
}
.variants-header {
  font-size: 10px; color: var(--sub); font-weight: 600;
  margin-bottom: 4px; text-transform: uppercase; letter-spacing: .3px;
}
.variant-block {
  border: 1px solid var(--border); border-radius: 5px;
  margin: 3px 0; background: #fcfcfd;
}
.variant-block > summary {
  padding: 4px 8px; cursor: pointer; list-style: none;
  display: flex; align-items: center; gap: 5px; font-size: 12px;
}
.variant-block > summary::-webkit-details-marker { display: none; }
.variant-block > summary::before {
  content: '▸'; font-size: 9px; color: var(--sub); transition: transform .12s;
}
.variant-block[open] > summary::before { transform: rotate(90deg); }
.v-label { font-weight: 500; color: var(--accent); font-size: 12px; }
.v-content { padding: 0 8px 6px; }

/* === COPY BUTTON === */
.copy-btn {
  font: inherit; font-size: 11px; padding: 4px 8px;
  border-radius: 5px; border: 1px solid var(--accent);
  background: #fff; color: var(--accent);
  cursor: pointer; margin: 3px 0; transition: all .12s;
  white-space: nowrap;
}
.copy-btn:hover { background: var(--accent); color: #fff; }
.copy-btn.copied { background: var(--green); border-color: var(--green); color: #fff; }
.copy-main { margin-left: auto; }

/* === EMPTY / FOOTER === */
.empty {
  text-align: center; padding: 24px; color: var(--sub); font-size: 13px;
}
footer {
  text-align: center; color: var(--sub); font-size: 10px;
  padding: 12px 0 0; margin-top: 16px;
}

/* === MOBILE (≤600px) === */
@media (max-width: 600px) {
  body { font-size: 12.5px; }
  .container { padding: 0 8px 60px; }
  .hero { padding: 10px 0 6px; }
  .hero h1 { font-size: 16px; }
  .hero .sub { font-size: 10.5px; }
  .hero .stats { gap: 8px; font-size: 10.5px; }
  .controls { margin: 6px -8px 8px; padding-left: 8px; padding-right: 8px; }
  .controls input[type="search"] { font-size: 12.5px; padding: 7px 10px; }
  .controls button { font-size: 11px; padding: 7px 8px; }
  .cat-block > summary { padding: 8px 10px; font-size: 12.5px; }
  .cat-content { padding: 4px 10px 8px; }
  .word-card > summary { padding: 7px 9px; }
  .word-content { padding: 0 9px 7px; }
  .ww-aliases span { display: inline-block; margin-bottom: 2px; }
  .variant-block > summary { padding: 6px 8px; }
  .copy-btn { padding: 5px 9px; font-size: 11.5px; }
  /* iOS Safari 安全区 */
  body { padding-bottom: env(safe-area-inset-bottom, 0); }
}

/* === TABLET (601-900px) === */
@media (min-width: 601px) and (max-width: 900px) {
  .container { max-width: 720px; }
}
</style>
</head>
<body>

<div class="hero"><div class="container">
  <h1>📚 卡路里 · 唤醒词速查台</h1>
  <div class="sub">v2.4.10 · 80 唤醒词 / 109 prompt · 一键复制粘贴给 AI</div>
  <div class="stats" id="heroStats"></div>
</div></div>

<div class="container">
<main id="mainContent"><div class="empty">加载中…</div></main>
<footer>卡路里技能 · 唤醒词速查台 · v2.4.10 · 2026-07-26<br>
用:展开 ▸ 类别 → 展开 ▸ 唤醒词 → 展开 ▸ 变体 → 📋 复制 → 粘贴给 AI</footer>
</div>

<!--INJECT-DATA-->

<script>
const DATA = window.__DATA__ && window.__DATA__.status === 'ok' ? window.__DATA__ : null;

function escapeHTML(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

function copyText(text, btn) {
  const after = () => {
    if (!btn) return;
    const orig = btn.textContent;
    btn.textContent = '✓';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = orig; btn.classList.remove('copied'); }, 1500);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(after).catch(() => { fallback(text); after(); });
  } else { fallback(text); after(); }
}
function fallback(text) {
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.cssText = 'position:fixed;opacity:0';
  document.body.appendChild(ta); ta.focus(); ta.select();
  try { document.execCommand('copy'); } catch(e) {}
  document.body.removeChild(ta);
}

function render() {
  if (!DATA) {
    document.getElementById('mainContent').innerHTML =
      '<div class="empty">❌ 数据加载失败</div>';
    return;
  }
  const { summary, categories, triggers } = DATA.data;

  // hero stats
  document.getElementById('heroStats').innerHTML =
    `<span><b>${summary.total_categories}</b> 类别</span>` +
    `<span><b>${summary.total_wake_words}</b> 唤醒词</span>` +
    `<span><b>${summary.total_prompts}</b> prompt</span>`;

  // group by category
  const byCat = {};
  triggers.forEach(t => { (byCat[t.category] = byCat[t.category] || []).push(t); });

  // main
  const mainEl = document.getElementById('mainContent');
  mainEl.innerHTML = categories.map(cat => {
    const items = byCat[cat.name] || [];
    if (!items.length) return '';
    return `<details class="cat-block" id="cat-${escapeHTML(cat.key)}" data-cat-name="${escapeHTML(cat.name)}">` +
      `<summary><span>${cat.icon}</span><span>${escapeHTML(cat.name)}</span>` +
      `<span class="count-pill">${items.length}</span></summary>` +
      `<div class="cat-content">${items.map(renderWordCard).join('')}</div></details>`;
  }).join('');

  bindCopyButtons();
  bindCatFallbackToggle();   /* v2.4.10 · 移动端 L1 展开兜底 */
}

/* === 移动端 L1+L2+L3 展开兜底(v2.4.10 抗审查修) ===
   背景:某些 Android WebView / 旧 iOS Safari 上 native <details> toggle
   会因 tap-highlight / 子元素吞噬 / 300ms 延迟 而偶发不响应。
   这里监听 summary 的 click,如果 50ms 后状态没翻,就强制翻。
   v2.4.10 扩展:从 L1 扩到 L1+L2+L3。 */
function bindCatFallbackToggle() {
  const sums = document.querySelectorAll(
    '.cat-block > summary, .word-card > summary, .variant-block > summary');
  sums.forEach(sum => {
    if (sum.__bound_fb) return;
    sum.__bound_fb = true;
    sum.addEventListener('click', () => {
      const det = sum.parentElement;
      const wasOpen = det.open;
      setTimeout(() => {
        if (det.open === wasOpen) {
          det.open = !wasOpen;
        }
      }, 50);
    }, { passive: true });
  });
}

function renderWordCard(t) {
  const aliases = (t.aliases || []).map(a =>
    `<span>${escapeHTML(a)}</span>`).join('');
  const variants = t.variants || [];
  const pm = t.main_prompt || {cli:'', text:''};
  return `<details class="word-card"><summary>` +
    `<span class="ww-name">${escapeHTML(t.wake_word)}</span>` +
    `${aliases ? `<span class="ww-aliases">${aliases}</span>` : ''}` +
    `<span class="ww-count">${variants.length ? variants.length + '变体' : ''}</span>` +
    `</summary><div class="word-content">` +
    `${t.desc ? `<div class="ww-desc">${escapeHTML(t.desc)}</div>` : ''}` +
    `${pm.cli ? `<div class="prompt-cli">${escapeHTML(pm.cli)}</div>` : ''}` +
    `<div class="prompt-main">${escapeHTML(pm.text)}</div>` +
    `<button class="copy-btn copy-main" data-prompt="${escapeHTML(pm.text)}">📋 复制 prompt</button>` +
    (variants.length ? `<div class="variants-section"><div class="variants-header">变体 (${variants.length})</div>` +
      variants.map(renderVariant).join('') + `</div>` : '') +
    `</div></details>`;
}

function renderVariant(v) {
  return `<details class="variant-block">` +
    `<summary><span class="v-label">${escapeHTML(v.label)}</span></summary>` +
    `<div class="v-content">` +
    `${v.cli ? `<div class="prompt-cli">${escapeHTML(v.cli)}</div>` : ''}` +
    `<div class="prompt-main">${escapeHTML(v.prompt)}</div>` +
    `<button class="copy-btn" data-prompt="${escapeHTML(v.prompt)}">📋 复制此变体 prompt</button>` +
    `</div></details>`;
}

function bindCopyButtons() {
  document.querySelectorAll('.copy-btn').forEach(btn => {
    if (btn.__bound) return;
    btn.__bound = true;
    btn.addEventListener('click', () => copyText(btn.dataset.prompt || '', btn));
  });
}

// search / expandAll / collapseAll / copyAll 已删除(v2.4.10)

render();
</script>
</body>
</html>
