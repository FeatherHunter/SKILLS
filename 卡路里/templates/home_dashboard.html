<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>卡路里</title>
<style>
/* ============================================================
   Apple 设计语言（严格遵循 · 2026-07-23）
   - 主色: iOS System Blue  #007aff
   - 灰阶: #f5f5f7 / #e5e5ea / #8e8e93 / #1d1d1d
   - 字体: 系统字体栈（-apple-system + PingFang SC）
   - 形状: 圆角 12-18px · 阴影极轻 · 留白充足
   ============================================================ */
:root{
  --bg:#ffffff;
  --bg-soft:#f5f5f7;
  --bg-section:#fafafa;
  --card:#ffffff;
  --ink:#1d1d1d;
  --ink2:#3c3c43;
  --ink3:#8e8e93;
  --line:rgba(60,60,67,.12);
  --lineS:rgba(60,60,67,.06);
  --accent:#007aff;
  --accent-soft:rgba(0,122,255,.08);
  --green:#34c759;
  --green-soft:rgba(52,199,89,.10);
  --orange:#ff9500;
  --orange-soft:rgba(255,149,0,.10);
  --red:#ff3b30;
  --red-soft:rgba(255,59,48,.10);
  --shadow-sm:0 1px 2px rgba(0,0,0,.04);
  --shadow:0 1px 3px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.04);
  --shadow-lg:0 2px 8px rgba(0,0,0,.06),0 16px 40px rgba(0,0,0,.06);
  --r-sm:8px;
  --r:14px;
  --r-lg:20px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg-section);
  color:var(--ink);
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  font-feature-settings:"tnum","ss01";
}
.wrap{max-width:960px;margin:0 auto;padding:32px 20px 80px}

/* ====== HERO ====== */
.hero{
  padding:32px 28px 28px;
  margin-bottom:20px;
}
.hero .eyebrow{
  font-size:13px;
  font-weight:600;
  letter-spacing:.4px;
  color:var(--accent);
  text-transform:uppercase;
  margin-bottom:8px;
  letter-spacing:.5px;
}
.hero h1{
  font-size:32px;
  font-weight:700;
  letter-spacing:-.4px;
  line-height:1.2;
  color:var(--ink);
  margin-bottom:6px;
}
.hero .sub{
  font-size:15px;
  color:var(--ink3);
  font-weight:400;
}
.hero .status-pill{
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:5px 12px;
  border-radius:999px;
  background:var(--green-soft);
  color:var(--green);
  font-size:13px;
  font-weight:600;
  margin-top:12px;
}
.hero .status-pill.pending{
  background:var(--orange-soft);
  color:var(--orange);
}
.hero .status-pill::before{
  content:'';
  width:6px;height:6px;
  border-radius:50%;
  background:currentColor;
}

/* ====== KPI GRID ====== */
.kpi-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
  margin-bottom:20px;
}
.kpi{
  background:var(--card);
  border-radius:var(--r);
  padding:20px 18px;
  box-shadow:var(--shadow-sm);
  border:1px solid var(--lineS);
  transition:transform .15s ease;
}
.kpi:hover{transform:translateY(-1px)}
.kpi .label{
  font-size:13px;
  color:var(--ink3);
  font-weight:500;
  margin-bottom:8px;
  display:flex;
  align-items:center;
  gap:5px;
}
.kpi .icon{
  width:18px;height:18px;
  display:inline-flex;
  align-items:center;justify-content:center;
  font-size:13px;
}
.kpi .main{
  display:flex;
  align-items:baseline;
  gap:3px;
}
.kpi .value{
  font-size:28px;
  font-weight:700;
  letter-spacing:-.7px;
  color:var(--ink);
  font-feature-settings:"tnum";
  line-height:1;
}
.kpi .unit{
  font-size:14px;
  color:var(--ink3);
  font-weight:500;
}
.kpi .detail{
  font-size:12px;
  color:var(--ink3);
  margin-top:8px;
}
.kpi .badge{
  display:inline-block;
  font-size:11px;
  font-weight:600;
  padding:2px 8px;
  border-radius:6px;
  margin-left:auto;
}
.kpi .badge.good{background:var(--green-soft);color:var(--green)}
.kpi .badge.ok{background:var(--accent-soft);color:var(--accent)}
.kpi .badge.warn{background:var(--orange-soft);color:var(--orange)}
.kpi .badge.bad{background:var(--red-soft);color:var(--red)}

/* ====== SECTION (通用卡片块) ====== */
.section{
  background:var(--card);
  border-radius:var(--r-lg);
  padding:24px 28px;
  margin-bottom:16px;
  box-shadow:var(--shadow-sm);
  border:1px solid var(--lineS);
}
.section-title{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  margin-bottom:16px;
}
.section-title h2{
  font-size:17px;
  font-weight:600;
  letter-spacing:-.2px;
  color:var(--ink);
}
.section-title .hint{
  font-size:12px;
  color:var(--ink3);
}

/* ====== TODO LIST ====== */
.todo-list{
  display:flex;
  flex-direction:column;
  gap:0;
}
.todo-row{
  display:flex;
  align-items:center;
  gap:14px;
  padding:11px 14px;
  border-top:1px solid var(--lineS);
}
.todo-row:first-child{border-top:none}
.todo-row .check{
  width:20px;height:20px;
  border-radius:50%;
  border:1.5px solid var(--line);
  display:inline-flex;
  align-items:center;justify-content:center;
  flex-shrink:0;
  color:transparent;
  font-size:13px;
  background:var(--bg-soft);
}
.todo-row.done .check{
  background:var(--green);
  border-color:var(--green);
  color:#fff;
}
.todo-row .body{
  flex:1;
}
.todo-row .label{
  font-size:14px;
  font-weight:500;
  color:var(--ink);
}
.todo-row.done .label{
  color:var(--ink3);
  text-decoration:line-through;
}
/* Q4 决策落地(ticket 16 · 2026-07-29):保留 .todo-row .meta 文案(不删)。
   理由:state icon 只表"完成/未完成"二态,meta 提供"已记录 N 条"的具体上下文。
   二者互补:icon = 视觉快照,meta = 数字细节。完全删 meta 会让 user 不知"未完成"是 0 条还是少几条。 */
.todo-row .meta{
  font-size:11.5px;
  color:var(--ink3);
  margin-top:2px;
}
.todo-row .priority{
  font-size:10.5px;
  font-weight:600;
  padding:3px 8px;
  border-radius:999px;
}
.todo-row .priority.high{background:var(--red-soft);color:var(--red)}
.todo-row .priority.medium{background:var(--orange-soft);color:var(--orange)}
.todo-row .priority.low{background:var(--bg-soft);color:var(--ink3)}
.todo-row .state{
  width:10px;height:10px;
  border-radius:50%;
  flex-shrink:0;
  margin-left:auto;
}
.todo-row.done .state{background:var(--green)}
.todo-row:not(.done) .state{background:transparent;border:2px solid var(--ink3)}
.todo-empty{
  text-align:center;
  padding:20px;
  color:var(--ink3);
  font-size:14px;
}

/* ====== LOG LIST ====== */
.log-list{
  display:flex;
  flex-direction:column;
}
.log-row{
  display:grid;
  grid-template-columns: 44px 1fr auto;
  gap:10px;
  align-items:center;
  padding:12px 0;
  border-top:1px solid var(--lineS);
}
.log-row:first-child{border-top:none}
.log-row .name{
  min-width:0;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  font-size:15px;
  color:var(--ink);
  font-weight:500;
}
.log-row .name-nutri{
  font-size:11.5px;
  color:var(--ink3);
  margin-left:6px;
}
.log-row .time, .log-row .cal{
  white-space:nowrap;
  font-variant-numeric:tabular-nums;
}
.log-row .time{
  font-size:13px;
  color:var(--ink3);
  font-feature-settings:"tnum";
  font-family:-apple-system,BlinkMacSystemFont,"SF Mono",monospace;
}
.log-row .cal{
  font-size:13px;
  color:var(--ink2);
  font-weight:500;
  font-feature-settings:"tnum";
}
.log-row .cal-intake{color:var(--accent)}
.log-row .cal-burn{color:var(--green)}
.log-empty{
  text-align:center;
  padding:20px;
  color:var(--ink3);
  font-size:13px;
}
.log-section{margin-bottom:16px}
.log-section:last-child{margin-bottom:0}
.log-section-title{
  font-size:13px;
  font-weight:600;
  color:var(--ink3);
  letter-spacing:.3px;
  text-transform:uppercase;
  margin:0 0 4px 4px;
}

/* ====== DEFICIT FORMULA (TDEE 横向公式条 · 桌面) ====== */
.deficit-formula {
  display: grid;
  grid-template-columns: 1fr auto 1fr auto 1fr auto 1fr auto 1fr;
  grid-template-areas:
    "legend legend legend legend legend legend legend legend legend"
    "tdee op-1 ex op-2 tot op-3 int op-4 def"
    "summary summary summary summary summary summary summary summary summary";
  align-items: center;
  gap: 10px 8px;
  padding: 20px 16px;
  background: var(--card);
  border-radius: var(--r-lg);
  border: 1px solid var(--lineS);
  margin: 16px 0;
}
.deficit-formula .legend {
  grid-area: legend;
  text-align: center;
  font-size: 11px;
  color: var(--ink3);
  letter-spacing: 0.5px;
  text-transform: uppercase;
  font-weight: 600;
  margin-bottom: 2px;
}
.deficit-formula .row {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  text-align: center;
  min-width: 0;
}
.deficit-formula .row .num {
  font-size: 22px;
  font-weight: 700;
  font-family: "SF Mono", Consolas, monospace;
  font-feature-settings: "tnum";
  letter-spacing: -0.5px;
  line-height: 1;
}
.deficit-formula .row .lbl {
  font-size: 11px;
  color: var(--ink3);
  white-space: nowrap;
}
.deficit-formula .op {
  font-size: 22px;
  font-weight: 400;
  color: var(--ink3);
  text-align: center;
  font-family: "SF Mono", Consolas, monospace;
}
.deficit-formula .op.op-1 { grid-area: op-1; }
.deficit-formula .op.op-2 { grid-area: op-2; }
.deficit-formula .op.op-3 { grid-area: op-3; }
.deficit-formula .op.op-4 { grid-area: op-4; }
.deficit-formula .row.tdee { grid-area: tdee; }
.deficit-formula .row.ex   { grid-area: ex; }
.deficit-formula .row.tot  { grid-area: tot; }
.deficit-formula .row.int  { grid-area: int; }
.deficit-formula .row.def  { grid-area: def; }
.deficit-formula .row.tdee .num,
.deficit-formula .row.tot  .num { color: var(--ink); }
.deficit-formula .row.ex   .num { color: var(--green); }
.deficit-formula .row.int  .num { color: var(--orange); }
.deficit-formula .row.def  .num { color: var(--red); font-size: 26px; }
.deficit-formula .row.def.neg .num { color: var(--green); }
.deficit-formula .row.def.zero .num { color: var(--ink3); }
.deficit-formula .divider { display: none; }
.deficit-formula .summary {
  grid-area: summary;
  text-align: center;
  font-size: 13px;
  color: var(--ink2);
  padding-top: 12px;
  margin-top: 4px;
  border-top: 1px dashed var(--lineS);
}
.deficit-formula .summary .kg {
  font-weight: 600;
  color: var(--green);
  font-family: "SF Mono", Consolas, monospace;
}
.deficit-formula .summary .kg.up { color: var(--red); }
.deficit-formula .summary .kg.flat { color: var(--ink3); }

/* ====== Mobile: 公式条变成 receipt 式 ====== */
@media (max-width: 600px) {
  .deficit-formula {
    display: block;
    grid-template-areas: none;
    padding: 14px 16px;
  }
  .deficit-formula .legend {
    text-align: center;
    font-size: 10px;
    color: var(--ink3);
    margin-bottom: 8px;
    text-transform: uppercase;
    font-weight: 600;
  }
  .deficit-formula .row {
    display: flex;
    flex-direction: row;            /* 显式覆盖桌面 column */
    justify-content: space-between;
    align-items: baseline;
    padding: 7px 0;
    width: 100%;
  }
  .deficit-formula .row .num {
    font-size: 16px;
    text-align: right;
    font-family: "SF Mono", Consolas, monospace;
    font-weight: 700;
    font-feature-settings: "tnum";
    min-width: 80px;
    letter-spacing: 0;
    flex-shrink: 0;
  }
  .deficit-formula .row .lbl {
    font-size: 13px;
    color: var(--ink);
    flex: 1;
    text-align: left;
  }
  .deficit-formula .row.def .num {
    font-size: 18px;
  }
  .deficit-formula .op {
    font-size: 13px;
    color: var(--sub);
    text-align: center;
    font-family: "SF Mono", Consolas, monospace;
    padding: 2px 0;
  }
  .deficit-formula .divider {
    display: block;
    border-top: 1px dashed var(--line);
    margin: 4px 0;
  }
  .deficit-formula .summary {
    text-align: center;
    margin-top: 8px;
    padding: 8px 10px;
    background: var(--bg-soft);
    border-radius: 8px;
    font-size: 13px;
    border-top: none;
  }
}

/* ====== EMPTY / ERROR / FOOTER ====== */
.empty{
  text-align:center;
  padding:48px 20px;
  background:var(--card);
  border-radius:var(--r-lg);
  border:1px solid var(--lineS);
}
.empty .icon{font-size:48px;margin-bottom:12px;color:var(--ink3)}
.empty h3{font-size:17px;font-weight:600;margin-bottom:6px;color:var(--ink)}
.empty p{font-size:13px;color:var(--ink3)}

footer{
  text-align:center;
  color:var(--ink3);
  font-size:12px;
  margin-top:32px;
  padding-top:20px;
  border-top:1px solid var(--lineS);
}

#backTop{
  position:fixed;
  bottom:24px;right:24px;
  width:42px;height:42px;
  border-radius:50%;
  background:rgba(255,255,255,.85);
  backdrop-filter:saturate(180%) blur(20px);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  border:1px solid var(--line);
  color:var(--ink);
  text-decoration:none;
  display:flex;align-items:center;justify-content:center;
  font-size:18px;font-weight:600;
  box-shadow:var(--shadow);
}

@media (max-width:640px){
  .wrap{padding:20px 16px 60px}
  .hero{padding:24px 20px 20px}
  .hero h1{font-size:26px}
  .kpi-grid{grid-template-columns:repeat(2,1fr)}
  .section{padding:18px 20px}
  .log-row{grid-template-columns: 44px 1fr auto;gap:8px}
  .log-row .cal-nutri{display:none}
  .paused-banner{justify-content:flex-start;align-items:flex-end}
  .paused-banner .paused-sub{flex-basis:100%;order:3;color:var(--accent);font-weight:600}
  .paused-banner .btn-restart{order:4;margin:0 auto}
}

/* ====== SECTION 视图卡片(ticket #2 · 2026-08-02) ====== */
.trend-chart{
  background:var(--card);border-radius:var(--r-lg);box-shadow:var(--shadow);
  padding:18px 20px;margin-bottom:20px;
}
.trend-title{font-size:14px;font-weight:700;color:var(--ink2);margin-bottom:10px}
.trend-labels{display:flex;justify-content:space-between;font-size:11px;color:var(--ink3);margin-top:6px}
.kpi .bar{height:4px;border-radius:2px;background:var(--lineS);margin-top:6px;overflow:hidden}
.kpi .bar i{display:block;height:100%;border-radius:2px;background:var(--accent)}
.kpi .bar i.good{background:var(--green)}
.kpi .bar i.warn{background:var(--orange)}
.kpi .bar i.bad{background:var(--red)}
.copy-actions{display:flex;gap:12px;justify-content:center;margin:20px 0 4px}
.copy-actions .btn{
  min-height:44px;padding:0 22px;border:none;border-radius:12px;cursor:pointer;
  background:var(--bg);border:1px solid var(--line);color:var(--ink);
  font-size:14px;font-weight:600;transition:transform .15s;
}
.copy-actions .btn:active{transform:scale(.97)}
.mini-view{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.mini-card{
  background:var(--bg-section);border:1px solid var(--lineS);border-radius:var(--r);
  padding:14px 16px;
}
.mini-card .k{font-size:13px;color:var(--ink3);margin-bottom:6px}
.mini-card .v{font-size:22px;font-weight:700;letter-spacing:-.02em}
.mini-card .v small{font-size:13px;font-weight:500;color:var(--ink3);margin-left:4px}
.mini-card .bar{height:6px;border-radius:3px;background:var(--lineS);margin-top:10px;overflow:hidden}
.mini-card .bar i{display:block;height:100%;border-radius:3px;background:var(--accent)}
.mini-card .bar i.good{background:var(--green)}
.mini-card .bar i.warn{background:var(--orange)}
.mini-card .bar i.bad{background:var(--red)}
.mini-card .sub{font-size:12px;color:var(--ink2);margin-top:8px}
.view-summary{
  margin-top:14px;padding:12px 16px;border-radius:var(--r);
  background:var(--accent-soft);color:var(--accent);font-size:14px;font-weight:600;
}
/* 2026-08-04 #66:暂停横幅(仅提示,数据照常) + 重启复制按钮(右对齐小胶囊) */
.paused-banner{
  display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--accent-soft);
  border:1px solid rgba(0,122,255,.25);border-radius:var(--r);
  padding:12px 16px;font-size:13px;font-weight:600;color:var(--accent);
  margin-bottom:12px;line-height:1.5;
}
/* 2026-08-04 #66:暂停横幅 — 信息分层卡(图标+粗标题+细副文+动作按钮) */
.paused-banner{
  display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:var(--accent-soft);
  border:1px solid rgba(0,122,255,.25);border-radius:var(--r);
  padding:14px 16px;font-size:13px;font-weight:600;color:var(--accent);
  margin-bottom:12px;line-height:1.5;
}
.paused-banner .paused-icon{font-size:20px;flex-shrink:0}
.paused-banner .paused-title{font-size:14px;font-weight:700;color:var(--accent);flex-shrink:0}
.paused-banner .paused-sub{flex:1 1 auto;min-width:0;font-size:12px;font-weight:600;color:var(--accent)}
.paused-banner .btn-restart{display:inline-flex;align-items:center;justify-content:center;gap:5px;min-height:32px;padding:4px 14px;border-radius:999px;font-size:12px;font-weight:600;cursor:pointer;border:none;background:var(--accent);color:#fff;font-family:inherit;transition:opacity .15s;flex-shrink:0;white-space:nowrap}
.paused-banner .btn-restart:hover{opacity:.85}
.paused-banner .btn-restart.copied{background:var(--green)!important}
@media (min-width:641px){.paused-banner{flex-wrap:nowrap}.paused-banner .paused-sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}}
.streak-num{font-size:44px;font-weight:800;letter-spacing:-.03em;color:var(--accent)}
.budget-remaining{font-size:30px;font-weight:800;letter-spacing:-.02em}
.budget-remaining.pos{color:var(--green)}
.budget-remaining.neg{color:var(--red)}
@media (max-width:560px){
  .mini-view{grid-template-columns:1fr}
}

  @keyframes fadeup{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
</style>
</head>
<body>
<div class="wrap">

<!-- HERO -->
<header class="hero">
  <div class="eyebrow" id="eyebrow">卡路里</div>
  <h1 id="heroTitle">今日概况</h1>
  <div class="sub" id="heroSub">加载中…</div>
  <div id="statusPill"></div>
</header>

<!-- KPI GRID (结果型 · 6 维 · ticket #2) -->
<div class="kpi-grid" id="kpiGrid"></div>

<!-- 最近 7 天趋势小图(权威清单 §1 · ticket #2) -->
<div class="trend-chart" id="trendChart"></div>

<!-- SECTION 视图:今日维度聚焦(ticket #2 · R6 呈现数据完整性) -->
<section class="section" id="secDiet" style="display:none">
  <div class="section-title"><h2>🍽️ 今日饮食</h2><span class="hint">累计热量/蛋白 vs 目标</span></div>
  <div id="dietView" class="mini-view"></div>
</section>
<section class="section" id="secExercise" style="display:none">
  <div class="section-title"><h2>🏃 今日运动</h2><span class="hint">累计消耗/时长 vs 目标</span></div>

<!--INJECT-DATA-->

<script>
const DATA = (() => {
  if (typeof window.__DATA__ !== 'object' || window.__DATA__ === null) return null;
  return window.__DATA__;
})();

function escapeHTML(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

function fmtInt(n) {
  if (n == null || isNaN(n)) return '—';
  return new Intl.NumberFormat('en-US').format(Math.round(n));
}

function pct(num, denom) {
  if (!denom) return null;
  return Math.round(num / denom * 100);
}

function barClass(p) {
  if (p == null) return '';
  if (p >= 90) return 'good';
  if (p >= 60) return 'warn';
  return 'bad';
}

function card(label, value, unit, sub, p) {
  return `
    <div class="mini-card">
      <div class="k">${escapeHTML(label)}</div>
      <div class="v">${escapeHTML(value)}<small>${escapeHTML(unit || '')}</small></div>
      ${p != null ? `<div class="bar"><i class="${barClass(p)}" style="width:${Math.min(100,p)}%"></i></div><div class="sub">完成 ${p}%</div>` : (sub ? `<div class="sub">${escapeHTML(sub)}</div>` : '')}
    </div>`;
}

function renderSection(view, date) {
  const d = DATA.data;
  // 隐藏 KPI/趋势/缺口/待办/最近记录(仅 overview 显示)
  ['kpiGrid','trendChart','deficitFormula','todoSection','recentSection'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.style.display = 'none';
  });

  const targets = {
    diet: 'secDiet', exercise: 'secExercise', weight: 'secWeight',
    goals: 'secGoals', streak: 'secStreak', budget: 'secBudget',
    week: 'secPeriod', month: 'secPeriod',
  };
  const show = document.getElementById(targets[view]);
  if (show) show.style.display = '';

  const summary = document.createElement('div');
  summary.className = 'view-summary';
  // 插入到当前视图 section 的标题后(2026-08-02 · 修正:不能插到第一个 section 后)
  const titleEl = show.querySelector('.section-title');
  titleEl.insertAdjacentElement('afterend', summary);

  if (view === 'diet') {
    const x = d.diet || {};
    const calP = x.cal_pct;
    const protP = x.protein_pct;
    document.getElementById('dietView').innerHTML =
      card('累计热量', fmtInt(x.calories), '卡', x.goal_cal != null ? `目标 ${fmtInt(x.goal_cal)} 卡` : '未设热量目标', calP) +
      card('蛋白质', (x.protein != null ? Math.round(x.protein) : '—'), 'g', x.goal_protein != null ? `目标 ${x.goal_protein} g` : '未设蛋白目标', protP);
    summary.textContent = calP != null
      ? (calP >= 100 ? '热量已达标' : calP >= 80 ? '热量接近达标' : '热量未达标') +
        (protP != null ? ' · ' + (protP >= 100 ? '蛋白达标' : protP >= 90 ? '蛋白接近达标' : '蛋白偏低') : '')
      : '未设营养目标';
  } else if (view === 'exercise') {
    const x = d.exercise || {};
    const p = x.pct;
    document.getElementById('exerciseView').innerHTML =
      card('累计消耗', fmtInt(x.burn), '卡', x.count != null ? `${x.count} 条记录` : '', p) +
      card('运动时长', x.minutes != null ? fmtInt(x.minutes) : '—', '分钟', x.goal != null ? `目标 ${fmtInt(x.goal)} 卡` : '未设运动目标', null);
    summary.textContent = p != null
      ? (p >= 100 ? '运动超额完成' : p >= 80 ? '运动已达标' : '运动量偏少')
      : (x.count ? `已记录 ${x.count} 条` : '今日暂无运动记录');
  } else if (view === 'weight') {
    const x = d.weight || {};
    document.getElementById('weightView').innerHTML =
      card('最新体重', x.latest_kg != null ? x.latest_kg.toFixed(1) : '—', 'kg',
           x.goal_kg != null ? `目标 ${x.goal_kg.toFixed(1)} kg` : '未设体重目标', null) +
      card('距目标', x.goal_diff != null ? (x.goal_diff > 0 ? '+' : '') + x.goal_diff.toFixed(1) : '—', 'kg',
           x.delta_7d != null ? `Δ7天 ${x.delta_7d > 0 ? '+' : ''}${x.delta_7d.toFixed(1)} kg` : 'Δ7天 —', null);
    summary.textContent = x.latest_kg == null
      ? '今日暂无体重记录'
      : (x.goal_diff == null
          ? '未设体重目标'
          : (x.goal_diff <= 0
              ? '体重已达目标' + (x.delta_7d != null && x.delta_7d < 0 ? ' · 仍在下降' : '')
              : '体重高于目标' + (x.delta_7d != null && x.delta_7d < 0 ? ' · 近7天在回落' : '')));
  } else if (view === 'goals') {
    const x = d.goals || {};
    // 2026-08-04 #66:暂停横幅(仅提示,数据照常) + 重启复制按钮
    const banner = x.paused
      ? '<div class="paused-banner"><span class="paused-icon">⏸️</span>' +
        '<span class="paused-title">' + (x.paused.title || '目标已暂停') + '</span>' +
        '<span class="paused-sub">' + (x.paused.sub || '') + '</span>' +
        '<button class="btn-restart" id="btnRestart" onclick="copyRestart()">🔄 重启所有目标</button></div>'
      : '';
    const items = (x.items || []).map(it =>
      card(it.label, it.actual != null ? fmtInt(it.actual) : '—', it.unit,
           it.goal != null ? `目标 ${fmtInt(it.goal)}${it.unit || ''}` : '未设', it.pct)).join('');
    document.getElementById('goalsView').innerHTML = banner + items;
    summary.textContent = (x.paused_summary || x.summary || '未设营养目标');
  } else if (view === 'streak') {
    const x = d.streak || {};
    document.getElementById('streakView').innerHTML = `
      <div class="mini-card">
        <div class="k">当前连续记录</div>
        <div class="streak-num">${x.current != null ? x.current : '—'}</div>
        <div class="sub">天</div>
      </div>
      <div class="mini-card">
        <div class="k">历史最长</div>
        <div class="streak-num" style="color:var(--ink)">${x.longest != null ? x.longest : '—'}</div>
        <div class="sub">天</div>
      </div>`;
    summary.textContent = x.summary || '暂无连续记录';
  } else if (view === 'budget') {
    const x = d.budget || {};
    const rem = x.remaining;
    const remClass = rem != null ? (rem >= 0 ? 'pos' : 'neg') : '';
    document.getElementById('budgetView').innerHTML =
      card('TDEE', x.tdee != null ? fmtInt(x.tdee) : '—', '卡', '基础消耗(含活动量)', null) +
      card('运动消耗', fmtInt(x.exercise_burn), '卡', '', null) +
      card('已摄入', fmtInt(x.intake), '卡', '', null) +
      `<div class="mini-card">
        <div class="k">剩余可吃</div>
        <div class="budget-remaining ${remClass}">${rem != null ? fmtInt(rem) : '—'}</div>
        <div class="sub">${rem != null ? (rem >= 0 ? '今日额度内' : '已超预算') : '需先设置档案'}</div>
      </div>`;
    summary.textContent = x.summary || (x.tdee == null ? '需先设置档案才能算预算' : '');
  } else if (view === 'week' || view === 'month') {
    const x = d.period || {};
    const pLabel = view === 'week' ? '本周' : '本月';
    document.getElementById('periodHint').textContent = `${x.start || ''} ~ ${x.end || ''}`;
    const wt = x.weight_change;
    document.getElementById('periodView').innerHTML =
      card(`${pLabel}饮食摄入`, fmtInt(x.diet_calories), '卡', `${x.diet_days || 0} 天有记录`, null) +
      card(`${pLabel}蛋白`, fmtInt(x.diet_protein), 'g', '', null) +
      card(`${pLabel}运动消耗`, fmtInt(x.exercise_burn), '卡', `${x.exercise_days || 0} 天有记录`, null) +
      card(`${pLabel}体重变化`, wt != null ? (wt > 0 ? '+' : '') + wt.toFixed(1) : '—', 'kg', x.weight_start != null ? `${x.weight_start} → ${x.weight_end} kg` : '区间无体重记录', null);
    summary.textContent = wt != null
      ? (wt < 0 ? '体重下降' : wt > 0 ? '体重上升' : '体重持平') +
        (x.diet_days >= 5 ? ' · 记录稳定' : '')
      : `${pLabel}暂无体重记录`;
  }
}

function statusBadge(num, denom, reverse) {
  if (num == null) return ['ok', '—'];
  const p = pct(num, denom);
  if (p == null) return ['ok', '—'];
  if (reverse) {
    if (p >= 90 && p <= 110) return ['good', `${p}%`];
    if (p < 70 || p > 130) return ['bad', `${p}%`];
    return ['warn', `${p}%`];
  } else {
    if (p >= 70) return ['good', `${p}%`];
    if (p >= 40) return ['warn', `${p}%`];
    return ['bad', `${p}%`];
  }
}

function render() {
  if (!DATA || DATA.status !== 'ok') {
    document.querySelector('.hero h1').textContent = '数据加载失败';
    document.querySelector('.hero .sub').textContent = (DATA && DATA.message) || 'window.__DATA__ 缺失';
    return;
  }

  const { date, view, dashboard: D, today_status, recent_logs } = DATA.data;

  // HERO(按视图场景名 · R4 自描述)
  const scene = (DATA.data.meta && DATA.data.meta.wake_word) || '看今日主页';
  document.getElementById('heroTitle').textContent = scene;
  document.getElementById('heroSub').textContent = `${date} · 卡路里主面板`;
  document.getElementById('eyebrow').textContent = '卡路里';

  // 视图分派(ticket #2 · 9 场景)
  if (view === 'diet' || view === 'exercise' || view === 'weight' ||
      view === 'goals' || view === 'streak' || view === 'budget' ||
      view === 'week' || view === 'month') {
    renderSection(view, date);
    return;
  }

  // STATUS PILL
  const todoCount = today_status.todo.length;
  const pill = document.getElementById('statusPill');
  if (todoCount === 0) {
    pill.className = 'status-pill';
    pill.textContent = '今日全部完成 ✓';
  } else {
    pill.className = 'status-pill pending';
    pill.textContent = `${todoCount} 项待办`;
  }

  // 6 KPI GRID + 趋势小图(权威清单 §1 · 2026-08-02 ticket #2)
  const home = DATA.data.home || {};
  const df = D.deficit || {};
  const kpis = home.kpis || [];
  const trend = home.trend || [];
  if (kpis.length) {
    document.getElementById('kpiGrid').innerHTML = kpis.map(k => `
      <div class="kpi">
        <div class="label"><span class="icon">${k.icon}</span>${k.label}${k.pct != null ? `<span class="badge ${barClass(k.pct)}">${k.pct}%</span>` : ''}</div>
        <div class="main"><span class="value">${escapeHTML(String(k.value))}</span><span class="unit">${escapeHTML(k.unit || '')}</span></div>
        ${k.pct != null ? `<div class="bar"><i class="${barClass(k.pct)}" style="width:${Math.min(100,k.pct)}%"></i></div>` : ''}
        ${k.detail ? `<div class="detail">${escapeHTML(k.detail)}</div>` : ''}
      </div>
    `).join('');

    // 趋势小图(最近 7 天饮食热量 · 内联 SVG)
    const trendEl = document.getElementById('trendChart');
    if (trendEl) {
      const calData = trend.map(t => t.calories || 0);
      const max = Math.max(...calData, 1);
      const W = 300, H = 60, bw = W / Math.max(trend.length, 1);
      const pts = calData.map((v, i) => `${(i * bw + bw / 2).toFixed(1)},${(H - (v / max) * (H - 8) - 4).toFixed(1)}`).join(' ');
      trendEl.innerHTML = `
        <div class="trend-title">📈 最近 7 天摄入趋势</div>
        <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:100%;height:60px">
          <polyline points="${pts}" fill="none" stroke="#007aff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          <g fill="#007aff">
            ${calData.map((v, i) => `<circle cx="${(i * bw + bw / 2).toFixed(1)}" cy="${(H - (v / max) * (H - 8) - 4).toFixed(1)}" r="3"/>`).join('')}
          </g>
        </svg>
        <div class="trend-labels">${trend.map(t => `<span>${t.date.slice(5)}</span>`).join('')}</div>`;
    }

    // 一句话总结(R6 · overview 顶部)
    const summary = document.createElement('div');
    summary.className = 'view-summary';
    summary.textContent = home.summary || '';
    document.getElementById('heroTitle').insertAdjacentElement('afterend', summary);
  } else {
    document.getElementById('kpiGrid').innerHTML = '';
  }

// 缺口公式条(全宽,横向展示)
  const formula = document.getElementById('deficitFormula');
  if (df.bmr != null && df.avg_exercise_burn != null && df.avg_intake != null) {
    formula.style.display = '';
    document.getElementById('formulaTDEE').textContent = fmtInt(df.bmr);
    document.getElementById('formulaExercise').textContent = fmtInt(df.avg_exercise_burn);
    document.getElementById('formulaTotalBurn').textContent = fmtInt(df.bmr + df.avg_exercise_burn);
    document.getElementById('formulaIntake').textContent = fmtInt(df.avg_intake);
    const deficitEl = document.getElementById('formulaDeficit');
    deficitEl.textContent = (df.avg_deficit > 0 ? '−' : '+') + fmtInt(Math.abs(df.avg_deficit));
    deficitEl.parentElement.className = 'row def ' + (df.avg_deficit > 0 ? 'pos' : df.avg_deficit < 0 ? 'neg' : 'zero');
    const summary = document.getElementById('formulaSummary');
    if (df.kg_equivalent != null && df.days_count) {
      const kgSign = df.kg_equivalent > 0 ? '减重' : df.kg_equivalent < 0 ? '增重' : '持平';
      const kgClass = df.kg_equivalent > 0 ? 'down' : df.kg_equivalent < 0 ? 'up' : 'flat';
      summary.innerHTML = `→ 理论体重变化 · <span class="kg ${kgClass}">${kgSign} ${Math.abs(df.kg_equivalent).toFixed(2)} kg</span> · ${df.days_count === 1 ? '本日' : df.days_count + ' 天'}`;
    } else {
      summary.textContent = '';
    }
  } else {
    formula.style.display = 'none';
  }

  // TODO LIST
  const todoContainer = document.getElementById('todoContainer');
  const todoHint = document.getElementById('todoHint');
  const todos = today_status.todo;
  const logs = {
    food: today_status.food.count,
    water: today_status.water.count,
    exercise: today_status.exercise.count,
    weight: today_status.weight.count,
  };
  if (todos.length === 0) {
    // 2026-08-09 信息重复审查:完成状态由 statusPill 唯一表达,待办区空时隐藏
    const ts = document.getElementById('todoSection');
    if (ts) ts.style.display = 'none';
  } else {
    todoHint.textContent = `${todos.length} 项待完成`;
    const allKeys = ['food', 'water', 'exercise', 'weight'];
    const labels = {food: '饮食', water: '饮水', exercise: '运动', weight: '体重'};
    todoContainer.innerHTML = '<div class="todo-list">' + allKeys.map(k => {
      const done = logs[k] > 0;
      const todo = todos.find(t => t.key === k);
      const label = labels[k];
      const meta = done
        ? `已记录 ${logs[k]} 条`
        : (todo ? '今日未记录' : '今日未记录');
      return `
        <div class="todo-row ${done ? 'done' : ''}">
          <span class="check">✓</span>
          <div class="body">
            <div class="label">记录${label}</div>
            <div class="meta">${escapeHTML(meta)}</div>
          </div>
          ${!done && todo ? `<span class="priority ${todo.priority}">${todo.priority === 'high' ? '高' : todo.priority === 'medium' ? '中' : '低'}</span>` : ''}
          <span class="state"></span>
        </div>
      `;
    }).join('') + '</div>';
  }

  // RECENT LOGS — Food
  const foodLog = document.getElementById('foodLog');
  if (recent_logs.foods && recent_logs.foods.length) {
    foodLog.innerHTML = '<div class="log-list">' + recent_logs.foods.map(f => `
      <div class="log-row">
        <div class="time">${escapeHTML((f.time || '—').slice(0,5))}</div>
        <div class="name">${escapeHTML(f.name)}<span class="name-nutri">蛋白 ${fmtInt(f.protein)}g</span></div>
        <div class="cal cal-intake">+${fmtInt(f.calories)} 卡</div>
      </div>
    `).join('') + '</div>';
  } else {
    foodLog.innerHTML = '<div class="log-empty">暂无饮食记录</div>';
  }

  // RECENT LOGS — Exercise
  const exerciseLog = document.getElementById('exerciseLog');
  if (recent_logs.exercises && recent_logs.exercises.length) {
    exerciseLog.innerHTML = '<div class="log-list">' + recent_logs.exercises.map(e => `
      <div class="log-row">
        <div class="time">${escapeHTML((e.time || '—').slice(0,5))}</div>
        <div class="name">${escapeHTML(e.type)}${e.minutes ? `<span class="name-nutri">${e.minutes} 分钟</span>` : ''}</div>
        <div class="cal cal-burn">−${fmtInt(e.calories)} 卡</div>
      </div>
    `).join('') + '</div>';
  } else {
    exerciseLog.innerHTML = '<div class="log-empty">暂无运动记录</div>';
  }
}

// R2 传输层双按钮:复制数据(用户口径)/ 复制日志(排障口径)(2026-08-02 ticket #2)
(function() {
  function showToast(msg){var t=document.createElement('div');t.style.cssText='position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0));transform:translateX(-50%) scale(.9);opacity:0;background:rgba(28,28,30,.94);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);color:#f0f0f0;border-radius:14px;padding:13px 14px 13px 16px;display:flex;align-items:flex-start;gap:12px;max-width:min(480px,calc(100vw - 24px));min-width:300px;box-shadow:0 10px 32px rgba(0,0,0,.32),0 0 0 .5px rgba(255,255,255,.08) inset;z-index:9999;transition:opacity .22s ease-out,transform .22s cubic-bezier(.34,1.56,.64,1)';t.innerHTML='<div style="font-size:20px;line-height:1;padding-top:1px;flex-shrink:0">📋</div><div style="flex:1;min-width:0"><div style="font-weight:600;font-size:12.5px;line-height:1.4;color:#fff;margin-bottom:2px">已复制 <em style="font-style:normal;color:#34c759;font-weight:600">'+msg+'</em></div><div style="font-size:11px;line-height:1.5;color:#c8c8cc">粘贴给 AI,卡路里技能会自动执行这个流程,完成后你会拿到结果 HTML + 一句话总结。</div></div><button style="background:rgba(255,255,255,.10);color:#34c759;border:0;border-radius:8px;padding:5px 9px;font-size:10.5px;font-weight:500;cursor:pointer;white-space:nowrap;margin-left:6px;flex-shrink:0">✓ 知道了</button>';document.body.appendChild(t);requestAnimationFrame(function(){t.style.opacity='1';t.style.transform='translateX(-50%) scale(1)';});var close=function(){t.style.opacity='0';t.style.transform='translateX(-50%) scale(.9)';setTimeout(function(){t.remove();},220);};t.querySelector('button').addEventListener('click',close);setTimeout(close,4500);}
  function fallbackCopy(text) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.focus(); ta.select();
    try { document.execCommand('copy'); } catch(e) {}
    document.body.removeChild(ta);
  }
  function copyText(text, btn, okMsg) {
    const after = () => showToast(okMsg);
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(after).catch(() => { fallbackCopy(text); after(); });
    } else { fallbackCopy(text); after(); }
  }
  // 2026-08-04 #66:暂停横幅「重启所有目标」按钮 — 无歧义指令(直接执行,不追问)
  window.copyRestart = function () {
    const x = (DATA && DATA.data && DATA.data.goals) || {};
    const at = x.paused ? ('(暂停于 ' + (x.paused.paused_at || '?') + ')') : '';
    const text = '我已确认重启所有目标' + at + ',请按「重启所有目标」流程恢复全部目标考核。直接执行写库,无需向我确认。完成后给 1 句话总结。';
    copyText(text, document.getElementById('btnRestart'), '✓ 重启指令已复制');
  };
  function buildDataText() {
    const d = (DATA && DATA.data) || {};
    const meta = d.meta || {};
    const lines = [`${meta.wake_word || '看今日主页'}(${d.date})`, ''];
    document.querySelectorAll('.mini-card').forEach(c => {
      const k = c.querySelector('.k')?.textContent || '';
      const v = c.querySelector('.v')?.textContent || '';
      const sub = c.querySelector('.sub')?.textContent || '';
      lines.push(`${k}: ${v}${sub ? ' ' + sub : ''}`);
    });
    const summary = document.querySelector('.view-summary');
    if (summary) lines.push('', `总结: ${summary.textContent}`);
    return lines.join('\n');
  }
  function buildLogText() {
    const d = (DATA && DATA.data) || {};
    const meta = d.meta || {};
    const lines = [`[${meta.wake_word || '看今日主页'} 排障日志]`, ''];
    lines.push(`唤醒词: ${meta.wake_word || '(未知)'}`);
    lines.push(`视图: ${meta.view || '(未知)'}`);
    lines.push(`渲染时间: ${meta.fetched_at || '(未知)'}`);
    lines.push(`AI 思考链: ${meta.chain || '(未注入 · 渲染时未传 --chain)'}`);
    lines.push('');
    lines.push(`原始数据:`);
    lines.push(JSON.stringify(d, null, 2));
    return lines.join('\n');
  }
  const dataBtn = document.getElementById('copyDataBtn');
  const logBtn = document.getElementById('copyLogBtn');
  if (dataBtn) dataBtn.onclick = function() { copyText(buildDataText(), this, '数据复制成功 ✓'); };
  if (logBtn) logBtn.onclick = function() { copyText(buildLogText(), this, '排障日志复制成功 ✓ 可将日志发给开发者/AI 定位问题'); };
})();

render();
</script>
</body>
</html>
