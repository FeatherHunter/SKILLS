<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>卡路里</title>
<style>
/* ============================================================
   Apple 设计语言（严格遵循 · 2026-07-23）
   - 主色: iOS System Blue  #007aff
   - 灰阶: #f5f5f7 / #e5e5ea / #8e8e93 / #1d1d1d
   - 字体: 系统字体栈（-apple-system + PingFang SC）
   - 形状: 圆角 12-18px · 阴影极轻 · 留白充足
   ============================================================ */
:root{
  --bg:#ffffff;
  --bg-soft:#f5f5f7;
  --bg-section:#fafafa;
  --card:#ffffff;
  --ink:#1d1d1d;
  --ink2:#3c3c43;
  --ink3:#8e8e93;
  --line:rgba(60,60,67,.12);
  --lineS:rgba(60,60,67,.06);
  --accent:#007aff;
  --accent-soft:rgba(0,122,255,.08);
  --green:#34c759;
  --green-soft:rgba(52,199,89,.10);
  --orange:#ff9500;
  --orange-soft:rgba(255,149,0,.10);
  --red:#ff3b30;
  --red-soft:rgba(255,59,48,.10);
  --shadow-sm:0 1px 2px rgba(0,0,0,.04);
  --shadow:0 1px 3px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.04);
  --shadow-lg:0 2px 8px rgba(0,0,0,.06),0 16px 40px rgba(0,0,0,.06);
  --r-sm:8px;
  --r:14px;
  --r-lg:20px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg-section);
  color:var(--ink);
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  font-feature-settings:"tnum","ss01";
}
.wrap{max-width:960px;margin:0 auto;padding:32px 20px 80px}

/* ====== HERO ====== */
.hero{
  padding:32px 28px 28px;
  margin-bottom:20px;
}
.hero .eyebrow{
  font-size:13px;
  font-weight:600;
  letter-spacing:.4px;
  color:var(--accent);
  text-transform:uppercase;
  margin-bottom:8px;
  letter-spacing:.5px;
}
.hero h1{
  font-size:32px;
  font-weight:700;
  letter-spacing:-.4px;
  line-height:1.2;
  color:var(--ink);
  margin-bottom:6px;
}
.hero .sub{
  font-size:15px;
  color:var(--ink3);
  font-weight:400;
}
.hero .status-pill{
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:5px 12px;
  border-radius:999px;
  background:var(--green-soft);
  color:var(--green);
  font-size:13px;
  font-weight:600;
  margin-top:12px;
}
.hero .status-pill.pending{
  background:var(--orange-soft);
  color:var(--orange);
}
.hero .status-pill::before{
  content:'';
  width:6px;height:6px;
  border-radius:50%;
  background:currentColor;
}

/* ====== KPI GRID ====== */
.kpi-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
  margin-bottom:20px;
}
.kpi{
  background:var(--card);
  border-radius:var(--r);
  padding:20px 18px;
  box-shadow:var(--shadow-sm);
  border:1px solid var(--lineS);
  transition:transform .15s ease;
}
.kpi:hover{transform:translateY(-1px)}
.kpi .label{
  font-size:13px;
  color:var(--ink3);
  font-weight:500;
  margin-bottom:8px;
  display:flex;
  align-items:center;
  gap:5px;
}
.kpi .icon{
  width:18px;height:18px;
  display:inline-flex;
  align-items:center;justify-content:center;
  font-size:13px;
}
.kpi .main{
  display:flex;
  align-items:baseline;
  gap:3px;
}
.kpi .value{
  font-size:28px;
  font-weight:700;
  letter-spacing:-.7px;
  color:var(--ink);
  font-feature-settings:"tnum";
  line-height:1;
}
.kpi .unit{
  font-size:14px;
  color:var(--ink3);
  font-weight:500;
}
.kpi .detail{
  font-size:12px;
  color:var(--ink3);
  margin-top:8px;
}
.kpi .badge{
  display:inline-block;
  font-size:11px;
  font-weight:600;
  padding:2px 8px;
  border-radius:6px;
  margin-left:auto;
}
.kpi .badge.good{background:var(--green-soft);color:var(--green)}
.kpi .badge.ok{background:var(--accent-soft);color:var(--accent)}
.kpi .badge.warn{background:var(--orange-soft);color:var(--orange)}
.kpi .badge.bad{background:var(--red-soft);color:var(--red)}

/* ====== SECTION (通用卡片块) ====== */
.section{
  background:var(--card);
  border-radius:var(--r-lg);
  padding:24px 28px;
  margin-bottom:16px;
  box-shadow:var(--shadow-sm);
  border:1px solid var(--lineS);
}
.section-title{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  margin-bottom:16px;
}
.section-title h2{
  font-size:17px;
  font-weight:600;
  letter-spacing:-.2px;
  color:var(--ink);
}
.section-title .hint{
  font-size:12px;
  color:var(--ink3);
}

/* ====== TODO LIST ====== */
.todo-list{
  display:flex;
  flex-direction:column;
  gap:0;
}
.todo-row{
  display:flex;
  align-items:center;
  gap:14px;
  padding:11px 14px;
  border-top:1px solid var(--lineS);
}
.todo-row:first-child{border-top:none}
.todo-row .check{
  width:20px;height:20px;
  border-radius:50%;
  border:1.5px solid var(--line);
  display:inline-flex;
  align-items:center;justify-content:center;
  flex-shrink:0;
  color:transparent;
  font-size:13px;
  background:var(--bg-soft);
}
.todo-row.done .check{
  background:var(--green);
  border-color:var(--green);
  color:#fff;
}
.todo-row .body{
  flex:1;
}
.todo-row .label{
  font-size:14px;
  font-weight:500;
  color:var(--ink);
}
.todo-row.done .label{
  color:var(--ink3);
  text-decoration:line-through;
}
/* Q4 决策落地(ticket 16 · 2026-07-29):保留 .todo-row .meta 文案(不删)。
   理由:state icon 只表"完成/未完成"二态,meta 提供"已记录 N 条"的具体上下文。
   二者互补:icon = 视觉快照,meta = 数字细节。完全删 meta 会让 user 不知"未完成"是 0 条还是少几条。 */
.todo-row .meta{
  font-size:11.5px;
  color:var(--ink3);
  margin-top:2px;
}
.todo-row .priority{
  font-size:10.5px;
  font-weight:600;
  padding:3px 8px;
  border-radius:999px;
}
.todo-row .priority.high{background:var(--red-soft);color:var(--red)}
.todo-row .priority.medium{background:var(--orange-soft);color:var(--orange)}
.todo-row .priority.low{background:var(--bg-soft);color:var(--ink3)}
.todo-row .state{
  width:10px;height:10px;
  border-radius:50%;
  flex-shrink:0;
  margin-left:auto;
}
.todo-row.done .state{background:var(--green)}
.todo-row:not(.done) .state{background:transparent;border:2px solid var(--ink3)}
.todo-empty{
  text-align:center;
  padding:20px;
  color:var(--ink3);
  font-size:14px;
}

/* ====== LOG LIST ====== */
.log-list{
  display:flex;
  flex-direction:column;
}
.log-row{
  display:grid;
  grid-template-columns: 44px 1fr auto;
  gap:10px;
  align-items:center;
  padding:12px 0;
  border-top:1px solid var(--lineS);
}
.log-row:first-child{border-top:none}
.log-row .name{
  min-width:0;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  font-size:15px;
  color:var(--ink);
  font-weight:500;
}
.log-row .name-nutri{
  font-size:11.5px;
  color:var(--ink3);
  margin-left:6px;
}
.log-row .time, .log-row .cal{
  white-space:nowrap;
  font-variant-numeric:tabular-nums;
}
.log-row .time{
  font-size:13px;
  color:var(--ink3);
  font-feature-settings:"tnum";
  font-family:-apple-system,BlinkMacSystemFont,"SF Mono",monospace;
}
.log-row .cal{
  font-size:13px;
  color:var(--ink2);
  font-weight:500;
  font-feature-settings:"tnum";
}
.log-row .cal-intake{color:var(--accent)}
.log-row .cal-burn{color:var(--green)}
.log-empty{
  text-align:center;
  padding:20px;
  color:var(--ink3);
  font-size:13px;
}
.log-section{margin-bottom:16px}
.log-section:last-child{margin-bottom:0}
.log-section-title{
  font-size:13px;
  font-weight:600;
  color:var(--ink3);
  letter-spacing:.3px;
  text-transform:uppercase;
  margin:0 0 4px 4px;
}

/* ====== DEFICIT FORMULA (TDEE 横向公式条 · 桌面) ====== */
.deficit-formula {
  display: grid;
  grid-template-columns: 1fr auto 1fr auto 1fr auto 1fr auto 1fr;
  grid-template-areas:
    "legend legend legend legend legend legend legend legend legend"
    "tdee op-1 ex op-2 tot op-3 int op-4 def"
    "summary summary summary summary summary summary summary summary summary";
  align-items: center;
  gap: 10px 8px;
  padding: 20px 16px;
  background: var(--card);
  border-radius: var(--r-lg);
  border: 1px solid var(--lineS);
  margin: 16px 0;
}
.deficit-formula .legend {
  grid-area: legend;
  text-align: center;
  font-size: 11px;
  color: var(--ink3);
  letter-spacing: 0.5px;
  text-transform: uppercase;
  font-weight: 600;
  margin-bottom: 2px;
}
.deficit-formula .row {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  text-align: center;
  min-width: 0;
}
.deficit-formula .row .num {
  font-size: 22px;
  font-weight: 700;
  font-family: "SF Mono", Consolas, monospace;
  font-feature-settings: "tnum";
  letter-spacing: -0.5px;
  line-height: 1;
}
.deficit-formula .row .lbl {
  font-size: 11px;
  color: var(--ink3);
  white-space: nowrap;
}
.deficit-formula .op {
  font-size: 22px;
  font-weight: 400;
  color: var(--ink3);
  text-align: center;
  font-family: "SF Mono", Consolas, monospace;
}
.deficit-formula .op.op-1 { grid-area: op-1; }
.deficit-formula .op.op-2 { grid-area: op-2; }
.deficit-formula .op.op-3 { grid-area: op-3; }
.deficit-formula .op.op-4 { grid-area: op-4; }
.deficit-formula .row.tdee { grid-area: tdee; }
.deficit-formula .row.ex   { grid-area: ex; }
.deficit-formula .row.tot  { grid-area: tot; }
.deficit-formula .row.int  { grid-area: int; }
.deficit-formula .row.def  { grid-area: def; }
.deficit-formula .row.tdee .num,
.deficit-formula .row.tot  .num { color: var(--ink); }
.deficit-formula .row.ex   .num { color: var(--green); }
.deficit-formula .row.int  .num { color: var(--orange); }
.deficit-formula .row.def  .num { color: var(--red); font-size: 26px; }
.deficit-formula .row.def.neg .num { color: var(--green); }
.deficit-formula .row.def.zero .num { color: var(--ink3); }
.deficit-formula .divider { display: none; }
.deficit-formula .summary {
  grid-area: summary;
  text-align: center;
  font-size: 13px;
  color: var(--ink2);
  padding-top: 12px;
  margin-top: 4px;
  border-top: 1px dashed var(--lineS);
}
.deficit-formula .summary .kg {
  font-weight: 600;
  color: var(--green);
  font-family: "SF Mono", Consolas, monospace;
}
.deficit-formula .summary .kg.up { color: var(--red); }
.deficit-formula .summary .kg.flat { color: var(--ink3); }

/* ====== Mobile: 公式条变成 receipt 式 ====== */
@media (max-width: 600px) {
  .deficit-formula {
    display: block;
    grid-template-areas: none;
    padding: 14px 16px;
  }
  .deficit-formula .legend {
    text-align: center;
    font-size: 10px;
    color: var(--ink3);
    margin-bottom: 8px;
    text-transform: uppercase;
    font-weight: 600;
  }
  .deficit-formula .row {
    display: flex;
    flex-direction: row;            /* 显式覆盖桌面 column */
    justify-content: space-between;
    align-items: baseline;
    padding: 7px 0;
    width: 100%;
  }
  .deficit-formula .row .num {
    font-size: 16px;
    text-align: right;
    font-family: "SF Mono", Consolas, monospace;
    font-weight: 700;
    font-feature-settings: "tnum";
    min-width: 80px;
    letter-spacing: 0;
    flex-shrink: 0;
  }
  .deficit-formula .row .lbl {
    font-size: 13px;
    color: var(--ink);
    flex: 1;
    text-align: left;
  }
  .deficit-formula .row.def .num {
    font-size: 18px;
  }
  .deficit-formula .op {
    font-size: 13px;
    color: var(--sub);
    text-align: center;
    font-family: "SF Mono", Consolas, monospace;
    padding: 2px 0;
  }
  .deficit-formula .divider {
    display: block;
    border-top: 1px dashed var(--line);
    margin: 4px 0;
  }
  .deficit-formula .summary {
    text-align: center;
    margin-top: 8px;
    padding: 8px 10px;
    background: var(--bg-soft);
    border-radius: 8px;
    font-size: 13px;
    border-top: none;
  }
}

/* ====== EMPTY / ERROR / FOOTER ====== */
.empty{
  text-align:center;
  padding:48px 20px;
  background:var(--card);
  border-radius:var(--r-lg);
  border:1px solid var(--lineS);
}
.empty .icon{font-size:48px;margin-bottom:12px;color:var(--ink3)}
.empty h3{font-size:17px;font-weight:600;margin-bottom:6px;color:var(--ink)}
.empty p{font-size:13px;color:var(--ink3)}

footer{
  text-align:center;
  color:var(--ink3);
  font-size:12px;
  margin-top:32px;
  padding-top:20px;
  border-top:1px solid var(--lineS);
}

#backTop{
  position:fixed;
  bottom:24px;right:24px;
  width:42px;height:42px;
  border-radius:50%;
  background:rgba(255,255,255,.85);
  backdrop-filter:saturate(180%) blur(20px);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  border:1px solid var(--line);
  color:var(--ink);
  text-decoration:none;
  display:flex;align-items:center;justify-content:center;
  font-size:18px;font-weight:600;
  box-shadow:var(--shadow);
}

@media (max-width:640px){
  .wrap{padding:20px 16px 60px}
  .hero{padding:24px 20px 20px}
  .hero h1{font-size:26px}
  .kpi-grid{grid-template-columns:repeat(2,1fr)}
  .section{padding:18px 20px}
  .log-row{grid-template-columns: 44px 1fr auto;gap:8px}
  .log-row .cal-nutri{display:none}
}
</style>
</head>
<body>
<div class="wrap">

<!-- HERO -->
<header class="hero">
  <div class="eyebrow" id="eyebrow">卡路里</div>
  <h1 id="heroTitle">今日概况</h1>
  <div class="sub" id="heroSub">加载中…</div>
  <div id="statusPill"></div>
</header>

<!-- KPI GRID (结果型 · 4 维) -->
<div class="kpi-grid" id="kpiGrid"></div>

<!-- 缺口公式条(全宽 · 横向展示 TDEE 数学) -->
<div class="deficit-formula" id="deficitFormula" style="display:none">
  <div class="legend">📉 热量缺口公式 · 决定体重变化速度</div>
  <div class="row tdee"><span class="lbl">基础代谢 TDEE</span><span class="num" id="formulaTDEE">—</span></div>
  <div class="op op-1">+</div>
  <div class="row ex"><span class="lbl">运动消耗</span><span class="num" id="formulaExercise">—</span></div>
  <div class="op op-2">=</div>
  <div class="row tot"><span class="lbl">应烧总热</span><span class="num" id="formulaTotalBurn">—</span></div>
  <div class="op op-3">−</div>
  <div class="row int"><span class="lbl">实际摄入</span><span class="num" id="formulaIntake">—</span></div>
  <div class="divider"></div>
  <div class="row def pos"><span class="lbl">缺口 千卡/日</span><span class="num" id="formulaDeficit">—</span></div>
  <div class="summary" id="formulaSummary"></div>
</div>

<!-- TODO LIST (过程型 · AI 协同模式) -->
<section class="section">
  <div class="section-title">
    <h2>今日待办</h2>
    <span class="hint" id="todoHint"></span>
  </div>
  <div id="todoContainer"></div>
</section>

<!-- RECENT LOGS (结果型) -->
<section class="section">
  <div class="section-title">
    <h2>最近记录</h2>
    <span class="hint">最近 5 条</span>
  </div>
  <div class="log-section">
    <div class="log-section-title">🍽️ 饮食</div>
    <div id="foodLog"></div>
  </div>
  <div class="log-section">
    <div class="log-section-title">🏃 运动</div>
    <div id="exerciseLog"></div>
  </div>
</section>

<footer>卡路里 Skill · 主面板 · 2026-07-23</footer>

</div>
<a id="backTop" href="#top" title="回到顶部">↑</a>

<!--INJECT-DATA-->

<script>
const DATA = (() => {
  if (typeof window.__DATA__ !== 'object' || window.__DATA__ === null) return null;
  return window.__DATA__;
})();

function escapeHTML(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

function fmtInt(n) {
  if (n == null || isNaN(n)) return '—';
  return new Intl.NumberFormat('en-US').format(Math.round(n));
}

function pct(num, denom) {
  if (!denom) return null;
  return Math.round(num / denom * 100);
}

function statusBadge(num, denom, reverse) {
  if (num == null) return ['ok', '—'];
  const p = pct(num, denom);
  if (p == null) return ['ok', '—'];
  if (reverse) {
    if (p >= 90 && p <= 110) return ['good', `${p}%`];
    if (p < 70 || p > 130) return ['bad', `${p}%`];
    return ['warn', `${p}%`];
  } else {
    if (p >= 70) return ['good', `${p}%`];
    if (p >= 40) return ['warn', `${p}%`];
    return ['bad', `${p}%`];
  }
}

function render() {
  if (!DATA || DATA.status !== 'ok') {
    document.querySelector('.hero h1').textContent = '数据加载失败';
    document.querySelector('.hero .sub').textContent = (DATA && DATA.message) || 'window.__DATA__ 缺失';
    return;
  }

  const { date, dashboard: D, today_status, recent_logs } = DATA.data;

  // HERO
  document.getElementById('heroTitle').textContent = `${date} 卡路里`;
  document.getElementById('heroSub').textContent = '今日概况 · 健康指标 · 待办与最近记录';

  // STATUS PILL
  const todoCount = today_status.todo.length;
  const pill = document.getElementById('statusPill');
  if (todoCount === 0) {
    pill.className = 'status-pill';
    pill.textContent = '今日全部完成 ✓';
  } else {
    pill.className = 'status-pill pending';
    pill.textContent = `${todoCount} 项待办`;
  }

  // 4 KPI GRID
  const cal = D.calorie || {};
  const ex = D.exercise || {};
  const wt = D.weight || {};
  const df = D.deficit || {};

  const calPct = pct(cal.avg_cal, cal.cal_goal);
  const exBadge = (ex.coverage_pct != null)
    ? (ex.coverage_pct >= 70 ? ['good', `${ex.coverage_pct}%`] : ex.coverage_pct >= 40 ? ['warn', `${ex.coverage_pct}%`] : ['bad', `${ex.coverage_pct}%`])
    : ['ok', '—'];
  const wtBadge = (() => {
    if (wt.trend === 'down') return ['good', '↓'];
    if (wt.trend === 'up') return ['warn', '↑'];
    return ['ok', '→'];
  })();

  document.getElementById('kpiGrid').innerHTML = `
    <div class="kpi">
      <div class="label"><span class="icon">🔥</span>摄入<span class="badge ${statusBadge(calPct, 100, true)[0]}">${calPct != null ? calPct + '%' : ''}</span></div>
      <div class="main"><span class="value">${fmtInt(cal.avg_cal)}</span><span class="unit">卡/日</span></div>
      <div class="detail">目标 ${fmtInt(cal.cal_goal)} · 合规 ${cal.compliance_days || 0}/${cal.days_count || 0} 天</div>
    </div>
    <div class="kpi">
      <div class="label"><span class="icon">🏃</span>运动<span class="badge ${exBadge[0]}">${exBadge[1]}</span></div>
      <div class="main"><span class="value">${fmtInt(ex.avg_calories_per_day)}</span><span class="unit">卡/日</span></div>
      <div class="detail">${ex.days_with_exercise || 0}/${ex.total_days || 0} 天 · 连续 ${ex.longest_streak_days || 0} 天</div>
    </div>
    <div class="kpi">
      <div class="label"><span class="icon">⚖️</span>体重<span class="badge ${wtBadge[0]}">${wtBadge[1]}</span></div>
      <div class="main"><span class="value">${today_status.weight.latest_kg != null ? today_status.weight.latest_kg.toFixed(1) : (wt.avg_weight != null ? wt.avg_weight.toFixed(1) : '—')}</span><span class="unit">kg</span></div>
      <div class="detail">${today_status.weight.goal_diff != null ? '距目标 ' + (today_status.weight.goal_diff > 0 ? '+' : '') + today_status.weight.goal_diff.toFixed(1) + 'kg' : '距目标 —'} · Δ7天 ${today_status.weight.delta_7d != null ? (today_status.weight.delta_7d > 0 ? '+' : '') + today_status.weight.delta_7d.toFixed(1) + 'kg' : '—'}</div>
    </div>
    <div class="kpi">
      <div class="label"><span class="icon">📉</span>缺口<span class="badge ${df.size_label === '过大' ? 'warn' : df.size_label === '适中' ? 'ok' : df.size_label === '适宜' ? 'good' : 'ok'}">${escapeHTML(df.size_label || '')}</span></div>
      <div class="main"><span class="value">${df.avg_deficit != null ? (df.avg_deficit > 0 ? '−' : '+') : '−'}${df.avg_deficit != null ? fmtInt(Math.abs(df.avg_deficit)) : '—'}</span><span class="unit">卡/日</span></div>
    </div>
  `;

// 缺口公式条(全宽,横向展示)
  const formula = document.getElementById('deficitFormula');
  if (df.bmr != null && df.avg_exercise_burn != null && df.avg_intake != null) {
    formula.style.display = '';
    document.getElementById('formulaTDEE').textContent = fmtInt(df.bmr);
    document.getElementById('formulaExercise').textContent = fmtInt(df.avg_exercise_burn);
    document.getElementById('formulaTotalBurn').textContent = fmtInt(df.bmr + df.avg_exercise_burn);
    document.getElementById('formulaIntake').textContent = fmtInt(df.avg_intake);
    const deficitEl = document.getElementById('formulaDeficit');
    deficitEl.textContent = (df.avg_deficit > 0 ? '−' : '+') + fmtInt(Math.abs(df.avg_deficit));
    deficitEl.parentElement.className = 'row def ' + (df.avg_deficit > 0 ? 'pos' : df.avg_deficit < 0 ? 'neg' : 'zero');
    const summary = document.getElementById('formulaSummary');
    if (df.kg_equivalent != null && df.days_count) {
      const kgSign = df.kg_equivalent > 0 ? '减重' : df.kg_equivalent < 0 ? '增重' : '持平';
      const kgClass = df.kg_equivalent > 0 ? 'down' : df.kg_equivalent < 0 ? 'up' : 'flat';
      summary.innerHTML = `→ 理论体重变化 · <span class="kg ${kgClass}">${kgSign} ${Math.abs(df.kg_equivalent).toFixed(2)} kg</span> · ${df.days_count === 1 ? '本日' : df.days_count + ' 天'}`;
    } else {
      summary.textContent = '';
    }
  } else {
    formula.style.display = 'none';
  }

  // TODO LIST
  const todoContainer = document.getElementById('todoContainer');
  const todoHint = document.getElementById('todoHint');
  const todos = today_status.todo;
  const logs = {
    food: today_status.food.count,
    water: today_status.water.count,
    exercise: today_status.exercise.count,
    weight: today_status.weight.count,
  };
  if (todos.length === 0) {
    todoContainer.innerHTML = `<div class="todo-empty">今日记录完整 ✓</div>`;
    todoHint.textContent = '全部记录完成';
  } else {
    todoHint.textContent = `${todos.length} 项待完成`;
    const allKeys = ['food', 'water', 'exercise', 'weight'];
    const labels = {food: '饮食', water: '饮水', exercise: '运动', weight: '体重'};
    todoContainer.innerHTML = '<div class="todo-list">' + allKeys.map(k => {
      const done = logs[k] > 0;
      const todo = todos.find(t => t.key === k);
      const label = labels[k];
      const meta = done
        ? `已记录 ${logs[k]} 条`
        : (todo ? '今日未记录' : '今日未记录');
      return `
        <div class="todo-row ${done ? 'done' : ''}">
          <span class="check">✓</span>
          <div class="body">
            <div class="label">记录${label}</div>
            <div class="meta">${escapeHTML(meta)}</div>
          </div>
          ${!done && todo ? `<span class="priority ${todo.priority}">${todo.priority === 'high' ? '高' : todo.priority === 'medium' ? '中' : '低'}</span>` : ''}
          <span class="state"></span>
        </div>
      `;
    }).join('') + '</div>';
  }

  // RECENT LOGS — Food
  const foodLog = document.getElementById('foodLog');
  if (recent_logs.foods && recent_logs.foods.length) {
    foodLog.innerHTML = '<div class="log-list">' + recent_logs.foods.map(f => `
      <div class="log-row">
        <div class="time">${escapeHTML((f.time || '—').slice(0,5))}</div>
        <div class="name">${escapeHTML(f.name)}<span class="name-nutri">蛋白 ${fmtInt(f.protein)}g</span></div>
        <div class="cal cal-intake">+${fmtInt(f.calories)} 卡</div>
      </div>
    `).join('') + '</div>';
  } else {
    foodLog.innerHTML = '<div class="log-empty">暂无饮食记录</div>';
  }

  // RECENT LOGS — Exercise
  const exerciseLog = document.getElementById('exerciseLog');
  if (recent_logs.exercises && recent_logs.exercises.length) {
    exerciseLog.innerHTML = '<div class="log-list">' + recent_logs.exercises.map(e => `
      <div class="log-row">
        <div class="time">${escapeHTML((e.time || '—').slice(0,5))}</div>
        <div class="name">${escapeHTML(e.type)}${e.minutes ? `<span class="name-nutri">${e.minutes} 分钟</span>` : ''}</div>
        <div class="cal cal-burn">−${fmtInt(e.calories)} 卡</div>
      </div>
    `).join('') + '</div>';
  } else {
    exerciseLog.innerHTML = '<div class="log-empty">暂无运动记录</div>';
  }
}

render();
</script>
</body>
</html>
