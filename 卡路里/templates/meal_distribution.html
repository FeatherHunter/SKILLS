<!DOCTYPE html>
<html lang="zh-CN">
<head>
<style><!--SHARED-CSS--></style>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>卡路里 · 餐别分布</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --fg:#1d1d1d; --fg2:#6e6e73; --fg3:#86868b; --bg:#fafafa;
    --card:#fff; --border:#d2d2d7; --accent:#0071e3;
    --good:#34c759; --warn:#ff9500; --bad:#ff3b30; --soft:#f5f5f7;
  }
  body { font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
         line-height:1.6; color:var(--fg); background:var(--bg);
         max-width:760px; margin:0 auto; padding:48px 24px 80px;
         -webkit-font-smoothing:antialiased; }
  h1 { font-size:28px; font-weight:700; letter-spacing:-.02em; margin-bottom:4px; }
  .sub { font-size:14px; color:var(--fg3); margin-bottom:24px; }
  .kpi-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; margin-bottom:20px; }
  .kpi { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:16px 18px; }
  .kpi .label { font-size:12px; color:var(--fg2); margin-bottom:6px; }
  .kpi .value { font-size:22px; font-weight:700; }
  .section { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:22px 26px; margin-bottom:16px; }
  .section h2 { font-size:17px; font-weight:600; margin-bottom:14px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th,td { padding:8px 10px; text-align:left; border-bottom:1px solid var(--border); }
  th { background:var(--soft); font-weight:500; font-size:11px; color:var(--fg2); }
  tr:last-child td { border-bottom:none; }
  .num { font-variant-numeric:tabular-nums; text-align:right; font-weight:600; }
  .dist-wrap { display:flex; align-items:center; gap:24px; }
  /* #44:饼图(权威清单 D8.5 · conic-gradient 环形) */
  .dist-pie { width:150px; height:150px; border-radius:50%; flex-shrink:0; position:relative;
    background:conic-gradient(#86868b 0 100%); }
  .dist-pie::after { content:''; position:absolute; inset:34px; border-radius:50%; background:var(--card); }
  .dist-pie-center { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:1; }
  .dist-pie-center .big { font-size:17px; font-weight:700; }
  .dist-pie-center .small { font-size:10px; color:var(--fg3); }
  .dist-list { flex:1; }
  .dist-row { display:flex; align-items:center; gap:10px; padding:7px 0; border-bottom:1px solid var(--border); font-size:13px; }
  .dist-row:last-child { border-bottom:none; }
  .dist-label { flex:0 0 44px; font-weight:600; }
  .dist-track { flex:1; height:10px; background:var(--soft); border-radius:5px; overflow:hidden; }
  .dist-fill { height:100%; border-radius:5px; background:var(--accent); }
  .dist-num { flex:0 0 90px; text-align:right; color:var(--fg2); font-variant-numeric:tabular-nums; }
  .one-line { background:rgba(0,113,227,.08); border:1px solid rgba(0,113,227,.25); border-radius:10px; padding:12px 16px; font-size:13.5px; color:var(--accent); font-weight:500; margin-bottom:16px; }
  .meal-tag { display:inline-block; padding:1px 8px; border-radius:6px; font-size:11px; font-weight:600; background:var(--soft); color:var(--fg2); }
  .meal-tag.breakfast { background:rgba(255,149,0,.12); color:var(--warn); }
  .meal-tag.lunch { background:rgba(0,113,227,.12); color:var(--accent); }
  .meal-tag.dinner { background:rgba(88,86,214,.12); color:#5856d6; }
  .meal-tag.snack { background:rgba(52,199,89,.12); color:var(--good); }
  .table-wrap { overflow-x:auto; -webkit-overflow-scrolling:touch; }
  .footer { margin-top:24px; padding:14px 18px; background:var(--soft); border-radius:12px; display:flex; justify-content:space-between; align-items:center; }
  .footer .src { font-size:12px; color:var(--fg3); }
  .footer .btn-group { display:flex; gap:6px; }  /* #44:与全场景统一 */
  .btn { border:1px solid var(--border); background:var(--card); padding:6px 12px; border-radius:8px; cursor:pointer; font-size:12px; color:var(--fg); white-space:nowrap; }
  .btn:hover { background:var(--accent); color:#fff; border-color:var(--accent); }
  .btn.copied { background:var(--good); color:#fff; border-color:var(--good); }
  @media (max-width:640px) {
    body { padding:20px 14px 40px; }  /* #44:底部空白减半 */
    h1 { font-size:22px; }
    .section { padding:16px 18px; border-radius:12px; }
    .dist-wrap { flex-direction:column; align-items:stretch; }
    /* #44:饼图居中(图例在下) */
    .dist-pie { margin:0 auto; }
    /* #44:明细表手机两段式卡——3 列两行(日期+时间合并 ::after · 餐次 · 食物 / 克数 · 热量 · 蛋白)
       注意:grid-template-areas 行内区域数必须一致(原 3/4 区错配致整个无效、td 全重叠) */
    thead { display:none; }
    #mealTable tr {
      display:grid;grid-template-columns:auto 1fr auto;
      grid-template-areas:"a b c" "d e f";
      gap:4px 10px;background:var(--card);border:1px solid var(--border);
      border-radius:14px;margin-bottom:10px;padding:10px 14px;
      box-shadow:0 1px 4px rgba(0,0,0,.04);position:relative;overflow:hidden;
    }
    #mealTable tr::before { content:''; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--accent); }
    #mealTable td { display:block; border:none; padding:0; font-size:12px; background:none; }
    #mealTable td:nth-child(1){grid-area:a; font-size:11px; color:var(--fg3);}
    #mealTable td:nth-child(1)::after { content:' ' attr(data-time); }
    #mealTable td:nth-child(2){display:none;}
    #mealTable td:nth-child(3){grid-area:b; font-weight:600; font-size:13px;}
    #mealTable td:nth-child(4){grid-area:c; min-width:0; word-break:break-all; font-weight:600; text-align:right;}
    #mealTable td:nth-child(5){grid-area:d; color:var(--fg2);}
    #mealTable td:nth-child(6){grid-area:e; font-weight:700; text-align:right;}
    #mealTable td:nth-child(6)::after { content:' 卡'; font-weight:400; color:var(--fg3); font-size:10px; }
    #mealTable td:nth-child(7){grid-area:f; text-align:right; color:var(--fg2);}
    /* #44:footer 手机纵向 + 均分 */
    .footer { flex-direction:column; align-items:stretch; gap:8px; }
    .footer .btn-group { justify-content:space-between; }
    .footer .btn-group .btn { flex:1; margin:0 4px; min-height:44px; }
    .footer .btn-group .btn:first-child { margin-left:0; }
    .footer .btn-group .btn:last-child { margin-right:0; }
  }
</style>
</head>
<body>

<script id="payload" type="application/json"><!--INJECT-DATA--></script><script><!--SHARED-HELPERS--></script><script>window.__P__=(function(){try{return JSON.parse(document.getElementById('payload').textContent||'{}');}catch(e){return null;}})();</script>

<h1>🍽️ 餐别分布</h1>
<p class="sub" id="sub">--</p>

<div class="one-line" id="oneLine">--</div>

<div class="kpi-grid">
  <div class="kpi"><div class="label">餐数</div><div class="value" id="kCnt">--</div></div>
  <div class="kpi"><div class="label" id="kAvgLabel">日均热量</div><div class="value" id="kAvg">--</div></div>
</div>

<div class="section" id="distSection" style="display:none">
  <h2>餐别热量占比</h2>
  <div class="dist-wrap">
    <div class="dist-pie" id="distPie"><div class="dist-pie-center"><div class="big" id="pieBig">--</div><div class="small">最高占比</div></div></div>
    <div class="dist-list" id="distList"></div>
  </div>
</div>

<div class="section">
  <h2>明细</h2>
  <div class="table-wrap"><table>
    <thead>
      <tr><th>日期</th><th>时间</th><th>餐次</th><th>食物</th><th class="num">克数</th><th class="num">热量</th><th class="num">蛋白</th></tr>
    </thead>
    <tbody id="mealTable"></tbody>
  </table></div>
</div>

<div class="footer">
  <div class="src" id="srcLine">📊 数据来源:--</div>
  <div id="actionbar-zone"></div>
</div>

<script>
let toastTimer = null;


(function(){
  const D = window.__P__;
  if (!D || D.status !== 'ok') {
    document.body.innerHTML = '<div style="padding:60px;text-align:center;color:#86868b">⚠ 数据未注入或状态非 ok</div>';
    return;
  }
  const { summary, items, dist, view, meta } = D.data;
  document.getElementById('sub').textContent =
    `${meta.meal_label}分布 · ${meta.start} ~ ${meta.end} · ${meta.days} 天`;
  document.getElementById('oneLine').textContent = summary.one_line;
  document.getElementById('kCnt').textContent = summary.total + ' 餐';
  if (view === 'all') {
    document.getElementById('kAvgLabel').textContent = '日均热量';
    document.getElementById('kAvg').textContent = summary.avg + ' 卡';
  } else {
    document.getElementById('kAvgLabel').textContent = '日均热量';
    document.getElementById('kAvg').textContent = summary.avg + ' 卡';
  }

    if (view === 'all' && dist.length) {
    document.getElementById('distSection').style.display = 'block';
    // #44:饼图(权威清单 D8.5 · conic-gradient 分段)
    const COLORS = ['#0071e3', '#34c759', '#ff9500', '#5856d6'];
    let acc = 0;
    const segs = dist.map((x, i) => {
      const from = acc;
      acc += x.pct;
      return `${COLORS[i % 4]} ${from}% ${acc}%`;
    });
    document.getElementById('distPie').style.background = `conic-gradient(${segs.join(', ')})`;
    const top = dist.reduce((a, b) => (b.pct > a.pct ? b : a), dist[0]);
    document.getElementById('pieBig').textContent = top.label + ' ' + top.pct + '%';
    const list = document.getElementById('distList');
    dist.forEach((x, i) => {
      list.insertAdjacentHTML('beforeend',
        `<div class="dist-row">
           <span class="dist-label">
${x.label}</span>
           <div class="dist-track"><div class="dist-fill" style="width:${Math.max(x.pct, 1)}%"></div></div>
           <span class="dist-num">${x.count} 餐 · ${x.cal} 卡 · ${x.pct}%</span>
         </div>`);
    });
  }

  const tb = document.getElementById('mealTable');
  items.forEach(p => {
    const cls = ['breakfast','lunch','dinner','snack'].includes(p.meal) ? p.meal : '';
    tb.insertAdjacentHTML('beforeend',
      `<tr><td data-time="${p.time}">${p.date}</td><td>${p.time}</td>` +
      `<td><span class="meal-tag ${cls}">${p.meal === 'breakfast' ? '早餐' : p.meal === 'lunch' ? '午餐' : p.meal === 'dinner' ? '晚餐' : '加餐'}</span></td>` +
      `<td>${p.food}</td><td class="num">${p.grams}g</td><td class="num">${p.cal}</td><td class="num">${p.pro.toFixed(1)}g</td></tr>`);
  });

  document.getElementById('srcLine').textContent = `📊 数据来源:food_log · 餐别时间窗推断 · ${meta.start} → ${meta.end}`;})();</script>


<script>(function(){var z=document.getElementById('actionbar-zone');if(z&&window.actionBar&&window.__P__){z.innerHTML=window.actionBar(window.__P__);}})();</script>
</body>
</html>
