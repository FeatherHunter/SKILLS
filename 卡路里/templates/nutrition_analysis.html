<!DOCTYPE html>
<html lang="zh-CN">
<head>
<style><!--SHARED-CSS--></style>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>卡路里 · 营养分析</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --fg:#1d1d1f; --fg2:#6e6e73; --fg3:#86868b; --bg:#fafafa;
    --card:#fff; --border:#d2d2d7; --accent:#0071e3;
    --good:#34c759; --warn:#ff9500; --bad:#ff3b30; --soft:#f5f5f7;
  }
  body { font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
         line-height:1.6; color:var(--fg); background:var(--bg);
         max-width:920px; margin:0 auto; padding:56px 24px 80px; -webkit-font-smoothing:antialiased; }
  h1 { font-size:28px; font-weight:700; letter-spacing:-.02em; margin-bottom:4px; }
  .sub { font-size:14px; color:var(--fg3); margin-bottom:24px; }





  .kpi-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:18px; }
  .kpi { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:14px 16px; }
  .kpi .label { font-size:12px; color:var(--fg2); margin-bottom:6px; }
  .kpi .value { font-size:22px; font-weight:700; }
  .kpi .extra { font-size:11px; color:var(--fg3); margin-top:4px; }
  .section { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:20px 24px; margin-bottom:16px; }
  .section h2 { font-size:16px; font-weight:600; margin-bottom:12px; }
  .legend { font-size:12px; color:var(--fg2); margin-top:10px; display:flex; gap:16px; flex-wrap:wrap; }
  .legend span { display:inline-flex; align-items:center; gap:6px; }
  .legend i { display:inline-block; width:16px; height:2px; background:#0071e3; }
  .legend .b { background:#ff9500; }
  .legend .c { background:#34c759; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th,td { padding:9px 12px; text-align:left; border-bottom:1px solid var(--border); }
  th { color:var(--fg2); font-weight:500; font-size:12px; }
  tr:last-child td { border-bottom:none; }
  .bar-wrap { display:flex; align-items:center; gap:10px; }
  .bar { height:8px; border-radius:4px; background:var(--soft); flex:1; overflow:hidden; }
  .bar i { display:block; height:100%; border-radius:4px; }
  .ok { color:var(--good); font-weight:600; }
  .bad { color:var(--bad); font-weight:600; }
  .insight { background:var(--soft); border-radius:12px; padding:14px 18px; font-size:13.5px; margin-top:4px; }
  .insight b { color:var(--accent); }
  .meta-bar { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; }
  .meta-bar .left { font-size:12px; color:var(--fg2); }
  .meta-bar .type-badge { font-size:11px; padding:3px 10px; border-radius:6px; background:var(--soft); color:var(--fg2); font-weight:600; }
  .footer { margin-top:24px; padding:14px 18px; background:var(--soft); border-radius:12px; display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; }
  .footer .src { font-size:12px; color:var(--fg3); }
  .btn { border:1px solid var(--border); background:var(--card); padding:7px 14px; border-radius:8px; cursor:pointer; font-size:13px; color:var(--fg); }
  .btn:hover { background:var(--accent); color:#fff; border-color:var(--accent); }
  @media (max-width: 640px) {
    .kpi-grid { grid-template-columns: repeat(2, 1fr); }
    .section  { padding: 14px 16px; }
    body { padding: 40px 14px 60px; }
    .table-wrap { overflow-x:auto; }
  }
</style>
</head>
<body>

<script id="payload" type="application/json"><!--INJECT-DATA--></script><script><!--SHARED-HELPERS--></script><script><!--CHARTS-HELPERS--></script><script>window.__P__=(function(){try{return JSON.parse(document.getElementById('payload').textContent||'{}');}catch(e){return null;}})();</script>

<div class="meta-bar">
  <div class="left" id="metaLeft">--</div>
  <div class="type-badge">营养分析</div>
</div>

<h1 id="title">--</h1>
<p class="sub" id="sub">--</p>

<div id="macro3Block" style="display:none">
  <div class="kpi-grid" id="macroKpis"></div>
  <div class="section">
    <h2>三大营养每日占比(蛋白/碳水/脂肪)</h2>
    <div id="macroChart"></div>
    <div class="legend">
      <span><i style="background:#0071e3"></i> 蛋白</span>
      <span><i class="b"></i> 碳水</span>
      <span><i class="c"></i> 脂肪</span>
    </div>
  </div>
</div>

<div id="sodiumBlock" style="display:none">
  <div class="kpi-grid" id="sodiumKpis"></div>
  <div class="section">
    <h2>钠 / 糖 / 纤维 日序列</h2>
    <div id="sodiumChart"></div>
    <div class="legend">
      <span><i style="background:#0071e3"></i> 钠(mg)</span>
      <span><i class="b"></i> 糖(g)</span>
      <span><i class="c"></i> 纤维(g)</span>
    </div>
  </div>
</div>

<div id="combinedBlock" style="display:none">
  <div class="section">
    <h2>钠 / 糖 / 纤维 综合报告</h2>
    <div class="table-wrap">
      <table>
        <thead><tr><th>营养素</th><th>日均</th><th>采样天数</th><th>达标率</th><th>达标状态</th></tr></thead>
        <tbody id="combinedTable"></tbody>
      </table>
    </div>
  </div>
</div>

<div id="adviceBlock" style="display:none">
  <div class="section">
    <h2>营养改进建议(按优先级)</h2>
    <div class="table-wrap">
      <table>
        <thead><tr><th>维度</th><th>当前值</th><th>目标/参考</th><th>状态</th><th>具体行动</th></tr></thead>
        <tbody id="adviceTable"></tbody>
      </table>
    </div>
  </div>
</div>

<div class="insight" id="insight">--</div>

<div class="footer">
  <div class="src" id="srcLine">📊 数据来源:--</div>
  
</div>

<script>
(function(){
  const D = ((window.__P__ && typeof window.__P__ === 'object' && window.__P__.data) ? window.__P__.data : window.__P__);
  if (!window.__P__ || window.__P__.status !== 'ok') { document.body.innerHTML = window.errorReceipt({message: '数据未注入或状态非 ok'}); return; }
  document.getElementById('metaLeft').textContent = `${D.start} ~ ${D.end} · 共 ${D.days} 天`;
  document.getElementById('sub').textContent = `${D.window} 窗口`;
  const titles = { macro3: '三大营养交叉', sodium_fiber: '钠糖纤维趋势', sodium_combined: '钠糖纤维综合', advice: '营养建议' };
  document.getElementById('title').textContent = titles[D.group] || '营养分析';
  document.getElementById('insight').innerHTML = `<b>💡 一句话洞察:</b> ${D.insight || '--'}`;

  const esc = s => String(s ?? '—').replace(/</g, '&lt;');

  if (D.group === 'macro3') {
    document.getElementById('macro3Block').style.display = '';
    const s = D.shares || {};
    const kpi = document.getElementById('macroKpis');
    [['蛋白', s.protein, '15-30%'], ['碳水', s.carbs, '40-60%'], ['脂肪', s.fat, '20-35%']].forEach(([label, v, ref]) => {
      const ok = v !== undefined && v !== null;
      const color = !ok ? 'var(--fg2)' : (D.balanced ? 'var(--good)' : (D.off_dims.includes({蛋白:'protein',碳水:'carbs',脂肪:'fat'}[label]) ? 'var(--bad)' : 'var(--good)'));
      kpi.insertAdjacentHTML('beforeend',
        `<div class="kpi"><div class="label">${label}占比</div><div class="value" style="color:${color}">${v ?? '—'}%</div><div class="extra">参考 ${ref}</div></div>`);
    });
    // #317 100% 堆叠柱无图表接口 → div 占比条近似(对齐饼干先例: div 占比条保留)
    const series = D.series || [];
    const keys = ['protein', 'carbs', 'fat'];
    const colors = ['#0071e3', '#ff9500', '#34c759'];
    const macroEl = document.getElementById('macroChart');
    if (series.length === 0) {
      macroEl.innerHTML = '<div style="text-align:center;color:#86868b;padding:40px">无数据</div>';
    } else {
      macroEl.innerHTML =
        '<div style="display:flex;flex-direction:column;gap:6px">' +
        series.map(p => {
          const t = (p.protein ?? 0) + (p.carbs ?? 0) + (p.fat ?? 0) || 1;
          const segs = keys.map((k, j) =>
            `<div style="flex:${(p[k] || 0) / t};background:${colors[j]};min-width:2px;border-radius:${j === 0 ? '4px 0 0 4px' : j === 2 ? '0 4px 4px 0' : '0'}" title="${p.date} ${k} ${Math.round((p[k] || 0) / t * 100)}%"></div>`).join('');
          return `<div style="display:flex;align-items:center;gap:8px">` +
            `<div style="flex:0 0 52px;font-size:10px;color:var(--fg3)">${p.date.slice(5)}</div>` +
            `<div style="flex:1;display:flex;height:16px;border-radius:4px;overflow:hidden;background:var(--soft)">${segs}</div>` +
            `</div>`;
        }).join('') +
        '</div>';
    }
  }

  if (D.group === 'sodium_fiber') {
    document.getElementById('sodiumBlock').style.display = '';
    const kpi = document.getElementById('sodiumKpis');
    [['钠', D.sodium, '≤2000 mg'], ['糖', D.sugar, '≤50 g'], ['纤维', D.fiber, '25-30 g']].forEach(([label, v, ref]) => {
      kpi.insertAdjacentHTML('beforeend', `<div class="kpi"><div class="label">日均${label}</div><div class="value">${v.avg ?? '—'}</div><div class="extra">参考 ${ref} · 达标率 ${v.rate === null ? '—' : v.rate + '%'}</div></div>`);
    });
    const series = D.series || [];
    if (series.length === 0) {
      document.getElementById('sodiumChart').innerHTML = '<div style="text-align:center;color:#86868b;padding:40px">无钠/糖/纤维数据(食品库匹配后自动回填)</div>';
      return;
    }
    // #317 迁 Base charts.line 多序列: 各指标独立 min-max → 归一化共享 0-100 域近似
    const fields = [
      { name: '钠', field: 'sodium_mg', color: '#0071e3' },
      { name: '糖', field: 'sugar_g', color: '#ff9500' },
      { name: '纤维', field: 'fiber_g', color: '#34c759' },
    ];
    const seriesList = fields.map(f => {
      const vals = series.map(p => p[f.field]).filter(v => v !== null && v !== undefined);
      if (vals.length < 2) return null;
      const mn = Math.min(...vals), mx = Math.max(...vals);
      // #317 验收修复: 数据恒定(mx==mn)时归一化给 50(居中水平线), 否则全 0 贴底视觉"线消失"
      const range = (mx - mn) || 1;
      const flat = mx === mn;
      return {
        name: f.name, color: f.color,
        items: series.map(p => ({
          label: p.date.slice(5),
          value: (p[f.field] === null || p[f.field] === undefined) ? null : (flat ? 50 : (p[f.field] - mn) / range * 100),
        })),
      };
    }).filter(Boolean);
    if (seriesList.length) {
      window.charts.line(document.getElementById('sodiumChart'), seriesList[0].items, {
        height: 240,
        yMin: 0, yMax: 100,
        labels: 'select',
        tooltip: true,
        series: seriesList,
      });
    }
  }

  if (D.group === 'sodium_combined') {
    document.getElementById('combinedBlock').style.display = '';
    const t = document.getElementById('combinedTable');
    [['钠', D.sodium, '≤2000 mg'], ['糖', D.sugar, '≤50 g'], ['纤维', D.fiber, '25-30 g']].forEach(([label, v, ref]) => {
      const ok = v.rate === null ? '—' : (v.rate >= 70);
      t.insertAdjacentHTML('beforeend',
        `<tr><td>${label}</td><td>${esc(v.avg)}</td><td>${v.days}</td><td>${v.rate === null ? '—' : v.rate + '%'}</td><td class="${ok === '—' ? '' : (ok ? 'ok' : 'bad')}">${ok === '—' ? '无数据' : (ok ? '✅ 达标' : '⚠️ 需改进')}</td></tr>`);
    });
  }

  if (D.group === 'advice') {
    document.getElementById('adviceBlock').style.display = '';
    const t = document.getElementById('adviceTable');
    (D.items || []).forEach(it => {
      const ok = it.gap === '达标';
      t.insertAdjacentHTML('beforeend',
        `<tr><td><b>${it.dim}</b></td><td>${esc(it.current)}</td><td>${esc(it.target)}</td><td class="${ok ? 'ok' : 'bad'}">${ok ? '✅' : '⚠️'} ${it.gap}</td><td>${esc(it.action)}</td></tr>`);
    });
  }

  document.getElementById('srcLine').textContent = `📊 营养分析 · ${titles[D.group]} · render_analysis.py --view nutrition`;})();


</script>


<div id="actionbar-zone"></div>
<script>(function(){var z=document.getElementById('actionbar-zone');if(z&&window.actionBar&&window.__P__){z.innerHTML=window.actionBar(window.__P__);}})();</script>
</body>
</html>
