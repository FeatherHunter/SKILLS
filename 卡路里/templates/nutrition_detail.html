<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>卡路里 · 营养素深度</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --fg:#1d1d1d; --fg2:#6e6e73; --fg3:#86868b; --bg:#fafafa;
    --card:#fff; --border:#d2d2d7; --accent:#0071e3;
    --good:#34c759; --warn:#ff9500; --bad:#ff3b30; --soft:#f5f5f7;
  }
  body { font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
         line-height:1.6; color:var(--fg); background:var(--bg);
         max-width:760px; margin:0 auto; padding:48px 24px 80px;
         -webkit-font-smoothing:antialiased; }
  h1 { font-size:28px; font-weight:700; letter-spacing:-.02em; margin-bottom:4px; }
  .sub { font-size:14px; color:var(--fg3); margin-bottom:24px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:22px 26px; margin-bottom:16px; }
  .card h2 { font-size:17px; font-weight:600; margin-bottom:14px; }
  .row { margin-bottom:18px; }
  .row:last-child { margin-bottom:0; }
  .row .head { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:6px; }
  .row .name { font-size:14px; font-weight:600; }
  .row .val { font-size:14px; color:var(--fg2); font-variant-numeric:tabular-nums; }
  .row .val b { color:var(--fg); font-size:16px; }
  .track { height:10px; background:var(--soft); border-radius:5px; overflow:hidden; }
  .fill { height:100%; border-radius:5px; }
  .fill.ok { background:var(--good); }
  .fill.over { background:var(--bad); }
  .hint { font-size:12px; color:var(--fg3); margin-top:6px; }
  .warn-box { background:rgba(255,149,0,.1); border:1px solid rgba(255,149,0,.3); border-radius:10px; padding:10px 14px; font-size:12px; color:#b36b00; margin-top:14px; }
  .footer { margin-top:24px; padding:14px 18px; background:var(--soft); border-radius:12px; display:flex; justify-content:space-between; align-items:center; }
  .footer .src { font-size:12px; color:var(--fg3); }
  .footer .btn-group { display:flex; gap:6px; }  /* #44:与全场景统一 */
  .btn { border:1px solid var(--border); background:var(--card); padding:6px 12px; border-radius:8px; cursor:pointer; font-size:12px; color:var(--fg); white-space:nowrap; }
  .btn:hover { background:var(--accent); color:#fff; border-color:var(--accent); }
  .btn.copied { background:var(--good); color:#fff; border-color:var(--good); }
  @media (max-width:640px) {
    body { padding:20px 14px 40px; }  /* #44:底部空白减半 */
    h1 { font-size:22px; }
    .card { padding:16px 18px; border-radius:12px; }
    /* #44:手机按钮纵向 + 均分不换行(与全场景统一) */
    .footer { flex-direction:column; align-items:stretch; gap:8px; }
    .footer .btn-group { justify-content:space-between; }
    .footer .btn-group .btn { flex:1; margin:0 4px; min-height:44px; }
    .footer .btn-group .btn:first-child { margin-left:0; }
    .footer .btn-group .btn:last-child { margin-right:0; }
    /* #44:head 手机纵向——val 不被 name 挤压换行(整行 275px 放得下) */
    .head { flex-direction:column; align-items:flex-start; gap:2px; }
  }
</style>
</head>
<body>

<!--INJECT-DATA-->

<h1>🧪 营养素深度</h1>
<p class="sub" id="sub">--</p>

<div class="card">
  <h2>微量营养素 vs 推荐</h2>
  <div id="rows"></div>
  <div class="warn-box" id="missingBox" style="display:none"></div>
</div>

<div class="footer">
  <div class="src" id="srcLine">📊 数据来源:--</div>
  <div class="btn-group">
    <button class="btn" id="copyBtn">📋 复制数据</button>
    <button class="btn" id="copyLogBtn">📋 复制日志</button>
  </div>
</div>

<script>
// #44:复制工具全局函数(统一标准:文字不变 + 绿闪 + toast + .catch fallback)
let toastTimer = null;
function showToast(msg) {
  let t = document.getElementById('copyToast');
  if (!t) {
    t = document.createElement('div');
    t.id = 'copyToast';
    t.style.cssText = 'position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:rgba(28,28,30,.92);color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;z-index:999;box-shadow:0 4px 12px rgba(0,0,0,.2);transition:opacity .3s;';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.style.opacity = '1';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.style.opacity = '0'; }, 2000);
}
function fallbackCopyText(txt) {
  const ta = document.createElement('textarea');
  ta.value = txt; ta.style.position = 'fixed'; ta.style.left = '-9999px';
  document.body.appendChild(ta); ta.focus(); ta.select();
  try { document.execCommand('copy'); } catch (e) {}
  document.body.removeChild(ta);
}
(function(){
  const D = window.__DATA__;
  if (!D || D.status !== 'ok') {
    document.body.innerHTML = '<div style="padding:60px;text-align:center;color:#86868b">⚠ 数据未注入或状态非 ok</div>';
    return;
  }
  const { summary, items, meta } = D.data;
  document.getElementById('sub').textContent = `看营养素深度 · ${meta.start} ~ ${meta.end} · ${summary.days} 天`;

  const rows = document.getElementById('rows');
  items.forEach(it => {
    // #44:日均 vs 每日推荐口径(累计/日推荐 无意义);手机不换行
    rows.insertAdjacentHTML('beforeend',
      `<div class="row">
         <div class="head">
           <span class="name">${it.label}</span>
           <span class="val"><b>${it.value.toLocaleString()}</b> ${it.unit} · 日均 ${it.avg} ${it.unit}/天 · 推荐 ${it.target} ${it.unit}/天 · <b>${it.pct}%</b></span>
         </div>
         <div class="track"><div class="fill ${it.status}" style="width:${Math.min(it.pct, 100)}%"></div></div>
         <div class="hint">${it.good}</div>
       </div>`);
  });

  if (summary.missing_foods && summary.missing_foods.length) {
    const box = document.getElementById('missingBox');
    box.style.display = 'block';
    box.textContent = `⚠ ${summary.missing_foods.length} 种食物未在食品库找到营养数据,未计入: ${summary.missing_foods.join('、')}(建议用「存食品」补录)`;
  }

  document.getElementById('srcLine').textContent = `📊 数据来源:food_log × nutrition_products(按食物名折算)`;
  document.getElementById('copyBtn').onclick = function() {
    let r = `营养素深度 ${meta.start} ~ ${meta.end} (${summary.days} 天)\n`;
    items.forEach(it => {
      r += `${it.label}: 累计 ${it.value}${it.unit} · 日均 ${it.avg}${it.unit}/天 / 推荐 ${it.target}${it.unit}/天 (${it.pct}%)\n`;
    });
    if (summary.missing_foods.length) r += `缺数据: ${summary.missing_foods.join('、')}\n`;
    // #44:统一标准——文字不变 + 绿闪 + toast + .catch fallback
    const done = () => { this.classList.add('copied'); setTimeout(() => this.classList.remove('copied'), 2000); showToast('营养素深度数据复制成功 ✓'); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(r).then(done).catch(() => { fallbackCopyText(r); done(); });
    } else { fallbackCopyText(r); done(); }
  };
})();

  // 复制日志(#44 审查补 · R3 排障):数据来源/生成时间/思考链/原始数据
  (function () {
    const logBtn = document.getElementById('copyLogBtn');
    if (!logBtn) return;
    const D0 = window.__DATA__ || {};
    const META = (D0.data && D0.data.meta) || D0.meta || {};
    const srcTxt = (document.getElementById('srcLine') || {}).textContent || '';
    const title = (document.querySelector('h1') || {}).textContent || '结果';
    logBtn.onclick = function () {
      const lines = ['[' + title + ' 排障日志]', ''];
      lines.push('数据来源: ' + srcTxt);
      lines.push('生成时间: ' + (META.today || META.date || META.start || ''));
      if (META.chain) { lines.push('AI 思考链:'); lines.push(META.chain); }
      else { lines.push('AI 思考链: (未注入 · 渲染时未传 --chain,AI 执行时用 --chain 附上处理步骤)'); }
      lines.push('');
      lines.push('原始数据:');
      lines.push(JSON.stringify(D0, null, 2));
      const txt = lines.join('\n');
      // #44:统一标准——文字不变 + 绿闪 + toast + .catch fallback
      const done = function () {
        logBtn.classList.add('copied');
        setTimeout(function () { logBtn.classList.remove('copied'); }, 2000);
        showToast('排障日志已复制 ✓');
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(txt).then(done).catch(function () { fallbackCopyText(txt); done(); });
      } else { fallbackCopyText(txt); done(); }
    };
  })();
</script>

</body>
</html>
