<!DOCTYPE html>
<html lang="zh-CN">
<head>
<style><!--SHARED-CSS--></style>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>卡路里 · 每日 6 因素综合</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --fg:#1d1d1f; --fg2:#6e6e73; --fg3:#86868b; --bg:#fafafa;
    --card:#fff; --border:#d2d2d7; --accent:#0071e3;
    --good:#34c759; --warn:#ff9500; --bad:#ff3b30; --soft:#f5f5f7;
  }
  body { font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
         line-height:1.6; color:var(--fg); background:var(--bg);
         max-width:920px; margin:0 auto; padding:56px 24px 80px; -webkit-font-smoothing:antialiased; }
  h1 { font-size:28px; font-weight:700; letter-spacing:-.02em; margin-bottom:4px; }
  .sub { font-size:14px; color:var(--fg3); margin-bottom:24px; }



  .kpi-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:18px; }
  .kpi { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:16px 18px; }
  .kpi .label { font-size:12px; color:var(--fg2); margin-bottom:6px; }
  .kpi .value { font-size:24px; font-weight:700; }
  .kpi .extra { font-size:11px; color:var(--fg3); margin-top:4px; }
  .kpi .delta { font-size:11px; font-weight:600; margin-left:6px; }
  .delta-up { color:var(--bad); }
  .delta-down { color:var(--good); }
  .delta-ok { color:var(--fg3); }
  .section { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:20px 24px; margin-bottom:16px; }
  .section h2 { font-size:16px; font-weight:600; margin-bottom:12px; }
  .legend { font-size:12px; color:var(--fg2); margin-top:10px; display:flex; gap:16px; flex-wrap:wrap; }
  .legend span { display:inline-flex; align-items:center; gap:6px; }
  .legend i { display:inline-block; width:16px; height:2px; }
  .insight { background:var(--soft); border-radius:12px; padding:14px 18px; font-size:13.5px; margin-top:4px; }
  .insight b { color:var(--accent); }
  .meta-bar { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; }
  .meta-bar .left { font-size:12px; color:var(--fg2); }
  .meta-bar .type-badge { font-size:11px; padding:3px 10px; border-radius:6px; background:var(--soft); color:var(--fg2); font-weight:600; }
  .footer { margin-top:24px; padding:14px 18px; background:var(--soft); border-radius:12px; display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; }
  .footer .src { font-size:12px; color:var(--fg3); }
  .btn { border:1px solid var(--border); background:var(--card); padding:7px 14px; border-radius:8px; cursor:pointer; font-size:13px; color:var(--fg); }
  .btn:hover { background:var(--accent); color:#fff; border-color:var(--accent); }
  @media (max-width: 640px) {
    .kpi-grid { grid-template-columns: repeat(2, 1fr); }
    .section  { padding: 14px 16px; }
    body { padding: 40px 14px 60px; }
  }
</style>
</head>
<body>

<script id="payload" type="application/json"><!--INJECT-DATA--></script><script><!--SHARED-HELPERS--></script><script><!--CHARTS-HELPERS--></script><script>window.__P__=(function(){try{return JSON.parse(document.getElementById('payload').textContent||'{}');}catch(e){return null;}})();</script>

<div class="meta-bar">
  <div class="left" id="metaLeft">--</div>
  <div class="type-badge">单点 · 6 因素综合</div>
</div>

<h1>📊 看每日 6 因素综合</h1>
<p class="sub" id="sub">--</p>

<div class="kpi-grid" id="kpis"></div>

<div class="section">
  <h2>最近 7 天走势(摄入/运动/饮水/体重)</h2>
  <div id="chart"></div>
  <div class="legend">
    <span><i style="background:#0071e3"></i> 摄入</span>
    <span><i style="background:#ff9500"></i> 运动</span>
    <span><i style="background:#af52de"></i> 饮水</span>
    <span><i style="background:#34c759"></i> 体重</span>
  </div>
</div>

<div class="section">
  <h2>异常标注</h2>
  <div id="anomaly" style="font-size:13px;color:var(--fg2)">窗口内无异常日</div>
</div>

<div class="insight" id="insight">--</div>

<div class="footer">
  <div class="src" id="srcLine">📊 数据来源:--</div>
  
</div>

<script>
(function(){
  const D = ((window.__P__ && typeof window.__P__ === 'object' && window.__P__.data) ? window.__P__.data : window.__P__);
  if (!window.__P__ || window.__P__.status !== 'ok') { document.body.innerHTML = window.errorReceipt({message: '数据未注入或状态非 ok'}); return; }
  document.getElementById('metaLeft').textContent = `单日快照 ${D.date}`;
  document.getElementById('sub').innerHTML = D.degraded ? window.statusBadge('warn', '⚠ 无体脂/围度数据,已降级为 4 维') : window.statusBadge('ok', '完整 6 维');
  document.getElementById('insight').innerHTML = `<b>💡 一句话洞察:</b> ${D.insight || '--'}`;

  const box = document.getElementById('kpis');
  (D.kpis || []).forEach(k => {
    if (k.value === '—') return;
    const deltaCls = k.delta === null || k.delta === undefined ? 'delta-ok'
      : ['体重', '体脂', '围度'].includes(k.label) ? (k.delta <= 0 ? 'delta-down' : 'delta-up')
      : (k.delta <= 0 ? 'delta-up' : 'delta-down');
    const deltaHtml = (k.delta === null || k.delta === undefined) ? '' :
      `<span class="delta ${deltaCls}">vs 昨日 ${k.delta >= 0 ? '+' : ''}${k.delta}</span>`;
    box.insertAdjacentHTML('beforeend',
      `<div class="kpi"><div class="label">${k.label}</div><div class="value">${k.value}${deltaHtml}</div><div class="extra">${k.label}当日值</div></div>`);
  });

  // #317 迁 Base charts.line 多序列: 各指标独立 min-max 归一化 → 共享 0-100 域近似
  // (charts.line 无双轴独立刻度; Y 轴刻度文字缺失 — 均记偏离)
  const wk = D.week || [];
  const norm = (field) => {
    const vals = wk.map(p => p[field]).filter(v => v !== null && v !== undefined);
    if (vals.length === 0) return null;
    const mn = Math.min(...vals), mx = Math.max(...vals);
    const range = (mx - mn) || 1;
    return wk.map(p => ({
      label: (p.date || '').slice(5),
      value: (p[field] === null || p[field] === undefined) ? null : (p[field] - mn) / range * 100,
    }));
  };
  const seriesDefs = [
    { name: '摄入', field: 'calories', color: '#0071e3' },
    { name: '运动', field: 'exercise_kcal', color: '#ff9500' },
    { name: '饮水', field: 'water_ml', color: '#af52de' },
    { name: '体重', field: 'weight_kg', color: '#34c759' },
  ];
  const series = seriesDefs.map(sd => {
    const items = norm(sd.field);
    return items ? { name: sd.name, items, color: sd.color } : null;
  }).filter(Boolean);
  if (series.length && series[0].items.length >= 2) {
    window.charts.line(document.getElementById('chart'), series[0].items, {
      height: 240,
      yMin: 0, yMax: 100,
      labels: 'edge',
      tooltip: true,
      series,
    });
  } else if (wk.length === 0) {
    document.getElementById('chart').innerHTML = '<div style="text-align:center;color:#86868b;padding:40px">无数据</div>';
  }

  const an = D.anomaly || [];
  if (an.length) document.getElementById('anomaly').textContent = '异常日: ' + an.join('、') + '(摄入超目标 130%)';

  document.getElementById('srcLine').textContent = `📊 每日 6 因素综合 · ${D.date} · render_analysis.py --view six`;})();


</script>


<div id="actionbar-zone"></div>
<script>(function(){var z=document.getElementById('actionbar-zone');if(z&&window.actionBar&&window.__P__){z.innerHTML=window.actionBar(window.__P__);}})();</script>
</body>
</html>
