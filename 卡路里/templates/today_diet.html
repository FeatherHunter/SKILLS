<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>卡路里 · 今日饮食</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --fg:#1d1d1f; --fg2:#6e6e73; --fg3:#86868b; --bg:#fafafa;
    --card:#fff; --border:#d2d2d7; --accent:#0071e3;
    --good:#34c759; --warn:#ff9500; --bad:#ff3b30; --soft:#f5f5f7;
    --prot:#5856d6; --carb:#34c759; --fat:#ff9500;
  }
  body { font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
         line-height:1.6; color:var(--fg); background:var(--bg);
         max-width:920px; margin:0 auto; padding:48px 24px 80px;
         -webkit-font-smoothing:antialiased; overflow-x:hidden; }
  h1 { font-size:28px; font-weight:700; letter-spacing:-.02em; margin-bottom:4px; }
  .sub { font-size:14px; color:var(--fg3); margin-bottom:24px; }
  .pill { display:inline-block; padding:2px 9px; border-radius:10px; font-size:11px; font-weight:600; margin-right:4px; }
  .pill-good { background:rgba(52,199,89,.15); color:var(--good); }
  .pill-warn { background:rgba(255,149,0,.15); color:var(--warn); }
  .pill-bad  { background:rgba(255,59,48,.15); color:var(--bad); }
  .pill-info { background:rgba(0,113,227,.15); color:var(--accent); }
  .kpi-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:20px; }
  .kpi { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:14px 16px; }
  .kpi .label { font-size:11px; color:var(--fg2); margin-bottom:4px; }
  .kpi .value { font-size:20px; font-weight:700; }
  .kpi .extra { font-size:11px; color:var(--fg3); margin-top:3px; }
  .kpi .extra.good { color:var(--good); }
  .kpi .extra.warn { color:var(--warn); }
  .kpi .extra.bad  { color:var(--bad); }
  .section { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:22px 26px; margin-bottom:16px; }
  .section h2 { font-size:17px; font-weight:600; margin-bottom:14px; }
  .meal-row { display:flex; align-items:center; gap:14px; padding:10px 0; border-bottom:1px solid var(--border); }
  .meal-row:last-child { border-bottom:none; }
  .meal-label { width:62px; font-weight:600; font-size:13px; flex-shrink:0; }
  .meal-bar-wrap { flex:1; height:14px; background:var(--soft); border-radius:7px; overflow:hidden; position:relative; }
  .meal-bar { height:100%; background:var(--accent); border-radius:7px; transition:width 0.3s; }
  .meal-bar.over { background:var(--warn); }
  .meal-stats { width:130px; text-align:right; font-size:12px; color:var(--fg2); flex-shrink:0; }
  .meal-stats strong { color:var(--fg); font-weight:600; font-variant-numeric:tabular-nums; font-size:13px; }
  .pie-wrap { display:flex; align-items:center; gap:24px; }
  .pie-legend { flex:1; font-size:13px; }
  .pie-legend .row { display:flex; align-items:center; gap:10px; padding:6px 0; border-bottom:1px solid var(--border); }
  .pie-legend .row:last-child { border-bottom:none; }
  .pie-legend .dot { width:12px; height:12px; border-radius:3px; flex-shrink:0; }
  .pie-legend .name { flex:1; }
  .pie-legend .val { font-weight:600; font-variant-numeric:tabular-nums; color:var(--fg); }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th,td { padding:9px 12px; text-align:left; border-bottom:1px solid var(--border); }
  th { background:var(--soft); font-weight:500; font-size:11px; color:var(--fg2); }
  tr:last-child td { border-bottom:none; }
  .num { font-variant-numeric:tabular-nums; text-align:right; font-weight:600; }
  th.num, td.num { text-align:right; }
  .meal-tag { display:inline-block; padding:1px 8px; border-radius:6px; font-size:11px; font-weight:600; background:var(--soft); color:var(--fg2); }
  .meal-tag.breakfast { background:rgba(255,149,0,.12); color:var(--warn); }
  .meal-tag.lunch     { background:rgba(0,113,227,.12); color:var(--accent); }
  .meal-tag.dinner    { background:rgba(88,86,214,.12); color:var(--prot); }
  .meal-tag.snack     { background:rgba(52,199,89,.12); color:var(--good); }
  .footer { margin-top:12px; padding:12px 14px; background:var(--soft); border-radius:12px; display:flex; justify-content:space-between; align-items:center; }
  .footer .src { font-size:12px; color:var(--fg3); }
  .footer .btn-group { display:flex; gap:6px; }  /* #44 审查:桌面两按钮贴在一起 */
  .btn { border:1px solid var(--border); background:var(--card); padding:6px 12px; border-radius:8px; cursor:pointer; font-size:12px; color:var(--fg); white-space:nowrap; }
  .btn:hover { background:var(--accent); color:#fff; border-color:var(--accent); }
  .btn.copied { background:var(--good); color:#fff; border-color:var(--good); }
  .meta-bar { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
  .meta-bar .left { font-size:12px; color:var(--fg2); }
  .meta-bar .type-badge { font-size:11px; padding:3px 10px; border-radius:6px; background:var(--soft); color:var(--fg2); font-weight:600; }
  .table-wrap { overflow-x:auto; -webkit-overflow-scrolling:touch; }
  td.summary-line, td.cal-grams { display:none; } /* 桌面表格用 8 列,手机专属行隐藏 */
  @media (max-width:640px) {
    body { padding:24px 16px 40px; }
    .section { padding:16px 18px; }
    /* #44 审查:6 KPI 手机 2 列 3 行 */
    .kpi-grid { grid-template-columns:repeat(2,1fr); gap:8px; }
    .kpi { padding:12px 14px; }
    .kpi .value { font-size:18px; }
    /* #44 审查:餐次进度手机三行式(label+stats 同行,bar 全宽下一行) */
    .meal-row { flex-wrap:wrap; gap:6px; }
    .meal-label { width:auto; }
    .meal-stats { width:auto; margin-left:auto; }
    .meal-bar-wrap { flex:1 1 100%; order:3; height:12px; }
    /* #44 审查:表格手机两段式紧凑卡——行1:时间+餐次+食物+热量;行2:摘要行(克数左 + 营养三项右紧凑) */
    .table-wrap { overflow-x:visible; }
    thead { display:none; }
    tr { display:grid; grid-template-columns:auto auto 1fr auto; grid-template-areas:
           "a b c d" "e e e e"; gap:3px 10px; background:var(--card); border:1px solid var(--lineS);
         border-radius:14px; margin-bottom:10px; padding:10px 14px; position:relative; overflow:hidden;
         box-shadow:0 1px 4px rgba(0,0,0,.04); }
    /* 餐别色条(左侧 3px) */
    tr::before { content:''; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--soft); }
    tr.tr-breakfast::before { background:var(--warn); }
    tr.tr-lunch::before { background:var(--accent); }
    tr.tr-dinner::before { background:var(--prot); }
    tr.tr-snack::before { background:var(--good); }
    td { display:block; border:none; padding:0; font-size:12px; }
    td.num { text-align:left; font-weight:400; }
    tr:last-child td { border:none; }
    td:nth-child(1){grid-area:a} td:nth-child(2){grid-area:b}
    td:nth-child(3){grid-area:c; min-width:0; word-break:break-all;}
    td:nth-child(10){grid-area:d}  /* 手机:克数+热量同处行1 右侧 */
    td:nth-child(4), td:nth-child(5), td:nth-child(6), td:nth-child(7), td:nth-child(8) { display:none; } /* 桌面列手机隐藏 */
    td.summary-line{grid-area:e; display:block; margin-top:2px;}
    /* 行1:时间弱化灰 · 食物加粗 · 克数+热量右侧(同一行) */
    td:nth-child(1)::before, td:nth-child(2)::before, td:nth-child(3)::before { content:none; }
    td:nth-child(1) { color:var(--fg3); font-size:11px; font-variant-numeric:tabular-nums; }
    td:nth-child(3) { font-weight:600; font-size:13px; }
    td.cal-grams { display:flex; align-items:baseline; justify-content:flex-end; gap:6px; }
    td.cal-grams .cg { color:var(--fg3); font-size:11px; font-variant-numeric:tabular-nums; }
    td.cal-grams .cc { font-weight:700; font-size:13px; font-variant-numeric:tabular-nums; color:var(--fg); }
    /* 摘要行:营养三项等分行2 区域——蛋白质居左/碳水居中/脂肪居右(各自区域内) */
    .sl-nuts { display:flex; width:100%; }
    .sl-nut { flex:1; font-size:11px; color:var(--fg2); font-variant-numeric:tabular-nums; white-space:nowrap; }
    .sl-nut.prot { text-align:left; color:var(--prot); }
    .sl-nut.carb { text-align:center; color:var(--carb); }
    .sl-nut.fat { text-align:right; color:var(--fat); }
    /* #44 审查:复制按钮手机有间距且不换行 */
    .footer { flex-direction:column; align-items:stretch; gap:8px; }
    .footer .btn-group { justify-content:space-between; }
    .footer .btn-group .btn { flex:1; margin:0 4px; }
    .footer .btn-group .btn:first-child { margin-left:0; }
    .footer .btn-group .btn:last-child { margin-right:0; }
  }
</style>
</head>
<body>

<!--INJECT-DATA-->

<div class="meta-bar">
  <div class="left" id="metaLeft">--</div>
  <div class="type-badge">报告型 · 单日 4 餐</div>
</div>

<h1>🍽️ 今日饮食</h1>
<p class="sub" id="sub">--</p>

<div class="kpi-grid" id="kpiGrid">
  <div class="kpi kpi-rec"><div class="label">记录数</div><div class="value" id="kRec">--</div><div class="extra" id="kRecE">--</div></div>
  <div class="kpi kpi-cal"><div class="label">总热量</div><div class="value" id="kCal">--</div><div class="extra" id="kCalE">--</div></div>
  <div class="kpi kpi-prot"><div class="label">蛋白质</div><div class="value" id="kProt">--</div><div class="extra" id="kProtE">--</div></div>
  <div class="kpi kpi-carb"><div class="label">碳水</div><div class="value" id="kCarb">--</div><div class="extra" id="kCarbE">--</div></div>
  <div class="kpi kpi-fat"><div class="label">脂肪</div><div class="value" id="kFat">--</div><div class="extra" id="kFatE">--</div></div>
  <div class="kpi kpi-water"><div class="label">饮水</div><div class="value" id="kWater">--</div><div class="extra" id="kWaterE">--</div></div>
</div>

<div class="section" id="secMealProgress">
  <h2>餐次进度</h2>
  <div id="mealBars"></div>
</div>

<div class="section" id="secPie">
  <h2>营养配比</h2>
  <div class="pie-wrap">
    <svg id="pie" width="180" height="180" viewBox="0 0 180 180"></svg>
    <div class="pie-legend" id="pieLegend"></div>
  </div>
</div>

<div class="section" id="secDetail">
  <h2>今日明细</h2>
  <div class="table-wrap">
  <table>
    <thead><tr><th>时间</th><th>餐次</th><th>食物</th><th class="num">克数</th><th class="num">热量</th><th class="num">蛋白</th><th class="num">碳水</th><th class="num">脂肪</th></tr></thead>
    <tbody id="mealTable"></tbody>
  </table>
  </div>
</div>

<div class="footer">
  <div class="src" id="srcLine">📊 数据来源:--</div>
  <div class="btn-group">
    <button class="btn" id="copyBtn">📋 复制数据</button>
    <button class="btn" id="copyLogBtn">📋 复制日志</button>
  </div>
</div>

<script>
// #44:复制工具全局函数(两个 IIFE 共用 · toast/fallback 必须在同一作用域可见)
let toastTimer = null;
function showToast(msg){var t=document.createElement('div');t.style.cssText='position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0));transform:translateX(-50%) scale(.9);opacity:0;background:rgba(28,28,30,.94);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);color:#f0f0f0;border-radius:14px;padding:13px 14px 13px 16px;display:flex;align-items:flex-start;gap:12px;max-width:min(480px,calc(100vw - 24px));min-width:300px;box-shadow:0 10px 32px rgba(0,0,0,.32),0 0 0 .5px rgba(255,255,255,.08) inset;z-index:9999;transition:opacity .22s ease-out,transform .22s cubic-bezier(.34,1.56,.64,1)';t.innerHTML='<div style="font-size:20px;line-height:1;padding-top:1px;flex-shrink:0">📋</div><div style="flex:1;min-width:0"><div style="font-weight:600;font-size:12.5px;line-height:1.4;color:#fff;margin-bottom:2px">已复制 <em style="font-style:normal;color:#34c759;font-weight:600">'+msg+'</em></div><div style="font-size:11px;line-height:1.5;color:#c8c8cc">粘贴给 AI,卡路里技能会自动执行这个流程,完成后你会拿到结果 HTML + 一句话总结。</div></div><button style="background:rgba(255,255,255,.10);color:#34c759;border:0;border-radius:8px;padding:5px 9px;font-size:10.5px;font-weight:500;cursor:pointer;white-space:nowrap;margin-left:6px;flex-shrink:0">✓ 知道了</button>';document.body.appendChild(t);requestAnimationFrame(function(){t.style.opacity='1';t.style.transform='translateX(-50%) scale(1)';});var close=function(){t.style.opacity='0';t.style.transform='translateX(-50%) scale(.9)';setTimeout(function(){t.remove();},220);};t.querySelector('button').addEventListener('click',close);setTimeout(close,4500);}
function flashCopied(btn) { btn.classList.add('copied'); setTimeout(() => btn.classList.remove('copied'), 2000); }
function fallbackCopyText(txt) {
  const ta = document.createElement('textarea');
  ta.value = txt; ta.style.position = 'fixed'; ta.style.left = '-9999px';
  document.body.appendChild(ta); ta.focus(); ta.select();
  try { document.execCommand('copy'); } catch (e) {}
  document.body.removeChild(ta);
}
function doCopyText(txt, btn, okMsg) {
  const done = () => { flashCopied(btn); showToast(okMsg); };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(txt).then(done).catch(() => { fallbackCopyText(txt); done(); });
  } else { fallbackCopyText(txt); done(); }
}

(function(){
  const D = window.__DATA__;
  if (!D || D.status !== 'ok') {
    document.body.innerHTML = '<div style="padding:60px;text-align:center;color:#86868b">⚠ 数据未注入或状态非 ok</div>';
    return;
  }
  const { summary, meals, meta } = D.data;
  const mode = meta.mode || 'diet';

  // #44 审查:标题按日期动态——今天=今日饮食,历史日期=「M月D日 饮食」
  const h1 = document.querySelector('h1');
  let h1text;
  if (mode === 'nutrition') {
    h1text = '🥗 今日营养';
  } else if (meta.date === meta.today) {
    h1text = '🍽️ 今日饮食';
  } else {
    const parts = meta.date.split('-');
    h1text = `🍽️ ${Number(parts[1])}月${Number(parts[2])}日 饮食`;
  }
  h1.textContent = h1text;
  // issue #53(2026-08-09):<title> 与 h1/文件名口径一致(今天/昨天/历史日期)
  document.title = `卡路里 · ${h1text.replace(/\s/g, ' ')} ${meta.date}`;

  // #44 审查:nutrition 视角分离——隐藏 餐次进度/今日明细,只留 4 营养 KPI + 配比
  if (mode === 'nutrition') {
    document.getElementById('secMealProgress').style.display = 'none';
    document.getElementById('secDetail').style.display = 'none';
    document.querySelector('.kpi-rec').style.display = 'none';
    document.querySelector('.kpi-cal').style.display = 'none';
    document.querySelector('.type-badge').textContent = '报告型 · 今日营养完成度';
  }

  // #44 审查:数值统一格式化——最多 2 位小数(整数不带尾零,浮点去噪声)
  function fmt2(v) {
    const n = Number(v) || 0;
    const r = Math.round(n * 100) / 100;
    return Number.isInteger(r) ? String(r) : r.toFixed(2);
  }

  document.getElementById('metaLeft').textContent = `${meta.date} · 共 ${meals.length} 条记录`;
  const remain = summary.target - summary.calorie;
  // #44 审查:nutrition 模式副标题 = 4 项营养完成度一句话
  if (mode === 'nutrition') {
    const parts = [
      `蛋白质 ${summary.protein_pct}%`,
      `碳水 ${summary.carb_pct}%`,
      `脂肪 ${summary.fat_pct}%`,
      `饮水 ${Math.round(summary.water_ml / summary.water_target * 100)}%`,
    ];
    document.getElementById('sub').innerHTML =
      `查今日营养 · ${meta.date} · ` + parts.map(t => `<span class="pill pill-info">${t}</span>`).join(' ');
  } else {
    document.getElementById('sub').innerHTML = remain > 0
      ? `查今天吃 · ${meta.date} · 距离目标还剩 <span class="pill pill-good">${fmt2(remain)} 卡</span>`
      : `查今天吃 · ${meta.date} · 已超目标 <span class="pill pill-bad">${fmt2(-remain)} 卡</span>`;
  }

  document.getElementById('kRec').textContent = (summary.record_count != null ? summary.record_count : meals.length);
  document.getElementById('kRecE').textContent = `今日共 ${summary.record_count != null ? summary.record_count : meals.length} 条`;
  document.getElementById('kRecE').className = 'extra good';

  document.getElementById('kCal').textContent = fmt2(summary.calorie);
  const dC = summary.calorie - summary.target;
  document.getElementById('kCalE').textContent = `目标 ${fmt2(summary.target)} · ${dC >= 0 ? '+' : ''}${fmt2(dC)}`;
  document.getElementById('kCalE').className = 'extra ' + (dC > summary.target * 0.05 ? 'warn' : dC < -summary.target * 0.10 ? 'bad' : 'good');

  function setKpi(id, v, e, cls) {
    document.getElementById(id).textContent = fmt2(v);
    const el = document.getElementById(id + 'E');
    el.textContent = e;
    el.className = 'extra ' + cls;
  }
  setKpi('kProt', summary.protein_g, `目标 ${summary.protein_target}g · ${summary.protein_pct}%`, summary.protein_pct >= 95 ? 'good' : summary.protein_pct < 70 ? 'bad' : 'warn');
  setKpi('kCarb', summary.carb_g,     `目标 ${summary.carb_target}g · ${summary.carb_pct}%`,     summary.carb_pct     >= 95 ? 'good' : summary.carb_pct     < 70 ? 'bad' : 'warn');
  setKpi('kFat',  summary.fat_g,      `目标 ${summary.fat_target}g · ${summary.fat_pct}%`,      summary.fat_pct      >= 95 ? 'good' : summary.fat_pct      < 70 ? 'bad' : 'warn');
  setKpi('kWater', summary.water_ml,  `目标 ${summary.water_target}ml · ${Math.round(summary.water_ml / summary.water_target * 100)}%`, summary.water_ml >= summary.water_target ? 'good' : 'warn');

  const mealLabels = {breakfast:'早餐', lunch:'午餐', dinner:'晚餐', snack:'加餐'};
  const bars = document.getElementById('mealBars');
  ['breakfast','lunch','dinner','snack'].forEach(k => {
    const m = summary.meals[k];
    if (!m) return;
    const pct = Math.min(100, m.calorie / m.target * 100);
    const over = m.calorie > m.target * 1.10;
    bars.insertAdjacentHTML('beforeend',
      `<div class="meal-row">` +
      `<div class="meal-label">${mealLabels[k]}</div>` +
      `<div class="meal-bar-wrap"><div class="meal-bar ${over?'over':''}" style="width:${pct}%"></div></div>` +
      `<div class="meal-stats"><strong>${fmt2(m.calorie)}</strong> / ${fmt2(m.target)} 卡${over?' ⚠':''}</div>` +
      `</div>`);
  });

  const svg = document.getElementById('pie');
  const cx = 90, cy = 90, r = 70;
  const items = [
    {name:'蛋白', val: summary.protein_g * 4, color:'var(--prot)', key:'prot'},
    {name:'碳水', val: summary.carb_g * 4,   color:'var(--carb)', key:'carb'},
    {name:'脂肪', val: summary.fat_g * 9,    color:'var(--fat)',  key:'fat'},
  ];
  const totalCal = items.reduce((a,b)=>a+b.val, 0) || 1;
  let start = -Math.PI / 2;
  items.forEach(it => {
    const ang = (it.val / totalCal) * Math.PI * 2;
    const end = start + ang;
    const x1 = cx + r * Math.cos(start), y1 = cy + r * Math.sin(start);
    const x2 = cx + r * Math.cos(end),   y2 = cy + r * Math.sin(end);
    const large = ang > Math.PI ? 1 : 0;
    svg.insertAdjacentHTML('beforeend',
      `<path d="M ${cx} ${cy} L ${x1} ${y1} A ${r} ${r} 0 ${large} 1 ${x2} ${y2} Z" fill="${it.color}"/>`);
    start = end;
  });
  svg.insertAdjacentHTML('beforeend',
    `<circle cx="${cx}" cy="${cy}" r="40" fill="#fff"/>` +
    `<text x="${cx}" y="${cy - 4}" text-anchor="middle" font-size="11" fill="#86868b">总热量</text>` +
    `<text x="${cx}" y="${cy + 14}" text-anchor="middle" font-size="16" font-weight="700" fill="#1d1d1f">${fmt2(summary.calorie)}</text>`);

  const legend = document.getElementById('pieLegend');
  items.forEach(it => {
    const pct = Math.round(it.val / totalCal * 100);
    const g = summary[it.key + '_g'];
    legend.insertAdjacentHTML('beforeend',
      `<div class="row">` +
      `<div class="dot" style="background:${it.color}"></div>` +
      `<div class="name">${it.name} <span style="color:#86868b;font-size:11px">${fmt2(g)}g</span></div>` +
      `<div class="val">${pct}%</div>` +
      `</div>`);
  });

  const tb = document.getElementById('mealTable');
  meals.forEach(m => {
    const tag = m.meal_type;
    const tagClass = ['breakfast','lunch','dinner','snack'].includes(tag) ? tag : '';
    const trCls = tagClass ? ` class="tr-${tagClass}"` : '';
    // #44 审查:手机行——td10 克数+热量同处行1 右侧;td9 摘要行仅营养三项(紧凑)
    const calGrams =
      `<td class="cal-grams" colspan="8"><span class="cg">${fmt2(m.grams)}g</span><span class="cc">${fmt2(m.calorie)} 卡</span></td>`;
    const summaryLine =
      `<td class="summary-line" colspan="8">` +
      `<span class="sl-nuts">` +
      `<span class="sl-nut prot">● 蛋白质 ${fmt2(m.protein)}</span>` +
      `<span class="sl-nut carb">● 碳水 ${fmt2(m.carb)}</span>` +
      `<span class="sl-nut fat">● 脂肪 ${fmt2(m.fat)}</span>` +
      `</span></td>`;
    tb.insertAdjacentHTML('beforeend',
      `<tr${trCls}><td data-label="时间">${m.time}</td>` +
      `<td data-label="餐次"><span class="meal-tag ${tagClass}">${mealLabels[tag] || tag}</span></td>` +
      `<td data-label="食物">${m.food_name}</td>` +
      `<td class="num" data-label="克数">${fmt2(m.grams)}</td>` +
      `<td class="num" data-label="热量">${fmt2(m.calorie)}</td>` +
      `<td class="num" data-label="蛋白">${fmt2(m.protein)}</td>` +
      `<td class="num" data-label="碳水">${fmt2(m.carb)}</td>` +
      `<td class="num" data-label="脂肪">${fmt2(m.fat)}</td>` +
      summaryLine + calGrams + `</tr>`);
  });

  document.getElementById('srcLine').textContent =
    `📊 数据来源: calorie_data.db · ${meta.date} · ${meals.length} 条记录`;

  // #44 审查:复制反馈统一——文字不变,绿闪 + toast(工具函数为全局,见脚本顶部)
  document.getElementById('copyBtn').onclick = function() {
    if (mode === 'nutrition') {
      const r = `今日营养 ${meta.date}\n` +
                `蛋白质 ${fmt2(summary.protein_g)}g / 目标 ${fmt2(summary.protein_target)}g (${summary.protein_pct}%)\n` +
                `碳水 ${fmt2(summary.carb_g)}g / 目标 ${fmt2(summary.carb_target)}g (${summary.carb_pct}%)\n` +
                `脂肪 ${fmt2(summary.fat_g)}g / 目标 ${fmt2(summary.fat_target)}g (${summary.fat_pct}%)\n` +
                `饮水 ${fmt2(summary.water_ml)}ml / 目标 ${fmt2(summary.water_target)}ml`;
      doCopyText(r, this, '今日营养数据复制成功 ✓');
      return;
    }
    const lines = meals.map(m =>
      `${m.time} ${mealLabels[m.meal_type]||m.meal_type} ${m.food_name} ${fmt2(m.grams)}g = ${fmt2(m.calorie)}卡`);
    const r = `今日饮食 ${meta.date}\n总热量 ${fmt2(summary.calorie)} / ${fmt2(summary.target)} 卡\n` +
              `蛋白 ${fmt2(summary.protein_g)}g · 碳水 ${fmt2(summary.carb_g)}g · 脂肪 ${fmt2(summary.fat_g)}g\n` +
              `饮水 ${fmt2(summary.water_ml)}ml\n` + lines.join('\n');
    doCopyText(r, this, '饮食数据复制成功 ✓');
  };
})();

  // 复制日志(#44 审查补 · R3 排障):数据来源/生成时间/思考链/原始数据
  (function () {
    const logBtn = document.getElementById('copyLogBtn');
    if (!logBtn) return;
    const D0 = window.__DATA__ || {};
    const META = (D0.data && D0.data.meta) || D0.meta || {};
    const srcTxt = (document.getElementById('srcLine') || {}).textContent || '';
    const title = (document.querySelector('h1') || {}).textContent || '结果';
    logBtn.onclick = function () {
      const lines = ['[' + title + ' 排障日志]', ''];
      lines.push('数据来源: ' + srcTxt);
      lines.push('生成时间: ' + (META.today || META.date || META.start || ''));
      if (META.chain) { lines.push('AI 思考链:'); lines.push(META.chain); }
      else { lines.push('AI 思考链: (未注入 · 渲染时未传 --chain,AI 执行时用 --chain 附上处理步骤)'); }
      lines.push('');
      lines.push('原始数据:');
      lines.push(JSON.stringify(D0, null, 2));
      const txt = lines.join('\n');
      // #44 审查:文字不变,绿闪 + toast
      const done = function () {
        logBtn.classList.add('copied');
        setTimeout(function () { logBtn.classList.remove('copied'); }, 2000);
        if (typeof showToast === 'function') showToast('排障日志已复制 ✓');
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(txt).then(done).catch(function () {
          if (typeof fallbackCopyText === 'function') fallbackCopyText(txt);
          done();
        });
      } else {
        if (typeof fallbackCopyText === 'function') fallbackCopyText(txt);
        done();
      }
    };
  })();
</script>

</body>
</html>
