<!DOCTYPE html>
<html lang="zh-CN">
<head>
<style><!--SHARED-CSS--></style>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>卡路里 · 吃的记录</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --fg:#1d1d1d; --fg2:#6e6e73; --fg3:#86868b; --bg:#fafafa;
    --card:#fff; --border:#d2d2d7; --accent:#0071e3;
    --good:#34c759; --warn:#ff9500; --bad:#ff3b30; --soft:#f5f5f7;
  }
  body { font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
         line-height:1.6; color:var(--fg); background:var(--bg);
         max-width:920px; margin:0 auto; padding:48px 24px 80px;
         -webkit-font-smoothing:antialiased; }
  h1 { font-size:28px; font-weight:700; letter-spacing:-.02em; margin-bottom:4px; }
  .sub { font-size:14px; color:var(--fg3); margin-bottom:24px; }
  .pill { display:inline-block; padding:2px 9px; border-radius:10px; font-size:11px; font-weight:600; margin-right:4px; }
  .pill-good { background:rgba(52,199,89,.15); color:var(--good); }
  .pill-warn { background:rgba(255,149,0,.15); color:var(--warn); }
  .pill-info { background:rgba(0,113,227,.15); color:var(--accent); }
  .kpi-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:20px; }
  .kpi { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:16px 18px; }
  .kpi .label { font-size:12px; color:var(--fg2); margin-bottom:6px; }
  .kpi .value { font-size:24px; font-weight:700; }
  .kpi .extra { font-size:11px; color:var(--fg3); margin-top:3px; }
  .section { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:22px 26px; margin-bottom:16px; }
  .section h2 { font-size:17px; font-weight:600; margin-bottom:14px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th,td { padding:9px 12px; text-align:left; border-bottom:1px solid var(--border); }
  th { background:var(--soft); font-weight:500; font-size:11px; color:var(--fg2); }
  tr:last-child td { border-bottom:none; }
  .num { font-variant-numeric:tabular-nums; text-align:right; font-weight:600; }
  th.num, td.num { text-align:right; }
  /* #44:with-note 模式隐藏碳水/脂肪列(权威清单:日期/餐别/食物/克数/热量/蛋白/备注) */
  table.with-note th.opt, table.with-note td.opt { display:none; }
  /* #44:备注醒目——仅 with-note 模式生效(场景隔离:其他场景备注保持批准版灰斜体) */
  table.with-note td.note-cell:not(:empty)::before { content:'📝 '; }
  table.with-note td.note-cell:not(:empty) { font-weight:600; color:var(--accent); }
  .meal-tag { display:inline-block; padding:1px 8px; border-radius:6px; font-size:11px; font-weight:600; background:var(--soft); color:var(--fg2); }
  .meal-tag.breakfast { background:rgba(255,149,0,.12); color:var(--warn); }
  .meal-tag.lunch     { background:rgba(0,113,227,.12); color:var(--accent); }
  .meal-tag.dinner    { background:rgba(88,86,214,.12); color:#5856d6; }
  .meal-tag.snack     { background:rgba(52,199,89,.12); color:var(--good); }
  .filter-bar { display:flex; gap:8px; align-items:center; padding:12px 14px; background:var(--soft); border-radius:10px; margin-bottom:10px; }
  .filter-bar label { font-size:12px; color:var(--fg2); }
  .filter-bar select { font-size:13px; padding:4px 10px; border:1px solid var(--border); border-radius:6px; background:#fff; }
  .daily-hint { font-size:11px; color:var(--fg3); margin-top:8px; }
  /* #44:每日热量迷你趋势图 */
  .daily-chart { display:flex; align-items:flex-end; gap:3px; height:92px; padding:4px 2px 0; position:relative; border-bottom:1px solid var(--border); margin-bottom:10px; }
  .dcol { flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; min-width:0; justify-content:flex-end; }
  .dbar { width:100%; max-width:22px; background:var(--accent); border-radius:3px 3px 0 0; opacity:.85; }
  .dbar.over { background:var(--bad); opacity:.9; }
  .dbar.empty { background:var(--soft); opacity:1; }
  .dday { font-size:9px; color:var(--fg3); transform:rotate(-45deg); white-space:nowrap; }
  .dday-blank { visibility:hidden; width:24px; height:14px; }
  .davg { position:absolute; left:0; right:0; border-top:1px dashed var(--warn); font-size:9px; color:var(--warn); padding-left:2px; }
  .footer { margin-top:12px; padding:12px 14px; background:var(--soft); border-radius:12px; display:flex; justify-content:space-between; align-items:center; }
  .footer .src { font-size:12px; color:var(--fg3); }
  .footer .btn-group { display:flex; gap:6px; }  /* #44:桌面两按钮贴合 */
  .btn { border:1px solid var(--border); background:var(--card); padding:6px 12px; border-radius:8px; cursor:pointer; font-size:12px; color:var(--fg); white-space:nowrap; }
  .btn:hover { background:var(--accent); color:#fff; border-color:var(--accent); }
  .btn.copied { background:var(--good); color:#fff; border-color:var(--good); }
  .meta-bar { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
  .meta-bar .left { font-size:12px; color:var(--fg2); }
  .meta-bar .type-badge { font-size:11px; padding:3px 10px; border-radius:6px; background:var(--soft); color:var(--fg2); font-weight:600; }
  /* Phase 3c:mobile 断点(640px 以下单列堆叠 + 缩 padding) */
  @media (max-width:640px) {
    body { padding:20px 14px 40px; }  /* #44:底部空白减半 */
    h1 { font-size:22px; }
    .section { padding:16px 16px; border-radius:12px; }
    .kpi-grid { grid-template-columns:1fr 1fr; gap:10px; }
    .kpi { padding:12px 14px; }
    .kpi .value { font-size:20px; }
    /* #44:filter-bar 手机适配 */
    .filter-bar { flex-wrap:wrap; }
    .filter-bar select { flex:1; min-width:0; }
    /* #44:表格手机两段式紧凑卡——行1:日期时间+餐次+食物+克数热量;行2:蛋白·碳水·脂肪 等分 + 备注 */
    .table-wrap { overflow-x:visible; }
    thead { display:none; }
    tr { display:grid; grid-template-columns:auto auto 1fr auto; grid-template-areas:
           "a b c d" "e f g h" "i i i i"; gap:3px 10px; background:var(--card); border:1px solid var(--border);
         border-radius:14px; margin-bottom:10px; padding:10px 14px; position:relative; overflow:hidden;
         box-shadow:0 1px 4px rgba(0,0,0,.04); }
    tr::before { content:''; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--soft); }
    tr.tr-breakfast::before { background:var(--warn); }
    tr.tr-lunch::before { background:var(--accent); }
    tr.tr-dinner::before { background:#5856d6; }
    tr.tr-snack::before { background:var(--good); }
    td { display:block; border:none; padding:0; font-size:12px; }
    td.num { text-align:left; font-weight:400; }
    tr:last-child td { border:none; }
    td:nth-child(1){grid-area:a; color:var(--fg3); font-size:11px; font-variant-numeric:tabular-nums;}
    td:nth-child(2){grid-area:b}
    td:nth-child(3){grid-area:c; min-width:0; word-break:break-all; font-weight:600; font-size:13px;}
    td:nth-child(4){grid-area:e; color:var(--fg3); font-size:11px;}
    td:nth-child(5){grid-area:d; text-align:right; font-weight:700; font-size:13px; font-variant-numeric:tabular-nums;}
    td:nth-child(5)::after { content:' 卡'; font-weight:400; color:var(--fg3); font-size:11px; }
    td:nth-child(6){grid-area:f} td:nth-child(7){grid-area:g} td:nth-child(8){grid-area:h}
    td:nth-child(6)::before, td:nth-child(7)::before, td:nth-child(8)::before { content:attr(data-label); color:var(--fg3); font-size:10px; margin-right:2px; }
    td:nth-child(6), td:nth-child(7), td:nth-child(8) { font-size:11px; color:var(--fg2); font-variant-numeric:tabular-nums; text-align:left; }
    td:nth-child(9){grid-area:i; font-size:11px; color:var(--fg3); font-style:italic; margin-top:2px;}
    table.with-note td:nth-child(9):not(:empty) { font-style:normal; background:var(--soft); border-radius:8px; padding:6px 8px !important; margin-top:6px; font-weight:600; color:var(--accent); }
    td:nth-child(1)::before, td:nth-child(2)::before, td:nth-child(3)::before,
    td:nth-child(4)::before, td:nth-child(5)::before, td:nth-child(9)::before { content:none; }
    /* #44:按日汇总表——数据少用传统表格,手机保留表格形态(紧凑好看,不被上面卡片化规则覆盖) */
    .table-daily { width:100%; }
    .table-daily thead { display:table-header-group; }
    .table-daily tr { display:table-row; background:none; border:none; box-shadow:none; margin:0; padding:0; border-radius:0; }
    .table-daily tr::before { content:none; }
    .table-daily th, .table-daily td { display:table-cell; padding:6px 8px; font-size:11px; border-bottom:1px solid var(--border); }
    .table-daily th { background:var(--soft); font-weight:600; color:var(--fg2); white-space:nowrap; }
    .table-daily td:first-child { font-weight:600; color:var(--fg); }
    .table-daily td.num { text-align:right; font-weight:600; font-variant-numeric:tabular-nums; }
    .table-daily tr:last-child td { border-bottom:none; }
    /* 复制按钮手机有间距且不换行 */
    .footer { flex-direction:column; align-items:stretch; gap:8px; }
    .footer .btn-group { justify-content:space-between; }
    .footer .btn-group .btn { flex:1; margin:0 4px; }
    .footer .btn-group .btn:first-child { margin-left:0; }
    .footer .btn-group .btn:last-child { margin-right:0; }
  }
  /* table 在小屏内滚(桌面) */
  .table-wrap { overflow-x:auto; -webkit-overflow-scrolling:touch; }

</style>
</head>
<body>

<script id="payload" type="application/json"><!--INJECT-DATA--></script><script><!--SHARED-HELPERS--></script><script>window.__P__=(function(){try{return JSON.parse(document.getElementById('payload').textContent||'{}');}catch(e){return null;}})();</script>

<div class="meta-bar">
  <div class="left" id="metaLeft">--</div>
  <div class="type-badge">报告型 · 详细列表</div>
</div>

<h1>🍱 吃的记录</h1>
<p class="sub" id="sub">--</p>

<div class="kpi-grid">
  <div class="kpi"><div class="label">记录数</div><div class="value" id="kCnt">--</div><div class="extra" id="kCntE">--</div></div>
  <div class="kpi"><div class="label">总热量</div><div class="value" id="kCal">--</div><div class="extra" id="kCalE">--</div></div>
  <div class="kpi"><div class="label">总蛋白</div><div class="value" id="kProt">--</div><div class="extra" id="kProtE">--</div></div>
  <div class="kpi"><div class="label">总饮水</div><div class="value" id="kWater">--</div><div class="extra" id="kWaterE">--</div></div>
</div>

<div class="section" id="secDailySummary" style="display:none">
  <h2>按日汇总</h2>
  <div class="daily-chart" id="dailyChart"></div>
  <div class="daily-chart-axis"></div>
  <div class="table-wrap"><table class="table-daily">
    <thead>
      <tr><th>日期</th><th class="num">餐数</th><th class="num">总热量</th><th class="num">总蛋白</th><th class="num">日均对比</th></tr>
    </thead>
    <tbody id="dailyTable"></tbody>
  </table></div>
  <div class="daily-hint">点击日期行可筛选下方当日明细</div>
</div>

<div class="section" id="secDetail">
  <h2>每日明细</h2>
  <div class="filter-bar">
    <label>查看日期:</label>
    <select id="dateFilter"></select>
  </div>
  <div class="table-wrap"><table id="mealTbl">
    <thead>
      <tr><th>时间</th><th>餐次</th><th>食物</th><th class="num">克数</th><th class="num">热量</th><th class="num">蛋白</th><th class="num opt">碳水</th><th class="num opt">脂肪</th><th>备注</th></tr>
    </thead>
    <tbody id="mealTable"></tbody>
  </table></div>
</div>

<div class="footer">
  <div class="src" id="srcLine">📊 数据来源:--</div>
  <div id="actionbar-zone"></div>
</div>

<script>
let toastTimer = null;




// #44:数值统一最多 2 位小数
function fmt2(v) {
  const n = Number(v) || 0;
  const r = Math.round(n * 100) / 100;
  return Number.isInteger(r) ? String(r) : r.toFixed(2);
}

(function(){
  const D = window.__P__;
  if (!D || D.status !== 'ok') {
    document.body.innerHTML = '<div style="padding:60px;text-align:center;color:#86868b">⚠ 数据未注入或状态非 ok</div>';
    return;
  }
  const { summary, items, meta } = D.data;
  const MEAL_LABELS = {breakfast:'早餐', lunch:'午餐', dinner:'晚餐', snack:'加餐'};
  const isNote = !!summary.with_note;

  // #44:with-note 模式按权威清单只显示 日期/餐别/食物/克数/热量/蛋白/备注
  document.getElementById('mealTbl').classList.toggle('with-note', isNote);

  // #44:标题动态(本周饮食/最近 7 天饮食…)
  const h1 = document.querySelector('h1');
  h1.textContent = `🍱 ${meta.label || ''}饮食`;
  // issue #53 同族修复(2026-08-09 对抗审查):title 与 h1/文件名口径一致
  document.title = `卡路里 · ${meta.label || ''}饮食 ${meta.start} ~ ${meta.end}`;

  document.getElementById('metaLeft').textContent =
    `${meta.start} ~ ${meta.end} · 共 ${items.length} 条`;
  document.getElementById('sub').textContent =
    (summary.with_note ? `看「有备注」的饮食记录 · 共 ${summary.note_count} 条带备注` :
     `${meta.label || ''}饮食 · 共 ${items.length} 条食物明细 · ${meta.start} ~ ${meta.end}`);

  // 4 KPI(#44:总蛋白 extra 改日均蛋白,呈现数据「总蛋白/日均」)
  document.getElementById('kCnt').textContent = items.length;
  document.getElementById('kCntE').textContent = `跨 ${meta.days} 天`;
  document.getElementById('kCal').textContent = fmt2(summary.total_calorie);
  document.getElementById('kCalE').textContent = `日均 ${fmt2(summary.avg_calorie)} 卡`;
  document.getElementById('kProt').textContent = fmt2(summary.total_protein) + 'g';
  document.getElementById('kProtE').textContent = `日均 ${fmt2(summary.avg_protein)}g`;
  document.getElementById('kWater').textContent = fmt2(summary.total_water) + 'ml';
  document.getElementById('kWaterE').textContent = `日均 ${fmt2(summary.avg_water)}ml`;

  // 日期筛选
  const uniqueDates = [...new Set(items.map(i => i.date))].sort().reverse();
  const sel = document.getElementById('dateFilter');
  uniqueDates.forEach(d => {
    const opt = document.createElement('option');
    opt.value = d; opt.textContent = d;
    sel.appendChild(opt);
  });
  const lastOpt = document.createElement('option');
  lastOpt.value = '__all__'; lastOpt.textContent = `全部 (${items.length} 条)`;
  sel.insertBefore(lastOpt, sel.firstChild);
  sel.value = '__all__';

  // #44:按日汇总(呈现数据「按日汇总」· 跨天数 > 7 时显示,如本月/30 天) + 点击联动明细筛选
  if (meta.days > 7) {
    document.getElementById('secDailySummary').style.display = 'block';
    const byDate = {};
    items.forEach(i => {
      if (!byDate[i.date]) byDate[i.date] = {count: 0, cal: 0, prot: 0};
      byDate[i.date].count += 1;
      byDate[i.date].cal += Number(i.calorie) || 0;
      byDate[i.date].prot += Number(i.protein) || 0;
    });
    const dates = Object.keys(byDate).sort();
    const avgCal = summary.avg_calorie || 0;

    // #44:每日热量迷你趋势图——完整窗口(meta.start~meta.end)每天一柱,无记录天 0 高度
    // 注意:必须用本地日期格式化(toISOString 是 UTC,东八区会把日期提前一天——曾导致柱日错位)
    const chart = document.getElementById('dailyChart');
    const allDates = [];
    {
      const d0 = new Date(meta.start + 'T00:00:00');
      const d1 = new Date(meta.end + 'T00:00:00');
      const fmtD = dt => `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}-${String(dt.getDate()).padStart(2, '0')}`;
      for (let t = d0; t <= d1; t.setDate(t.getDate() + 1)) {
        allDates.push(fmtD(t));
      }
    }
    const maxV = Math.max(...allDates.map(d => (byDate[d] || {cal: 0}).cal), avgCal, 1);
    // #44:移动端窄容器日期标签稀疏化(斜标宽 > 柱宽会溢出,隔根显示·首尾保留)
    const step = window.innerWidth < 640 ? Math.max(1, Math.ceil(allDates.length / 6)) : 1;
    chart.innerHTML = allDates.map((d, i) => {
      const g = byDate[d] || {cal: 0};
      const h = g.cal > 0 ? Math.max(2, Math.round(g.cal / maxV * 72)) : 1;
      const over = g.cal > avgCal * 1.3;
      const showDay = i % step === 0 || i === allDates.length - 1;
      return `<div class="dcol" data-date="${d}" title="${d} ${fmt2(g.cal)} 卡">` +
             `<div class="dbar ${over ? 'over' : ''}${g.cal === 0 ? ' empty' : ''}" style="height:${h}px"></div>` +
             (showDay ? `<div class="dday">${d.slice(5)}</div>` : `<div class="dday dday-blank"></div>`) +
             `</div>`;
    }).join('');
    chart.insertAdjacentHTML('beforeend',
      `<div class="davg" style="bottom:${Math.round(avgCal / maxV * 72)}px">日均</div>`);
    // #44:趋势图柱点击联动当日明细(与汇总表一致;无数据日回退「全部」+ 提示)
    chart.querySelectorAll('.dcol').forEach(col => {
      col.onclick = () => {
        if (uniqueDates.includes(col.dataset.date)) {
          sel.value = col.dataset.date;
          window.toast(`${col.dataset.date} 的明细`);
        } else {
          sel.value = '__all__';
          window.toast(`${col.dataset.date} 无饮食记录,已显示全部`);
        }
        renderRows(sel.value);
        document.getElementById('secDetail').scrollIntoView({behavior: 'smooth'});
      };
    });

    const dTable = document.getElementById('dailyTable');
    dates.slice().reverse().forEach(d => {
      const g = byDate[d];
      const diff = g.cal - avgCal;
      const diffTxt = diff > avgCal * 0.3 ? `<span style="color:var(--bad)">+${fmt2(diff)}</span>`
                    : diff < -avgCal * 0.3 ? `<span style="color:var(--good)">${fmt2(diff)}</span>`
                    : `<span style="color:var(--fg3)">${diff >= 0 ? '+' : ''}${fmt2(diff)}</span>`;
      dTable.insertAdjacentHTML('beforeend',
        `<tr data-date="${d}" style="cursor:pointer"><td>${d}</td>` +
        `<td class="num">${g.count}</td>` +
        `<td class="num">${fmt2(g.cal)}</td>` +
        `<td class="num">${fmt2(g.prot)}g</td>` +
        `<td class="num">${diffTxt}</td></tr>`);
    });
    dTable.querySelectorAll('tr[data-date]').forEach(tr => {
      tr.onclick = () => {
        sel.value = tr.dataset.date;
        renderRows(sel.value);
        document.getElementById('secDetail').scrollIntoView({behavior: 'smooth'});
      };
    });
  }

  function renderRows(filterDate) {
    const filtered = filterDate === '__all__' ? items : items.filter(i => i.date === filterDate);
    const tb = document.getElementById('mealTable');
    tb.innerHTML = '';
    const sorted = filtered.slice().sort((a, b) => (b.date + (b.time||'')).localeCompare(a.date + (a.time||'')));
    sorted.forEach(p => {
      const tag = p.meal_type;
      const tagClass = ['breakfast','lunch','dinner','snack'].includes(tag) ? tag : '';
      const time = (p.time || '—').slice(0, 5);  // #44:时间只显示 HH:MM,去秒
      const trCls = tagClass ? ` class="tr-${tagClass}"` : '';
      tb.insertAdjacentHTML('beforeend',
        `<tr${trCls}><td>${p.date} ${time}</td>` +
        `<td><span class="meal-tag ${tagClass}">${MEAL_LABELS[tag] || tag}</span></td>` +
        `<td>${esc(p.food_name || p.food || '—')}</td>` +
        `<td class="num">${fmt2(p.grams)}g</td>` +
        `<td class="num">${fmt2(p.calorie)}</td>` +
        `<td class="num" data-label="蛋白质">${fmt2(p.protein)}g</td>` +
        `<td class="num opt" data-label="碳水">${fmt2(p.carb)}g</td>` +
        `<td class="num opt" data-label="脂肪">${fmt2(p.fat)}g</td>` +
        `<td class="note-cell">${p.note ? esc(p.note) : ''}</td></tr>`);
    });
  }
  function esc(s){return String(s == null ? '' : s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
  renderRows('__all__');
  sel.onchange = () => renderRows(sel.value);

  document.getElementById('srcLine').textContent =
