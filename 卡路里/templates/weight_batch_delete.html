<!DOCTYPE html>
<html lang="zh-CN">
<head>
<style><!--SHARED-CSS--></style>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>批量删除体重 · 卡路里</title>
<style>
:root{--bg:#f5f5f7;--card:#fff;--ink:#1d1d1f;--ink2:#3c3c43;--ink3:#8e8e93;--line:rgba(60,60,67,.14);--accent:#0071e3;--good:#34c759;--warn:#ff9500;--bad:#ff3b30;--shadow:0 1px 3px rgba(0,0,0,.05),0 8px 24px rgba(0,0,0,.05)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:640px;margin:0 auto;padding:24px 16px 56px}
.hero{background:linear-gradient(135deg,#fff,#fff3f3);border:1px solid rgba(255,59,48,.14);border-radius:20px;padding:24px 22px 18px;margin-bottom:14px;box-shadow:var(--shadow)}
.hero .icon{font-size:28px;margin-bottom:6px}
.hero h1{font-size:22px;font-weight:800;letter-spacing:-.3px}
.hero .meta{font-size:12px;color:var(--ink3);margin-top:6px}
.summary{background:var(--card);border-radius:16px;padding:14px 18px;font-size:14px;color:var(--ink);box-shadow:var(--shadow);margin-bottom:14px;border-left:3px solid var(--bad)}
.kpi-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.kpi{background:var(--card);border-radius:16px;padding:14px 16px;box-shadow:var(--shadow)}
.kpi .label{font-size:11px;color:var(--ink3);margin-bottom:6px}
.kpi .value{font-size:24px;font-weight:700;font-feature-settings:"tnum"}
.kpi .value.bad{color:var(--bad)}
.kpi .value.rng{display:flex;flex-direction:column;align-items:flex-start;font-size:15px;line-height:1.25}
.kpi .value.rng .tilde{font-size:11px;color:var(--ink3);padding:1px 0;letter-spacing:1px}
.kpi .extra{font-size:11px;color:var(--ink3);margin-top:4px}
.card{background:var(--card);border-radius:16px;box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden}
.card .head{padding:12px 16px;font-size:14px;font-weight:700;border-bottom:1px solid var(--line)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line)}
th{font-size:11px;color:var(--ink3);font-weight:700;background:#fafafa}
td.kg{font-weight:700;font-feature-settings:"tnum"}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px}
.btn{flex:1;border:0;border-radius:12px;padding:13px 16px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap}
.btn.primary{background:var(--bad);color:#fff}
.btn.ghost{background:var(--card);color:var(--ink2);box-shadow:var(--shadow)}
.footer{text-align:center;font-size:11px;color:var(--ink3);margin-top:16px}
@media(max-width:480px){.kpi-grid{grid-template-columns:1fr 1fr;grid-template-areas:"count range" "days range";gap:10px}
.kpi:nth-child(1){grid-area:count}.kpi:nth-child(2){grid-area:range}.kpi:nth-child(3){grid-area:days}
.kpi .value{font-size:19px}
.actions .btn{flex:1 1 45%;min-height:42px;padding:10px 12px;font-size:13px}}
</style>
</head>
<body>
<div class="wrap">

  <div class="hero">
    <div class="icon">🗑</div>
    <h1>批量删除体重</h1>
    <div class="meta" id="metaLine">加载中...</div>
  </div>

  <div class="summary" id="summaryLine">💬 加载中...</div>

  <div class="kpi-grid">
    <div class="kpi"><div class="label">删除条数</div><div class="value bad" id="kpiCount">—</div><div class="extra" id="kpiCountExtra">条</div></div>
    <div class="kpi"><div class="label">时间范围</div><div class="value" id="kpiRange" style="font-size:16px;line-height:1.3">—</div><div class="extra">区间</div></div>
    <div class="kpi"><div class="label">涉及天数</div><div class="value" id="kpiDays">—</div><div class="extra">天</div></div>
  </div>

  <div class="card">
    <div class="head">📋 已删除记录明细</div>
    <table>
      <thead><tr><th>日期</th><th>时间</th><th>体重</th><th>BMI</th><th>备注</th></tr></thead>
      <tbody id="itemsBody"></tbody>
    </table>
    <div class="insight" id="changeLine" style="padding:10px 16px;font-size:12.5px;color:var(--ink2);border-top:1px solid var(--line);display:none"></div>
  </div>

  <div class="status-card" id="statusCard" style="display:none;background:var(--card);border-radius:16px;padding:12px 16px;margin-bottom:14px;box-shadow:var(--shadow);font-size:13px;color:var(--ink2);border-left:3px solid var(--good)">
    <b id="statusTitle"></b> <span id="statusDetail"></span>
  </div>

  <div class="actions">
    <button class="btn primary" id="undoBtn">↩ 复制撤销指令</button>
    
    
  </div>

  <div class="footer">卡路里 Skill · 批量删除体重回执</div>

</div>

<script id="payload" type="application/json"><!--INJECT-DATA--></script><script><!--SHARED-HELPERS--></script><script>window.__P__=(function(){try{return JSON.parse(document.getElementById('payload').textContent||'{}');}catch(e){return null;}})();</script>

<script>
const DATA = window.__P__ && window.__P__.data || {};
const d = DATA;
document.getElementById('metaLine').textContent = (d.meta && d.meta.action_at || '') + ' · ' + (d.meta && d.meta.entity_type || '');
document.getElementById('summaryLine').textContent = '💬 ' + (d.summary || '');
const items = d.items || [];
document.getElementById('kpiCount').textContent = String(items.length);
document.getElementById('kpiDays').textContent = String(new Set(items.map(i => i.date)).size);
const range = (d.meta && d.meta.action_at) || (d.context && d.context.totals && d.context.totals[0] ? d.context.totals[0].value : '—');
const rangeEl = document.getElementById('kpiRange');
if (range.includes('~')) {
  const parts = range.split('~').map(s => s.trim());
  rangeEl.className = 'value rng';
  rangeEl.innerHTML = '<span>' + parts[0] + '</span><span class="tilde">~</span><span>' + (parts[1] || '') + '</span>';
} else {
  rangeEl.textContent = range;
}
const body = document.getElementById('itemsBody');
if (items.length) {
  items.forEach(i => {
    const tr = document.createElement('tr');
    tr.innerHTML = '<td>' + (i.date || '—') + '</td><td>' + (i.time || '—') + '</td>' +
      '<td class="kg">' + (i.weight_kg != null ? i.weight_kg + ' kg' : '—') + '</td>' +
      '<td>' + (i.bmi != null ? i.bmi : '—') + '</td><td>' + (i.note || '—') + '</td>';
    body.appendChild(tr);
  });
} else {
  body.innerHTML = '<tr><td colspan="5" style="color:#86868b;text-align:center;padding:16px">无删除记录</td></tr>';
}

// 区间变化摘要(2026-08-09 #43 审查建议②)
if (items.length >= 2) {
  const fw = items[0].weight_kg, lw = items[items.length - 1].weight_kg;
  if (fw != null && lw != null) {
    const delta = lw - fw;
    const sign = delta > 0 ? '+' : '';
    document.getElementById('changeLine').style.display = 'block';
    document.getElementById('changeLine').innerHTML =
      '📈 区间变化: <b>' + fw + ' → ' + lw + ' kg</b> (' + sign + delta.toFixed(1) + ' kg, ' +
      (delta > 0 ? '上升' : delta < 0 ? '下降' : '持平') + ')';
  }
}
// 删除后最新体重提示(2026-08-09 #43 审查建议①)
if (d.latest_after && d.latest_after.weight_kg != null) {
  document.getElementById('statusCard').style.display = 'block';
  document.getElementById('statusTitle').textContent = '删除后最新体重:';
  document.getElementById('statusDetail').textContent =
    d.latest_after.weight_kg + ' kg (' + d.latest_after.date + ')';
}document.getElementById('undoBtn').addEventListener('click', function() {
  const undo = d.meta && d.meta.undo_cli;
  if (undo) copyText(undo, this);
  window.toast('撤销命令已复制');
});
</script>



<div id="actionbar-zone"></div>
<script>(function(){var z=document.getElementById('actionbar-zone');if(z&&window.actionBar&&window.__P__){z.innerHTML=window.actionBar(window.__P__);}})();</script>
</body>
</html>
