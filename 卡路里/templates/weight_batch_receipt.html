<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>批量补录体重 · 卡路里</title>
<style>
:root{
  --bg:#f5f5f7;--card:#fff;
  --ink:#1d1d1f;--ink2:#3c3c43;--ink3:#8e8e93;
  --line:rgba(60,60,67,.12);--lineS:rgba(60,60,67,.06);
  --accent:#0071e3;--good:#34c759;--warn:#ff9500;--bad:#ff3b30;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:920px;margin:0 auto;padding:32px 20px 80px}
h1{font-size:24px;font-weight:700;letter-spacing:-.02em;margin-bottom:4px}
.sub{font-size:13px;color:var(--ink3);margin-bottom:20px}
.kpi-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--lineS);border-radius:16px;padding:16px 14px;text-align:center}
.kpi .label{font-size:11px;color:var(--ink2);margin-bottom:6px}
.kpi .value{font-size:24px;font-weight:700;font-feature-settings:"tnum"}
.kpi .value.good{color:var(--good)}.kpi .value.warn{color:var(--warn)}.kpi .value.bad{color:var(--bad)}
.kpi .extra{font-size:11px;color:var(--ink3);margin-top:4px}
.section{background:var(--card);border-radius:18px;padding:22px 26px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.04);border:1px solid rgba(60,60,67,.06)}
.section h2{font-size:15px;font-weight:600;margin-bottom:12px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--lineS)}
th{background:var(--soft);font-weight:500;font-size:11px;color:var(--ink2)}
tr:last-child td{border-bottom:none}
td.num{font-variant-numeric:tabular-nums;text-align:right;font-weight:600}
.pill{display:inline-block;padding:2px 9px;border-radius:10px;font-size:11px;font-weight:600}
.pill-good{background:rgba(52,199,89,.15);color:var(--good)}
.pill-warn{background:rgba(255,149,0,.15);color:var(--warn)}
.pill-bad{background:rgba(255,59,48,.15);color:var(--bad)}
.reason{color:var(--ink3);font-size:12px}
.summary{background:var(--card);border-radius:14px;padding:16px 18px;margin-bottom:14px;border:1px solid var(--lineS);font-size:14px}
.summary .lbl{font-size:11px;color:var(--ink3);margin-bottom:4px}
.footer{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:var(--card);border-radius:12px;border:1px solid var(--lineS)}
.footer .src{font-size:11px;color:var(--ink3)}
.btn{border:1px solid var(--line);background:var(--card);padding:7px 14px;border-radius:9px;cursor:pointer;font-size:12px;color:var(--ink);min-height:36px}
.btn:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
@media(max-width:640px){
  .wrap{padding:20px 10px 60px}
  .kpi-grid{grid-template-columns:repeat(3,1fr)}
  .kpi .value{font-size:19px}
  .section{padding:16px 10px}
  .footer{flex-direction:column;gap:8px;align-items:flex-start}
  table{font-size:11px}
  th,td{padding:7px 6px}
}
</style>
</head>
<body>
<div class="wrap">
<h1>📥 批量补录体重</h1>
<p class="sub" id="subtitle">--</p>
<div class="kpi-grid">
  <div class="kpi"><div class="label">写入</div><div class="value good" id="kpiWrote">0</div></div>
  <div class="kpi"><div class="label">跳过</div><div class="value warn" id="kpiSkipped">0</div></div>
  <div class="kpi"><div class="label">失败</div><div class="value bad" id="kpiFailed">0</div></div>
</div>
<div class="section">
  <h2>明细</h2>
  <table>
    <thead><tr><th>日期</th><th class="num">体重</th><th>结果</th><th>说明</th></tr></thead>
    <tbody id="tableBody"></tbody>
  </table>
</div>
<div class="summary" id="summaryCard" style="display:none">
  <div class="lbl">总结</div>
  <span id="summaryText"></span>
</div>
<div class="footer">
  <div class="src" id="srcLine">📊 数据来源 --</div>
  <button class="btn" id="copyBtn">📋 复制数据</button>
</div>
</div>
<!--INJECT-DATA-->
<script>
(function(){
  const D = window.__DATA__;
  if (!D || D.status !== 'ok') {
    document.body.innerHTML = '<div style="padding:60px;text-align:center;color:#86868b">⚠ 数据未注入或状态非 ok</div>';
    return;
  }
  const d = D.data;
  document.getElementById('subtitle').textContent = d.subtitle || '';
  document.getElementById('kpiWrote').textContent = d.wrote || 0;
  document.getElementById('kpiSkipped').textContent = d.skipped || 0;
  document.getElementById('kpiFailed').textContent = d.failed || 0;
  const tb = document.getElementById('tableBody');
  (d.items || []).forEach(it => {
    const st = it.status;
    const pill = st === '写入' ? 'pill-good' : st === '跳过' ? 'pill-warn' : 'pill-bad';
    tb.insertAdjacentHTML('beforeend',
      `<tr><td>${it.date}</td><td class="num">${it.kg} kg</td>` +
      `<td><span class="pill ${pill}">${st}</span></td>` +
      `<td class="reason">${it.reason || ''}</td></tr>`);
  });
  if (d.summary) {
    document.getElementById('summaryText').textContent = d.summary;
    document.getElementById('summaryCard').style.display = 'block';
  }
  document.getElementById('srcLine').textContent = '📊 数据来源:weight_log · 批量补录 · ' + (d.meta && d.meta.generated_at || new Date().toISOString().split('T')[0]);
  document.getElementById('copyBtn').onclick = function() {
    let r = '批量补录体重(回执)\n';
    r += `  写入 ${d.wrote} · 跳过 ${d.skipped} · 失败 ${d.failed}\n`;
    (d.items || []).forEach(it => { r += `  ${it.date}  ${it.kg} kg  ${it.status}${it.reason ? ' ' + it.reason : ''}\n`; });
    if (d.summary) r += d.summary + '\n';
    const after = () => { this.textContent = '✓ 已复制'; setTimeout(() => this.textContent = '📋 复制数据', 2000); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(r).then(after);
    } else {
      const ta = document.createElement('textarea');
      ta.value = r; document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); after(); } catch(e) {}
      document.body.removeChild(ta);
    }
  };
})();
</script>
</body>
</html>
