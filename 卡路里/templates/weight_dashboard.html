<!doctype html>
<html lang="zh-CN">
<head>
<style><!--SHARED-CSS--></style>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>体重总览 · 卡路里</title>
<style>
:root{
  --bg:#f5f5f7;--card:#fff;
  --ink:#1d1d1f;--ink2:#3c3c43;--ink3:#8e8e93;
  --line:rgba(60,60,67,.12);--lineS:rgba(60,60,67,.06);
  --accent:#0071e3;--good:#34c759;--warn:#ff9500;--bad:#ff3b30;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:920px;margin:0 auto;padding:32px 20px 80px}
h1{font-size:24px;font-weight:700;letter-spacing:-.02em;margin-bottom:4px}
.sub{font-size:13px;color:var(--ink3);margin-bottom:20px}
.kpi-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--lineS);border-radius:16px;padding:16px 14px;text-align:center}
.kpi .label{font-size:11px;color:var(--ink2);margin-bottom:6px}
.kpi .value{font-size:21px;font-weight:700;font-feature-settings:"tnum"}
.kpi .value.good{color:var(--good)}.kpi .value.warn{color:var(--warn)}.kpi .value.bad{color:var(--bad)}
.kpi .extra{font-size:11px;color:var(--ink3);margin-top:4px}
.section{background:var(--card);border-radius:18px;padding:22px 26px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.04);border:1px solid rgba(60,60,67,.06)}
.section h2{font-size:15px;font-weight:600;margin-bottom:12px}
.todayCard{background:var(--card);border:1px solid var(--lineS);border-radius:18px;margin-bottom:14px;padding:14px 0 8px}
.today-big{font-size:52px;font-weight:700;letter-spacing:-1px;text-align:center;padding:18px 0 6px;font-feature-settings:"tnum"}
.today-big .unit{font-size:20px;color:var(--ink3);font-weight:500;margin-left:6px}
.today-meta{text-align:center;color:var(--ink2);font-size:13px;margin-bottom:6px}
.today-delta{text-align:center;font-size:15px;font-weight:600;margin-bottom:16px}
.today-delta.good{color:var(--good)}.today-delta.bad{color:var(--bad)}
.summary{background:var(--card);border-radius:14px;padding:16px 18px;margin-bottom:14px;border:1px solid var(--lineS);font-size:14px}
.summary .lbl{font-size:11px;color:var(--ink3);margin-bottom:4px}
.footer{display:flex;justify-content:flex-end;align-items:center;padding:12px 16px;background:var(--card);border-radius:12px;border:1px solid var(--lineS)}
.btn-group{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--card);padding:7px 14px;border-radius:9px;cursor:pointer;font-size:12px;color:var(--ink);min-height:36px}
.btn:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.primary:hover{background:#005bb0;color:#fff;border-color:#005bb0}
@media(max-width:640px){
  .wrap{padding:20px 10px 60px}
  .kpi-grid{grid-template-columns:repeat(2,1fr)}
  .kpi:nth-child(5){grid-column:span 2}
  .section{padding:16px 12px}
  .footer{flex-direction:column;gap:10px;align-items:stretch}
  .footer .btn-group{width:100%}
  .footer .btn-group .btn{flex:1 1 45%;min-height:42px;white-space:nowrap}
  .today-big{font-size:42px}
}
</style>
</head>
<body>
<div class="wrap">
<h1 id="title">⚖️ 体重总览</h1>
<p class="sub" id="subtitle">--</p>
<div class="kpi-grid" id="kpis"></div>
<div class="section" id="trendSection">
  <h2 id="trendTitle">最近 7 天趋势</h2>
  <div id="trendSvg"></div>
</div>
<div class="todayCard" id="todayCard" style="display:none">
  <div class="today-big" id="todayKg">--<span class="unit">kg</span></div>
  <div class="today-meta" id="todayMeta">--</div>
  <div class="today-delta" id="todayDelta">--</div>
</div>
<div class="summary" id="summaryCard" style="display:none">
  <div class="lbl">总结</div>
  <span id="summaryText"></span>
</div>
<div class="footer">
  
</div>
</div>
<script id="payload" type="application/json"><!--INJECT-DATA--></script><script><!--SHARED-HELPERS--></script><script><!--CHARTS-HELPERS--></script><script>window.__P__=(function(){try{return JSON.parse(document.getElementById('payload').textContent||'{}');}catch(e){return null;}})();</script>
<script>
(function(){
  const D = window.__P__;
  if (!D || D.status !== 'ok') {
    document.body.innerHTML = window.errorReceipt({message: '数据未注入或状态非 ok'});
    return;
  }
  const d = D.data;
  document.getElementById('title').textContent = d.title || '体重总览';
  document.getElementById('subtitle').textContent = d.subtitle || '';
  const kpis = document.getElementById('kpis');
  (d.kpis || []).forEach(k => {
    kpis.insertAdjacentHTML('beforeend',
      `<div class="kpi"><div class="label">${k.label}</div>` +
      `<div class="value ${k.cls||''}">${k.value}</div>` +
      (k.extra ? `<div class="extra">${k.extra}</div>` : '') + `</div>`);
  });
  const pts = d.trend_points || [];
  if (d.view === 'today') {
    // today 视图呈现数据 = 今日体重/距上次/一句话,今日卡+总结卡已全覆盖;
    // KPI 行纯冗余且 3 卡撑不满 5 列网格 → 隐藏(2026-08-03 · ticket #43 场景 5 终审)
    document.getElementById('kpis').style.display = 'none';
    document.getElementById('trendSection').style.display = 'none';
    document.getElementById('todayCard').style.display = 'block';
    document.getElementById('todayKg').innerHTML = (d.today_kg === undefined ? '—' : d.today_kg) + '<span class="unit">kg</span>';
    document.getElementById('todayMeta').textContent = d.today_date ? d.today_date + ' 记录' : '';
    const dl = document.getElementById('todayDelta');
    if (d.delta_last !== undefined && d.delta_last !== null) {
      const up = d.delta_last > 0, zero = d.delta_last === 0;
      dl.innerHTML = `较上次 ${up ? '+' : ''}${d.delta_last} kg`;
      dl.className = 'today-delta ' + (zero ? '' : (up ? 'bad' : 'good'));
    }
  } else if (pts.length >= 2) {
    // #317 迁 Base charts.line: Catmull 平滑 + 面积 + 末点高亮
    // Y 轴 nice 刻度(0.1 整数倍, 居中展开)由 yMin/yMax 显式传入(保留 #43 方差过小防贴底)
    const kgs = pts.map(p => p.kg);
    const rawMin = Math.min.apply(null, kgs), rawMax = Math.max.apply(null, kgs);
    const span0 = Math.max(rawMax - rawMin, 0.4);
    const step = Math.max(0.1, Math.ceil(span0 / 3 * 10) / 10);
    const span = step * 3;
    const padKg = (span - (rawMax - rawMin)) / 2;
    const minW = rawMin - padKg, maxW = rawMax + padKg;
    window.charts.line(document.getElementById('trendSvg'),
      pts.map(p => ({ label: p.date.slice(5), value: p.kg })),
      {
        height: 240,
        smooth: true,
        area: true,
        highlightLast: true,
        yMin: minW, yMax: maxW,
        labels: 'select',
        format: v => `${Number(v).toFixed(1)}kg`,
        tooltip: true,
      });
    document.getElementById('trendTitle').textContent = d.trend_title || '最近 7 天趋势';
  } else {
    document.getElementById('trendSection').style.display = 'none';
  }
  if (d.summary) {
    document.getElementById('summaryText').textContent = d.summary;
    document.getElementById('summaryCard').style.display = 'block';
  }
  const meta = d.meta || {};
  
  
  })();
</script>

<div id="actionbar-zone"></div>
<script>(function(){var z=document.getElementById('actionbar-zone');if(z&&window.actionBar&&window.__P__){z.innerHTML=window.actionBar(window.__P__);}})();</script>
</body>
</html>
