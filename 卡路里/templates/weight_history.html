<!DOCTYPE html>
<html lang="zh-CN">
<head>
<style><!--SHARED-CSS--></style>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>卡路里 · 体重分析</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --fg:#1d1d1f; --fg2:#6e6e73; --fg3:#86868b; --bg:#fafafa;
    --card:#fff; --border:#d2d2d7; --accent:#0071e3;
    --good:#34c759; --warn:#ff9500; --bad:#ff3b30; --soft:#f5f5f7;
  }
  body { font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
         line-height:1.6; color:var(--fg); background:var(--bg);
         max-width:920px; margin:0 auto; padding:48px 24px 80px;
         -webkit-font-smoothing:antialiased; }
  h1 { font-size:28px; font-weight:700; letter-spacing:-.02em; margin-bottom:4px; }
  .sub { font-size:14px; color:var(--fg3); margin-bottom:24px; }
  .pill { display:inline-block; padding:2px 9px; border-radius:10px; font-size:11px; font-weight:600; margin-right:4px; }
  .pill-good { background:rgba(52,199,89,.15); color:var(--good); }
  .pill-warn { background:rgba(255,149,0,.15); color:var(--warn); }
  .pill-bad  { background:rgba(255,59,48,.15); color:var(--bad); }
  .pill-info { background:rgba(0,113,227,.15); color:var(--accent); }
  .kpi-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:20px; }
  .kpi { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:16px 18px; }
  .kpi .label { font-size:12px; color:var(--fg2); margin-bottom:6px; }
  .kpi .value { font-size:24px; font-weight:700; }
  .kpi .extra { font-size:11px; color:var(--fg3); margin-top:3px; }
  .kpi .extra.good { color:var(--good); }
  .section { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:22px 26px; margin-bottom:16px; }
  .section h2 { font-size:17px; font-weight:600; margin-bottom:14px; }
  .legend { font-size:12px; color:var(--fg2); margin-top:10px; display:flex; gap:18px; flex-wrap:wrap; }
  .legend span { display:inline-flex; align-items:center; gap:6px; }
  .legend i { display:inline-block; width:14px; }
  .legend .a { background:var(--accent); height:2px; }
  .legend .b { background:transparent; border-top:2px dashed var(--warn); height:0; }
  .legend .c { background:transparent; border-top:2px dashed var(--good); height:0; }
  .legend .d { background:transparent; border-top:2px dashed #8e8e93; height:0; }
  .legend .trend-rate-badge { padding:3px 10px; border-radius:10px; background:var(--soft); color:var(--fg2); font-weight:600; font-variant-numeric:tabular-nums; }
  .legend .trend-rate-badge.good { background:rgba(52,199,89,.15); color:var(--good); }
  .legend .trend-rate-badge.bad { background:rgba(255,59,48,.12); color:var(--bad); }
  /* V2.4 fix: target 不在数据范围时显示距离 badge */
  .legend .target-badge { padding:3px 10px; border-radius:10px; background:rgba(255,149,0,.12); color:var(--warn); font-weight:600; font-variant-numeric:tabular-nums; }
  .legend .target-badge.good { background:rgba(52,199,89,.15); color:var(--good); }
  .legend .target-badge.bad { background:rgba(255,59,48,.12); color:var(--bad); }
  table { width:100%; table-layout:fixed; border-collapse:collapse; font-size:13px; }
  th.date, td.date { width:16%; white-space:nowrap; overflow:hidden; text-overflow:clip; }
  /* V2.5.28: 注 列删除(用户: '直接删除')。
     仅保留 4 列:日期 / BMI / 体重 / vs上次。
     旧 th.note/td.note CSS 仍保留以防外部引用,不再使用。 */
  th.num, td.num { width:auto; white-space:nowrap; }
  th.kg, td.kg { width:auto; white-space:nowrap; }
  /* V2 fix: 体重列(nth-child(3))宽度强制 20% — 兼容旧数据(th 可能没 kg class) */
  .table-wrap table thead th:nth-child(3),
  .table-wrap table tbody td:nth-child(3) { width:auto; white-space:nowrap; }
  /* V2.5.26: vs上次 列固定一个合适的窄宽度(容纳 "−1.6" chip + padding),
     避免 width:auto 在 fixed table-layout 下被均分放大 */
  .table-wrap table thead th:nth-child(4),
  .table-wrap table tbody td:nth-child(4) { width:60px; white-space:nowrap; }
  /* V2.5.2: 注 列 25% → 12%(用户: '注 列还是太宽,文字左右都有空白')
     12% × 380 = 45.6px - '晨起空腹' 4 字约 44px,基本贴合内容宽度 */
  th.note, td.note { width:12%; overflow:visible; text-overflow:clip; white-space:nowrap; }
  /* V2.5.4 fix: nth-child(5) 兜底 — 兼容旧数据 th 没 note class(同 kg 列 nth-child(3) 模式)
     overflow:visible 让 '晨起空腹' 等较长 note 溢出到右侧 section padding 区域,不 ellipsis 截断 */
  .table-wrap table thead th:nth-child(5),
  .table-wrap table tbody td:nth-child(5) { width:12%; overflow:visible; text-overflow:clip; white-space:nowrap; }
  th,td { padding:9px 12px; text-align:left; border-bottom:1px solid var(--border); }
  th { background:var(--soft); font-weight:500; font-size:11px; color:var(--fg2); }
  tr:last-child td { border-bottom:none; }
  .num { font-variant-numeric:tabular-nums; text-align:right; font-weight:600; }
  th.num, td.num { text-align:right; }
  .delta-down { color:var(--good); }
  .delta-up   { color:var(--bad); }
  .delta-flat { color:var(--fg3); }
  .footer { margin-top:24px; padding:14px 18px; background:var(--soft); border-radius:12px; display:flex; justify-content:space-between; align-items:center; gap:12px; }
  .footer .src { font-size:12px; color:var(--fg3); }
  .footer .btn-row { display:flex; gap:10px; flex-shrink:0; }
  .btn { border:1px solid var(--border); background:var(--card); padding:6px 12px; border-radius:8px; cursor:pointer; font-size:12px; color:var(--fg); white-space:nowrap; }
  .btn:hover { background:var(--accent); color:#fff; border-color:var(--accent); }
  .meta-bar { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
  .meta-bar .left { font-size:12px; color:var(--fg2); }
  .meta-bar .mode-badge { font-size:11px; padding:3px 10px; border-radius:6px; background:var(--accent); color:#fff; font-weight:700; }

  /* ticket 05 · Issue 3/4/5 修复:mobile-first 断点 + 4 polish 改动 */
  @media (max-width:640px) {
    body { padding:20px 8px 80px; max-width:none; }
    .kpi-grid { grid-template-columns:repeat(2,1fr); gap:10px; }
    /* M3 fix: KPI value 字号缩到 17px(防 173px/卡 贴边) */
    .kpi .value { font-size:17px; }
    .section { padding:16px 8px; border-radius:12px; }
    .section h2 { font-size:15px; }
    .footer { flex-direction:column; gap:8px; align-items:stretch; }
    /* 2026-08-10 #43 审查:移动端按钮横排半宽 + 44px 触控高度 */
    .footer .btn-row { width:100%; }
    .footer .btn-row .btn { flex:1; min-height:44px; padding:10px 14px; font-size:13px; }
    /* H2 fix: note 列 padding 6px 6px(原 6px 4px 太挤 4 字符) */
    .table-wrap table { font-size:11px; }
    /* V2.1 fix: 不再用 word-break:break-all(否则 '90.9 kg' 换行成 '90.9 k\\ng') */
    .table-wrap table th, .table-wrap table td { padding:6px 6px; white-space:nowrap; }
    /* V2.5.28: 隐藏 注 列(用户决定删除);旧 td.note 不会渲染,规则仅兜底 */
    .table-wrap table th.note, .table-wrap table td.note { display:none; }
    /* 2026-08-10 #43:notes 模式(看「有备注」的体重记录)必须显示备注列 —— 场景呈现数据核心 */
    .table-wrap table.notes-mode th.note, .table-wrap table.notes-mode td.note { display: table-cell; }
    /* V2.5.26: 覆盖 mobile 块内的 table 通用 font:11px,date 列需要更小 */
    .table-wrap table th.date, .table-wrap table td:first-child { font-size:10px !important; }
    .table-wrap table td.note { white-space:normal; overflow:hidden; text-overflow:ellipsis; }
    /* M1 fix: sticky thead(24 行表滚 1168px 高时表头跟随) */
    .table-wrap thead th { position:sticky; top:0; background:var(--card); z-index:1; }
    /* L1 fix: 表格 line-height 紧凑(原 1.6 太散) */
    .table-wrap table tbody tr { line-height:1.4; }
    /* M2 fix: delta 列 chip 化(裸数字 → 圆角 badge) */
    /* V2.5.3 fix: chip 用 .delta-chip span 包裹,td.delta 保持 table-cell 占满 column
       (旧 td.delta { display:inline-block } 让 td 塌陷成 chip 宽度,vs上次 header 57px / cell 31px 错位) */
    .table-wrap table td.delta { padding:6px 6px; text-align:right; }
    .table-wrap table .delta-chip { display:inline-block; padding:2px 8px; border-radius:10px; font-weight:600; text-align:right; font-variant-numeric:tabular-nums; }
    .table-wrap table .delta-up { background:rgba(255,59,48,.12); color:var(--bad); }
    .table-wrap table .delta-down { background:rgba(52,199,89,.12); color:var(--good); }
    .table-wrap table .delta-flat { background:rgba(0,113,227,.08); color:var(--fg2); }
    /* L3 fix: 空态(无数据)显示提示 */
    .table-wrap .empty-state { padding:20px; text-align:center; color:var(--fg3); }
  }
  /* ticket 05 · Issue 3/4/5 修复:table-wrap 包装让 table 在小屏内滚 */
  .table-wrap { overflow-x:auto; -webkit-overflow-scrolling:touch; }

  @keyframes fadeup{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
</style>
</head>
<body>

<script id="payload" type="application/json"><!--INJECT-DATA--></script><script><!--SHARED-HELPERS--></script><script><!--CHARTS-HELPERS--></script><script>window.__P__=(function(){try{return JSON.parse(document.getElementById('payload').textContent||'{}');}catch(e){return null;}})();</script>

<div class="meta-bar">
  <div class="left" id="metaLeft">--</div>
  <div class="mode-badge" id="modeBadge">--</div>
</div>

<h1 id="h1Title">⚖️ 体重历史</h1>
<p class="sub" id="sub">--</p>

<div class="kpi-grid" id="kpis">
  <div class="kpi"><div class="label" id="k1L">--</div><div class="value" id="k1">--</div><div class="extra" id="k1E">--</div></div>
  <div class="kpi"><div class="label" id="k2L">--</div><div class="value" id="k2">--</div><div class="extra" id="k2E">--</div></div>
  <div class="kpi"><div class="label" id="k3L">--</div><div class="value" id="k3">--</div><div class="extra" id="k3E">--</div></div>
  <div class="kpi"><div class="label" id="k4L">--</div><div class="value" id="k4">--</div><div class="extra" id="k4E">--</div></div>
</div>

<div class="section" id="chartSection">
  <h2 id="chartTitle">体重曲线</h2>
  <div id="chart"></div>
  <div class="legend" id="legend"></div>
</div>

<div class="section" id="tableSection">
  <h2>明细</h2>
  <div class="table-wrap">
  <table>
    <thead id="tableHead"></thead>
    <tbody id="tableBody"></tbody>
  </table>
  </div>
</div>

<div class="footer">
  <div class="src" id="srcLine">📊 数据来源--</div>
  <div class="btn-row">
    
    
  </div>
</div>

<script>
(function(){
  const D = window.__P__;
  if (!D || D.status !== 'ok') {
    document.body.innerHTML = '<div style="padding:60px;text-align:center;color:#86868b">⚠ 数据未注入或状态非 ok</div>';
    return;
  }
  const { summary, items, target, meta, mode, milestones } = D.data;
  const m = mode || 'history';

  document.getElementById('metaLeft').textContent =
    `${meta.start} ~ ${meta.end} · 共 ${items.length} 条`;
  document.getElementById('modeBadge').textContent = m.toUpperCase();
  document.getElementById('modeBadge').className = 'mode-badge';

  // 标题
  const titles = {
    history: '⚖️ 体重明细',
    trend: '📉 体重曲线',
    volatility: '📊 体重稳不稳',
    compare: '🔄 对比体重',
    notes: '🗒 带备注的体重记录'
  };
  document.getElementById('h1Title').textContent = D.data.scene_name || titles[m] || titles.history;
  document.getElementById('sub').textContent = summary.subtitle;

  // 4 KPI
  document.getElementById('k1L').textContent = summary.k1.label;
  document.getElementById('k1').textContent = summary.k1.value;
  document.getElementById('k1E').innerHTML = summary.k1.extra;

  document.getElementById('k2L').textContent = summary.k2.label;
  document.getElementById('k2').textContent = summary.k2.value;
  document.getElementById('k2E').innerHTML = summary.k2.extra;

  document.getElementById('k3L').textContent = summary.k3.label;
  document.getElementById('k3').textContent = summary.k3.value;
  document.getElementById('k3E').innerHTML = summary.k3.extra;

  document.getElementById('k4L').textContent = summary.k4.label;
  document.getElementById('k4').textContent = summary.k4.value;
  document.getElementById('k4E').innerHTML = summary.k4.extra;

  // 折线图(适用于 trend/history/volatility) · #317 迁 Base charts.line
  if (m !== 'compare' && items.length > 0) {
    const chartEl = document.getElementById('chart');
    const weights = items.map(i => i.kg);
    let minW = Math.min(...weights), maxW = Math.max(...weights);
    const range = (maxW - minW) || 1;
    // V2.4 fix: Y 轴只由数据驱动,不基于 target 扩张;
    // target 用 markLine(范围内)或下方 badge(范围外)显示距离
    const axisPadding = Math.max(0.5, range * 0.05);
    let minY = Math.floor(minW - axisPadding);
    let maxY = Math.ceil(maxW + axisPadding);
    const targetInRange = target && target >= minY && target <= maxY;
    const lineItems = items.map(p => ({ label: p.date.slice(5), value: p.kg }));
    const lineOpt = {
      height: 380,
      format: v => `${v}kg`,
      avgLine: 7,
      labels: 'select',
      highlightLast: true,
      tooltip: true,
      yMin: minY, yMax: maxY,
    };
    if (target && targetInRange) {
      lineOpt.markLine = { value: target, label: `目标 ${target}kg` };
    }
    window.charts.line(chartEl, lineItems, lineOpt);

    // V2.4 fix: target 不在范围时,SVG 下方 badge 显示"目标 Xkg, 还差 Ykg"
    let legendHtml = `<span><i class="a"></i> 体重</span>`;
    if (items.length >= 7) {
      legendHtml += `<span><i class="d"></i> 7 天均线</span>`;
    }
    // #317 近似: 极值标注(最高/最低)由图表内圈标迁为图例徽章(charts.line 无极值接口)
    if (maxW !== minW) {
      legendHtml += `<span class="trend-rate-badge" style="background:rgba(255,59,48,.12);color:var(--bad)">最高 ${maxW}kg</span>`;
      legendHtml += `<span class="trend-rate-badge" style="background:rgba(52,199,89,.15);color:var(--good)">最低 ${minW}kg</span>`;
    }
    // ticket #4: 里程碑点(带里程碑视图 · 5/10kg 达成日) → 图例徽章近似(竖线+圆环无接口)
    if (milestones && milestones.length) {
      milestones.forEach(ms => {
        legendHtml += `<span><i style="background:transparent;border:2px solid #ff9500;border-radius:50%"></i> 里程碑减${ms.delta_kg}kg · ${ms.date}</span>`;
      });
    }
    const firstItem = items[0];
    const lastItem = items[items.length - 1];
    const elapsedDays = Math.max(1, Math.round((Date.parse(lastItem.date) - Date.parse(firstItem.date)) / 86400000));
    const dailyRate = (lastItem.kg - firstItem.kg) / elapsedDays;
    const rateArrow = dailyRate < 0 ? '↓' : dailyRate > 0 ? '↑' : '→';
    const rateClass = dailyRate < 0 ? 'good' : dailyRate > 0 ? 'bad' : '';
    const rateSign = dailyRate > 0 ? '+' : '';
    legendHtml += `<span class="trend-rate-badge ${rateClass}" aria-label="体重变化率">${rateArrow} ${rateSign}${dailyRate.toFixed(2)} kg/天</span>`;
    if (target) {
      const lastKg = items[items.length - 1].kg;
      const diff = (lastKg - target);
      const sign = diff > 0 ? '+' : '';
      const diffAbs = Math.abs(diff).toFixed(1);
      const arrow = diff > 0 ? '↓' : diff < 0 ? '↑' : '→';
      const dirCls = diff > 0 ? 'good' : diff < 0 ? 'bad' : '';
      legendHtml += `<span><i class="c"></i> 目标 ${target}kg</span>`;
      if (!targetInRange) {
        // target 远超数据范围 → badge 显式说明距离
        legendHtml += `<span class="target-badge ${dirCls}">距目标还差 ${sign}${diff.toFixed(1)}kg ${arrow}</span>`;
      }
    }
    document.getElementById('legend').innerHTML = legendHtml;

    document.getElementById('chartTitle').textContent =
      m === 'trend' ? '体重趋势曲线' : m === 'volatility' ? '体重波动曲线' : '体重历史曲线';
  } else {
    document.getElementById('chartSection').style.display = 'none';
  }

  // 表格头(notes 模式由 JS 动态追加备注列 + vs 前后列 · 2026-08-02)
  let tableHeader = summary.table_header;
  if (summary.show_note_col && !tableHeader.includes('备注')) {
    tableHeader = tableHeader.replace('</tr>', "<th class='note'>备注</th><th class='num'>vs 前后</th></tr>");
    // 2026-08-10 #43:notes 模式启用备注列显示(全局 CSS 默认隐藏)
    const tbl = document.querySelector('.table-wrap table');
    if (tbl) tbl.classList.add('notes-mode');
  }
  document.getElementById('tableHead').innerHTML = tableHeader;

  // 表格行
  const tb = document.getElementById('tableBody');
  if (items.length === 0) {
    // L3 fix: 空态提示
    tb.insertAdjacentHTML('beforeend',
      '<tr><td colspan="5" class="empty-state">暂无数据</td></tr>');
  }
  items.forEach(p => {
    const deltaCls = p.delta > 0 ? 'delta-up' : p.delta < 0 ? 'delta-down' : 'delta-flat';
    tb.insertAdjacentHTML('beforeend',
      `<tr><td>${p.date}</td>` +
      (p.bmi !== undefined ? `<td class="num">${p.bmi}</td>` : '') +
      `<td class="num kg">${p.kg} kg</td>` +
      // V2.5.3: chip 包 <span class="delta-chip">,td.delta 保持 table-cell 占满 column
      (p.delta !== undefined ? `<td class="delta"><span class="delta-chip ${deltaCls}">${p.delta >= 0 ? '+' : ''}${p.delta}</span></td>` : '') +
      (m === 'notes' ? `<td class="note">${p.note || ''}</td>` : '') +
      (m === 'notes' ? `<td class="num">${p.vs_avg !== undefined && p.vs_avg !== null ? (p.vs_avg >= 0 ? '+' : '') + p.vs_avg : '—'}</td>` : '') +
      `</tr>`);
  });

  document.getElementById('srcLine').textContent = `📊 数据来源:weight_log · ${meta.start} → ${meta.end} · ${items.length} 条`;})();

  
</script>



<div id="actionbar-zone"></div>
<script>(function(){var z=document.getElementById('actionbar-zone');if(z&&window.actionBar&&window.__P__){z.innerHTML=window.actionBar(window.__P__);}})();</script>
</body>
</html>
