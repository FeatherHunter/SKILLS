<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>体重复盘 · 卡路里</title>
<style>
:root{
  --bg:#f5f5f7;--card:#fff;
  --ink:#1d1d1f;--ink2:#3c3c43;--ink3:#8e8e93;
  --line:rgba(60,60,67,.12);--lineS:rgba(60,60,67,.06);
  --accent:#0071e3;--good:#34c759;--warn:#ff9500;--bad:#ff3b30;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:920px;margin:0 auto;padding:32px 20px 80px}
h1{font-size:24px;font-weight:700;letter-spacing:-.02em;margin-bottom:4px}
.sub{font-size:13px;color:var(--ink3);margin-bottom:20px}
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--lineS);border-radius:16px;padding:16px 14px;text-align:center}
.kpi .label{font-size:11px;color:var(--ink2);margin-bottom:6px}
.kpi .value{font-size:21px;font-weight:700;font-feature-settings:"tnum"}
.kpi .value.good{color:var(--good)}.kpi .value.warn{color:var(--warn)}.kpi .value.bad{color:var(--bad)}
.kpi .extra{font-size:11px;color:var(--ink3);margin-top:4px}
.section{background:var(--card);border-radius:18px;padding:22px 26px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.04);border:1px solid rgba(60,60,67,.06)}
.section h2{font-size:15px;font-weight:600;margin-bottom:12px}
svg{width:100%;height:clamp(150px, 32vw, 260px);display:block}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--lineS)}
th{background:var(--soft);font-weight:500;font-size:11px;color:var(--ink2)}
tr:last-child td{border-bottom:none}
td.num{font-variant-numeric:tabular-nums;text-align:right;font-weight:600}
.summary{background:var(--card);border-radius:14px;padding:16px 18px;margin-bottom:14px;border:1px solid var(--lineS);font-size:14px}
.summary .lbl{font-size:11px;color:var(--ink3);margin-bottom:4px}
.footer{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:var(--card);border-radius:12px;border:1px solid var(--lineS)}
.footer .src{font-size:11px;color:var(--ink3)}
.btn{border:1px solid var(--line);background:var(--card);padding:7px 14px;border-radius:9px;cursor:pointer;font-size:12px;color:var(--ink);min-height:36px}
.btn:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
@media(max-width:640px){
  .wrap{padding:20px 10px 60px}
  .kpi-grid{grid-template-columns:repeat(2,1fr)}
  .section{padding:16px 12px}
  .footer{flex-direction:column;gap:8px;align-items:flex-start}
  table{font-size:11px}
  th,td{padding:7px 6px}
}

  @keyframes fadeup{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
</style>
</head>
<body>
<div class="wrap">
<h1 id="title">📋 体重复盘</h1>
<p class="sub" id="subtitle">--</p>
<div class="kpi-grid" id="kpis"></div>
<div class="section" id="trendSection">
  <h2 id="trendTitle">体重趋势</h2>
  <svg id="trendSvg" viewBox="0 0 800 260" preserveAspectRatio="none"></svg>
</div>
<div class="section" id="tableSection" style="display:none">
  <h2 id="tableTitle">里程碑</h2>
  <table>
    <thead id="tableHead"></thead>
    <tbody id="tableBody"></tbody>
  </table>
</div>
<div class="summary" id="summaryCard" style="display:none">
  <div class="lbl">总结</div>
  <span id="summaryText"></span>
</div>
<div class="footer">
  <div class="src" id="srcLine">📊 数据来源 --</div>
  <button class="btn" id="copyBtn">📋 复制数据</button>
</div>
</div>
<!--INJECT-DATA-->
<script>
(function(){
  const D = window.__DATA__;
  if (!D || D.status !== 'ok') {
    document.body.innerHTML = '<div style="padding:60px;text-align:center;color:#86868b">⚠ 数据未注入或状态非 ok</div>';
    return;
  }
  const d = D.data;
  document.getElementById('title').textContent = d.title || '体重复盘';
  document.getElementById('subtitle').textContent = d.subtitle || '';
  const kpis = document.getElementById('kpis');
  (d.kpis || []).forEach(k => {
    kpis.insertAdjacentHTML('beforeend',
      `<div class="kpi"><div class="label">${k.label}</div>` +
      `<div class="value ${k.cls||''}">${k.value}</div>` +
      (k.extra ? `<div class="extra">${k.extra}</div>` : '') + `</div>`);
  });
  const pts = d.points || [];
  if (pts.length >= 2) {
    const svg = document.getElementById('trendSvg');
    const W = 800, H = 260, PAD = 30;
    const kgs = pts.map(p => p.kg);
    const minW = Math.min.apply(null, kgs), maxW = Math.max.apply(null, kgs);
    const range = (maxW - minW) || 1;
    const x = i => PAD + i * (W - 2 * PAD) / (pts.length - 1);
    const y = v => H - PAD - (v - minW) / range * (H - 2 * PAD);
    let path = '';
    pts.forEach((p, i) => { path += (i === 0 ? 'M' : 'L') + x(i) + ',' + y(p.kg) + ' '; });
    svg.innerHTML =
      `<path d="${path}" fill="none" stroke="#0071e3" stroke-width="2.5" vector-effect="non-scaling-stroke"/>` +
      `<path d="${path}L${x(pts.length-1)},${H-PAD}L${x(0)},${H-PAD}Z" fill="rgba(0,113,227,.08)"/>`;
    pts.forEach((p, i) => {
      const isLast = i === pts.length - 1;
      svg.insertAdjacentHTML('beforeend',
        `<circle cx="${x(i)}" cy="${y(p.kg)}" r="${isLast ? 6 : 3.5}" fill="${isLast ? '#ff9500' : '#0071e3'}" stroke="#fff" stroke-width="1.5"/>`);
      if (i % Math.max(1, Math.floor(pts.length / 6)) === 0 || isLast) {
        svg.insertAdjacentHTML('beforeend',
          `<text x="${x(i)}" y="${H - 6}" font-size="11" fill="#8e8e93" text-anchor="middle">${p.date.slice(5)}</text>`);
      }
    });
  } else {
    document.getElementById('trendSection').style.display = 'none';
  }
  if (d.milestones && d.milestones.length) {
    document.getElementById('tableSection').style.display = 'block';
    document.getElementById('tableTitle').textContent = d.table_title || '里程碑';
    document.getElementById('tableHead').innerHTML =
      '<tr><th>里程碑</th><th>日期</th><th class="num">体重</th><th class="num">用时</th></tr>';
    const tb = document.getElementById('tableBody');
    d.milestones.forEach(m => {
      tb.insertAdjacentHTML('beforeend',
        `<tr><td>${m.name}</td><td>${m.date}</td><td class="num">${m.kg} kg</td><td class="num">${m.elapsed_days === undefined || m.elapsed_days === null ? '—' : m.elapsed_days + ' 天'}</td></tr>`);
    });
  }
  if (d.summary) {
    document.getElementById('summaryText').textContent = d.summary;
    document.getElementById('summaryCard').style.display = 'block';
  }
  document.getElementById('srcLine').textContent = '📊 数据来源:weight_log · ' + (d.meta && d.meta.generated_at || new Date().toISOString().split('T')[0]);
  document.getElementById('copyBtn').onclick = function() {
    let r = (d.title || '体重复盘') + '\n';
    (d.kpis || []).forEach(k => { r += `  ${k.label}: ${k.value}${k.extra ? ' (' + k.extra + ')' : ''}\n`; });
    (d.milestones || []).forEach(m => { r += `  ${m.name}: ${m.date} · ${m.kg} kg${m.elapsed_days !== undefined ? ' · ' + m.elapsed_days + ' 天' : ''}\n`; });
    if (d.summary) r += d.summary + '\n';
    const after = () => toast('已复制');
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(r).then(after);
    } else {
      const ta = document.createElement('textarea');
      ta.value = r; document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); after(); } catch(e) {}
      document.body.removeChild(ta);
    }
  };
})();

  function toast(msg){var t=document.createElement('div');t.style.cssText='position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0));transform:translateX(-50%) scale(.9);opacity:0;background:rgba(28,28,30,.94);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);color:#f0f0f0;border-radius:14px;padding:13px 14px 13px 16px;display:flex;align-items:flex-start;gap:12px;max-width:min(480px,calc(100vw - 24px));min-width:300px;box-shadow:0 10px 32px rgba(0,0,0,.32),0 0 0 .5px rgba(255,255,255,.08) inset;z-index:9999;transition:opacity .22s ease-out,transform .22s cubic-bezier(.34,1.56,.64,1)';t.innerHTML='<div style="font-size:20px;line-height:1;padding-top:1px;flex-shrink:0">📋</div><div style="flex:1;min-width:0"><div style="font-weight:600;font-size:12.5px;line-height:1.4;color:#fff;margin-bottom:2px">已复制 <em style="font-style:normal;color:#34c759;font-weight:600">'+msg+'</em></div><div style="font-size:11px;line-height:1.5;color:#c8c8cc">粘贴给 AI,卡路里技能会自动执行这个流程,完成后你会拿到结果 HTML + 一句话总结。</div></div><button style="background:rgba(255,255,255,.10);color:#34c759;border:0;border-radius:8px;padding:5px 9px;font-size:10.5px;font-weight:500;cursor:pointer;white-space:nowrap;margin-left:6px;flex-shrink:0">✓ 知道了</button>';document.body.appendChild(t);requestAnimationFrame(function(){t.style.opacity='1';t.style.transform='translateX(-50%) scale(1)';});var close=function(){t.style.opacity='0';t.style.transform='translateX(-50%) scale(.9)';setTimeout(function(){t.remove();},220);};t.querySelector('button').addEventListener('click',close);setTimeout(close,4500);}
</script>
</body>
</html>
