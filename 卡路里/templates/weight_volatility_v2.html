<!DOCTYPE html>
<html lang="zh-CN">
<head>
<style><!--SHARED-CSS--></style>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>卡路里 · 体重波动 v2</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --fg:#1d1d1f; --fg2:#6e6e73; --fg3:#86868b; --bg:#fafafa;
    --card:#fff; --border:#d2d2d7; --accent:#0071e3;
    --good:#34c759; --warn:#ff9500; --bad:#ff3b30; --soft:#f5f5f7;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    line-height: 1.65; color: var(--fg); background: var(--bg);
    -webkit-font-smoothing: antialiased;
    padding: 32px 20px 100px;
  }
  .wrap { max-width: 920px; margin: 0 auto; }

  header { margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
  h1 { font-size: 26px; font-weight: 700; letter-spacing: -.02em; }
  .sub { font-size: 13px; color: var(--fg3); margin-top: 4px; }

  /* KPI 卡片(诊断 + 趋势 + 早警告) */
  .kpi-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 16px; }
  .kpi { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 16px 18px; }
  .kpi-label { font-size: 11px; color: var(--fg2); margin-bottom: 6px; text-transform: uppercase; letter-spacing: .05em; }
  .kpi-value { font-size: 24px; font-weight: 700; }
  .kpi-extra { font-size: 12px; color: var(--fg2); margin-top: 6px; }
  .kpi-pill { display: inline-block; margin-left: 8px; }

  /* Canvas 主图 */
  .chart-section { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 18px 20px; margin-bottom: 16px; }
  .chart-section h2 { font-size: 15px; font-weight: 600; margin-bottom: 12px; }
  .chart-wrap { width: 100%; }
  canvas#chart { width: 100%; height: 360px; display: block; }

  /* 异常列表 */
  .anomalies { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 18px 20px; }
  .anomalies h2 { font-size: 15px; font-weight: 600; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
  .anomalies h2 .count { font-size: 12px; color: var(--fg2); font-weight: 400; }
  .anomaly-item { display: grid; grid-template-columns: 100px 1fr 80px 70px; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); }
  .anomaly-item:last-child { border-bottom: none; }
  .anomaly-date { font-size: 13px; color: var(--fg2); font-variant-numeric: tabular-nums; }
  .anomaly-food { font-size: 14px; }
  .anomaly-dev { font-size: 13px; font-variant-numeric: tabular-nums; font-weight: 600; }
  .anomaly-level { display: inline-block; padding: 2px 9px; border-radius: 10px; font-size: 11px; font-weight: 600; }
  .anomaly-red { background: rgba(255,59,48,.15); color: var(--bad); }
  .anomaly-yellow { background: rgba(255,149,0,.15); color: var(--warn); }
  .anomaly-reason { grid-column: 1 / -1; font-size: 12px; color: var(--fg2); background: var(--soft); padding: 6px 10px; border-radius: 8px; }

  /* toggle 按钮 */
  .toggle-btn { padding: 4px 10px; font-size: 11px; font-weight: 600; border: 1px solid var(--border); border-radius: 12px; background: var(--card); color: var(--fg2); cursor: pointer; font-family: inherit; }
  .toggle-btn:hover { background: var(--soft); }
  .toggle-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

  .footer { margin-top: 20px; padding: 12px 16px; background: var(--soft); border-radius: 12px; font-size: 12px; color: var(--fg3); text-align: center; }
  /* 2026-08-10 #43:复制按钮(全局双按钮规则) */
  .footer .btn-row { display: flex; gap: 10px; margin-top: 10px; }
  .footer .btn-row .btn { flex: 1; border: 1px solid var(--border); background: var(--card); padding: 10px 12px; border-radius: 10px; font-size: 13px; font-weight: 500; cursor: pointer; min-height: 44px; white-space: nowrap; font-family: inherit; color: var(--fg); }
  .summary-line { margin-top: 14px; padding: 12px 16px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; font-size: 13px; color: var(--fg2); text-align: center; }

  /* ticket 02 mobile responsive */
  @media (max-width:640px) {
    body { padding: 20px 14px 80px; }
    h1 { font-size: 22px; }
    .kpi-grid { grid-template-columns: 1fr; }
    .kpi-value { font-size: 20px; }
    canvas#chart { height: 280px; }
    .anomaly-item { grid-template-columns: 1fr; gap: 4px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>📊 体重稳不稳（增强版）</h1>
    <p class="sub" id="metaSub"></p>
  </header>

  <!-- 3 张 KPI 卡(权威清单口径:日均波动 / 标准差 / 异常次数 · 2026-08-02) -->
  <div class="kpi-grid">

    <!-- KPI #1: 标准差 -->
    <section class="kpi" id="kpi-diagnosis">
      <div class="kpi-label">标准差</div>
      <div class="kpi-value">
        <span id="kpiValue">—</span>
        <span class="kpi-pill" id="kpiPill">测量中</span>
      </div>
      <div class="kpi-extra" id="kpiExtra">健康波动 &lt; 0.3kg</div>
      <!-- 2026-08-02 ticket 10 重构: baseline 展示已合并入 KPI#1 文本,保留 id="kpiBaseline" 以兼容 ticket 02 测试契约 -->
      <div class="kpi-extra" id="kpiBaseline" hidden>±σ baseline 隐藏锚点(兼容 ticket 02)</div>
    </section>

    <!-- KPI #2: 日均波动 -->
    <section class="kpi" id="kpi-trend">
      <div class="kpi-label">日均波动</div>
      <div class="kpi-value">
        <span id="kpiSigma">—</span>
        <span class="kpi-pill" id="kpiSigmaTrend">—</span>
      </div>
      <div class="kpi-extra" id="kpiSigmaExtra">近 7 天 |当日−昨日| 均值</div>
    </section>

    <!-- KPI #3: 异常次数 -->
    <section class="kpi" id="kpi-early-warning">
      <div class="kpi-label">异常次数</div>
      <div class="kpi-value">
        <span id="kpiEWTxt">—</span>
      </div>
      <div class="kpi-extra" id="kpiEWExtra">—</div>
    </section>

  </div>

  <!-- Canvas 主图 -->
  <section class="chart-section">
    <h2>体重折线 + ±σ 带 + 目标线</h2>
    <div class="chart-wrap" style="position:relative">
      <canvas id="chart" width="800" height="360"></canvas>
      <div style="position:absolute; top:8px; right:12px; display:flex; gap:4px;">
        <button id="toggleRolling" class="toggle-btn active" type="button">vs 近期常态</button>
        <button id="toggleGoal" class="toggle-btn" type="button">vs 目标</button>
      </div>
    </div>
  </section>

  <!-- 异常点列表(ticket 03 完整实现) -->
  <section class="anomalies" id="anomalies">
    <h2>最近异常点 <span class="count" id="anomaliesCount">—</span></h2>
    <div id="anomaliesList"></div>
  </section>

  <div class="summary-line" id="summaryLine" style="display:none">
    <span id="summaryText"></span>
  </div>

  <div class="footer">
    <!-- 2026-08-10 #43:补复制数据/复制日志(全局双按钮规则) -->
    <div class="btn-row">
      
      
    </div>
  </div>

</div>

<script id="payload" type="application/json"><!--INJECT-DATA--></script><script><!--SHARED-HELPERS--></script><script>window.__P__=(function(){try{return JSON.parse(document.getElementById('payload').textContent||'{}');}catch(e){return null;}})();</script>

<script>
(function() {
  const DATA = window.__P__ || { data: { points: [], baseline_value: 0, baseline_sigma: 0, thresholds: {}, recent_anomalies: [], sigma_trend: [], early_warning: {}, goal_weight: null } };
  if (!window.__P__ || window.__P__.status !== 'ok') { document.body.innerHTML = window.errorReceipt({message: '数据未注入或状态非 ok'}); return; }

  // ========== ticket 04: baseline toggle 状态(URL > localStorage > default rolling) ==========
  function getInitialMode() {
    // URL param 优先
    const params = new URLSearchParams(window.location.search);
    const urlMode = params.get('baseline');
    if (urlMode === 'rolling' || urlMode === 'goal') return urlMode;
    // localStorage 次之
    try {
      const lsMode = localStorage.getItem('weight_baseline_mode');
      if (lsMode === 'rolling' || lsMode === 'goal') return lsMode;
    } catch (e) { /* localStorage may be disabled */ }
    // 默认 rolling
    return 'rolling';
  }

  function persistMode(mode) {
    try {
      localStorage.setItem('weight_baseline_mode', mode);
    } catch (e) { /* ignore */ }
    // 同时 sync URL,不刷页
    // 2026-08-10 #43 修复:file:// 或受限 webview 下 replaceState 抛 SecurityError 会中断点击处理器
    try {
      const url = new URL(window.location.href);
      url.searchParams.set('baseline', mode);
      window.history.replaceState({}, '', url);
    } catch (e) { /* ignore */ }
  }

  // 当前 mode 状态(供 render 使用)
  let currentMode = getInitialMode();

  // 看波动异常点:仅异常视图(2026-08-02 · 隐藏 KPI + Canvas,只留异常列表)
  // 2026-08-10 #43 修复:渲染器注入裸 data(无 .data 包装),判断用兼容取值
  const _rootView = (DATA.data || DATA).view;
  if (_rootView === 'anomalies-only') {
    const hide = document.querySelectorAll('.kpi-grid, .chart-section');
    hide.forEach(el => { if (el) el.style.display = 'none'; });
    const h1 = document.querySelector('h1');
    if (h1) h1.textContent = '⚠ 看波动异常点';
  }

  // ========== Render 函数(可被 toggle 调用) ==========
  function render() {
    const d = DATA.data || DATA;  // 2026-08-02:兼容裸 data 注入(渲染器注入即裸 data)
    const useRolling = currentMode === 'rolling';
    const baseline = useRolling ? d.baseline_value : (d.goal_weight || d.baseline_value);
    const sigma = d.baseline_sigma;
    const yellow = d.thresholds.yellow || 0;
    const red = d.thresholds.red || 0;
    const goal = d.goal_weight || null;
    const toggleLabel = useRolling ? d.baseline_toggle_label : `vs 目标 ${d.goal_weight || '?'}kg`;

    // === KPI #1 标准差(权威清单口径 · 2026-08-02) ===
    const stdev = d.stdev;
    if (stdev != null) {
      document.getElementById('kpiValue').textContent = stdev.toFixed(2) + ' kg';
      const pill = document.getElementById('kpiPill');
      if (stdev < 0.3) { pill.innerHTML = window.statusBadge('ok', '🟢 稳定'); }
      else if (stdev < 0.5) { pill.innerHTML = window.statusBadge('warn', '🟡 正常'); }
      else { pill.innerHTML = window.statusBadge('danger', '🔴 波动较大'); }
      document.getElementById('kpiExtra').textContent = '健康波动 < 0.3kg · 波动较大 ≥ 0.5kg';
    }

    // === KPI #2 日均波动(近 7 天 |当日−昨日| 均值) ===
    const dd = d.daily_delta_avg;
    if (dd != null) {
      document.getElementById('kpiSigma').textContent = dd.toFixed(3) + ' kg/天';
      const prev = d.daily_delta_prev;
      const pill2 = document.getElementById('kpiSigmaTrend');
      if (prev != null) {
        if (dd < prev * 0.8) { pill2.innerHTML = window.statusBadge('ok', '↓ σ 缩小'); }
        else if (dd > prev * 1.2) { pill2.innerHTML = window.statusBadge('danger', '↑ σ 扩大'); }
        else { pill2.innerHTML = window.statusBadge('ok', '→ σ 平稳'); }
        document.getElementById('kpiSigmaExtra').textContent = `前 7 天 ${prev.toFixed(3)} kg/天`;
      } else {
        document.getElementById('kpiSigmaExtra').textContent = '需 14+ 天数据对比';
      }
    }

    // === KPI #3 异常次数 ===
    const astat = d.anomaly_stats || null;
    if (astat) {
      document.getElementById('kpiEWTxt').textContent = astat.total + ' 次';
      document.getElementById('kpiEWExtra').textContent = `🟡 黄 ${astat.yellow} · 🔴 红 ${astat.red}`;
    }

    // === 异常点列表 ===
    const anomaliesList = document.getElementById('anomaliesList');
    const anomaliesCount = document.getElementById('anomaliesCount');
    const recent = d.recent_anomalies || [];

    // 2026-08-02 ticket 10: 提取 σ 趋势最近 7 个数据点(供未来 sparkline 使用, 当前未绘制但占位兼容 ticket 02 测试)
    const sigmaTrendLast7 = (d.sigma_trend || []).slice(-7);

    if (recent.length === 0) {
      anomaliesList.innerHTML = window.emptyState({icon: '✓', text: '过去 7 天无异常', hint: '波动都在正常范围'});
      anomaliesCount.textContent = '(0)';
    } else {
      anomaliesCount.textContent = `(${recent.length} 条按偏离度排序)`;
      let html = '';
      for (const a of recent) {
        const levelClass = a.level === 'red' ? 'anomaly-red' : 'anomaly-yellow';
        const devSign = a.deviation_kg >= 0 ? '+' : '';
        html += `<div class="anomaly-item">`
          + `<div class="anomaly-date">${a.date}</div>`
          + `<div class="anomaly-food">${a.kg}kg</div>`
          + `<div class="anomaly-dev">${devSign}${a.deviation_kg}kg</div>`
          + `<div class="anomaly-level ${levelClass}">${a.level === 'red' ? '🔴 红' : '🟡 黄'}</div>`
          + (a.reason ? `<div class="anomaly-reason">${a.reason}</div>` : '')
          + `</div>`;
      }
      anomaliesList.innerHTML = html;
    }

    // === 一句话判断(2026-08-02 · 呈现数据「+ 一句话」) ===
    if (d.summary) {
      document.getElementById('summaryText').textContent = d.summary;
      document.getElementById('summaryLine').style.display = 'block';
    }

    // === Canvas 绘图 ===
    const canvas = document.getElementById('chart');
    if (canvas && d.points && d.points.length > 0) {
      // 2026-08-10 #43 修复:高 DPI 适配(Retina 屏 canvas 缓冲须按 devicePixelRatio 放大,否则文字模糊)
      const dpr = window.devicePixelRatio || 1;
      const W_css = canvas.offsetWidth;
      const H_css = canvas.offsetHeight || 360;
      canvas.width = Math.round(W_css * dpr);
      canvas.height = Math.round(H_css * dpr);
      canvas.style.width = W_css + 'px';
      canvas.style.height = H_css + 'px';
      const ctx = canvas.getContext('2d');
      ctx.scale(dpr, dpr);
      const W = W_css, H = H_css;
      // 2026-08-10 #43 重构:左右留白不对称(左容纳Y轴刻度,右极小) · 图贴近容器边缘
      const PAD_L = 28, PAD_R = 8, PAD_B = 24;

      const points = d.points;
      const weights = points.map(p => p.kg);
      // 2026-08-10 #43 修复:Y 轴范围固定(不含随 mode 变的 baseline),切换 VS 时折线不跳动,
      // 仅基线带上下移动(语义:不同参照系下的波动区间)
      const yValues = [...weights, d.baseline_value, goal].filter(v => v != null);
      const minW = Math.min(...yValues);
      const maxW = Math.max(...yValues);
      const range = (maxW - minW) || 1;
      const minY = Math.floor(minW - range * 0.2);
      const maxY = Math.ceil(maxW + range * 0.2);
      const yRange = maxY - minY || 1;

      const xStep = (W - PAD_L - PAD_R) / Math.max(1, points.length - 1);
      const x = i => PAD_L + i * xStep;
      const y = v => H - PAD_B - (v - minY) / yRange * (H - PAD_B - 10);

      ctx.fillStyle = '#fff';
      ctx.fillRect(0, 0, W, H);

      // Y 轴刻度网格 + 标签(2026-08-10 #43 补:左侧不再空白,有数值可读;须在清屏后绘制)
      ctx.strokeStyle = 'rgba(60,60,67,0.12)';
      ctx.lineWidth = 1;
      ctx.fillStyle = '#8e8e93';
      ctx.font = '10px -apple-system, sans-serif';
      ctx.textAlign = 'right';
      const yTicks = 4;
      for (let t = 0; t <= yTicks; t++) {
        const v = minY + (maxY - minY) * t / yTicks;
        const yy = y(v);
        ctx.beginPath();
        ctx.moveTo(PAD_L - 5, yy);
        ctx.lineTo(W - PAD_R, yy);
        ctx.stroke();
        ctx.fillText(String(Math.round(v * 10) / 10), PAD_L - 8, yy + 3);
      }
      ctx.textAlign = 'left';

      // ±σ band
      if (yellow > 0) {
        ctx.fillStyle = 'rgba(255,149,0,0.10)';
        ctx.fillRect(PAD_L, y(baseline + yellow), W - PAD_L - PAD_R, y(baseline - yellow) - y(baseline + yellow));
      }
      if (red > 0 && red > yellow) {
        ctx.fillStyle = 'rgba(255,59,48,0.10)';
        ctx.fillRect(PAD_L, y(baseline + red), W - PAD_L - PAD_R, y(baseline - red) - y(baseline + red));
      }

      // baseline 线
      ctx.strokeStyle = '#86868b';
      ctx.lineWidth = 1;
      ctx.setLineDash([4, 3]);
      ctx.beginPath();
      ctx.moveTo(PAD_L, y(baseline));
      ctx.lineTo(W - PAD_R, y(baseline));
      ctx.stroke();
      ctx.setLineDash([]);

      // 目标线
      if (goal && goal >= minY && goal <= maxY) {
        ctx.strokeStyle = '#34c759';
        ctx.lineWidth = 1.5;
        ctx.setLineDash([6, 4]);
        ctx.beginPath();
        ctx.moveTo(PAD_L, y(goal));
        ctx.lineTo(W - PAD_R, y(goal));
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.fillStyle = '#34c759';
        ctx.font = '11px -apple-system, sans-serif';
        ctx.textAlign = 'right';
        ctx.fillText(`目标 ${goal}kg`, W - PAD_R - 4, y(goal) - 4);
        ctx.textAlign = 'left';
      }

      // 体重折线
      ctx.strokeStyle = '#0071e3';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      points.forEach((p, i) => {
        const px = x(i);
        const py = y(p.kg);
        if (i === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      });
      ctx.stroke();

      // 异常点
      points.forEach((p, i) => {
        if (p.level === 'red') {
          ctx.fillStyle = '#ff3b30';
          ctx.beginPath();
          ctx.arc(x(i), y(p.kg), 5, 0, Math.PI * 2);
          ctx.fill();
        } else if (p.level === 'yellow') {
          ctx.fillStyle = '#ff9500';
          ctx.beginPath();
          ctx.arc(x(i), y(p.kg), 4, 0, Math.PI * 2);
          ctx.fill();
        } else {
          ctx.fillStyle = '#0071e3';
          ctx.beginPath();
          ctx.arc(x(i), y(p.kg), 3, 0, Math.PI * 2);
          ctx.fill();
        }
      });

      if (yellow > 0) {
        ctx.fillStyle = '#ff9500';
        ctx.font = '10px -apple-system, sans-serif';
        ctx.textAlign = 'left';
        ctx.fillText('±1.5σ', PAD_L + 4, y(baseline + yellow) - 4);
      }
    }

    // === Toggle 按钮状态 ===
    document.getElementById('toggleRolling').className = (currentMode === 'rolling' ? 'toggle-btn active' : 'toggle-btn');
    document.getElementById('toggleGoal').className = (currentMode === 'goal' ? 'toggle-btn active' : 'toggle-btn');
  }

  // === Toggle event handlers(ticket 04) ===
  document.getElementById('toggleRolling').addEventListener('click', function() {
    currentMode = 'rolling';
    persistMode('rolling');
    render();
  });
  document.getElementById('toggleGoal').addEventListener('click', function() {
    currentMode = 'goal';
    persistMode('goal');
    render();
  });// === 初始 render ===
  render();
})();
</script>
