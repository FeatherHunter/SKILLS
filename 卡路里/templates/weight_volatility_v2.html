<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>卡路里 · 体重波动 v2</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --fg:#1d1d1f; --fg2:#6e6e73; --fg3:#86868b; --bg:#fafafa;
    --card:#fff; --border:#d2d2d7; --accent:#0071e3;
    --good:#34c759; --warn:#ff9500; --bad:#ff3b30; --soft:#f5f5f7;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    line-height: 1.65; color: var(--fg); background: var(--bg);
    -webkit-font-smoothing: antialiased;
    padding: 32px 20px 100px;
  }
  .wrap { max-width: 920px; margin: 0 auto; }

  header { margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
  h1 { font-size: 26px; font-weight: 700; letter-spacing: -.02em; }
  .sub { font-size: 13px; color: var(--fg3); margin-top: 4px; }

  /* KPI 卡片(诊断) */
  .kpi { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 18px 20px; margin-bottom: 16px; }
  .kpi-label { font-size: 12px; color: var(--fg2); margin-bottom: 6px; text-transform: uppercase; letter-spacing: .05em; }
  .kpi-value { font-size: 32px; font-weight: 700; }
  .kpi-extra { font-size: 13px; color: var(--fg2); margin-top: 6px; }
  .kpi-pill { display: inline-block; padding: 2px 9px; border-radius: 10px; font-size: 11px; font-weight: 600; margin-left: 8px; }
  .pill-normal { background: rgba(52,199,89,.15); color: var(--good); }
  .pill-yellow { background: rgba(255,149,0,.15); color: var(--warn); }
  .pill-red { background: rgba(255,59,48,.15); color: var(--bad); }

  /* Canvas 主图 */
  .chart-section { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 18px 20px; margin-bottom: 16px; }
  .chart-section h2 { font-size: 15px; font-weight: 600; margin-bottom: 12px; }
  .chart-wrap { width: 100%; }
  canvas#chart { width: 100%; height: 360px; display: block; }

  /* 异常列表留位(ticket 03 填) */
  .anomalies { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 18px 20px; }
  .anomalies h2 { font-size: 15px; font-weight: 600; margin-bottom: 12px; }

  .footer { margin-top: 20px; padding: 12px 16px; background: var(--soft); border-radius: 12px; font-size: 12px; color: var(--fg3); text-align: center; }

  /* ticket 02 mobile responsive */
  @media (max-width:640px) {
    body { padding: 20px 14px 80px; }
    h1 { font-size: 22px; }
    .kpi-value { font-size: 26px; }
    canvas#chart { height: 280px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>📊 体重波动 v2</h1>
    <p class="sub" id="metaSub">ticket 02 · Dashboard 单页(诊断)</p>
  </header>

  <!-- KPI 卡 #1: 诊断(use case A) -->
  <section class="kpi" id="kpi-diagnosis">
    <div class="kpi-label" id="kpiLabel">诊断 · 今日 vs 近期常态</div>
    <div class="kpi-value">
      <span id="kpiValue">—</span>
      <span class="kpi-pill" id="kpiPill">测量中</span>
    </div>
    <div class="kpi-extra" id="kpiExtra">vs <span id="kpiBaseline">—</span></div>
  </section>

  <!-- Canvas 主图 -->
  <section class="chart-section">
    <h2>体重折线 + ±σ 带</h2>
    <div class="chart-wrap">
      <canvas id="chart" width="800" height="360"></canvas>
    </div>
  </section>

  <!-- 异常列表(ticket 03 填) -->
  <section class="anomalies" id="anomalies">
    <h2>最近异常点</h2>
    <div id="anomaliesList">— ticket 03 填 —</div>
  </section>

  <div class="footer">
    ticket 02 · weight_volatility_v2 Dashboard 单页(诊断 + Canvas + σ 带)
  </div>

</div>

<!--INJECT-DATA-->

<script>
(function() {
  const DATA = window.__DATA__ || { data: { points: [], baseline_value: 0, baseline_sigma: 0, thresholds: {}, recent_anomalies: [], sigma_trend: [], early_warning: {} } };

  // 填 KPI 诊断
  const ew = DATA.data.early_warning || {};
  const kpiValue = document.getElementById('kpiValue');
  const kpiPill = document.getElementById('kpiPill');
  const kpiExtra = document.getElementById('kpiExtra');
  const kpiBaseline = document.getElementById('kpiBaseline');

  if (ew.kg != null) {
    kpiValue.textContent = ew.kg.toFixed(1) + ' kg';
    // spec AC: "今天 X kg vs 近期常态 Y ± Z kg" + 1 句解读
    const baseline = DATA.data.baseline_value;
    const sigma = DATA.data.baseline_sigma || 0;
    const dev = Math.abs(ew.deviation_kg || 0);
    kpiBaseline.textContent = `${baseline.toFixed(1)} ± ${sigma.toFixed(2)} kg`;
    kpiExtra.firstChild.textContent = 'vs ' + (DATA.data.baseline_toggle_label || 'baseline') + ' ';
    if (ew.level === 'red') {
      kpiPill.textContent = '🔴 异常';
      kpiPill.className = 'kpi-pill pill-red';
    } else if (ew.level === 'yellow') {
      kpiPill.textContent = '🟡 注意';
      kpiPill.className = 'kpi-pill pill-yellow';
    } else {
      kpiPill.textContent = '🟢 正常';
      kpiPill.className = 'kpi-pill pill-normal';
    }
  }

  // Canvas 绘图
  const canvas = document.getElementById('chart');
  if (canvas && DATA.data.points && DATA.data.points.length > 0) {
    const ctx = canvas.getContext('2d');
    // review fix:防止 buffer height 默认 150 拉伸(display 360),显式 set canvas.width/height
    const W = canvas.width = canvas.offsetWidth;
    const H = canvas.height = 360;
    const PAD = 40;

    const points = DATA.data.points;
    const baseline = DATA.data.baseline_value;
    const sigma = DATA.data.baseline_sigma;
    const yellow = DATA.data.thresholds.yellow || 0;
    const red = DATA.data.thresholds.red || 0;
    // goal 从 daily_goal.weight_goal 拿(spec §Implementation Decisions toggle baseline)
    const goal = DATA.data.goal_weight || null;

    const weights = points.map(p => p.kg);
    const yValues = goal ? [baseline, goal, ...weights] : [baseline, ...weights];
    const minW = Math.min(...yValues);
    const maxW = Math.max(...yValues);
    const range = (maxW - minW) || 1;
    const minY = Math.floor(minW - range * 0.2);
    const maxY = Math.ceil(maxW + range * 0.2);
    const yRange = maxY - minY || 1;

    const xStep = (W - 2*PAD) / Math.max(1, points.length - 1);
    const x = i => PAD + i * xStep;
    const y = v => H - PAD - (v - minY) / yRange * (H - 2*PAD);

    // 清空
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, W, H);

    // ±σ band(spec:yellow tint for ±1.5σ, red tint for ±2σ)
    // yellow band: ±1.5σ
    if (yellow > 0) {
      ctx.fillStyle = 'rgba(255,149,0,0.10)';
      ctx.fillRect(PAD, y(baseline + yellow), W - 2*PAD, y(baseline - yellow) - y(baseline + yellow));
    }
    // red band: ±2σ
    if (red > 0 && red > yellow) {
      ctx.fillStyle = 'rgba(255,59,48,0.10)';
      ctx.fillRect(PAD, y(baseline + red), W - 2*PAD, y(baseline - red) - y(baseline + red));
    }

    // baseline 线(滚动 30 天均值,灰色虚线)
    ctx.strokeStyle = '#86868b';
    ctx.lineWidth = 1;
    ctx.setLineDash([4, 3]);
    ctx.beginPath();
    ctx.moveTo(PAD, y(baseline));
    ctx.lineTo(W - PAD, y(baseline));
    ctx.stroke();
    ctx.setLineDash([]);

    // 目标线(goal,绿色虚线) — ticket 02 AC 明确要求
    if (goal && goal >= minY && goal <= maxY) {
      ctx.strokeStyle = '#34c759';
      ctx.lineWidth = 1.5;
      ctx.setLineDash([6, 4]);
      ctx.beginPath();
      ctx.moveTo(PAD, y(goal));
      ctx.lineTo(W - PAD, y(goal));
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = '#34c759';
      ctx.font = '11px -apple-system, sans-serif';
      ctx.textAlign = 'right';
      ctx.fillText(`目标 ${goal}kg`, W - PAD - 4, y(goal) - 4);
      ctx.textAlign = 'left';
    }

    // 体重折线
    ctx.strokeStyle = '#0071e3';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    points.forEach((p, i) => {
      const px = x(i);
      const py = y(p.kg);
      if (i === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    });
    ctx.stroke();

    // 异常点(points 标记)
    points.forEach((p, i) => {
      if (p.level === 'red') {
        ctx.fillStyle = '#ff3b30';
        ctx.beginPath();
        ctx.arc(x(i), y(p.kg), 5, 0, Math.PI * 2);
        ctx.fill();
      } else if (p.level === 'yellow') {
        ctx.fillStyle = '#ff9500';
        ctx.beginPath();
        ctx.arc(x(i), y(p.kg), 4, 0, Math.PI * 2);
        ctx.fill();
      } else {
        ctx.fillStyle = '#0071e3';
        ctx.beginPath();
        ctx.arc(x(i), y(p.kg), 3, 0, Math.PI * 2);
        ctx.fill();
      }
    });

    // σ 标签
    if (yellow > 0) {
      ctx.fillStyle = '#ff9500';
      ctx.font = '10px -apple-system, sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText('±1.5σ', PAD + 4, y(baseline + yellow) - 4);
    }
  }
})();
</script>
</body>
</html>
