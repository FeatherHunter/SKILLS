<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>卡路里 · 体重波动 v2</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --fg:#1d1d1f; --fg2:#6e6e73; --fg3:#86868b; --bg:#fafafa;
    --card:#fff; --border:#d2d2d7; --accent:#0071e3;
    --good:#34c759; --warn:#ff9500; --bad:#ff3b30; --soft:#f5f5f7;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    line-height: 1.65; color: var(--fg); background: var(--bg);
    -webkit-font-smoothing: antialiased;
    padding: 32px 20px 100px;
  }
  .wrap { max-width: 920px; margin: 0 auto; }

  header { margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
  h1 { font-size: 26px; font-weight: 700; letter-spacing: -.02em; }
  .sub { font-size: 13px; color: var(--fg3); margin-top: 4px; }

  /* KPI 卡片(诊断 + 趋势 + 早警告) */
  .kpi-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 16px; }
  .kpi { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 16px 18px; }
  .kpi-label { font-size: 11px; color: var(--fg2); margin-bottom: 6px; text-transform: uppercase; letter-spacing: .05em; }
  .kpi-value { font-size: 24px; font-weight: 700; }
  .kpi-extra { font-size: 12px; color: var(--fg2); margin-top: 6px; }
  .kpi-pill { display: inline-block; padding: 2px 9px; border-radius: 10px; font-size: 11px; font-weight: 600; margin-left: 8px; }
  .pill-normal { background: rgba(52,199,89,.15); color: var(--good); }
  .pill-yellow { background: rgba(255,149,0,.15); color: var(--warn); }
  .pill-red { background: rgba(255,59,48,.15); color: var(--bad); }
  .pill-trend-up { background: rgba(255,59,48,.15); color: var(--bad); }
  .pill-trend-down { background: rgba(52,199,89,.15); color: var(--good); }
  .pill-trend-flat { background: rgba(0,113,227,.15); color: var(--accent); }

  /* Canvas 主图 */
  .chart-section { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 18px 20px; margin-bottom: 16px; }
  .chart-section h2 { font-size: 15px; font-weight: 600; margin-bottom: 12px; }
  .chart-wrap { width: 100%; }
  canvas#chart { width: 100%; height: 360px; display: block; }

  /* 异常列表 */
  .anomalies { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 18px 20px; }
  .anomalies h2 { font-size: 15px; font-weight: 600; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
  .anomalies h2 .count { font-size: 12px; color: var(--fg2); font-weight: 400; }
  .empty-state { padding: 24px; text-align: center; color: var(--good); font-size: 14px; }
  .empty-state::before { content: "✓ "; }
  .anomaly-item { display: grid; grid-template-columns: 100px 1fr 80px 70px; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); }
  .anomaly-item:last-child { border-bottom: none; }
  .anomaly-date { font-size: 13px; color: var(--fg2); font-variant-numeric: tabular-nums; }
  .anomaly-food { font-size: 14px; }
  .anomaly-dev { font-size: 13px; font-variant-numeric: tabular-nums; font-weight: 600; }
  .anomaly-level { display: inline-block; padding: 2px 9px; border-radius: 10px; font-size: 11px; font-weight: 600; }
  .anomaly-red { background: rgba(255,59,48,.15); color: var(--bad); }
  .anomaly-yellow { background: rgba(255,149,0,.15); color: var(--warn); }

  /* toggle 按钮 */
  .toggle-btn { padding: 4px 10px; font-size: 11px; font-weight: 600; border: 1px solid var(--border); border-radius: 12px; background: var(--card); color: var(--fg2); cursor: pointer; font-family: inherit; }
  .toggle-btn:hover { background: var(--soft); }
  .toggle-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

  .footer { margin-top: 20px; padding: 12px 16px; background: var(--soft); border-radius: 12px; font-size: 12px; color: var(--fg3); text-align: center; }

  /* ticket 02 mobile responsive */
  @media (max-width:640px) {
    body { padding: 20px 14px 80px; }
    h1 { font-size: 22px; }
    .kpi-grid { grid-template-columns: 1fr; }
    .kpi-value { font-size: 20px; }
    canvas#chart { height: 280px; }
    .anomaly-item { grid-template-columns: 1fr; gap: 4px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>📊 体重波动 v2</h1>
    <p class="sub" id="metaSub">ticket 03 · 完整 dashboard(诊断 / 趋势 / 早警告)</p>
  </header>

  <!-- 3 张 KPI 卡(诊断 / 趋势 / 早警告) -->
  <div class="kpi-grid">

    <!-- KPI #1: 诊断(use case A) -->
    <section class="kpi" id="kpi-diagnosis">
      <div class="kpi-label">诊断 · 今天 vs 近期</div>
      <div class="kpi-value">
        <span id="kpiValue">—</span>
        <span class="kpi-pill" id="kpiPill">测量中</span>
      </div>
      <div class="kpi-extra" id="kpiExtra">vs <span id="kpiBaseline">—</span></div>
    </section>

    <!-- KPI #2: 趋势(use case B) -->
    <section class="kpi" id="kpi-trend">
      <div class="kpi-label">趋势 · 近 7 天 σ</div>
      <div class="kpi-value">
        <span id="kpiSigma">—</span>
        <span class="kpi-pill" id="kpiSigmaTrend">—</span>
      </div>
      <div class="kpi-extra" id="kpiSigmaExtra">σ 趋势</div>
    </section>

    <!-- KPI #3: 早警告(use case C) -->
    <section class="kpi" id="kpi-early-warning">
      <div class="kpi-label">早警告 · 今日</div>
      <div class="kpi-value">
        <span id="kpiEWTxt">—</span>
      </div>
      <div class="kpi-extra" id="kpiEWExtra">—</div>
    </section>

  </div>

  <!-- Canvas 主图 -->
  <section class="chart-section">
    <h2>体重折线 + ±σ 带 + 目标线</h2>
    <div class="chart-wrap" style="position:relative">
      <canvas id="chart" width="800" height="360"></canvas>
      <div style="position:absolute; top:8px; right:12px; display:flex; gap:4px;">
        <button id="toggleRolling" class="toggle-btn active" type="button">vs 近期常态</button>
        <button id="toggleGoal" class="toggle-btn" type="button">vs 目标</button>
      </div>
    </div>
  </section>

  <!-- 异常点列表(ticket 03 完整实现) -->
  <section class="anomalies" id="anomalies">
    <h2>最近异常点 <span class="count" id="anomaliesCount">—</span></h2>
    <div id="anomaliesList"></div>
  </section>

  <div class="footer">
    ticket 03 · 完整 dashboard(3 KPIs + Canvas + 异常列表)
  </div>

</div>

<!--INJECT-DATA-->

<script>
(function() {
  const DATA = window.__DATA__ || { data: { points: [], baseline_value: 0, baseline_sigma: 0, thresholds: {}, recent_anomalies: [], sigma_trend: [], early_warning: {}, goal_weight: null } };

  // ========== ticket 04: baseline toggle 状态(URL > localStorage > default rolling) ==========
  function getInitialMode() {
    // URL param 优先
    const params = new URLSearchParams(window.location.search);
    const urlMode = params.get('baseline');
    if (urlMode === 'rolling' || urlMode === 'goal') return urlMode;
    // localStorage 次之
    try {
      const lsMode = localStorage.getItem('weight_baseline_mode');
      if (lsMode === 'rolling' || lsMode === 'goal') return lsMode;
    } catch (e) { /* localStorage may be disabled */ }
    // 默认 rolling
    return 'rolling';
  }

  function persistMode(mode) {
    try {
      localStorage.setItem('weight_baseline_mode', mode);
    } catch (e) { /* ignore */ }
    // 同时 sync URL,不刷页
    const url = new URL(window.location.href);
    url.searchParams.set('baseline', mode);
    window.history.replaceState({}, '', url);
  }

  // 当前 mode 状态(供 render 使用)
  let currentMode = getInitialMode();

  // ========== Render 函数(可被 toggle 调用) ==========
  function render() {
    const d = DATA.data;
    const useRolling = currentMode === 'rolling';
    const baseline = useRolling ? d.baseline_value : (d.goal_weight || d.baseline_value);
    const sigma = d.baseline_sigma;
    const yellow = d.thresholds.yellow || 0;
    const red = d.thresholds.red || 0;
    const goal = d.goal_weight || null;
    const toggleLabel = useRolling ? d.baseline_toggle_label : `vs 目标 ${d.goal_weight || '?'}kg`;

    // === KPI #1 诊断 ===
    const ew = d.early_warning || {};
    if (ew.kg != null) {
      document.getElementById('kpiValue').textContent = ew.kg.toFixed(1) + ' kg';
      document.getElementById('kpiBaseline').textContent = `${baseline.toFixed(1)} ± ${sigma.toFixed(2)} kg`;
      const extraEl = document.getElementById('kpiExtra');
      if (extraEl.firstChild) extraEl.firstChild.textContent = 'vs ' + toggleLabel + ' ';
      const pill = document.getElementById('kpiPill');
      if (ew.level === 'red') {
        pill.textContent = '🔴 异常';
        pill.className = 'kpi-pill pill-red';
      } else if (ew.level === 'yellow') {
        pill.textContent = '🟡 注意';
        pill.className = 'kpi-pill pill-yellow';
      } else {
        pill.textContent = '🟢 正常';
        pill.className = 'kpi-pill pill-normal';
      }
    }

    // === KPI #2 趋势(7-day rolling σ slope) ===
    const sigmaTrend = d.sigma_trend || [];
    const kpiSigma = document.getElementById('kpiSigma');
    const kpiSigmaTrend = document.getElementById('kpiSigmaTrend');
    const kpiSigmaExtra = document.getElementById('kpiSigmaExtra');
    if (sigmaTrend.length >= 2) {
      const recent = sigmaTrend.slice(-7);
      const recentSigma = recent[recent.length - 1].sigma_kg;
      const earlierSigma = recent[0].sigma_kg;
      kpiSigma.textContent = recentSigma.toFixed(2) + ' kg';
      const change = recentSigma - earlierSigma;
      if (change < -0.05) {
        kpiSigmaTrend.textContent = '↓ σ 缩小';
        kpiSigmaTrend.className = 'kpi-pill pill-trend-down';
      } else if (change > 0.05) {
        kpiSigmaTrend.textContent = '↑ σ 扩大';
        kpiSigmaTrend.className = 'kpi-pill pill-trend-up';
      } else {
        kpiSigmaTrend.textContent = '→ σ 平稳';
        kpiSigmaTrend.className = 'kpi-pill pill-trend-flat';
      }
      kpiSigmaExtra.textContent = `较 ${earlierSigma.toFixed(2)} kg(7 天前)`;
    } else if (sigmaTrend.length === 1) {
      kpiSigma.textContent = sigmaTrend[0].sigma_kg.toFixed(2) + ' kg';
      kpiSigmaTrend.textContent = '— 数据不足';
      kpiSigmaTrend.className = 'kpi-pill pill-trend-flat';
      kpiSigmaExtra.textContent = '需 2+ 数据点算趋势';
    }

    // === KPI #3 早警告 ===
    const kpiEWTxt = document.getElementById('kpiEWTxt');
    const kpiEWExtra = document.getElementById('kpiEWExtra');
    if (ew.kg != null) {
      kpiEWTxt.textContent = ew.message || (ew.level === 'red' ? '异常' : ew.level === 'yellow' ? '注意' : '正常');
      kpiEWExtra.textContent = `今日 ${ew.kg}kg 偏离 baseline ${baseline.toFixed(1)}kg ${ew.deviation_kg >= 0 ? '+' : ''}${ew.deviation_kg || 0}kg`;
    }

    // === 异常点列表 ===
    const anomaliesList = document.getElementById('anomaliesList');
    const anomaliesCount = document.getElementById('anomaliesCount');
    const recent = d.recent_anomalies || [];

    if (recent.length === 0) {
      anomaliesList.innerHTML = '<div class="empty-state">过去 7 天无异常</div>';
      anomaliesCount.textContent = '(0)';
    } else {
      anomaliesCount.textContent = `(${recent.length} 条按偏离度排序)`;
      let html = '';
      for (const a of recent) {
        const levelClass = a.level === 'red' ? 'anomaly-red' : 'anomaly-yellow';
        const devSign = a.deviation_kg >= 0 ? '+' : '';
        html += `<div class="anomaly-item">`
          + `<div class="anomaly-date">${a.date}</div>`
          + `<div class="anomaly-food">${a.kg}kg</div>`
          + `<div class="anomaly-dev">${devSign}${a.deviation_kg}kg</div>`
          + `<div class="anomaly-level ${levelClass}">${a.level === 'red' ? '🔴 红' : '🟡 黄'}</div>`
          + `</div>`;
      }
      anomaliesList.innerHTML = html;
    }

    // === Canvas 绘图 ===
    const canvas = document.getElementById('chart');
    if (canvas && d.points && d.points.length > 0) {
      const ctx = canvas.getContext('2d');
      const W = canvas.width = canvas.offsetWidth;
      const H = canvas.height = 360;
      const PAD = 40;

      const points = d.points;
      const weights = points.map(p => p.kg);
      const yValues = goal ? [baseline, goal, ...weights] : [baseline, ...weights];
      const minW = Math.min(...yValues);
      const maxW = Math.max(...yValues);
      const range = (maxW - minW) || 1;
      const minY = Math.floor(minW - range * 0.2);
      const maxY = Math.ceil(maxW + range * 0.2);
      const yRange = maxY - minY || 1;

      const xStep = (W - 2*PAD) / Math.max(1, points.length - 1);
      const x = i => PAD + i * xStep;
      const y = v => H - PAD - (v - minY) / yRange * (H - 2*PAD);

      ctx.fillStyle = '#fff';
      ctx.fillRect(0, 0, W, H);

      // ±σ band
      if (yellow > 0) {
        ctx.fillStyle = 'rgba(255,149,0,0.10)';
        ctx.fillRect(PAD, y(baseline + yellow), W - 2*PAD, y(baseline - yellow) - y(baseline + yellow));
      }
      if (red > 0 && red > yellow) {
        ctx.fillStyle = 'rgba(255,59,48,0.10)';
        ctx.fillRect(PAD, y(baseline + red), W - 2*PAD, y(baseline - red) - y(baseline + red));
      }

      // baseline 线
      ctx.strokeStyle = '#86868b';
      ctx.lineWidth = 1;
      ctx.setLineDash([4, 3]);
      ctx.beginPath();
      ctx.moveTo(PAD, y(baseline));
      ctx.lineTo(W - PAD, y(baseline));
      ctx.stroke();
      ctx.setLineDash([]);

      // 目标线
      if (goal && goal >= minY && goal <= maxY) {
        ctx.strokeStyle = '#34c759';
        ctx.lineWidth = 1.5;
        ctx.setLineDash([6, 4]);
        ctx.beginPath();
        ctx.moveTo(PAD, y(goal));
        ctx.lineTo(W - PAD, y(goal));
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.fillStyle = '#34c759';
        ctx.font = '11px -apple-system, sans-serif';
        ctx.textAlign = 'right';
        ctx.fillText(`目标 ${goal}kg`, W - PAD - 4, y(goal) - 4);
        ctx.textAlign = 'left';
      }

      // 体重折线
      ctx.strokeStyle = '#0071e3';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      points.forEach((p, i) => {
        const px = x(i);
        const py = y(p.kg);
        if (i === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      });
      ctx.stroke();

      // 异常点
      points.forEach((p, i) => {
        if (p.level === 'red') {
          ctx.fillStyle = '#ff3b30';
          ctx.beginPath();
          ctx.arc(x(i), y(p.kg), 5, 0, Math.PI * 2);
          ctx.fill();
        } else if (p.level === 'yellow') {
          ctx.fillStyle = '#ff9500';
          ctx.beginPath();
          ctx.arc(x(i), y(p.kg), 4, 0, Math.PI * 2);
          ctx.fill();
        } else {
          ctx.fillStyle = '#0071e3';
          ctx.beginPath();
          ctx.arc(x(i), y(p.kg), 3, 0, Math.PI * 2);
          ctx.fill();
        }
      });

      if (yellow > 0) {
        ctx.fillStyle = '#ff9500';
        ctx.font = '10px -apple-system, sans-serif';
        ctx.textAlign = 'left';
        ctx.fillText('±1.5σ', PAD + 4, y(baseline + yellow) - 4);
      }
    }

    // === Toggle 按钮状态 ===
    document.getElementById('toggleRolling').className = (currentMode === 'rolling' ? 'toggle-btn active' : 'toggle-btn');
    document.getElementById('toggleGoal').className = (currentMode === 'goal' ? 'toggle-btn active' : 'toggle-btn');
  }

  // === Toggle event handlers(ticket 04) ===
  document.getElementById('toggleRolling').addEventListener('click', function() {
    currentMode = 'rolling';
    persistMode('rolling');
    render();
  });
  document.getElementById('toggleGoal').addEventListener('click', function() {
    currentMode = 'goal';
    persistMode('goal');
    render();
  });

  // === 初始 render ===
  render();
})();
</script>
</body>
</html>
