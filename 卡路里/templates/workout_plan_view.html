<!DOCTYPE html>
<html lang="zh-CN">
<head>
<style><!--SHARED-CSS--></style>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>健身计划</title>
<style>
:root{
  --bg:#fbfbfd;--card:#fff;--ink:#1d1d1f;--ink2:#6e6e73;--ink3:#86868b;
  --line:#d2d2d7;--lineS:#e8e8ed;--accent:#0071e3;--green:#34c759;--red:#ff3b30;--amber:#ff9500;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 4px 12px rgba(0,0,0,.04);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC",sans-serif;
  background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
.app{max-width:900px;margin:0 auto;padding:32px 20px 60px}

/* HEADER */
.header h1{font-size:32px;font-weight:600;letter-spacing:-.02em;margin-bottom:4px}
.header p{color:var(--ink2);font-size:14px;margin-bottom:24px}

/* TABS (week / day) */
.tabs{display:flex;gap:2px;margin-bottom:20px;border-bottom:1px solid var(--lineS);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex-shrink:0;background:none;border:none;padding:10px 18px;font-family:inherit;font-size:14px;font-weight:500;color:var(--ink2);cursor:pointer;position:relative;border-radius:6px 6px 0 0}
.tab:hover{color:var(--ink);background:rgba(0,113,227,.06)}
.tab.active{color:var(--accent)}
.tab.active::after{content:"";position:absolute;left:12px;right:12px;bottom:-1px;height:2px;background:var(--accent);border-radius:1px}
.week{display:none;animation:fade .2s ease}
.week.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* SESSION CARD */
.session{background:var(--card);border:1px solid var(--lineS);border-radius:16px;padding:22px 26px;margin-bottom:14px;box-shadow:var(--shadow)}
.sess-head{display:flex;align-items:center;gap:12px;margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--lineS);flex-wrap:wrap}
.sess-tag{font-family:"SF Mono",monospace;font-size:11px;color:var(--ink3);background:var(--bg);padding:3px 8px;border-radius:5px}
.sess-name{font-size:17px;font-weight:600}
.sess-time{font-size:12px;color:var(--ink3);margin-left:auto}
.rest-day{padding:40px;text-align:center;color:var(--ink3)}
.rest-day h3{font-size:20px;color:var(--ink);margin-bottom:8px}

/* TABLE */
table{width:100%;border-collapse:collapse}
th{text-align:left;font-weight:500;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);padding:8px 12px 8px 0;border-bottom:1px solid var(--lineS)}
td{padding:12px 10px 12px 0;border-bottom:1px solid var(--lineS);font-size:13px;color:var(--ink2);vertical-align:top}
tr:last-child td{border-bottom:none}
td:first-child{font-weight:500;color:var(--ink);min-width:160px}
td .sub{font-size:11px;color:var(--ink3);display:block;margin-top:2px}

/* PART TAG */
.part-tag{display:inline-block;font-size:10.5px;padding:2px 6px;border-radius:4px;font-weight:600}

/* DAY TABS */
.day-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;scrollbar-width:none}
.day-tabs::-webkit-scrollbar{display:none}
.day-tab{background:var(--card);border:1px solid var(--lineS);padding:6px 12px;font-family:inherit;font-size:12.5px;font-weight:500;color:var(--ink2);cursor:pointer;border-radius:8px;transition:all .15s}
.day-tab:hover{border-color:var(--accent);color:var(--ink)}
.day-tab.active{background:var(--ink);border-color:var(--ink);color:#fff}

/* REVIEW SECTION */
.review-section{background:#fff;border:1px solid var(--lineS);border-radius:16px;padding:22px 26px;margin-bottom:20px;box-shadow:var(--shadow)}
.review-section h2{font-size:18px;font-weight:600;margin-bottom:14px}
.review-stat{display:flex;align-items:baseline;gap:8px;margin-bottom:10px}
.stat-label{font-size:11px;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em;font-weight:500}
.stat-value{font-size:32px;font-weight:600;color:var(--accent);line-height:1}
.review-detail{color:var(--ink2);font-size:13px;margin-bottom:10px;line-height:1.6}
.review-detail p{margin-bottom:3px}
.review-detail strong{color:var(--ink);font-weight:500}
.anomalies{list-style:none;padding:0;margin-top:8px}
.anomalies li{padding:5px 0;color:var(--ink2);font-size:13px}
.no-review{color:var(--ink3);font-style:italic;font-size:13px}

/* KPI CARDS (overview) */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:24px}
.kpi-card{background:var(--card);border:1px solid var(--lineS);border-radius:16px;padding:18px 20px;box-shadow:var(--shadow)}
.kpi-label{font-size:11px;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em;font-weight:500;margin-bottom:6px}
.kpi-value{font-size:28px;font-weight:600;color:var(--ink);line-height:1}
.kpi-sub{font-size:11px;color:var(--ink3);margin-top:4px}

/* PROGRESS BAR */
.progress{background:var(--lineS);border-radius:99px;height:8px;overflow:hidden;margin-top:8px}
.progress-fill{background:var(--green);height:100%;border-radius:99px;transition:width .3s}
.progress-fill.low{background:var(--amber)}
.progress-fill.danger{background:var(--red)}

/* PERIOD PROGRESS (#258) */
.period-row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:13px}
.period-label{color:var(--ink2)}
.period-label b{font-size:18px;color:var(--ink);font-weight:700}
.period-status{font-size:12px;font-weight:600}
.period-status.period-active{color:var(--blue)}
.period-status.period-done{color:var(--amber)}
.period-status.period-idle{color:var(--ink3)}
.period-end-tip{font-size:12px;color:var(--ink3);margin-top:8px}
.period-fill{background:var(--blue)}

/* WEEKLY LIST (overview/completion) */
.week-row{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--lineS)}
.week-row:last-child{border-bottom:none}
.week-name{font-size:14px;font-weight:600;min-width:70px}
.week-rate{font-size:15px;font-weight:600;min-width:60px;text-align:right}
.week-bar{flex:1}

/* VS TABLE */
.dev-pos{color:var(--green);font-weight:600}
.dev-neg{color:var(--red);font-weight:600}
.dev-zero{color:var(--ink3)}

/* MISSED / MOVEMENT */
.missed-card{background:var(--card);border:1px solid var(--lineS);border-radius:16px;padding:18px 22px;margin-bottom:12px;box-shadow:var(--shadow)}
.missed-date{font-size:15px;font-weight:600;margin-bottom:6px}
.chip{display:inline-block;font-size:11px;background:var(--bg);border:1px solid var(--lineS);padding:2px 8px;border-radius:99px;margin:2px 4px 2px 0;color:var(--ink2)}
.rank-num{font-weight:600;min-width:28px;display:inline-block}

@media(max-width:640px){
  .app{padding:20px 12px 48px}
  .session{padding:16px 14px}
  .header h1{font-size:26px}
  td{padding:10px 4px;font-size:12px}
  td:first-child{min-width:120px}
  .kpi-grid{grid-template-columns:repeat(2,1fr)}
  /* #258: 7 张 KPI 卡时最后一张通栏;奇数末位通用规则 */
  .kpi-card:nth-child(odd):last-child{grid-column:span 2}
}

/* FOOTER + 复制按钮(2026-08-10 #42 全局双按钮规则) */
.footer{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--card);border:1px solid var(--lineS);border-radius:14px;padding:12px 16px;margin-top:14px}
.footer .src{font-size:11px;color:var(--ink3);line-height:1.6}
.btn-group{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--card);padding:7px 14px;border-radius:9px;cursor:pointer;font-size:12px;color:var(--ink);min-height:36px;font-family:inherit}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
@media(max-width:640px){
  .footer{flex-direction:column;align-items:stretch;gap:10px}
  .btn-group{width:100%}
  .btn-group .btn{flex:1 1 45%;min-height:42px;white-space:nowrap}
}

/* 数值表右对齐(vs/movement) */
.num-table td:nth-child(n+2){text-align:right;font-variant-numeric:tabular-nums}
.num-table td:nth-child(1){text-align:left}

/* #256 ACTION 模式 */
.action-hero{background:var(--card);border:1px solid var(--lineS);border-radius:16px;padding:18px 22px;margin-bottom:14px}
.action-hero .q{font-size:22px;font-weight:700;letter-spacing:-.5px}
.action-hero .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.action-chip{font-size:11.5px;font-weight:600;background:var(--bg);border:1px solid var(--lineS);border-radius:20px;padding:4px 12px;color:var(--ink2)}
.action-chip.hl{background:rgba(0,113,227,.1);color:var(--accent);border-color:rgba(0,113,227,.25)}
.action-next{background:rgba(52,199,89,.1);border:1px solid rgba(52,199,89,.3);border-radius:12px;padding:10px 14px;font-size:13px;font-weight:600;color:#1c7c3a;margin-top:10px}
.action-none{background:var(--bg);border:1.5px dashed var(--line);border-radius:14px;padding:22px;text-align:center;color:var(--ink2);font-size:13.5px}
.action-cand{display:inline-block;margin:4px;font-size:12px;background:var(--card);border:1px solid var(--lineS);border-radius:8px;padding:3px 10px;color:var(--ink2)}
</style>
</head>
<body>

<div class="app">
  <div class="header">
    <h1 id="planTitle">健身计划</h1>
    <p id="planSubtitle">加载中...</p>
  </div>
  <div id="reviewContainer"></div>
  <div id="todayContainer"></div>
  <div id="kpiContainer"></div>
  <div id="weekListContainer"></div>
  <div id="vsContainer"></div>
  <div id="completionContainer"></div>
  <div id="missedContainer"></div>
  <div id="movementContainer"></div>
  <div id="actionContainer"></div>
  <div class="tabs" id="weekTabs"></div>
  <div id="weeksContainer"></div>
  <div class="footer">
    <div class="src" id="srcLine">📊 数据来源 --</div>
    
  </div>
</div>

<script id="payload" type="application/json"><!--INJECT-DATA--></script><script><!--SHARED-HELPERS--></script><script>window.__P__=(function(){try{return JSON.parse(document.getElementById('payload').textContent||'{}');}catch(e){return null;}})();</script>

<script>
/* ====== 部位色板（与原 render_workout_plan.py 一致） ====== */
const PART_COLORS = {
  "胸": "#c2410c", "肩": "#a16207", "臂": "#4338ca",
  "背": "#047857", "腿": "#0891b2", "腹": "#7c3aed",
  "有氧": "#6b7280",
};
const DAY_LABELS = ['', '周一','周二','周三','周四','周五','周六','周日'];

function escapeHTML(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&': '&amp;','<': '&lt;','>': '&gt;','"': '&quot;',"'": '&#39;'
  }[c]));
}

function fmtRate(rate) {
  if (rate === null || rate === undefined) return '—';
  return Math.round(rate) + '%';
}

function renderHeader(config) {
  document.getElementById('planTitle').textContent = config.title || '健身计划';
  const desc = config.description || '';
  const total = config.total_weeks || '?';
  const start = config.start_date || '';
  document.getElementById('planSubtitle').textContent =
    `${desc} · ${total} 周循环 · 起始 ${start}`;
}

function renderReview(review) {
  const container = document.getElementById('reviewContainer');
  if (!review || !review.today) {
    container.innerHTML = '';
    return;
  }
  const t = review.today;
  const rate = t.completion_rate;
  const sessions = (t.sessions || []).filter(Boolean);
  const anomalies = t.anomalies || [];
  const note = t.note;
  let html = '<div class="review-section">';
  html += `<h2>📋 今日复盘 · ${t.date || ''}</h2>`;
  if (rate != null) {
    html += `<div class="review-stat"><span class="stat-label">完成率</span>`;
    html += `<span class="stat-value">${Math.round(rate)}%</span></div>`;
  }
  html += '<div class="review-detail">';
  if (sessions.length) html += `<p><strong>训练:</strong> ${escapeHTML(sessions.join(' / '))}</p>`;
  if (t.plan_total_sets || t.actual_total_sets) {
    html += `<p><strong>组数:</strong> 计划 ${t.plan_total_sets || 0} · 实做 ${t.actual_total_sets || 0}</p>`;
  }
  if (note) html += `<p><strong>备注:</strong> ${escapeHTML(note)}</p>`;
  html += '</div>';
  if (anomalies.length) {
    html += '<ul class="anomalies">';
    anomalies.forEach(a => { html += `<li>${escapeHTML(typeof a === 'string' ? a : (a.msg || ''))}</li>`; });
    html += '</ul>';
  }
  html += '</div>';
  container.innerHTML = html;
}

/* ====== MODE: today / day ====== */
function renderToday(data) {
  const container = document.getElementById('todayContainer');
  if (data.mode !== 'today' && data.mode !== 'day') { container.innerHTML = ''; return; }
  if (data.unstarted) {
    container.innerHTML = `<div class="session rest-day"><h3>计划尚未开始</h3><p>起始日 ${escapeHTML(data.start_date || '')}</p></div>`;
    return;
  }
  if (data.is_rest) {
    container.innerHTML = `<div class="session rest-day"><h3>${escapeHTML(data.date || '')} · 休息日</h3><p>主动恢复,不练力量</p></div>`;
    return;
  }
  const comp = data.completion || {};
  let html = '<div class="review-section">';
  const title = data.mode === 'day'
    ? `📅 看某天练什么 · ${escapeHTML(data.date || '')}${data.plan_week ? ` <span style="font-size:12px;color:var(--ink3)">第 ${data.plan_week} 周</span>` : ''}`
    : `💪 今天练什么 · ${data.date || ''}`;
  html += `<h2>${title}</h2>`;
  if (comp.rate != null) {
    html += `<div class="review-stat"><span class="stat-label">完成度</span>`;
    html += `<span class="stat-value">${fmtRate(comp.rate)}</span></div>`;
    html += `<p style="color:var(--ink2);font-size:13px">已完成 ${comp.done_sets || 0} 组 · 剩余 ${comp.remaining_sets || 0} 组</p>`;
    const cls = comp.rate >= 100 ? '' : (comp.rate >= 30 ? 'low' : 'danger');
    html += `<div class="progress"><div class="progress-fill ${cls}" style="width:${Math.min(comp.rate,100)}%"></div></div>`;
  }
  html += '</div>';
  (data.sessions || []).forEach(sess => {
    if (sess.is_rest_day) return;
    const ts = sess.time_start || '';
    const te = sess.time_end || '';
    html += '<div class="session"><div class="sess-head">';
    html += `<span class="sess-name">${escapeHTML(sess.session_label)}</span>`;
    if (ts && te) html += `<span class="sess-time">${escapeHTML(ts)}-${escapeHTML(te)}</span>`;
    html += '</div><div class="table-wrap"><table><thead><tr><th>动作</th><th>部位</th><th>计划</th><th>已练 / 进度</th></tr></thead><tbody>';
    (sess.movements || []).forEach(m => {
      const color = PART_COLORS[m.part] || '#6e6e73';
      const done = m.sets_done || 0;
      const total = m.sets || 0;
      const rate = total ? Math.round(done / total * 100) : 0;
      html += '<tr>';
      html += `<td><strong>${escapeHTML(m.name)}</strong></td>`;
      html += `<td><span class="part-tag" style="background:${color}20;color:${color}">${escapeHTML(m.part || '')}</span></td>`;
      html += `<td style="white-space:nowrap">${m.sets}×${m.reps ? escapeHTML(m.reps) : '?'}${m.weight ? '·' + escapeHTML(m.weight + (m.unit || 'kg')) : ''}</td>`;
      html += `<td style="white-space:nowrap"><strong>${done}</strong>/${total} <span style="color:${done >= total ? 'var(--green)' : (done > 0 ? 'var(--amber)' : 'var(--ink3)')};font-weight:600">${rate}%</span></td>`;
      html += '</tr>';
    });
    html += '</tbody></table></div></div>';
  });
  container.innerHTML = html;
}

/* ====== MODE: overview ====== */
function renderOverview(data) {
  const container = document.getElementById('kpiContainer');
  if (data.mode !== 'overview') { container.innerHTML = ''; return; }
  const k = data.kpi || {};
  let html = '';
  /* #258 周期剩余进度条 */
  if (k.period_status) {
    const tw = k.total_weeks || 0;
    const cw = Math.min(k.current_week ?? 0, tw);
    const pct = tw ? Math.max(0, Math.min(Math.round(cw / tw * 100), 100)) : 0;
    let statusText = '', statusCls = '';
    if (k.period_status === 'finished') { statusText = '本周期已完成'; statusCls = 'period-done'; }
    else if (k.period_status === 'unstarted') { statusText = '计划未开始'; statusCls = 'period-idle'; }
    else { statusText = `剩余 ${k.remaining_weeks ?? 0} 周 · ${k.remaining_training_days ?? 0} 个训练日`; statusCls = 'period-active'; }
    html += '<div class="review-section"><h2>🔄 周期进度</h2>';
    html += `<div class="period-row"><span class="period-label">第 <b>${cw}</b> / ${tw} 周</span><span class="period-status ${statusCls}">${statusText}</span></div>`;
    html += `<div class="progress"><div class="progress-fill period-fill" style="width:${pct}%"></div></div>`;
    if (k.period_status === 'finished') {
      html += `<p class="period-end-tip">⏳ ${tw} 周周期已到结束日期。周期结束不代表完成率达标——可以复制数据后重新制定新计划。</p>`;
    } else if (k.period_status === 'unstarted' && k.period_start) {
      html += `<p class="period-end-tip">📅 计划将于 ${escapeHTML(k.period_start)} 开始</p>`;
    } else {
      html += `<p class="period-end-tip">周期结束：${escapeHTML(k.period_end || '—')}</p>`;
    }
    html += '</div>';
  }
  const cards = [
    ['总周数', k.total_weeks ?? '—', '周循环计划'],
    ['剩余周数', k.remaining_weeks ?? '—', k.period_status === 'finished' ? '已到期' : '不含当前周'],
    ['剩余训练日', k.remaining_training_days ?? '—', k.period_status === 'finished' ? '已到期' : '从明天起逐日数'],
    ['整体完成率', fmtRate(k.overall_rate), '计划 vs 实做'],
    ['训练日', k.training_days ?? '—', '计划内训练天数'],
    ['训练时段', k.total_sessions ?? '—', '全部 session 数'],
    ['动作总数', k.total_movements ?? '—', '计划内动作条目'],
  ];
  html += '<div class="kpi-grid">';
  cards.forEach(([label, value, sub]) => {
    html += `<div class="kpi-card"><div class="kpi-label">${label}</div><div class="kpi-value">${value}</div><div class="kpi-sub">${sub}</div></div>`;
  });
  html += '</div>';
  html += '<div class="review-section"><h2>📊 每周完成率</h2>';
  if ((data.weekly_rates || []).length) {
    data.weekly_rates.forEach(w => {
      const rate = w.completion_rate;
      const cls = rate >= 100 ? '' : (rate >= 30 ? 'low' : 'danger');
      const pct = Math.min(rate ?? 0, 100);
      html += `<div class="week-row"><span class="week-name">第 ${w.week_number} 周</span>`;
      html += `<div class="week-bar"><div class="progress"><div class="progress-fill ${cls}" style="width:${pct}%"></div></div></div>`;
      html += `<span class="week-rate">${fmtRate(rate)}</span></div>`;
    });
  } else {
    html += '<p class="no-review">暂无计划数据</p>';
  }
  html += '</div>';
  container.innerHTML = html;
}

/* ====== MODE: week (单周完成度提示) ====== */
function renderWeekHint(data) {
  const container = document.getElementById('weekListContainer');
  if (data.mode !== 'week' || !data.completion) { container.innerHTML = ''; return; }
  const comp = data.completion;
  const rate = comp.completion_rate;
  const cls = rate >= 100 ? '' : (rate >= 30 ? 'low' : 'danger');
  let html = '<div class="review-section"><h2>📅 本周完成度</h2>';
  if (rate != null) {
    html += `<div class="review-stat"><span class="stat-label">完成率</span><span class="stat-value">${fmtRate(rate)}</span></div>`;
    html += `<p style="color:var(--ink2);font-size:13px">计划 ${comp.plan_sets} 组 · 实做 ${comp.actual_sets} 组 · ${comp.plan_days} 个训练日</p>`;
    html += `<div class="progress"><div class="progress-fill ${cls}" style="width:${Math.min(rate,100)}%"></div></div>`;
  } else {
    html += '<p class="no-review">该周无计划数据</p>';
  }
  html += '</div>';
  container.innerHTML = html;
}

/* ====== MODE: vs ====== */
function renderVs(data) {
  const container = document.getElementById('vsContainer');
  if (data.mode !== 'vs') { container.innerHTML = ''; return; }
  const rate = data.completion_rate;
  const dev = data.deviation;
  const devCls = dev > 0 ? 'dev-pos' : (dev < 0 ? 'dev-neg' : 'dev-zero');
  let html = `<div class="review-section"><h2>⚖️ 计划 vs 实际 · ${data.start_date} ~ ${data.end_date}</h2>`;
  html += `<div class="review-stat"><span class="stat-label">完成度</span><span class="stat-value">${fmtRate(rate)}</span></div>`;
  if (dev !== null && dev !== undefined) {
    html += `<p style="font-size:13px;color:var(--ink2)">偏差 <strong class="${devCls}">${dev > 0 ? '+' : ''}${dev}%</strong></p>`;
  }
  html += '</div>';
  html += '<div class="review-section"><h2>📋 动作级对比</h2>';
  if ((data.movement_rows || []).length) {
    html += '<div class="table-wrap"><table class="num-table"><thead><tr><th>动作</th><th>计划组数</th><th>实际组数</th><th>偏差</th></tr></thead><tbody>';
    data.movement_rows.forEach(r => {
      const dCls = r.deviation_pct > 0 ? 'dev-pos' : (r.deviation_pct < 0 ? 'dev-neg' : 'dev-zero');
      const devTxt = r.deviation_pct === null ? '—' : `${r.deviation_pct > 0 ? '+' : ''}${r.deviation_pct}%`;
      html += '<tr>';
      html += `<td><strong>${escapeHTML(r.movement)}</strong></td>`;
      html += `<td>${r.plan_sets}</td><td><strong>${r.actual_sets}</strong></td>`;
      html += `<td class="${dCls}">${devTxt}</td></tr>`;
    });
    html += '</tbody></table></div>';
  } else {
    html += '<p class="no-review">范围内无计划或实绩数据</p>';
  }
  html += '</div>';
  container.innerHTML = html;
}

/* ====== MODE: completion (折线) ====== */
function renderCompletion(data) {
  const container = document.getElementById('completionContainer');
  if (data.mode !== 'completion') { container.innerHTML = ''; return; }
  const weekly = data.weekly || [];
  let html = '<div class="review-section"><h2>📈 每周完成率趋势</h2>';
  if (weekly.length) {
    weekly.forEach(w => {
      const rate = w.completion_rate;
      const cls = rate >= 100 ? '' : (rate >= 30 ? 'low' : 'danger');
      const pct = Math.min(rate ?? 0, 100);
      html += `<div class="week-row"><span class="week-name">第 ${w.week_number} 周</span>`;
      html += `<div class="week-bar"><div class="progress"><div class="progress-fill ${cls}" style="width:${pct}%"></div></div></div>`;
      html += `<span class="week-rate">${fmtRate(rate)}</span></div>`;
    });
  } else {
    html += '<p class="no-review">暂无完成率数据</p>';
  }
  html += '</div>';
  container.innerHTML = html;
}

/* ====== MODE: missed ====== */
function renderMissed(data) {
  const container = document.getElementById('missedContainer');
  if (data.mode !== 'missed') { container.innerHTML = ''; return; }
  const missed = data.missed || [];
  let html = `<div class="review-section"><h2>⚠️ 未完成训练 · 最近 ${data.days || 28} 天</h2>`;
  if (missed.length) {
    html += `<p style="color:var(--ink2);font-size:13px;margin-bottom:10px">共 ${missed.length} 天漏练</p>`;
    missed.forEach(m => {
      html += '<div class="missed-card">';
      html += `<div class="missed-date">${m.date} · ${m.dow_label} <span style="color:var(--ink3);font-weight:400;font-size:12px">第 ${m.plan_week} 周</span></div>`;
      html += `<p style="font-size:12.5px;color:var(--ink2);margin-bottom:8px">计划 ${m.plan_sets} 组 · 实做 ${m.done_sets} 组</p>`;
      (m.movements || []).forEach(name => {
        html += `<span class="chip">${escapeHTML(name)}</span>`;
      });
      html += '</div>';
    });
  } else {
    html += '<p class="no-review">最近没有漏练 🎉</p>';
  }
  html += '</div>';
  container.innerHTML = html;
}

/* ====== MODE: movement (TOP 榜) ====== */
function renderMovement(data) {
  const container = document.getElementById('movementContainer');
  if (data.mode !== 'movement') { container.innerHTML = ''; return; }
  const ranking = data.ranking || [];
  let html = `<div class="review-section"><h2>🏆 动作完成率 TOP · 最近 ${data.days || 28} 天</h2>`;
  if (ranking.length) {
    html += '<div class="table-wrap"><table class="num-table"><thead><tr><th>#</th><th>动作</th><th>完成率</th><th>实做/计划</th></tr></thead><tbody>';
    ranking.forEach((r, i) => {
      const cls = r.rate >= 100 ? 'dev-pos' : (r.rate >= 50 ? '' : 'dev-neg');
      html += '<tr>';
      html += `<td><span class="rank-num">${i + 1}</span></td>`;
      html += `<td><strong>${escapeHTML(r.movement)}</strong></td>`;
      html += `<td class="${cls}" style="font-weight:600">${fmtRate(r.rate)}</td>`;
      html += `<td>${r.done_sets}/${r.plan_sets}</td></tr>`;
    });
    html += '</tbody></table></div>';
  } else {
    html += '<p class="no-review">暂无动作数据</p>';
  }
  html += '</div>';
  container.innerHTML = html;
}

/* ====== MODE: action (#256 按动作反查计划) ====== */
function renderAction(data) {
  const container = document.getElementById('actionContainer');
  if (data.mode !== 'action') { container.innerHTML = ''; return; }
  const q = escapeHTML(data.query || '');
  let html = '';

  // 无匹配 → 提示 + 模糊候选
  if (data.error) {
    html += `<div class="action-none">计划中无「${q}」`;
    if ((data.candidates || []).length) {
      html += `<div style="margin-top:12px;font-size:12px;color:var(--ink3)">相近动作：</div>`;
      data.candidates.forEach(c => { html += `<span class="action-cand">${escapeHTML(c)}</span>`; });
    }
    html += `</div>`;
    container.innerHTML = html;
    return;
  }

  // hero: 查询 + 频率汇总
  const s = data.summary || {};
  const weightTxt = (s.weight_min != null)
    ? `${s.weight_min}${s.weight_max && s.weight_max !== s.weight_min ? '-' + s.weight_max : ''}kg`
    : '';
  html += '<div class="action-hero">';
  html += `<div class="q">${q}</div>`;
  html += '<div class="tags">';
  html += `<span class="action-chip hl">${s.times_per_week || 0} 次/周</span>`;
  html += `<span class="action-chip">覆盖 ${s.weeks_with || 0} 周</span>`;
  if (s.total_sets) html += `<span class="action-chip">总 ${s.total_sets} 组</span>`;
  (s.parts || []).forEach(p => {
    const color = PART_COLORS[p] || '#6e6e73';
    html += `<span class="part-tag" style="background:${color}20;color:${color}">${escapeHTML(p)}</span>`;
  });
  if (weightTxt) html += `<span class="action-chip">重量 ${weightTxt}</span>`;
  html += '</div>';
  if (data.next_date) {
    html += `<div class="action-next">📅 下次练习日：${escapeHTML(data.next_date)}${data.next_week ? `（第 ${data.next_week} 周）` : ''}</div>`;
  }
  html += '</div>';

  // 位置列表: 循环计划每周相同 → 折叠为「每周固定」单组(2026-08-11 #256 审查: 8 周重复冗余)
  const pos = data.positions || [];
  const sameEveryWeek = pos.length > 0 && pos.every(p =>
    p.name === pos[0].name && p.dow_label === pos[0].dow_label &&
    p.sets === pos[0].sets && p.reps === pos[0].reps && p.weight === pos[0].weight);
  html += '<div class="review-section"><h2>📍 计划中出现的位置</h2>';
  if (pos.length) {
    if (sameEveryWeek) {
      // 折叠: 显示代表周 + 覆盖范围
      const weeks = [...new Set(pos.map(p => p.week))].sort((a, b) => a - b);
      const rangeTxt = weeks.length > 1 ? `每周相同（覆盖第 ${weeks[0]}-${weeks[weeks.length - 1]} 周）` : `第 ${weeks[0]} 周`;
      html += `<p style="font-size:12px;color:var(--ink2);margin-bottom:8px">🔁 ${escapeHTML(rangeTxt)}</p>`;
      html += '<div class="table-wrap"><table class="num-table"><thead><tr><th>星期</th><th>时段</th><th>组数×次数</th><th>重量</th></tr></thead><tbody>';
      html += '<tr>';
      html += `<td>${pos[0].dow_label}</td>`;
      html += `<td>${escapeHTML(pos[0].session_label || '')}${pos[0].time && pos[0].time !== '-' ? `<div style="font-size:10px;color:var(--ink3)">${escapeHTML(pos[0].time)}</div>` : ''}</td>`;
      html += `<td>${pos[0].sets}×${pos[0].reps != null ? escapeHTML(pos[0].reps) : '?'}</td>`;
      html += `<td style="white-space:nowrap">${escapeHTML(pos[0].weight != null && pos[0].weight !== 0 ? pos[0].weight + ' ' + pos[0].unit : (pos[0].unit !== 'kg' && pos[0].unit !== '自重' ? '—' : '自重'))}</td></tr>`;
      html += '</tbody></table></div>';
    } else {
      html += '<div class="table-wrap"><table class="num-table"><thead><tr><th>周次</th><th>星期</th><th>时段</th><th>组数×次数</th><th>重量</th></tr></thead><tbody>';
      pos.forEach(p => {
        const wt = (!p.weight || p.weight === 0) ? (p.unit !== 'kg' && p.unit !== '自重' ? '—' : '自重') : `${p.weight} ${p.unit}`;
        html += '<tr>';
        html += `<td>第 ${p.week} 周</td>`;
        html += `<td>${p.dow_label}</td>`;
        html += `<td>${escapeHTML(p.session_label || '')}${p.time && p.time !== '-' ? `<div style="font-size:10px;color:var(--ink3)">${escapeHTML(p.time)}</div>` : ''}</td>`;
        html += `<td>${p.sets}×${p.reps != null ? escapeHTML(p.reps) : '?'}</td>`;
        html += `<td style="white-space:nowrap">${escapeHTML(wt)}</td></tr>`;
      });
      html += '</tbody></table></div>';
    }
  }
  html += '</div>';
  container.innerHTML = html;
}

function renderWeekTabs(weeks, activeWk) {
  const tabs = document.getElementById('weekTabs');
  tabs.innerHTML = weeks.map((w, i) =>
    `<button class="tab ${w.week_number === activeWk ? 'active' : ''}" data-wk="${w.week_number}">第 ${w.week_number} 周</button>`
  ).join('');
}

function renderWeeks(weeks, activeWk) {
  const container = document.getElementById('weeksContainer');
  container.innerHTML = weeks.map((w, wIdx) => {
    const dayMap = {};
    w.days.forEach(d => {
      dayMap[d.day_of_week] = dayMap[d.day_of_week] || [];
      dayMap[d.day_of_week].push(d);
    });

    let html = `<div class="week ${w.week_number === activeWk ? 'active' : ''}" data-wk="${w.week_number}">`;

    html += `<div class="day-tabs" id="dayTabs_w${w.week_number}">`;
    for (let dow = 1; dow <= 7; dow++) {
      const active = dow === 1 ? ' active' : '';
      html += `<button class="day-tab${active}" data-day="d${wIdx}_${dow}">${DAY_LABELS[dow]}</button>`;
    }
    html += '</div>';

    for (let dow = 1; dow <= 7; dow++) {
      const days = dayMap[dow] || [];
      const sessions = days.flatMap(d => d.sessions || []);
      const display = dow === 1 ? '' : ' style="display:none"';
      html += `<div class="day-content" data-day="d${wIdx}_${dow}"${display}>`;

      if (sessions.length === 1 && sessions[0].is_rest_day) {
        html += `<div class="session rest-day"><h3>${DAY_LABELS[dow]} · 休息日</h3><p>主动恢复，不练力量</p></div>`;
        html += '</div>';
        continue;
      }

      sessions.forEach(sess => {
        const ts = sess.time_start || '';
        const te = sess.time_end || '';
        const timeStr = ts && te ? `${ts}-${te}` : '';
        html += '<div class="session">';
        html += '<div class="sess-head">';
        html += `<span class="sess-tag">${DAY_LABELS[dow]}</span>`;
        html += `<span class="sess-name">${escapeHTML(sess.session_label)}</span>`;
        if (timeStr) html += `<span class="sess-time">${escapeHTML(timeStr)}</span>`;
        if (sess.total_sets) html += `<span class="sess-time"> 共 ${sess.total_sets} 组</span>`;
        html += '</div>';

        const movements = sess.movements || [];
        if (movements.length) {
          html += '<div class="table-wrap"><table><thead><tr><th>动作</th><th>部位</th><th>组数 × 次数</th><th>重量</th><th>休息</th></tr></thead><tbody>';
          movements.forEach(m => {
            const name = m.name || '';
            const part = m.part || '';
            const mtype = m.type || '';
            const note = m.note || '';
            const rest = m.rest || '';
            const sets = m.sets || [];
            const nsets = sets.length;
            const reps = sets[0] ? sets[0].reps : '?';
            const weight = sets[0] ? sets[0].weight : '?';
            const unit = sets[0] ? sets[0].unit : 'kg';
            const color = PART_COLORS[part] || '#6e6e73';
            const wt = (!weight || weight === 0) ? (unit !== 'kg' && unit !== '自重' ? '—' : '自重') : `${weight} ${unit}`;
            const typeOrNote = mtype ? ` · ${escapeHTML(mtype)}` : '';
            html += '<tr>';
            html += `<td><strong>${escapeHTML(name)}</strong><span class="sub">${escapeHTML(note)}${typeOrNote}</span></td>`;
            html += `<td><span class="part-tag" style="background:${color}20;color:${color}">${escapeHTML(part)}</span></td>`;
            html += `<td><strong>${nsets}</strong> × ${escapeHTML(reps)}</td>`;
            html += `<td><strong>${escapeHTML(wt)}</strong></td>`;
            html += `<td>${escapeHTML(rest) || '-'}</td>`;
            html += '</tr>';
          });
          html += '</tbody></table></div>';
        } else {
          html += '<p style="color:var(--ink3);padding:12px 0">暂无动作</p>';
        }
        html += '</div>';
      });

      html += '</div>';
    }
    html += '</div>';
    return html;
  }).join('');

  bindWeekTabs();
  bindDayTabs();
}

function bindWeekTabs() {
  document.querySelectorAll('#weekTabs .tab').forEach(t => {
    t.onclick = function() {
      document.querySelectorAll('#weekTabs .tab').forEach(b => b.classList.remove('active'));
      this.classList.add('active');
      document.querySelectorAll('.week').forEach(w => {
        w.classList.toggle('active', w.dataset.wk === this.dataset.wk);
      });
    };
  });
}

function bindDayTabs() {
  document.querySelectorAll('.day-tabs').forEach(dt => {
    dt.querySelectorAll('.day-tab').forEach(t => {
      t.onclick = function() {
        dt.querySelectorAll('.day-tab').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        const week = this.closest('.week');
        week.querySelectorAll('.day-content').forEach(d => {
          d.style.display = (d.dataset.day === this.dataset.day) ? '' : 'none';
        });
      };
    });
  });
}

/* ====== 主入口 ====== */
(function() {
  const P = (typeof window.__P__ === 'object' && window.__P__ !== null) ? window.__P__ : null;
  if (!P) {
    document.body.innerHTML = window.errorReceipt({message: '数据加载失败'});
    return;
  }
  /* #321: window.__P__ = Base 注入信封 {status,data,message}(#314 契约),必须从信封解构 status;
     信封判据 = status 字段(data 可能为 null 的错误信封;裸数据形态兜底视为 ok)
     —— 修 #314 Base 化后 __P__.data 预取致 status 恒 undefined */
  const isEnvelope = (typeof P.status === 'string');
  const status = isEnvelope ? P.status : 'ok';
  const data = isEnvelope ? P.data : P;
  const message = isEnvelope ? P.message : undefined;
  if (status !== 'ok' && status !== 'warn') {
    document.body.innerHTML = window.errorReceipt({message: message || '数据错误'});
    return;
  }

  renderHeader(data.config || {});
  renderReview(data.review);
  renderToday(data);
  renderOverview(data);
  renderVs(data);
  renderCompletion(data);
  renderMissed(data);
  renderMovement(data);
  renderAction(data);
  renderWeekHint(data);

  const weeks = data.weeks || [];
  if (weeks.length) {
    // 2026-08-10 #252:full 模式默认激活当前周(data.current_week), 其他模式用第 1 周
    const activeWk = data.current_week || weeks[0].week_number;
    renderWeekTabs(weeks, activeWk);
    renderWeeks(weeks, activeWk);
  }

  /* 底部复制按钮(2026-08-10 #42 全局双按钮规则) */
  document.getElementById('srcLine').textContent =
    '📊 数据来源:' + (data.meta && data.meta.source || 'workout_plans') + ' · ' + (data.meta && data.meta.wake_word || '') + ' · ' + (data.meta && data.meta.generated_at || '');})();



</script>


<div id="actionbar-zone"></div>
