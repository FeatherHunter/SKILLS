    \ (选填,如\"该跑步了\")\n  重复类型: _____________ (选填,默认\"一次性\")\n  重复规则: _____________\
    \ (选填,见格式说明)\n\n期望效果:\n  AI 创建提醒,可关联或独立存在。"
  status: ''
  result: '创建提醒,可关联或独立存在。

    '
  category: remind
  subfunction: 创建提醒
- wake_word: 看提醒
  scenario_id: memo_reminders_active
  scenario_title: 查看所有有效提醒
  dimensions:
    status: active(默认)/dismissed
    html: 生成可视化页
  prompt: "请帮我查看有效提醒(唤醒词:看提醒):\n\n请按以下格式填写你的参数:\n\n  状  态: _____________ (选填,active=默认/dismissed)\n\
    \n期望效果:\n  AI 按时间排序列出提醒。带 --html 时生成可筛选的可视化页。"
  status: ''
  result: '按时间排序的提醒列表。带 --html 时生成可筛选页。

    '
  category: remind
  subfunction: 查看提醒
- wake_word: 查已提醒备忘
  scenario_id: memo_completed_reminders
  scenario_title: 查询已触发的提醒与对应打卡
  dimensions:
    html: 生成可视化页
  prompt: "请帮我查看已提醒过的备忘(唤醒词:查已提醒备忘):\n\n无需参数,直接发送。\n\n期望效果:\n  AI 列出已触发的提醒 + 关联打卡笔记\
    \ + 触发时间。"
  status: ''
  result: '列出已触发的提醒 + 关联打卡笔记 + 触发时间。匹配逻辑:

    一次性已通知 + 关联打卡 / 重复型有关联打卡。

    '
  category: remind
  subfunction: 查看提醒
- wake_word: 完成心愿
  scenario_id: memo_complete_wish
  scenario_title: 把心愿标记为已完成(原子操作)
  dimensions:
    ids: 心愿 ID 列表(单条或多条)
    content: 打卡内容(默认拷贝心愿原文)
    html: 过程型 HTML 向导(批量场景推荐)
  prompt: "请帮我把心愿标记为已完成(唤醒词:完成心愿):\n\n请按以下格式填写你的参数:\n\n  心愿 ID: _____________ (数字,如\
    \ 15)\n  打卡内容: _____________ (选填,默认拷贝心愿原文)\n\n期望效果:\n  AI 执行原子操作:删除该心愿 + 新建打卡\
