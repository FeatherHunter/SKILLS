    批量场景:先 wish-complete --html 生成向导,用户在 HTML 勾选 + 填打卡内容,采纳复制后 AI 逐条执行。

    '
  category: wish
  subfunction: 心愿推进
- wake_word: 心愿排期
  scenario_id: memo_wish_schedule
  scenario_title: 给心愿设排期日期(同步飞书 due)
  dimensions:
    ids: 心愿 ID 列表
    due: 期望完成日期 YYYY-MM-DD
    html: 过程型 HTML 向导(批量场景推荐)
  prompt: "请帮我给心愿设排期日期(唤醒词:心愿排期):\n\n请按以下格式填写你的参数:\n\n  心愿 ID: _____________ (数字,可多个,空格分隔,如\"\
    15 18 22\")\n  排期日期: _____________ (YYYY-MM-DD,如 2026-07-30)\n\n期望效果:\n  AI 设置本地\
    \ notes.due + 飞书 task 同步 due。\n  批量场景:先 wish-batch-plan --suggest-due X --html\
    \ 生成向导,你在 HTML 微调。"
  status: ''
  result: '本地设置 due + 飞书 task 同步 due(失败降级,本地优先)。

    批量场景:先 wish-batch-plan --suggest-due X --html 生成向导,用户在 HTML 微调,采纳复制后 AI 执行。

    '
  category: wish
  subfunction: 心愿推进
- wake_word: 备忘改分类
  scenario_id: memo_batch_change_category
  scenario_title: 批量改分类(过程型 HTML 向导)
  dimensions:
    from_category: 原分类
    to_category: 建议目标分类(HTML 可改)
    bulk_indicator: 原话含'都/全部/多个 ID'
