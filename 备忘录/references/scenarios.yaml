    \  目标分类: _____________ (建议目标,可在 HTML 改)\n\n期望效果:\n  AI 生成批量改分类向导 HTML,你在 UI 勾选\
    \ + 选目标分类 → 采纳复制 → 调多条 update-category。\n  注:子分类不会被改动。"
  status: ''
  result: '生成批量改分类向导 HTML,用户在 UI 勾选 + 选目标分类 → 采纳复制 → AI 调多条 update-category。

    注:子分类不改(它是内容维度的二阶属性)。

    '
