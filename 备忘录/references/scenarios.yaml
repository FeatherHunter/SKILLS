# 备忘录 · 场景资产(v1.2.0)
#
# 总纲 §07-HELP与场景完备性.md 契约:场景资产 = HELP HTML 唯一事实源
# 字段(7 必填 + 3 新):
#   wake_word:       关联业务唤醒词(HELP 唯一展示名;别名只在 SKILL.md 匹配层,#31 Q1)
#   scenario_id:     稳定 ID,跨版本不变
#   scenario_title:  用户可读标题
#   dimensions:      合法维度(领域决定)
#   prompt:          稳定用户意图(不暴露 CLI / DB / Python / 模板路径)
#   status:          ""(可用) | "【待开发】"(禁用 + AI 必停)
#   result:          预期结果(用户视角)
#   category:        必填,引用顶层 categories 的 key(#31 Q2/Q5 · #33 归类)
#   subfunction:     可选,子功能分组(空 = 「基础」兜底组,#31 Q3)
#   dependencies:    可选,环境依赖清单多行文本(#32 决议 · 仅 Init 场景)
#
# 30 个场景 = 29 个唯一唤醒词(28 业务 + 首次使用;备忘改分类 单条+批量 共用)。
# 无 order 字段:组内序 = 书写序(#31 Q4)。
# 共享校验:script/validate_scenarios.py(测试 + 渲染前双触发,#31 Q7)。
# 复制契约:复制按钮直接复制 prompt 纯文本(自含唤醒词锚点,不加标签头 · 卡路里同型)。
# DB fallback:Windows D:/.db · Linux(无 /mnt/d)~/.local/share/memo(2026-08-02 加)。
#
# 编辑本文件后,需重新跑 `memo_cli.py help` 刷新 HELP HTML。

skill: 备忘录
version: 1.2.0
categories:
- key: memo
  name: 备忘类
  icon: 📝
- key: search
  name: 查找类
  icon: 🔍
- key: remind
  name: 提醒类
  icon: ⏰
- key: wish
  name: 心愿类
  icon: 🎯
- key: checkin
  name: 打卡类
  icon: ✅
- key: mood
  name: 情绪类
  icon: 💭
- key: sync
  name: 同步类
  icon: 🔄
- key: init
  name: 初始化类
  icon: 🚀
scenarios:
- wake_word: 记备忘
  scenario_id: memo_add_basic
  scenario_title: 添加一条备忘笔记
  dimensions:
    category: 备忘(默认) / 心愿 / 打卡 / 情绪日记
    sub_category: 自由文本,AI 智能推断 1 个 2 字
    media: 可选附件(图片/音频/视频)
    due: 仅心愿生效,YYYY-MM-DD
  prompt: "请帮我记一条备忘(唤醒词:记备忘):\n\n请按以下格式填写你的参数:\n\n  内  容: _____________ (你想记的话)\n\
    \  分  类: _____________ (选填,备忘/心愿/打卡/情绪日记)\n  子分类: _____________ (选填,2 字简短描述,如\"\
    工作\")\n  附  件: _____________ (选填,文件名,如 receipt.jpg)\n\n期望效果:\n  AI 创建一条备忘,告诉你\
    \ ID 和创建时间。心愿类还会自动建飞书任务。"
  status: ''
  result: '创建一条笔记,告诉你 ID、分类、创建时间。心愿类还会自动建飞书任务。

    '
  category: memo
  subfunction: 基础记录
- wake_word: 改备忘
  scenario_id: memo_update_basic
  scenario_title: 修改已有笔记
  dimensions:
    id: 必填,数字 ID
    content: 新内容(可选)
    category: 新顶层分类(可选)
    sub_category: 新子分类(可选)
  prompt: "请帮我修改一条已有的备忘(唤醒词:改备忘):\n\n请按以下格式填写你的参数:\n\n  笔记 ID: _____________ (数字,如\
    \ 15)\n  新内容: _____________ (改后的话)\n  新分类: _____________ (选填,备忘/心愿/打卡/情绪日记)\n\
    \  新子分类: _____________ (选填,2 字简短)\n\n期望效果:\n  AI 更新这条备忘的字段,告诉你修改后的内容。心愿类会同步飞书任务标题。"
  status: ''
  result: '更新笔记内容/分类/子分类,告诉你更新后的字段。心愿类会同步更新飞书任务标题。

    '
  category: memo
  subfunction: 基础记录
- wake_word: 删备忘
  scenario_id: memo_delete_basic
  scenario_title: 删除笔记
  dimensions:
    id: 必填,数字 ID,可多个
    with_reminders: 是否级联删关联提醒(默认否,有提醒则报错)
    true: 跳过二次确认(自动化用)
  prompt: "请帮我删除一条或多条备忘(唤醒词:删备忘):\n\n请按以下格式填写你的参数:\n\n  笔记 ID: _____________ (可多个,空格分隔,如\"\
    15 18 22\")\n\n期望效果:\n  AI 删除这些备忘并告知影响行数;有关联提醒时 AI 会先确认。"
  status: ''
  result: '删除笔记并告知影响行数;有关联提醒时提示用户确认是否级联删除。

    '
  category: memo
  subfunction: 基础记录
- wake_word: 备忘改分类
  scenario_id: memo_change_category_single
  scenario_title: 修改单条笔记的顶层分类
  dimensions:
    id: 必填,数字 ID
    category: 目标分类(备忘/心愿/打卡/情绪日记)
    bulk_indicator: 原话含'都/全部/多个 ID' → 走批量版
  prompt: "请帮我修改单条备忘的顶层分类(唤醒词:备忘改分类,单条):\n\n请按以下格式填写你的参数:\n\n  笔记 ID: _____________\
    \ (数字,如 15)\n  新分类: _____________ (备忘/心愿/打卡/情绪日记)\n\n期望效果:\n  AI 改这条备忘的顶层分类;子分类不会被改动(它是内容维度的二阶属性)。"
  status: ''
  result: '改顶层分类。子分类不变(它是内容维度的二阶属性)。

    批量场景走"批量改分类向导",见同名条目。

    '
  category: memo
  subfunction: 分类调整
- wake_word: 备忘改子分类
  scenario_id: memo_change_subcategory
  scenario_title: 修改单条笔记的子分类
  dimensions:
    id: 必填,数字 ID
    sub_category: 新子分类(2 字自由文本,'null' 清除)
  prompt: "请帮我修改单条备忘的子分类(唤醒词:备忘改子分类):\n\n请按以下格式填写你的参数:\n\n  笔记 ID: _____________ (数字,如\
    \ 15)\n  新子分类: _____________ (2 字简短,如\"工作\";留空=清除)\n\n期望效果:\n  AI 修改或清除这条备忘的子分类,适用于所有顶层分类。"
  status: ''
  result: '修改/清除子分类,适用于所有顶层分类(子分类是自由文本)。

    '
  category: memo
  subfunction: 分类调整
- wake_word: 搜备忘
  scenario_id: memo_search_keyword
  scenario_title: 按关键词搜索笔记
  dimensions:
    keyword: 搜索词(全文索引)
    category: 顶层分类过滤(可选)
    sub_category: 子分类过滤(可选)
    due: 按排期日期过滤(可选,YYYY-MM-DD)
    html: 生成可视化结果页
  prompt: "请帮我搜备忘录(唤醒词:搜备忘):\n\n请按以下格式填写你的参数:\n\n  关键词: _____________ (搜的内容,如\"咖啡\"\
    )\n  分  类: _____________ (选填,备忘/心愿/打卡/情绪日记)\n  子分类: _____________ (选填,2 字简短)\n\
    \  排  期: _____________ (选填,YYYY-MM-DD,按排期日期过滤)\n\n期望效果:\n  AI 列出含关键词的所有笔记。带 --html\
    \ 时生成可视化搜索结果页。"
  status: ''
  result: '列出匹配的笔记,告诉你结果数。带 --html 时生成可视化页(含筛选/复制 ID/复制回执)。

    '
  category: search
  subfunction: 基础查找
- wake_word: 查备忘
  scenario_id: memo_search_alias
  scenario_title: 搜备忘的别名(同义触发)
  dimensions:
    keyword: 搜索词
  prompt: "请帮我查备忘录(唤醒词:查备忘):\n\n请按以下格式填写你的参数:\n\n  关键词: _____________ (搜的内容)\n\n期望效果:\n\
    \  AI 搜索含关键词的笔记,并生成可视化结果页。"
  status: ''
  result: '同"搜备忘"。走相同命令。

    '
  category: search
  subfunction: 基础查找
- wake_word: 看备忘
  scenario_id: memo_get_detail
  scenario_title: 查看单条笔记详情
  dimensions:
    id: 必填,数字 ID
    html: 生成详情页
  prompt: "请帮我查看某条备忘的详情(唤醒词:看备忘):\n\n请按以下格式填写你的参数:\n\n  笔记 ID: _____________ (数字,如\
    \ 15)\n\n期望效果:\n  AI 显示这条备忘的全部字段。带 --html 时生成详情页。"
  status: ''
  result: '显示单条笔记全部字段。带 --html 时生成详情页。

    '
  category: search
  subfunction: 基础查找
- wake_word: 按时间搜备忘
  scenario_id: memo_search_by_date
  scenario_title: 按日期范围搜索笔记
  dimensions:
    start: 开始日期 YYYY-MM-DD
    end: 结束日期 YYYY-MM-DD
    category: 顶层分类过滤
    html: 生成可视化结果页
  prompt: "请帮我按时间范围搜索备忘录(唤醒词:按时间搜备忘):\n\n请按以下格式填写你的参数:\n\n  开始日期: _____________ (YYYY-MM-DD,如\
    \ 2026-07-01)\n  结束日期: _____________ (YYYY-MM-DD,如 2026-07-07)\n  分  类:    _____________\
    \ (选填,备忘/心愿/打卡/情绪日记)\n\n期望效果:\n  AI 列出该日期范围内的所有笔记,按创建时间倒序。"
  status: ''
  result: '列出日期范围内的笔记,按创建时间倒序。

    '
  category: search
  subfunction: 时间查找
- wake_word: 查心愿
  scenario_id: memo_search_wish
  scenario_title: 查所有心愿(自动带分类过滤)
  dimensions:
    keyword: 搜索词(可选)
    due: 按排期日期过滤
    html: 生成可视化页
  prompt: "请帮我查看心愿(唤醒词:查心愿):\n\n请按以下格式填写你的参数:\n\n  关键词: _____________ (选填,搜的内容)\n\
    \  排  期: _____________ (选填,YYYY-MM-DD,按排期日期过滤)\n\n期望效果:\n  AI 自动按\"心愿\"分类过滤,等同搜备忘\
    \ -c 心愿。"
  status: ''
  result: '自动按"心愿"分类过滤,等同 `搜备忘 -c 心愿`。

    '
  category: search
  subfunction: 分类查找
- wake_word: 查打卡
  scenario_id: memo_search_checkin
  scenario_title: 查所有打卡记录
  dimensions:
    keyword: 搜索词(可选)
    html: 生成可视化页
  prompt: "请帮我查看打卡记录(唤醒词:查打卡):\n\n请按以下格式填写你的参数:\n\n  关键词: _____________ (选填,搜的内容)\n\
    \n期望效果:\n  AI 自动按\"打卡\"分类过滤,列出结果。"
  status: ''
  result: '自动按"打卡"分类过滤。

    '
  category: search
  subfunction: 分类查找
- wake_word: 查情绪
  scenario_id: memo_search_mood
  scenario_title: 查所有情绪日记
  dimensions:
    keyword: 搜索词(可选)
    html: 生成可视化页
  prompt: "请帮我查看情绪日记(唤醒词:查情绪):\n\n请按以下格式填写你的参数:\n\n  关键词: _____________ (选填,搜的内容)\n\
    \n期望效果:\n  AI 自动按\"情绪日记\"分类过滤,列出结果。"
  status: ''
  result: '自动按"情绪日记"分类过滤。

    '
  category: search
  subfunction: 分类查找
- wake_word: 记提醒
  scenario_id: memo_remind_with_note
  scenario_title: 添加笔记 + 设置提醒(两步合一)
  dimensions:
    content: 笔记内容
    remind_at: 提醒时间 YYYY-MM-DD HH:MM
    repeat_type: 一次性(默认)/每天/每周/每月/每年
    repeat_rule: 重复规则(每天:HH:MM / 每周:W HH:MM / 每月:D HH:MM / 每年:MM-DD HH:MM)
  prompt: "请帮我记一条提醒(唤醒词:记提醒 · 两步合一:添笔记 + 设提醒):\n\n请按以下格式填写你的参数:\n\n  笔记内容: _____________\
    \ (要提醒的事)\n  提醒时间: _____________ (YYYY-MM-DD HH:MM,如 2026-07-25 09:00)\n  重复类型:\
    \ _____________ (选填,一次性/每天/每周/每月/每年)\n  重复规则: _____________ (选填,如每天=\"09:00\"\
    ,每周=\"5 17:00\")\n\n期望效果:\n  AI 先创建笔记,再创建关联提醒,Cron 到点触发推送。"
  status: ''
  result: '先创建笔记,再创建关联提醒。Cron 到点触发推送。

    '
  category: remind
  subfunction: 创建提醒
- wake_word: 设提醒
  scenario_id: memo_remind_existing
  scenario_title: 给已有笔记加提醒
  dimensions:
    note_id: 笔记 ID(可选,可不关联具体笔记)
    remind_at: 提醒时间
    content: 提醒内容
    repeat_type: 重复类型(默认一次性)
    repeat_rule: 重复规则
  prompt: "请帮我给已有笔记加提醒(唤醒词:设提醒):\n\n请按以下格式填写你的参数:\n\n  笔记 ID: _____________ (数字,如\
