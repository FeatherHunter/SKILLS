# 备忘录 · 场景资产(v1.1.4)
#
# 总纲 §07-HELP与场景完备性.md 契约:场景资产 = HELP HTML 唯一事实源
# 字段(7 必填):
#   wake_word:       关联业务唤醒词
#   scenario_id:     稳定 ID,跨版本不变
#   scenario_title:  用户可读标题
#   dimensions:      合法维度(领域决定)
#   prompt:          稳定用户意图(不暴露 CLI / DB / Python / 模板路径)
#   status:          ""(可用) | "【待开发】"(禁用 + AI 必停)
#   result:          预期结果(用户视角)
#
# 本期全部 status = ""(可用);无【待开发】。
# 28 个场景 = 28 个 SKILL.md 触发词(含 12 个子唤醒词)。
#
# 编辑本文件后,需重新跑 `memo_cli.py help` 刷新 HELP HTML。
# 守门测试:tests/test_help.py:test_scenarios_schema

skill: 备忘录
version: 1.1.4
scenarios:

  # ==================== 记录类 ====================

  - wake_word: 记备忘
    scenario_id: memo_add_basic
    scenario_title: 添加一条备忘笔记
    dimensions:
      category: "备忘(默认) / 心愿 / 打卡 / 情绪日记"
      sub_category: "自由文本,AI 智能推断 1 个 2 字"
      media: "可选附件(图片/音频/视频)"
      due: "仅心愿生效,YYYY-MM-DD"
    prompt: |
      请帮我记一下:<用户原话>
      (可选:指定分类/子分类/附件/排期日期)
    status: ""
    result: |
      创建一条笔记,告诉你 ID、分类、创建时间。心愿类还会自动建飞书任务。

  - wake_word: 改备忘
    scenario_id: memo_update_basic
    scenario_title: 修改已有笔记
    dimensions:
      id: "必填,数字 ID"
      content: "新内容(可选)"
      category: "新顶层分类(可选)"
      sub_category: "新子分类(可选)"
    prompt: |
      请帮我改一下:<笔记 ID> → <新内容/新分类>(可选)
    status: ""
    result: |
      更新笔记内容/分类/子分类,告诉你更新后的字段。心愿类会同步更新飞书任务标题。

  - wake_word: 删备忘
    scenario_id: memo_delete_basic
    scenario_title: 删除笔记
    dimensions:
      id: "必填,数字 ID,可多个"
      with_reminders: "是否级联删关联提醒(默认否,有提醒则报错)"
      yes: "跳过二次确认(自动化用)"
    prompt: |
      请帮我删掉笔记:<ID>(多个用空格分)
    status: ""
    result: |
      删除笔记并告知影响行数;有关联提醒时提示用户确认是否级联删除。

  - wake_word: 备忘改分类
    scenario_id: memo_change_category_single
    scenario_title: 修改单条笔记的顶层分类
    dimensions:
      id: "必填,数字 ID"
      category: "目标分类(备忘/心愿/打卡/情绪日记)"
      bulk_indicator: "原话含'都/全部/多个 ID' → 走批量版"
    prompt: |
      请帮我把笔记 #<ID> 的分类改成 <新分类>
    status: ""
    result: |
      改顶层分类。子分类不变(它是内容维度的二阶属性)。
      批量场景走"批量改分类向导",见同名条目。

  - wake_word: 备忘改子分类
    scenario_id: memo_change_subcategory
    scenario_title: 修改单条笔记的子分类
    dimensions:
      id: "必填,数字 ID"
      sub_category: "新子分类(2 字自由文本,'null' 清除)"
    prompt: |
      请帮我把笔记 #<ID> 的子分类改成 <X>(或清除)
    status: ""
    result: |
      修改/清除子分类,适用于所有顶层分类(子分类是自由文本)。

  # ==================== 查找类 ====================

  - wake_word: 搜备忘
    scenario_id: memo_search_keyword
    scenario_title: 按关键词搜索笔记
    dimensions:
      keyword: "搜索词(全文索引)"
      category: "顶层分类过滤(可选)"
      sub_category: "子分类过滤(可选)"
      due: "按排期日期过滤(可选,YYYY-MM-DD)"
      html: "生成可视化结果页"
    prompt: |
      帮我搜一下:<关键词>(可选:分类/子分类/排期)
    status: ""
    result: |
      列出匹配的笔记,告诉你结果数。带 --html 时生成可视化页(含筛选/复制 ID/复制回执)。

  - wake_word: 查备忘
    scenario_id: memo_search_alias
    scenario_title: 搜备忘的别名(同义触发)
    dimensions:
      keyword: "搜索词"
    prompt: |
      帮我查一下:<关键词>
    status: ""
    result: |
      同"搜备忘"。走相同命令。

  - wake_word: 看备忘
    scenario_id: memo_get_detail
    scenario_title: 查看单条笔记详情
    dimensions:
      id: "必填,数字 ID"
      html: "生成详情页"
    prompt: |
      帮我看下笔记 #<ID>
    status: ""
    result: |
      显示单条笔记全部字段。带 --html 时生成详情页。

  - wake_word: 按时间搜备忘
    scenario_id: memo_search_by_date
    scenario_title: 按日期范围搜索笔记
    dimensions:
      start: "开始日期 YYYY-MM-DD"
      end: "结束日期 YYYY-MM-DD"
      category: "顶层分类过滤"
      html: "生成可视化结果页"
    prompt: |
      帮我看下 <开始日期> 到 <结束日期> 的<可选分类>备忘
    status: ""
    result: |
      列出日期范围内的笔记,按创建时间倒序。

  - wake_word: 查心愿
    scenario_id: memo_search_wish
    scenario_title: 查所有心愿(自动带分类过滤)
    dimensions:
      keyword: "搜索词(可选)"
      due: "按排期日期过滤"
      html: "生成可视化页"
    prompt: |
      帮我看看心愿(可选:<关键词>/<排期日期>)
    status: ""
    result: |
      自动按"心愿"分类过滤,等同 `搜备忘 -c 心愿`。

  - wake_word: 查打卡
    scenario_id: memo_search_checkin
    scenario_title: 查所有打卡记录
    dimensions:
      keyword: "搜索词(可选)"
      html: "生成可视化页"
    prompt: |
      帮我看看打卡记录(可选:<关键词>)
    status: ""
    result: |
      自动按"打卡"分类过滤。

  - wake_word: 查情绪
    scenario_id: memo_search_mood
    scenario_title: 查所有情绪日记
    dimensions:
      keyword: "搜索词(可选)"
      html: "生成可视化页"
    prompt: |
      帮我看看情绪日记(可选:<关键词>)
    status: ""
    result: |
      自动按"情绪日记"分类过滤。

  # ==================== 提醒类 ====================

  - wake_word: 记提醒
    scenario_id: memo_remind_with_note
    scenario_title: 添加笔记 + 设置提醒(两步合一)
    dimensions:
      content: "笔记内容"
      remind_at: "提醒时间 YYYY-MM-DD HH:MM"
      repeat_type: "一次性(默认)/每天/每周/每月/每年"
      repeat_rule: "重复规则(每天:HH:MM / 每周:W HH:MM / 每月:D HH:MM / 每年:MM-DD HH:MM)"
    prompt: |
      帮我记:<笔记内容>,并设个<时间>的提醒(可选:重复规则)
    status: ""
    result: |
      先创建笔记,再创建关联提醒。Cron 到点触发推送。

  - wake_word: 设提醒
    scenario_id: memo_remind_existing
    scenario_title: 给已有笔记加提醒
    dimensions:
      note_id: "笔记 ID(可选,可不关联具体笔记)"
      remind_at: "提醒时间"
      content: "提醒内容"
      repeat_type: "重复类型(默认一次性)"
      repeat_rule: "重复规则"
    prompt: |
      帮我给笔记 #<ID> 设个<时间>的提醒(可选:重复规则)
    status: ""
    result: |
      创建提醒,可关联或独立存在。

  - wake_word: 看提醒
    scenario_id: memo_reminders_active
    scenario_title: 查看所有有效提醒
    dimensions:
      status: "active(默认)/dismissed"
      html: "生成可视化页"
    prompt: |
      帮我看看我的提醒(可选:只看已完成的)
    status: ""
    result: |
      按时间排序的提醒列表。带 --html 时生成可筛选页。

  - wake_word: 查已提醒备忘
    scenario_id: memo_completed_reminders
    scenario_title: 查询已触发的提醒与对应打卡
    dimensions:
      html: "生成可视化页"
    prompt: |
      帮我看看已经完成的提醒
    status: ""
    result: |
      列出已触发的提醒 + 关联打卡笔记 + 触发时间。匹配逻辑:
      一次性已通知 + 关联打卡 / 重复型有关联打卡。

  # ==================== 心愿类 ====================

  - wake_word: 完成心愿
    scenario_id: memo_complete_wish
    scenario_title: 把心愿标记为已完成(原子操作)
    dimensions:
      ids: "心愿 ID 列表(单条或多条)"
      content: "打卡内容(默认拷贝心愿原文)"
      html: "过程型 HTML 向导(批量场景推荐)"
    prompt: |
      我完成了心愿 #<ID>(可选:<打卡内容>)
    status: ""
    result: |
      原子操作:删除心愿 + 新建打卡 note(同事务)。
      批量场景:先 wish-complete --html 生成向导,用户在 HTML 勾选 + 填打卡内容,采纳复制后 AI 逐条执行。

  - wake_word: 心愿排期
    scenario_id: memo_wish_schedule
    scenario_title: 给心愿设排期日期(同步飞书 due)
    dimensions:
      ids: "心愿 ID 列表"
      due: "期望完成日期 YYYY-MM-DD"
      html: "过程型 HTML 向导(批量场景推荐)"
    prompt: |
      把心愿 #<ID> 放到 <日期> 完成(批量:多个 ID 用空格分)
    status: ""
    result: |
      本地设置 due + 飞书 task 同步 due(失败降级,本地优先)。
      批量场景:先 wish-batch-plan --suggest-due X --html 生成向导,用户在 HTML 微调,采纳复制后 AI 执行。

  # ==================== 批量类(过程型 HTML) ====================

  - wake_word: 备忘改分类
    scenario_id: memo_batch_change_category
    scenario_title: 批量改分类(过程型 HTML 向导)
    dimensions:
      from_category: "原分类"
      to_category: "建议目标分类(HTML 可改)"
      bulk_indicator: "原话含'都/全部/多个 ID'"
      html: "过程型 HTML(必须)"
    prompt: |
      把 <原分类> 下这 N 条都改成 <新分类>
    status: ""
    result: |
      生成批量改分类向导 HTML,用户在 UI 勾选 + 选目标分类 → 采纳复制 → AI 调多条 update-category。
      注:子分类不改(它是内容维度的二阶属性)。

  # ==================== 跨 Skill(飞书联动) ====================

  - wake_word: 备忘录同步
    scenario_id: memo_sync_feishu
    scenario_title: 备忘录 ↔ 飞书双向对账
    dimensions:
      html: "生成同步报告页"
    prompt: |
      帮我跑下备忘录同步(和飞书对账)
    status: ""
    result: |
      3 步对账:
      1. 本地补建:本地心愿无飞书 task → 自动建
      2. 反向同步 done:飞书已完成 → 本地 complete-wish
      3. 反向同步 due:飞书 due 改 → 本地 notes.due 跟(飞书优先)
      带 --html 时生成同步报告页(11 统计字段 + 3 步折叠 + errors 高亮)。

  # ==================== 子唤醒词 ====================
  # 子唤醒词与父触发词功能相同,自动带顶层分类;下面是它们的场景化版本。

  - wake_word: 记心愿
    scenario_id: memo_add_wish
    scenario_title: 快速添加心愿(自动心愿分类)
    dimensions:
      content: "心愿内容"
      sub_category: "自由文本"
      due: "排期日期(可选)"
      tasklist_guid: "飞书任务清单 GUID(可选)"
    prompt: |
      我想:<心愿内容>(可选:放在 <日期> 完成)
    status: ""
    result: |
      创建心愿 note,自动建飞书 task 并写回 task_guid。
      顶层分类已确定,跳过分类确认。

  - wake_word: 删心愿
    scenario_id: memo_delete_wish
    scenario_title: 删心愿(自动心愿分类过滤)
    dimensions:
      id: "心愿 ID"
    prompt: |
      帮我删掉心愿 #<ID>
    status: ""
    result: |
      走通用删笔记流程。心愿关联的飞书 task 自动标完成。

  - wake_word: 改心愿
    scenario_id: memo_update_wish
    scenario_title: 改心愿(自动心愿分类过滤)
    dimensions:
      id: "心愿 ID"
      content: "新内容"
    prompt: |
      帮我改心愿 #<ID>:<新内容>
    status: ""
    result: |
      走通用改笔记流程。飞书 task 标题自动同步。

  - wake_word: 记打卡
    scenario_id: memo_add_checkin
    scenario_title: 快速添加打卡(自动打卡分类)
    dimensions:
      content: "打卡内容"
      sub_category: "自由文本"
      reminder_id: "关联提醒 ID(可选,溯源用)"
    prompt: |
      打卡:<内容>
    status: ""
    result: |
      创建打卡 note。可选关联 reminder_id(提醒触发后自动打卡时由系统填)。

  - wake_word: 删打卡
    scenario_id: memo_delete_checkin
    scenario_title: 删打卡(自动打卡分类过滤)
    dimensions:
      id: "打卡 ID"
    prompt: |
      帮我删掉打卡 #<ID>
    status: ""
    result: |
      走通用删笔记流程。

  - wake_word: 改打卡
    scenario_id: memo_update_checkin
    scenario_title: 改打卡(自动打卡分类过滤)
    dimensions:
      id: "打卡 ID"
      content: "新内容"
    prompt: |
      帮我改打卡 #<ID>:<新内容>
    status: ""
    result: |
      走通用改笔记流程。

  - wake_word: 记情绪
    scenario_id: memo_add_mood
    scenario_title: 快速添加情绪日记(自动情绪日记分类)
    dimensions:
      content: "情绪内容"
      sub_category: "自由文本"
    prompt: |
      记一下情绪:<内容>
    status: ""
    result: |
      创建情绪日记 note。

  - wake_word: 删情绪
    scenario_id: memo_delete_mood
    scenario_title: 删情绪(自动情绪日记分类过滤)
    dimensions:
      id: "情绪日记 ID"
    prompt: |
      帮我删掉情绪日记 #<ID>
    status: ""
    result: |
      走通用删笔记流程。

  - wake_word: 改情绪
    scenario_id: memo_update_mood
    scenario_title: 改情绪(自动情绪日记分类过滤)
    dimensions:
      id: "情绪日记 ID"
      content: "新内容"
    prompt: |
      帮我改情绪日记 #<ID>:<新内容>
    status: ""
    result: |
      走通用改笔记流程。