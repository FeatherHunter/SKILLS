<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>批量改分类向导</title>
<style><!--SHARED-CSS--></style>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--fg);line-height:1.65;-webkit-font-smoothing:antialiased}
.wrap{max-width:980px;margin:0 auto;padding:48px 22px 90px}
.hero{background:linear-gradient(180deg,#fff 0%,#f8fbff 100%);border-radius:28px;padding:34px;margin-bottom:20px;box-shadow:var(--shadow,0 1px 2px rgba(0,0,0,.04),0 12px 36px rgba(0,0,0,.06))}
.eyebrow{font-size:13px;color:var(--blue);font-weight:800;letter-spacing:.08em;text-transform:uppercase;margin-bottom:10px}
h1{font-size:36px;line-height:1.15;letter-spacing:-.035em;margin-bottom:12px}
.lead{color:var(--fg2);font-size:17px}
.meta{margin-top:14px;color:var(--fg3);font-size:13px}
.badge{display:inline-block;background:var(--soft,#f5f8ff);color:var(--blue);padding:4px 11px;border-radius:999px;font-size:13px;font-weight:700;margin:2px 6px 2px 0}
.badge.ok{background:#ecfff2;color:#178a3a}
.badge.warn{background:#fff7e8;color:#b25b00}
.panel{background:var(--card);border-radius:20px;padding:22px;box-shadow:0 1px 3px rgba(0,0,0,.04);margin:14px 0}
.panel .hint{font-size:12px;color:var(--fg3);margin-top:6px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0;align-items:center}
button{border:0;background:var(--blue);color:#fff;border-radius:999px;padding:10px 16px;cursor:pointer;font-size:14px;font-weight:600}
button.ghost{background:transparent;color:var(--blue);border:1px solid var(--line);min-height:44px}
button.copy.ghost{background:var(--card);color:var(--blue);border:1.5px solid var(--blue)}
button.primary{background:var(--blue);color:#fff;font-size:15px;padding:12px 20px}
input[type=text]{border:1px solid var(--line);border-radius:12px;padding:9px 12px;font-size:14px;font-family:inherit;background:var(--card)}
select{border:1px solid var(--line);border-radius:12px;padding:9px 12px;font-size:14px;font-family:inherit;background:var(--card)}
.note{background:var(--card);border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 1px 3px rgba(0,0,0,.04);transition:box-shadow .15s,opacity .15s}
#noteList{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;align-items:stretch}
#noteList .note{margin:0;padding:14px;display:flex;flex-direction:column;height:100%}
#noteList .hm-empty{grid-column:1/-1}
#noteList .note-head{flex-wrap:nowrap;gap:6px;margin-bottom:8px;align-items:flex-start}
#noteList .note-id{font-size:13px;min-width:0;white-space:nowrap}
#noteList .note-content{font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-all;flex:1 1 auto}
#noteList .note-meta{margin:auto 0 0;gap:8px;padding-top:8px}
#noteList .note-meta .badge{font-size:11px;padding:2px 8px;margin:2px 4px 2px 0}
.note.off{opacity:.5}
.note.off .content{text-decoration:line-through;color:var(--fg3)}
.note-head{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.note-id{color:var(--blue);font-weight:800;font-size:15px;min-width:48px}
.note-content{font-size:16px;flex:1}
.note-meta{display:flex;gap:16px;flex-wrap:wrap;align-items:center;color:var(--fg2);font-size:13px;margin:8px 0}
.flow{display:flex;align-items:center;justify-content:center;gap:12px;margin:20px 0;font-size:17px;font-weight:600}
.flow .from{background:var(--bg);color:var(--fg2);padding:8px 16px;border-radius:14px;border:1px solid var(--line)}
.flow .to{background:var(--soft,#f5f8ff);color:var(--blue);padding:8px 16px;border-radius:14px}
.flow .arrow{font-size:24px;color:var(--fg3)}
.kpi{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:14px 0}
.kpi .stat{background:var(--card);border-radius:18px;padding:18px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.kpi b{display:block;font-size:22px;letter-spacing:-.02em;margin-bottom:4px}
.kpi span{color:var(--fg2);font-size:13px}
pre{white-space:pre-wrap;background:#f5f5f7;color:var(--fg);border:1px solid var(--line);border-radius:16px;padding:16px;overflow:auto;font-size:13px;line-height:1.65;max-height:340px;margin-top:14px;font-family:inherit}
.notice{padding:12px 16px;border-radius:14px;margin:10px 0;font-size:14px}
.notice.warn{background:#fff7e8;color:#b25b00}
.notice.err{background:#fff5f5;color:#ff3b30}
@media(max-width:800px){.wrap{padding:28px 14px 70px}.hero{padding:26px 20px}h1{font-size:30px}.flow{flex-direction:column}}
</style>
</head>
<body>
<div class="wrap">
<header class="hero">
<h1 id="title">批量改分类向导</h1>
<p class="lead" id="subtitle">数据加载中</p>
<p class="meta" id="meta"></p>
</header>
<section id="injectError" style="display:none"></section>

<section class="kpi" id="kpis"></section>

<section class="panel">
<div style="font-weight:700;margin-bottom:10px">🎯 改到哪个分类</div>
<div class="toolbar">
<label style="color:var(--fg2);font-size:14px">目标分类:</label>
<select id="toCatSelect">
<option value="备忘">备忘</option>
<option value="心愿">心愿</option>
<option value="打卡">打卡</option>
<option value="情绪日记">情绪日记</option>
</select>
<div class="toolbar" style="margin-left:auto" id="batchBtns">
<button class="ghost" onclick="selectAll(true)">全选</button>
<button class="ghost" onclick="selectAll(false)">清空选择</button>
</div>
</div>
<p class="hint">已选择 <b id="selCount">0</b> 条,共 <span id="selTotal">0</span> 条</p>
</section>

<section id="noteList"></section>

<section class="panel">
<div style="font-weight:700;margin-bottom:8px">📋 发给 AI 的指令</div>
<p style="color:var(--fg2);font-size:13px;margin-bottom:12px">点击后复制指令,粘贴给 AI,AI 会把勾选笔记的分类改成目标分类(子分类保持不变),改完给你回执。</p>
<div class="toolbar">
<button class="primary" onclick="adopt()">📋 复制修改指令</button>
</div>
<div id="warnArea"></div>
<pre id="promptOut" style="display:none"></pre>
</section>

<section class="panel">
<strong>数据与日志</strong>
<div class="hint">点复制数据保存当前笔记列表 · 点复制日志用于反馈问题(日志不含隐私内容)</div>
<div class="hm-actions">
<button class="copy ghost" onclick="copyData()">复制数据</button>
<button class="copy ghost" onclick="copyLog()">复制日志</button>
</div>
</section>
</div>

<script id="payload" type="application/json"><!--INJECT-DATA--></script>
<script><!--SHARED-HELPERS--></script>
<script>
(function(){
"use strict";
var raw=document.getElementById("payload");
var payload=null,perr=null;
try{payload=JSON.parse(raw.textContent||"{}");}catch(e){perr=e.message;}
if(perr){document.getElementById("injectError").style.display="block";document.getElementById("injectError").innerHTML=window.errorReceipt({message:"数据解析失败",log:perr,payload:null});return;}
if(!payload||payload.status!=="ok"||!payload.data){document.getElementById("injectError").style.display="block";document.getElementById("injectError").innerHTML=window.errorReceipt({message:(payload&&payload.message)||"数据未注入",retryPrompt:"请重新运行批量改分类(唤醒词:备忘改分类)",payload:null});return;}
window.__hmPayload=payload;
function data(){return payload.data}
function items(){return data().items||[]}

function init(){
  var d=data();
  document.getElementById('title').textContent=d.title||'批量改分类向导';
  document.getElementById('subtitle').textContent='勾选下方笔记 → 复制指令 → 粘贴给 AI 帮你完成改分类';
  var meta=d.meta||{};
  document.getElementById('meta').textContent=`从「${d.from_category||'当前分类'}」改到「${d.to_category||'目标分类'}」 · 生成时间：${d.generated_at||''}`;
  if(d.to_category){
    var sel=document.getElementById('toCatSelect');
    sel.value=d.to_category;
  }
  renderKPIs();renderList();
  // success: 笔记列表已加载,等待用户勾选改分类
}

function renderKPIs(){
  var all=items();
  var withSub=all.filter(w=>w.sub_category).length;
  document.getElementById('kpis').innerHTML=[
    ['待处理笔记',all.length,'勾选要移动的'],
    ['含子分类',withSub,'随笔记一起移动'],
  ].map(x=>`<div class="stat"><b>${x[1]}</b><span>${x[0]}</span><div style="color:var(--fg3);font-size:12px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(x[2])}</div></div>`).join('');
}

function renderList(){
  var list=document.getElementById('noteList');
  document.getElementById('batchBtns').style.display=items().length>1?'flex':'none';
  if(!items().length){list.innerHTML='<div class="panel">'+window.emptyState({icon:'🗂',text:'原分类下没有笔记',hint:'换个原分类,或先记一条备忘'})+'</div>';return}
  list.innerHTML=items().map(renderNote).join('');
  items().forEach(function(w){
    var cb=document.getElementById('cb_'+w.id);
    if(cb) cb.addEventListener('change',function(e){document.getElementById('note_'+w.id).classList.toggle('off',!e.target.checked);updateSelCount();});
  });
  document.getElementById('selTotal').textContent=items().length;
  updateSelCount();
}

function updateSelCount(){
  var checked=items().filter(function(w){
    var cb=document.getElementById('cb_'+w.id);
    return cb&&cb.checked;
  }).length;
  document.getElementById('selCount').textContent=checked;
}

function renderNote(w){
  var cls=w.selected?'':'off';
  var checked=w.selected?'checked':'';
  return `<article class="note ${cls}" id="note_${w.id}">
<div class="note-head">
<input type="checkbox" id="cb_${w.id}" ${checked} data-id="${w.id}" />
<span class="note-id">#${esc(w.id)}</span>
<span class="note-content">${esc(w.content)}</span>
</div>
<div class="note-meta">
${w.sub_category?`<span class="badge">${esc(w.sub_category)}</span>`:''}
${w.media_path?`<span class="badge ok">有附件</span>`:''}
${w.due?`<span class="badge warn">排期 ${esc(w.due)}</span>`:''}
</div>
</article>`;
}

function selectAll(on){
  items().forEach(function(w){
    var cb=document.getElementById('cb_'+w.id);
    if(cb){cb.checked=on;document.getElementById('note_'+w.id).classList.toggle('off',!on)}
  });
}

function selectedRows(){
  var targetCat=document.getElementById('toCatSelect').value;
  var rows=[];
  items().forEach(function(w){
    var cb=document.getElementById('cb_'+w.id);
    if(cb&&cb.checked){
      rows.push({id:w.id,content:w.content,from:data().from_category,to:targetCat});
    }
  });
  return {rows:rows,target:targetCat};
}

function buildPrompt(rows,target,ctx){
  if(!rows.length) return '未选择任何笔记';
  return [
    '① 场景: 我用批量改分类向导,把 '+rows.length+' 条「'+ctx.from_cat+'」笔记改到「'+target+'」',
    '',
    '② 数据(要改分类的笔记):',
    ...rows.map(r=>`   · 笔记 #${r.id} "${r.content}"`),
    '',
    '③ 期望: 请把以上笔记的顶层分类从「'+ctx.from_cat+'」改为「'+target+'」,子分类保持不变;改完给我回执。',
    '',
    '④ 来源: 批量改分类向导 · '+ctx.generated_at,
  ].join('\n');
}

function warnIfAny(rows){
  var notes=[];
  if(rows.length>=10){
    notes.push(`<div class="notice warn">⚠️ 批量改 ${rows.length} 条分类,请确认都是预期操作</div>`);
  }
  var dup=data().target_conflict_count||0;
  if(dup>0){
    notes.push(`<div class="notice warn">ℹ️ ${dup} 条目标分类(${document.getElementById('toCatSelect').value})下已有同名笔记</div>`);
  }
  document.getElementById('warnArea').innerHTML=notes.join('');
}

function adopt(){
  var sel=selectedRows();
  var rows=sel.rows,target=sel.target;
  if(!rows.length){window.toast('未选择任何笔记','勾选要改分类的笔记',{icon:'warn'});return}
  warnIfAny(rows);
  var ctx={
    from_cat:data().from_category||'',
    to_cat:target,
    generated_at:data().generated_at||'',
  };
  var text=buildPrompt(rows,target,ctx);
  var out=document.getElementById('promptOut');
  out.textContent=text;out.style.display='block';
  window.copyText(text,{silent:true});
  window.toast('指令已复制','粘贴发给 AI 即可执行',{icon:'ok'});
}

function copyData(){window.copyText(window.buildDataText(payload),{silent:true});window.toast('数据已复制','人类可读快照 · 可粘贴到笔记存档',{icon:'copy'});}
function copyLog(){window.copyText(window.buildLogText(payload),{silent:true});window.toast('日志已复制','诊断信息 · 有异常时粘贴给开发者排查',{icon:'copy'});}
window.selectAll=selectAll;
window.adopt=adopt;
window.copyData=copyData;
window.copyLog=copyLog;
init();
})();
</script>
</body>
</html>
