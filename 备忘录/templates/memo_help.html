<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>备忘录 · HELP 使用手册</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
.back-to-top{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:40px;height:40px;border:0;border-radius:50%;background:rgba(28,28,30,.78);color:#fff;font-size:18px;cursor:pointer;opacity:0;transform:translateY(8px);transition:opacity .2s,transform .2s;box-shadow:0 6px 16px rgba(0,0,0,.18);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);z-index:9000}
.back-to-top.show{opacity:1;transform:translateY(0)}
.back-to-top:hover{background:rgba(28,28,30,.92)}
:root{--fg:#1d1d1f;--fg2:#6e6e73;--fg3:#86868b;--bg:#f5f5f7;--card:#fff;--line:#d2d2d7;--blue:#007aff;--blue2:#0a63ce;--soft:#f5f8ff;--warn:#ff9500;--ok:#34c759;--err:#ff3b30;--shadow:0 1px 2px rgba(0,0,0,.04),0 12px 36px rgba(0,0,0,.06)}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--fg);line-height:1.65;-webkit-font-smoothing:antialiased}
.wrap{max-width:980px;margin:0 auto;padding:48px 22px 90px}
.hero{background:linear-gradient(180deg,#fff 0%,#f8fbff 100%);border-radius:28px;padding:34px;margin-bottom:24px;box-shadow:var(--shadow)}
.eyebrow{font-size:13px;color:var(--blue);font-weight:800;letter-spacing:.08em;text-transform:uppercase;margin-bottom:10px}
h1{font-size:38px;line-height:1.15;letter-spacing:-.035em;margin-bottom:12px}
.lead{color:var(--fg2);font-size:17px}
.meta{margin-top:16px;color:var(--fg3);font-size:13px}
.panel{background:var(--card);border-radius:20px;padding:18px;box-shadow:0 1px 3px rgba(0,0,0,.04);margin-bottom:18px}

/* ===== Level 1:功能模块(可折叠,默认折叠) ===== */
.module{background:var(--card);border-radius:20px;box-shadow:0 1px 3px rgba(0,0,0,.04);margin-bottom:14px;overflow:hidden}
.module>summary{padding:18px 22px;cursor:pointer;font-size:15px;font-weight:700;color:var(--fg);user-select:none;display:flex;align-items:center;gap:10px;transition:background .15s;list-style:none}
.module>summary::-webkit-details-marker{display:none}
.module>summary::before{content:"▶";display:inline-block;font-size:10px;color:var(--fg3);transition:transform .15s;flex-shrink:0}
.module[open]>summary::before{transform:rotate(90deg);color:var(--blue)}
.module>summary:hover{background:var(--soft)}
.module>summary:hover::before{color:var(--blue)}
.module-body{padding:0 22px 18px}

/* ===== Level 2:场景卡片 ===== */
.scenario{background:var(--bg);border-radius:14px;padding:16px 18px;margin-bottom:10px;border:1px solid var(--line)}
.scenario:last-child{margin-bottom:0}
.scenario-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.chip{display:inline-block;background:var(--soft);color:var(--blue2);padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700;flex-shrink:0}
.title{font-size:16px;font-weight:600;flex:1;min-width:200px}
.copy-btn{border:0;background:var(--blue);color:#fff;border-radius:999px;padding:8px 14px;font-size:13px;cursor:pointer;white-space:nowrap;flex-shrink:0}
.copy-btn:hover{background:var(--blue2)}
.copy-btn.copied{background:var(--ok)}

/* ===== Level 2:子功能(4 级架构 #34) ===== */
.sub-module{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden}
.sub-module>summary{padding:12px 16px;cursor:pointer;font-size:14px;font-weight:600;color:var(--fg2);user-select:none;list-style:none;display:flex;align-items:center;gap:8px;transition:background .15s}
.sub-module>summary::-webkit-details-marker{display:none}
.sub-module>summary::before{content:"▸";font-size:10px;color:var(--fg3);transition:transform .15s;flex-shrink:0}
.sub-module[open]>summary::before{transform:rotate(90deg);color:var(--blue)}
.sub-module>summary:hover{background:var(--soft)}
.sub-module .module-body{padding:10px 12px 12px}

/* ===== Level 4:详情子块(#34) ===== */
.detail-body{padding-top:2px}
.deps-box{background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:10px 14px;margin-top:10px}
.deps-title{font-size:12px;font-weight:700;color:var(--fg3);letter-spacing:.05em;margin-bottom:6px}
.deps-list{margin:0;padding-left:18px}
.deps-list li{font-size:13px;color:var(--fg2);margin-bottom:3px;line-height:1.55}

/* ===== Level 3:场景细节(可折叠,默认折叠) ===== */
.details{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
.details summary{cursor:pointer;font-size:13px;color:var(--fg2);user-select:none;padding:4px 0;list-style:none;display:flex;align-items:center;gap:6px}
.details summary::-webkit-details-marker{display:none}
.details summary::before{content:"▸";font-size:10px;color:var(--fg3);transition:transform .15s}
.details[open] summary::before{transform:rotate(90deg);color:var(--blue)}
.details summary:hover{color:var(--blue)}
.dim{color:var(--fg2);font-size:13.5px;margin:8px 0;padding-left:14px;border-left:3px solid var(--line)}
.dim b{color:var(--fg3);font-size:12px;text-transform:uppercase;letter-spacing:.05em}
.prompt-box{background:#1d1d1d;color:#f5f5f7;border-radius:14px;padding:14px 16px;margin-top:8px;white-space:pre-wrap;font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:13px;line-height:1.7}
.result-box{background:var(--soft);color:var(--fg);border-radius:14px;padding:12px 14px;margin-top:8px;white-space:pre-wrap;font-size:13.5px}

.empty{text-align:center;color:var(--fg2);padding:60px 20px}
.state-banner{display:none;padding:18px;border-radius:14px;margin-bottom:18px;text-align:center;font-weight:600}
.state-banner.success{background:#e8f7e8;color:#1a7a3a}
.state-banner.empty{background:#fff7e8;color:#b25b00}
.state-banner.missing{background:#fde8e8;color:#c7254e}
.state-banner.error{background:#fde8e8;color:#c7254e}

/* === TOAST(学习卡路里 help_center · iOS 通知风格) === */
.toast{position:fixed;left:50%;bottom:32px;transform:translateX(-50%) scale(.9);opacity:0;background:rgba(28,28,30,.94);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);color:#f0f0f0;border-radius:14px;padding:13px 14px 13px 16px;display:flex;align-items:flex-start;gap:12px;max-width:480px;min-width:320px;box-shadow:0 10px 32px rgba(0,0,0,.32),0 0 0 .5px rgba(255,255,255,.08) inset;pointer-events:none;transition:opacity .22s ease-out,transform .22s cubic-bezier(.34,1.56,.64,1);z-index:9999}
.toast.show{opacity:1;transform:translateX(-50%) scale(1);pointer-events:auto}
.toast-icon{font-size:22px;line-height:1;padding-top:1px;flex-shrink:0}
.toast-body{flex:1;min-width:0}
.toast-title{font-weight:600;font-size:13px;line-height:1.4;color:#fff;margin-bottom:3px}
.toast-title em{font-style:normal;color:#34c759;font-weight:600}
.toast-detail{font-size:11.5px;line-height:1.55;color:#c8c8cc}
.toast-close{background:rgba(255,255,255,.10);color:#34c759;border:0;border-radius:8px;padding:6px 10px;font-size:11px;font-weight:500;font-family:inherit;cursor:pointer;white-space:nowrap;margin-left:6px;flex-shrink:0;transition:background .12s}
.toast-close:hover{background:rgba(255,255,255,.18)}
.toast-close:active{transform:scale(.96)}

@media(max-width:800px){.wrap{padding:28px 14px 70px}.hero{padding:26px 20px}h1{font-size:30px}.scenario-head{flex-direction:column;align-items:stretch}.copy-btn{width:100%}.module-body{padding:0 16px 16px}.module>summary{padding:16px 18px}.toast{left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0));transform:translateX(0) scale(.95);max-width:none;min-width:0;padding:12px 12px 12px 14px}.toast.show{transform:translateX(0) scale(1)}.toast-icon{font-size:20px}.toast-title{font-size:12.5px}.toast-detail{font-size:11px}body{padding-bottom:env(safe-area-inset-bottom,0)}}
</style>
<!--INJECT-SHARED-->
</head>
<body>
<div class="wrap">
<header class="hero">
<div class="eyebrow">Memo Help</div>
<h1>备忘录 · 使用手册</h1>
<p class="lead">所有业务唤醒词的场景清单。每个场景可一键复制 prompt 给 AI。</p>
<p class="meta" id="meta"></p>
</header>

<!-- 4 状态 fallback(§07 §5 · B.9 决策:success/empty/missing_data/error) -->
<div id="stateSuccess" class="state-banner success" style="display:none;">✓ 场景已加载</div>
<div id="stateEmpty"   class="state-banner empty"   style="display:none;">📭 暂无场景(场景资产为空)</div>
<div id="stateMissing" class="state-banner missing" style="display:none;">⚠️ 场景资产缺失,请联系维护者</div>
<div id="stateError"   class="state-banner error"   style="display:none;">❌ 加载失败,请重试</div>

<main id="bodyContent">
<!-- 由 JS 按模块-场景两层折叠渲染 -->
</main>

<footer class="panel">
<p style="font-size:13.5px;color:var(--fg2)">
本页面由场景资产自动生成,改场景后重新运行 HELP 命令即可刷新。
所有 prompt 都已剥离 CLI / 数据库 / 文件路径,纯用户意图,可直接发给 AI。
</p>
</footer>
</div>

<!-- 回到顶部按钮 -->
<button class="back-to-top" id="backToTop" type="button" aria-label="回到顶部">↑</button>

<!-- Toast(学习卡路里 help_center · iOS 通知风格 · 复制 prompt 后浮层提示) -->
<div id="toast" class="toast" role="status" aria-live="polite">
  <div class="toast-icon">📋</div>
  <div class="toast-body">
    <div class="toast-title">已复制 <em id="toastWake">prompt</em></div>
    <div class="toast-detail">粘贴给 AI(微信/飞书/任何 AI 工具),备忘录技能会自动执行这个流程,完成后你会在飞书收到 HTML</div>
  </div>
  <button class="toast-close" id="toastClose">✓ 知道了</button>
</div>

<!-- ===== 占位符 - 由 injector 替换为 window.__DATA__ ===== -->
<!--INJECT-DATA-->

<script>
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function showState(name){
  ['Success','Empty','Missing','Error'].forEach(function(s){var el=document.getElementById('state'+s);if(el)el.style.display='none'});
  if(name){var el=document.getElementById('state'+name);if(el)el.style.display='block'}
}

try{
  if(typeof window.__DATA__!=='object'||window.__DATA__===null){showState('Error');throw new Error('数据未注入')}
  var data=window.__DATA__;
  var payload=data.data||{};
  document.getElementById('meta').textContent='版本 '+(payload.version||'?')+' · 生成时间 '+(payload.generated_at||'');

  if(!Array.isArray(payload.scenarios)||payload.scenarios.length===0){showState('Empty')}
  else{
    var scenarios=payload.scenarios;
    var validScenarios=scenarios.filter(function(s){
      return s.wake_word&&s.scenario_id&&s.scenario_title&&s.dimensions&&s.prompt&&s.status!==undefined&&s.result!==undefined;
    });
    if(validScenarios.length===0){showState('Missing');throw new Error('所有场景均缺必填字段')}

    // 分组(#31 Q2:#33 落地 · categories 列表来自 scenarios.yaml,渲染只读不硬编码)
    var categories=Array.isArray(payload.categories)?payload.categories:[];
    var catKeys={};
    var catName={};var catIcon={};
    categories.forEach(function(c){catKeys[c.key]=[];catName[c.key]=c.name||c.key;catIcon[c.key]=c.icon||''});
    validScenarios.forEach(function(s){
      var k=s.category;
      if(!(k in catKeys)){if(!('?' in catKeys)){catKeys['?']=[];catName['?']='未分类';catIcon['?']=''};k='?'}
      catKeys[k].push(s);
    });

    // 渲染 Level 1:分类(默认折叠) + Level 2:子功能 + Level 3:场景 + Level 4:详情
    var main=document.getElementById('bodyContent');
    main.innerHTML='';
    var rendered=0;
    // 分类顺序 = categories 列表书写序;未分类兜底最后
    var orderedKeys=categories.map(function(c){return c.key}).concat(Object.keys(catKeys).filter(function(k){return !(categories.some(function(c){return c.key===k}))}));
    orderedKeys.forEach(function(k){
      var items=catKeys[k];
      if(!items||items.length===0)return;
      // Level 1:分类
      var cat=document.createElement('details');cat.className='module';
      var catSum=document.createElement('summary');catSum.textContent=(catIcon[k]?catIcon[k]+' ':'')+catName[k]+' ('+items.length+')';
      cat.appendChild(catSum);
      var catBody=document.createElement('div');catBody.className='module-body';
      // Level 2:子功能分组(subfunction 空 →「基础」兜底 · #31 Q3)
      var subGroups={};
      items.forEach(function(s){var sub=s.subfunction||'基础';(subGroups[sub]=subGroups[sub]||[]).push(s)});
      Object.keys(subGroups).forEach(function(sub){
        var subEl=document.createElement('details');subEl.className='sub-module';
        var subSum=document.createElement('summary');subSum.textContent=sub+' ('+subGroups[sub].length+')';
        subEl.appendChild(subSum);
        var subBody=document.createElement('div');subBody.className='module-body';
        // Level 3:场景卡片(组内序 = 书写序 · #31 Q4)
        subGroups[sub].forEach(function(s){subBody.appendChild(buildScenarioCard(s))});
        subEl.appendChild(subBody);
        catBody.appendChild(subEl);
      });
      cat.appendChild(catBody);
      main.appendChild(cat);
      rendered+=items.length;
    });
    if(rendered>0){showState('Success')}else{showState('Missing')}
  }
}catch(err){
  console.error('渲染失败:',err);
  showState('Error');
}

// ===== Level 2:场景卡片 =====
function buildScenarioCard(s){
  var card=document.createElement('article');card.className='scenario';

  // 头部:chip + title + 复制按钮(复制按钮在末尾 · 总是可见)
  var head=document.createElement('div');head.className='scenario-head';
  var chip=document.createElement('span');chip.className='chip';chip.textContent=s.wake_word;
  var title=document.createElement('div');title.className='title';title.textContent=s.scenario_title;
  var btn=document.createElement('button');btn.className='copy-btn';btn.textContent='📋 复制 prompt';
  btn.onclick=function(){copyPrompt(s,btn)};
  head.appendChild(chip);head.appendChild(title);head.appendChild(btn);
  card.appendChild(head);

  // Level 4:详情子折叠(各 detail 独立折叠 · 4 级架构)
  var details=document.createElement('details');details.className='details';
  var sum=document.createElement('summary');sum.textContent='查看详情 · 维度 / prompt / 预期结果';
  details.appendChild(sum);
  var detailBody=document.createElement('div');detailBody.className='detail-body';

  // 维度(dim 本身作为子块,不再直接铺)
  var dimBlock=document.createElement('div');dimBlock.className='dim';
  Object.keys(s.dimensions||{}).forEach(function(k){
    dimBlock.innerHTML+='<b>'+esc(k)+'</b>: '+esc(s.dimensions[k])+'<br>';
  });
  if(dimBlock.innerHTML)detailBody.appendChild(dimBlock);

  // prompt
  var promptBox=document.createElement('pre');promptBox.className='prompt-box';promptBox.textContent=(s.prompt||'').trim();
  detailBody.appendChild(promptBox);

  // result
  var resultBox=document.createElement('pre');resultBox.className='result-box';resultBox.textContent='预期: '+(s.result||'').trim();
  detailBody.appendChild(resultBox);

  // dependencies 依赖清单(#32 决议 · 可选字段 · 渲染为圆点列表)
  if(s.dependencies&&String(s.dependencies).trim()){
    var depBox=document.createElement('div');depBox.className='deps-box';
    var depTitle=document.createElement('div');depTitle.className='deps-title';depTitle.textContent='环境依赖';
    depBox.appendChild(depTitle);
    var depList=document.createElement('ul');depList.className='deps-list';
    String(s.dependencies).split('\n').forEach(function(line){
      line=line.trim();if(!line)return;
      var li=document.createElement('li');li.textContent=line;
      depList.appendChild(li);
    });
    depBox.appendChild(depList);
    detailBody.appendChild(depBox);
  }

  details.appendChild(detailBody);
  card.appendChild(details);

  // 【待开发】标记(§07 §4)
  if(s.status==='【待开发】'){
    var warn=document.createElement('div');warn.style.cssText='margin-top:10px;padding:8px 12px;background:#fff7e8;color:#b25b00;border-radius:10px;font-size:13px;font-weight:700';
    warn.textContent='⚠️ 【待开发】- AI 收到此 prompt 必须停止 + 告知用户,不绕过/不假装/不降级';
    card.appendChild(warn);
  }
  return card;
}

// ===== 复制 prompt(原则 10 · 学习卡路里 help_center · 直接复制纯 prompt 文本) =====
// 第一性:prompt 自含「(唤醒词:XXX)」路由锚点 + 期望效果段,使命 = 让 AI 找到
// SKILL.md 对应流程;复制内容 = prompt 本身,不加【场景】/【唤醒词】/【预期结果】
// 标签(参考卡路里 help_center.js: s.prompt_template 直接复制 · 2026-08-02 拍板)
function copyPrompt(s,btn){
  var text=(s.prompt||'').trim();
  // 提取唤醒词显示在 toast(确认复制对了)
  var wakeLabel=s.wake_word||'prompt';
  if(s.scenario_title)wakeLabel+=' · '+s.scenario_title;
  showToast(wakeLabel);
  var after=function(){
    if(!btn)return;
    var orig=btn.textContent;btn.textContent='✓ 已复制';btn.classList.add('copied');
    setTimeout(function(){btn.textContent=orig;btn.classList.remove('copied')},2000);
  };
  safeWriteText(text).then(function(ok){if(ok){after()}else{fallbackCopy(text);after()}})
}


// ===== Toast 控制器(学习卡路里 help_center · iOS 通知风格) =====
var toastEl=document.getElementById('toast');
var toastWakeEl=document.getElementById('toastWake');
var toastCloseEl=document.getElementById('toastClose');
var toastTimer=null;
function showToast(wake){
  if(toastWakeEl)toastWakeEl.textContent=wake;
  if(toastEl)toastEl.classList.add('show');
  if(toastTimer)clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){if(toastEl)toastEl.classList.remove('show')},4500);
}
if(toastCloseEl){
  toastCloseEl.addEventListener('click',function(){
    if(toastEl)toastEl.classList.remove('show');
    if(toastTimer)clearTimeout(toastTimer);
  });
}

// 回到顶部按钮:滚 200px 后才显示 · 点击平滑回顶
var backBtn=document.getElementById('backToTop');
if(backBtn){
  window.addEventListener('scroll',function(){
    if(window.scrollY>200){backBtn.classList.add('show')}else{backBtn.classList.remove('show')}
  },{passive:true});
  backBtn.addEventListener('click',function(){
    window.scrollTo({top:0,behavior:'smooth'});
  });
}
</script>
</body>
</html>
