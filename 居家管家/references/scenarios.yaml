# 居家管家 v2.0 场景资产(唯一规范事实源 · 总纲 07 §2.1)
#
# 单源架构(G7 决策 · 2026-08-04):
#   - 本文件 = 9 域 59 场景的唯一机器事实源,HELP HTML 与未来 render 映射均由此派生
#   - 权威场景清单:居家管家/.scratch/v2.0-spec-map/scenes/SM1-SM9(规格阶段逐域定稿)
#   - HTML 映射字段(html.*):G7 决策"加模板/command_cn/data_source",合并 render 映射
#   - status 二态(07 §4):"" = 可用(五者就绪);"【待开发】" = 不可执行(至少一项未就绪)
#   - prompt 文案:变体 B 原型定稿(T1 验收:原型 prompt 文案 = 本批定稿)
#   - variants:钩子 3 变体语料(TOP5 核心唤醒词 × 6 变体,迁移自 v1)
#
# status 判定原则(07 §4/§6 五者对应):
#   唤醒词声明(SKILL.md 路由表) + 场景资产 + prompt + 底层工作流 + HELP HTML
#   全部就绪 → "";任一未就绪 → 【待开发】。
#   T1 阶段 SKILL.md 仍为 v1 声明,故仅 v1 已声明且工作流存在的场景标 ""。
#   待开发场景中 8 个(数量变更/状态变更/盘点/管标签/账号/收纳建议/…)
#   底层工作流已存在,待各域实施批次(T2+)更新 SKILL.md 唤醒词后转可用。
