version: '2.0'
domain: receipt
scenes:
- id: SM6-1
  domain: receipt
  sub: 购买记录
  wake_word: 查购买记录
  scenario_id: purchase_list_all
  scenario_title: 查购买记录(全量/按物品/按时间)
  dimensions: {}
  type: 查看+回执
  status: ''
  prompt: "请加载「居家管家」技能,帮我查购买记录(唤醒词:查购买记录):\n\n  物  品: _____________ (选填,不填按时间浏览)\n\
    \  时  间: _____________ (选填,如:上个月)"
  result: 购买记录清单(日期/价格/渠道/退货窗口),可按物品或时间筛选。
  html:
    template: 票据凭证/purchase_records.html
    command_cn: 查购买记录
    data_source: receipt
- id: SM6-2
  domain: receipt
  sub: 购买记录
  wake_word: 查上月购买
  scenario_id: purchase_last_month
  scenario_title: 查上月购买(时间预填)
  dimensions: {}
  type: 查看+回执
  status: ''
  prompt: "请加载「居家管家」技能,帮我查上个月的购买记录(唤醒词:查上月购买):\n\n  月  份(预填上个月,可改): 2026-07"
  result: 上月购买清单(日期/价格/渠道),时间预填零填写。
  html:
    template: 票据凭证/purchase_records.html
    command_cn: 查上月购买
    data_source: receipt
- id: SM6-3
  domain: receipt
