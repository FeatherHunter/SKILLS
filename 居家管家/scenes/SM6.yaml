  scenario_title: 查退货窗口(物品必填)
  dimensions: {}
  type: 查看+回执
  status: ''
  prompt: "请加载「居家管家」技能,帮我查退货窗口(唤醒词:查退货窗口):\n\n  物  品: _____________"
  result: 指定物品的购买信息 + 退货截止日(购买日 + 退货窗口天数)。
  html:
    template: 票据凭证/purchase_records.html
    command_cn: 查退货窗口
    data_source: receipt
- id: SM6-5
  domain: receipt
