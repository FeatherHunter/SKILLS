  wake_word: 登记购买记录
  scenario_id: purchase_add
  scenario_title: 登记购买记录(录入)
  dimensions: {}
  type: 采集+回执
  status: ''
  prompt: "请加载「居家管家」技能,帮我登记一条购买记录(唤醒词:登记购买记录):\n\n  物  品: _____________\n  购买日期(YYYY-MM-DD):\
    \ _____________\n  价  格(选填): _____________\n  渠  道(选填,如:京东): _____________\n \
    \ 商家客服(选填): _____________\n  退货窗口(天,选填,默认 7): _____________\n  【票据照片即将发送:】"
  result: 购买记录已登记(日期/价格/渠道/退货窗口)。
