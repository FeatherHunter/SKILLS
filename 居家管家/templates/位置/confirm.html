<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>居家管家 · 操作确认</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--fg:#1d1d1f;--fg2:#6e6e73;--fg3:#86868b;--bg:#f5f5f7;--card:#fff;--line:#d2d2d7;--blue:#007aff;--green:#34c759;--orange:#ff9500;--red:#ff3b30;--shadow:0 1px 2px rgba(0,0,0,.04),0 12px 36px rgba(0,0,0,.06)}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--fg);line-height:1.65;-webkit-font-smoothing:antialiased}
.wrap{max-width:680px;margin:0 auto;padding:40px 22px 90px}
.hero{background:linear-gradient(180deg,#fff,#fffbf5);border-radius:24px;padding:26px 28px;box-shadow:var(--shadow);margin-bottom:16px}
.eyebrow{color:var(--orange);font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px}
h1{font-size:26px;letter-spacing:-.03em;line-height:1.2;margin-bottom:8px}
.lead{color:var(--fg2);font-size:15px}
.stage{display:inline-block;background:#fff3e0;color:var(--orange);border-radius:99px;padding:3px 12px;font-size:11px;font-weight:800;margin-top:10px}
section{background:var(--card);border-radius:18px;padding:20px 22px;box-shadow:0 1px 3px rgba(0,0,0,.04);margin-bottom:14px}
section h2{font-size:15px;margin-bottom:12px}
.kv{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid #f0f0f3;font-size:13px}
.kv:last-child{border-bottom:none}
.kv b{flex:none;min-width:88px;color:var(--fg3);font-weight:600}
.kv span{word-break:break-all}
.flow{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.pchip{background:#f5f7fa;border:1px solid #e4e8ee;border-radius:99px;padding:3px 10px;font-size:12px;color:var(--fg2);word-break:break-all}
.danger{background:#fff5f5;border:1px solid #ffd6d6;border-radius:14px;padding:12px 16px;font-size:13px;color:#c0392b;margin-top:10px}
.actions{display:flex;gap:10px;justify-content:center;margin-top:18px;flex-wrap:wrap;position:sticky;bottom:14px}
.btn{border:none;border-radius:999px;padding:11px 22px;font-weight:700;cursor:pointer;font-size:13px;background:var(--blue);color:#fff;box-shadow:var(--shadow)}
.btn.ghost{background:#fff;color:var(--fg);border:1px solid var(--line);box-shadow:none}
.btn.danger{background:var(--red)}
.btn.copied{background:#34c759}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;background:#1d1d1f;color:#fff;padding:10px 20px;border-radius:99px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:99}
.toast.show{opacity:1}
@media(max-width:720px){.wrap{padding:24px 14px 80px}.hero{padding:20px}h1{font-size:22px}.actions{position:static}}
</style>
</head>
<body>
<div class="wrap">
<header class="hero">
<div class="eyebrow" id="eyebrow"></div>
<h1 id="title">确认操作</h1>
<p class="lead" id="subtitle"></p>
<span class="stage">确认</span>
</header>
<div id="app"></div>
<div class="actions" id="actions"></div>
</div>
<div class="toast" id="toast"></div>
<script id="payload" type="application/json"><!--INJECT-DATA--></script>
<script>
<!--SHARED-HELPERS-->
let D=null,META={};
let _toastTimer=null;
function showToast(msg){const t=document.getElementById('toast');t.innerHTML='<span style="color:#30d158;margin-right:6px">✓</span>'+msg;t.classList.add('show');clearTimeout(_toastTimer);_toastTimer=setTimeout(()=>t.classList.remove('show'),2200);}
function doCopy(text,btn,msg){
  const done=()=>{if(btn){btn.classList.add('copied');const old=btn.textContent;btn.textContent='✓ 已复制';setTimeout(()=>{btn.classList.remove('copied');btn.textContent=old;},1600);}showToast(msg);};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(done).catch(()=>{const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();done();});}
  else{const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();done();}
}
function modeInfo(){
  const m=D.mode;
  if(m==='rename')return {title:'位置改名确认',action:'改名',exec:'请加载「居家管家」技能,帮我管理位置体系(唤醒词:管位置):\n  操  作: 改名\n  详  情: 「'+esc(D.old)+'」改名为「'+esc(D.new)+'」',desc:'「'+esc(D.old)+'」→「'+esc(D.new)+'」,改名影响所有该位置及下级物品'};
  if(m==='merge')return {title:'位置合并确认',action:'合并',exec:'请加载「居家管家」技能,帮我管理位置体系(唤醒词:管位置):\n  操  作: 合并\n  详  情: 把「'+esc(D.src||D.old)+'」合并到「'+esc(D.tgt||D.new)+'」',desc:'「'+esc(D.src||D.old)+'」→「'+esc(D.tgt||D.new)+'」,物品随路径迁移'};
  return {title:'删除位置确认',action:'删除',exec:'请加载「居家管家」技能,帮我管理位置体系(唤醒词:管位置):\n  操  作: 删除\n  详  情: 删除「'+esc(D.path)+'」',desc:'删除「'+esc(D.path)+'」'};
}
function render(){
  let p;try{p=JSON.parse(document.getElementById('payload').textContent)}catch(e){document.getElementById('app').innerHTML='<section>数据解析失败:'+esc(e.message)+'</section>';return;}
  const v=validate(p);if(!v.ok){document.getElementById('app').innerHTML='<section>数据校验失败:'+esc(v.msg)+'</section>';return;}
  const _d=p.data||{};D=_d.scene||{};META=_d.meta||{};
  const mi=modeInfo();
  document.getElementById('eyebrow').textContent=(META.command_cn||'')+' · 唤醒词「'+(META.wake_word||'')+'」 · '+(META.occurred_at||'');
  document.getElementById('title').textContent=mi.title;
  document.getElementById('subtitle').textContent=mi.desc;
  const app=document.getElementById('app');
  let html='<section><h2>影响预览</h2><div class="kv"><b>操作</b><span>'+esc(mi.action)+'</span></div>';
  if(D.old&&D.new)html+='<div class="kv"><b>路径</b><span>'+esc(D.old)+' → <b style="color:var(--green)">'+esc(D.new)+'</b></span></div>';
  if(D.path)html+='<div class="kv"><b>路径</b><span>'+esc(D.path)+'</span></div>';
  html+='<div class="kv"><b>涉及物品</b><span>'+esc(D.items_affected||0)+' 件</span></div>';
  if(D.fixed_affected!==undefined)html+='<div class="kv"><b>固定位引用</b><span>'+esc(D.fixed_affected)+' 件</span></div>';
  if(arr(D.paths).length){html+='<div class="kv"><b>受影响路径</b><span class="flow">'+arr(D.paths).slice(0,10).map(x=>'<span class="pchip">'+esc(x)+'</span>').join('')+(arr(D.paths).length>10?'<span class="pchip">…共 '+esc(arr(D.paths).length)+' 条</span>':'')+'</span></div>';}
  if(D.mode==='delete'&&D.items_affected>0)html+='<div class="danger">⚠️ 该位置下还有物品,删除会被拦截 —— 请先移物品,或改用「改名/合并」</div>';
  html+='</section>';
  app.innerHTML=html;
  const acts=document.getElementById('actions');
  let btns='<button class="btn" id="execBtn">✅ 确认'+esc(mi.action)+'</button><button class="btn ghost" id="fixBtn">✏️ 修正参数</button><button class="btn ghost" id="copyDataBtn">📋 复制数据</button><button class="btn ghost" id="copyLogBtn">📋 复制日志</button>';
  acts.innerHTML=btns;
  document.getElementById('execBtn').onclick=()=>doCopy(mi.exec,document.getElementById('execBtn'),'确认 prompt 已复制,发给 AI');
  document.getElementById('fixBtn').onclick=()=>doCopy('请加载「居家管家」技能,帮我管理位置体系(唤醒词:管位置):\n  操  作: '+(D.mode==='rename'?'改名':D.mode==='merge'?'合并':'删除')+'\n  详  情: _____________(修正后重发)','fixBtn','修正 prompt 已复制');
  const cd=D.copy_data||{},cl=D.copy_log||{};
  document.getElementById('copyDataBtn').onclick=()=>doCopy(JSON.stringify(cd,null,2),document.getElementById('copyDataBtn'),'数据已复制');
  document.getElementById('copyLogBtn').onclick=()=>doCopy(JSON.stringify(cl,null,2),document.getElementById('copyLogBtn'),'日志已复制');
}
render();
</script>
</body>
</html>
