<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>居家管家 · 收纳建议</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--fg:#1d1d1f;--fg2:#6e6e73;--fg3:#86868b;--bg:#f5f5f7;--card:#fff;--line:#d2d2d7;--blue:#007aff;--green:#34c759;--orange:#ff9500;--red:#ff3b30;--shadow:0 1px 2px rgba(0,0,0,.04),0 12px 36px rgba(0,0,0,.06)}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--fg);line-height:1.65;-webkit-font-smoothing:antialiased}
.wrap{max-width:1080px;margin:0 auto;padding:40px 22px 90px}
.hero{background:linear-gradient(180deg,#fff,#f8fbff);border-radius:24px;padding:26px 28px;box-shadow:var(--shadow);margin-bottom:16px}
.eyebrow{color:var(--blue);font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px}
h1{font-size:30px;letter-spacing:-.035em;line-height:1.15;margin-bottom:8px}
.lead{color:var(--fg2);font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{background:#eef4ff;color:var(--blue);border-radius:99px;padding:3px 10px;font-size:11px;font-weight:700}
section{background:var(--card);border-radius:18px;padding:20px 22px;box-shadow:0 1px 3px rgba(0,0,0,.04);margin-bottom:14px}
section h2{font-size:15px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
section h2 .hint{font-size:11px;color:var(--fg3);font-weight:400}
.rec{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:12px}
.rec .main{flex:1 1 300px;background:linear-gradient(180deg,#f0f7ff,#fff);border:1px solid #cfe0ff;border-radius:16px;padding:16px}
.rec .main .tag{display:inline-block;background:var(--blue);color:#fff;border-radius:99px;padding:2px 10px;font-size:11px;font-weight:800;margin-bottom:8px}
.rec .main .loc{font-size:20px;font-weight:800;letter-spacing:-.02em}
.rec .main .why{color:var(--fg2);font-size:12px;margin-top:6px}
.rec .alt{flex:1 1 200px;border:1px dashed var(--line);border-radius:16px;padding:14px}
.rec .alt h4{font-size:12px;color:var(--fg3);margin-bottom:8px}
.rec .alt .altrow{font-size:13px;padding:4px 0;border-bottom:1px solid #f0f0f3}
.rec .alt .altrow:last-child{border-bottom:none}
.meta2{font-size:12px;color:var(--fg3);margin-bottom:12px}
.meta2 b{color:var(--fg2)}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.btn{border:none;border-radius:999px;padding:9px 16px;font-weight:700;cursor:pointer;font-size:12px;background:var(--blue);color:#fff;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.btn.ghost{background:#fff;color:var(--fg);border:1px solid var(--line);box-shadow:none}
.btn.warn{background:var(--orange)}
.btn.danger{background:var(--red)}
.btn.copied{background:#34c759}
.tip{background:#fff8e6;border:1px solid #f5d98f;color:#8a6d1a;border-radius:14px;padding:12px 16px;font-size:13px;margin-bottom:14px}
.tip button{margin-left:8px}
.empty{background:var(--card);border-radius:18px;padding:36px 20px;text-align:center;color:var(--fg3)}
.empty h2{font-size:18px;color:var(--fg);margin-bottom:6px}
.actions{display:flex;gap:10px;justify-content:center;margin-top:18px;flex-wrap:wrap;position:sticky;bottom:14px}
.btn.big{background:var(--blue);color:#fff;box-shadow:var(--shadow)}
.btn.ghost.big{background:#fff;color:var(--fg);border:1px solid var(--line);box-shadow:none}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;background:#1d1d1f;color:#fff;padding:10px 20px;border-radius:99px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:99}
.toast.show{opacity:1}
@media(max-width:720px){.wrap{padding:24px 14px 80px}.hero{padding:20px}h1{font-size:24px}.actions{position:static}.rec .alt{flex-basis:100%}}
</style>
</head>
<body>
<div class="wrap">
<header class="hero">
<div class="eyebrow" id="eyebrow"></div>
<h1 id="title">收纳位置建议</h1>
<p class="lead" id="subtitle"></p>
<div class="chips" id="metaBar"></div>
</header>
<div id="app"></div>
<div class="actions">
<button class="btn big" id="batchBtn" style="display:none">🔍 找没固定位的常用件</button>
<button class="btn ghost big" id="copyDataBtn">📋 复制数据</button>
<button class="btn ghost big" id="copyLogBtn">📋 复制日志</button>
</div>
</div>
<div class="toast" id="toast"></div>
<script id="payload" type="application/json"><!--INJECT-DATA--></script>
<script>
<!--SHARED-HELPERS-->
let D=null,META={};
let _toastTimer=null;
function showToast(msg){const t=document.getElementById('toast');t.innerHTML='<span style="color:#30d158;margin-right:6px">✓</span>'+msg;t.classList.add('show');clearTimeout(_toastTimer);_toastTimer=setTimeout(()=>t.classList.remove('show'),2200);}
function doCopy(text,btn,msg){
  const done=()=>{if(btn){btn.classList.add('copied');const old=btn.textContent;btn.textContent='✓ 已复制';setTimeout(()=>{btn.classList.remove('copied');btn.textContent=old;},1600);}showToast(msg);};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(done).catch(()=>{const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();done();});}
  else{const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();done();}
}
function adoptPrompt(rec){
  const it=rec.item||{};
  const loc=rec.recommend?rec.recommend.location:'';
  let t='请加载「居家管家」技能,帮我移动物品位置(唤醒词:移物品):\n  物  品: '+it.name+(it.id?' (ID '+it.id+')':'')+'\n  新位置: '+loc;
  if(it.current_location)t+='\n  原位置: '+it.current_location;
  return t;
}
function fixedPrompt(rec){
  const it=rec.item||{};
  const loc=rec.recommend?rec.recommend.location:'';
  return '请加载「居家管家」技能,帮我设置固定位(唤醒词:固定位):\n  操  作: 设置\n  物  品: '+it.name+(it.id?' (ID '+it.id+')':'')+'\n  固定位: '+loc;
}
function render(){
  let p;try{p=JSON.parse(document.getElementById('payload').textContent)}catch(e){document.getElementById('app').innerHTML='<div class="empty">数据解析失败:'+esc(e.message)+'</div>';return;}
  const v=validate(p);if(!v.ok){document.getElementById('app').innerHTML='<div class="empty">数据校验失败:'+esc(v.msg)+'</div>';return;}
  D=p.data;META=D.meta||{};
  document.getElementById('eyebrow').textContent=(META.command_cn||'')+' · 唤醒词「'+(META.wake_word||'')+'」 · '+(META.occurred_at||'');
  document.getElementById('subtitle').textContent=D.batch?('没有固定位的常用件 '+esc(D.total||0)+' 件,逐条确认'):'按分类常用位置/关联物品给出 AI 推荐,采纳后跳移物品流程';
  const stage='查看';const chips=[`<span class="chip">⚡ ${esc(META.wake_word||'收纳建议')}</span>`,`<span class="chip">● ${stage}</span>`,`<span class="chip">🕒 ${esc(META.occurred_at||'')}</span>`];
  document.getElementById('metaBar').innerHTML=chips.join('');
  const app=document.getElementById('app');
  const recs=arr(D.recommendations);
  if(!recs.length){
    app.innerHTML='<div class="empty"><h2>'+(D.batch?'🎉 都有固定位了':'没有可建议的物品')+'</h2>'+(D.batch?'没有固定位的常用件已清零':'先录物品或指定物品名(ID)再来')+'</div>';
    renderActions();return;}
  let html='';
  recs.forEach((rec,i)=>{
    const it=rec.item||{};
    const rec2=rec.recommend;
    const keep2=rec.keep;
    html+='<section><h2>'+(D.batch?'📦 '+esc(it.name)+' <span class="hint">'+(it.category_name||'')+(it.current_location?' · 当前 '+esc(it.current_location):'')+'</span>':'💡 建议')+'</h2>';
    if(!D.batch)html+='<div class="meta2">物品:<b>'+esc(it.name)+'</b>'+(it.category_name?' · 分类:'+esc(it.category_name):'')+(it.current_location?' · 当前:'+esc(it.current_location):'')+'</div>';
    if(rec2){html+='<div class="rec"><div class="main"><span class="tag">推荐放置</span><div class="loc">'+esc(rec2.location)+'</div><div class="why">'+esc(rec2.reason||'')+'</div><div class="acts"><button class="btn" id="ad_'+i+'">采纳(去移物品)</button>'+(it.fixed_location?'':'<button class="btn warn" id="fx_'+i+'">设为固定位</button>')+'<button class="btn ghost" id="ch_'+i+'">换一个建议</button></div></div>';}
    else if(keep2){html+='<div class="rec"><div class="main" style="border-color:#c8ecd5;background:linear-gradient(180deg,#f2fbf5,#fff)"><span class="tag" style="background:#34c759">✅ 保持现状</span><div class="loc">'+esc(keep2.location)+'</div><div class="why">'+esc(keep2.reason||'')+'</div><div class="acts">'+(it.fixed_location?'':'<button class="btn warn" id="fx_'+i+'">设为固定位</button>')+'</div></div>';}
    else{html+='<div class="rec"><div class="main"><span class="tag" style="background:var(--fg3)">暂无依据</span><div class="loc" style="font-size:15px;color:var(--fg3)">该物品还没有位置记录</div><div class="why">先录位置,或用「空间视图」看全屋布局后手动移入</div></div>';}
    const alts=arr(rec.alternates);
    html+='<div class="alt"><h4>备选位置</h4>'+(alts.length?alts.map(a=>'<div class="altrow">'+esc(a.location)+' <span style="color:var(--fg3)">· '+esc(a.reason||'')+'</span></div>').join(''):'<div class="altrow" style="color:var(--fg3)">暂无其他备选</div>')+'</div></div>';
    html+='</section>';});
  app.innerHTML=html;
  recs.forEach((rec,i)=>{
    const ab=document.getElementById('ad_'+i);
    if(ab){ab.onclick=()=>doCopy(adoptPrompt(rec),ab,'采纳 prompt 已复制,发给 AI');}
    const fb=document.getElementById('fx_'+i);
    if(fb){fb.onclick=()=>doCopy(fixedPrompt(rec),fb,'设固定位 prompt 已复制');}
    const cb=document.getElementById('ch_'+i);
    if(cb){cb.onclick=()=>{const it=rec.item||{};doCopy('请加载「居家管家」技能,帮我推荐收纳位置(唤醒词:收纳建议):\n  物  品: '+it.name+(it.id?' (ID '+it.id+')':'')+'\n  要  求: 换个建议',cb,'换建议 prompt 已复制');};}
  });
  renderActions();
}
function renderActions(){
  const bb=document.getElementById('batchBtn');
  if(bb&&D&&!D.batch){bb.style.display='';bb.onclick=()=>doCopy('请加载「居家管家」技能,帮我推荐收纳位置(唤醒词:收纳建议):\n  物  品: (不填)找没有固定位的常用件',bb,'批量建议 prompt 已复制');}
  const cd=D.copy_data||{},cl=D.copy_log||{};
  document.getElementById('copyDataBtn').onclick=()=>doCopy(JSON.stringify(cd,null,2),document.getElementById('copyDataBtn'),'数据已复制');
  document.getElementById('copyLogBtn').onclick=()=>doCopy(JSON.stringify(cl,null,2),document.getElementById('copyLogBtn'),'日志已复制');
}
render();
</script>
</body>
</html>
