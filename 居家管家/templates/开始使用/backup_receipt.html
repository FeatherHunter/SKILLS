<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>居家管家 · 备份与导出</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--fg:#1d1d1f;--fg2:#6e6e73;--fg3:#86868b;--bg:#f5f5f7;--card:#fff;--line:#d2d2d7;--blue:#007aff;--green:#34c759;--orange:#ff9500;--red:#ff3b30;--soft:#f5f8ff;--shadow:0 1px 2px rgba(0,0,0,.04),0 12px 36px rgba(0,0,0,.06)}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--fg);line-height:1.65;-webkit-font-smoothing:antialiased}
.wrap{max-width:980px;margin:0 auto;padding:56px 22px 90px}
.hero{background:linear-gradient(180deg,#fff,#f8fbff);border-radius:28px;padding:34px;box-shadow:var(--shadow);margin-bottom:18px}
.eyebrow{color:var(--blue);font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px}
h1{font-size:34px;letter-spacing:-.035em;line-height:1.12;margin-bottom:10px}
.lead{color:var(--fg2);font-size:16px;max-width:760px}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:18px 0}
.card{background:var(--card);border-radius:20px;padding:18px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.card b{display:block;font-size:13px;color:var(--fg2);margin-bottom:5px}.card span{font-size:22px;font-weight:750;letter-spacing:-.02em}
section{background:var(--card);border-radius:20px;padding:22px;box-shadow:0 1px 3px rgba(0,0,0,.04);margin:18px 0}
h2{font-size:20px;letter-spacing:-.02em;margin-bottom:12px}
.row{display:grid;grid-template-columns:160px 1fr;gap:12px;padding:10px 0;border-bottom:1px solid #ececf1}.row:last-child{border-bottom:none}.k{color:var(--fg2)}.v{font-weight:600;word-break:break-word}
.hist{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid #ececf1}
.hist:last-child{border-bottom:none}.hist b{flex:1;font-size:14px;word-break:break-all}
.hist .meta{color:var(--fg2);font-size:13px;white-space:nowrap}
.ok{color:var(--green)}.warn{color:var(--orange)}.bad{color:var(--red)}.empty{color:var(--fg3)}
.copy{border:none;background:var(--blue);color:#fff;border-radius:999px;padding:10px 16px;font-weight:700;cursor:pointer;margin:10px 8px 0 0;font-size:14px}
.copy.alt{background:#1d1d1f}.copy.ghost{background:#fff;color:var(--blue);border:1.5px solid var(--blue)}
.copy.danger{background:#fff;color:var(--red);border:1.5px solid var(--red)}
/* ===== 参数表单(采集型 · 预填度 100% 可修改) ===== */
.frm{display:flex;flex-direction:column;gap:8px;margin:14px 0 4px}
.frm label{font-size:13px;font-weight:700;color:var(--fg2)}
.frm input,.frm select{border:1.5px solid var(--line);border-radius:12px;padding:10px 14px;font-size:14.5px;font-family:inherit;background:#fff;color:var(--fg);width:100%;transition:border-color .15s,box-shadow .15s}
.frm input:focus,.frm select:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(0,122,255,.12)}
.prompt-preview{background:#1d1d1f;color:#f5f5f7;border-radius:14px;padding:14px 16px;margin:12px 0 4px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;line-height:1.7;white-space:pre-wrap;word-break:break-word}
/* ===== 按钮布局(08 规范 2026-08-10) ===== */
.actions{margin-top:14px;display:flex;flex-direction:column;gap:8px;align-items:stretch}
.actions .btn-row{display:flex;gap:8px}
.actions .btn-row .copy{flex:1;margin:0;text-align:center;white-space:normal}
/* ===== Toast(「知道了」面板 · 与 help_center 同款) ===== */
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0));transform:translateX(-50%) scale(.9);opacity:0;background:rgba(28,28,30,.94);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);color:#f0f0f0;border-radius:14px;padding:13px 14px 13px 16px;display:flex;align-items:flex-start;gap:12px;max-width:480px;min-width:300px;box-shadow:0 10px 32px rgba(0,0,0,.32),0 0 0 .5px rgba(255,255,255,.08) inset;pointer-events:none;transition:opacity .22s ease-out,transform .22s cubic-bezier(.34,1.56,.64,1);z-index:9999}
.toast.show{opacity:1;transform:translateX(-50%) scale(1);pointer-events:auto}
.toast-icon{font-size:20px;line-height:1;padding-top:1px;flex-shrink:0}
.toast-body{flex:1;min-width:0}
.toast-title{font-weight:600;font-size:12.5px;line-height:1.4;color:#fff;margin-bottom:2px}
.toast-detail{font-size:11px;line-height:1.5;color:#c8c8cc}
.toast-close{background:rgba(255,255,255,.10);color:#34c759;border:0;border-radius:8px;padding:5px 9px;font-size:10.5px;font-weight:500;font-family:inherit;cursor:pointer;white-space:nowrap;margin-left:6px;flex-shrink:0}
.banner{background:#fff8e8;border:1px solid #f0dfae;border-radius:16px;padding:14px 18px;margin:14px 0;font-size:14px;color:#7a5d12}
@media(max-width:820px){.wrap{padding:30px 14px 70px}.hero{padding:26px 20px}h1{font-size:26px}.row{grid-template-columns:1fr}.cards{grid-template-columns:1fr}.toast{left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0));transform:translateX(0) scale(.95);max-width:none;min-width:0}.toast.show{transform:translateX(0) scale(1)}}
</style>
</head>
<body>
<div class="wrap">
<header class="hero">
<div class="eyebrow">Backup · 数据资产安全</div>
<h1 id="title">居家管家 · 备份与导出</h1>
<p class="lead" id="lead">备份 = 数据库+照片全量打包(自动保留 N 份);导出 = 便携格式(JSON/CSV),数据可带走。</p>
</header>
<div id="app"></div>
</div>
<script id="payload" type="application/json"><!--INJECT-DATA--></script>
<div class="toast" id="toast" role="status" aria-live="polite">
  <div class="toast-icon" id="toastIcon">📋</div>
  <div class="toast-body">
    <div class="toast-title" id="toastTitle"></div>
    <div class="toast-detail" id="toastDetail"></div>
  </div>
  <button class="toast-close" id="toastClose">✓ 知道了</button>
</div>
<script>
<!--SHARED-HELPERS-->
var toastTimer=null;
function toastShow(title,detail,icon){
  var tEl=document.getElementById('toastTitle'),dEl=document.getElementById('toastDetail'),iEl=document.getElementById('toastIcon');
  if(tEl)tEl.textContent=title;if(dEl)dEl.textContent=detail;if(iEl)iEl.textContent=icon||'📋';
  var el=document.getElementById('toast');if(!el)return;el.classList.add('show');
  if(toastTimer)clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){el.classList.remove('show')},4500);
}
function fallbackCopy(text){try{var ta=document.createElement('textarea');ta.value=text;ta.style.cssText='position:fixed;left:-9999px;top:0';document.body.appendChild(ta);ta.focus();ta.select();var ok=false;try{ok=document.execCommand('copy')}catch(e){ok=false}document.body.removeChild(ta);return ok}catch(e){return false}}
function safeWriteText(text){if(navigator.clipboard&&navigator.clipboard.writeText){return navigator.clipboard.writeText(text).then(function(){return true}).catch(function(){return fallbackCopy(text)})}return Promise.resolve(fallbackCopy(text))}
function copyThen(text,title,detail){
  safeWriteText(text).then(function(ok){
    if(ok){toastShow(title,detail,'📋');}
    else{toastShow('复制失败','剪贴板不可用,请长按文本手动复制','⚠️');}
  });
}
function copyFormPrompt(fieldId,buildFn,title,detail){
  var el=document.getElementById(fieldId);
  if(!el)return;
  var v=el.value.trim();
  if(!v){toastShow('请填写参数','该参数不能为空,填好后才能复制指令。','⚠️');el.focus();return;}
  copyThen(buildFn(v),title,detail);
}
window.copyFormPrompt=copyFormPrompt;
(function(){var c=document.getElementById('toastClose');if(c)c.addEventListener('click',function(){var el=document.getElementById('toast');if(el)el.classList.remove('show');if(toastTimer)clearTimeout(toastTimer)});})();
var app=document.getElementById('app');
function render(){
var payload;try{payload=JSON.parse(document.getElementById('payload').textContent)}catch(e){app.innerHTML='<section><h2 class="bad">数据解析失败</h2></section>';return}
var v=validate(payload);if(!v.ok){app.innerHTML='<section><h2 class="bad">数据校验失败</h2><p>'+esc(v.msg)+'</p></section>';return}
var d=payload.data||{}, s=d.scene||{}, m=d.meta||{}, cd=d.copy_data||{}, cl=d.copy_log||{};
var err=d.error||{};
if(err.action){app.innerHTML='<section><h2 class="bad">'+esc(err.action)+'失败</h2><p class="bad" style="font-weight:600">'+esc(err.reason||'')+'</p><p>'+esc(err.suggest||'')+'</p></section>';return;}
var back=s.backup||{};
var list=s.history||[];
var keepN=Number(s.keep_n||5);
var daysSince=s.days_since_last;
var banner='';
if(daysSince===null||daysSince===undefined){banner='<div class="banner">💡 首次使用备份功能:点下方「确认备份」建立你的第一份数据备份。</div>';}
else if(daysSince>7){banner='<div class="banner">⏰ 顺路提醒:已 '+daysSince+' 天未备份,建议现在备份一次。</div>';}
var lastBack=back.file?'<div class="row"><div class="k">本次备份</div><div class="v">'+esc(back.file)+'</div></div>'
  +'<div class="row"><div class="k">大小</div><div class="v">'+fmtSize(back.size)+'</div></div>'
  +'<div class="row"><div class="k">时间</div><div class="v">'+esc(back.created_at||'')+'</div></div>':'';
var histHtml=list.length?('<div class="hist"><b>'+esc(list[0].file)+'</b><span class="meta">'+fmtSize(list[0].size)+' · '+esc(list[0].created_at)+'</span></div>'+list.slice(1).map(function(h){
  return '<div class="hist"><b>'+esc(h.file)+'</b><span class="meta">'+fmtSize(h.size)+' · '+esc(h.created_at)+'</span></div>';
}).join('')):'<p class="empty">暂无备份记录</p>';
var keepOpts=[3,5,10];
var keepSel='<div class="frm"><label for="frmKeep">保留份数(默认 '+keepN+')</label><select id="frmKeep">'+keepOpts.map(function(n){return '<option value="'+n+'"'+(n===keepN?' selected':'')+'>'+n+' 份</option>'}).join('')+'</select></div>';
var backBtn='<div class="btn-row"><button class="copy" onclick="copyFormPrompt(\'frmKeep\',function(n){return \'请加载「居家管家」技能,帮我备份导出数据(唤醒词:备份导出):\\n\\n  操  作: 备份\\n  保留份数: \'+n+\' 份\'},\'备份指令已复制\',\'粘贴给 AI 即可执行全量备份。\')">确认备份(复制指令)</button></div>';
var expJson='<div class="btn-row"><button class="copy ghost" onclick="copyThen(\'请加载「居家管家」技能,帮我备份导出数据(唤醒词:备份导出):\\n\\n  操  作: 导出\\n  格  式: JSON\',\'导出指令已复制\',\'粘贴给 AI 即可导出 JSON。\')">导出 JSON</button></div>';
var expCsv='<div class="btn-row"><button class="copy ghost" onclick="copyThen(\'请加载「居家管家」技能,帮我备份导出数据(唤醒词:备份导出):\\n\\n  操  作: 导出\\n  格  式: CSV\',\'导出指令已复制\',\'粘贴给 AI 即可导出 CSV。\')">导出 CSV</button></div>';
var delBtn=(list.length>1)?'<div class="btn-row"><button class="copy danger" onclick="copyThen(\'请加载「居家管家」技能,帮我备份导出数据(唤醒词:备份导出):\\n\\n  操  作: 删除旧备份\\n  文  件: \'+this.dataset.f+\'\\n  保留份数: '+keepN+' 份\',\'删除指令已复制\',\'粘贴给 AI 即可删除最旧备份。\')" data-f="'+esc(list[list.length-1].file)+'">删除最旧备份(确认式)</button></div>':'';
var copyDataBtn='<div class="btn-row"><button class="copy alt" onclick="copyThen(copyDataText,\'数据已复制\',\'人类可读数据快照:场景/时间/对象/载荷逐行,可直接阅读或粘贴给 AI。\')">复制数据</button></div>';
var copyLogBtn='<div class="btn-row"><button class="copy ghost" onclick="copyThen(copyLogText,\'日志已复制\',\'6 段日志:场景/思考链/数据结构/调用链/时间戳/异常,可发给开发者排障。\')">复制日志</button></div>';
window.copyDataText=d.copy_data_human||JSON.stringify(cd);
window.copyLogText=d.copy_log_human||JSON.stringify(cl);
app.innerHTML=banner
+'<div class="cards">'
  +'<div class="card"><b>备份文件</b><span>'+list.length+'</span></div>'
  +'<div class="card"><b>保留份数</b><span>'+keepN+'</span></div>'
  +'<div class="card"><b>距上次备份</b><span>'+((daysSince===null||daysSince===undefined)?'—':daysSince+' 天')+'</span></div>'
  +'</div>'
+(lastBack?'<section><h2>备份结果</h2>'+lastBack+'</section>':'')
+'<section><h2>备份历史(保留 '+keepN+' 份,自动清理更旧)</h2>'+histHtml+'</section>'
+'<section><h2>操作</h2>'+keepSel+'<div class="actions">'+backBtn+expJson+expCsv+delBtn+copyDataBtn+copyLogBtn+'</div></section>';
}
function fmtSize(n){n=Number(n||0);if(n<1024)return n+' B';if(n<1048576)return (n/1024).toFixed(1)+' KB';return (n/1048576).toFixed(1)+' MB';}
render();
</script>
</body>
</html>
