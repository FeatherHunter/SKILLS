<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>居家管家 · 首次使用</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--fg:#1d1d1f;--fg2:#6e6e73;--fg3:#86868b;--bg:#f5f5f7;--card:#fff;--line:#d2d2d7;--blue:#007aff;--green:#34c759;--orange:#ff9500;--red:#ff3b30;--soft:#f5f8ff;--shadow:0 1px 2px rgba(0,0,0,.04),0 12px 36px rgba(0,0,0,.06)}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--fg);line-height:1.65;-webkit-font-smoothing:antialiased}
.wrap{max-width:980px;margin:0 auto;padding:56px 22px 90px}
.hero{background:linear-gradient(180deg,#fff,#f8fbff);border-radius:28px;padding:34px;box-shadow:var(--shadow);margin-bottom:18px}
.eyebrow{color:var(--blue);font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px}
h1{font-size:34px;letter-spacing:-.035em;line-height:1.12;margin-bottom:10px}
.lead{color:var(--fg2);font-size:16px;max-width:760px}
section{background:var(--card);border-radius:20px;padding:22px;box-shadow:0 1px 3px rgba(0,0,0,.04);margin:18px 0}
h2{font-size:20px;letter-spacing:-.02em;margin-bottom:12px}
h3{font-size:15px;margin:14px 0 8px;color:var(--fg2)}
.row{display:grid;grid-template-columns:160px 1fr;gap:12px;padding:10px 0;border-bottom:1px solid #ececf1}.row:last-child{border-bottom:none}.k{color:var(--fg2)}.v{font-weight:600;word-break:break-word}
.pill{display:inline-block;border:1px solid var(--line);background:#fbfbfd;border-radius:999px;padding:4px 10px;margin:3px;font-size:13px}
.ok{color:var(--green)}.warn{color:var(--orange)}.bad{color:var(--red)}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 6px}
.step{flex:1;min-width:96px;background:#f2f4f8;border-radius:12px;padding:10px 8px;text-align:center;font-size:12.5px;color:var(--fg2)}
.step b{display:block;font-size:15px;margin-bottom:2px}
.step.done{background:#e9f8ef;color:#1d7a3f}.step.done b{color:var(--green)}
.step.cur{background:var(--soft);border:1.5px solid var(--blue);color:var(--blue)}
.step.fail{background:#ffecec;color:#c22e2e}
.cmd{background:#1d1d1f;color:#f5f5f7;border-radius:16px;padding:16px;overflow:auto;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;line-height:1.6;white-space:pre-wrap}
.copy{border:none;background:var(--blue);color:#fff;border-radius:999px;padding:10px 16px;font-weight:700;cursor:pointer;margin:10px 8px 0 0;font-size:14px}
.copy.alt{background:#1d1d1f}.copy.ghost{background:#fff;color:var(--blue);border:1.5px solid var(--blue)}
.copy.copied{background:var(--green)}
.actions{margin-top:14px;display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
.env-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:16px 0}
.env-card{background:#fafbfd;border-radius:14px;padding:14px}
.env-card b{display:block;font-size:12.5px;color:var(--fg2);margin-bottom:6px}
.env-card span{font-size:13.5px;font-weight:650;word-break:break-word}
.empty{color:var(--fg3)}
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(120px);background:#1d1d1f;color:#fff;border-radius:999px;padding:11px 22px;font-size:14px;font-weight:600;transition:.3s;z-index:99;box-shadow:0 8px 30px rgba(0,0,0,.25)}
.toast.show{transform:translateX(-50%) translateY(0)}
@media(max-width:820px){.wrap{padding:30px 14px 70px}.hero{padding:26px 20px}h1{font-size:26px}.row{grid-template-columns:1fr}.env-grid{grid-template-columns:1fr}.step{min-width:100%}}
</style>
</head>
<body>
<div class="wrap">
<header class="hero">
<div class="eyebrow">Setup · 初始化工作流</div>
<h1 id="title">居家管家 · 首次使用</h1>
<p class="lead" id="lead">6 步向导完成初始化:环境检测 → 路径确认 → 建库 → 建分类 → 引导 → 完成。默认即确认,想改可改。</p>
</header>
<div id="app"></div>
</div>
<script id="payload" type="application/json"><!--INJECT-DATA--></script>
<div class="toast" id="toast"></div>
<script>
<!--SHARED-HELPERS-->
var toastTimer=null;
function toastText(t){var el=document.getElementById('toast');el.textContent=t;el.classList.add('show');if(toastTimer)clearTimeout(toastTimer);toastTimer=setTimeout(function(){el.classList.remove('show')},3000);}
function fallbackCopy(text){try{var ta=document.createElement('textarea');ta.value=text;ta.style.cssText='position:fixed;left:-9999px;top:0';document.body.appendChild(ta);ta.focus();ta.select();var ok=false;try{ok=document.execCommand('copy')}catch(e){ok=false}document.body.removeChild(ta);return ok}catch(e){return false}}
function safeWriteText(text){if(navigator.clipboard&&navigator.clipboard.writeText){return navigator.clipboard.writeText(text).then(function(){return true}).catch(function(){return fallbackCopy(text)})}return Promise.resolve(fallbackCopy(text))}
function flashBtn(btn,msg,ms){var old=btn.textContent;btn.textContent=msg;btn.classList.add('copied');setTimeout(function(){btn.textContent=old;btn.classList.remove('copied')},ms||1800)}
function buildData(){var p=window.__PAYLOAD__||{};return p.data||{};}
var app=document.getElementById('app');
function render(){
var payload;try{payload=JSON.parse(document.getElementById('payload').textContent)}catch(e){app.innerHTML='<section><h2 class="bad">数据解析失败</h2></section>';return}
var v=validate(payload);if(!v.ok){app.innerHTML='<section><h2 class="bad">数据校验失败</h2><p>'+esc(v.msg)+'</p></section>';return}
var d=payload.data||{}, s=d.scene||{}, m=d.meta||{}, cd=d.copy_data||{}, cl=d.copy_log||{};
var err=d.error||{};
document.getElementById('title').textContent='居家管家 · '+(err.action||'首次使用');
var wiz=s.wizard||{};
var steps=arr(wiz.steps);
var stage=wiz.stage||'error';
var env=s.env||{};
var init=s.init||{};
var stepsHtml=steps.length?('<div class="steps">'+steps.map(function(st,i){
  var cls='step';
  if(st.status==='done')cls+=' done';
  else if(st.status==='current')cls+=' cur';
  else if(st.status==='fail')cls+=' fail';
  return '<div class="'+cls+'"><b>'+(i+1)+'</b>'+esc(st.title)+'</div>';
}).join('')+'</div>'):'';
var hint='';
if(stage==='pending'){hint='<section><p class="ok" style="font-weight:650">✅ 环境就绪。确认下方路径(默认即可)后点击「开始初始化」。</p></section>';}
else if(stage==='need_path'){hint='<section><p class="warn" style="font-weight:650">请确认数据保存路径(预填为建议值,可直接确认)。</p></section>';}
else if(stage==='done'){hint='<section><p class="ok" style="font-weight:650">✅ 初始化完成,可以开始使用了。</p><p class="warn" style="margin-top:8px">💡 顺路提醒:建议先跑一次「查异常」数据检查,验证空库健康。</p></section>';}
else if(stage==='already'){hint='<section><p class="ok" style="font-weight:650">✅ 已初始化,直接使用。</p></section>';}
else if(stage==='error'){hint='<section><h2 class="bad">'+esc(err.action||'初始化失败')+'</h2><p class="bad" style="font-weight:600">'+esc(err.reason||'未知原因')+'</p></section>';}
var envHtml=env.os?('<section><h2>环境检测</h2><div class="env-grid">'
  +'<div class="env-card"><b>操作系统</b><span>'+esc(env.os)+'</span></div>'
  +'<div class="env-card"><b>Python</b><span>'+esc(env.python)+'</span></div>'
  +'<div class="env-card"><b>数据库路径</b><span>'+esc(env.db_path)+'</span></div>'
  +(env.dirs_writable?'<div class="env-card"><b>目录可写</b><span>'+esc((env.dirs_writable.db_dir?'数据库目录 ✓':'数据库目录 ✗')+' · '+(env.dirs_writable.photos_dir?'照片目录 ✓':'照片目录 ✗'))+'</span></div>':'')
  +'</div></section>'):'';
var dbHtml=(init.db_path||env.db_path)?('<section><h2>建库结果</h2>'
  +'<div class="row"><div class="k">数据库</div><div class="v">'+esc(init.db_path||env.db_path||'')+'</div></div>'
  +'<div class="row"><div class="k">顶级分类</div><div class="v">'+esc(String(init.top_level??'-'))+'</div></div>'
  +'<div class="row"><div class="k">分类节点</div><div class="v">'+esc(String(init.total??'-'))+'</div></div>'
  +'<div class="row"><div class="k">种子标识</div><div class="v">'+esc(String(init.seed_keys??'-'))+'</div></div>'
  +(init.skipped?'<p class="warn">'+esc(init.skipped)+'</p>':'')
  +'</section>'):'';
var nextBtn='';
if(stage==='pending'||stage==='need_path'){
  var pathPrompt='确认数据保存路径:'+(env.db_path||'')+'。请执行初始化:建库(含分类种子 60 节点)。';
  nextBtn='<button class="copy" onclick="safeWriteText(this.dataset.p).then(function(ok){flashBtn(this,ok?\'✓ 已复制\':\'✗ 复制失败\',2000)}.bind(this))" data-p="'+esc(pathPrompt)+'">开始初始化(复制指令给 AI)</button>';
}
if(stage==='error'){
  var retry='初始化失败,请重试:'+esc(err.suggest||'')+'。';
  nextBtn='<button class="copy" onclick="safeWriteText(this.dataset.p).then(function(ok){flashBtn(this,ok?\'✓ 已复制\':\'✗ 复制失败\',2000)}.bind(this))" data-p="'+esc(retry)+'">一键重试(复制指令给 AI)</button>';
}
if(stage==='done'||stage==='already'){
  var guide='我想录第一批物品,建议从拍照开始(唤醒词:拍物品)。';
  nextBtn='<button class="copy" onclick="safeWriteText(this.dataset.p).then(function(ok){flashBtn(this,ok?\'✓ 已复制\':\'✗ 复制失败\',2000)}.bind(this))" data-p="'+esc(guide)+'">开始录入第一批(复制)</button>';
}
var copyDataBtn='<button class="copy alt" onclick="safeWriteText(\''+JSON.stringify(cd).replace(/'/g,"&#39;").replace(/"/g,'&quot;')+'\').then(function(ok){flashBtn(this,ok?\'✓ 已复制\':\'✗ 复制失败\',2000)}.bind(this))">复制数据</button>';
var copyLogBtn='<button class="copy ghost" onclick="safeWriteText(\''+JSON.stringify(cl).replace(/'/g,"&#39;").replace(/"/g,'&quot;')+'\').then(function(ok){flashBtn(this,ok?\'✓ 已复制\':\'✗ 复制失败\',2000)}.bind(this))">复制日志</button>';
app.innerHTML=''+stepsHtml+hint+envHtml+dbHtml
+'<section><h2>下一步</h2><div class="actions">'+nextBtn+copyDataBtn+copyLogBtn+'</div></section>';
}
render();
</script>
</body>
</html>
