<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>居家管家 · 首次使用</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--fg:#1d1d1f;--fg2:#6e6e73;--fg3:#86868b;--bg:#f5f5f7;--card:#fff;--line:#d2d2d7;--blue:#007aff;--green:#34c759;--orange:#ff9500;--red:#ff3b30;--soft:#f5f8ff;--shadow:0 1px 2px rgba(0,0,0,.04),0 12px 36px rgba(0,0,0,.06)}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--fg);line-height:1.65;-webkit-font-smoothing:antialiased}
.wrap{max-width:980px;margin:0 auto;padding:56px 22px 90px}
.hero{background:linear-gradient(180deg,#fff,#f8fbff);border-radius:28px;padding:34px;box-shadow:var(--shadow);margin-bottom:18px}
.eyebrow{color:var(--blue);font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px}
h1{font-size:34px;letter-spacing:-.035em;line-height:1.12;margin-bottom:10px}
.lead{color:var(--fg2);font-size:16px;max-width:760px}
section{background:var(--card);border-radius:20px;padding:22px;box-shadow:0 1px 3px rgba(0,0,0,.04);margin:18px 0}
h2{font-size:20px;letter-spacing:-.02em;margin-bottom:12px}
h3{font-size:15px;margin:14px 0 8px;color:var(--fg2)}
.row{display:grid;grid-template-columns:160px 1fr;gap:12px;padding:10px 0;border-bottom:1px solid #ececf1}.row:last-child{border-bottom:none}.k{color:var(--fg2)}.v{font-weight:600;word-break:break-word}
.pill{display:inline-block;border:1px solid var(--line);background:#fbfbfd;border-radius:999px;padding:4px 10px;margin:3px;font-size:13px}
.ok{color:var(--green)}.warn{color:var(--orange)}.bad{color:var(--red)}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 6px}
.step{flex:1;min-width:96px;background:#f2f4f8;border-radius:12px;padding:10px 8px;text-align:center;font-size:12.5px;color:var(--fg2)}
.step b{display:block;font-size:15px;margin-bottom:2px}
.step.done{background:#e9f8ef;color:#1d7a3f}.step.done b{color:var(--green)}
.step.cur{background:var(--soft);border:1.5px solid var(--blue);color:var(--blue)}
.step.fail{background:#ffecec;color:#c22e2e}
.cmd{background:#1d1d1f;color:#f5f5f7;border-radius:16px;padding:16px;overflow:auto;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;line-height:1.6;white-space:pre-wrap}
.copy{border:none;background:var(--blue);color:#fff;border-radius:999px;padding:10px 16px;font-weight:700;cursor:pointer;margin:10px 8px 0 0;font-size:14px}
.copy.alt{background:#1d1d1f}.copy.ghost{background:#fff;color:var(--blue);border:1.5px solid var(--blue)}
.copy.copied{background:var(--green)}
/* ===== 参数表单(采集型 · 预填度 100% 可修改) ===== */
.frm{display:flex;flex-direction:column;gap:8px;margin:14px 0 4px}
.frm label{font-size:13px;font-weight:700;color:var(--fg2)}
.frm input,.frm select{border:1.5px solid var(--line);border-radius:12px;padding:10px 14px;font-size:14.5px;font-family:inherit;background:#fff;color:var(--fg);width:100%;transition:border-color .15s,box-shadow .15s}
.frm input:focus,.frm select:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(0,122,255,.12)}
.prompt-preview{background:#1d1d1f;color:#f5f5f7;border-radius:14px;padding:14px 16px;margin:12px 0 4px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;line-height:1.7;white-space:pre-wrap;word-break:break-word}
.prompt-preview .ph{color:#ffd60a;font-weight:600}
.actions{margin-top:14px;display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
.env-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:16px 0}
.env-card{background:#fafbfd;border-radius:14px;padding:14px}
.env-card b{display:block;font-size:12.5px;color:var(--fg2);margin-bottom:6px}
.env-card span{font-size:13.5px;font-weight:650;word-break:break-word}
.empty{color:var(--fg3)}
/* ===== Toast(「知道了」面板 · 与 help_center 同款) ===== */
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0));transform:translateX(-50%) scale(.9);opacity:0;background:rgba(28,28,30,.94);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);color:#f0f0f0;border-radius:14px;padding:13px 14px 13px 16px;display:flex;align-items:flex-start;gap:12px;max-width:480px;min-width:300px;box-shadow:0 10px 32px rgba(0,0,0,.32),0 0 0 .5px rgba(255,255,255,.08) inset;pointer-events:none;transition:opacity .22s ease-out,transform .22s cubic-bezier(.34,1.56,.64,1);z-index:9999}
.toast.show{opacity:1;transform:translateX(-50%) scale(1);pointer-events:auto}
.toast-icon{font-size:20px;line-height:1;padding-top:1px;flex-shrink:0}
.toast-body{flex:1;min-width:0}
.toast-title{font-weight:600;font-size:12.5px;line-height:1.4;color:#fff;margin-bottom:2px}
.toast-detail{font-size:11px;line-height:1.5;color:#c8c8cc}
.toast-close{background:rgba(255,255,255,.10);color:#34c759;border:0;border-radius:8px;padding:5px 9px;font-size:10.5px;font-weight:500;font-family:inherit;cursor:pointer;white-space:nowrap;margin-left:6px;flex-shrink:0}
@media(max-width:820px){.wrap{padding:30px 14px 70px}.hero{padding:26px 20px}h1{font-size:26px}.row{grid-template-columns:1fr}.env-grid{grid-template-columns:1fr}.step{min-width:100%}.actions{flex-direction:column;align-items:stretch;justify-content:flex-start}.actions .copy{width:100%;margin:6px 0 0;text-align:center;white-space:normal}.toast{left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0));transform:translateX(0) scale(.95);max-width:none;min-width:0}.toast.show{transform:translateX(0) scale(1)}}
</style>
</head>
<body>
<div class="wrap">
<header class="hero">
<div class="eyebrow">Setup · 初始化工作流</div>
<h1 id="title">居家管家 · 首次使用</h1>
<p class="lead" id="lead">6 步向导完成初始化:环境检测 → 路径确认 → 建库 → 建分类 → 引导 → 完成。默认即确认,想改可改。</p>
</header>
<div id="app"></div>
</div>
<script id="payload" type="application/json"><!--INJECT-DATA--></script>
<div class="toast" id="toast" role="status" aria-live="polite">
  <div class="toast-icon" id="toastIcon">📋</div>
  <div class="toast-body">
    <div class="toast-title" id="toastTitle"></div>
    <div class="toast-detail" id="toastDetail"></div>
  </div>
  <button class="toast-close" id="toastClose">✓ 知道了</button>
</div>
<script>
<!--SHARED-HELPERS-->
var toastTimer=null;
function fallbackCopy(text){try{var ta=document.createElement('textarea');ta.value=text;ta.style.cssText='position:fixed;left:-9999px;top:0';document.body.appendChild(ta);ta.focus();ta.select();var ok=false;try{ok=document.execCommand('copy')}catch(e){ok=false}document.body.removeChild(ta);return ok}catch(e){return false}}
function safeWriteText(text){if(navigator.clipboard&&navigator.clipboard.writeText){return navigator.clipboard.writeText(text).then(function(){return true}).catch(function(){return fallbackCopy(text)})}return Promise.resolve(fallbackCopy(text))}
function toastShow(title,detail,icon){
  var tEl=document.getElementById('toastTitle'),dEl=document.getElementById('toastDetail'),iEl=document.getElementById('toastIcon');
  if(tEl)tEl.textContent=title;if(dEl)dEl.textContent=detail;if(iEl)iEl.textContent=icon||'📋';
  var el=document.getElementById('toast');if(!el)return;el.classList.add('show');
  if(toastTimer)clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){el.classList.remove('show')},4500);
}
function copyThen(text,title,detail){
  safeWriteText(text).then(function(ok){
    if(ok){toastShow(title,detail,'📋');}
    else{toastShow('复制失败','剪贴板不可用,请长按文本手动复制','⚠️');}
  });
}
function copyFormPrompt(fieldId,buildFn,title,detail){
  var el=document.getElementById(fieldId);
  if(!el)return;
  var v=el.value.trim();
  if(!v){toastShow('请填写参数','该参数不能为空,填好后才能复制指令。','⚠️');el.focus();return;}
  copyThen(buildFn(v),title,detail);
}
window.copyFormPrompt=copyFormPrompt;
(function(){var c=document.getElementById('toastClose');if(c)c.addEventListener('click',function(){var el=document.getElementById('toast');if(el)el.classList.remove('show');if(toastTimer)clearTimeout(toastTimer)});})();
function buildData(){var p=window.__PAYLOAD__||{};return p.data||{};}
var app=document.getElementById('app');
function render(){
var payload;try{payload=JSON.parse(document.getElementById('payload').textContent)}catch(e){app.innerHTML='<section><h2 class="bad">数据解析失败</h2></section>';return}
var v=validate(payload);if(!v.ok){app.innerHTML='<section><h2 class="bad">数据校验失败</h2><p>'+esc(v.msg)+'</p></section>';return}
var d=payload.data||{}, s=d.scene||{}, m=d.meta||{}, cd=d.copy_data||{}, cl=d.copy_log||{};
var err=d.error||{};
document.getElementById('title').textContent='居家管家 · '+(err.action||'首次使用');
var wiz=s.wizard||{};
var steps=arr(wiz.steps);
var stage=wiz.stage||'error';
var env=s.env||{};
var init=s.init||{};
var stepsHtml=steps.length?('<div class="steps">'+steps.map(function(st,i){
  var cls='step';
  if(st.status==='done')cls+=' done';
  else if(st.status==='current')cls+=' cur';
  else if(st.status==='fail')cls+=' fail';
  return '<div class="'+cls+'"><b>'+(i+1)+'</b>'+esc(st.title)+'</div>';
}).join('')+'</div>'):'';
var hint='';
if(stage==='pending'){hint='<section><p class="ok" style="font-weight:650">✅ 环境就绪。确认下方路径(默认即可)后点击「开始初始化」。</p></section>';}
else if(stage==='need_path'){hint='<section><p class="warn" style="font-weight:650">请确认数据保存路径(预填为建议值,可直接确认)。</p></section>';}
else if(stage==='done'){hint='<section><p class="ok" style="font-weight:650">✅ 初始化完成,可以开始使用了。</p><p class="warn" style="margin-top:8px">💡 顺路提醒:建议先跑一次「查异常」数据检查,验证空库健康。</p></section>';}
else if(stage==='already'){hint='<section><p class="ok" style="font-weight:650">✅ 已初始化,直接使用。</p></section>';}
else if(stage==='error'){hint='<section><h2 class="bad">'+esc(err.action||'初始化失败')+'</h2><p class="bad" style="font-weight:600">'+esc(err.reason||'未知原因')+'</p></section>';}
var envHtml=env.os?('<section><h2>环境检测</h2><div class="env-grid">'
  +'<div class="env-card"><b>操作系统</b><span>'+esc(env.os)+'</span></div>'
  +'<div class="env-card"><b>Python</b><span>'+esc(env.python)+'</span></div>'
  +'<div class="env-card"><b>数据库路径</b><span>'+esc(env.db_path)+'</span></div>'
  +(env.dirs_writable?'<div class="env-card"><b>目录可写</b><span>'+esc((env.dirs_writable.db_dir?'数据库目录 ✓':'数据库目录 ✗')+' · '+(env.dirs_writable.photos_dir?'照片目录 ✓':'照片目录 ✗'))+'</span></div>':'')
  +(env.env?'<div class="env-card"><b>SKILLS_DB_PATH</b><span>'+esc(env.env.SKILLS_DB_PATH||'(未设置,走默认)')+'</span></div>'
  +'<div class="env-card"><b>HOME_PHOTOS_DIR</b><span>'+esc(env.env.HOME_PHOTOS_DIR||'(未设置,走默认)')+'</span></div>':'')
  +'</div></section>'):'';
var dbHtml=(init.db_path||env.db_path)?('<section><h2>建库结果</h2>'
  +'<div class="row"><div class="k">数据库</div><div class="v">'+esc(init.db_path||env.db_path||'')+'</div></div>'
  +'<div class="row"><div class="k">顶级分类</div><div class="v">'+esc(String(init.top_level??'-'))+'</div></div>'
  +'<div class="row"><div class="k">分类节点</div><div class="v">'+esc(String(init.total??'-'))+'</div></div>'
  +'<div class="row"><div class="k">种子标识</div><div class="v">'+esc(String(init.seed_keys??'-'))+'</div></div>'
  +(init.skipped?'<p class="warn">'+esc(init.skipped)+'</p>':'')
  +'</section>'):'';
var nextBtn='';
var cfgBtn='';
var frmHtml='';
var envCfg=env.env||{};
var dbEnvSet=envCfg.SKILLS_DB_PATH && envCfg.SKILLS_DB_PATH.indexOf('未设置')<0;

/* ===== 参数表单: 实时预览 + 复制拼接(采集型 · 用户可改) ===== */
function updatePreview(fieldId, phId, buildFn){
  var v=document.getElementById(fieldId).value.trim();
  var el=document.getElementById('promptPreview');
  if(!el)return;
  var out=buildFn(v);
  el.innerHTML=out.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\{(\w+)\}/g,'<span class="ph">$1</span>');
}
function buildInitPrompt(pathVal){
  if(!pathVal)return '请填写数据保存路径(必填)';
  return '请加载「居家管家」技能,帮我完成首次使用初始化(唤醒词:首次使用):\n\n  数据保存路径(默认即确认): '+pathVal;
}
function buildCfgPrompt(dirVal){
  if(!dirVal)return '请填写数据库目录(必填)';
  return '请加载「居家管家」技能,帮我配置数据存储环境(唤醒词:首次使用):\n\n  数据库目录(SKILLS_DB_PATH,未设置将走默认): '+dirVal;
}
function buildGuidePrompt(guideVal){
  if(!guideVal)return '请填写录入引导(必填)';
  return '请加载「居家管家」技能,帮我录入第一批物品(唤醒词:拍物品):\n\n  录入引导(想录什么/从哪开始): '+guideVal;
}
window.updatePreview=updatePreview;window.buildInitPrompt=buildInitPrompt;
window.buildCfgPrompt=buildCfgPrompt;window.buildGuidePrompt=buildGuidePrompt;

if(stage==='pending'||stage==='need_path'){
  var pathInit=(env.db_path||'');
  frmHtml='<div class="frm"><label for="frmPath">数据保存路径(可改,默认即确认)</label><input id="frmPath" type="text" value="'+esc(pathInit)+'" oninput="updatePreview(\'frmPath\',null,buildInitPrompt)"></div>';
  var initPrompt=buildInitPrompt(pathInit);
  nextBtn='<button class="copy" onclick="copyFormPrompt(\'frmPath\',buildInitPrompt,\'初始化指令已复制\',\'粘贴给 AI 即可执行初始化流程。\')">开始初始化(复制指令给 AI)</button>';
}
if(stage==='error'){
  var retry='请加载「居家管家」技能,帮我完成首次使用初始化(唤醒词:首次使用):初始化失败,请重试:'+esc(err.suggest||'')+'。';
  nextBtn='<button class="copy" onclick="copyThen(this.dataset.p,\'重试指令已复制\',\'粘贴给 AI 即可重试初始化。\')" data-p="'+esc(retry)+'">一键重试(复制指令给 AI)</button>';
}
if((stage==='pending'||stage==='need_path') && !dbEnvSet){
  var cfgDirSuggest=envCfg.SKILLS_DB_PATH_SUGGEST||'';
  frmHtml='<div class="frm"><label for="frmDir">数据库目录(可改,建议值来自环境推导)</label><input id="frmDir" type="text" value="'+esc(cfgDirSuggest)+'" placeholder="如 D:\\MyData" oninput="updatePreview(\'frmDir\',null,buildCfgPrompt)"></div>'+frmHtml;
  cfgBtn='<button class="copy ghost" onclick="copyFormPrompt(\'frmDir\',buildCfgPrompt,\'配置指令已复制\',\'粘贴给 AI 即可引导配置环境变量。\')">先配置环境变量</button>';
}
if(stage==='done'||stage==='already'){
  var guideInit='从拍照开始,建议先录 1-3 件试用。';
  frmHtml='<div class="frm"><label for="frmGuide">录入引导(可改)</label><input id="frmGuide" type="text" value="'+esc(guideInit)+'" oninput="updatePreview(\'frmGuide\',null,buildGuidePrompt)"></div>';
  nextBtn='<button class="copy" onclick="copyFormPrompt(\'frmGuide\',buildGuidePrompt,\'录入引导已复制\',\'粘贴给 AI 即可开始录入第一批物品。\')">开始录入第一批(复制)</button>';
}
var copyDataBtn='<button class="copy alt" onclick="copyThen(this.dataset.d,\'数据已复制\',\'结构化 JSON 5 段:场景/指令/时间/对象/载荷,可粘贴给 AI 或存档。\')" data-d="'+JSON.stringify(cd).replace(/'/g,"&#39;").replace(/"/g,'&quot;')+'">复制数据</button>';
var copyLogBtn='<button class="copy ghost" onclick="copyThen(this.dataset.d,\'日志已复制\',\'6 段日志:场景/思考链/数据结构/调用链/时间戳/异常,可发给开发者排障。\')" data-d="'+JSON.stringify(cl).replace(/'/g,"&#39;").replace(/"/g,'&quot;')+'">复制日志</button>';
var promptPreview='';
if(frmHtml){
  var pf=(stage==='pending'||stage==='need_path')&&!dbEnvSet?'frmDir':(stage==='done'||stage==='already')?'frmGuide':'frmPath';
  var pbuild=(stage==='pending'||stage==='need_path')&&!dbEnvSet?buildCfgPrompt:(stage==='done'||stage==='already')?buildGuidePrompt:buildInitPrompt;
  promptPreview='<div class="prompt-preview" id="promptPreview"></div>';
}
app.innerHTML=''+stepsHtml+hint+envHtml+dbHtml
+'<section><h2>下一步</h2>'+frmHtml+promptPreview+'<div class="actions">'+cfgBtn+nextBtn+copyDataBtn+copyLogBtn+'</div></section>';
if(frmHtml){
  var pf2=(stage==='pending'||stage==='need_path')&&!dbEnvSet?'frmDir':(stage==='done'||stage==='already')?'frmGuide':'frmPath';
  var pbuild2=(stage==='pending'||stage==='need_path')&&!dbEnvSet?buildCfgPrompt:(stage==='done'||stage==='already')?buildGuidePrompt:buildInitPrompt;
  updatePreview(pf2,null,pbuild2);
}
}
render();
</script>
</body>
</html>
