<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>居家管家 · 数据检查</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--fg:#1d1d1f;--fg2:#6e6e73;--fg3:#86868b;--bg:#f5f5f7;--card:#fff;--line:#d2d2d7;--blue:#007aff;--green:#34c759;--orange:#ff9500;--red:#ff3b30;--soft:#f5f8ff;--shadow:0 1px 2px rgba(0,0,0,.04),0 12px 36px rgba(0,0,0,.06)}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--fg);line-height:1.65;-webkit-font-smoothing:antialiased}
.wrap{max-width:980px;margin:0 auto;padding:56px 22px 90px}
.hero{background:linear-gradient(180deg,#fff,#f8fbff);border-radius:28px;padding:34px;box-shadow:var(--shadow);margin-bottom:18px}
.eyebrow{color:var(--blue);font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px}
h1{font-size:34px;letter-spacing:-.035em;line-height:1.12;margin-bottom:10px}
.lead{color:var(--fg2);font-size:16px;max-width:760px}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:18px 0}
.card{background:var(--card);border-radius:20px;padding:18px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.card b{display:block;font-size:13px;color:var(--fg2);margin-bottom:5px}.card span{font-size:24px;font-weight:750;letter-spacing:-.02em}
section{background:var(--card);border-radius:20px;padding:22px;box-shadow:0 1px 3px rgba(0,0,0,.04);margin:18px 0}
h2{font-size:20px;letter-spacing:-.02em;margin-bottom:12px}
h3{font-size:15px;margin:14px 0 8px;color:var(--fg2)}
.row{display:grid;grid-template-columns:160px 1fr;gap:12px;padding:10px 0;border-bottom:1px solid #ececf1}.row:last-child{border-bottom:none}.k{color:var(--fg2)}.v{font-weight:600;word-break:break-word}
.check{display:flex;gap:12px;align-items:flex-start;padding:14px 0;border-bottom:1px solid #ececf1}
.check:last-child{border-bottom:none}
.check input{width:20px;height:20px;margin-top:3px;accent-color:var(--blue);flex:none}
.sev{display:inline-block;border-radius:999px;padding:2px 9px;font-size:11.5px;font-weight:700;margin-left:8px}
.sev.high{background:#ffecec;color:#c22e2e}.sev.mid{background:#fff4e0;color:#b07000}.sev.low{background:#eef4ee;color:#5a7d5a}
.pill{display:inline-block;border:1px solid var(--line);background:#fbfbfd;border-radius:999px;padding:3px 9px;margin:3px;font-size:12.5px}
.ok{color:var(--green)}.bad{color:var(--red)}.empty{color:var(--fg3)}
.cmd{background:#1d1d1f;color:#f5f5f7;border-radius:16px;padding:16px;overflow:auto;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;line-height:1.6;white-space:pre-wrap}
.copy{border:none;background:var(--blue);color:#fff;border-radius:999px;padding:10px 16px;font-weight:700;cursor:pointer;margin:10px 8px 0 0;font-size:14px}
.copy.alt{background:#1d1d1f}.copy.ghost{background:#fff;color:var(--blue);border:1.5px solid var(--blue)}
.copy.copied{background:var(--green)}
.actions{margin-top:14px;display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(120px);background:#1d1d1f;color:#fff;border-radius:999px;padding:11px 22px;font-size:14px;font-weight:600;transition:.3s;z-index:99;box-shadow:0 8px 30px rgba(0,0,0,.25)}
.toast.show{transform:translateX(-50%) translateY(0)}
@media(max-width:820px){.wrap{padding:30px 14px 70px}.hero{padding:26px 20px}h1{font-size:26px}.row{grid-template-columns:1fr}.cards{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="wrap">
<header class="hero">
<div class="eyebrow">Health Check · 数据健康报告</div>
<h1 id="title">居家管家 · 数据检查</h1>
<p class="lead" id="lead">数据好不好一目了然。勾选问题 → 复制修复引导 → 发给 AI 到对应场景修复(只建议,不自动改)。</p>
</header>
<div id="app"></div>
</div>
<script id="payload" type="application/json"><!--INJECT-DATA--></script>
<div class="toast" id="toast"></div>
<script>
<!--SHARED-HELPERS-->
var toastTimer=null;
function toastText(t){var el=document.getElementById('toast');el.textContent=t;el.classList.add('show');if(toastTimer)clearTimeout(toastTimer);toastTimer=setTimeout(function(){el.classList.remove('show')},3000);}
function fallbackCopy(text){try{var ta=document.createElement('textarea');ta.value=text;ta.style.cssText='position:fixed;left:-9999px;top:0';document.body.appendChild(ta);ta.focus();ta.select();var ok=false;try{ok=document.execCommand('copy')}catch(e){ok=false}document.body.removeChild(ta);return ok}catch(e){return false}}
function safeWriteText(text){if(navigator.clipboard&&navigator.clipboard.writeText){return navigator.clipboard.writeText(text).then(function(){return true}).catch(function(){return fallbackCopy(text)})}return Promise.resolve(fallbackCopy(text))}
function flashBtn(btn,msg,ms){var old=btn.textContent;btn.textContent=msg;btn.classList.add('copied');setTimeout(function(){btn.textContent=old;btn.classList.remove('copied')},ms||1800)}
var app=document.getElementById('app');
function render(){
var payload;try{payload=JSON.parse(document.getElementById('payload').textContent)}catch(e){app.innerHTML='<section><h2 class="bad">数据解析失败</h2></section>';return}
var v=validate(payload);if(!v.ok){app.innerHTML='<section><h2 class="bad">数据校验失败</h2><p>'+esc(v.msg)+'</p></section>';return}
var d=payload.data||{}, s=d.scene||{}, m=d.meta||{}, cd=d.copy_data||{}, cl=d.copy_log||{};
var env=s.env||{};
var checks=arr(s.checks);
var issuesTotal=Number(s.issues_total||0);
var itemsTotal=Number(s.items_total||0);
var healthy=!!s.healthy;
document.getElementById('title').textContent='居家管家 · 数据检查';
document.getElementById('lead').textContent=healthy?'数据健康良好,继续保持。':'发现 '+issuesTotal+' 个问题,勾选后复制修复引导。';
var envHtml=env.db_path?('<section><h2>环境信息</h2><div class="row"><div class="k">数据库</div><div class="v">'+esc(env.db_path)+'</div></div>'
  +'<div class="row"><div class="k">操作系统</div><div class="v">'+esc(env.os||'')+'</div></div>'
  +'<div class="row"><div class="k">Python</div><div class="v">'+esc(env.python||'')+'</div></div>'
  +'<div class="row"><div class="k">物品总数</div><div class="v">'+itemsTotal+'</div></div></section>'):'';
var sevCls={high:'high',mid:'mid',low:'low'};
var checksHtml=checks.length?('<section><h2>检查项('+checks.length+')</h2>'+checks.map(function(c,i){
  var samples=arr(c.samples);
  return '<div class="check"><input type="checkbox" id="ck'+i+'" data-idx="'+i+'">'
    +'<div style="flex:1"><div style="font-weight:650">'+esc(c.title)+'<span class="sev '+sevCls[c.severity]||'low'+'">'+esc({high:'严重',mid:'中等',low:'轻微'}[c.severity]||c.severity)+'</span></div>'
    +'<div style="font-size:13px;color:var(--fg2);margin:3px 0">涉及 '+c.count+' 件'+(samples.length?' · 示例:'+samples.map(function(x){return '<span class="pill">'+esc(x)+'</span>'}).join(''):'')+'</div>'
    +'<div style="font-size:13px" class="ok">修复:只建议不自动改</div></div></div>';
}).join('')+'</section>'):'';
var emptyHtml=(!checks.length)?'<section><h2 class="ok">✅ 数据健康良好</h2><p>未发现数据问题。</p></section>':'';
var copySelected='';
if(checks.length){
  copySelected='<button class="copy" id="copyFix" onclick="copySelectedFixes(this)">复制选中修复引导</button>';
}
var copyDataBtn='<button class="copy alt" onclick="safeWriteText(\''+JSON.stringify(cd).replace(/'/g,"&#39;").replace(/"/g,'&quot;')+'\').then(function(ok){flashBtn(this,ok?\'✓ 已复制\':\'✗ 复制失败\',2000)}.bind(this))">复制数据</button>';
var copyLogBtn='<button class="copy ghost" onclick="safeWriteText(\''+JSON.stringify(cl).replace(/'/g,"&#39;").replace(/"/g,'&quot;')+'\').then(function(ok){flashBtn(this,ok?\'✓ 已复制\':\'✗ 复制失败\',2000)}.bind(this))">复制日志</button>';
app.innerHTML=envHtml+'<div class="cards">'
  +'<div class="card"><b>问题总数</b><span class="'+(issuesTotal?'bad':'ok')+'">'+issuesTotal+'</span></div>'
  +'<div class="card"><b>检查项</b><span>'+checks.length+'</span></div>'
  +'<div class="card"><b>物品总数</b><span>'+itemsTotal+'</span></div>'
  +'<div class="card"><b>健康状态</b><span class="'+(healthy?'ok':'warn')+'">'+(healthy?'良好':'待处理')+'</span></div>'
  +'</div>'+checksHtml+emptyHtml
  +'<section><h2>动作</h2><div class="actions">'+copySelected+copyDataBtn+copyLogBtn+'</div></section>';
window.__checks__=checks;
}
function copySelectedFixes(btn){
  var checks=window.__checks__||[];
  var lines=[];
  checks.forEach(function(c,i){
    var el=document.getElementById('ck'+i);
    if(el&&el.checked&&c.fix_prompt){lines.push(c.fix_prompt);}
  });
  if(!lines.length){toastText('请先勾选至少 1 个问题');return;}
  var text=lines.join('\n');
  toastText('已复制 '+lines.length+' 条修复引导');
  safeWriteText(text).then(function(ok){flashBtn(btn,ok?'✓ 已复制':'✗ 复制失败',2000)});
}
render();
</script>
</body>
</html>
