<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>居家管家 · 导入与恢复</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--fg:#1d1d1f;--fg2:#6e6e73;--fg3:#86868b;--bg:#f5f5f7;--card:#fff;--line:#d2d2d7;--blue:#007aff;--green:#34c759;--orange:#ff9500;--red:#ff3b30;--soft:#f5f8ff;--shadow:0 1px 2px rgba(0,0,0,.04),0 12px 36px rgba(0,0,0,.06)}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--fg);line-height:1.65;-webkit-font-smoothing:antialiased}
.wrap{max-width:980px;margin:0 auto;padding:56px 22px 90px}
.hero{background:linear-gradient(180deg,#fff,#f8fbff);border-radius:28px;padding:34px;box-shadow:var(--shadow);margin-bottom:18px}
.eyebrow{color:var(--blue);font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px}
h1{font-size:34px;letter-spacing:-.035em;line-height:1.12;margin-bottom:10px}
.lead{color:var(--fg2);font-size:16px;max-width:760px}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:18px 0}
.card{background:var(--card);border-radius:20px;padding:18px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.card b{display:block;font-size:13px;color:var(--fg2);margin-bottom:5px}.card span{font-size:22px;font-weight:750;letter-spacing:-.02em}
section{background:var(--card);border-radius:20px;padding:22px;box-shadow:0 1px 3px rgba(0,0,0,.04);margin:18px 0}
h2{font-size:20px;letter-spacing:-.02em;margin-bottom:12px}
.row{display:grid;grid-template-columns:160px 1fr;gap:12px;padding:10px 0;border-bottom:1px solid #ececf1}.row:last-child{border-bottom:none}.k{color:var(--fg2)}.v{font-weight:600;word-break:break-word}
.pill{display:inline-block;border:1px solid var(--line);background:#fbfbfd;border-radius:999px;padding:3px 9px;margin:3px;font-size:12.5px}
.ok{color:var(--green)}.warn{color:var(--orange)}.bad{color:var(--red)}.empty{color:var(--fg3)}
.copy{border:none;background:var(--blue);color:#fff;border-radius:999px;padding:10px 16px;font-weight:700;cursor:pointer;margin:10px 8px 0 0;font-size:14px}
.copy.alt{background:#1d1d1f}.copy.ghost{background:#fff;color:var(--blue);border:1.5px solid var(--blue)}
.copy.copied{background:var(--green)}
.actions{margin-top:14px;display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 6px}
.step{flex:1;min-width:110px;background:#f2f4f8;border-radius:12px;padding:10px 8px;text-align:center;font-size:12.5px;color:var(--fg2)}
.step b{display:block;font-size:15px;margin-bottom:2px}
.step.done{background:#e9f8ef;color:#1d7a3f}.step.done b{color:var(--green)}
.step.cur{background:var(--soft);border:1.5px solid var(--blue);color:var(--blue)}
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(120px);background:#1d1d1f;color:#fff;border-radius:999px;padding:11px 22px;font-size:14px;font-weight:600;transition:.3s;z-index:99;box-shadow:0 8px 30px rgba(0,0,0,.25)}
.toast.show{transform:translateX(-50%) translateY(0)}
@media(max-width:820px){.wrap{padding:30px 14px 70px}.hero{padding:26px 20px}h1{font-size:26px}.row{grid-template-columns:1fr}.cards{grid-template-columns:1fr 1fr}.step{min-width:100%}}
</style>
</head>
<body>
<div class="wrap">
<header class="hero">
<div class="eyebrow">Import · 迁移恢复</div>
<h1 id="title">居家管家 · 导入与恢复</h1>
<p class="lead" id="lead">选文件(预告式) → 校验 → 冲突预览 → 确认导入。导入前自动备份现有库,失败自动回滚,数据不变。</p>
</header>
<div id="app"></div>
</div>
<script id="payload" type="application/json"><!--INJECT-DATA--></script>
<div class="toast" id="toast"></div>
<script>
<!--SHARED-HELPERS-->
var toastTimer=null;
function toastText(t){var el=document.getElementById('toast');el.textContent=t;el.classList.add('show');if(toastTimer)clearTimeout(toastTimer);toastTimer=setTimeout(function(){el.classList.remove('show')},3000);}
function fallbackCopy(text){try{var ta=document.createElement('textarea');ta.value=text;ta.style.cssText='position:fixed;left:-9999px;top:0';document.body.appendChild(ta);ta.focus();ta.select();var ok=false;try{ok=document.execCommand('copy')}catch(e){ok=false}document.body.removeChild(ta);return ok}catch(e){return false}}
function safeWriteText(text){if(navigator.clipboard&&navigator.clipboard.writeText){return navigator.clipboard.writeText(text).then(function(){return true}).catch(function(){return fallbackCopy(text)})}return Promise.resolve(fallbackCopy(text))}
function flashBtn(btn,msg,ms){var old=btn.textContent;btn.textContent=msg;btn.classList.add('copied');setTimeout(function(){btn.textContent=old;btn.classList.remove('copied')},ms||1800)}
var app=document.getElementById('app');
function render(){
var payload;try{payload=JSON.parse(document.getElementById('payload').textContent)}catch(e){app.innerHTML='<section><h2 class="bad">数据解析失败</h2></section>';return}
var v=validate(payload);if(!v.ok){app.innerHTML='<section><h2 class="bad">数据校验失败</h2><p>'+esc(v.msg)+'</p></section>';return}
var d=payload.data||{}, s=d.scene||{}, m=d.meta||{}, cd=d.copy_data||{}, cl=d.copy_log||{};
var err=d.error||{};
document.getElementById('title').textContent='居家管家 · '+(err.action||'导入与恢复');
var pv=s.preview||{};
var imp=s.imported!=null?s:{};
var steps=arr(s.steps);
var stage=s.stage||(imp.imported!=null?'done':(pv.valid?'preview':'choose'));
var stepsHtml=steps.length?('<div class="steps">'+steps.map(function(st,i){
  var cls='step';
  if(st.status==='done')cls+=' done';
  else if(st.status==='current')cls+=' cur';
  return '<div class="'+cls+'"><b>'+(i+1)+'</b>'+esc(st.title)+'</div>';
}).join('')+'</div>'):'';
var chooseBtn='<button class="copy" onclick="safeWriteText(\'我要导入恢复数据。【导入文件即将发送:】\').then(function(ok){flashBtn(this,ok?\'✓ 已复制\':\'✗ 复制失败\',2000)}.bind(this))">选择文件(预告式)</button>';
var chooseHtml='<section><h2>① 选择导入文件</h2><p>文件 = 旧机导出的 JSON(备份或导出均可)。点下方按钮复制预告式指令 → 发给 AI → AI 进入等待态 → 随后发送文件。</p><div class="actions">'+chooseBtn+'</div></section>';
var previewHtml='';
if(pv.valid!=null&&imp.imported==null){
  var conflict=arr(pv.conflicts);
  var compat=pv.valid;
  previewHtml='<section><h2>② 校验结果</h2>'
    +'<div class="row"><div class="k">文件版本</div><div class="v">'+esc(pv.schema_version||'')+' '+(compat?'<span class="ok">(兼容)</span>':'<span class="warn">(版本不一致,可尝试导入)</span>')+'</div></div>'
    +'<div class="row"><div class="k">物品总数</div><div class="v">'+esc(String(pv.items_total||0))+'</div></div>'
    +'<div class="row"><div class="k">同名冲突</div><div class="v">'+esc(String(pv.duplicate_count||0))+'</div></div>'
    +'<div class="row"><div class="k">新增</div><div class="v">'+esc(String(pv.new_count||0))+'</div></div></section>'
    +(conflict.length?'<section><h2>③ 冲突预览(同名物品)</h2>'+conflict.slice(0,10).map(function(c){return '<span class="pill">'+esc(c.name)+'</span>'}).join('')+(conflict.length>10?'<p class="empty">…等 '+conflict.length+' 件</p>':'')+'</section>':'')
    +'<section><h2>④ 确认导入</h2><p>导入前会自动备份现有库(安全网);导入失败自动回滚,现有数据不变。</p><div class="actions">'
    +'<button class="copy" onclick="safeWriteText(\'确认导入:'+esc(pv.items_total||0)+' 件,'+esc(pv.duplicate_count||0)+' 件同名跳过(冲突处理:跳过)。导入前自动备份。\').then(function(ok){flashBtn(this,ok?\'✓ 已复制\':\'✗ 复制失败\',2000)}.bind(this))">确认导入(同名跳过)</button>'
    +'<button class="copy ghost" onclick="safeWriteText(\'确认导入:'+esc(pv.items_total||0)+' 件,同名覆盖(冲突处理:覆盖)。导入前自动备份。\').then(function(ok){flashBtn(this,ok?\'✓ 已复制\':\'✗ 复制失败\',2000)}.bind(this))">确认导入(同名覆盖)</button>'
    +'</div></section>';
}
var doneHtml='';
if(imp.imported!=null){
  doneHtml='<section><h2 class="ok">✅ 导入完成</h2>'
    +'<div class="row"><div class="k">新增</div><div class="v" class="ok">'+esc(String(imp.imported))+'</div></div>'
    +'<div class="row"><div class="k">跳过</div><div class="v">'+esc(String(imp.skipped||0))+'</div></div>'
    +'<div class="row"><div class="k">覆盖</div><div class="v">'+esc(String(imp.overwritten||0))+'</div></div>'
    +(imp.backup_file?'<div class="row"><div class="k">导入前备份</div><div class="v">'+esc(imp.backup_file)+'</div></div>':'')
    +'<div class="actions">'
    +(imp.backup_file?'<button class="copy ghost" onclick="safeWriteText(\'请撤销刚才的导入,用导入前备份恢复:\'+this.dataset.f+\'。\').then(function(ok){flashBtn(this,ok?\'✓ 已复制\':\'✗ 复制失败\',2000)}.bind(this))" data-f="'+esc(imp.backup_file)+'">撤销导入(恢复导入前状态)</button>':'')
    +'</div></section>';
}
if(err.action){app.innerHTML='<section><h2 class="bad">'+esc(err.action)+'失败</h2><p class="bad" style="font-weight:600">'+esc(err.reason||'')+'</p><p>'+esc(err.suggest||'')+'</p></section>';return;}
var copyDataBtn='<button class="copy alt" onclick="safeWriteText(\''+JSON.stringify(cd).replace(/'/g,"&#39;").replace(/"/g,'&quot;')+'\').then(function(ok){flashBtn(this,ok?\'✓ 已复制\':\'✗ 复制失败\',2000)}.bind(this))">复制数据</button>';
var copyLogBtn='<button class="copy ghost" onclick="safeWriteText(\''+JSON.stringify(cl).replace(/'/g,"&#39;").replace(/"/g,'&quot;')+'\').then(function(ok){flashBtn(this,ok?\'✓ 已复制\':\'✗ 复制失败\',2000)}.bind(this))">复制日志</button>';
app.innerHTML=''+stepsHtml+chooseHtml+previewHtml+doneHtml+'<section><h2>动作</h2><div class="actions">'+copyDataBtn+copyLogBtn+'</div></section>';
}
render();
</script>
</body>
</html>
