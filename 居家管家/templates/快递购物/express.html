<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>居家管家 · 快递跟踪</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--fg:#1d1d1f;--fg2:#6e6e73;--fg3:#86868b;--bg:#f5f5f7;--card:#fff;--line:#d2d2d7;--blue:#007aff;--green:#34c759;--orange:#ff9500;--red:#ff3b30;--soft:#f5f8ff;--shadow:0 1px 2px rgba(0,0,0,.04),0 12px 36px rgba(0,0,0,.06)}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--fg);line-height:1.65;-webkit-font-smoothing:antialiased}
.wrap{max-width:980px;margin:0 auto;padding:56px 22px 90px}
.hero{background:linear-gradient(180deg,#fff,#f8fbff);border-radius:28px;padding:34px;box-shadow:var(--shadow);margin-bottom:18px}
.eyebrow{color:var(--blue);font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px}
h1{font-size:34px;letter-spacing:-.035em;line-height:1.12;margin-bottom:10px}
.lead{color:var(--fg2);font-size:16px;max-width:760px}
section{background:var(--card);border-radius:20px;padding:22px;box-shadow:0 1px 3px rgba(0,0,0,.04);margin:18px 0}
h2{font-size:20px;letter-spacing:-.02em;margin-bottom:12px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.card{background:var(--card);border-radius:18px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.04);border:1px solid #eee}
.photo{width:100%;height:140px;border-radius:12px;background:#f0f3f8;overflow:hidden;margin-bottom:10px}.photo img{width:100%;height:100%;object-fit:cover}
.photo.empty{display:flex;align-items:center;justify-content:center;color:var(--fg3);font-size:13px}
.card h3{font-size:17px}.reason{color:var(--fg3);font-size:12px;margin:4px 0 8px}
.pill{display:inline-block;border:1px solid var(--line);background:#fbfbfd;border-radius:999px;padding:3px 9px;margin:2px;font-size:12px;white-space:nowrap}
.badge{display:inline-block;border-radius:999px;padding:2px 9px;margin:2px;font-size:12px;font-weight:700;white-space:nowrap}
.badge.days{background:#eef5ff;color:#0a63ce}.badge.overdue{background:#ffe8e6;color:var(--red)}
.empty{padding:26px 0;text-align:center;color:var(--fg3)}
.ok{color:var(--green)}.warn{color:var(--orange)}.bad{color:var(--red)}
.copy{border:none;background:var(--blue);color:#fff;border-radius:999px;padding:9px 14px;font-weight:700;cursor:pointer;margin:6px 6px 0 0;font-size:14px}.copy.alt{background:#1d1d1f}.copy.ghost{background:#fff;color:var(--blue);border:1.5px solid var(--blue)}.copy.green{background:var(--green)}
.actions{margin-top:14px;text-align:right}
@media(max-width:820px){.wrap{padding:30px 14px 70px}.hero{padding:26px 20px}h1{font-size:26px}}
</style>
</head>
<body>
<div class="wrap">
<div id="app"></div>
</div>
<script id="payload" type="application/json"><!--INJECT-DATA--></script>
<script>
<!--SHARED-HELPERS-->
const app=document.getElementById('app');
function render(){
let payload;
try{payload=JSON.parse(document.getElementById('payload').textContent)}catch(e){app.innerHTML='<section><h2 class="bad">数据解析失败</h2></section>';return}
const d=payload.data||{};const s=d.scene||{};
let html=metaHeader(payload,{title:s.summary&&s.summary.title||'快递跟踪',lead:s.lead||'确认收货后状态变更为在家/备用;超过 '+esc(s.timeout_days)+' 天为超时',stage:'查看'});
if(s.items.length){
  html+=`<section><h2>快递中 ${esc(s.items.length)} 件</h2><div class="cards" id="cards">${s.items.map(it=>`
  <div class="card">
  <input type="checkbox" data-id="${it.id}" data-name="${esc(it.name)}" data-qty="${esc(it.quantity)}" style="width:20px;height:20px;accent-color:var(--blue);margin-bottom:8px;cursor:pointer">
  <div class="photo ${it.photo_base64?'':'empty'}">${it.photo_base64?'<img src="data:image/jpeg;base64,'+it.photo_base64+'">':'无照片'}</div>
  <h3>${esc(it.name)} <span class="badge ${it.overdue?'overdue':'days'}">已等 ${esc(it.days)} 天${it.overdue?' · 超时':''}</span></h3>
  <div class="reason">${esc(it.category_name)} · ${esc(it.location)} ×${esc(it.quantity)}</div>
  <div><span class="pill">快递中</span> <span class="pill">ID ${it.id}</span></div>
  <div class="actions">
  <button class="copy ghost" onclick="copyText('确认收货(居家管家): item id='+it.id+'「${esc(it.name)}」已收到,状态改为在家。${it.quantity>1?'数量已确认:×'+it.quantity:''}')">确认收货</button>
  ${it.overdue?`<button class="copy ghost" onclick="copyText('快递超时处理(居家管家): 「${esc(it.name)}」已等 ${esc(it.days)} 天,帮我联系卖家或标记遗失')">超时处理</button>`:''}
  </div></div>`).join('')}</div>
  <div class="actions"><button class="copy green" onclick="receive()">确认收货(勾选→在家)</button></div></section>`;
}else{
  html+=`<section><div class="empty">📭 当前没有快递中物品。</div></section>`;
}
html+=remindersBlock(payload);
html+=`<section><h2>操作</h2>${actionBar(payload,[
 {label:'收货→备用',text:'确认收货(居家管家): 勾选物品已收到,状态改为备用',kind:'ghost'},
 {label:'新物品→录入',text:'新到货录入(居家管家): 收到的新物品还没录入,帮我录入【名称/数量/位置】',kind:'ghost'}
])}</section>`;
app.innerHTML=html;
}
function receive(){
const sel=[...document.querySelectorAll('#cards input:checked')];
if(!sel.length){toast('请先勾选已收到的物品');return;}
const ids=sel.map(c=>c.dataset.id).join(',');
copyText('确认收货(居家管家): 已收到 item ids='+ids+',状态改为在家');
}
render();
</script>
</body>
</html>
