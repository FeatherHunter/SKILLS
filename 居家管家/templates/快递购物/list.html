<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>居家管家 · 购物清单</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--fg:#1d1d1f;--fg2:#6e6e73;--fg3:#86868b;--bg:#f5f5f7;--card:#fff;--line:#d2d2d7;--blue:#007aff;--green:#34c759;--orange:#ff9500;--red:#ff3b30;--soft:#f5f8ff;--shadow:0 1px 2px rgba(0,0,0,.04),0 12px 36px rgba(0,0,0,.06)}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--fg);line-height:1.65;-webkit-font-smoothing:antialiased}
.wrap{max-width:980px;margin:0 auto;padding:56px 22px 90px}
.hero{background:linear-gradient(180deg,#fff,#f8fbff);border-radius:28px;padding:34px;box-shadow:var(--shadow);margin-bottom:18px}
.eyebrow{color:var(--blue);font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px}
h1{font-size:34px;letter-spacing:-.035em;line-height:1.12;margin-bottom:10px}
.lead{color:var(--fg2);font-size:16px;max-width:760px}
section{background:var(--card);border-radius:20px;padding:22px;box-shadow:0 1px 3px rgba(0,0,0,.04);margin:18px 0}
h2{font-size:20px;letter-spacing:-.02em;margin-bottom:12px}
.row{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid #ececf1}
.row:last-child{border-bottom:none}
.row input[type=checkbox]{width:20px;height:20px;accent-color:var(--blue);flex:none;cursor:pointer}
.name{font-weight:700;flex:1;min-width:0;word-break:break-word}
.pill{display:inline-block;border:1px solid var(--line);background:#fbfbfd;border-radius:999px;padding:3px 9px;margin:2px;font-size:12px;white-space:nowrap}
.tag{background:#eef5ff;color:#0a63ce;border-radius:999px;padding:3px 9px;margin:2px;font-size:12px;display:inline-block;white-space:nowrap}
.tag.manual{background:#f2f2f7;color:#6e6e73}
.tag.routine{background:#e8f7ee;color:#0a7a3d}
.note{color:var(--fg3);font-size:12px;margin-top:4px}
.dupe{background:#fff8e6;border:1.5px solid #ffe3a1;border-radius:14px;padding:12px 16px;margin:14px 0;font-size:14px}
.empty{padding:26px 0;text-align:center;color:var(--fg3)}
.ok{color:var(--green)}.warn{color:var(--orange)}.bad{color:var(--red)}
.copy{border:none;background:var(--blue);color:#fff;border-radius:999px;padding:9px 14px;font-weight:700;cursor:pointer;margin:6px 6px 0 0;font-size:14px}.copy.alt{background:#f2f2f7;color:#1d1d1f;border:1.5px solid var(--line)}.copy.ghost{background:#fff;color:var(--blue);border:1.5px solid var(--blue)}.copy.green{background:var(--green)}.stage{display:inline-block;margin-left:8px;padding:2px 10px;border-radius:999px;background:#eef5ff;color:#0a63ce;font-size:12px;font-weight:700;vertical-align:middle}.copy.danger{background:#fff;color:var(--red);border:1.5px solid #ffb4ae}
.actions{margin-top:14px;text-align:right}
@media(max-width:820px){.wrap{padding:30px 14px 70px}.hero{padding:26px 20px}h1{font-size:26px}.eyebrow{font-size:11px;letter-spacing:.06em}.eyebrow .t{display:block;white-space:nowrap;margin-top:2px}.actions .copy.wide{grid-column:1/-1}.row{flex-wrap:wrap}.row .name{flex:1 1 100%;order:-1}.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;text-align:left}.actions .copy{width:100%;margin:0;white-space:nowrap;font-size:13.5px;text-align:center;line-height:1.4;padding:11px 12px}.actions .copy.primary{grid-column:1/-1;font-size:15px;padding:13px 16px}}
</style>
</head>
<body>
<div class="wrap">
<div id="app"></div>
</div>
<script id="payload" type="application/json"><!--INJECT-DATA--></script>
<script>
<!--SHARED-HELPERS-->
const app=document.getElementById('app');
function srcBadge(it){
  if(it.routine)return '<span class="tag routine">'+(it.routine==='每周'?'每周自动提醒':'每月自动提醒')+'</span>';
  if(it.source==='缺货检测')return '<span class="tag">缺货检测加的</span>';
  return '<span class="tag manual">手动记的</span>';
}
function render(){
let payload;
try{payload=JSON.parse(document.getElementById('payload').textContent)}catch(e){app.innerHTML='<section><h2 class="bad">数据解析失败</h2></section>';return}
const d=payload.data||{};const s=d.scene||{};
window.__hmPayload=payload;
let html=metaHeader(payload,{title:s.summary&&s.summary.title||'购物清单',lead:s.lead||'勾选买到的条目，点「我买到了」划掉',stage:'浏览清单'});
if(s.summary&&s.summary.metrics&&s.summary.metrics.length){html+=`<section style="display:flex;gap:10px;flex-wrap:wrap;padding:16px 22px;margin-top:0">${s.summary.metrics.map(m=>{const z=/^0/.test(m.value);return `<span class="pill" style="font-size:14px;padding:6px 14px">${esc(m.label)} <b style="color:${z?'var(--fg3)':'var(--blue)'}">${esc(m.value)}</b></span>`;}).join('')}</section>`;}
if(s.dupes&&s.dupes.length){html+=`<div class="dupe">⚠️ 清单内查重：${esc(s.dupes.join('、'))} 在清单中重复出现，别买重 — 建议合并为一条。</div>`;}
if(s.items.length){
  html+=`<section><h2>待买条目</h2><div class="list" id="list">${s.items.map(it=>`
  <div class="row"><input type="checkbox" data-id="${it.id}" data-name="${esc(it.name)}" data-qty="${esc(it.quantity)}">
  <div style="flex:1"><div class="name">${esc(it.name)} ${srcBadge(it)}</div><div class="note">×${esc(it.quantity)}${it.note?' · '+esc(it.note):''}</div></div></div>`).join('')}</div></section>`;
  html+=`<section><div class="actions">
  <button class="copy" onclick="checkoff()">我买到了</button>
  <button class="copy ghost" onclick="copyText('请加载「居家管家」技能,帮我录入新买的物品(唤醒词:录物品):\\n\\n  名  称: ___\\n  数  量(1): ___\\n  位  置: ___')">清单外新买的</button>
  <button class="copy ghost" onclick="copyText('请加载「居家管家」技能,帮我给物品补数量(唤醒词:数量变更):\\n\\n  名  称: ___\\n  数  量(1): ___')">给已有物品补货</button>
  <button class="copy ghost" onclick="copyText('请加载「居家管家」技能,帮我添加购物清单条目(唤醒词:购物清单):\\n\\n  物  品: ___\\n  数  量(1): ___\\n  周  期(每周/每月): ___')">记一笔要买的</button>
  <button class="copy ghost" onclick="copyText('请加载「居家管家」技能,帮我检测缺货(唤醒词:缺货检测):\\n\\n  范  围(全屋): ___')">检测家里缺什么</button>
  <button class="copy danger" onclick="copyText('请加载「居家管家」技能,帮我清理已买的购物清单条目(唤醒词:购物清单):')">清掉已买记录</button>
  <button class="copy alt" onclick="copyText(buildDataText(window.__hmPayload))">复制数据</button>
  <button class="copy alt" onclick="copyText(buildLogText(window.__hmPayload))">复制日志</button>
  </div></section>`;
}else{
  html+=`<section><div class="empty">清单是空的。<br><br>试试:<button class="copy ghost" onclick="copyText('请加载「居家管家」技能,帮我检测缺货(唤醒词:缺货检测):\\n\\n  范  围(全屋): ___')">检测家里缺什么</button> <button class="copy ghost" onclick="copyText('请加载「居家管家」技能,帮我添加购物清单条目(唤醒词:购物清单):\\n\\n  物  品: ___\\n  数  量(1): ___\\n  周  期(每周/每月): ___')">记一笔要买的</button></div></section>`;
}
html+=remindersBlock(payload);
app.innerHTML=html;
}
function checkoff(){
const sel=[...document.querySelectorAll('#list input:checked')];
if(!sel.length){toast('请先勾选买到的条目');return;}
const ids=sel.map(c=>c.dataset.id).join(',');
const items=sel.map(c=>c.dataset.name+'×'+c.dataset.qty).join('、');
copyText('请加载「居家管家」技能,帮我标记购物清单条目已买到(唤醒词:购物清单):\n\n  条  目(已勾选): '+items+' [ids='+ids+']');
}
render();
</script>
</body>
</html>
