<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>居家管家 · 购物清单</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--fg:#1d1d1f;--fg2:#6e6e73;--fg3:#86868b;--bg:#f5f5f7;--card:#fff;--line:#d2d2d7;--blue:#007aff;--green:#34c759;--orange:#ff9500;--red:#ff3b30;--soft:#f5f8ff;--shadow:0 1px 2px rgba(0,0,0,.04),0 12px 36px rgba(0,0,0,.06)}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--fg);line-height:1.65;-webkit-font-smoothing:antialiased}
.wrap{max-width:980px;margin:0 auto;padding:56px 22px 90px}
.hero{background:linear-gradient(180deg,#fff,#f8fbff);border-radius:28px;padding:34px;box-shadow:var(--shadow);margin-bottom:18px}
.eyebrow{color:var(--blue);font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px}
h1{font-size:34px;letter-spacing:-.035em;line-height:1.12;margin-bottom:10px}
.lead{color:var(--fg2);font-size:16px;max-width:760px}
section{background:var(--card);border-radius:20px;padding:22px;box-shadow:0 1px 3px rgba(0,0,0,.04);margin:18px 0}
h2{font-size:20px;letter-spacing:-.02em;margin-bottom:12px}
.row{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid #ececf1}
.row:last-child{border-bottom:none}
.row input[type=checkbox]{width:20px;height:20px;accent-color:var(--blue);flex:none;cursor:pointer}
.name{font-weight:700;flex:1;min-width:0;word-break:break-word}
.pill{display:inline-block;border:1px solid var(--line);background:#fbfbfd;border-radius:999px;padding:3px 9px;margin:2px;font-size:12px;white-space:nowrap}
.tag{background:#eef5ff;color:#0a63ce;border-radius:999px;padding:3px 9px;margin:2px;font-size:12px;display:inline-block;white-space:nowrap}
.tag.manual{background:#f2f2f7;color:#6e6e73}
.tag.routine{background:#e8f7ee;color:#0a7a3d}
.note{color:var(--fg3);font-size:12px;margin-top:4px}
.dupe{background:#fff8e6;border:1.5px solid #ffe3a1;border-radius:14px;padding:12px 16px;margin:14px 0;font-size:14px}
.empty{padding:26px 0;text-align:center;color:var(--fg3)}
.ok{color:var(--green)}.warn{color:var(--orange)}.bad{color:var(--red)}
.copy{border:none;background:var(--blue);color:#fff;border-radius:999px;padding:9px 14px;font-weight:700;cursor:pointer;margin:6px 6px 0 0;font-size:14px}.copy.alt{background:#1d1d1f}.copy.ghost{background:#fff;color:var(--blue);border:1.5px solid var(--blue)}.copy.green{background:var(--green)}
.actions{margin-top:14px;text-align:right}
@media(max-width:820px){.wrap{padding:30px 14px 70px}.hero{padding:26px 20px}h1{font-size:26px}.row{flex-wrap:wrap}.row .name{flex:1 1 100%;order:-1}}
</style>
</head>
<body>
<div class="wrap">
<div id="app"></div>
</div>
<script id="payload" type="application/json"><!--INJECT-DATA--></script>
<script>
<!--SHARED-HELPERS-->
const app=document.getElementById('app');
function srcBadge(it){
  if(it.routine)return '<span class="tag routine">例行·'+esc(it.routine)+'</span>';
  if(it.source==='缺货检测')return '<span class="tag">缺货检测</span>';
  return '<span class="tag manual">手动</span>';
}
function render(){
let payload;
try{payload=JSON.parse(document.getElementById('payload').textContent)}catch(e){app.innerHTML='<section><h2 class="bad">数据解析失败</h2></section>';return}
const d=payload.data||{};const s=d.scene||{};
let html=metaHeader(payload,{title:s.summary&&s.summary.title||'购物清单',lead:s.lead||'勾选销项;采购闭环:买完回家 → 新物品录入 / 已有物品补数量',stage:'查看'});
if(s.dupes&&s.dupes.length){html+=`<div class="dupe">⚠️ 清单内查重:${esc(s.dupes.join('、'))} 在清单中重复出现,别买重 — 建议合并为一条。</div>`;}
if(s.items.length){
  html+=`<section><h2>待买 ${esc(s.items.length)} 条</h2><div class="list" id="list">${s.items.map(it=>`
  <div class="row"><input type="checkbox" data-id="${it.id}" data-name="${esc(it.name)}" data-qty="${esc(it.quantity)}">
  <div style="flex:1"><div class="name">${esc(it.name)} ${srcBadge(it)}</div><div class="note">×${esc(it.quantity)}${it.note?' · '+esc(it.note):''}</div></div>
  <span class="pill">ID ${it.id}</span></div>`).join('')}</div></section>`;
  html+=`<section><h2>采购闭环(买完回家)</h2>
  <p class="lead" style="font-size:14px">勾选已买的条目后点「销项」;新买的物品走录入、已有物品补数量,AI 会引导完成闭环。</p>
  <div class="actions">
  <button class="copy green" onclick="checkoff()">销项(已买·勾选)</button>
  <button class="copy" onclick="copyText('新物品录入(居家管家): 买回的新物品还没录入,帮我录入【新物品名称/数量/位置】')">新物品录入(1-1)</button>
  <button class="copy ghost" onclick="copyText('补数量(居家管家): 给已有物品补数量【名称+补几个】')">已有物品补数量(3-3)</button>
  </div></section>`;
}else{
  html+=`<section><div class="empty">清单是空的。<br><br>试试:<button class="copy" onclick="copyText('缺货检测(居家管家): 帮我检测家里缺什么')">缺货检测(自动填清单)</button> <button class="copy ghost" onclick="copyText('添加购物清单条目(居家管家): 【物品名+数量】')">手动添加</button></div></section>`;
}
html+=remindersBlock(payload);
html+=`<section><h2>操作</h2>${actionBar(payload,[
 {label:'添加条目',text:'添加购物清单条目(居家管家): 【物品名+数量】\n【例行周期(每周/每月,选填)】',kind:'ghost'},
 {label:'缺货检测',text:'缺货检测(居家管家): 帮我检测家里缺什么',kind:'ghost'},
 {label:'清空已完成',text:'清理购物清单(居家管家): 把已买的条目从清单移除',kind:'ghost'}
])}</section>`;
app.innerHTML=html;
}
function checkoff(){
const sel=[...document.querySelectorAll('#list input:checked')];
if(!sel.length){toast('请先勾选已买的条目');return;}
const ids=sel.map(c=>c.dataset.id).join(',');
const names=sel.map(c=>c.dataset.name).join('、');
copyText('销项已买(居家管家): 购物清单条目 ids='+ids+' 已买,标记为已买。条目:'+names);
}
render();
</script>
</body>
</html>
