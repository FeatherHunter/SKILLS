<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>居家管家 · 筛选浏览</title>
<style>
.actions .copy.wide{grid-column:1/-1;background:var(--blue);color:#fff;border:none}

button{-webkit-tap-highlight-color:transparent;touch-action:manipulation;-webkit-touch-callout:none}button:focus{outline:none}button::-moz-focus-inner{border:0}

*{box-sizing:border-box;margin:0;padding:0}
:root{--fg:#1d1d1f;--fg2:#6e6e73;--fg3:#86868b;--bg:#f5f5f7;--card:#fff;--line:#d2d2d7;--blue:#007aff;--green:#34c759;--orange:#ff9500;--red:#ff3b30;--soft:#f5f8ff;--shadow:0 1px 2px rgba(0,0,0,.04),0 12px 36px rgba(0,0,0,.06)}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--fg);line-height:1.65;-webkit-font-smoothing:antialiased}
.wrap{max-width:1080px;margin:0 auto;padding:56px 22px 90px}
.hero{background:linear-gradient(180deg,#fff,#f8fbff);border-radius:28px;padding:34px;box-shadow:var(--shadow);margin-bottom:18px}
.eyebrow{color:var(--blue);font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px}
h1{font-size:34px;letter-spacing:-.035em;line-height:1.12;margin-bottom:10px}
.lead{color:var(--fg2);font-size:16px}
section{background:var(--card);border-radius:20px;padding:22px;box-shadow:0 1px 3px rgba(0,0,0,.04);margin:18px 0}
h2{font-size:20px;letter-spacing:-.02em;margin-bottom:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 14px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:9px 15px;font-size:13px;font-weight:600;min-height:38px;cursor:pointer}.stat-chip{background:#f2f2f7;color:var(--fg2);border-radius:999px;padding:5px 13px;font-size:12.5px;font-weight:600}.chip.on{border-color:var(--blue);background:var(--soft);color:var(--blue);font-weight:700}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.mini{background:var(--card);border-radius:14px;padding:12px;border:1px solid #eee}
.mini b{display:block;font-size:14px}.mini .loc{color:var(--fg2);font-size:12px}.mini .meta{color:var(--fg3);font-size:12px}
.tag{background:#eef5ff;color:#0a63ce;border-radius:999px;padding:3px 9px;margin:2px;font-size:12px;display:inline-block}
.empty{color:var(--fg3)}
.copy{border:none;background:var(--blue);color:#fff;border-radius:999px;padding:10px 12px;font-weight:700;cursor:pointer;margin:0;font-size:13.5px;min-height:44px;min-width:0;flex:1 1 0;display:inline-flex;align-items:center;justify-content:center;white-space:nowrap;box-sizing:border-box}.copy.alt{background:#1d1d1f}.copy.ghost{background:#fff;color:var(--blue);border:1.5px solid var(--blue)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
@media(max-width:820px){.wrap{padding:30px 14px 70px}.hero{padding:26px 20px}h1{font-size:26px}}
</style>
</head>
<body>
<div class="wrap">
<div id="app"></div>
</div>
<script id="payload" type="application/json"><!--INJECT-DATA--></script>
<script>
<!--SHARED-HELPERS-->
const app=document.getElementById('app');
let curGroup='all';
function render(){
let payload;
try{payload=JSON.parse(document.getElementById('payload').textContent)}catch(e){app.innerHTML='<section><h2 class="bad">数据解析失败</h2></section>';return}
const d=payload.data||{};const s=d.scene||{};
const gbName={'category':'分类','location':'位置','tag':'标签'}[s.group_by]||s.group_by||'分类';
const hero=metaHeader(payload,{title:s.summary&&s.summary.title||'筛选浏览',lead:'探索式查找 · 按 '+gbName+' 分组 · 本地可切换排序/分组',stage:''});
let html=hero;
html+=`<section><h2>计数</h2><div class="row" style="display:flex;gap:8px;flex-wrap:wrap">${(s.summary&&s.summary.metrics||[]).map(m=>'<span class="stat-chip">'+esc(m.label)+' '+esc(m.value)+'</span>').join('')}</div>
<div class="chips"><button class="chip" data-g="all">全部</button>${(s.groups||[]).map(g=>'<button class="chip" data-g="'+esc(g.name)+'">'+esc(g.name)+' ('+g.items.length+')</button>').join('')}</div>
<button class="copy ghost" data-gb="${esc(gbName)}" onclick="copyText('请加载「居家管家」技能,帮我按条件浏览物品(唤醒词:筛选浏览):\\n\\n  分  组(当前:'+this.dataset.gb+',可切 分类/位置/标签): ______')">分组:${esc(gbName)}</button>
</section>`;
html+='<div id="groups">'+((s.groups||[]).map(g=>`<section class="grp" data-g="${esc(g.name)}" ${g.name===curGroup||curGroup==='all'?'':'style="display:none"'}><h2>${esc(g.name)} <span class="pill" style="font-size:12px">${g.items.length}</span></h2><div class="cards">${g.items.map(it=>`<div class="mini"><b>${esc(it.name)} <span class="pill" style="font-size:11px">ID ${it.id}</span></b><div class="loc">📍 ${esc(it.location||'(未设置)')} ×${esc(it.quantity??1)}</div><div class="meta">${esc(it.status)} · ${it.purchase_price!=null?'¥'+esc(it.purchase_price):''}</div>${(it.tags||[]).map(t=>'<span class="tag">'+esc(t)+'</span>').join('')}</div>`).join('')}</div></section>`).join('')||'<section><p class="empty">无匹配物品</p></section>')+'</div>';
html+=actionBar(payload,[{label:'排序:相关',text:'请加载「居家管家」技能,帮我按条件浏览物品(唤醒词:筛选浏览):\n\n  排  序(录入时间/价格/名称): ______',kind:'wide'}]);
app.innerHTML=html;
document.querySelectorAll('.chip[data-g]').forEach(c=>c.addEventListener('click',()=>{curGroup=c.dataset.g;document.querySelectorAll('.grp').forEach(x=>x.style.display=(curGroup==='all'||x.dataset.g===curGroup)?'':'none');document.querySelectorAll('.chip[data-g]').forEach(o=>o.classList.toggle('on',o===c));}));
}
render();
</script>
</body>
</html>
