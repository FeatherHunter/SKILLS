<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>居家管家 · 查重复</title>
<style>
.actions .copy.wide{grid-column:1/-1;background:var(--blue);color:#fff;border:none}

button{-webkit-tap-highlight-color:transparent;touch-action:manipulation;-webkit-touch-callout:none}button:focus{outline:none}button::-moz-focus-inner{border:0}

*{box-sizing:border-box;margin:0;padding:0}
.dup-note{background:#fff8f2;border:1px solid #ffd9b0;border-radius:10px;padding:8px 12px;font-size:12.5px;color:#7a4a12;margin-top:10px}
.dup-detail{margin-top:10px}.dup-detail summary{background:#f2f2f7;border-radius:10px;padding:9px 14px;font-size:13px;font-weight:600;color:var(--fg2);cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between}.dup-detail summary::after{content:"⌄";font-size:14px;color:var(--fg3)}.dup-detail[open] summary::after{content:"⌃"}.dup-detail .mini-row{font-size:12.5px;color:var(--fg2);padding:7px 4px;border-bottom:1px solid var(--line);font-family:ui-monospace,Menlo,Consolas,monospace}
:root{--fg:#1d1d1f;--fg2:#6e6e73;--fg3:#86868b;--bg:#f5f5f7;--card:#fff;--line:#d2d2d7;--blue:#007aff;--green:#34c759;--orange:#ff9500;--red:#ff3b30;--soft:#f5f8ff;--shadow:0 1px 2px rgba(0,0,0,.04),0 12px 36px rgba(0,0,0,.06)}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--fg);line-height:1.65;-webkit-font-smoothing:antialiased}
.wrap{max-width:1080px;margin:0 auto;padding:56px 22px 90px}
.hero{background:linear-gradient(180deg,#fff,#f8fbff);border-radius:28px;padding:34px;box-shadow:var(--shadow);margin-bottom:18px}
.eyebrow{color:var(--blue);font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px}
h1{font-size:34px;letter-spacing:-.035em;line-height:1.12;margin-bottom:10px}
.lead{color:var(--fg2);font-size:16px}
section{background:var(--card);border-radius:20px;padding:22px;box-shadow:0 1px 3px rgba(0,0,0,.04);margin:18px 0}
h2{font-size:20px;letter-spacing:-.02em;margin-bottom:12px}
.card{background:var(--card);border-radius:16px;padding:16px;border:1px solid #eee;margin:12px 0}
.pill{display:inline-block;border:1px solid var(--line);background:#fbfbfd;border-radius:999px;padding:3px 9px;margin:2px;font-size:12px}
.row{display:grid;grid-template-columns:150px 1fr;gap:12px;padding:8px 0;border-bottom:1px solid #ececf1}.k{color:var(--fg2)}.v{font-weight:600}
.ok{color:var(--green)}.bad{color:var(--red)}.empty{color:var(--fg3)}
.copy{border:none;background:var(--blue);color:#fff;border-radius:999px;padding:10px 12px;font-weight:700;cursor:pointer;margin:0;font-size:13.5px;min-height:44px;min-width:0;flex:1 1 0;display:inline-flex;align-items:center;justify-content:center;white-space:nowrap;box-sizing:border-box}.copy.alt{background:#1d1d1f}.copy.ghost{background:#fff;color:var(--blue);border:1.5px solid var(--blue)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
@media(max-width:820px){.wrap{padding:30px 14px 70px}.hero{padding:26px 20px}h1{font-size:26px}}
</style>
</head>
<body>
<div class="wrap">
<div id="app"></div>
</div>
<script id="payload" type="application/json"><!--INJECT-DATA--></script>
<script>
<!--SHARED-HELPERS-->
const app=document.getElementById('app');
function mergePrompt(el){var g=JSON.parse(el.dataset.g);var ids=g.items.map(function(x){return x.id;});return '请加载「居家管家」技能,帮我合并重复物品(唤醒词:合并物品):\n\n  保  留: '+g.name+'(当前 ID '+ids[0]+')\n  并  入: '+ids.slice(1).join('、')+(ids.length>1?'(共 '+ids.length+' 条)':'');}
function render(){
let payload;
try{payload=JSON.parse(document.getElementById('payload').textContent)}catch(e){app.innerHTML='<section><h2 class="bad">数据解析失败</h2></section>';return}
const d=payload.data||{};const s=d.scene||{};
const hero=metaHeader(payload,{title:'查重复 · 我是不是买重了',lead:s.group_count?('发现 '+s.group_count+' 组重复,共 '+s.total_duplicate_items+' 件'):'没有发现重复物品',stage:'查看'});
let html=hero;
if(!s.group_count){
  html+=`<section><p class="ok">✅ 无重复,放心。</p><div class="actions"><button class="copy" onclick="copyText('请加载「居家管家」技能,帮我录入一件新物品(唤醒词:录物品):\\n\\n  名  称: ______')">独立录入</button></div></section>`;
}else{
(s.groups||[]).forEach(g=>{
  const first=g.items[0]||{};
  html+=`<section><h2>${esc(g.name)} <span class="pill">${g.count} 件重复</span></h2>
  <div class="card">
    <div class="row"><div class="k">位置/数量</div><div class="v">📍 ${esc(first.location||'(未设置)')} ×${esc(first.quantity??1)} <span class="pill">${esc(first.status||'')}</span></div></div>
    <div class="row"><div class="k">分类</div><div class="v">${esc(first.category_name||'')}</div></div>
    <div class="row"><div class="k">价格</div><div class="v">${first.purchase_price!=null?'¥'+esc(first.purchase_price):'<span class="empty">-</span>'}</div></div>
    ${g.count>1?'<div class="dup-note">⚠ 该条目被重复记录了 '+g.count+' 次,建议合并为 1 条</div>':''}
  </div>
  ${g.count>1?`<details class="dup-detail"><summary>查看全部 ${g.count} 条明细</summary>${g.items.map(it=>`<div class="mini-row">#${it.id} · ${esc(it.location||'(未设置)')} ×${esc(it.quantity??1)} · ${esc(it.status||'')}</div>`).join('')}</details>`:''}
  <div class="actions"><button class="copy wide" data-g="${esc(JSON.stringify(g)).replace(/"/g,'&quot;')}" onclick="copyText(mergePrompt(this))">复制合并建议</button></div>
  </section>`;
});
}
html+=remindersBlock(payload);
html+=actionBar(payload);
app.innerHTML=html;
}
render();
</script>
</body>
</html>
