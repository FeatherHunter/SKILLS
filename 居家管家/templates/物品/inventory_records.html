<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>居家管家 · 盘点记录</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--fg:#1d1d1f;--fg2:#6e6e73;--fg3:#86868b;--bg:#f5f5f7;--card:#fff;--line:#d2d2d7;--blue:#007aff;--green:#34c759;--orange:#ff9500;--red:#ff3b30;--soft:#f5f8ff;--shadow:0 1px 2px rgba(0,0,0,.04),0 12px 36px rgba(0,0,0,.06)}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--fg);line-height:1.65;-webkit-font-smoothing:antialiased}
.wrap{max-width:980px;margin:0 auto;padding:56px 22px 90px}
.hero{background:linear-gradient(180deg,#fff,#f8fbff);border-radius:28px;padding:34px;box-shadow:var(--shadow);margin-bottom:18px}
.eyebrow{color:var(--blue);font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px}
h1{font-size:32px;letter-spacing:-.035em;line-height:1.12;margin-bottom:10px}
.lead{color:var(--fg2);font-size:16px}
section{background:var(--card);border-radius:20px;padding:22px;box-shadow:0 1px 3px rgba(0,0,0,.04);margin:18px 0}
h2{font-size:20px;letter-spacing:-.02em;margin-bottom:12px}
.rec{border:1px solid #eef0f4;border-radius:16px;padding:14px;margin:10px 0}
.rec .top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.rec .nm{font-weight:700;font-size:15px}
.pill{display:inline-block;border:1px solid var(--line);background:#fbfbfd;border-radius:999px;padding:3px 9px;margin:2px;font-size:12px}
.detail{margin-top:10px;border-top:1px solid #ececf1;padding-top:10px;font-size:13px;color:var(--fg2)}
.empty{color:var(--fg3)}
.copy{border:none;background:var(--blue);color:#fff;border-radius:999px;padding:8px 13px;font-weight:700;cursor:pointer;margin:6px 6px 0 0;font-size:13px}.copy.alt{background:#1d1d1f}.copy.ghost{background:#fff;color:var(--blue);border:1.5px solid var(--blue)}
.actions{margin-top:12px;text-align:right}
@media(max-width:820px){.wrap{padding:30px 14px 70px}.hero{padding:26px 20px}h1{font-size:26px}}
</style>
</head>
<body>
<div class="wrap">
<div id="app"></div>
</div>
<script id="payload" type="application/json"><!--INJECT-DATA--></script>
<script>
<!--SHARED-HELPERS-->
const app=document.getElementById('app');
function render(){
let payload;
try{payload=JSON.parse(document.getElementById('payload').textContent)}catch(e){app.innerHTML='<section><h2 class="bad">数据解析失败</h2></section>';return}
const d=payload.data||{};const s=d.scene||{};
const hero=metaHeader(payload,{title:'盘点记录',lead:'留痕与复查闭环:盘点 = 物品历史事件(联动 7)',stage:'查看'});
let html=hero;
html+=`<section><h2>历史盘点(${s.records? s.records.length:0})</h2>${(s.records||[]).map(r=>`<div class="rec">
<div class="top"><span class="nm">#${r.id} · ${esc(r.scope||'')}</span><span class="pill">${esc(r.occurred_at)}</span><span class="pill">缺${r.missing_cnt} 多${r.extra_cnt} 异${r.diff_cnt} 待确认${r.pending_cnt}</span><span class="pill">${esc(r.status)}</span></div>
<div class="detail" style="display:none" data-d="${r.id}">${(r.detail||[]).map(x=>esc(JSON.stringify(x))).join('<br>')}</div>
<div class="actions"><button class="copy ghost" onclick="copyText('差异处理(居家管家): 记录 ${r.id}')">处理差异</button><button class="copy ghost" onclick="copyText('复查(居家管家): 上次缺的 ${r.missing_cnt} 件,重新盘点')">复查</button><button class="copy ghost" onclick="this.parentNode.previousElementSibling.style.display=this.parentNode.previousElementSibling.style.display==='none'?'block':'none'">展开详情</button></div>
</div>`).join('')||'<p class="empty">还没有盘点记录</p>'}</section>`;
html+=remindersBlock(payload);
html+=`<section><h2>通用操作</h2>${actionBar(payload,[{label:'开始盘点',text:'盘点(居家管家): 按位置/分类/全屋 开始一轮盘点',kind:'ghost'}])}</section>`;
app.innerHTML=html;
}
render();
</script>
</body>
</html>
