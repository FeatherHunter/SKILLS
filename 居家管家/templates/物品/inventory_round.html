<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>居家管家 · 盘点核对</title>
<style>
.actions .copy.wide{grid-column:1/-1;background:var(--blue);color:#fff;border:none}

button{-webkit-tap-highlight-color:transparent;touch-action:manipulation;-webkit-touch-callout:none}button:focus{outline:none}button::-moz-focus-inner{border:0}

*{box-sizing:border-box;margin:0;padding:0}
:root{--fg:#1d1d1f;--fg2:#6e6e73;--fg3:#86868b;--bg:#f5f5f7;--card:#fff;--line:#d2d2d7;--blue:#007aff;--green:#34c759;--orange:#ff9500;--red:#ff3b30;--soft:#f5f8ff;--shadow:0 1px 2px rgba(0,0,0,.04),0 12px 36px rgba(0,0,0,.06)}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--fg);line-height:1.65;-webkit-font-smoothing:antialiased}
.wrap{max-width:980px;margin:0 auto;padding:56px 22px 90px}
.hero{background:linear-gradient(180deg,#fff,#f6fbf7);border-radius:28px;padding:34px;box-shadow:var(--shadow);margin-bottom:18px}
.eyebrow{color:var(--green);font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px}
h1{font-size:32px;letter-spacing:-.035em;line-height:1.12;margin-bottom:10px}
.lead{color:var(--fg2);font-size:16px}
section{background:var(--card);border-radius:20px;padding:22px;box-shadow:0 1px 3px rgba(0,0,0,.04);margin:18px 0}
h2{font-size:20px;letter-spacing:-.02em;margin-bottom:12px}
.prog{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.bar{flex:1;height:10px;background:#ececf1;border-radius:999px;overflow:hidden}.bar span{display:block;height:100%;background:var(--green)}
.item{border:1px solid #eef0f4;border-radius:16px;padding:14px;margin:10px 0}
.item .top{display:flex;align-items:center;gap:10px}
.item .nm{flex:1;font-weight:700}
.tristate{display:flex;gap:8px;margin-top:10px}
.ts{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:6px 16px;font-size:13px;cursor:pointer}.ts.on{font-weight:800}
.ts[data-v="在"].on{background:var(--green);color:#fff;border-color:var(--green)}
.ts[data-v="不在"].on{background:var(--red);color:#fff;border-color:var(--red)}
.ts[data-v="不确定"].on{background:var(--orange);color:#fff;border-color:var(--orange)}
.qty-row{display:flex;gap:8px;align-items:center;margin-top:10px;font-size:13px;color:var(--fg2);flex-wrap:wrap}
.qty-row .qty{width:64px;padding:8px 10px;border:1.5px solid var(--line);border-radius:10px;font-size:13px;font-family:inherit;background:#fff;color:var(--fg);box-sizing:border-box;-webkit-appearance:none}
.qty-row .newloc{flex:1 1 130px;min-width:130px;padding:8px 12px;border:1.5px solid var(--line);border-radius:10px;font-size:13px;font-family:inherit;background:#fff;color:var(--fg);box-sizing:border-box;-webkit-appearance:none}
.qty-row .newloc::placeholder{color:var(--fg3)}
.qty-row .newstatus{max-width:140px;padding:8px 10px;border:1.5px solid var(--line);border-radius:10px;font-size:13px;font-family:inherit;background:#fff;color:var(--fg);box-sizing:border-box;-webkit-appearance:none;cursor:pointer}
.qty-row input:focus,.qty-row select:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(0,122,255,.12)}
.notpresent{background:#f7f8fa;border-radius:10px;padding:8px 12px;margin-top:10px;font-size:13px;color:var(--fg2)}
.review{background:#f2f8ff;border-radius:12px;padding:10px 14px;margin:8px 0;font-size:14px}
.pill{display:inline-block;border:1px solid var(--line);background:#fbfbfd;border-radius:999px;padding:3px 9px;margin:2px;font-size:12px}
.photo{width:52px;height:52px;border-radius:10px;background:#f0f3f8;overflow:hidden;flex:0 0 52px}.photo img{width:100%;height:100%;object-fit:cover}
.photo.empty{display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--fg3)}
.copy{border:none;background:var(--blue);color:#fff;border-radius:999px;padding:10px 12px;font-weight:700;cursor:pointer;margin:0;font-size:13.5px;min-height:44px;min-width:0;flex:1 1 0;display:inline-flex;align-items:center;justify-content:center;white-space:nowrap;box-sizing:border-box}.copy.alt{background:#1d1d1f}.copy.ghost{background:#fff;color:var(--blue);border:1.5px solid var(--blue)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.ok{color:var(--green)}.warn{color:var(--orange)}.bad{color:var(--red)}.empty{color:var(--fg3)}
@media(max-width:820px){.wrap{padding:30px 14px 70px}.hero{padding:26px 20px}h1{font-size:26px}}
</style>
</head>
<body>
<div class="wrap">
<div id="app"></div>
</div>
<script id="payload" type="application/json"><!--INJECT-DATA--></script>
<script>
<!--SHARED-HELPERS-->
const app=document.getElementById('app');
function render(){
let payload;
try{payload=JSON.parse(document.getElementById('payload').textContent)}catch(e){app.innerHTML='<section><h2 class="bad">数据解析失败</h2></section>';return}
const d=payload.data||{};const s=d.scene||{};
const hero=metaHeader(payload,{title:'盘点核对 · '+esc(s.scope&&s.scope.value||'全屋'),lead:'逐件确认:【在】【不在】【不确定】· 数量修正产生异 · 完成时汇报差异集',stage:'填写 → 确认完成'});
let html=hero;
if((s.review_items||[]).length){html+=`<section><h2>上次待复查(置顶)</h2>${s.review_items.map(r=>`<div class="review"><input type="checkbox" class="rv" value="${r.id}"> 上次缺的 <b>${esc(r.name||'#'+r.id)}</b> 这次在吗?勾选确认后移出</div>`).join('')}</section>`;}
html+=`<section><h2>核对清单</h2><div class="prog"><span class="ok" id="progTxt">0/${s.total||0}</span><div class="bar"><span id="progBar" style="width:0%"></span></div></div>
${(s.items||[]).map(it=>`
<div class="item" data-id="${it.id}" data-name="${esc(it.name)}">
<div class="top"><div class="photo ${it.photo_base64?'':'empty'}">${it.photo_base64?'<img src="data:image/png;base64,'+it.photo_base64+'">':'无图'}</div><div class="nm">${esc(it.name)} <span class="pill">ID ${it.id}</span></div><div><span class="pill">📍 ${esc(it.location||'(未设置)')}</span><span class="pill">×${esc(it.quantity??1)}</span><span class="pill">${esc(it.status)}</span></div></div>
<div class="tristate">${['在','不在','不确定'].map(v=>'<button class="ts" data-v="'+v+'" onclick="setState(this)">'+v+'</button>').join('')}</div>
<div class="qty-row">实际数量:<input type="number" min="0" class="qty" value="${esc(it.quantity??1)}"> (与系统不同 = 异)</div>
<div class="qty-row">位置修正:<input class="newloc" placeholder="新位置(选填)"></div>
<div class="qty-row">状态修正:<select class="newstatus"><option value="">状态不变</option>${['在家','备用','借用中','维修中','找不到','已废弃'].map(st=>'<option>'+st+'</option>').join('')}</select></div>
<label class="notpresent"><input type="checkbox" class="np"> 不在场(借出中/旅游中等,默认不计入缺)</label>
</div>`).join('')||'<p class="empty">范围内没有物品</p>'}
<div class="actions"><button class="copy ghost" onclick="copyText('请加载「居家管家」技能,帮我盘点(唤醒词:盘点):\\n\\n  清单外物品: ______')">发现清单外物品</button>
<button class="copy ghost" onclick="copyText(saveProgress())">保存进度</button>
<button class="copy green wide" onclick="copyText(collectDiff())">确认提交(含差异)</button>
<button class="copy ghost" onclick="copyText(buildDataText(window.__hmPayload))">复制数据</button>
<button class="copy ghost" onclick="copyText(buildLogText(window.__hmPayload))">复制日志</button></div></section>`;
window.__hmPayload=payload;
app.innerHTML=html;
updateProg();
}
function setState(btn){const box=btn.closest('.item');box.querySelectorAll('.ts').forEach(x=>x.classList.remove('on'));btn.classList.add('on');updateProg();}
function updateProg(){const items=document.querySelectorAll('.item');let done=0;items.forEach(it=>{if(it.querySelector('.ts.on'))done++;});document.getElementById('progTxt').textContent=done+'/'+items.length;document.getElementById('progBar').style.width=(items.length?done*100/items.length:0)+'%';}
function collectDiff(){
const L=['请加载「居家管家」技能,帮我完成盘点(唤醒词:盘点):',''];
const present=[],missing=[],pending=[],notPresent=[],diff=[];
document.querySelectorAll('.item').forEach(it=>{
  const id=+it.dataset.id;const nm=it.dataset.name||('#'+id);const v=it.querySelector('.ts.on');
  const np=it.querySelector('.np').checked;
  if(!v){pending.push(nm);return;}
  const qty=+it.querySelector('.qty').value;const sys=+(it.querySelectorAll('.pill')[2]?it.querySelectorAll('.pill')[2].textContent.replace('×',''):1);
  const newloc=it.querySelector('.newloc').value.trim();const newst=it.querySelector('.newstatus').value;
  if(v.dataset.v==='在'){present.push(nm);}
  else if(v.dataset.v==='不在'){if(np){notPresent.push(nm);}else{missing.push(nm);}}
  else{pending.push(nm);}
  if(qty!==sys)diff.push('「'+nm+'」数量 '+sys+' → '+qty);
  if(newloc)diff.push('「'+nm+'」位置 → '+newloc);
  if(newst)diff.push('「'+nm+'」状态 → '+newst);
});
if(present.length)L.push('  在: '+present.join('、'));
if(missing.length)L.push('  不在(缺): '+missing.join('、'));
if(notPresent.length)L.push('  不在场(不计缺): '+notPresent.join('、'));
if(pending.length)L.push('  不确定: '+pending.join('、'));
if(diff.length)L.push('  修正: '+diff.join('; '));
if(!present.length&&!missing.length&&!notPresent.length&&!pending.length)L.push('  未选择任何核对');
return L.join('\n');
}
function saveProgress(){const L=['请加载「居家管家」技能,帮我继续盘点(唤醒词:盘点):','','  当前进度:'];document.querySelectorAll('.item').forEach(it=>{const st=it.querySelector('.ts.on');L.push('   「'+(it.dataset.name||('#'+it.dataset.id))+'」: '+(st?st.dataset.v:'未勾选'));});return L.join('\n');}
render();
</script>
</body>
</html>
