<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>居家管家 · 紧急定位</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--fg:#1d1d1f;--fg2:#6e6e73;--fg3:#86868b;--bg:#f5f5f7;--card:#fff;--line:#d2d2d7;--blue:#007aff;--green:#34c759;--orange:#ff9500;--red:#ff3b30;--soft:#f5f8ff;--shadow:0 1px 2px rgba(0,0,0,.04),0 12px 36px rgba(0,0,0,.06)}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--fg);line-height:1.65;-webkit-font-smoothing:antialiased}
.wrap{max-width:860px;margin:0 auto;padding:56px 22px 90px}
.hero{background:linear-gradient(180deg,#fff,#fffaf2);border-radius:28px;padding:34px;box-shadow:var(--shadow);margin-bottom:18px}
.eyebrow{color:var(--orange);font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px}
h1{font-size:38px;letter-spacing:-.035em;line-height:1.12;margin-bottom:10px}
.lead{color:var(--fg2);font-size:16px}
section{background:var(--card);border-radius:20px;padding:22px;box-shadow:0 1px 3px rgba(0,0,0,.04);margin:18px 0}
h2{font-size:20px;letter-spacing:-.02em;margin-bottom:12px}
.big-loc{font-size:26px;font-weight:800;color:var(--blue);margin:10px 0}
.photo{width:100%;min-height:220px;border-radius:16px;background:#f0f3f8;display:flex;align-items:center;justify-content:center;color:var(--fg3);overflow:hidden}.photo img{width:100%;height:100%;object-fit:cover}
.pill{display:inline-block;border:1px solid var(--line);background:#fbfbfd;border-radius:999px;padding:3px 9px;margin:2px;font-size:12px}
.warnbox{border-left:3px solid var(--orange);background:#fff8e8;padding:10px 14px;border-radius:8px;margin:8px 0}
.copy{border:none;background:var(--blue);color:#fff;border-radius:999px;padding:9px 14px;font-weight:700;cursor:pointer;margin:6px 6px 0 0;font-size:14px}.copy.alt{background:#1d1d1f}.copy.ghost{background:#fff;color:var(--blue);border:1.5px solid var(--blue)}
.actions{margin-top:12px;text-align:right}
.ok{color:var(--green)}.warn{color:var(--orange)}.bad{color:var(--red)}.empty{color:var(--fg3)}
@media(max-width:820px){.wrap{padding:30px 14px 70px}.hero{padding:26px 20px}h1{font-size:30px}}
</style>
</head>
<body>
<div class="wrap">
<div id="app"></div>
</div>
<script id="payload" type="application/json"><!--INJECT-DATA--></script>
<script>
<!--SHARED-HELPERS-->
const app=document.getElementById('app');
function render(){
let payload;
try{payload=JSON.parse(document.getElementById('payload').textContent)}catch(e){app.innerHTML='<section><h2 class="bad">数据解析失败</h2></section>';return}
const d=payload.data||{};const s=d.scene||{};
const hero=metaHeader(payload,{title:s.query?('「'+s.query+'」在哪!?'):'紧急定位',lead:'急,别让我选——只要位置,一屏直达',stage:'查看'});
let html=hero;
if(!s.items||!s.items.length){
  html+=`<section><h2 class="bad">没找到</h2><p>试试点下方「帮我扩大找」,或考虑是不是该录入。</p>
  <div class="actions"><button class="copy ghost" onclick="copyText('紧急定位(居家管家): 扩大范围找「'+${JSON.stringify('')}+'」')">帮我扩大找</button></div></section>`;
}else{
s.items.forEach(it=>{
  const idle=it.idle_days||0;
  html+=`<section>
  <div class="photo ${it.photo_base64?'':'empty'}">${it.photo_base64?'<img src="data:image/jpeg;base64,'+it.photo_base64+'">':'无照片'}</div>
  <div class="big-loc">📍 ${esc(it.location||'(未设置)')} ×${esc(it.quantity??1)}</div>
  <div><span class="pill">${esc(it.status)}</span><span class="pill">ID ${it.id}</span></div>
  <div class="warnbox">最后用:${esc(it.last_accessed_at||'未记录')}${idle>30?' · <span class="bad">已 ${idle} 天没移动</span>':''}</div>
  <div class="actions">
    <button class="copy" onclick="copyText('我找到了(居家管家): 物品 '+${'it.id'}+' 已找到,标记最后使用')">我找到了</button>
    <button class="copy ghost" onclick="copyText(this.dataset.t)" data-t="${esc('📍 位置: '+it.location)}">复制位置(发家人)</button>
    <button class="copy ghost" onclick="copyText('紧急定位(居家管家): 帮我扩大范围找「'+esc(it.name)+'」')">帮我扩大找</button>
  </div></section>`;
});
}
html+=remindersBlock(payload);
html+=`<section><h2>通用操作</h2>${actionBar(payload)}</section>`;
app.innerHTML=html;
}
render();
</script>
</body>
</html>
