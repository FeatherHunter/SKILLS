<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>居家管家 · 照片墙</title>
<style>
.actions .copy.wide{grid-column:1/-1;background:var(--blue);color:#fff;border:none}

button{-webkit-tap-highlight-color:transparent;touch-action:manipulation;-webkit-touch-callout:none}button:focus{outline:none}button::-moz-focus-inner{border:0}

*{box-sizing:border-box;margin:0;padding:0}
:root{--fg:#1d1d1f;--fg2:#6e6e73;--fg3:#86868b;--bg:#f5f5f7;--card:#fff;--line:#d2d2d7;--blue:#007aff;--green:#34c759;--orange:#ff9500;--red:#ff3b30;--soft:#f5f8ff;--shadow:0 1px 2px rgba(0,0,0,.04),0 12px 36px rgba(0,0,0,.06)}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--fg);line-height:1.65;-webkit-font-smoothing:antialiased}
.wrap{max-width:1080px;margin:0 auto;padding:56px 22px 90px}
.hero{background:linear-gradient(180deg,#fff,#f8fbff);border-radius:28px;padding:34px;box-shadow:var(--shadow);margin-bottom:18px}
.eyebrow{color:var(--blue);font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px}
h1{font-size:34px;letter-spacing:-.035em;line-height:1.12;margin-bottom:10px}
.lead{color:var(--fg2);font-size:16px}
section{background:var(--card);border-radius:20px;padding:22px;box-shadow:0 1px 3px rgba(0,0,0,.04);margin:18px 0}
h2{font-size:20px;letter-spacing:-.02em;margin-bottom:12px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:5px 13px;font-size:13px;cursor:pointer}.chip.on{border-color:var(--blue);background:var(--soft);color:var(--blue);font-weight:700}
.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.photo{aspect-ratio:1;border-radius:14px;background:#f0f3f8;overflow:hidden;cursor:pointer;position:relative}.photo img{width:100%;height:100%;object-fit:cover}
.photo .nm{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(0,0,0,.72));color:#fff;font-size:12px;padding:16px 8px 6px}
.photo .ty{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.6);color:#fff;font-size:10px;border-radius:6px;padding:2px 6px}
.photo.empty{display:flex;align-items:center;justify-content:center;color:var(--fg3)}
.count{color:var(--fg2);font-size:13px}
.copy{border:none;background:var(--blue);color:#fff;border-radius:999px;padding:10px 12px;font-weight:700;cursor:pointer;margin:0;font-size:13.5px;min-height:44px;min-width:0;flex:1 1 0;display:inline-flex;align-items:center;justify-content:center;white-space:nowrap;box-sizing:border-box}.copy.alt{background:#1d1d1f}.copy.ghost{background:#fff;color:var(--blue);border:1.5px solid var(--blue)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.warnbox{border-left:3px solid var(--orange);background:#fff8e8;padding:10px 14px;border-radius:8px;margin:8px 0}
@media(max-width:820px){.wrap{padding:30px 14px 70px}.hero{padding:26px 20px}h1{font-size:26px}}
</style>
</head>
<body>
<div class="wrap">
<div id="app"></div>
</div>
<script id="payload" type="application/json"><!--INJECT-DATA--></script>
<script>
<!--SHARED-HELPERS-->
const app=document.getElementById('app');
let type='all';
function render(){
let payload;
try{payload=JSON.parse(document.getElementById('payload').textContent)}catch(e){app.innerHTML='<section><h2 class="bad">数据解析失败</h2></section>';return}
const d=payload.data||{};const s=d.scene||{};
const hero=metaHeader(payload,{title:'照片墙',lead:'回忆式浏览 · 按 '+esc(s.group_by||'分类')+' 分组 · 本地筛选类型',stage:'查看'});
let html=hero;
html+=`<section><div class="chips"><button class="chip on" data-t="all">全部</button>${['普通','说明书-使用','说明书-安装','说明书-保养'].map(t=>'<button class="chip" data-t="'+t+'">'+t+'</button>').join('')}</div>
<span class="count">共 ${s.total||0} 张</span></section>`;
html+=(s.groups||[]).map(g=>`<section class="grp" data-g="${esc(g.name)}"><h2>${esc(g.name)} <span class="count">${g.items.length}</span></h2><div class="wall">${g.items.map(it=>`<div class="photo" onclick="copyText('看物品(居家管家): '+${'it.id'})"><img src="data:image/jpeg;base64,${it.photo_base64}" alt=""><span class="nm">${esc(it.name)}</span><span class="ty">${esc((it.photos&&it.photos[0]&&it.photos[0].photo_type)||'普通')}</span></div>`).join('')}</div></section>`).join('')||'<section><p class="empty">没有带照片的物品</p></section>';
if(s.no_photo_count){html+=`<div class="warnbox">还有 ${s.no_photo_count} 件物品没有照片:<button class="copy ghost" onclick="copyText('照片墙(居家管家): 给没照片的物品补拍')">去补拍</button></div>`;}
html+=remindersBlock(payload);
html+=`<section><h2>通用操作</h2>${actionBar(payload,[{label:'按位置浏览',text:'照片墙(居家管家): 按位置分组浏览',kind:'ghost'}])}</section>`;
app.innerHTML=html;
document.querySelectorAll('.chip[data-t]').forEach(c=>c.addEventListener('click',()=>{
  type=c.dataset.t;document.querySelectorAll('.chip[data-t]').forEach(o=>o.classList.toggle('on',o===c));
  document.querySelectorAll('.grp').forEach(sec=>{sec.style.display=sec.textContent.includes(type==='all'?' ':type)?'':'none';});
}));
}
render();
</script>
</body>
</html>
