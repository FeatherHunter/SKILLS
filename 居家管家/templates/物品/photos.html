<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>居家管家 · 物品照片</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--fg:#1d1d1f;--fg2:#6e6e73;--fg3:#86868b;--bg:#f5f5f7;--card:#fff;--line:#d2d2d7;--blue:#007aff;--green:#34c759;--orange:#ff9500;--red:#ff3b30;--soft:#f5f8ff;--shadow:0 1px 2px rgba(0,0,0,.04),0 12px 36px rgba(0,0,0,.06)}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--fg);line-height:1.65;-webkit-font-smoothing:antialiased}
.wrap{max-width:980px;margin:0 auto;padding:56px 22px 90px}
.hero{background:linear-gradient(180deg,#fff,#f8fbff);border-radius:28px;padding:34px;box-shadow:var(--shadow);margin-bottom:18px}
.eyebrow{color:var(--blue);font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px}
h1{font-size:32px;letter-spacing:-.035em;line-height:1.12;margin-bottom:10px}
.lead{color:var(--fg2);font-size:16px}
section{background:var(--card);border-radius:20px;padding:22px;box-shadow:0 1px 3px rgba(0,0,0,.04);margin:18px 0}
h2{font-size:20px;letter-spacing:-.02em;margin-bottom:12px}
.main{width:100%;min-height:320px;border-radius:18px;background:#f0f3f8;display:flex;align-items:center;justify-content:center;color:var(--fg3);overflow:hidden}.main img{width:100%;height:100%;object-fit:contain}
.thumbs{display:flex;gap:10px;margin-top:12px;overflow-x:auto;padding-bottom:6px}
.thumb{position:relative;flex:0 0 96px}.thumb img{width:96px;height:96px;border-radius:12px;object-fit:cover;cursor:pointer;border:3px solid transparent}
.thumb.on img{border-color:var(--blue)}
.thumb .ty{bottom:4px;left:4px;right:4px;position:absolute;background:rgba(0,0,0,.62);color:#fff;font-size:10px;border-radius:6px;padding:2px 4px;text-align:center}
.thumb .main-tag{position:absolute;top:-6px;left:-6px;background:var(--orange);color:#fff;font-size:10px;border-radius:999px;padding:2px 7px;font-weight:800}
.pill{display:inline-block;border:1px solid var(--line);background:#fbfbfd;border-radius:999px;padding:3px 9px;margin:2px;font-size:12px}
.typechips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.typechips button{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-size:12px;cursor:pointer}
.copy{border:none;background:var(--blue);color:#fff;border-radius:999px;padding:8px 13px;font-weight:700;cursor:pointer;margin:6px 6px 0 0;font-size:13px}.copy.alt{background:#1d1d1f}.copy.ghost{background:#fff;color:var(--blue);border:1.5px solid var(--blue)}.copy.red{background:var(--red)}
.actions{margin-top:12px;text-align:right}
.empty{color:var(--fg3)}
@media(max-width:820px){.wrap{padding:30px 14px 70px}.hero{padding:26px 20px}h1{font-size:26px}}
</style>
</head>
<body>
<div class="wrap">
<div id="app"></div>
</div>
<script id="payload" type="application/json"><!--INJECT-DATA--></script>
<script>
<!--SHARED-HELPERS-->
const app=document.getElementById('app');
let selIdx=0;
function render(){
let payload;
try{payload=JSON.parse(document.getElementById('payload').textContent)}catch(e){app.innerHTML='<section><h2 class="bad">数据解析失败</h2></section>';return}
const d=payload.data||{};const s=d.scene||{};
const it=s.item||{};const photos=arr(s.photos);
const hero=metaHeader(payload,{title:it.name?('「'+it.name+'」的照片'):'物品照片',lead:'第一张 = 主图 · 类型:普通/说明书-使用/说明书-安装/说明书-保养',stage:s.mode==='manage'?'排序确认':'查看'});
let html=hero;
if(!photos.length){html+='<section><p class="empty">暂无照片。点下方「补拍」给这件物品留影。</p></section>';}
else{
html+=`<section><div class="main" id="mainView">${photos[0]&&photos[0].photo_base64?'<img src="data:image/jpeg;base64,'+photos[0].photo_base64+'">':'无照片'}</div>
<div class="thumbs">${photos.map((p,i)=>`<div class="thumb ${i===0?'on':''}" data-i="${i}"><img src="data:image/jpeg;base64,'+p.photo_base64+'" onclick="showMain(${i})">${i===0?'<span class="main-tag">主</span>':''}<span class="ty">${esc(p.photo_type)}</span></div>`).join('')}</div>
<div class="typechips">${['普通','说明书-使用','说明书-安装','说明书-保养'].map(t=>'<button class="copy ghost" onclick="copyText(\'标记照片类型(居家管家): 物品 '+it.id+' 第 '+(selIdx+1)+' 张标记为「'+t+'」\')">'+t+'</button>').join('')}</div>
<div class="actions">
<button class="copy ghost" onclick="copyText('管照片(居家管家): 换主图,新顺序: '+JSON.stringify(${JSON.stringify(photos.map((p,i)=>i+1))})+',主图变更为第 1 张')">确认顺序变更</button>
<button class="copy ghost" onclick="copyText('【为「'+esc(it.name)+'」补拍照片,照片即将发送:】')">加图·补拍</button>
<button class="copy red" onclick="copyText('管照片(居家管家): 删除 '+it.id+' 第 '+(selIdx+1)+' 张照片')">删除选中</button>
</div></section>`;
}
html+=`<section><h2>通用操作</h2>${actionBar(payload,[{label:'下载照片',text:'下载(居家管家): '+it.id+' 的照片文件',kind:'ghost'}])}</section>`;
app.innerHTML=html;
}
function showMain(i){selIdx=i;document.querySelectorAll('.thumb').forEach((t,x)=>t.classList.toggle('on',x===i));const p=document.querySelectorAll('.thumb img')[i];document.getElementById('mainView').innerHTML=p?('<img src="'+p.src+'">'):'无照片';}
render();
</script>
</body>
</html>
