<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>居家管家 · 查物品</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--fg:#1d1d1f;--fg2:#6e6e73;--fg3:#86868b;--bg:#f5f5f7;--card:#fff;--line:#d2d2d7;--blue:#007aff;--green:#34c759;--orange:#ff9500;--red:#ff3b30;--soft:#f5f8ff;--shadow:0 1px 2px rgba(0,0,0,.04),0 12px 36px rgba(0,0,0,.06)}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--fg);line-height:1.65;-webkit-font-smoothing:antialiased}
.wrap{max-width:1080px;margin:0 auto;padding:56px 22px 90px}
.hero{background:linear-gradient(180deg,#fff,#f8fbff);border-radius:28px;padding:34px;box-shadow:var(--shadow);margin-bottom:18px}
.eyebrow{color:var(--blue);font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px}
h1{font-size:34px;letter-spacing:-.035em;line-height:1.12;margin-bottom:10px}
.lead{color:var(--fg2);font-size:16px;max-width:760px}
section{background:var(--card);border-radius:20px;padding:22px;box-shadow:0 1px 3px rgba(0,0,0,.04);margin:18px 0}
h2{font-size:20px;letter-spacing:-.02em;margin-bottom:12px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.card{background:var(--card);border-radius:18px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.04);border:1px solid #eee}
.photo{width:100%;height:150px;border-radius:12px;background:#f0f3f8;overflow:hidden;margin-bottom:10px}.photo img{width:100%;height:100%;object-fit:cover}
.photo.empty{display:flex;align-items:center;justify-content:center;color:var(--fg3);font-size:13px}
.card h3{font-size:17px}.reason{color:var(--fg3);font-size:12px;margin:4px 0 8px}
.pill{display:inline-block;border:1px solid var(--line);background:#fbfbfd;border-radius:999px;padding:3px 9px;margin:2px;font-size:12px}
.tag{background:#eef5ff;color:#0a63ce;border-radius:999px;padding:3px 9px;margin:2px;font-size:12px;display:inline-block}
.ok{color:var(--green)}.bad{color:var(--red)}.warn{color:var(--orange)}
.mark{background:#fff3bf;border-radius:4px;padding:0 2px}
.searchbox{display:flex;gap:8px;margin-bottom:14px}.searchbox input{flex:1}
input{width:100%;padding:9px 12px;border:1.5px solid var(--line);border-radius:12px;font-size:14px;font-family:inherit}
.copy{border:none;background:var(--blue);color:#fff;border-radius:999px;padding:8px 13px;font-weight:700;cursor:pointer;margin:6px 6px 0 0;font-size:13px}.copy.alt{background:#1d1d1f}.copy.ghost{background:#fff;color:var(--blue);border:1.5px solid var(--blue)}
.actions{margin-top:12px;text-align:right}
.hl{font-weight:800;background:#fff3bf;border-radius:4px;padding:0 2px}
@media(max-width:820px){.wrap{padding:30px 14px 70px}.hero{padding:26px 20px}h1{font-size:26px}}
</style>
</head>
<body>
<div class="wrap">
<div id="app"></div>
</div>
<script id="payload" type="application/json"><!--INJECT-DATA--></script>
<script>
<!--SHARED-HELPERS-->
const app=document.getElementById('app');
function hl(s,q){if(!q)return esc(s);const i=s.toLowerCase().indexOf(q.toLowerCase());if(i<0)return esc(s);return esc(s.slice(0,i))+'<span class="hl">'+esc(s.slice(i,i+q.length))+'</span>'+esc(s.slice(i+q.length));}
function itemCard(it,q,scene){
const btns=arr(scene.buttons||[]).map(b=>'<button class="copy ghost" onclick="copyText(this.dataset.t)" data-t="'+esc(b.text.replace('{id}',it.id).replace('{name}',it.name)).replace(/"/g,'&quot;')+'">'+esc(b.label)+'</button>').join('');
return `<div class="card">
<div class="photo ${it.photo_base64?'':'empty'}">${it.photo_base64?'<img src="data:image/jpeg;base64,'+it.photo_base64+'">':'无照片'}</div>
<h3>${hl(it.name,q)} <span class="pill">ID ${it.id}</span></h3>
<div class="reason">${arr(it.reasons).map(r=>'匹配:'+esc(r)).join(' · ')}</div>
<div><span class="pill">📍 ${esc(it.location||'(未设置)')} ×${esc(it.quantity??1)}</span> <span class="pill">${esc(it.status)}</span></div>
<div class="reason">${esc(it.category_name)}${(it.tags||[]).map(t=>'<span class="tag">'+esc(t)+'</span>').join('')}</div>
<div class="actions">${btns}</div>
</div>`;}
function render(){
let payload;
try{payload=JSON.parse(document.getElementById('payload').textContent)}catch(e){app.innerHTML='<section><h2 class="bad">数据解析失败</h2></section>';return}
const d=payload.data||{};const s=d.scene||{};
const q=s.query||'';
const hero=metaHeader(payload,{title:s.summary&&s.summary.title||'查物品结果',lead:s.lead||(q?'「'+q+'」的搜索结果':'全部物品'),stage:'查看'});
let html=hero;
html+=`<section><div class="searchbox"><input id="q" placeholder="本地筛选:输入关键词过滤" oninput="filterLocal(this.value)"><button class="copy ghost" onclick="copyText('查物品(居家管家): '+document.getElementById('q').value)">用这个关键词查</button></div>
<h2>${esc((s.summary&&s.summary.metrics&&s.summary.metrics[0])?(s.summary.metrics[0].label+' '+s.summary.metrics[0].value):(s.items.length+' 件'))}</h2>
${s.items&&s.items.length?`<div class="cards" id="cards">${s.items.map(it=>itemCard(it,q,s)).join('')}</div>`:`<div class="empty"><p class="bad">未命中。相近词建议:${esc((s.suggestions||[]).join('、')||'无')}</p><p>要不要录入一件新物品?</p></div>`}
<div class="actions">${s.items&&s.items.length?'':`<button class="copy" onclick="copyText('录入新物品(居家管家): 没找到我想要的,帮我录入'+(document.getElementById('q').value?'「'+document.getElementById('q').value+'」':''))">录入新物品(未命中引导)</button>`}</div></section>`;
html+=remindersBlock(payload);
html+=`<section><h2>操作</h2>${actionBar(payload,[{label:'细化筛选',text:'筛选(居家管家): '+(q?'继续筛 「'+q+'」 的物品,按 ':'按 ')+'分类/位置/标签/价格区间组合筛选',kind:'ghost'},{label:'拍照找物品',text:'【拍照反向查找物品,照片即将发送:】',kind:'ghost'}])}</section>`;
app.innerHTML=html;
}
function filterLocal(kw){const cards=document.querySelectorAll('#cards .card');if(!cards.length)return;kw=kw.toLowerCase();cards.forEach(c=>{c.style.display=c.textContent.toLowerCase().includes(kw)?'':'none';});}
render();
</script>
</body>
</html>
