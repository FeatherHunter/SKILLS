<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>居家管家 · 撤销操作</title>
<style>
.actions .copy.wide{grid-column:1/-1;background:var(--blue);color:#fff;border:none}

button{-webkit-tap-highlight-color:transparent;touch-action:manipulation;-webkit-touch-callout:none}button:focus{outline:none}button::-moz-focus-inner{border:0}

*{box-sizing:border-box;margin:0;padding:0}
:root{--fg:#1d1d1f;--fg2:#6e6e73;--fg3:#86868b;--bg:#f5f5f7;--card:#fff;--line:#d2d2d7;--blue:#007aff;--green:#34c759;--orange:#ff9500;--red:#ff3b30;--soft:#f5f8ff;--shadow:0 1px 2px rgba(0,0,0,.04),0 12px 36px rgba(0,0,0,.06)}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--fg);line-height:1.65;-webkit-font-smoothing:antialiased}
.wrap{max-width:900px;margin:0 auto;padding:56px 22px 90px}
.hero{background:linear-gradient(180deg,#fff,#fffafa);border-radius:28px;padding:34px;box-shadow:var(--shadow);margin-bottom:18px}
.eyebrow{color:var(--red);font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px}
h1{font-size:32px;letter-spacing:-.035em;line-height:1.12;margin-bottom:10px}
.lead{color:var(--fg2);font-size:16px}
section{background:var(--card);border-radius:20px;padding:22px;box-shadow:0 1px 3px rgba(0,0,0,.04);margin:18px 0}
h2{font-size:20px;letter-spacing:-.02em;margin-bottom:12px}
.ev{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid #eee;border-radius:14px;margin:8px 0;cursor:pointer;background:#fff}
.ev.on{border-color:var(--red);background:#fff5f4}
.ev input{width:18px;height:18px;accent-color:var(--red)}
.ev .sum{flex:1}.ev .sum b{font-size:15px}.ev .sum .meta{color:var(--fg3);font-size:12px}
.pill{display:inline-block;border:1px solid var(--line);background:#fbfbfd;border-radius:999px;padding:3px 9px;font-size:12px}
.warnbox{border-left:3px solid var(--orange);background:#fff8e8;padding:10px 14px;border-radius:8px;margin:8px 0}
.copy{border:none;background:var(--blue);color:#fff;border-radius:999px;padding:10px 12px;font-weight:700;cursor:pointer;margin:0;font-size:13.5px;min-height:44px;min-width:0;flex:1 1 0;display:inline-flex;align-items:center;justify-content:center;white-space:nowrap;box-sizing:border-box}.copy.alt{background:#1d1d1f}.copy.ghost{background:#fff;color:var(--blue);border:1.5px solid var(--blue)}.copy.red{background:var(--red)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.bad{color:var(--red)}.empty{color:var(--fg3)}
@media(max-width:820px){.wrap{padding:30px 14px 70px}.hero{padding:26px 20px}h1{font-size:26px}}
</style>
</head>
<body>
<div class="wrap">
<div id="app"></div>
</div>
<script id="payload" type="application/json"><!--INJECT-DATA--></script>
<script>
<!--SHARED-HELPERS-->
const app=document.getElementById('app');
function render(){
let payload;
try{payload=JSON.parse(document.getElementById('payload').textContent)}catch(e){app.innerHTML='<section><h2 class="bad">数据解析失败</h2></section>';return}
const d=payload.data||{};const s=d.scene||{};
const hero=metaHeader(payload,{title:'撤销最近操作',lead:'「我刚才错了」——勾选要撤销的操作,一次只能撤销未撤过的',stage:'选择'});
let html=hero;
if(!s.events||!s.events.length){html+='<section><p class="empty">暂无可撤销操作</p></section>';}
else{
html+=`<section><h2>可撤销操作(最近 ${s.events.length} 条)</h2>${s.events.map(e=>`<div class="ev" data-id="${e.id}" onclick="this.classList.toggle('on')"><input type="checkbox" value="${e.id}"><div class="sum"><b>${esc(e.summary)}</b><div class="meta">${esc(e.occurred_at)} · 物品 ${e.item_id} · <span class="pill">${esc(e.event_type)}</span></div></div></div>`).join('')}
<div class="warnbox">⚠ 级联影响:撤销「录入」会连带删除该物品的位置/标签/照片/关联;撤销一次性,不能无限嵌套。</div>
<div class="actions"><button class="copy red" onclick="copyText(undoPrompt())">确认撤销勾选项</button></div></section>`;
}
html+=`<section><h2>通用操作</h2>${actionBar(payload)}</section>`;
app.innerHTML=html;
}
function undoPrompt(){const ids=[...document.querySelectorAll('.ev.on')].map(x=>x.dataset.id).join('、');return ids?('请加载「居家管家」技能,帮我撤销最近操作(唤醒词:撤销操作):\n\n  撤  销: 事件 '+ids):'请先勾选要撤销的操作';}
render();
</script>
</body>
</html>
