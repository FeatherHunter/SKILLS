version: '1.0'
principle: 联动 = 唤醒词级组合。AI 分别查两个技能 → 对话层合并 → 出一个 HTML。不发明接口、不跨库直连。
judge: 1) 交叉洞察（合并后产生单技能给不了的结论） 2) 场景真实（用户生活里真会问） 3) 数据可得（外部技能真实字段） 4) 不自动造值
fields:
- id
- name
- wake_word
- external
- external_ww
- external_data
- calorie_side
- merge_logic
- present
- status
- downgrade_note
combo_count:
  total: 36
  保留: 30
  降级: 6
  新增候选: 0
