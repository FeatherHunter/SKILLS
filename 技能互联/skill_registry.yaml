# 技能互联 · 技能注册表（契约 v1 §8 · #271 骨架定稿 · #274 试点落地）
#
# 每个接入技能一行：技能名 → 路径 + 注册表模块。
# **不存 DB 路径**（#271 拍板）——skilllink 查询时各技能自己 find_db_path 动态解析，
# 尊重 SKILLS_DB_PATH 环境变量（测试天然隔离，绝不写死生产路径）。
# yaml 由新技能接入时手工登记；校验器（#273）双向检查：技能存在没登记 / 登记了没注册表 → 都红。
#
# 接入原则（map #270 Not yet specified）：各技能提供哪些域由联动组合表需求倒推，
# 不为完整而完整。未接入技能不登记；接入时（#277-#282 消费方/提供方开发）在此补行。

skills:
  作息管家:
    path: 作息管家
    module: PUBLIC_DOMAINS
  卡路里:
    path: 卡路里
    module: PUBLIC_DOMAINS
