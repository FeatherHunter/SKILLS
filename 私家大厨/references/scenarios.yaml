meta:
  skill: 私家大厨
  version: 0.1.0
  generated_at: 2026-07-27
  help_wake_word: 私家大厨 HELP
prompt_rules:
  forbidden:
  - python scripts/...
  - templates/...
  - $CHEF_OUTPUT_DIR / D:/CookHub
  - 数据库字段名(recipe_id / cook_sequence ...)
  - 错误码(status=200 / ERR_DB_EMPTY)
  - 易变调用步骤(步骤 1:query,步骤 2:...)
  required:
  - 自然语言意图描述
  - 用户预期结果描述
status_legend:
  ? ''
  : 可用 - HELP HTML 正常展示,可一键复制
  【待开发】: 不可执行 - 醒目标注,复制按钮仍可点;AI 收到 prompt 必须停+告知,不准绕过/假装/降级
methodology:
  rule_1_user_voice: 每个场景必须对应至少 1 个真实用户原话依据
  rule_2_dimension_cap: 维度组合 ≤ 3(时间/筛选/排序 是真实组合上限)
  rule_3_no_ai_fabrication: 砍'如果用户问 ... 呢'式反推场景
  rule_4_frequency_first: 优先穷举'高频 + 易错',非'罕见 + 易想'
  rule_5_deprecation_allowed: 场景可废止(status 改【待开发】或删除)
boundary_templates:
  no_data: 库中无匹配数据
  missing_data: 查询字段缺失(如 ratings 表未填)
  error: 数据异常(如 FK CASCADE 删除失败)
  offline: 本地服务异常(私家大厨纯本地,通常不适用)
aliases:
- main: 做菜模式
  alias: 开始做菜
  note: 2 唤醒词触发同一功能,场景共享
- main: 废弃食谱
  alias:
  - 不想要
  - 删掉
  - 废弃
  note: 4 唤醒词等价,场景共享(防冗余:避免每唤醒词重复同一场景)
scenarios:
- wake_word: 做菜模式
  scenarios:
  - scenario_id: cooking_start_fresh
    scenario_title: 全新开始(含每步内联 + 完结闭环)
    dimensions:
      recipe: 指定菜名
    prompt: 帮我做一道{{菜名}},我要按步骤来。
    status: ''
    result: 可交互做菜页按顺序引导完成全部步骤;每步内联本步食材+菜级炊具顶部;做完先祝贺复盘,再评分/反馈/反思/拍作品照(全部一键复制给 AI)。
    wake_word: 做菜模式
    type: 向导+选择+回执
    html:
      template: 做菜/cooking_mode.html
      command_cn: 做菜模式
      data_source: recipes
    variants: []
  - scenario_id: cooking_start_with_history
    scenario_title: 含上次经验(历史驱动再开做)
    dimensions:
      recipe: 指定菜名
      history: 之前做过
    prompt: 再做一次{{菜名}},上次做得不错但想改进。
    status: ''
    result: 做菜页顶部展示上次做菜的反思提示(如'肉切厚了')与平均评分/次数,针对性改进。
    wake_word: 做菜模式
    type: 向导+选择+回执
    html:
      template: 做菜/cooking_mode.html
      command_cn: 做菜模式
      data_source: recipes
    variants: []
  - scenario_id: cooking_start_double_servings
    scenario_title: 双份份量
    dimensions:
      recipe: 指定菜名
      servings: 2 份
    prompt: 做{{菜名}},今晚来客人,做两人份。
    status: ''
    result: 步骤中食材用量自动按份数比例放大,无需心算。
