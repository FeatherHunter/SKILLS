  - priority: "P2(文档级)"
    issue: "口语化 token 解析歧义"
    suggestion: "SKILL.md 加段:'语气词(哈/呢/吧/哦)不参与字段解析,仅作为风格化标识。'"

# ─────────────────────────────────────────────────────
# 真 FAT 跑指南(新会话执行)
# ─────────────────────────────────────────────────────
fat_execution_guide:
  prerequisites:
    - "全新会话窗口(fresh context)"
    - "仅加载 SKILL.md + 必要 scripts/templates"
    - "不告诉 agent 任何前置信息"
  
  steps:
    - step: 1
      action: "选 3-5 个核心唤醒词"
      done: "已选 5 个(开始做菜/查看食谱/搜索食谱/生成清单/记录做菜)"
    - step: 2
      action: "执行 15 prompt,每个 prompt 跑 1 次"
    - step: 3
      action: "捕获执行证据(命令 + 数据 + 输出)"
    - step: 4
      action: "对比本文件 expected_workflow,判定 pass/fail"
    - step: 5
      action: "fail → 改 SKILL.md(不改代码),循环 ≤ 3 次"
    - step: 6
      action: "最终 commit 加 Tested-By: fresh-agent-v1 段"

  expected_outcome:
    based_on_preview: "9/15 prompt 会 fail,主要因为唤醒词变体未收录"
    fix_path: "P1-1 F3 变体管理 待办,补完后 FAT 应全 pass"
