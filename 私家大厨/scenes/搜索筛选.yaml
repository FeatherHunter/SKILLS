    scenario_title: 多维组合筛选(≤3 维)
    dimensions: {cuisine: 川, time_max: 30 分钟, extra: 可加第 3 维}
    type: 查看
    status: ""
    prompt: |-
      川菜里 30 分钟内能搞定的。
    result: "AI 解析多维组合条件(≤3 维,§07 rule_2),展示交集结果;组合能力为所有筛选场景共享。"
    html:
      template: 搜索筛选/data_view.html
