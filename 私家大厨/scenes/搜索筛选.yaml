# 搜索筛选域场景资产(域内权威 · 合并器接入 references/scenarios.yaml)
#
# 位置: 私家大厨/scenes/搜索筛选.yaml
# 合并器 = scripts/场景合并.py(实施期接入,对齐居家管家契约;改总账的唯一通道 = 合并器)
# 本文件与 references/scenarios.yaml 同构(version/domain/scenes),字段契约一致。
#
# G4 grilling 定案(2026-08-08 · 一轮拍板):
#   1. 场景清单 = 13 场景卡 0 增 0 删(10 唤醒词维持)+ 2 降级详情层
#      (对齐用户原则: 场景 = HELP 展示的入口,单维筛选各自是独立入口,不合并)
#   2. 组合筛选泛化: filter_cuisine_combined → filter_combined(≤3 维,§07 rule_2),
#      保留在「筛选菜系」入口下作为组合语义代表;组合能力 = 所有筛选场景共享的 AI 行为
#      (AI 解析多维条件,不新增「组合筛选」唤醒词)
#   3. B6 转实现 2 项: 错字模糊匹配(无结果 → AI 纠错「你是不是想找」→ 展示正确结果;
#      纠错仍无 → 无结果详情层)/ 排除食材(AI 解析「不吃/不要/忌 X」→ NOT 条件查询)
#   4. 检索输出契约化(R2 #10): search/list JSON 契约 7 字段 =
#      id / name / difficulty / total_time_minutes / status / avg_rating(历史评分均值) / tags(口味+饮食标签)
#      现状 search_as_dict 返 5 字段,缺 avg_rating/tags → 实施期补(LEFT JOIN recipe_history AVG + 标签聚合);
#      网格卡片同源显示(菜名/难度/时间/评分/标签)
#   5. 08 对齐: data_view.html 网格卡片 + 复制数据(5 段 JSON)/复制日志(6 段) + 双通道(文字回执+HTML)
#      + _N 后缀防覆盖(F4) + empty/error 态保留(F8 已有基础)
#
# 详情层条目(四层结构第四层 · 不占场景卡):
#   - 搜索无结果(search_no_result): 无匹配 → 先走错字纠错(模糊匹配场景)→ 仍无 → 礼貌告知 + 建议放宽/录入新菜
#   - 空库列全部(list_all_with_empty): 库为空 → 礼貌告知 + 引导录入第一道菜
version: "1.0"

domain:
  key: search
  name: 搜索筛选
  icon: "🔍"
  g: G4

scenes:
  - id: "search-1"
    domain: search
    sub: 关键词搜索
    wake_word: 搜索食谱
    scenario_id: search_by_name_keyword
    scenario_title: 关键词搜索(菜名/食材)
    dimensions: {keyword: 菜名片段}
    type: 查看
    status: ""
    prompt: |-
      搜索排骨。
    result: "列出菜名或食材含关键词的所有菜,网格卡片显示难度/时间/评分/标签。"
    html:
      template: 搜索筛选/data_view.html
      command_cn: 搜索食谱
      data_source: recipes
    variants: []

  - id: "search-2"
    domain: search
    sub: 关键词搜索
    wake_word: 搜索食谱
    scenario_id: search_fuzzy_match
    scenario_title: 错字模糊匹配(纠错提示)
    dimensions: {keyword: 错字/谐音}
    type: 查看
    status: "【待开发】"
    prompt: |-
      搜索宫暴鸡丁(应为宫保)。
    result: "无结果时 AI 纠错(同音/形近),提示「你是不是想找:宫保鸡丁」并直接展示结果;纠错仍无结果 → 走无结果详情层。"
    html:
      template: 搜索筛选/data_view.html
      command_cn: 搜索食谱
      data_source: recipes
    variants: []

