# 采购域场景资产(域内权威 · 合并器接入 references/scenarios.yaml)
#
# 位置: 私家大厨/scenes/采购.yaml
# 合并器 = scripts/场景合并.py(实施期接入,对齐居家管家契约;改总账的唯一通道 = 合并器)
# 本文件与 references/scenarios.yaml 同构(version/domain/scenes),字段契约一致。
#
# G6 grilling 定案(2026-08-08 · 三轮 + 对抗式审查 + 3 项补拍板):
#   1. 域收敛: G0 草稿 6 场景 → **1 场景卡「生成清单」+ 1 详情层(已有vs需买)**。
#      单菜/多菜合并/不同份数/排除可选 = 生成清单的 4 个参数旋钮,不是独立场景
#      (对齐 G5 做菜域「5 卡 0 增,增强并入 cook-1」先例;G4「组合能力 = 共享 AI 行为」先例)。
#      用户原话:「1 认可」。
#   2. HELP 形态 = 「场景卡 + 可复制填空 prompt」(用户拍板):
#      HELP 预设好用户各种实用场景,用户看到场景名 → 挑一个 → 复制 prompt
#      → 填空(有填写位)→ 发给 AI → 必达目标;或 prompt 执行出现过程型 HTML
#      (购物清单页)→ 用户填好 → 再复制 prompt 给 AI → AI 按用户要求执行并给结果型 HTML。
#      私家大厨 HELP 对齐居家管家 HTML 先例(场景卡 + prompt 填空位)。
#   3. 已有vs需买(详情层,挂 shopping-1,不占场景卡):
#      a. 数据来源 = 联动居家管家「囤货盘点」(SM5 已实现: 物品状态 在家/备用 = 库存,
#         含阈值/缺货检测/购物清单)。跨技能联动方式(用户拍板):
#         ✅ 通过生成 prompt 调用居家管家(符合其唤醒词,用户复制/会话自然触发)
#         ❌ 禁止在私家大厨脚本中写死调用居家管家 CLI/底层路径
#         (居家管家规矩: 跨技能物理隔离,不直接调对方 CLI,复制 prompt 单工闭环)
#      b. 匹配与打勾判定(用户拍板 Q3b + 对抗式补拍板 Q1): 同名/同义食材 → 打勾(灰色勾,
#         非用户手动绿勾),并**标注双量**「需 N 个 / 库 N盒」——信息给全,够不够用户自己判断,
#         AI 不做数量比较、不替用户做决定。
#      c. 库存单位(对抗式 P1-3 + 用户补拍板 Q3): 居家管家 items 表无 unit 字段,
#         但物品名通常自带单位线索(「盒装鸡蛋」→盒,用户确认「目前已知是有单位的」)。
#         标注 = 库存原文数量 + 名称里的单位线索;无线索就标「库 N」,不推断不造值。
#      d. 无数据降级(用户拍板 Q3c + 对抗式 P1-1): 居家管家查不到(无数据/无匹配)→ 不打勾;
#         HTML 顶部一条淡提示「未核对库存(居家管家暂无数据)」,不阻断、可忽略;
#         会话内只提示一次(AI 记住已提示过),避免每次生成清单都啰嗦。
#   4. 对抗式审查(R2-1 四点半板 · 用户全认可):
#      「已有」(系统判定)≠「已买」(用户进度),视觉必须分开:
#      a. 已有项 = 灰色勾 + 划线 + 标注「已有 N盒(居家管家)」,不进用户勾选进度
#      b. 进度条只统计需买项(分母不含已有),否则永远到不了 100%
#      c. 顶部摘要加一格「已有 N 项」
#      d. 不做双栏(采购按分类逛,双栏打断动线;单栏+勾选体系增量最小)
#   5. 勾选持久化(用户拍板 R2-3): **不依赖 localStorage**(G5 已查证飞书内置浏览器
#      localStorage 不可靠);勾选态 = 一次性购物过程态,页面内即时打勾;
#      买一半需恢复 → 「复制数据」导出勾选态 JSON → AI 会话记忆兜底(对齐 G5 断点续做)。
#      实施要点(对抗式 P1-2): 现状 shopping_view.html 启动时 loadState() 读 localStorage,
#      实施期改为 try-catch 静默(可存则存,存不了不阻塞),不依赖启动恢复。
#   6. R2-2 拍冰箱识别囤货: **不做**(用户否决)。竞品 marklavine 亮点,但私家大厨
#      已有居家管家联动主路;「空转」表述修正为: 联动数据依赖用户录入居家管家,
#      未录时降级提示,录起来后自然生效(用户事实核查: 居家管家现 0 数据 ≠ 永远无数据)。
#   7. 边界: 采购下单不实现(用户 2026-07-27 决策);预算价格预估不实现
#      (shopping_manager v5.2 已删: AI 硬编码价格反而误导,用户自己知道花多少钱);
#      卡路里食品库默认不联动(SKILL.md 路由表,用户明确说才联动)。
#   8. 08 对齐(实施期): 购物清单页补「复制数据(勾选态 JSON)/复制日志」双按钮 + 双通道
#      (文字回执+HTML);现状已有复制清单(文本)保留。
#
# status 判定原则(07 §4/§6 五者对应):
#   shopping-1: 唤醒词路由 ✓ + 场景资产 ✓(本文件)+ prompt ✓ + 底层工作流
#   (shopping_manager/shopping_render 已实现)+ HELP 映射 ✓ → status = ""(可用),
#   但「已有vs需买」详情层为新增 → 实施期落在 shopping_view.html 增强。
version: "1.0"

domain:
  key: shopping
  name: 采购
  icon: "🛒"
  g: G6

scenes:
  - id: "shopping-1"
    domain: shopping
    sub: 生成清单
    wake_word: 生成清单
    scenario_id: shopping_generate
    scenario_title: 生成采购清单
    dimensions:
      recipe: 指定菜名(可多个,逗号/和/顿号分隔)
      servings: 份数倍数(选填,默认 1;不同菜可不同)
      exclude_optional: 排除可选食材(选填,默认不排除)
      stock_check: 是否核对居家管家库存(选填,默认核对)
    type: 查看+勾选(过程型)
    status: ""
    prompt: |-
      请加载「私家大厨」技能,帮我生成采购清单(唤醒词:生成清单):
      菜  名: _____________ (1 个或多个,如: 宫保虾球,辣炒虾球)
      份  数: _____________ (选填,如 2 表示双份;多菜可用 2,1 分别指定)
      排除可选: _____________ (选填,填「排除」则不含可选食材)
      核对家里库存: _____________ (选填,默认核对;不需要填「不核对」)
    result: "跨食谱合并采购清单(分类视图/菜谱视图),已有食材灰色预勾+双量标注(需 N/库 N),进度只统计需买项;可打勾/调份数/复制/打印;无库存数据顶部淡提示;失败静默降级 JSON。"
    html:
      template: 采购/shopping_view.html
      command_cn: 生成清单
      data_source: shopping_manager generate
    variants: []
