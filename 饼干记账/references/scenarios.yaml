version: '2.0'
skill: 饼干记账
help_wake_words:
- 饼干记账 HELP
- 饼干记账 帮助
- 查帮助
- 能做什么
domains:
- key: setup
  name: 开始使用
  icon: 🚀
- key: write
  name: 写入
  icon: ✏️
- key: query
  name: 查询
  icon: 🔍
- key: analysis
  name: 分析
  icon: 📊
- key: goal
  name: 目标
  icon: 🎯
- key: account
  name: 账户
  icon: 💳
- key: link
  name: 联动
  icon: 🔗
scenes:
- key: setup
  name: 开始使用
  icon: 🚀
  subs:
  - name: 初始化
    wake_words:
    - wake_word: 初始化
      scenes:
      - id: setup-1-1
        scenario_id: setup_init_wizard
        scenario_title: 首次使用向导(4 步零决策)
        type: 向导
        status: ''
        html:
          template: 开始使用/init_wizard.html
          command_cn: 初始化向导
          data_source: db
        prompt: |
          请加载「饼干记账」技能,帮我开始使用饼干记账(唤醒词:初始化):
        result: HTML 4 步零决策向导(环境检测→数据目录确认→建库→只读验证);完成页「记第一笔」引导按钮;未初始化时 HELP init-banner 双通道入口
    - wake_word: 初始化状态
      scenes:
      - id: setup-1-2
        scenario_id: setup_init_status
        scenario_title: 初始化状态(是否已就绪)
        type: 查看
        status: ''
        html:
          template: 开始使用/init_status.html
          command_cn: 初始化状态
          data_source: db
        prompt: |
          请加载「饼干记账」技能,帮我看看饼干记账初始化了没有(唤醒词:初始化状态):
        result: HTML 三重判定(数据存在/schema 版本/就绪);未初始化 → 引导初始化;schema 过期 → 显式迁移提示
  - name: 备份恢复
    wake_words:
    - wake_word: 备份
      scenes:
      - id: setup-2-1
        scenario_id: setup_backup_create
        scenario_title: 一键备份
        type: 回执
        status: ''
        html:
          template: 开始使用/backup.html
          command_cn: 一键备份
          data_source: db+goals.json
        prompt: |
          请加载「饼干记账」技能,帮我备份饼干记账的数据(唤醒词:备份):
        result: HTML 备份回执(文件路径/时间/内容:数据库+目标);失败 → 错误回执(5 状态契约)
      - id: setup-2-2
        scenario_id: setup_backup_list
        scenario_title: 查看备份
        type: 查看
        status: ''
        html:
          template: 开始使用/backup_list.html
          command_cn: 查看备份
          data_source: 备份目录
        prompt: |
          请加载「饼干记账」技能,帮我看看有哪些备份(唤醒词:备份):
        result: HTML 备份列表(时间/大小/内容);无备份 → 空态引导一键备份
    - wake_word: 恢复备份
      scenes:
      - id: setup-2-3
        scenario_id: setup_restore
        scenario_title: 从备份恢复
        type: 向导
        status: ''
        html:
          template: 开始使用/restore.html
          command_cn: 从备份恢复
          data_source: 备份文件
        prompt: |
          请加载「饼干记账」技能,帮我从备份恢复数据(唤醒词:恢复备份):

            备  份: ____ (选填,默认最新备份)
        result: HTML 恢复向导(备份详情预览→确认→恢复→验证);恢复前自动备份现状;失败 → 错误回执(5 状态契约)
  - name: 导入
    wake_words:
    - wake_word: 导入
      scenes:
      - id: setup-3-1
        scenario_id: setup_import
        scenario_title: 导入 CSV 账单(列映射向导)
        type: 向导
        status: ''
        html:
          template: 开始使用/import.html
          command_cn: 导入CSV
          data_source: CSV 文件
        prompt: |
          请加载「饼干记账」技能,帮我导入 CSV 账单(唤醒词:导入):

            文件路径: ____
            列映射: ____ (选填,自动识别,如:日期=第1列,金额=第3列)
        result: HTML 列映射向导(前几行预览+自动猜测映射,可改)→ 批量确认 → 文字回执;缺文件路径 → AI 反问(不猜测)
- key: write
  name: 写入
  icon: ✏️
  subs:
  - name: 记账
    wake_words:
    - wake_word: 记支出
      scenes:
      - id: write-1-1
        scenario_id: write_expense
        scenario_title: 记一笔支出
        type: 写入
        status: ''
        html:
          template: 写入/confirm.html
          command_cn: 记支出
          data_source: 输入参数
        prompt: |
          请加载「饼干记账」技能,帮我记一笔支出(唤醒词:记支出):

            金  额: ____
            分  类: ____ (选填,如:餐饮 / 出行 / 奶茶)
            备  注: ____ (选填)
            时  间: ____ (选填,默认现在;补记昨天写「昨天」)
            账  户: ____ (选填,如:支付宝 / 微信)
            账  本: ____ (选填,如:旅行 / 生活)
            币  种: ____ (选填,默认人民币;外币如:USD)
        result: 过程型 HTML 确认(字段预览)→ 文字回执;缺金额 → AI 反问(不猜测)
    - wake_word: 记收入
      scenes:
      - id: write-2-1
        scenario_id: write_income
        scenario_title: 记一笔收入
        type: 写入
        status: ''
        html:
          template: 写入/confirm.html
          command_cn: 记收入
          data_source: 输入参数
        prompt: |
          请加载「饼干记账」技能,帮我记一笔收入(唤醒词:记收入):

            金  额: ____
            分  类: ____ (选填,如:工资 / 奖金 / 红包)
            备  注: ____ (选填)
            时  间: ____ (选填,默认现在)
            账  户: ____ (选填,如:银行卡 / 微信)
            币  种: ____ (选填,默认人民币;外币如:USD)
        result: 过程型 HTML 确认(字段预览)→ 文字回执;缺金额 → AI 反问(不猜测)
    - wake_word: 拍账单
      scenes:
      - id: write-3-1
        scenario_id: write_bill_photo
        scenario_title: 拍账单记账(图片识别)
        type: 写入
        status: ''
        html:
          template: 写入/confirm.html
          command_cn: 拍账单
          data_source: 图片识别
        prompt: |
          请加载「饼干记账」技能,帮我拍账单记账(唤醒词:拍账单):
        result: 识别金额(优先实付/合计)→ 过程型 HTML 确认 → 文字回执;模糊/非账单 → AI 描述所见 + 询问(5 状态契约)
    - wake_word: 批量录入
      scenes:
      - id: write-4-1
        scenario_id: write_batch
        scenario_title: 批量录入多笔
        type: 写入
        status: ''
        html:
          template: 写入/batch_confirm.html
          command_cn: 批量录入
          data_source: 输入参数
        prompt: |
          请加载「饼干记账」技能,帮我批量记几笔账(唤醒词:批量录入):

            条  目: ____ (每行一笔,如:午饭35 / 奶茶25 / 打车20)
            账  本: ____ (选填,如:旅行)
        result: 逐笔解析 → 过程型 HTML 批量确认(可改) → 文字回执;缺参条目 → AI 反问
  - name: 修正
    wake_words:
    - wake_word: 改记录
      scenes:
      - id: write-5-1
        scenario_id: write_update
        scenario_title: 修改已有记录
        type: 写入
        status: ''
        html:
          template: 写入/update_confirm.html
          command_cn: 改记录
          data_source: bills + 输入参数
        prompt: |
          请加载「饼干记账」技能,帮我改一条记录(唤醒词:改记录):

            目  标: ____ (如:最近一笔 / 某天的某条 / ID)
            要改的字段: ____ (如:金额改成 38 / 分类改成交通 / 备注加牛奶)
        result: 定位候选 → diff 预览(原值→新值)确认 → 文字回执;定位不到 → AI 反问
    - wake_word: 撤销
      scenes:
      - id: write-6-1
        scenario_id: write_undo
        scenario_title: 撤销一条记录(软删)
        type: 写入
        status: ''
        html:
          template: 写入/confirm.html
          command_cn: 撤销
          data_source: bills + 输入参数
        prompt: |
          请加载「饼干记账」技能,帮我撤销一条记录(唤醒词:撤销):

            目  标: ____ (默认最近一笔;或描述某条)
        result: 目标确认(默认最近一笔)→ 软删(deleted_at)→ 文字回执;可再撤销(恢复)
    - wake_word: 恢复
      scenes:
      - id: write-7-1
        scenario_id: write_restore
        scenario_title: 恢复已撤销记录
        type: 写入
        status: ''
        html:
          template: 写入/confirm.html
          command_cn: 恢复
          data_source: bills + 输入参数
        prompt: |
          请加载「饼干记账」技能,帮我恢复一条已撤销的记录(唤醒词:恢复):

            目  标: ____ (描述被撤销的记录,如:昨天撤销的午饭)
        result: 定位已删记录 → 恢复(deleted_at = NULL)→ 文字回执
  - name: 报销
    wake_words:
    - wake_word: 记报销
      scenes:
      - id: write-8-1
        scenario_id: write_reimburse
        scenario_title: 记一笔报销支出(#待报销)
        type: 写入
        status: ''
        html:
          template: 写入/confirm.html
          command_cn: 记报销
          data_source: 输入参数
        prompt: |
          请加载「饼干记账」技能,帮我记一笔报销支出(唤醒词:记报销):

            金  额: ____
            分  类: ____ (选填,如:餐饮 / 差旅)
            备  注: ____ (选填,自动加 #待报销)
            时  间: ____ (选填,默认现在)
        result: '记支出 + 备注自动 #待报销 → 过程型 HTML 确认 → 文字回执'
    - wake_word: 报销到账
      scenes:
      - id: write-9-1
        scenario_id: write_reimburse_done
        scenario_title: 报销到账(记收入 + 流转标签)
        type: 写入
        status: ''
        html:
          template: 写入/confirm.html
          command_cn: 报销到账
          data_source: 输入参数
        prompt: |
          请加载「饼干记账」技能,帮我记录报销到账(唤醒词:报销到账):

            金  额: ____
            关  联: ____ (选填,如:哪一笔 #待报销)
        result: '记收入 + 关联记录 #待报销 标签流转 → 确认 → 文字回执'
- key: query
  name: 查询
  icon: 🔍
  subs:
  - name: 按时间
    wake_words:
    - wake_word: 查今天
      scenes:
      - id: query-1-1
        scenario_id: query_today
        scenario_title: 今日收支摘要
        type: 查看
        status: ''
        html:
          template: 查询/today.html
          command_cn: 今日摘要
          data_source: bills
        prompt: |
          请加载「饼干记账」技能,帮我看今天的收支摘要(唤醒词:查今天):
        result: HTML 展示 4 KPI + 洞察 + 今日明细;空数据 → 空态引导
    - wake_word: 查日期
      scenes:
      - id: query-2-1
        scenario_id: query_date_yesterday
        scenario_title: 查昨天
        type: 查看
        status: ''
        html:
          template: 查询/list.html
          command_cn: 查日期
          data_source: bills
        prompt: |
          请加载「饼干记账」技能,帮我查昨天的账(唤醒词:查日期):
        result: HTML 展示昨日记录
      - id: query-2-2
        scenario_id: query_date_specific
        scenario_title: 查某一天(指定日期)
        type: 查看
        status: ''
        html:
          template: 查询/list.html
          command_cn: 查日期
          data_source: bills
        prompt: |
          请加载「饼干记账」技能,帮我查某天的账(唤醒词:查日期):

            日  期: ____ (例如:5月1号 / 昨天 / 上周五)
        result: HTML 展示指定日期记录;相对表达由 routing.py 换算
      - id: query-2-3
        scenario_id: query_date_relative
        scenario_title: 查相对日期(如上周五)
        type: 查看
        status: ''
        html:
          template: 查询/list.html
          command_cn: 查日期
          data_source: bills
        prompt: |
          请加载「饼干记账」技能,帮我查某个相对日期的账(唤醒词:查日期):

            日  期: ____ (例如:上周五 / 前天)
        result: 相对时间换算(routing.py)→ HTML
    - wake_word: 查范围
      scenes:
      - id: query-3-1
        scenario_id: query_range_week
        scenario_title: 查某周(本周/上周)
        type: 查看
        status: ''
        html:
          template: 查询/list.html
          command_cn: 查范围
          data_source: bills
        prompt: |
          请加载「饼干记账」技能,帮我查某周的账(唤醒词:查范围):

            周: ____ (例如:本周 / 上周)
        result: HTML 展示该周记录(周一~周日)
      - id: query-3-2
        scenario_id: query_range_custom
        scenario_title: 查自定义区间
        type: 查看
        status: ''
        html:
          template: 查询/list.html
          command_cn: 查范围
          data_source: bills
        prompt: |
          请加载「饼干记账」技能,帮我查某段时间的账(唤醒词:查范围):

            开始日期: ____ (例如:2026-05-01)
            结束日期: ____ (例如:2026-05-10)
        result: HTML 展示区间记录;跨月/跨年正确计算
      - id: query-3-3
        scenario_id: query_range_double_compare
        scenario_title: 双区间对比
        type: 查看
        status: ''
        html:
          template: 查询/list.html
          command_cn: 查范围
          data_source: bills
        prompt: |
          请加载「饼干记账」技能,帮我对比两段时间的账(唤醒词:查范围):

            区间一: ____ (例如:5 月)
            区间二: ____ (例如:6 月)
        result: HTML 双列并排对比 + 变化率
  - name: 按条件
    wake_words:
    - wake_word: 查分类
      scenes:
      - id: query-4-1
        scenario_id: query_category
        scenario_title: 查某分类记录
        type: 查看
        status: ''
        html:
          template: 查询/list.html
          command_cn: 查分类
          data_source: bills
        prompt: |
          请加载「饼干记账」技能,帮我查某分类的记录(唤醒词:查分类):

            分  类: ____ (例如:餐饮 / 出行 / 奶茶)
        result: HTML 展示分类记录;多级分类/组合筛选由 AI 解析
    - wake_word: 查最近
      scenes:
      - id: query-5-1
        scenario_id: query_recent
        scenario_title: 查最近记录(可排序)
        type: 查看
        status: ''
        html:
          template: 查询/list.html
          command_cn: 查最近
          data_source: bills
        prompt: |
          请加载「饼干记账」技能,帮我看最近的记录(唤醒词:查最近):

            条  数: ____ (选填,默认 10)
            排  序: ____ (选填,如:金额从大到小)
        result: HTML 展示最近 N 条;排序可选
    - wake_word: 搜备注
      scenes:
      - id: query-6-1
        scenario_id: query_search
        scenario_title: 搜索备注关键词
        type: 查看
        status: ''
        html:
          template: 查询/list.html
          command_cn: 搜备注
          data_source: bills
        prompt: |
          请加载「饼干记账」技能,帮我搜备注关键词(唤醒词:搜备注):

            关键词: ____
        result: HTML 展示命中记录;零命中 → 空态
    - wake_word: 查标签
      scenes:
      - id: query-7-1
        scenario_id: query_tag
        scenario_title: 查标签(#tag 聚合)
        type: 查看
        status: ''
        html:
          template: 查询/tag.html
          command_cn: 查标签
          data_source: bills
        prompt: |
          请加载「饼干记账」技能,帮我查某个标签的记录(唤醒词:查标签):

            标  签: ____ (例如:#旅行)
        result: HTML 展示标签命中记录 + 聚合统计
    - wake_word: 查账本
      scenes:
      - id: query-8-1
        scenario_id: query_ledger
        scenario_title: 查某账本记录
        type: 查看
        status: ''
        html:
          template: 查询/list.html
          command_cn: 查账本
          data_source: bills
        prompt: |
          请加载「饼干记账」技能,帮我查某个账本的记录(唤醒词:查账本):

            账  本: ____ (例如:旅行 / 生活)
        result: HTML 展示账本记录 + 汇总
    - wake_word: 查账户
      scenes:
      - id: query-9-1
        scenario_id: query_account
        scenario_title: 查某账户记录
        type: 查看
        status: ''
        html:
          template: 查询/list.html
          command_cn: 查账户
          data_source: bills
        prompt: |
          请加载「饼干记账」技能,帮我查某个账户的记录(唤醒词:查账户):

            账  户: ____ (例如:支付宝 / 微信)
        result: HTML 展示账户记录 + 汇总
