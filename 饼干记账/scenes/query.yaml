# scenes/query.yaml — 查询域场景注册(域唯一事实源 · 合并器 = 公共层脚本)
# 场景 = 用户使用场景(时间/对比语义独立条目;参数 = 填空区)
# prompt 规则(定稿 · #144 补充决议 4):
#   1. 结构 = head 一行 + 字段区
#   2. head = 「请加载「饼干记账」技能,帮我<场景人话>(唤醒词:<唤醒词>):」
#   3. 字段 = 「  字段名: ____(提示)」;必填无提示,选填(选填[,如:示例]),默认(默认 X)
#   4. 禁写流程/呈现清单/反问/总结约束(全部下沉 SKILL.md 通用规则)
version: "2.0"
domain: query
subs:
  - name: 按时间
    wake_words:
      - wake_word: 查今天
        scenes:
          - id: query-1-1
            scenario_id: query_today
            scenario_title: 今日收支摘要
            type: 查看
            status: ""
            html: {template: "查询/today.html", command_cn: "今日摘要", data_source: "bills"}
            prompt: |
              请加载「饼干记账」技能,帮我看今天的收支摘要(唤醒词:查今天):
            result: "HTML 展示 4 KPI + 洞察 + 今日明细;空数据 → 空态引导"

      - wake_word: 查日期
        scenes:
          - id: query-2-1
            scenario_id: query_date_yesterday
            scenario_title: 查昨天
            type: 查看
            status: ""
            html: {template: "查询/list.html", command_cn: "查日期", data_source: "bills"}
            prompt: |
              请加载「饼干记账」技能,帮我查昨天的账(唤醒词:查日期):
            result: "HTML 展示昨日记录"
          - id: query-2-2
            scenario_id: query_date_specific
            scenario_title: 查某一天(指定日期)
            type: 查看
            status: ""
            html: {template: "查询/list.html", command_cn: "查日期", data_source: "bills"}
            prompt: |
              请加载「饼干记账」技能,帮我查某天的账(唤醒词:查日期):

                日  期: ____ (例如:5月1号 / 昨天 / 上周五)
            result: "HTML 展示指定日期记录;相对表达由 routing.py 换算"
          - id: query-2-3
            scenario_id: query_date_relative
            scenario_title: 查相对日期(如上周五)
            type: 查看
            status: ""
            html: {template: "查询/list.html", command_cn: "查日期", data_source: "bills"}
            prompt: |
              请加载「饼干记账」技能,帮我查某个相对日期的账(唤醒词:查日期):

                日  期: ____ (例如:上周五 / 前天)
            result: "相对时间换算(routing.py)→ HTML"

      - wake_word: 查范围
        scenes:
          - id: query-3-1
            scenario_id: query_range_week
            scenario_title: 查某周(本周/上周)
            type: 查看
            status: ""
            html: {template: "查询/list.html", command_cn: "查范围", data_source: "bills"}
            prompt: |
              请加载「饼干记账」技能,帮我查某周的账(唤醒词:查范围):

                周: ____ (例如:本周 / 上周)
            result: "HTML 展示该周记录(周一~周日)"
          - id: query-3-2
            scenario_id: query_range_custom
            scenario_title: 查自定义区间
            type: 查看
            status: ""
            html: {template: "查询/list.html", command_cn: "查范围", data_source: "bills"}
            prompt: |
              请加载「饼干记账」技能,帮我查某段时间的账(唤醒词:查范围):

                开始日期: ____ (例如:2026-05-01)
                结束日期: ____ (例如:2026-05-10)
            result: "HTML 展示区间记录;跨月/跨年正确计算"
          - id: query-3-3
            scenario_id: query_range_double_compare
            scenario_title: 双区间对比
            type: 查看
            status: ""
            html: {template: "查询/list.html", command_cn: "查范围", data_source: "bills"}
            prompt: |
              请加载「饼干记账」技能,帮我对比两段时间的账(唤醒词:查范围):

                区间一: ____ (例如:5 月)
                区间二: ____ (例如:6 月)
            result: "HTML 双列并排对比 + 变化率"

  - name: 按条件
    wake_words:
      - wake_word: 查分类
        scenes:
          - id: query-4-1
            scenario_id: query_category
            scenario_title: 查某分类记录
            type: 查看
            status: ""
            html: {template: "查询/list.html", command_cn: "查分类", data_source: "bills"}
            prompt: |
              请加载「饼干记账」技能,帮我查某分类的记录(唤醒词:查分类):

                分  类: ____ (例如:餐饮 / 出行 / 奶茶)
            result: "HTML 展示分类记录;多级分类/组合筛选由 AI 解析"

      - wake_word: 查最近
        scenes:
          - id: query-5-1
            scenario_id: query_recent
            scenario_title: 查最近记录(可排序)
            type: 查看
            status: ""
            html: {template: "查询/list.html", command_cn: "查最近", data_source: "bills"}
            prompt: |
              请加载「饼干记账」技能,帮我看最近的记录(唤醒词:查最近):

                条  数: ____ (选填,默认 10)
                排  序: ____ (选填,如:金额从大到小)
            result: "HTML 展示最近 N 条;排序可选"

      - wake_word: 搜备注
        scenes:
          - id: query-6-1
            scenario_id: query_search
            scenario_title: 搜索备注关键词
            type: 查看
            status: ""
            html: {template: "查询/list.html", command_cn: "搜备注", data_source: "bills"}
            prompt: |
              请加载「饼干记账」技能,帮我搜备注关键词(唤醒词:搜备注):

                关键词: ____
            result: "HTML 展示命中记录;零命中 → 空态"

      - wake_word: 查标签
        scenes:
          - id: query-7-1
            scenario_id: query_tag
            scenario_title: 查标签(#tag 聚合)
            type: 查看
            status: ""
            html: {template: "查询/tag.html", command_cn: "查标签", data_source: "bills"}
            prompt: |
              请加载「饼干记账」技能,帮我查某个标签的记录(唤醒词:查标签):

                标  签: ____ (例如:#旅行)
            result: "HTML 展示标签命中记录 + 聚合统计"

      - wake_word: 查账本
        scenes:
          - id: query-8-1
            scenario_id: query_ledger
            scenario_title: 查某账本记录
            type: 查看
            status: ""
            html: {template: "查询/list.html", command_cn: "查账本", data_source: "bills"}
            prompt: |
              请加载「饼干记账」技能,帮我查某个账本的记录(唤醒词:查账本):

                账  本: ____ (例如:旅行 / 生活)
            result: "HTML 展示账本记录 + 汇总"

      - wake_word: 查账户
        scenes:
          - id: query-9-1
            scenario_id: query_account
            scenario_title: 查某账户记录
            type: 查看
            status: ""
            html: {template: "查询/list.html", command_cn: "查账户", data_source: "bills"}
            prompt: |
              请加载「饼干记账」技能,帮我查某个账户的记录(唤醒词:查账户):

                账  户: ____ (例如:支付宝 / 微信)
            result: "HTML 展示账户记录 + 汇总"
