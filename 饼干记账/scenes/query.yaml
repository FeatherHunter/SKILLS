# scenes/query.yaml — 查询域场景注册(域唯一事实源 · 合并器 = 公共层脚本)
# 场景 = 用户「想查的每一件事」(直达式 · 2026-08-08 人类裁定)
# 接口语义(核心):时间查询 = start→end 区间(某天=start=end / 某周=周一~周日 / 某月=1日~末日)
# prompt 规则(#144 补充决议 4):head 一行 + 字段区;禁写流程/呈现/反问(下沉 SKILL.md)
# 交互:查询类 = 仅结果型 HTML(单 HTML);缺参 → AI 文字反问;5 状态兜底;动作区复制数据/日志
version: "2.0"
domain: query
subs:
  - name: 按时间
    wake_words:
      - wake_word: 查今天
        scenes:
          - id: query-1-1
            scenario_id: query_today
            scenario_title: 查今天收支
            type: 查看
            status: ""
            html: {template: "查询/today.html", command_cn: "今日摘要", data_source: "bills"}
            prompt: |
              请加载「饼干记账」技能,帮我看今天的收支(唤醒词:查今天):
            result: "结果型 HTML:4 KPI(支出/收入/净额/笔数)+ 今日明细 + 分类聚合;空数据 → 空态"

      - wake_word: 查昨天
        scenes:
          - id: query-2-1
            scenario_id: query_yesterday
            scenario_title: 查昨天收支
            type: 查看
            status: ""
            html: {template: "查询/list.html", command_cn: "昨日收支", data_source: "bills"}
            prompt: |
              请加载「饼干记账」技能,帮我看昨天的收支(唤醒词:查昨天):
            result: "结果型 HTML:4 KPI + 昨日明细;start=end=昨天;空 → 空态"

      - wake_word: 查某天
        scenes:
          - id: query-3-1
            scenario_id: query_date
            scenario_title: 查某一天的账
            type: 查看
            status: ""
            html: {template: "查询/list.html", command_cn: "查某天", data_source: "bills"}
            prompt: |
              请加载「饼干记账」技能,帮我查某天的账(唤醒词:查某天):

                日  期: ____ (如:5月1号 / 上周五 / 2026-05-01)
            result: "相对日期换算 → start=end=该天 → 结果型 HTML:4 KPI + 明细;空 → 空态"

      - wake_word: 查最近
        scenes:
          - id: query-4-1
            scenario_id: query_recent
            scenario_title: 查最近记录
            type: 查看
            status: ""
            html: {template: "查询/list.html", command_cn: "最近记录", data_source: "bills"}
            prompt: |
              请加载「饼干记账」技能,帮我看最近的记录(唤醒词:查最近):

                条  数: ____ (选填,默认 10)
                排  序: ____ (选填,如:金额从大到小)
                近几天: ____ (选填,如:近7天 / 近30天;与条数二选一)
            result: "结果型 HTML:笔数/总金额 KPI + 明细(排序);空 → 空态"

      - wake_word: 查周
        scenes:
          - id: query-5-1
            scenario_id: query_week
            scenario_title: 查某周的账
            type: 查看
            status: ""
            html: {template: "查询/list.html", command_cn: "查周", data_source: "bills"}
            prompt: |
              请加载「饼干记账」技能,帮我查某周的账(唤醒词:查周):

                周: ____ (如:本周 / 上周 / 5月第2周 / 2026-05-11那一周)
            result: "start=周一,end=周日 → 结果型 HTML:4 KPI + 明细 + 分类聚合;空 → 空态"

      - wake_word: 查月
        scenes:
          - id: query-6-1
            scenario_id: query_month
            scenario_title: 查某个月的账
            type: 查看
            status: ""
            html: {template: "查询/list.html", command_cn: "查月", data_source: "bills"}
            prompt: |
              请加载「饼干记账」技能,帮我查某个月的账(唤醒词:查月):

                月: ____ (如:本月 / 上月 / 3月 / 2026-03)
            result: "start=1日,end=末日 → 结果型 HTML:4 KPI + 明细 + 分类聚合;空 → 空态"

      - wake_word: 查区间
        scenes:
          - id: query-7-1
            scenario_id: query_range
            scenario_title: 查任意时间段
            type: 查看
            status: ""
            html: {template: "查询/list.html", command_cn: "查区间", data_source: "bills"}
            prompt: |
              请加载「饼干记账」技能,帮我查某段时间的账(唤醒词:查区间):

                开始日期: ____ (如:5月1号 / 2026-05-01)
                结束日期: ____ (如:5月10号 / 2026-05-10;某年填 12月31日)
            result: "start→end 自定义(几天/几月/某年/跨年)→ 结果型 HTML:4 KPI + 区间标注 + 明细 + 分类聚合"

  - name: 按条件
    wake_words:
      - wake_word: 查分类
        scenes:
          - id: query-8-1
            scenario_id: query_category
            scenario_title: 查某分类的账
            type: 查看
            status: ""
            html: {template: "查询/list.html", command_cn: "查分类", data_source: "bills"}
            prompt: |
              请加载「饼干记账」技能,帮我查某分类的账(唤醒词:查分类):

                分  类: ____ (如:餐饮 / 出行 / 奶茶)
                时  间: ____ (选填,如:本月 / 5月 / 5月1到10号)
                账  户: ____ (选填,如:支付宝)
                账  本: ____ (选填)
                收  支: ____ (选填,支出/收入/全部,默认全部)
            result: "结果型 HTML:该分类 KPI(支出/笔数/占比)+ 明细 + 时间跨度提示;组合参数(时间/账户/账本)由 AI 解析"

      - wake_word: 搜备注
        scenes:
          - id: query-9-1
            scenario_id: query_search
            scenario_title: 搜索备注关键词
            type: 查看
            status: ""
            html: {template: "查询/list.html", command_cn: "备注搜索", data_source: "bills"}
            prompt: |
              请加载「饼干记账」技能,帮我搜备注关键词(唤醒词:搜备注):

                关键词: ____
            result: "结果型 HTML:命中条数 + 明细;零命中 → 空态"

      - wake_word: 查标签
        scenes:
          - id: query-10-1
            scenario_id: query_tag
            scenario_title: 查标签(#tag 聚合)
            type: 查看
            status: ""
            html: {template: "查询/tag.html", command_cn: "查标签", data_source: "bills"}
            prompt: |
              请加载「饼干记账」技能,帮我查标签(唤醒词:查标签):

                标  签: ____ (如:#旅行 / #待报销)
            result: "结果型 HTML:标签聚合卡(总笔数/总金额)+ 明细"

      - wake_word: 查账户
        scenes:
          - id: query-11-1
            scenario_id: query_account
            scenario_title: 查某账户流水
            type: 查看
            status: ""
            html: {template: "查询/list.html", command_cn: "查账户", data_source: "bills"}
            prompt: |
              请加载「饼干记账」技能,帮我查某账户的流水(唤醒词:查账户):

                账  户: ____ (如:支付宝 / 微信 / 招行)
                时  间: ____ (选填,如:本月 / 上月)
            result: "结果型 HTML:账户流水 KPI(支出/收入/净额)+ 明细"

      - wake_word: 查账本
        scenes:
          - id: query-12-1
            scenario_id: query_ledger
            scenario_title: 查某账本的记录
            type: 查看
            status: ""
            html: {template: "查询/list.html", command_cn: "查账本", data_source: "bills"}
            prompt: |
              请加载「饼干记账」技能,帮我查某账本的记录(唤醒词:查账本):

                账  本: ____ (如:生活 / 旅行 / 借贷)
                时  间: ____ (选填)
            result: "结果型 HTML:账本汇总 KPI + 明细"

  - name: 按状态
    wake_words:
      - wake_word: 查欠款
        scenes:
          - id: query-13-1
            scenario_id: query_debt
            scenario_title: 查未还欠款(借贷状态)
            type: 查看
            status: ""
            html: {template: "查询/debt.html", command_cn: "查欠款", data_source: "bills(#未还)"}
            prompt: |
              请加载「饼干记账」技能,帮我查欠款(唤醒词:查欠款):

                对  象: ____ (选填,如:小明;不填查全部)
            result: "结果型 HTML:借出未还总额 + 借入未还总额 + 未还列表(对象/方向/金额/期限);查 #未还 聚合;无欠款 → 空态"

      - wake_word: 查待报销
        scenes:
          - id: query-14-1
            scenario_id: query_pending_reimburse
            scenario_title: 查待报销
            type: 查看
            status: ""
            html: {template: "查询/reimburse.html", command_cn: "查待报销", data_source: "bills(#待报销)"}
            prompt: |
              请加载「饼干记账」技能,帮我查待报销(唤醒词:查待报销):
            result: "结果型 HTML:#待报销 列表(金额/分类/日期)+ 总额;无 → 空态"

      - wake_word: 查分期
        scenes:
          - id: query-15-1
            scenario_id: query_installment
            scenario_title: 查进行中的分期
            type: 查看
            status: ""
            html: {template: "查询/installment.html", command_cn: "查分期", data_source: "bills(#分期)"}
            prompt: |
              请加载「饼干记账」技能,帮我查分期(唤醒词:查分期):

                名  目: ____ (选填,如:手机;不填查全部)
            result: "结果型 HTML:分期卡(名目/总额/每期/期数/已还期数/剩余期数+金额)+ #分期 记录明细;无 → 空态"
