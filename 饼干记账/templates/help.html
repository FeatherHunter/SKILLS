<!--
  ============================================================================
  饼干记账 · HELP HTML 模板 · v2.4
  5 类分门别类 + 3 层折叠 + Toast + 移动端 fallback
  ============================================================================
  使用:
    1. 复制此文件
    2. render_help.py 读 scenarios.json → 注入 payload → 替换 INJECT-DATA 占位符
    3. 输出到 D:/Downloads/饼干记账_HELP_<timestamp>.html (跨平台 fallback)
  ============================================================================
-->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>📚 饼干记账 · 唤醒词速查台</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f5f6f7; --card: #fff; --text: #1c1c1e; --sub: #6b6b6f;
    --accent: #0071e3; --green: #34c759; --orange: #ff9500;
    --code-bg: #f0f0f2; --border: #e5e5e7; --shadow: 0 1px 2px rgba(0,0,0,.04);
  }
  html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: 13px; line-height: 1.4; -webkit-font-smoothing: antialiased;
    min-height: 100vh; padding: 0 0 80px;
  }
  .container { max-width: 960px; margin: 0 auto; padding: 0 12px 40px; }

  /* ===== HERO (紧凑 · 对齐卡路里 v2.4.12) ===== */
  .hero {
    background: #f4f4f6;                  /* v11 保留 v9/v10 极淡灰,作为整块背景容纳标题+搜索栏 */
    padding: 24px 0 16px;                 /* v10 24/0/0 → v11 24/0/16:搜索栏下方给 16px 留白再出 hero */
    border-bottom: 0;
  }
  .hero .container { padding-bottom: 0; }  /* v10 关键修复:v11 search 已在 container 内,无需再设 container 底 padding */

  .hero h1 {
    font-size: 190%; font-weight: 700; letter-spacing: -.4px;
    line-height: 1.18; margin: 0 0 4px;                         /* v8: 1.15→1.18, 2px→4px */
  }
  .hero .sub {
    color: var(--accent); font-size: 12.5px; font-weight: 500;
    margin: 0 0 6px;                                             /* v8: 4px→6px */
    line-height: 1.45;
    word-spacing: 4px;
  }
  .hero .sub .arrow {                  /* 新增:箭头单独样式 */
    display: inline-block;
    margin: 0 2px;
    color: var(--orange);
    font-weight: 600;
  }
  .hero .stats {
    margin: 2px 0 0; display: flex; gap: 8px; flex-wrap: wrap;  /* v7: 4px→2px */
    font-size: 12px; color: var(--sub);
    line-height: 1.3;
  }
  .hero .stats span {                   /* 数字卡片化,深底更明显 */
    background: rgba(0,0,0,.05);
    border: 1px solid rgba(0,0,0,.06);
    padding: 3px 9px;
    border-radius: 999px;
  }
  .hero .stats b { color: var(--text); font-weight: 700; font-size: 13px; }   /* ↑ 600→700 加粗,加 13px */

  /* ===== CONTROLS (紧凑 · 对齐卡路里 v2.4.12) ===== */
  .controls {
    display: flex; gap: 6px; align-items: center; flex-wrap: wrap;
    margin: 14px 0 0;                              /* v11: 合并到 hero 内,只保留顶部 14px 间距,去掉 sticky/独立色块/边框/负 margin */
  }
  .controls input[type="search"] {
    flex: 1; min-width: 160px; padding: 7px 10px;
    border: 1px solid var(--border); border-radius: 8px;
    font-size: 12.5px; background: var(--card); color: var(--text);
    outline: none; transition: border-color .15s;
    font-family: inherit;
  }
  .controls input[type="search"]:focus { border-color: var(--accent); }
  .controls button {
    border: 1px solid var(--border); border-radius: 8px;
    background: var(--card); color: var(--text); padding: 7px 10px;
    font-size: 11px; font-weight: 600; cursor: pointer;
    transition: background .12s, color .12s, transform .15s, box-shadow .25s;
    font-family: inherit;
    -webkit-tap-highlight-color: transparent;
    tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  .controls button:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
  .controls button:active { transform: scale(0.96); }

  /* ===== L1 CATEGORY (紧凑 · 对齐卡路里 v2.4.12) ===== */
  .cat-block {
    background: var(--card); border-radius: 8px;
    margin: 3px 0; box-shadow: var(--shadow); overflow: hidden;
  }
  .cat-block:first-of-type { margin-top: 0; }
  .cat-block:last-of-type { margin-bottom: 0; }
  .cat-block > summary {
    cursor: pointer; list-style: none;
    display: flex; align-items: center; gap: 6px;
    padding: 7px 12px; font-size: 13px; font-weight: 600;
    background: #fafbfc; min-height: 36px;
    -webkit-tap-highlight-color: transparent;
    tap-highlight-color: transparent;
    touch-action: manipulation;
    -webkit-user-select: none;
    user-select: none;
  }
  .cat-block > summary::-webkit-details-marker { display: none; }
  .cat-block > summary::before {
    content: '▸'; font-size: 11px; color: var(--sub);
    transition: transform .12s; flex-shrink: 0; pointer-events: none;
  }
  .cat-block[open] > summary::before { transform: rotate(90deg); }
  .cat-block > summary > * { pointer-events: none; }
  .cat-name { flex: 1; }
  .cat-desc { font-size: 11px; color: var(--sub); font-weight: 400; }
  .cat-count-pill {
    font-size: 10px; font-weight: 500;
    color: var(--sub); background: #e5e5e7;
    padding: 1px 6px; border-radius: 999px;
  }
  .cat-content { padding: 4px 12px 10px; }

  /* ===== L2 WAKE WORD (紧凑 · 对齐卡路里 v2.4.12) ===== */
  .ww-block {
    background: #fff; border: 1px solid var(--border);
    border-radius: 6px; margin: 4px 0;
  }
  .ww-block > summary {
    padding: 6px 10px; cursor: pointer; list-style: none;
    display: flex; align-items: center; gap: 8px;
    font-size: 13px; font-weight: 600;
    -webkit-tap-highlight-color: transparent;
    tap-highlight-color: transparent;
    touch-action: manipulation;
    -webkit-user-select: none;
    user-select: none;
  }
  .ww-block > summary::-webkit-details-marker { display: none; }
  .ww-block > summary::before {
    content: '▸'; font-size: 10px; color: var(--sub);
    transition: transform .12s; flex-shrink: 0; pointer-events: none;
  }
  .ww-block[open] > summary::before { transform: rotate(90deg); }
  .ww-block > summary > * { pointer-events: none; }
  .ww-name { color: var(--text); }
  .ww-count {
    margin-left: auto; font-size: 11px; color: var(--sub);
    font-weight: 400;
  }
  .ww-content { padding: 0 10px 8px; }

  /* ===== L3 SCENARIO ===== */
  .sc-block {
    border: 1px solid var(--border); border-radius: 6px;
    margin: 3px 0; background: #fcfcfd;
  }
  .sc-block.pending { border-left: 3px solid var(--orange); }
  .sc-block > summary {
    padding: 4px 8px; cursor: pointer; list-style: none;
    display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
    font-size: 12px;
    -webkit-tap-highlight-color: transparent;
    tap-highlight-color: transparent;
    touch-action: manipulation;
    -webkit-user-select: none;
    user-select: none;
  }
  .sc-block > summary::-webkit-details-marker { display: none; }
  .sc-block > summary::before {
    content: '▸'; font-size: 9px; color: var(--sub);
    transition: transform .12s; flex-shrink: 0; pointer-events: none;
  }
  .sc-block[open] > summary::before { transform: rotate(90deg); }
  .sc-block > summary > * { pointer-events: none; }
  .sc-title { font-weight: 500; color: var(--accent); font-size: 13px; flex: 1; }
  .sc-dim {
    font-size: 10px; color: var(--sub); background: var(--bg);
    padding: 1px 6px; border-radius: 4px;
  }
  .sc-pending-tag {
    font-size: 9px; font-weight: 700; padding: 2px 6px;
    border-radius: 4px; background: #fff7e6; color: #ff9500;
  }
  .sc-content { padding: 0 8px 6px; }
  .sc-prompt {
    background: #f0f7ff; border-left: 2px solid var(--accent);
    padding: 6px 8px; border-radius: 4px; margin: 4px 0;
    font-family: "SF Mono", Consolas, monospace; font-size: 11.5px;
    word-break: break-word; line-height: 1.35;
    white-space: pre-wrap;
  }
  .sc-prompt::before { content: "💬 "; }
  .sc-result {
    font-size: 12px; color: var(--sub); margin: 6px 0 8px;
    padding-left: 4px;
  }
  .sc-result::before { content: "→ "; color: var(--sub); }

  /* ===== COPY BUTTON (4 状态反馈 · 对齐卡路里 v2.4.12) ===== */
  .copy-btn {
    font: inherit; font-size: 11px; padding: 4px 8px;
    border-radius: 5px; border: 1px solid var(--accent);
    background: #fff; color: var(--accent);
    cursor: pointer; margin: 3px 0;
    transition: background .12s, color .12s, transform .15s, box-shadow .25s;
    white-space: nowrap;
    -webkit-tap-highlight-color: transparent;
    tap-highlight-color: transparent;
  }
  .copy-btn:hover { background: var(--accent); color: #fff; }
  .copy-btn:active { transform: scale(0.94); background: var(--accent); color: #fff; }
  .copy-btn.copied {
    background: var(--green); border-color: var(--green); color: #fff;
    transform: scale(1.05);
    animation: copySuccess 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  /* sc-block summary 折叠态复制按钮(v12 需求:按钮在名字右边,展开后不显示) */
  .sc-block > summary .copy-btn {
    background: var(--accent); color: #fff; border: none;
    padding: 3px 9px; border-radius: 6px; font-size: 11px;
    cursor: pointer; margin-left: auto; flex-shrink: 0;
    pointer-events: auto;        /* 覆盖 summary > * 的 pointer-events: none */
  }
  .sc-block > summary .copy-btn:hover { opacity: 0.85; }
  .sc-block[open] > summary .copy-btn { display: none; }   /* 展开后整行没有复制按钮 */

  /* ===== HELP 唤醒词速查列表（4 条 HELP 唤醒词） ===== */
  .help-ww-list { padding: 6px 0; }
  .help-ww-item {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 12px; margin: 4px 0;
    background: var(--code-bg); border-radius: 6px;
  }
  .help-ww-code {
    flex: 1; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 14px; color: var(--accent); font-weight: 600;
    word-break: break-all;
  }
  @keyframes copySuccess {
    0%   { transform: scale(0.94); box-shadow: 0 0 0 0 rgba(52,199,89,0); }
    50%  { transform: scale(1.10); box-shadow: 0 0 0 8px rgba(52,199,89,0.30); }
    100% { transform: scale(1.05); box-shadow: 0 0 0 4px rgba(52,199,89,0.18); }
  }

  /* ===== TOAST (iOS 风格通知) ===== */
  .toast {
    position: fixed; left: 50%; bottom: 32px;
    transform: translateX(-50%) scale(0.9);
    opacity: 0;
    background: rgba(28,28,30,0.94);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    backdrop-filter: blur(20px) saturate(180%);
    color: #f0f0f0;
    border-radius: 14px;
    padding: 13px 14px 13px 16px;
    display: flex; align-items: flex-start; gap: 12px;
    max-width: 480px; min-width: 320px;
    box-shadow: 0 10px 32px rgba(0,0,0,0.32), 0 0 0 0.5px rgba(255,255,255,0.08) inset;
    pointer-events: none;
    transition: opacity 0.22s ease-out, transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
    z-index: 9999;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) scale(1);
    pointer-events: auto;
  }
  .toast-icon { font-size: 22px; line-height: 1; padding-top: 1px; flex-shrink: 0; }
  .toast-body { flex: 1; min-width: 0; }
  .toast-title {
    font-weight: 600; font-size: 13px; line-height: 1.4;
    color: #fff; margin-bottom: 3px;
  }
  .toast-title em {
    font-style: normal; color: #4dd96b; font-weight: 600;
  }
  .toast-detail { font-size: 11.5px; line-height: 1.55; color: #c8c8cc; }
  .toast-close {
    background: rgba(255,255,255,0.10);
    color: #4dd96b;
    border: 0; border-radius: 8px;
    padding: 6px 10px; font-size: 11px; font-weight: 500;
    font-family: inherit; cursor: pointer;
    white-space: nowrap;
    margin-left: 6px; flex-shrink: 0;
    transition: background 0.12s;
    -webkit-tap-highlight-color: transparent;
  }
  .toast-close:hover { background: rgba(255,255,255,0.18); }
  .toast-close:active { transform: scale(0.96); }

  /* ===== EMPTY / NO MATCH / FOOTER (紧凑 · 对齐卡路里 v2.4.12) ===== */
  .empty, .no-match {
    text-align: center; padding: 24px; color: var(--sub); font-size: 13px;
    background: var(--card); border-radius: 8px;
    box-shadow: var(--shadow); margin: 12px 0;
  }
  footer {
    text-align: center; color: var(--sub); font-size: 10px;
    padding: 12px 0 0; margin-top: 16px;
  }

  /* Hidden (search filter) */
  .cat-block.hidden, .ww-block.hidden, .sc-block.hidden { display: none; }

  /* === MOBILE (≤600px) === */
  @media (max-width: 600px) {
    body { font-size: 12.5px; }
    .container { padding: 0 8px 60px; }
    .hero { padding: 20px 0 14px; }           /* v11: 20/0/0 → 20/0/14 搜索栏下加 14px 留白 */
    .hero .container { padding-bottom: 0; }   /* v10: 移动 container 内部 padding-bottom 60px → 0 */
    .hero h1 { font-size: 21px; }
    .hero .sub { font-size: 12px; }
    .hero .stats { gap: 6px; font-size: 11.5px; }
    .controls { margin: 12px 0 0; }                                /* v11: 合并到 hero 内,顶部 12px 间距 */
    .controls input[type="search"] { font-size: 12.5px; padding: 7px 10px; }
    .controls button { font-size: 11px; padding: 7px 8px; }
    .cat-block > summary { padding: 8px 10px; font-size: 12.5px; }
    .cat-content { padding: 4px 10px 8px; }
    .ww-block > summary { padding: 7px 9px; }
    .ww-content { padding: 0 9px 7px; }
    .sc-block > summary {
      display: flex;                                      /* v15: 去掉 dims 后回到 flex 布局,3 个元素就够 */
      align-items: center;
      flex-wrap: wrap;
      gap: 4px 6px;
      padding: 8px 10px;                                  /* v13: 加大内边距,手指好按 */
    }
    .sc-title {
      flex: 1 1 0%;                                       /* 标题吃满中间剩余宽度 */
      min-width: 0;
      font-size: 12.5px;
      text-align: left;                                   /* v15: 明确左对齐 */
    }
    .sc-pending-tag {
      font-size: 9px; padding: 1px 5px;                  /* 跟在标题右边 */
      flex: 0 0 auto;
    }
    .sc-block > summary .copy-btn {
      flex: 0 0 auto;
      margin-left: auto;                                  /* 推到最右 */
      padding: 5px 10px; font-size: 11px;
    }
    .sc-content { padding: 0 10px 8px; text-align: left; }              /* v15: 明确左对齐 */
    .sc-prompt { font-size: 11px; line-height: 1.4; padding: 6px 9px; text-align: left; }
    .sc-result { font-size: 11.5px; line-height: 1.4; margin: 6px 0 6px; text-align: left; }
    .toast {
      left: 12px; right: 12px;
      bottom: calc(12px + env(safe-area-inset-bottom, 0));
      transform: translateX(0) scale(0.95);
      max-width: none; min-width: 0;
      padding: 12px 12px 12px 14px;
    }
    .toast.show { transform: translateX(0) scale(1); }
    .toast-icon { font-size: 20px; }
    .toast-title { font-size: 12.5px; }
    .toast-detail { font-size: 11px; }
    body { padding-bottom: env(safe-area-inset-bottom, 0); }
  }

  /* === TABLET (601-900px) === */
  @media (min-width: 601px) and (max-width: 900px) {
    .container { max-width: 720px; }
  }
</style>
</head>
<body>

<div class="hero"><div class="container">
  <h1>📚 饼干记账 · 唤醒词速查台</h1>
  <div class="sub">💡 类别<span class="arrow">→</span>选唤醒词<span class="arrow">→</span>展开场景<span class="arrow">→</span>复制 prompt<span class="arrow">→</span>贴给 AI</div>
  <div class="stats" id="heroStats"></div>
  <div class="controls">
    <input type="search" id="searchInput" placeholder="🔍 搜索唤醒词 / 场景标题 / prompt..." />
    <button id="expandAll" type="button">📂 全部展开</button>
    <button id="collapseAll" type="button">📁 全部折叠</button>
  </div>
</div></div>

<div class="container">
  <main id="mainContent"><div class="empty">加载中…</div></main>

  <footer>
    由 <code>references/scenarios.json</code> 派生 ·
    <code>scripts/render_help.py</code> 渲染 · v2.4
    <div id="generatedAt" style="margin-top:4px;"></div>
  </footer>
</div>

<!-- ===== TOAST (iOS 风格) ===== -->
<div id="toast" class="toast" role="status" aria-live="polite">
  <div class="toast-icon">📋</div>
  <div class="toast-body">
    <div class="toast-title">已复制 <em id="toastWake">prompt</em></div>
    <div class="toast-detail">粘贴给 AI（微信/飞书/任何 AI 工具），饼干记账技能会自动执行</div>
  </div>
  <button class="toast-close" id="toastClose">✓ 知道了</button>
</div>



<!--INJECT-DATA-->



<script>
// ===== XSS 防护 =====
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  })[c]);
}

// ===== 主流程: 读 payload =====
function getPayload() {
  // 兼容 §04 渲染器标准 + 本 skill 注入器模式
  let data = window.__DATA__;
  if (typeof data !== 'object' || data === null) {
    const el = document.getElementById('payload');
    if (el && el.textContent) {
      try { data = JSON.parse(el.textContent); } catch(e) { return null; }
    }
  }
  return data && data.data ? data.data : null;
}

// ===== Toast 控制器 =====
const toastEl = document.getElementById('toast');
const toastWakeEl = document.getElementById('toastWake');
const toastCloseEl = document.getElementById('toastClose');
let toastTimer = null;
function showToast(wake) {
  if (toastWakeEl) toastWakeEl.textContent = wake;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 4500);
}
if (toastCloseEl) {
  toastCloseEl.addEventListener('click', () => {
    toastEl.classList.remove('show');
    clearTimeout(toastTimer);
  });
}

// ===== 复制 =====
function fallbackCopy(text) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.cssText = 'position:fixed;opacity:0';
  document.body.appendChild(ta);
  ta.focus(); ta.select();
  try { document.execCommand('copy'); } catch(e) {}
  document.body.removeChild(ta);
}
function doCopy(btn) {
  const prompt = btn.getAttribute('data-prompt') || '';
  const card = btn.closest('.sc-block');
  let wake = '';
  if (card) {
    const ww = card.closest('.ww-block');
    if (ww) wake = ww.querySelector('.ww-name')?.textContent.trim() || '';
  }
  showToast(wake || 'prompt');
  const after = () => {
    const orig = btn.textContent;
    btn.textContent = '✓ 已复制';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = orig; btn.classList.remove('copied'); }, 2000);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(prompt).then(after).catch(() => { fallbackCopy(prompt); after(); });
  } else {
    fallbackCopy(prompt);
    after();
  }
}

// 供 summary 层 onclick 调用(对齐卡路里 ticket 07)
function doCopyBtn(btn) {
  const prompt = btn.getAttribute('data-prompt') || '';
  const wwBlock = btn.closest('.ww-block');
  let wake = '';
  if (wwBlock) wake = wwBlock.querySelector('.ww-name')?.textContent.trim() || '';
  showToast(wake || 'prompt');
  const after = () => {
    const orig = btn.textContent;
    btn.textContent = '✓ 已复制';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = orig; btn.classList.remove('copied'); }, 2000);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(prompt).then(after).catch(() => { fallbackCopy(prompt); after(); });
  } else {
    fallbackCopy(prompt);
    after();
  }
}

// ===== 渲染 =====
function render() {
  const data = getPayload();
  const mainEl = document.getElementById('mainContent');
  const statsEl = document.getElementById('heroStats');

  if (!data || !data.categories) {
    mainEl.innerHTML = '<div class="empty">❌ 数据加载失败</div>';
    return;
  }

  statsEl.innerHTML =
    '<span><b>' + esc(data.categories.length) + '</b> 类别</span>' +
    '<span><b>' + esc(data.wake_words_total) + '</b> 唤醒词</span>' +
    '<span><b>' + esc(data.scenarios_total) + '</b> 场景</span>';

  document.getElementById('generatedAt').textContent = '生成时间: ' + esc(data.generated_at || '');

  if (!data.categories.length) {
    mainEl.innerHTML = '<div class="empty">📭 暂无类别</div>';
    return;
  }

  mainEl.innerHTML = data.categories.map(function(cat) {
    return renderCategory(cat, data);
  }).join('');

  // 绑定复制按钮
  mainEl.querySelectorAll('.copy-btn').forEach(b => {
    if (b.__bound) return;
    b.__bound = true;
    b.addEventListener('click', () => doCopy(b));
  });

  // 移动端 fallback toggle (部分 Android WebView 兼容)
  bindFallbackToggle(mainEl);
}

// ===== L1 类别 =====
function renderCategory(cat, payload) {
  const wws = cat.wake_words || [];
  // HELP 类别（第 5 类）特殊处理：cat.wake_words=[] 但应展示 4 条 HELP 唤醒词
  // 来自 payload.help_wake_words（scenarios.json._meta.help_wake_words，与 SKILL.md §唤醒词总表同步）
  if (cat.key === 'help') {
    return '';
  }
  if (!wws.length) {
    return '';  // 跳过其他空类别
  }
  const scCount = cat.scenario_count || 0;
  const desc = cat.desc ? ' · <span class="cat-desc">' + esc(cat.desc) + '</span>' : '';
  return '<details class="cat-block">' +
    '<summary>' +
      '<span class="cat-name">' + esc(cat.icon || '') + ' ' + esc(cat.name) + '</span>' +
      desc +
      '<span class="cat-count-pill">' + wws.length + '</span>' +
    '</summary>' +
    '<div class="cat-content">' + wws.map(renderWakeWord).join('') + '</div>' +
    '</details>';
}

// ===== L2 唤醒词 =====
function renderWakeWord(ww) {
  const scs = ww.scenarios || [];
  return '<details class="ww-block">' +
    '<summary>' +
      '<span class="ww-name">' + esc(ww.name) + '</span>' +
      '<span class="ww-count">' + scs.length + '</span>' +
    '</summary>' +
    '<div class="ww-content">' + scs.map(renderScenario).join('') + '</div>' +
    '</details>';
}

// ===== L3 场景 =====
function renderScenario(sc) {
  const isPending = sc.status === '【待开发】';
  return '<details class="sc-block' + (isPending ? ' pending' : '') + '" data-search="' +
    esc((sc.scenario_title || '') + ' ' + (sc.prompt || '')) + '">' +
    '<summary>' +
      '<span class="sc-title">' + esc(sc.scenario_title || '') + '</span>' +
      (isPending ? '<span class="sc-pending-tag">【待开发】</span>' : '') +
      '<button type="button" class="copy-btn copy-sc" data-prompt="' + esc(sc.prompt || '') + '" onclick="event.preventDefault(); event.stopPropagation(); doCopyBtn(this)">📋 复制</button>' +
    '</summary>' +
    '<div class="sc-content">' +
      '<div class="sc-prompt">' + esc(sc.prompt || '') + '</div>' +
      '<div class="sc-result">' + esc(sc.result || '') + '</div>' +
    '</div>' +
    '</details>';
}

// ===== 全部展开 / 折叠 =====
function setAllDetails(open) {
  document.querySelectorAll('#mainContent details').forEach(d => { d.open = open; });
}
document.getElementById('expandAll').addEventListener('click', () => setAllDetails(true));
document.getElementById('collapseAll').addEventListener('click', () => setAllDetails(false));

// ===== 搜索过滤 =====
document.getElementById('searchInput').addEventListener('input', function() {
  const q = this.value.trim().toLowerCase();
  const cats = document.querySelectorAll('.cat-block');
  let anyVisible = false;
  cats.forEach(cat => {
    const wws = cat.querySelectorAll('.ww-block');
    let catHasVisible = false;
    wws.forEach(ww => {
      const scs = ww.querySelectorAll('.sc-block');
      let wwHasVisible = false;
      scs.forEach(sc => {
        let match = q === '';
        if (!match) {
          const text = sc.getAttribute('data-search') || '';
          match = text.toLowerCase().indexOf(q) !== -1;
        }
        sc.classList.toggle('hidden', !match);
        if (match) wwHasVisible = true;
      });
      ww.classList.toggle('hidden', !wwHasVisible);
      if (wwHasVisible) catHasVisible = true;
    });
    cat.classList.toggle('hidden', !catHasVisible);
    if (catHasVisible) anyVisible = true;
  });
  let noMatch = document.getElementById('noMatch');
  if (!anyVisible && q !== '') {
    if (!noMatch) {
      noMatch = document.createElement('div');
      noMatch.id = 'noMatch';
      noMatch.className = 'no-match';
      document.getElementById('mainContent').appendChild(noMatch);
    }
    noMatch.textContent = '🔍 无匹配: "' + q + '"';
  } else if (noMatch) {
    noMatch.remove();
  }
});

// ===== 移动端 fallback toggle (§卡路里 v2.4.10 抗审查修) =====
// 部分 Android WebView / 旧 iOS Safari 上 native <details> 因 tap-highlight / 子元素吞噬
// 偶发不响应。监听 click, 50ms 后若状态没翻, 则强制翻。
function bindFallbackToggle(scope) {
  scope.querySelectorAll('.cat-block > summary, .ww-block > summary, .sc-block > summary').forEach(sum => {
    if (sum.__bound_fb) return;
    sum.__bound_fb = true;
    sum.addEventListener('click', () => {
      const det = sum.parentElement;
      const wasOpen = det.open;
      setTimeout(() => {
        if (det.open === wasOpen) det.open = !wasOpen;
      }, 50);
    }, { passive: true });
  });
}

// ===== 启动 =====
try {
  render();
} catch (err) {
  document.getElementById('mainContent').innerHTML =
    '<div class="empty">❌ 渲染失败: ' + esc(err.message || '') + '</div>';
  console.error(err);
}

// ===== 离线检测 =====
window.addEventListener('offline', () => {
  const t = document.createElement('div');
  t.textContent = '📡 当前离线,页面可能过期';
  t.style.cssText = 'position:fixed;top:0;left:0;right:0;padding:8px;background:#fff7e6;color:#ff9500;text-align:center;font-size:12px;z-index:9999;';
  document.body.appendChild(t);
});
</script>
