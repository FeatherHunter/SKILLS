<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>饼干记账 · 复合操作确认</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --bg:#f5f5f7; --card:#fff; --line:#e5e5ea; --fg:#1d1d1f; --fg2:#6e6e73; --fg3:#86868b; --blue:#007aff; --blue2:#0a63ce; --green:#34c759; --red:#ff3b30; --orange:#ff9500; --soft:#f5f8ff; --shadow:0 1px 3px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.05); }
  body { font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--fg); line-height:1.6; -webkit-font-smoothing:antialiased; padding:0 0 90px; }
  .wrap { max-width:640px; margin:0 auto; padding:24px 16px; }
  .header { padding:6px 0 18px; }
  .eyebrow { font-size:12px; color:var(--fg3); font-weight:600; letter-spacing:.06em; margin-bottom:6px; }
  h1 { font-size:27px; font-weight:700; letter-spacing:-.02em; }
  .chips { display:flex; gap:8px; margin-top:8px; flex-wrap:wrap; }
  .chip { font-size:11.5px; font-weight:600; padding:3px 10px; border-radius:999px; background:var(--soft); color:var(--blue2); border:1px solid #d7e6ff; }
  .card { background:var(--card); border-radius:16px; box-shadow:var(--shadow); padding:18px 20px; margin-bottom:14px; }
  .card h2 { font-size:14.5px; font-weight:700; margin-bottom:10px; }
  .warn { background:#ffeaea; border:1px solid #ffc9c9; border-radius:12px; padding:11px 14px; font-size:13px; color:#a33; margin-bottom:12px; display:none; }
  .warn.show { display:block; }
  .warn b { color:#c0392b; }
  .info { background:var(--soft); border:1px solid #d7e6ff; border-radius:12px; padding:11px 14px; font-size:12.5px; color:var(--blue2); margin-bottom:12px; }
  .op { border-left:3px solid var(--blue); background:#f8f8fa; border-radius:0 10px 10px 0; padding:10px 14px; margin-bottom:8px; font-size:13.5px; }
  .op .n { font-weight:700; color:var(--blue); }
  .op small { color:var(--fg3); font-size:11.5px; display:block; margin-top:2px; }
  .cand { border:1.5px solid var(--line); border-radius:12px; padding:11px 14px; margin-bottom:8px; cursor:pointer; display:flex; gap:10px; align-items:flex-start; transition:border .15s; }
  .cand.sel { border-color:var(--blue); background:var(--soft); }
  .cand input { margin-top:3px; }
  .cand .c-t { font-size:13.5px; font-weight:600; }
  .cand .c-d { font-size:12px; color:var(--fg3); }
  .cand .c-a { font-size:13px; font-weight:700; color:var(--red); margin-left:auto; white-space:nowrap; }
  .empty-cand { color:var(--fg3); font-size:13px; padding:10px 4px; }
  label.field { display:block; font-size:12px; font-weight:600; color:var(--fg2); margin:12px 0 5px; }
  input[type=text], input[type=number] { width:100%; border:1px solid var(--line); border-radius:10px; padding:9px 12px; font-size:14px; font-family:inherit; outline:none; }
  input:focus { border-color:var(--blue); box-shadow:0 0 0 3px rgba(0,122,255,.12); }

  .actions { display:flex; justify-content:flex-end; gap:10px; flex-wrap:wrap; margin:4px 0 16px; }
  .btn-main { display:inline-flex; align-items:center; gap:6px; border:0; background:var(--blue); color:#fff; border-radius:999px; padding:10px 18px; font-size:14px; font-weight:600; cursor:pointer; font-family:inherit; transition:background .15s; }
  .btn-main:hover { background:var(--blue2); }
  .btn-main.copied { background:var(--green); }
  .btn { display:inline-flex; align-items:center; justify-content:center; border:0; background:#fff; color:var(--fg); border:1px solid var(--line); border-radius:999px; padding:8px 14px; font-size:13px; font-weight:600; cursor:pointer; font-family:inherit; }
  .btn:hover { background:var(--bg); }

  .toast { position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom,0)); transform:translateX(-50%) scale(.9); opacity:0; background:rgba(28,28,30,.94); -webkit-backdrop-filter:blur(20px) saturate(180%); backdrop-filter:blur(20px) saturate(180%); color:#f0f0f0; border-radius:14px; padding:13px 14px 13px 16px; display:flex; align-items:flex-start; gap:12px; max-width:480px; min-width:300px; box-shadow:0 10px 32px rgba(0,0,0,.32); pointer-events:none; transition:opacity .22s ease-out, transform .22s cubic-bezier(.34,1.56,.64,1); z-index:99; }
  .toast.show { opacity:1; transform:translateX(-50%) scale(1); pointer-events:auto; }
  .toast-title { font-weight:600; font-size:12.5px; color:#fff; margin-bottom:2px; }
  .toast-detail { font-size:11px; color:#c8c8cc; }
  .toast-close { background:rgba(255,255,255,.10); color:#34c759; border:0; border-radius:8px; padding:5px 9px; font-size:10.5px; margin-left:6px; cursor:pointer; flex-shrink:0; }
  @media (max-width:640px) { .wrap { padding:18px 12px 70px; } h1 { font-size:23px; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="header">
    <div class="eyebrow" id="eyebrow">饼干记账 · 复合操作</div>
    <h1 id="title">记一笔退款</h1>
    <div class="chips" id="chips"></div>
  </header>

  <main>
    <div class="card">
      <h2>将执行以下操作</h2>
      <div id="ops"></div>
    </div>

    <div class="card" id="candCard">
      <h2 id="candTitle">关联原记录</h2>
      <div id="cands"></div>
      <div class="empty-cand" id="emptyCand" hidden>未找到原记录 —— AI 会询问你补全(不会猜)。</div>
    </div>

    <div class="warn" id="warnBox"></div>

    <div class="card">
      <label class="field">退款额 / 到账额(元)</label>
      <input type="number" step="0.01" id="fAmount">
      <label class="field" id="reasonLabel">退款原因</label>
      <input type="text" id="fReason" placeholder="如:退货 / 取消订单(选填)">
    </div>
  </main>

  <div class="actions">
    <button class="btn-main" id="copyPromptBtn">📋 复制确认 prompt</button>
    <button class="btn" id="copyDataBtn">复制数据</button>
    <button class="btn" id="copyLogBtn">🛠 复制日志</button>
  </div>

  <script id="payload" type="application/json"><!--INJECT-DATA--></script>

  <div class="toast" id="toast">
    <div class="toast-title">已复制 <em id="toastFmt" style="font-style:normal;color:#34c759;font-weight:600"></em></div>
    <div class="toast-detail" id="toastDetail"></div>
    <button class="toast-close" id="toastClose">✓ 知道了</button>
  </div>
</div>

<script>
(function () {
  'use strict';
  var esc = function (s) { return String(s ?? '').replace(/[&<>"']/g, function (c) { return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]); }); };

  var payload;
  try { payload = JSON.parse(document.getElementById('payload').textContent); } catch (e) { return; }
  if (!payload || payload.status !== 'ok') return;
  var d = payload.data || {};
  var meta = d.meta || {};
  var form = d.form || {};
  var TYPE = form.type || 'refund';  // refund | reimburse_done
  var META = {
    refund: { wake: '记退款', action: '记一笔退款', label: '关联原支出' },
    reimburse_done: { wake: '报销到账', action: '报销到账', label: '关联待报销记录' },
  };
  var TM = META[TYPE] || META.refund;
  var WAKE = meta.wake_word || TM.wake;

  document.getElementById('title').textContent = TM.action;
  document.getElementById('eyebrow').textContent = '饼干记账 · 复合操作确认';
  document.getElementById('chips').innerHTML =
    '<span class="chip">⚡ ' + esc(WAKE) + '</span>' +
    '<span class="chip">● 两步确认</span>' +
    '<span class="chip">🕒 ' + esc(d.generated_at || '') + '</span>';
  document.getElementById('candTitle').textContent = TM.label;

  // 金额输入 + 原因(label 按类型)
  var elAmount = document.getElementById('fAmount');
  elAmount.value = form.amount || '';
  var reasonEl = document.getElementById('fReason');
  if (TYPE === 'reimburse_done') {
    document.getElementById('reasonLabel').textContent = '关联说明(选填)';
  } else {
    reasonEl.value = form.reason || '';
  }

  // ── 操作预览 ──
  document.getElementById('ops').innerHTML = (form.operations || []).map(function (op) {
    return '<div class="op"><span class="n">' + esc(op.label) + '</span>' + esc(op.text) +
      (op.detail ? '<small>' + esc(op.detail) + '</small>' : '') + '</div>';
  }).join('');

  // ── 候选选择(radio) ──
  var cands = form.candidates || [];
  var selectedId = null;
  var candBox = document.getElementById('cands');
  document.getElementById('emptyCand').hidden = cands.length > 0;
  document.getElementById('candCard').style.display = cands.length ? '' : 'none';
  candBox.innerHTML = cands.map(function (c) {
    return '<div class="cand" data-id="' + c.id + '">' +
      '<input type="radio" name="cand" value="' + c.id + '">' +
      '<div><div class="c-t">' + esc(c.category) + ' · ' + esc(c.note || '无备注') + '</div>' +
      '<div class="c-d">' + esc((c.time || '').slice(0, 16)) + ' · ID=' + c.id + '</div></div>' +
      '<div class="c-a">' + esc(String(c.amount)) + '</div></div>';
  }).join('');
  var els = candBox.querySelectorAll('.cand');
  els.forEach(function (el) {
    el.onclick = function () {
      selectedId = el.getAttribute('data-id');
      els.forEach(function (x) { x.classList.toggle('sel', x === el); });
      el.querySelector('input').checked = true;
      checkOverflow();
    };
  });
  // 默认选第一笔
  if (cands.length) {
    selectedId = String(cands[0].id);
    els[0].classList.add('sel');
    els[0].querySelector('input').checked = true;
  }

  // ── 超支警示(退款额 > 原支出) ──
  function checkOverflow() {
    var warnBox = document.getElementById('warnBox');
    if (TYPE !== 'refund') { warnBox.classList.remove('show'); return; }
    var amt = parseFloat(elAmount.value) || 0;
    var cand = cands.find(function (c) { return String(c.id) === selectedId; });
    if (cand && amt > Math.abs(parseFloat(cand.amount) || 0)) {
      warnBox.innerHTML = '⚠️ <b>退款额超过原支出</b> —— 原支出 ' + Math.abs(parseFloat(cand.amount)) +
        ' 元,退款 ' + amt + ' 元。核对是否部分退款/多笔退款,确认无误可继续。';
      warnBox.classList.add('show');
    } else {
      warnBox.classList.remove('show');
    }
  }
  elAmount.addEventListener('input', checkOverflow);
  checkOverflow();

  // ── 确认 prompt ──
  function buildPrompt() {
    var cand = cands.find(function (c) { return String(c.id) === selectedId; });
    var candTxt = cand
      ? ('#' + cand.id + ' (' + (cand.time || '').slice(0, 10) + ' ' + cand.category + ' ' + cand.amount + (cand.note ? ' ' + cand.note : '') + ')')
      : '__(AI 查后补)__';
    var lines = [];
    if (TYPE === 'refund') {
      lines.push('请加载「饼干记账」技能,帮我记一笔退款(唤醒词:记退款):');
      lines.push('');
      lines.push('  金\u2003额: ' + elAmount.value);
      lines.push('  原支出: ' + candTxt);
      lines.push('  退款原因: ' + (reasonEl.value || '(选填)'));
    } else {
      lines.push('请加载「饼干记账」技能,帮我记录报销到账(唤醒词:报销到账):');
      lines.push('');
      lines.push('  金\u2003额: ' + elAmount.value);
      lines.push('  关\u2003联: ' + candTxt);
    }
    return lines.join('\n');
  }

  // ── 复制 ──
  var toastTimer = null;
  function showToast(fmt) {
    var detailMap = { prompt: '粘贴给 AI 即可执行两步操作', data: '粘贴到聊天/笔记', log: '发给开发者排障' };
    document.getElementById('toastFmt').textContent = fmt === 'log' ? '日志' : fmt.toUpperCase();
    document.getElementById('toastDetail').textContent = detailMap[fmt] || '';
    document.getElementById('toast').classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { document.getElementById('toast').classList.remove('show'); }, 4500);
  }
  function doCopy(text, fmt, btn) {
    function done() { if (btn) { btn.classList.add('copied'); setTimeout(function () { btn.classList.remove('copied'); }, 1600); } showToast(fmt); }
    function fb() { var t = document.createElement('textarea'); t.value = text; document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove(); done(); }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done).catch(fb);
    else fb();
  }
  document.getElementById('copyPromptBtn').onclick = function () { doCopy(buildPrompt(), 'prompt', this); };
  document.getElementById('copyDataBtn').onclick = function () {
    doCopy(JSON.stringify({ form: { type: TYPE, amount: elAmount.value, selected_id: selectedId, candidates: cands } }, null, 2), 'data');
  };
  document.getElementById('copyLogBtn').onclick = function () {
    var lines = [];
    lines.push('① 场景标识');
    lines.push('  command_cn: ' + TM.action + ' 确认');
    lines.push('  唤醒词: ' + WAKE);
    lines.push('  场景名: ' + TM.action);
    lines.push('');
    lines.push('② AI 思考链: 定位原记录 → 两步操作预览 → 用户确认 → 写新+改旧');
    lines.push('');
    lines.push('③ 底层数据结构');
    lines.push('  form: ' + JSON.stringify({ type: TYPE, amount: elAmount.value, selected_id: selectedId }));
    lines.push('  DB 操作: INSERT bills(新) + UPDATE bills(标记 #已退款/#报销到账)');
    lines.push('');
    lines.push('④ 调用链');
    lines.push('  渲染脚本: ' + (meta.render_cmd || '(未知)'));
    lines.push('');
    lines.push('⑤ 时间戳 + 版本');
    lines.push('  本地时间: ' + (d.generated_at || '(未知)'));
    lines.push('  skill 版本: ' + (meta.version || '(未知)'));
    lines.push('');
    lines.push('⑥ 异常信息: 无');
    doCopy(lines.join('\n'), 'log');
  };
  document.getElementById('toastClose').onclick = function () {
    document.getElementById('toast').classList.remove('show');
    clearTimeout(toastTimer);
  };
})();
</script>
</body>
</html>
