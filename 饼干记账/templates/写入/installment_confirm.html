<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>饼干记账 · 记分期确认</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --bg:#f5f5f7; --card:#fff; --line:#e5e5ea; --fg:#1d1d1f; --fg2:#6e6e73; --fg3:#86868b; --blue:#007aff; --blue2:#0a63ce; --green:#34c759; --red:#ff3b30; --soft:#f5f8ff; --shadow:0 1px 3px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.05); }
  body { font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--fg); line-height:1.6; -webkit-font-smoothing:antialiased; padding:0 0 90px; }
  .wrap { max-width:680px; margin:0 auto; padding:24px 16px; }
  .header { padding:6px 0 18px; }
  .eyebrow { font-size:12px; color:var(--fg3); font-weight:600; letter-spacing:.06em; margin-bottom:6px; }
  h1 { font-size:27px; font-weight:700; letter-spacing:-.02em; }
  .chips { display:flex; gap:8px; margin-top:8px; flex-wrap:wrap; }
  .chip { font-size:11.5px; font-weight:600; padding:3px 10px; border-radius:999px; background:var(--soft); color:var(--blue2); border:1px solid #d7e6ff; }
  .card { background:var(--card); border-radius:16px; box-shadow:var(--shadow); padding:18px 20px; margin-bottom:14px; }
  .card h2 { font-size:14.5px; font-weight:700; margin-bottom:10px; }
  .params { display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:10px; }
  .param { background:#f8f8fa; border-radius:10px; padding:9px 12px; }
  .param .k { font-size:11px; color:var(--fg3); font-weight:600; }
  .param .v { font-size:15px; font-weight:700; margin-top:2px; }
  .sum-check { background:#e7f8ee; border:1px solid #b8e6c8; border-radius:10px; padding:9px 12px; font-size:12.5px; color:#1a7a3a; margin-top:10px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th { text-align:left; font-size:11px; color:var(--fg3); font-weight:600; padding:6px 8px; border-bottom:1px solid var(--line); }
  td { padding:6px 8px; border-bottom:1px dashed var(--line); }
  td.amt { text-align:right; font-weight:600; font-variant-numeric:tabular-nums; }
  .fold-hint { font-size:12px; color:var(--fg3); text-align:center; padding:8px 0 2px; }
  .actions { display:flex; justify-content:flex-end; gap:10px; flex-wrap:wrap; margin:4px 0 16px; }
  .btn-main { display:inline-flex; align-items:center; gap:6px; border:0; background:var(--blue); color:#fff; border-radius:999px; padding:10px 18px; font-size:14px; font-weight:600; cursor:pointer; font-family:inherit; transition:background .15s; }
  .btn-main:hover { background:var(--blue2); }
  .btn-main.copied { background:var(--green); }
  .btn { display:inline-flex; align-items:center; justify-content:center; border:0; background:#fff; color:var(--fg); border:1px solid var(--line); border-radius:999px; padding:8px 14px; font-size:13px; font-weight:600; cursor:pointer; font-family:inherit; }
  .btn:hover { background:var(--bg); }
  .toast { position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom,0)); transform:translateX(-50%) scale(.9); opacity:0; background:rgba(28,28,30,.94); -webkit-backdrop-filter:blur(20px) saturate(180%); backdrop-filter:blur(20px) saturate(180%); color:#f0f0f0; border-radius:14px; padding:13px 14px 13px 16px; display:flex; align-items:flex-start; gap:12px; max-width:480px; min-width:300px; box-shadow:0 10px 32px rgba(0,0,0,.32); pointer-events:none; transition:opacity .22s ease-out, transform .22s cubic-bezier(.34,1.56,.64,1); z-index:99; }
  .toast.show { opacity:1; transform:translateX(-50%) scale(1); pointer-events:auto; }
  .toast-title { font-weight:600; font-size:12.5px; color:#fff; margin-bottom:2px; }
  .toast-detail { font-size:11px; color:#c8c8cc; }
  .toast-close { background:rgba(255,255,255,.10); color:#34c759; border:0; border-radius:8px; padding:5px 9px; font-size:10.5px; margin-left:6px; cursor:pointer; flex-shrink:0; }
  @media (max-width:640px) { .wrap { padding:18px 12px 70px; } h1 { font-size:23px; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="header">
    <div class="eyebrow">饼干记账 · 记分期</div>
    <h1 id="title">记一笔分期</h1>
    <div class="chips" id="chips"></div>
  </header>

  <main>
    <div class="card">
      <h2>分期参数</h2>
      <div class="params" id="params"></div>
      <div class="sum-check" id="sumCheck"></div>
    </div>

    <div class="card">
      <h2>分摊预览 <span id="countHint"></span></h2>
      <table>
        <thead><tr><th>期数</th><th>日期</th><th>金额(元)</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
      <div class="fold-hint" id="foldHint" hidden></div>
    </div>
  </main>

  <div class="actions">
    <button class="btn-main" id="copyPromptBtn">📋 复制确认 prompt</button>
    <button class="btn" id="copyDataBtn">复制数据</button>
    <button class="btn" id="copyLogBtn">🛠 复制日志</button>
  </div>

  <script id="payload" type="application/json"><!--INJECT-DATA--></script>

  <div class="toast" id="toast">
    <div class="toast-title">已复制 <em id="toastFmt" style="font-style:normal;color:#34c759;font-weight:600"></em></div>
    <div class="toast-detail" id="toastDetail"></div>
    <button class="toast-close" id="toastClose">✓ 知道了</button>
  </div>
</div>

<script>
(function () {
  'use strict';
  var esc = function (s) { return String(s ?? '').replace(/[&<>"']/g, function (c) { return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]); }); };
  var payload;
  try { payload = JSON.parse(document.getElementById('payload').textContent); } catch (e) { return; }
  if (!payload || payload.status !== 'ok') return;
  var d = payload.data || {};
  var meta = d.meta || {};
  var form = d.form || {};
  var items = form.items || [];

  document.getElementById('chips').innerHTML =
    '<span class="chip">⚡ 记分期</span>' +
    '<span class="chip">● 分摊预览确认</span>' +
    '<span class="chip">🕒 ' + esc(d.generated_at || '') + '</span>';

  // 参数回显
  document.getElementById('params').innerHTML = [
    ['名目', form.name], ['总价', form.total + ' 元'], ['期数', form.periods + ' 期'],
    ['每期', form.each + ' 元'], ['首期', form.first + ' 元'], ['首期日', form.start_date], ['末次', form.last_date],
  ].filter(function (p) { return p[1] !== undefined && p[1] !== ''; }).map(function (p) {
    return '<div class="param"><div class="k">' + esc(p[0]) + '</div><div class="v">' + esc(String(p[1])) + '</div></div>';
  }).join('');
  document.getElementById('sumCheck').textContent =
    '✓ 分摊总额 = ' + form.total + ' 元(首期补差保证精确) · 月末日自动回退(如 31 号遇 2 月 → 月末)';

  // 分摊预览(≤24 全显,>24 折叠前 12)
  var showAll = form.periods <= 24;
  var rows = showAll ? items : items.slice(0, 12);
  document.getElementById('rows').innerHTML = rows.map(function (it) {
    return '<tr><td>' + it.seq + '</td><td>' + esc(it.date) + '</td><td class="amt">' + it.amount.toFixed(2) + '</td></tr>';
  }).join('');
  document.getElementById('countHint').textContent = showAll ? '' : '(' + form.periods + ' 期)';
  if (!showAll) {
    document.getElementById('foldHint').hidden = false;
    document.getElementById('foldHint').textContent = '… 共 ' + form.periods + ' 期(仅显示前 12)';
  }

  // 确认 prompt
  function buildPrompt() {
    return [
      '请加载「饼干记账」技能,帮我记一笔分期(唤醒词:记分期):',
      '',
      '  名\u2003目: ' + form.name,
      '  总\u2003价: ' + form.total,
      '  期\u2003数: ' + form.periods,
      '  首期日: ' + form.start_date + '(每月同日,月末自动回退)',
      '  账\u2003户: ' + (form.account || '(选填)'),
      '  账\u2003本: ' + (form.ledger || '(选填)'),
    ].join('\n');
  }

  var toastTimer = null;
  function showToast(fmt) {
    var detailMap = { prompt: '粘贴给 AI 即批量写入 N 笔', data: '粘贴到聊天/笔记', log: '发给开发者排障' };
    document.getElementById('toastFmt').textContent = fmt === 'log' ? '日志' : fmt.toUpperCase();
    document.getElementById('toastDetail').textContent = detailMap[fmt] || '';
    document.getElementById('toast').classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { document.getElementById('toast').classList.remove('show'); }, 4500);
  }
  function doCopy(text, fmt, btn) {
    function done() { if (btn) { btn.classList.add('copied'); setTimeout(function () { btn.classList.remove('copied'); }, 1600); } showToast(fmt); }
    function fb() { var t = document.createElement('textarea'); t.value = text; document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove(); done(); }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done).catch(fb);
    else fb();
  }
  document.getElementById('copyPromptBtn').onclick = function () { doCopy(buildPrompt(), 'prompt', this); };
  document.getElementById('copyDataBtn').onclick = function () {
    doCopy(JSON.stringify({ form: { name: form.name, total: form.total, periods: form.periods, start_date: form.start_date, items: items } }, null, 2), 'data');
  };
  document.getElementById('copyLogBtn').onclick = function () {
    var lines = [];
    lines.push('① 场景标识');
    lines.push('  command_cn: 记分期 确认');
    lines.push('  唤醒词: 记分期');
    lines.push('  场景名: 记一笔分期');
    lines.push('');
    lines.push('② AI 思考链: 计算分摊(首期补差+月末回退) → 预览确认 → 批量写入');
    lines.push('');
    lines.push('③ 底层数据结构');
    lines.push('  items: ' + items.length + ' 期,总价 ' + form.total);
    lines.push('  DB 操作: INSERT bills ×' + items.length + '(单事务)');
    lines.push('');
    lines.push('④ 调用链');
    lines.push('  渲染脚本: ' + (meta.render_cmd || '(未知)'));
    lines.push('');
    lines.push('⑤ 时间戳 + 版本');
    lines.push('  本地时间: ' + (d.generated_at || '(未知)'));
    lines.push('  skill 版本: ' + (meta.version || '(未知)'));
    lines.push('');
    lines.push('⑥ 异常信息: 无');
    doCopy(lines.join('\n'), 'log');
  };
  document.getElementById('toastClose').onclick = function () {
    document.getElementById('toast').classList.remove('show');
    clearTimeout(toastTimer);
  };
})();
</script>
</body>
</html>
