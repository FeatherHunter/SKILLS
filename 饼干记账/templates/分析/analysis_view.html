<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>饼干记账 · 分析视图</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f5f5f7; --card: #ffffff; --border: #e5e5ea;
    --fg: #1d1d1f; --fg2: #6e6e73; --fg3: #86868b;
    --blue: #007aff; --green: #34c759; --orange: #ff9500; --red: #ff3b30; --purple: #af52de;
    --shadow: 0 1px 3px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.04);
    --radius: 14px; --radius-sm: 10px;
  }
  html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--fg); line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh; padding: 0 0 80px;
  }
  .container { max-width: 920px; margin: 0 auto; padding: 24px 16px; }

  /* Header */
  .header { padding: 8px 0 24px; }
  .eyebrow { font-size: 12px; color: var(--fg3); font-weight: 600; letter-spacing: .08em; text-transform: uppercase; margin-bottom: 6px; }
  h1.title { font-size: 32px; font-weight: 700; letter-spacing: -.02em; line-height: 1.2; }
  .subtitle { color: var(--fg2); font-size: 15px; margin-top: 6px; }

  /* Card / Section */
  .card { background: var(--card); border-radius: var(--radius); padding: 20px 22px; margin-bottom: 14px; box-shadow: var(--shadow); }
  .section-title { font-size: 17px; font-weight: 700; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
  .section-title .count { font-size: 13px; font-weight: 500; color: var(--fg3); margin-left: auto; }
  .empty { color: var(--fg3); font-size: 14px; text-align: center; padding: 24px 0; }

  /* KPI Grid */
  .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
  .kpi { background: var(--card); border-radius: var(--radius); padding: 16px 18px; box-shadow: var(--shadow); }
  .kpi .label { font-size: 12px; color: var(--fg2); margin-bottom: 6px; font-weight: 500; }
  .kpi .value { font-size: 26px; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .kpi .value.compact { font-size: 16px; font-weight: 600; letter-spacing: -.01em; }
  .kpi .value.tiny { font-size: 14px; font-weight: 600; letter-spacing: 0; }
  .kpi .unit { font-size: 13px; color: var(--fg2); font-weight: 400; margin-left: 4px; }
  .kpi.blue .value { color: var(--blue); }
  .kpi.green .value { color: var(--green); }
  .kpi.orange .value { color: var(--orange); }
  .kpi.red .value { color: var(--red); }
  .kpi.purple .value { color: var(--purple); }

  /* Compare side-by-side */
  .compare-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
  .compare-card { background: var(--card); border-radius: var(--radius); padding: 18px 20px; box-shadow: var(--shadow); }
  .compare-card.this { border-left: 3px solid var(--blue); }
  .compare-card.last { border-left: 3px solid var(--fg3); }
  .compare-card .period-label { font-size: 13px; color: var(--fg2); margin-bottom: 12px; font-weight: 600; }
  .compare-card .row { display: flex; justify-content: space-between; align-items: baseline; padding: 4px 0; }
  .compare-card .row .k { color: var(--fg2); font-size: 13px; }
  .compare-card .row .v { font-weight: 700; font-variant-numeric: tabular-nums; font-size: 15px; }

  /* Change badge */
  .change-badge { display: flex; align-items: center; gap: 12px; padding: 16px 20px; border-radius: var(--radius); font-size: 15px; margin-bottom: 12px; }
  .change-badge.up { background: rgba(255,149,0,.12); color: var(--orange); }
  .change-badge.down { background: rgba(52,199,89,.12); color: var(--green); }
  .change-badge.flat { background: rgba(0,0,0,.05); color: var(--fg2); }
  .change-badge .arrow { font-size: 22px; font-weight: 700; }
  .change-badge .big { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .change-badge .pct { font-size: 14px; opacity: .85; }

  /* Records list */
  .records { display: flex; flex-direction: column; gap: 1px; background: var(--border); border-radius: var(--radius); overflow: hidden; }
  .record { display: grid; grid-template-columns: 90px 1fr auto; gap: 12px; padding: 12px 16px; background: var(--card); align-items: center; }
  .record .time { font-size: 12px; color: var(--fg2); font-variant-numeric: tabular-nums; }
  .record .cat { font-size: 14px; font-weight: 600; color: var(--fg); }
  .record .note { font-size: 12px; color: var(--fg3); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .record .amt { font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; }
  .record .amt.expense { color: var(--red); }
  .record .amt.income { color: var(--green); }

  /* Category bar */
  .cat-bar { background: var(--card); border-radius: var(--radius); padding: 14px 18px; margin-bottom: 8px; box-shadow: var(--shadow); }
  .cat-bar .head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
  .cat-bar .name { font-size: 14px; font-weight: 600; }
  .cat-bar .stats { font-size: 12px; color: var(--fg2); font-variant-numeric: tabular-nums; }
  .cat-bar .stats b { color: var(--fg); font-weight: 700; font-size: 15px; }
  .cat-bar .track { height: 8px; background: var(--bg); border-radius: 4px; overflow: hidden; }
  .cat-bar .fill { height: 100%; border-radius: 4px; }

  /* Donut */
  .donut-wrap { display: flex; align-items: center; gap: 24px; flex-wrap: wrap; justify-content: center; padding: 16px 0; }
  .donut { width: 220px; height: 220px; flex-shrink: 0; }
  .donut-legend { flex: 1; min-width: 200px; }
  .donut-legend .item { display: flex; align-items: center; gap: 10px; padding: 6px 0; font-size: 13px; }
  .donut-legend .dot { width: 12px; height: 12px; border-radius: 3px; flex-shrink: 0; }
  .donut-legend .name { flex: 1; }
  .donut-legend .pct { font-weight: 700; font-variant-numeric: tabular-nums; color: var(--fg); }
  .donut-center { font-size: 12px; fill: var(--fg2); }
  .donut-center-big { font-size: 20px; font-weight: 700; fill: var(--fg); font-variant-numeric: tabular-nums; }

  /* Chart (line/bar/histogram) */
  .chart-card .chart-title { font-size: 13px; color: var(--fg2); font-weight: 600; margin-bottom: 8px; }
  svg.chart { width: 100%; height: auto; display: block; }
  .chart-legend { display: flex; gap: 18px; flex-wrap: wrap; font-size: 12px; color: var(--fg2); margin-top: 8px; }
  .chart-legend .item { display: inline-flex; align-items: center; gap: 6px; }
  .chart-legend .dot { width: 10px; height: 10px; border-radius: 50%; }

  /* Insight cards */
  .insight-card { border-left: 3px solid var(--purple); }
  .insight-card .t { font-size: 14px; font-weight: 700; margin-bottom: 6px; }
  .insight-card .d { font-size: 13.5px; color: var(--fg2); }
  .fact-row { display: flex; justify-content: space-between; align-items: baseline; padding: 5px 0; font-size: 13.5px; }
  .fact-row .k { color: var(--fg2); }
  .fact-row .v { font-weight: 700; font-variant-numeric: tabular-nums; }

  /* Status chips */
  .chip { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 11px; font-weight: 600; margin-left: 8px; }
  .chip.active { background: rgba(0,122,255,.12); color: var(--blue); }
  .chip.done { background: rgba(52,199,89,.14); color: var(--green); }
  .chip.warn { background: rgba(255,149,0,.14); color: var(--orange); }

  /* Filter chip */
  .filter-chip { display: inline-flex; align-items: center; gap: 6px; background: rgba(0,122,255,.1); color: var(--blue); padding: 5px 12px; border-radius: 999px; font-size: 12px; font-weight: 600; margin-right: 6px; margin-bottom: 4px; }

  /* Footer */
  .footer { text-align: center; color: var(--fg3); font-size: 12px; margin-top: 32px; padding-top: 16px; border-top: 1px solid var(--border); }
  .footer code { background: var(--bg); padding: 2px 6px; border-radius: 4px; font-size: 11px; color: var(--fg2); }

  /* Error / Empty / Loading */
  .error-card { background: rgba(255,59,48,.08); border: 1px solid rgba(255,59,48,.2); border-radius: var(--radius); padding: 24px; text-align: center; }
  .error-card h3 { color: var(--red); margin-bottom: 8px; font-size: 18px; }
  .error-card p { color: var(--fg2); font-size: 14px; }

  /* #300 Base 统一:复制数据/复制日志 = Base actionBar 控件(样式由公共组件决定) */

  /* 无障碍:键盘焦点环(2026-08-09 对抗式审查补齐) */
  .hm-actions .copy:focus-visible {
    outline: 2px solid var(--blue); outline-offset: 2px;
  }

  /* 动效偏好:减少动态(2026-08-09 对抗式审查补齐) */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
  }

  .offline { background: #fff7e8; border: 1px solid #ffe3b3; border-radius: var(--radius); padding: 14px 18px; margin-bottom: 14px; color: #b25b00; font-size: 13.5px; }

  @media (max-width: 640px) {
    .container { padding: 16px 12px; }
    h1.title { font-size: 26px; }
    .kpi .value { font-size: 22px; }
    .compare-grid { grid-template-columns: 1fr; }
    .record { grid-template-columns: 70px 1fr auto; gap: 8px; padding: 10px 12px; }
    .donut { width: 180px; height: 180px; }
  }
</style>
<style><!--SHARED-CSS--></style>
</head>
<body>
<div class="container">
  <header class="header" id="header"></header>
  <main id="app"></main>
  <!-- 动作区(#300 Base 统一:复制数据/复制日志 = actionBar 控件) -->
  <div id="actionbar-zone"></div>
  <footer class="footer" id="footer"></footer>
</div>

<!-- 注入点:AI / bill_inject.py 把 CLI JSON 包成 {status, data, message} 信封后经 Base 注入器注入 -->
<script id="payload" type="application/json"><!--INJECT-DATA--></script><script><!--SHARED-HELPERS--></script>

<script>
(function() {
  'use strict';

  // ── 工具函数 ──────────────────────────────────────────────
  const $ = (sel) => document.querySelector(sel);
  const $$ = (sel) => document.querySelectorAll(sel);
  const fmtMoney = (n) => (Math.round((n || 0) * 100) / 100).toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const fmtPct = (n) => (Math.round((n || 0) * 10) / 10).toFixed(1) + '%';
  const escapeHTML = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const CURRENT_YEAR = new Date().getFullYear();
  const timeShort = (t) => {
    const s = t || '';
    const m = s.match(/^(\d{4})-(\d{2})-(\d{2})(.*)$/);
    if (!m) return s;
    const [, y, mo, d, rest] = m;
    const trim = rest ? ' ' + rest.trim() : '';
    return (parseInt(y) !== CURRENT_YEAR) ? `${y}/${mo}/${d}${trim}` : `${mo}/${d}${trim}`;
  };

  // 配色（环形图 + 占比条）
  const PALETTE = ['#007aff', '#34c759', '#ff9500', '#af52de', '#ff3b30', '#5ac8fa', '#ffcc00', '#8e8e93', '#ff2d55', '#5856d6'];

  // ── 主路由 ────────────────────────────────────────────────
  function init() {
    const raw = document.getElementById('payload').textContent;
    let payload;
    try {
      payload = JSON.parse(raw);
    } catch (e) {
      renderError('JSON 解析失败：' + e.message);
      return;
    }
    if (!payload || payload.status === 'empty') {
      renderError('数据未注入（payload 为空）');
      return;
    }
    if (payload.status === 'error') {
      renderError(payload.message || '查询失败');
      renderActionBar(payload);
      return;
    }
    const data = payload.data || {};
    const type = data.type;
    const title = data.title || payload.message || '饼干记账 · 分析结果';

    // 渲染 header
    renderHeader(title, data);

    // 5 状态之离线态:正常渲染 + 顶部离线提示条
    if (data.offline) {
      $('#app').insertAdjacentHTML('afterbegin', '<div class="offline">⚠️ 离线态:展示本地缓存数据,可能过期</div>');
    }

    // 按 type 分发(分析域 25 场景)
    const routers = {
      monthly:   renderMonthly,
      yearly:    renderYearly,
      overview:  renderOverview,
      week:      renderWeek,
      category:  renderCategory,
      account:   renderAccount,
      ledger:    renderLedger,
      structure: renderStructure,
      compare:   renderCompare,
      range_compare: renderRangeCompare,
      yoy:       renderYoy,
      cat_compare: renderCatCompare,
      trend:     renderTrend,
      cat_trend: renderCatTrend,
      top:       renderTop,
      top_freq:  renderTopFreq,
      distribution: renderDistribution,
      stats:     renderStats,
      activity:  renderActivity,
      insight:   renderInsight,
      anomaly:   renderAnomaly,
      debt_summary: renderDebtSummary,
      reimburse_summary: renderReimburseSummary,
      installment_summary: renderInstallmentSummary,
      refund_summary: renderRefundSummary,
    };
    const fn = routers[type];
    if (!fn) {
      renderError('未知分析类型：' + escapeHTML(type));
      return;
    }
    fn(data);
    // 下钻绑定(本地只读 · 08 §3 · category 点分类看明细 / trend 点月份看汇总)
    if (type === 'category') bindCategoryDrill(data);
    if (type === 'trend') bindTrendDrill(data);
    renderActionBar(payload);
    renderFooter(data);
  }

  function renderHeader(title, data) {
    const subtitle = data.subtitle || data.message || '';
    $('#header').innerHTML = `
      <div class="eyebrow">饼干记账 · 分析视图</div>
      <h1 class="title">${escapeHTML(title)}</h1>
      ${subtitle ? `<div class="subtitle">${escapeHTML(subtitle)}</div>` : ''}
    `;
  }

  function renderFooter(data) {
    const ts = data.generated_at || new Date().toLocaleString('zh-CN');
    const type = data.type || '';
    $('#footer').innerHTML = `
      生成于 ${escapeHTML(ts)} · 类型 <code>${escapeHTML(type)}</code><br>
      源数据: <code>scripts/analysis/cli.py ${escapeHTML(type)} --json</code>
    `;
  }

  function renderError(msg) {
    $('#app').innerHTML = `
      <div class="error-card">
        <h3>⚠️ 出错了</h3>
        <p>${escapeHTML(msg)}</p>
      </div>
    `;
  }

  function renderEmpty(text) {
    $('#app').innerHTML = `<div class="card empty">${escapeHTML(text || '暂无数据')}</div>`;
  }

  // ── #300 Base 统一:复制数据/复制日志 = actionBar 控件(样式/反馈由公共组件决定) ──
  function renderActionBar(p) {
    const zone = document.getElementById('actionbar-zone');
    if (!zone || !window.actionBar) return;
    const ab = (p && p.data && p.data.scene) ? p : {
      status: 'error',
      message: (p && p.message) || '未知错误',
      data: {
        meta: { command_cn: '操作失败', occurred_at: '' },
        scene: { snapshot: { title: '操作失败', summary: [(p && p.message) || '未知错误'], sections: [] } },
      },
    };
    zone.innerHTML = window.actionBar(ab);
  }

  // ── 1. 月度汇总 monthly(KPI4 + 分类排行条 + 区间标注) ──
  function renderMonthly(data) {
    const cats = data.categories || [];
    const max = cats.length ? Math.max(...cats.map(c => c.total)) : 0;
    $('#app').innerHTML = `
      <div class="kpi-grid">
        ${kpiCard('支出', fmtMoney(data.expense), '元', 'red')}
        ${kpiCard('收入', fmtMoney(data.income), '元', 'green')}
        ${kpiCard('净额', fmtMoney(data.net), '元', data.net >= 0 ? 'green' : 'red')}
        ${kpiCard('笔数', data.count || 0, '笔', 'blue')}
      </div>
      <div style="margin-top:12px;"><span class="filter-chip">📅 ${escapeHTML(data.month || '-')}</span></div>
      <div class="card" style="margin-top:12px;">
        <div class="section-title">分类排行 <span class="count">${cats.length} 类</span></div>
        ${cats.length ? cats.slice(0, 8).map((c, i) => categoryBar(c, max, PALETTE[i % PALETTE.length])).join('') : '<div class="empty">本月暂无分类数据</div>'}
      </div>
    `;
  }

  // ── 2. 年度汇总 yearly(总 KPI + 逐月趋势表 + 大额分类 TOP) ──
  function renderYearly(data) {
    const monthly = data.monthly || [];
    const cats = data.top_categories || [];
    const maxMonth = monthly.length ? Math.max(...monthly.map(m => m.expense)) : 0;
    $('#app').innerHTML = `
      <div class="kpi-grid">
        ${kpiCard('全年支出', fmtMoney(data.expense), '元', 'red')}
        ${kpiCard('全年收入', fmtMoney(data.income), '元', 'green')}
        ${kpiCard('净额', fmtMoney(data.net), '元', data.net >= 0 ? 'green' : 'red')}
        ${kpiCard('笔数', data.count || 0, '笔', 'blue')}
      </div>
      <div style="margin-top:12px;"><span class="filter-chip">📅 ${escapeHTML(String(data.year || ''))} 年</span></div>
      <div class="card" style="margin-top:12px;">
        <div class="section-title">逐月趋势 <span class="count">${monthly.length} 个月</span></div>
        ${monthly.length ? monthly.map(m => categoryBar({ category: m.month, total: m.expense, count: m.count }, maxMonth, PALETTE[2])).join('') : '<div class="empty">该年暂无数据</div>'}
      </div>
      <div class="card">
        <div class="section-title">大额分类 TOP</div>
        ${cats.length ? cats.map((c, i) => categoryBar({ category: c.key, total: c.expense, count: c.count }, Math.max(...cats.map(x => x.expense)), PALETTE[i % PALETTE.length])).join('') : '<div class="empty">无支出分类</div>'}
      </div>
    `;
  }

  // ── 3. 收支总览 overview(4 KPI + 日均支出 + 区间标注) ──
  function renderOverview(data) {
    $('#app').innerHTML = `
      <div class="kpi-grid">
        ${kpiCard('笔数', data.count || 0, '笔', 'blue')}
        ${kpiCard('支出', fmtMoney(data.expense), '元', 'red')}
        ${kpiCard('收入', fmtMoney(data.income), '元', 'green')}
        ${kpiCard('净额', fmtMoney(data.net), '元', data.net >= 0 ? 'green' : 'red')}
      </div>
      <div class="card" style="margin-top:14px;">
        <div class="section-title">区间标注</div>
        <div class="fact-row"><span class="k">期间</span><span class="v">${escapeHTML(data.period || '-')}</span></div>
        <div class="fact-row"><span class="k">日均支出</span><span class="v">${fmtMoney(data.daily_avg)} 元</span></div>
      </div>
    `;
  }

  // ── 4. 本周简报 week(本周 KPI + vs 上周双卡 + 大额支出) ──
  function renderWeek(data) {
    const cmp = data.compare || {};
    const t = cmp.period_a || {}, l = cmp.period_b || {}, c = cmp.change || {};
    const diff = c.expense_diff || 0;
    const pct = c.expense_pct || 0;
    const cls = diff > 0.01 ? 'up' : diff < -0.01 ? 'down' : 'flat';
    const arrow = diff > 0.01 ? '↑' : diff < -0.01 ? '↓' : '→';
    const tops = data.top_expenses || [];
    $('#app').innerHTML = `
      <div class="kpi-grid">
        ${kpiCard('本周支出', fmtMoney(data.expense), '元', 'red')}
        ${kpiCard('本周收入', fmtMoney(data.income), '元', 'green')}
        ${kpiCard('净额', fmtMoney(data.net), '元', data.net >= 0 ? 'green' : 'red')}
        ${kpiCard('笔数', data.count || 0, '笔', 'blue')}
      </div>
      <div class="compare-grid" style="margin-top:14px;">
        ${compareCard('this', t.label || '本周', t)}
        ${compareCard('last', l.label || '上周', l)}
      </div>
      <div class="change-badge ${cls}">
        <span class="arrow">${arrow}</span>
        <span class="big">${fmtMoney(Math.abs(diff))} 元</span>
        <span class="pct">(${fmtPct(Math.abs(pct))}) · 支出${diff > 0.01 ? '上涨' : diff < -0.01 ? '下降' : '持平'}</span>
      </div>
      ${tops.length ? `
        <div class="card">
          <div class="section-title">本周大额支出 <span class="count">TOP ${tops.length}</span></div>
          ${recordsList(tops)}
        </div>
      ` : '<div class="card empty">本周暂无支出</div>'}
    `;
  }

  // ── 5. 分类占比 category(SVG 环形图 + 排行 · 点分类下钻明细,本地只读) ──
  function renderCategory(data) {
    const cats = data.categories || [];
    const total = data.grand_total || cats.reduce((s, c) => s + c.expense, 0);
    const max = cats.length ? Math.max(...cats.map(c => c.expense)) : 0;
    $('#app').innerHTML = `
      <div class="kpi-grid">
        ${kpiCard('总支出', fmtMoney(total), '元', 'red')}
        ${kpiCard('分类数', cats.length, '个', 'blue')}
        ${kpiCard('期间', (data.period || '-'), '', 'purple', 'compact')}
      </div>
      ${cats.length ? `
        <div class="card" style="margin-top:14px;">
          <div class="donut-wrap">
            ${donutSVG(cats, total, '总支出')}
            <div class="donut-legend">
              ${cats.slice(0, 10).map((c, i) => `
                <div class="item">

      panel.innerHTML = `
        <div class="card">

  function renderCompare(data) {
    const t = data.this || {}, l = data.last || {}, c = data.change || {};
    const diff = c.expense_diff || 0;
    const pct = c.expense_pct || 0;
    const cls = diff > 0.01 ? 'up' : diff < -0.01 ? 'down' : 'flat';
    const arrow = diff > 0.01 ? '↑' : diff < -0.01 ? '↓' : '→';
    const note = diff > 0.01 ? '支出上涨' : diff < -0.01 ? '支出下降' : '支出持平';

    $('#app').innerHTML = `
      <div class="compare-grid">
        ${compareCard('this', t.label || '本期', t)}
        ${compareCard('last', l.label || '上期', l)}
      </div>
      <div class="change-badge ${cls}">
        <span class="arrow">${arrow}</span>
        <span class="big">${fmtMoney(Math.abs(diff))} 元</span>
        <span class="pct">(${fmtPct(Math.abs(pct))}) · ${note}</span>
      </div>
    `;
  }

  // ── 20. AI 消费洞察 insight(洞察卡:事实层 + AI 解读) ──
  function parseAiNote(note) {
    // AI 解读支持三段式:「消费习惯:…|异常波动:…|省钱建议:…」或纯文本单段
    if (!note) return [];
    const parts = String(note).split('|').map(s => s.trim()).filter(Boolean);
    const KNOWN = { '消费习惯': 1, '异常波动': 1, '省钱建议': 1 };
    return parts.map(s => {
      const m = s.match(/^([^:：]{2,6})[:：]\s*(.*)$/);
      if (m && KNOWN[m[1]]) return { title: m[1], text: m[2] };
      return { title: 'AI 解读', text: s };
    });
  }
  function renderInsight(data) {
    const p = data.period || {};
    const cats = data.category_dist || [];
    const trend = data.monthly_trend || {};
    const months = trend.months || [];
    const tops = data.top_expense || [];
    const max = cats.length ? Math.max(...cats.map(c => c.expense)) : 0;
    const notes = parseAiNote(data.ai_note);
    $('#app').innerHTML = `
      ${notes.length ? `
        <div class="card insight-card" style="margin-bottom:14px;">
          <div class="t">💡 AI 消费洞察(解读)</div>
          ${notes.map(n => `
            <div style="padding:10px 0;${n.title !== 'AI 解读' ? 'border-bottom:1px solid var(--border);' : ''}">
              ${n.title !== 'AI 解读' ? `<div class="t" style="font-size:13px;color:var(--purple);margin-bottom:4px;">${escapeHTML(n.title)}</div>` : ''}
              <div class="d">${escapeHTML(n.text)}</div>
            </div>
          `).join('')}
        </div>
      ` : ''}
      <div class="kpi-grid">
        ${kpiCard('区间支出', fmtMoney(p.expense), '元', 'red')}
        ${kpiCard('区间收入', fmtMoney(p.income), '元', 'green')}
        ${kpiCard('净额', fmtMoney(p.net), '元', (p.net || 0) >= 0 ? 'green' : 'red')}
        ${kpiCard('笔数', p.count || 0, '笔', 'blue')}
      </div>
      <div class="card insight-card" style="margin-top:14px;">
        <div class="t">💡 AI 消费洞察(事实层)</div>
        <div class="fact-row"><span class="k">区间</span><span class="v">${escapeHTML((p.from || '') + ' ~ ' + (p.to || ''))}</span></div>
        <div class="fact-row"><span class="k">趋势均值</span><span class="v">${fmtMoney(trend.mean_expense)} 元/月</span></div>
        <div class="fact-row"><span class="k">最大偏离月</span><span class="v">${escapeHTML((trend.max_deviation && trend.max_deviation.month) || '-')} (${fmtPct((trend.max_deviation && trend.max_deviation.deviation_pct) || 0)})</span></div>
      </div>
      ${cats.length ? `
        <div class="card">
          <div class="section-title">消费习惯(分类分布) <span class="count">${cats.length} 类</span></div>
          ${cats.slice(0, 8).map((c, i) => categoryBar({ category: c.category, total: c.expense, count: c.count, pct: c.pct }, max, PALETTE[i % PALETTE.length])).join('')}
        </div>
      ` : ''}
      ${months.length ? `
        <div class="card">
          <div class="section-title">月度走势(近 ${data.window_months || 6} 个月)</div>
          ${lineChart(months.map(m => ({ month: m.month, expense: m.expense, income: m.income })))}

  // ── 组件：KPI 卡 ─────────────────────────────────────────
  function kpiCard(label, value, unit, color, size) {
    const sizeClass = (size === 'tiny') ? 'tiny' : (size === 'compact') ? 'compact' : '';
    return `<div class="kpi ${color || ''}">
      <div class="label">${escapeHTML(label)}</div>
      <div class="value ${sizeClass}">${escapeHTML(value)}${unit ? `<span class="unit">${escapeHTML(unit)}</span>` : ''}</div>
    </div>`;
  }

  // ── 组件：对比卡 ─────────────────────────────────────────
  function compareCard(cls, label, d) {
    return `<div class="compare-card ${cls}">
      <div class="period-label">${escapeHTML(label)}</div>
      <div class="row"><span class="k">笔数</span><span class="v">${d.count || 0}</span></div>
      <div class="row"><span class="k">支出</span><span class="v" style="color:var(--red)">${fmtMoney(d.expense)}</span></div>
      <div class="row"><span class="k">收入</span><span class="v" style="color:var(--green)">${fmtMoney(d.income)}</span></div>
      <div class="row"><span class="k">净额</span><span class="v" style="color:${(d.net || 0) >= 0 ? 'var(--green)' : 'var(--red)'}">${fmtMoney(d.net)}</span></div>
    </div>`;
  }

  // ── 组件：分类占比条 ─────────────────────────────────────
  function categoryBar(c, max, color) {
    const pct = max ? (c.total / max * 100) : 0;
    const totalPct = c.pct != null ? `${fmtPct(c.pct)}` : '';
    return `<div class="cat-bar">
      <div class="head">
        <span class="name">${escapeHTML(c.category)}</span>
        <span class="stats"><b>${fmtMoney(c.total)}</b> 元 · ${c.count || 0} 笔${totalPct ? ' · ' + totalPct : ''}${c.avg ? ' · 均 ' + fmtMoney(c.avg) : ''}</span>
      </div>
      <div class="track"><div class="fill" style="width:${pct}%;background:${color}"></div></div>
    </div>`;
  }

  // ── 组件：记录列表 ───────────────────────────────────────
  function recordsList(records) {
    return `<div class="records">${records.slice(0, 200).map(r => `
      <div class="record">
        <div class="time">${escapeHTML(timeShort(r.time))}</div>
        <div>
          <div class="cat">${escapeHTML(r.category || '')}</div>
          ${r.note ? `<div class="note">${escapeHTML(r.note)}</div>` : ''}
        </div>
        <div class="amt ${(r.amount || 0) < 0 ? 'expense' : 'income'}">${(r.amount || 0) < 0 ? '-' : '+'}${fmtMoney(Math.abs(r.amount || 0))}</div>
      </div>
    `).join('')}</div>${records.length > 200 ? `<div class="empty" style="margin-top:12px;">仅显示前 200 条 · 共 ${records.length} 条</div>` : ''}`;
  }

  // ── 组件：SVG 环形图 ─────────────────────────────────────
  function donutSVG(cats, total, centerLabel) {
    const r = 80, cx = 110, cy = 110, c = 2 * Math.PI * r;
    let acc = 0;
    const segments = cats.map((cat, i) => {
      const pct = total ? (cat.total / total) : 0;
      const dash = pct * c;
      const seg = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${PALETTE[i % PALETTE.length]}" stroke-width="22" stroke-dasharray="${dash} ${c}" stroke-dashoffset="${-acc}" transform="rotate(-90 ${cx} ${cy})"/>`;
      acc += dash;
      return seg;
    }).join('');
    return `<svg class="donut" viewBox="0 0 220 220" xmlns="http://www.w3.org/2000/svg">
      <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#f5f5f7" stroke-width="22"/>
      ${segments}
      <text class="donut-center" x="${cx}" y="${cy - 8}" text-anchor="middle">${escapeHTML(centerLabel || '合计')}</text>
      <text class="donut-center-big" x="${cx}" y="${cy + 18}" text-anchor="middle">${fmtMoney(total)}</text>
    </svg>`;
  }

  // ── 组件：SVG 双线折线图(趋势 · 响应式:按容器宽度动态字号,手机 ≥8px) ──
  function chartBase() {
    // 视口感知:≤640px 手机用紧凑画布,否则 800px 桌面画布(SVG 内文字按比例放大)
    const mobile = window.innerWidth <= 640;
    const W = mobile ? 375 : 800;
    const H = mobile ? 240 : 260;
    const fs = mobile ? 13 : 11;          // 文字基础字号(手机 13px ≥ 8px 可读)
    const lw = mobile ? 3 : 2.5;          // 线宽
    const padL = mobile ? 44 : 56;        // 左 padding(坐标轴数字宽度)
    return { W, H, PL: padL, PR: 20, PT: 16, PB: mobile ? 44 : 36, fs, lw };
  }

  function lineChart(series) {
    if (!series.length) return '<div class="empty">暂无数据</div>';
    const { W, H, PL, PR, PT, PB, fs, lw } = chartBase();
    const iw = W - PL - PR, ih = H - PT - PB;
    const maxV = Math.max(...series.map(m => Math.max(m.expense, m.income)), 1) * 1.15;
    const n = series.length;
    const x = (i) => PL + (n === 1 ? iw / 2 : iw * i / (n - 1));
    const y = (v) => PT + ih - (v / maxV) * ih;
    const labels = series.map(m => m.month.slice(2)); // YY-MM

    function polyline(values, color) {
      const pts = values.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
      return `<polyline points="${pts}" fill="none" stroke="${color}" stroke-width="${lw}" stroke-linejoin="round" stroke-linecap="round"/>`;
    }
    const gridY = [0, 0.25, 0.5, 0.75, 1].map(f => {
      const gy = PT + ih * f;
      const val = (maxV * (1 - f)).toFixed(0);
      return `<line x1="${PL}" y1="${gy}" x2="${W - PR}" y2="${gy}" stroke="#eee" stroke-width="1"/><text x="${PL - 8}" y="${gy + 4}" text-anchor="end" font-size="${fs}" fill="#86868b">${val}</text>`;
    }).join('');
    const xLabels = labels.map((lb, i) => {
      const show = n <= 8 || i % Math.ceil(n / 8) === 0 || i === n - 1;
      return show ? `<text x="${x(i)}" y="${H - 12}" text-anchor="middle" font-size="${fs}" fill="#86868b">${escapeHTML(lb)}</text>` : '';
    }).join('');
    // 峰值标注(支出)
    let peakMark = '';
    if (n > 0) {
      let pi = 0;
      for (let i = 1; i < n; i++) if (series[i].expense > series[pi].expense) pi = i;
      if (series[pi].expense > 0) {
        peakMark = `<text x="${x(pi)}" y="${y(series[pi].expense) - 8}" text-anchor="middle" font-size="${fs}" font-weight="700" fill="#ff3b30">峰值 ${fmtMoney(series[pi].expense)}</text>`;
      }
    }
    return `<svg class="chart" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">
      ${gridY}
      ${polyline(series.map(m => m.income), '#34c759')}
      ${polyline(series.map(m => m.expense), '#ff3b30')}
      ${xLabels}
      ${peakMark}
    </svg>`;
  }

  // ── 组件：SVG 柱状图(分类趋势/时段 · 响应式) ──
  function barChart(series) {
    if (!series.length) return '<div class="empty">暂无数据</div>';
    const { W, H, PL, PR, PT, PB, fs } = chartBase();
    const iw = W - PL - PR, ih = H - PT - PB;
    const maxV = Math.max(...series.map(m => m.expense), 1) * 1.1;
    const n = series.length;
    const bw = Math.min(iw / n * 0.6, 40);
    const step = iw / n;
    const bars = series.map((m, i) => {
      const bx = PL + step * i + (step - bw) / 2;
      const bh = (m.expense / maxV) * ih;
      const by = PT + ih - bh;
      return `<rect x="${bx.toFixed(1)}" y="${by.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(bh, 1).toFixed(1)}" rx="4" fill="#ff9500"/>
        ${m.expense > 0 ? `<text x="${(bx + bw / 2).toFixed(1)}" y="${(by - 6).toFixed(1)}" text-anchor="middle" font-size="${fs}" fill="#86868b">${fmtMoney(m.expense)}</text>` : ''}`;
    }).join('');
    const gridY = [0, 0.5, 1].map(f => {
      const gy = PT + ih * f;
      const val = (maxV * (1 - f)).toFixed(0);
      return `<line x1="${PL}" y1="${gy}" x2="${W - PR}" y2="${gy}" stroke="#eee" stroke-width="1"/><text x="${PL - 8}" y="${gy + 4}" text-anchor="end" font-size="${fs}" fill="#86868b">${val}</text>`;
    }).join('');
    const xLabels = series.map((m, i) => {
      const show = n <= 8 || i % Math.ceil(n / 8) === 0 || i === n - 1;
      return show ? `<text x="${(PL + step * i + step / 2).toFixed(1)}" y="${H - 12}" text-anchor="middle" font-size="${fs}" fill="#86868b">${escapeHTML(m.month.slice(2))}</text>` : '';
    }).join('');
    return `<svg class="chart" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">
      ${gridY}
      ${bars}
      ${xLabels}
    </svg>`;
  }

  // ── 组件：SVG 直方图(金额分布 · 响应式) ──
  function histChart(buckets) {
    if (!buckets.length) return '<div class="empty">暂无数据</div>';
    const { W, H, PL, PR, PT, PB, fs } = chartBase();
    const iw = W - PL - PR, ih = H - PT - PB;
    const maxV = Math.max(...buckets.map(b => b.count), 1) * 1.15;
    const n = buckets.length;
    const bw = Math.min(iw / n * 0.62, 90);
    const step = iw / n;
    const bars = buckets.map((b, i) => {
      const bx = PL + step * i + (step - bw) / 2;
      const bh = (b.count / maxV) * ih;
      const by = PT + ih - bh;
      return `<rect x="${bx.toFixed(1)}" y="${by.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(bh, 1).toFixed(1)}" rx="4" fill="#007aff"/>
        <text x="${(bx + bw / 2).toFixed(1)}" y="${(by - 6).toFixed(1)}" text-anchor="middle" font-size="${fs}" fill="#86868b">${b.count}笔</text>`;
    }).join('');
    const gridY = [0, 0.5, 1].map(f => {
      const gy = PT + ih * f;
      const val = Math.round(maxV * (1 - f));
      return `<line x1="${PL}" y1="${gy}" x2="${W - PR}" y2="${gy}" stroke="#eee" stroke-width="1"/><text x="${PL - 8}" y="${gy + 4}" text-anchor="end" font-size="${fs}" fill="#86868b">${val}</text>`;
    }).join('');
    const xLabels = buckets.map((b, i) => {
      return `<text x="${(PL + step * i + step / 2).toFixed(1)}" y="${H - 12}" text-anchor="middle" font-size="${fs}" fill="#86868b">${escapeHTML(b.bucket)}</text>`;
    }).join('');
    return `<svg class="chart" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">
      ${gridY}
      ${bars}
      ${xLabels}
    </svg>`;
  }

  // ── 组件：时段柱状(activity 小时段,纯 div 条形) ─────────
  function hourBars(hours) {
    const max = Math.max(...hours.map(h => h.count));
    return hours.map(h => `
      <div class="cat-bar">
        <div class="head">
          <span class="name">${escapeHTML(h.hour)} 点</span>
          <span class="stats"><b>${h.count}</b> 笔</span>
        </div>
        <div class="track"><div class="fill" style="width:${max ? h.count / max * 100 : 0}%;background:#5ac8fa"></div></div>
      </div>
    `).join('');
  }

  // ── 启动 ──────────────────────────────────────────────────
  document.addEventListener('DOMContentLoaded', () => {
    init();
  });
})();
</script>
</body>
</html>
