<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>饼干记账 · 一键备份</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --bg:#f5f5f7; --card:#fff; --line:#e5e5ea; --fg:#1d1d1f; --fg2:#6e6e73; --fg3:#86868b; --blue:#007aff; --blue2:#0a63ce; --green:#34c759; --orange:#ff9500; --red:#ff3b30; --soft:#f5f8ff; --shadow:0 1px 3px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.05); }
  body { font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--fg); line-height:1.6; -webkit-font-smoothing:antialiased; padding:0 0 110px; }
  .wrap { max-width:640px; margin:0 auto; padding:24px 16px; }
  .header { padding:6px 0 18px; }
  .eyebrow { font-size:12px; color:var(--fg3); font-weight:600; letter-spacing:.06em; margin-bottom:6px; }
  h1 { font-size:27px; font-weight:700; letter-spacing:-.02em; line-height:1.25; }
  .subtitle { color:var(--fg2); font-size:14px; margin-top:6px; }
  .chips { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
  .chip { font-size:11.5px; font-weight:600; padding:3px 10px; border-radius:999px; background:var(--soft); color:var(--blue2); border:1px solid #d7e6ff; }
  .card { background:var(--card); border-radius:16px; box-shadow:var(--shadow); padding:18px 20px; margin-bottom:14px; }
  .hero { display:flex; align-items:center; gap:14px; }
  .hero-ic { width:52px; height:52px; border-radius:50%; background:rgba(52,199,89,.14); display:flex; align-items:center; justify-content:center; font-size:24px; flex-shrink:0; }
  .hero-title { font-size:18px; font-weight:700; }
  .hero-sub { font-size:12.5px; color:var(--fg2); margin-top:2px; word-break:break-all; }
  .path-box { background:var(--bg); border-radius:12px; padding:12px 14px; margin-top:12px; }
  .path-label { font-size:11px; color:var(--fg3); }
  .path-value { font-size:13px; font-weight:600; word-break:break-all; margin-top:2px; }
  .file-list { margin-top:12px; }
  .file-item { display:flex; justify-content:space-between; gap:10px; padding:9px 0; border-bottom:1px solid var(--line); font-size:13.5px; }
  .file-item:last-child { border-bottom:0; }
  .file-item .n { font-weight:600; }
  .file-item .s { color:var(--fg3); font-variant-numeric:tabular-nums; }
  .actions { position:fixed; left:0; right:0; bottom:0; background:rgba(255,255,255,.92); -webkit-backdrop-filter:blur(20px); backdrop-filter:blur(20px); border-top:1px solid var(--line); padding:12px 16px calc(12px + env(safe-area-inset-bottom,0)); display:flex; gap:8px; justify-content:center; }
  .actions .btn { flex:1; min-width:0; justify-content:center; }
  .btn { display:inline-flex; align-items:center; justify-content:center; border:1px solid var(--line); background:#fff; color:var(--fg); border-radius:999px; padding:11px 18px; font-size:14px; font-weight:600; cursor:pointer; font-family:inherit; }
  .btn:hover { background:var(--bg); }
  .toast { position:fixed; left:50%; bottom:calc(76px + env(safe-area-inset-bottom,0)); transform:translateX(-50%) scale(.9); opacity:0; background:rgba(28,28,30,.94); -webkit-backdrop-filter:blur(20px) saturate(180%); backdrop-filter:blur(20px) saturate(180%); color:#f0f0f0; border-radius:14px; padding:13px 14px 13px 16px; display:flex; align-items:flex-start; gap:12px; max-width:480px; min-width:300px; box-shadow:0 10px 32px rgba(0,0,0,.32); pointer-events:none; transition:opacity .22s ease-out, transform .22s cubic-bezier(.34,1.56,.64,1); z-index:99; }
  .toast.show { opacity:1; transform:translateX(-50%) scale(1); pointer-events:auto; }
  .toast-title { font-weight:600; font-size:12.5px; color:#fff; margin-bottom:2px; }
  .toast-detail { font-size:11px; color:#c8c8cc; }
  .toast-close { background:rgba(255,255,255,.10); color:#34c759; border:0; border-radius:8px; padding:5px 9px; font-size:10.5px; margin-left:6px; cursor:pointer; flex-shrink:0; }
  .sheet-mask { position:fixed; inset:0; background:rgba(0,0,0,.35); z-index:90; display:none; align-items:flex-end; justify-content:center; }
  .sheet-mask.show { display:flex; }
  .sheet { background:#fff; border-radius:18px 18px 0 0; width:100%; max-width:480px; padding:10px 14px calc(14px + env(safe-area-inset-bottom,0)); box-shadow:0 -8px 32px rgba(0,0,0,.12); }
  .sheet-title { font-size:15px; font-weight:700; text-align:center; padding:10px 0 4px; }
  .sheet-sub { font-size:12px; color:var(--fg3); text-align:center; padding-bottom:10px; }
  .sheet-item { display:flex; align-items:center; gap:12px; width:100%; text-align:left; background:var(--bg); border:0; border-radius:12px; padding:12px 14px; margin-bottom:8px; cursor:pointer; font-family:inherit; }
  .sheet-item .f { font-weight:700; font-size:14px; min-width:56px; }
  .sheet-item .d { font-size:11.5px; color:var(--fg3); }
  .sheet-cancel { width:100%; background:var(--bg); border:0; border-radius:12px; padding:12px; font-size:14px; font-weight:600; color:var(--fg2); cursor:pointer; font-family:inherit; }
  .error-card { background:rgba(255,59,48,.08); border:1px solid rgba(255,59,48,.2); border-radius:16px; padding:22px; text-align:center; }
  .error-card h3 { color:var(--red); margin-bottom:8px; font-size:17px; }
  .error-card p { color:var(--fg2); font-size:13.5px; word-break:break-all; }
  @media (max-width:640px) { .wrap { padding:18px 12px 70px; } h1 { font-size:23px; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="header">
    <div class="eyebrow">饼干记账 · 开始使用</div>
    <h1 id="title">一键备份</h1>
    <div class="subtitle" id="subtitle"></div>
    <div class="chips" id="chips"></div>
  </header>

  <main id="app"></main>
</div>

<div class="actions">
  <button class="btn" id="copyDataBtn">复制数据</button>
  <button class="btn" id="copyLogBtn">🛠 复制日志</button>
</div>

<script id="payload" type="application/json">{"status":"empty","data":null,"message":"数据未注入"}</script>

<div class="sheet-mask" id="sheetMask">
  <div class="sheet">
    <div class="sheet-title">复制数据</div>
    <div class="sheet-sub">选格式,点哪个复制哪个</div>
    <button class="sheet-item" data-f="text"><span class="f">纯文本</span><span class="d">粘贴到聊天/笔记</span></button>
    <button class="sheet-item" data-f="json"><span class="f">JSON</span><span class="d">粘贴给 AI 记账</span></button>
    <button class="sheet-item" data-f="csv"><span class="f">CSV</span><span class="d">粘贴到 Excel 存档</span></button>
    <button class="sheet-cancel" id="sheetCancel">取消</button>
  </div>
</div>

<div class="toast" id="toast">
  <div class="toast-title">已复制 <em id="toastFmt" style="font-style:normal;color:#34c759;font-weight:600"></em></div>
  <div class="toast-detail" id="toastDetail"></div>
  <button class="toast-close" id="toastClose">✓ 知道了</button>
</div>

<script>
(function () {
  'use strict';
  var esc = function (s) { return String(s ?? '').replace(/[&<>"']/g, function (c) { return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]); }); };
  var payload;
  try { payload = JSON.parse(document.getElementById('payload').textContent); } catch (e) { return; }
  if (!payload || payload.status === 'empty') return;
  if (payload.status === 'error') {
    document.getElementById('app').innerHTML =
      '<div class="error-card"><h3>⚠️ 备份失败</h3><p>' + esc(payload.message || '未知错误') + '</p></div>';
    return;
  }
  var d = payload.data || {};
  var meta = d.meta || {};

  document.getElementById('subtitle').textContent = d.subtitle || '';
  document.getElementById('chips').innerHTML =
    '<span class="chip">⚡ ' + esc(meta.wake_word || '备份') + '</span>' +
    '<span class="chip">● 备份完成</span>' +
    '<span class="chip">🕒 ' + esc(d.generated_at || '') + '</span>';

  var filesHtml = (d.files || []).map(function (f) {
    var size = f.size >= 1024 ? (f.size / 1024).toFixed(1) + ' KB' : f.size + ' B';
    return '<div class="file-item"><span class="n">📄 ' + esc(f.name || '') + '</span><span class="s">' + esc(size) + '</span></div>';
  }).join('');

  document.getElementById('app').innerHTML =
    '<div class="card"><div class="hero">' +
    '<div class="hero-ic">📦</div>' +
    '<div><div class="hero-title">备份成功</div>' +
    '<div class="hero-sub">' + esc(d.content || '') + ' · ' + esc(d.time || '') + '</div></div></div>' +
    '<div class="path-box"><div class="path-label">备份路径</div>' +
    '<div class="path-value">' + esc(d.target || '') + '</div></div>' +
    '<div class="file-list">' + filesHtml + '</div></div>';

  // ── 复制能力(08 §4 硬标准) ──
  var toastTimer = null;
  var TOAST_NEXT = { text: '粘贴到聊天/笔记保存', json: '粘贴给 AI 即可记账', csv: '粘贴到 Excel 存档', log: '发给开发者排障' };
  function showToast(fmt) {
    document.getElementById('toastFmt').textContent = fmt === 'log' ? '日志' : fmt.toUpperCase();
    document.getElementById('toastDetail').textContent = TOAST_NEXT[fmt] || '';
    document.getElementById('toast').classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { document.getElementById('toast').classList.remove('show'); }, 4500);
  }
  function doCopy(text, fmt) {
    function done() { showToast(fmt); }
    function fb() { var t = document.createElement('textarea'); t.value = text; document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove(); done(); }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done).catch(fb);
    else fb();
  }

  function pickPayload() {
    var out = {};
    for (var k in d) { if (['type','title','subtitle','generated_at','meta'].indexOf(k) < 0) out[k] = d[k]; }
    return out;
  }
  function buildData5() {
    return { scene_id: meta.scene_id || 'setup_backup_create', command_cn: meta.command_cn || '一键备份',
             occurred_at: d.generated_at || '', target: '备份目录', payload: pickPayload() };
  }
  function buildDataText(fmt) {
    var d5 = buildData5();
    if (fmt === 'json') return JSON.stringify(d5, null, 2);
    if (fmt === 'text') {
      return ['场景: ' + d5.command_cn, '时间: ' + d5.occurred_at, '目标: ' + d5.target,
              '数据: ' + JSON.stringify(d5.payload)].join('\n');
    }
    return Object.entries(d5.payload).map(function (e) { return e[0] + ',' + JSON.stringify(e[1] ?? ''); }).join('\n');
  }

  var sheetMask = document.getElementById('sheetMask');
  var closeSheet = function () { sheetMask.classList.remove('show'); };
  document.getElementById('copyDataBtn').onclick = function () { sheetMask.classList.add('show'); };
  document.getElementById('sheetCancel').onclick = closeSheet;
  sheetMask.addEventListener('click', function (e) { if (e.target === sheetMask) closeSheet(); });
  sheetMask.querySelectorAll('.sheet-item').forEach(function (b) {
    b.onclick = function () { var f = b.getAttribute('data-f'); closeSheet(); doCopy(buildDataText(f), f); };
  });
  document.getElementById('copyLogBtn').onclick = function () {
    var lines = [];
    lines.push('① 场景标识');
    lines.push('  command_cn: ' + (meta.command_cn || '一键备份'));
    lines.push('  唤醒词: ' + (meta.wake_word || '备份'));
    lines.push('  场景名: 一键备份 (scene_id=' + (meta.scene_id || 'setup_backup_create') + ')');
    lines.push('');
    lines.push('② AI 思考链: 用户要求备份 → backup create(db + goals.json)');
    lines.push('');
    lines.push('③ 底层数据结构');
    lines.push('  payload: ' + JSON.stringify(pickPayload()));
    lines.push('  DB 操作: COPY db + goals.json → 备份目录/<时间戳>/');
    lines.push('');
    lines.push('④ 调用链');
    lines.push('  渲染脚本: ' + (meta.render_cmd || '(未知)'));
    lines.push('');
    lines.push('⑤ 时间戳 + 版本');
    lines.push('  本地时间: ' + (d.generated_at || '(未知)'));
    lines.push('  skill 版本: ' + (meta.version || '(未知)'));
    lines.push('');
    lines.push('⑥ 异常信息: 无');
    doCopy(lines.join('\n'), 'log');
  };
  document.getElementById('toastClose').onclick = function () {
    document.getElementById('toast').classList.remove('show');
    clearTimeout(toastTimer);
  };
})();
</script>
</body>
</html>
