<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>饼干记账 · 查看备份</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --bg:#f5f5f7; --card:#fff; --line:#e5e5ea; --fg:#1d1d1f; --fg2:#6e6e73; --fg3:#86868b; --blue:#007aff; --blue2:#0a63ce; --green:#34c759; --orange:#ff9500; --red:#ff3b30; --soft:#f5f8ff; --shadow:0 1px 3px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.05); }
  body { font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--fg); line-height:1.6; -webkit-font-smoothing:antialiased; padding:0 0 90px; }
  .wrap { max-width:640px; margin:0 auto; padding:24px 16px; }
  .header { padding:6px 0 18px; }
  .eyebrow { font-size:12px; color:var(--fg3); font-weight:600; letter-spacing:.06em; margin-bottom:6px; }
  h1 { font-size:27px; font-weight:700; letter-spacing:-.02em; line-height:1.25; }
  .subtitle { color:var(--fg2); font-size:14px; margin-top:6px; }
  .chips { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
  .chip { font-size:11.5px; font-weight:600; padding:3px 10px; border-radius:999px; background:var(--soft); color:var(--blue2); border:1px solid #d7e6ff; }
  .card { background:var(--card); border-radius:16px; box-shadow:var(--shadow); padding:18px 20px; margin-bottom:14px; }
  .b-item { display:flex; gap:12px; padding:13px 0; border-bottom:1px solid var(--line); align-items:flex-start; }
  .b-item:last-child { border-bottom:0; }
  .b-ic { width:38px; height:38px; border-radius:12px; background:var(--soft); display:flex; align-items:center; justify-content:center; font-size:17px; flex-shrink:0; }
  .b-body { flex:1; min-width:0; }
  .b-name { font-size:14.5px; font-weight:700; font-variant-numeric:tabular-nums; }
  .b-meta { font-size:12px; color:var(--fg3); margin-top:2px; }
  .b-files { display:flex; gap:6px; flex-wrap:wrap; margin-top:6px; }
  .b-file { font-size:11px; font-weight:600; background:var(--bg); border-radius:6px; padding:2px 8px; color:var(--fg2); }
  /* #301 状态层统一:空态 = Base emptyState 控件(样式由公共组件决定) */
    .actions { display:flex; gap:8px; justify-content:center; margin:4px 0 8px; }
  .actions .btn { flex:1; min-width:0; justify-content:center; }
  .btn { display:inline-flex; align-items:center; justify-content:center; border:1px solid var(--line); background:#fff; color:var(--fg); border-radius:999px; padding:11px 18px; font-size:14px; font-weight:600; cursor:pointer; font-family:inherit; }
  .btn:hover { background:var(--bg); }
  .btn.primary { background:var(--blue); color:#fff; border-color:var(--blue); }
  .btn.primary:hover { background:var(--blue2); }
  /* #300 Base 统一:复制/提示全部走公共组件 */
  /* #301 状态层统一:错误/空态 = Base errorReceipt/emptyState 控件(样式由公共组件决定) */
  @media (max-width:640px) { .wrap { padding:18px 12px 70px; } h1 { font-size:23px; } }
</style>
<style><!--SHARED-CSS--></style>
</head>
<body>
<div class="wrap">
  <header class="header">
    <div class="eyebrow">饼干记账 · 开始使用</div>
    <h1 id="title">查看备份</h1>
    <div class="subtitle" id="subtitle"></div>
    <div class="chips" id="chips"></div>
  </header>

  <main id="app"></main>

<div class="actions">
  <button class="btn primary" id="backupNowBtn">📦 一键备份</button>
</div>
<div id="actionbar-zone"></div>
</div>

<script id="payload" type="application/json"><!--INJECT-DATA--></script><script><!--SHARED-HELPERS--></script>



<script>
(function () {
  'use strict';
  var esc = function (s) { return String(s ?? '').replace(/[&<>"']/g, function (c) { return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]); }); };
  var payload;
  try { payload = JSON.parse(document.getElementById('payload').textContent); }
  catch (e) {
    document.getElementById('app').innerHTML = window.errorReceipt({
      message: '数据解析失败: ' + e.message,
      data: document.getElementById('payload').textContent,
      log: 'payload JSON 解析异常'
    });
    return;
  }
  if (!payload || payload.status === 'empty') {
    document.getElementById('app').innerHTML = window.errorReceipt({
      message: (payload && payload.message) || '数据未注入(状态数据为空)',
      data: document.getElementById('payload').textContent,
      log: (payload && payload.status) ? 'payload status = ' + payload.status : 'payload 为空',
      payload: payload || undefined
    });
    return;
  }
  // ── #300 Base 统一:复制数据/复制日志 = Base actionBar ──
  if (window.actionBar) {
    var abZoneX = document.getElementById('actionbar-zone');
    if (abZoneX) abZoneX.innerHTML = window.actionBar((payload.data && payload.data.scene) ? payload : {
      status: 'error', message: payload.message || '数据未注入',
      data: { meta: { command_cn: '操作失败', occurred_at: '' },
              scene: { snapshot: { title: '操作失败', summary: [payload.message || '数据未注入'], sections: [] } } },
    });
  }

  if (payload.status === 'error') {
    document.getElementById('app').innerHTML = window.errorReceipt({
      message: payload.message || '未知错误',
      data: document.getElementById('payload').textContent,
      log: 'payload status = error · 原始 payload 见「复制数据」',
      payload: payload
    });
    return;
  }
  var d = payload.data || {};
  var meta = d.meta || {};

  document.getElementById('subtitle').textContent = d.subtitle || '';
  document.getElementById('chips').innerHTML =
    '<span class="chip">⚡ ' + esc(meta.wake_word || '备份') + '</span>' +
    '<span class="chip">● 备份列表</span>' +
    '<span class="chip">🕒 ' + esc(d.generated_at || '') + '</span>';

  var backups = d.backups || [];
  var app = document.getElementById('app');

  if (!backups.length) {
    app.innerHTML = window.emptyState({icon:'🗄️', text:'还没有备份', hint:'点下方「一键备份」,数据库和目标数据会自动归档'});
    document.getElementById('backupNowBtn').textContent = '📦 一键备份';
    document.getElementById('backupNowBtn').onclick = function () {
      window.copyText('请加载「饼干记账」技能,帮我备份饼干记账的数据(唤醒词:备份):');
    };
  } else {
    app.innerHTML = '<div class="card">' + backups.map(function (b) {
      var size = b.size >= 1024 ? (b.size / 1024).toFixed(1) + ' KB' : b.size + ' B';
      var files = (b.files || []).map(function (f) { return '<span class="b-file">' + esc(f) + '</span>'; }).join('');
      return '<div class="b-item"><div class="b-ic">📦</div>' +
        '<div class="b-body"><div class="b-name">' + esc(b.name || '') + '</div>' +
        '<div class="b-meta">' + esc(b.time || '') + ' · ' + esc(size) + '</div>' +
        '<div class="b-files">' + files + '</div></div></div>';
    }).join('') + '</div>';
    document.getElementById('backupNowBtn').textContent = '📦 再备份一次';
    document.getElementById('backupNowBtn').onclick = function () {
      window.copyText('请加载「饼干记账」技能,帮我备份饼干记账的数据(唤醒词:备份):');
    };
  }

  // ── 复制能力(08 §4 硬标准) ──
  
})();
</script>
</body>
</html>
