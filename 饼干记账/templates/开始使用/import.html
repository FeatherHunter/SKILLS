<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>饼干记账 · 导入 CSV 账单</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --bg:#f5f5f7; --card:#fff; --line:#e5e5ea; --fg:#1d1d1f; --fg2:#6e6e73; --fg3:#86868b; --blue:#007aff; --blue2:#0a63ce; --green:#34c759; --orange:#ff9500; --red:#ff3b30; --soft:#f5f8ff; --shadow:0 1px 3px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.05); }
  body { font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--fg); line-height:1.6; -webkit-font-smoothing:antialiased; padding:0 0 90px; }
  .wrap { max-width:680px; margin:0 auto; padding:24px 16px; }
  .header { padding:6px 0 18px; }
  .eyebrow { font-size:12px; color:var(--fg3); font-weight:600; letter-spacing:.06em; margin-bottom:6px; }
  h1 { font-size:27px; font-weight:700; letter-spacing:-.02em; line-height:1.25; }
  .subtitle { color:var(--fg2); font-size:14px; margin-top:6px; }
  .chips { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
  .chip { font-size:11.5px; font-weight:600; padding:3px 10px; border-radius:999px; background:var(--soft); color:var(--blue2); border:1px solid #d7e6ff; }
  .card { background:var(--card); border-radius:16px; box-shadow:var(--shadow); padding:18px 20px; margin-bottom:14px; }
  .file-box { display:flex; align-items:center; gap:12px; }
  .file-ic { width:42px; height:42px; border-radius:12px; background:var(--soft); display:flex; align-items:center; justify-content:center; font-size:19px; flex-shrink:0; }
  .file-name { font-size:15px; font-weight:700; word-break:break-all; }
  .file-meta { font-size:12px; color:var(--fg3); margin-top:2px; }
  .section-title { font-size:14px; font-weight:700; margin:14px 0 8px; display:flex; align-items:center; gap:8px; }
  .section-title .hint { font-size:11.5px; font-weight:500; color:var(--fg3); margin-left:auto; }
  .map-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .map-item { background:var(--bg); border-radius:10px; padding:8px 10px; }
  .map-item .k { font-size:11px; color:var(--fg3); margin-bottom:3px; }
  .map-item select { width:100%; border:1px solid var(--line); border-radius:8px; padding:5px 8px; font-size:13px; font-family:inherit; background:#fff; outline:none; }
  .map-item .m { font-size:11px; color:var(--blue2); font-weight:600; margin-top:3px; }
  .table-scroll { overflow-x:auto; border-radius:10px; border:1px solid var(--line); }
  table { border-collapse:collapse; width:100%; font-size:12.5px; }
  th, td { padding:7px 10px; text-align:left; border-bottom:1px solid var(--line); white-space:nowrap; }
  th { background:var(--bg); font-weight:600; color:var(--fg2); position:sticky; top:0; }
  tr:last-child td { border-bottom:0; }
  td.num { font-variant-numeric:tabular-nums; }
  .row-no { color:var(--fg3); font-size:11px; }
    .actions { display:flex; gap:8px; justify-content:center; margin:4px 0 8px; }
  .actions .btn-main, .actions .btn { flex:1; min-width:0; justify-content:center; }
  .btn-main { display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line); background:#fff; color:var(--fg); border-radius:999px; padding:11px 18px; font-size:14px; font-weight:600; cursor:pointer; font-family:inherit; transition:background .15s; }
  .btn-main:hover { background:var(--bg); }
  .btn { display:inline-flex; align-items:center; justify-content:center; border:1px solid var(--line); background:#fff; color:var(--fg); border-radius:999px; padding:11px 18px; font-size:14px; font-weight:600; cursor:pointer; font-family:inherit; }
  .btn:hover { background:var(--bg); }
  .btn-main.primary { background:var(--blue); color:#fff; border-color:var(--blue); }
  .btn-main.primary:hover { background:var(--blue2); }
  /* #300 Base 统一:复制/提示全部走公共组件 */
  /* #301 状态层统一:错误/空态 = Base errorReceipt/emptyState 控件(样式由公共组件决定) */
  @media (max-width:640px) { .wrap { padding:18px 12px 70px; } h1 { font-size:23px; } .map-grid { grid-template-columns:1fr; } .actions .btn-main, .actions .btn { font-size:12.5px; padding:10px 8px; white-space:nowrap; } }
</style>
<style><!--SHARED-CSS--></style>
</head>
<body>
<div class="wrap">
  <header class="header">
    <div class="eyebrow">饼干记账 · 开始使用</div>
    <h1 id="title">导入 CSV 账单</h1>
    <div class="subtitle" id="subtitle"></div>
    <div class="chips" id="chips"></div>
  </header>

  <main id="app"></main>

<div class="actions">
  <button class="btn-main primary" id="copyPromptBtn">📥 确认导入</button>
</div>
<div id="actionbar-zone"></div>
</div>

<script id="payload" type="application/json"><!--INJECT-DATA--></script><script><!--SHARED-HELPERS--></script>



<script>
(function () {
  'use strict';
  var esc = function (s) { return String(s ?? '').replace(/[&<>"']/g, function (c) { return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]); }); };
  var payload;
  try { payload = JSON.parse(document.getElementById('payload').textContent); }
  catch (e) {
    document.getElementById('app').innerHTML = window.errorReceipt({
      message: '数据解析失败: ' + e.message,
      data: document.getElementById('payload').textContent,
      log: 'payload JSON 解析异常'
    });
    return;
  }
  if (!payload || payload.status === 'empty') {
    document.getElementById('app').innerHTML = window.errorReceipt({
      message: (payload && payload.message) || '数据未注入(状态数据为空)',
      data: document.getElementById('payload').textContent,
      log: (payload && payload.status) ? 'payload status = ' + payload.status : 'payload 为空',
      payload: payload || undefined
    });
    return;
  }
  if (payload.status === 'error') {
    document.getElementById('app').innerHTML = window.errorReceipt({
      message: payload.message || '未知错误',
      data: document.getElementById('payload').textContent,
      log: 'payload status = error · 原始 payload 见「复制数据」',
      payload: payload
    });
    return;
  }

  // ── #300 Base 统一:复制数据/复制日志 = Base actionBar(正常路径;错误/空态由 errorReceipt 自带复制按钮,#301 防双份) ──
  if (window.actionBar) {
    var abZoneX = document.getElementById('actionbar-zone');
    if (abZoneX) abZoneX.innerHTML = window.actionBar((payload.data && payload.data.scene) ? payload : {
      status: 'error', message: payload.message || '数据未注入',
      data: { meta: { command_cn: '操作失败', occurred_at: '' },
              scene: { snapshot: { title: '操作失败', summary: [payload.message || '数据未注入'], sections: [] } } },
    });
  }

  var d = payload.data || {};
  var meta = d.meta || {};

  document.getElementById('subtitle').textContent = d.subtitle || '';
  document.getElementById('chips').innerHTML =
    '<span class="chip">⚡ ' + esc(meta.wake_word || '导入') + '</span>' +
    '<span class="chip">● 列映射向导</span>' +
    '<span class="chip">🕒 ' + esc(d.generated_at || '') + '</span>';

  // 列映射:字段 → 列号(1-based);可下拉修改
  var FIELD_LABELS = { date: '日期/时间', amount: '金额', category: '分类', note: '备注', account: '账户', ledger: '账本', type: '收支方向' };
  var mapping = d.mapping || {};
  var colCount = Math.max(1, (d.header || []).length, d.preview && d.preview.length ? d.preview[0].cols.length : 0);

  var mapHtml = Object.keys(FIELD_LABELS).map(function (field) {
    var cur = mapping[field] || 0;
    var options = '<option value="0">(未映射)</option>';
    for (var i = 1; i <= colCount; i++) {
      var label = (d.header && d.header[i - 1]) ? ('列' + i + '·' + d.header[i - 1]) : ('列' + i);
      options += '<option value="' + i + '"' + (cur === i ? ' selected' : '') + '>' + esc(label) + '</option>';
    }
    var isRequired = (field === 'date' || field === 'amount' || field === 'category');
    return '<div class="map-item"><div class="k">' + esc(FIELD_LABELS[field]) + (isRequired ? ' <span style="color:var(--red)">*</span>' : '') + '</div>' +
      '<select data-field="' + field + '">' + options + '</select>' +
      (cur ? '<div class="m">✓ 自动猜测: 列' + cur + '</div>' : '') + '</div>';
  }).join('');

  var headerCells = [];
  for (var i = 0; i < colCount; i++) {
    headerCells.push('<th>' + esc((d.header && d.header[i]) ? d.header[i] : '列' + (i + 1)) + '</th>');
  }
  var rowsHtml = (d.preview || []).map(function (p) {
    var cells = [];
    for (var i = 0; i < colCount; i++) {
      cells.push('<td class="num">' + esc(p.cols[i] || '') + '</td>');
    }
    return '<tr><td class="row-no">' + p.no + '</td>' + cells.join('') + '</tr>';
  }).join('');

  document.getElementById('app').innerHTML =
    '<div class="card"><div class="file-box">' +
    '<div class="file-ic">📄</div>' +
    '<div><div class="file-name">' + esc(d.name || '') + '</div>' +
    '<div class="file-meta">共 ' + (d.total_rows || 0) + ' 行 · 编码 ' + esc(d.encoding || '自动') + '</div></div></div></div>' +
    '<div class="card"><div class="section-title">列映射<span class="hint">自动猜测,可修改</span></div>' +
    '<div class="map-grid">' + mapHtml + '</div></div>' +
    '<div class="card"><div class="section-title">前 ' + Math.min(8, (d.preview || []).length) + ' 行预览<span class="hint">共 ' + (d.total_rows || 0) + ' 行</span></div>' +
    '<div class="table-scroll"><table><thead><tr><th>#</th>' + headerCells.join('') + '</tr></thead>' +
    '<tbody>' + (rowsHtml || '<tr><td colspan="' + (colCount + 1) + '" style="text-align:center;color:var(--fg3);padding:14px;">(无数据行)</td></tr>') + '</tbody></table></div></div>';

  // 下拉修改 → 更新确认 prompt
  function buildPrompt() {
    var parts = [];
    Object.keys(FIELD_LABELS).forEach(function (field) {
      var v = parseInt((document.querySelector('select[data-field="' + field + '"]') || {}).value || '0', 10);
      if (v > 0) parts.push(field + '=' + v);
    });
    return '请加载「饼干记账」技能,帮我导入 CSV 账单(唤醒词:导入):\n\n' +
      '  文件路径: ' + (d.file || '____') + '\n' +
      '  列映射: ' + (parts.join(',') || '____(自动识别)');
  }
  document.getElementById('copyPromptBtn').onclick = function () {
    window.copyText(buildPrompt());
  };

  // ── 复制能力(08 §4 硬标准) ──
  
})();
</script>
</body>
</html>
