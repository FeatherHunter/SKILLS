<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>饼干记账 · 从备份恢复</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --bg:#f5f5f7; --card:#fff; --line:#e5e5ea; --fg:#1d1d1f; --fg2:#6e6e73; --fg3:#86868b; --blue:#007aff; --blue2:#0a63ce; --green:#34c759; --orange:#ff9500; --red:#ff3b30; --soft:#f5f8ff; --shadow:0 1px 3px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.05); }
  body { font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--fg); line-height:1.6; -webkit-font-smoothing:antialiased; padding:0 0 90px; }
  .wrap { max-width:640px; margin:0 auto; padding:24px 16px; }
  .header { padding:6px 0 18px; }
  .eyebrow { font-size:12px; color:var(--fg3); font-weight:600; letter-spacing:.06em; margin-bottom:6px; }
  h1 { font-size:27px; font-weight:700; letter-spacing:-.02em; line-height:1.25; }
  .subtitle { color:var(--fg2); font-size:14px; margin-top:6px; }
  .chips { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
  .chip { font-size:11.5px; font-weight:600; padding:3px 10px; border-radius:999px; background:var(--soft); color:var(--blue2); border:1px solid #d7e6ff; }
  .card { background:var(--card); border-radius:16px; box-shadow:var(--shadow); padding:18px 20px; margin-bottom:14px; }
  .steps { display:flex; flex-direction:column; gap:0; }
  .step { display:flex; gap:14px; padding:12px 0; border-bottom:1px solid var(--line); }
  .step:last-child { border-bottom:0; }
  .step-ic { width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:700; flex-shrink:0; }
  .step-ic.done { background:rgba(52,199,89,.14); color:var(--green); }
  .step-ic.pending { background:var(--bg); color:var(--fg3); }
  .step-ic.current { background:rgba(0,122,255,.14); color:var(--blue); }
  .step-body { flex:1; min-width:0; }
  .step-name { font-size:15px; font-weight:700; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .step-status { font-size:11px; font-weight:700; padding:2px 9px; border-radius:999px; }
  .step-status.done { background:rgba(52,199,89,.12); color:var(--green); }
  .step-status.pending { background:var(--bg); color:var(--fg3); }
  .step-status.current { background:rgba(0,122,255,.12); color:var(--blue); }
  .step-detail { font-size:12.5px; color:var(--fg2); margin-top:3px; word-break:break-all; }
  .warn { background:#fff7e8; border:1px solid #ffe3b3; border-radius:12px; padding:12px 14px; color:#b25b00; font-size:13px; margin-top:10px; }
  .detail-row { display:flex; justify-content:space-between; gap:10px; padding:8px 0; border-bottom:1px solid var(--line); font-size:13.5px; }
  .detail-row:last-child { border-bottom:0; }
  .detail-row .k { color:var(--fg3); }
  .detail-row .v { font-weight:600; font-variant-numeric:tabular-nums; word-break:break-all; text-align:right; }
  .select { margin-top:10px; }
  .select-label { font-size:12px; font-weight:600; color:var(--fg2); margin-bottom:6px; }
  .b-list { display:flex; flex-direction:column; gap:6px; }
  .b-opt { display:flex; align-items:center; gap:10px; border:1.5px solid var(--line); background:#fff; border-radius:12px; padding:10px 12px; font-size:13.5px; font-weight:600; cursor:pointer; font-family:inherit; text-align:left; transition:border .15s; }
  .b-opt:hover { border-color:var(--blue); }
  .b-opt.sel { border-color:var(--blue); background:var(--soft); }
  .b-opt .m { color:var(--fg3); font-weight:400; font-size:12px; margin-left:auto; }
  .actions { display:flex; gap:8px; justify-content:center; margin:4px 0 12px; }
  .actions .btn-main, .actions .btn { flex:1; min-width:0; justify-content:center; }
  .btn-main { display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line); background:#fff; color:var(--fg); border-radius:999px; padding:11px 18px; font-size:14px; font-weight:600; cursor:pointer; font-family:inherit; transition:background .15s; }
  .btn-main:hover { background:var(--bg); }
  .btn { display:inline-flex; align-items:center; justify-content:center; border:1px solid var(--line); background:#fff; color:var(--fg); border-radius:999px; padding:11px 18px; font-size:14px; font-weight:600; cursor:pointer; font-family:inherit; }
  .btn:hover { background:var(--bg); }
  .btn-main.primary { background:var(--blue); color:#fff; border-color:var(--blue); }
  .btn-main.primary:hover { background:var(--blue2); }
  /* #300 Base 统一:复制/提示全部走公共组件 */
  .error-card { background:rgba(255,59,48,.08); border:1px solid rgba(255,59,48,.2); border-radius:16px; padding:22px; text-align:center; }
  .error-card h3 { color:var(--red); margin-bottom:8px; font-size:17px; }
  .error-card p { color:var(--fg2); font-size:13.5px; word-break:break-all; }
  @media (max-width:640px) { .wrap { padding:18px 12px 70px; } h1 { font-size:23px; } .actions .btn-main, .actions .btn { font-size:12.5px; padding:10px 8px; white-space:nowrap; } }
</style>
<style><!--SHARED-CSS--></style>
</head>
<body>
<div class="wrap">
  <header class="header">
    <div class="eyebrow">饼干记账 · 开始使用</div>
    <h1 id="title">从备份恢复</h1>
    <div class="subtitle" id="subtitle"></div>
    <div class="chips" id="chips"></div>
  </header>

  <main id="app"></main>
</div>

<div class="actions">
  <button class="btn-main primary" id="copyPromptBtn">↩️ 确认恢复</button>
</div>
<div id="actionbar-zone"></div>

<script id="payload" type="application/json"><!--INJECT-DATA--></script><script><!--SHARED-HELPERS--></script>



<script>
(function () {
  'use strict';
  var esc = function (s) { return String(s ?? '').replace(/[&<>"']/g, function (c) { return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]); }); };
  var payload;
  try { payload = JSON.parse(document.getElementById('payload').textContent); } catch (e) { return; }
  if (!payload || payload.status === 'empty') return;
  // ── #300 Base 统一:复制数据/复制日志 = Base actionBar ──
  if (window.actionBar) {
    var abZoneX = document.getElementById('actionbar-zone');
    if (abZoneX) abZoneX.innerHTML = window.actionBar((payload.data && payload.data.scene) ? payload : {
      status: 'error', message: payload.message || '数据未注入',
      data: { meta: { command_cn: '操作失败', occurred_at: '' },
              scene: { snapshot: { title: '操作失败', summary: [payload.message || '数据未注入'], sections: [] } } },
    });
  }

  if (payload.status === 'error') {
    document.getElementById('app').innerHTML =
      '<div class="error-card"><h3>⚠️ 无法恢复</h3><p>' + esc(payload.message || '未知错误') + '</p></div>';
    return;
  }
  var d = payload.data || {};
  var meta = d.meta || {};
  var sel = d.selected || {};

  document.getElementById('subtitle').textContent = d.subtitle || '';
  document.getElementById('chips').innerHTML =
    '<span class="chip">⚡ ' + esc(meta.wake_word || '恢复备份') + '</span>' +
    '<span class="chip">● 详情预览</span>' +
    '<span class="chip">🕒 ' + esc(d.generated_at || '') + '</span>';

  var stepsHtml =
    '<div class="step"><div class="step-ic done">✓</div><div class="step-body"><div class="step-name">备份详情预览 <span class="step-status done">已完成</span></div>' +
    '<div class="step-detail">选中: ' + esc(sel.name || '') + '</div></div></div>' +
    '<div class="step"><div class="step-ic current">2</div><div class="step-body"><div class="step-name">确认恢复 <span class="step-status current">待确认</span></div>' +
    '<div class="step-detail">恢复前会自动备份现状(防覆盖丢失)</div></div></div>' +
    '<div class="step"><div class="step-ic pending">3</div><div class="step-body"><div class="step-name">恢复 + 验证 <span class="step-status pending">待执行</span></div>' +
    '<div class="step-detail">拷贝回数据目录 → db 校验可打开</div></div></div>';

  var detailHtml =
    '<div class="detail-row"><span class="k">备份名称</span><span class="v">' + esc(sel.name || '') + '</span></div>' +
    '<div class="detail-row"><span class="k">备份时间</span><span class="v">' + esc(sel.time || '') + '</span></div>' +
    '<div class="detail-row"><span class="k">大小</span><span class="v">' + esc(sel.size != null ? (sel.size >= 1024 ? (sel.size / 1024).toFixed(1) + ' KB' : sel.size + ' B') : '') + '</span></div>' +
    '<div class="detail-row"><span class="k">内容</span><span class="v">' + esc((sel.files || []).join(', ')) + '</span></div>';

  var selectHtml = '';
  if ((d.backups || []).length > 1) {
    var opts = (d.backups || []).map(function (b) {
      var selCls = b.name === sel.name ? ' sel' : '';
      return '<button class="b-opt' + selCls + '" data-name="' + esc(b.name) + '">' + esc(b.name) +
        '<span class="m">' + esc(b.time || '') + '</span></button>';
    }).join('');
    selectHtml = '<div class="select"><div class="select-label">选择备份(默认最新)</div><div class="b-list">' + opts + '</div></div>';
  }

  document.getElementById('app').innerHTML =
    '<div class="card"><div class="steps">' + stepsHtml + '</div>' +
    '<div class="warn"><b>⚠️ 恢复将覆盖当前数据</b>恢复前会自动备份现状,若恢复后不满意可再用「恢复备份」回到现状备份</div>' +
    selectHtml + '</div>' +
    '<div class="card"><div class="detail-row" style="border-bottom:1px solid var(--line);"><span class="k" style="font-weight:700;font-size:14px;">📦 备份详情</span><span></span></div>' + detailHtml + '</div>';

  // 切换备份 → 重新复制确认 prompt
  var curName = sel.name || '';
  document.querySelectorAll('.b-opt').forEach(function (b) {
    b.onclick = function () {
      curName = this.getAttribute('data-name');
      document.querySelectorAll('.b-opt').forEach(function (x) { x.classList.remove('sel'); });
      this.classList.add('sel');
    };
  });

  document.getElementById('copyPromptBtn').onclick = function () {
    window.copyText('请加载「饼干记账」技能,帮我从备份恢复数据(唤醒词:恢复备份):\n\n  备  份: ' + (curName || '____') + ' (默认最新)');
  };

  // ── 复制能力(08 §4 硬标准) ──
  
})();
</script>
</body>
</html>
