<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>饼干记账 · 设定储蓄目标</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --bg:#f5f5f7; --card:#fff; --line:#e5e5ea; --fg:#1d1d1f; --fg2:#6e6e73; --fg3:#86868b; --blue:#007aff; --blue2:#0a63ce; --green:#34c759; --orange:#ff9500; --red:#ff3b30; --soft:#f5f8ff; --shadow:0 1px 3px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.05); }
  body { font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--fg); line-height:1.6; -webkit-font-smoothing:antialiased; padding:0 0 90px; }
  .wrap { max-width:640px; margin:0 auto; padding:24px 16px; }
  .header { padding:6px 0 18px; }
  .eyebrow { font-size:12px; color:var(--fg3); font-weight:600; letter-spacing:.06em; margin-bottom:6px; }
  h1 { font-size:27px; font-weight:700; letter-spacing:-.02em; line-height:1.25; }
  .chips { display:flex; gap:8px; margin-top:8px; flex-wrap:wrap; }
  .chip { font-size:11.5px; font-weight:600; padding:3px 10px; border-radius:999px; background:var(--soft); color:var(--blue2); border:1px solid #d7e6ff; }
  .card { background:var(--card); border-radius:16px; box-shadow:var(--shadow); padding:18px 20px; margin-bottom:14px; }
  label.field { display:block; font-size:12px; font-weight:600; color:var(--fg2); margin:14px 0 5px; }
  label.field:first-child { margin-top:0; }
  input[type=text], input[type=number] { width:100%; border:1px solid var(--line); border-radius:10px; padding:9px 12px; font-size:14px; font-family:inherit; background:#fff; outline:none; transition:border .15s, box-shadow .15s; }
  input:focus { border-color:var(--blue); box-shadow:0 0 0 3px rgba(0,122,255,.12); }
  input.amount { font-size:26px; font-weight:700; padding:12px 14px; font-variant-numeric:tabular-nums; }
  .prefix { position:relative; }
  .prefix input { padding-left:34px; }
  .prefix .cur { position:absolute; left:14px; top:50%; transform:translateY(-50%); color:var(--fg3); font-size:15px; font-weight:600; }
  .hint { font-size:11.5px; color:var(--fg3); margin-top:4px; }

  /* 动作区(08 §2:底部右对齐) */
  .actions { display:flex; justify-content:flex-end; gap:8px; margin:4px 0 16px; }
  .actions .btn-main, .actions .btn { flex:1; min-width:0; justify-content:center; }
  .btn-main { display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line); background:#fff; color:var(--fg); border-radius:999px; padding:10px 18px; font-size:14px; font-weight:600; cursor:pointer; font-family:inherit; transition:background .15s; }
  .btn-main:hover { background:var(--bg); }
  .btn { display:inline-flex; align-items:center; justify-content:center; gap:5px; border:0; background:var(--blue); color:#fff; border-radius:999px; padding:8px 14px; font-size:13px; font-weight:600; cursor:pointer; font-family:inherit; transition:background .15s; }
  .btn:hover { background:var(--blue2); }
  .btn.ghost { background:#fff; color:var(--fg); border:1px solid var(--line); }
  .btn.ghost:hover { background:var(--bg); }

  /* #300 Base 统一:复制/提示全部走公共组件 */
  @media (max-width:640px) { .wrap { padding:18px 12px 70px; } .actions .btn-main, .actions .btn { font-size:12.5px; padding:9px 8px; white-space:nowrap; } h1 { font-size:23px; } }
</style>
<style><!--SHARED-CSS--></style>
</head>
<body>
<div class="wrap">
  <header class="header">
    <div class="eyebrow">饼干记账 · 目标采集</div>
    <h1 id="title">设定储蓄目标</h1>
    <div class="chips" id="chips"></div>
  </header>

  <main id="app">
    <div class="card">
      <label class="field">目标</label>
      <input type="text" id="fName" placeholder="如:换手机 / 旅行基金">
      <div class="hint">想存钱买什么,一句话说清楚</div>

      <label class="field">金额(元)</label>
      <div class="prefix"><span class="cur">¥</span><input type="number" step="0.01" class="amount" id="fAmount" placeholder="10000"></div>
      <div class="hint">目标总额,如:10000</div>

      <label class="field">截止日期(选填)</label>
      <input type="text" id="fDeadline" placeholder="如:12月底 / 2026-12-31">
      <div class="hint">不填 = 无截止日期;进度 = 目标期内收入-支出累计</div>
    </div>
  </main>

  <!-- 动作区(08 §2 底部右对齐 · #300 复制数据/日志 = Base actionBar) -->
  <div class="actions">
    <button class="btn-main" id="copyPromptBtn">📋 确认</button>
  </div>
  <div id="actionbar-zone"></div>

  <script id="payload" type="application/json"><!--INJECT-DATA--></script><script><!--SHARED-HELPERS--></script>

</div>

<script>
(function () {
  'use strict';
  var esc = function (s) { return String(s ?? '').replace(/[&<>"']/g, function (c) { return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]); }); };

  var payload;
  try { payload = JSON.parse(document.getElementById('payload').textContent); }
  catch (e) {
    document.getElementById('app').innerHTML = window.errorReceipt({
      message: '数据解析失败: ' + e.message,
      data: document.getElementById('payload').textContent,
      log: 'payload JSON 解析异常'
    });
    return;
  }
  if (!payload || payload.status !== 'ok') {
    document.getElementById('app').innerHTML = window.errorReceipt({
      message: (payload && payload.message) || '数据未注入(操作未执行)',
      data: document.getElementById('payload').textContent,
      log: (payload && payload.status) ? 'payload status = ' + payload.status : 'payload 为空',
      payload: payload || undefined
    });
    return;
  }
  var d = payload.data || {};
  var meta = d.meta || {};
  var fields = (d.form && d.form.fields) || {};

  var WAKE = meta.wake_word || '设定目标';
  var ACTION = meta.command_cn || '设定储蓄目标';

  document.getElementById('title').textContent = d.title || ACTION;
  document.getElementById('chips').innerHTML =
    '<span class="chip">⚡ ' + esc(WAKE) + '</span>' +
    '<span class="chip">● 填写确认</span>' +
    '<span class="chip">🕒 ' + esc(d.generated_at || '') + '</span>';

  // 预填(render.py 已把 AI 解析字段透传)
  var elName = document.getElementById('fName');
  var elAmount = document.getElementById('fAmount');
  var elDeadline = document.getElementById('fDeadline');
  elName.value = fields.name || '';
  elAmount.value = fields.amount || '';
  elDeadline.value = fields.deadline || '';

  // ── 确认 prompt 生成(对齐 scenes/goal.yaml goal-3-1) ──
  function fmtField(k, v, hint) { return '  ' + k + ': ' + (v || '__' + (hint || '') + '__'); }
  function buildPrompt() {
    var lines = [];
    lines.push('请加载「饼干记账」技能,帮我设定储蓄目标(唤醒词:设定目标):');
    lines.push('');
    lines.push(fmtField('目\u2003标', elName.value, '如:换手机 / 旅行基金'));
    lines.push(fmtField('金\u2003额', elAmount.value, '如:10000'));
    lines.push(fmtField('截止日期', elDeadline.value, '选填,如:12月底'));
    return lines.join('\n');
  }

  // ── #300 Base 统一:复制/提示走公共组件 ──
  document.getElementById('copyPromptBtn').onclick = function () { window.copyText(buildPrompt()); };

  if (window.actionBar) {
    var abPayload = (payload.data && payload.data.scene) ? payload : {
      status: 'error', message: '数据未注入',
      data: { meta: { command_cn: '操作失败', occurred_at: '' },
              scene: { snapshot: { title: '操作失败', summary: ['数据未注入'], sections: [] } } },
    };
    var abZone = document.getElementById('actionbar-zone');
    if (abZone) abZone.innerHTML = window.actionBar(abPayload);
  }
})();
</script>
</body>
</html>
