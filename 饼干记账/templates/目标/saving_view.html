<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>饼干记账 · 查看目标进度</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f5f5f7; --card: #ffffff; --border: #e5e5ea;
    --fg: #1d1d1f; --fg2: #6e6e73; --fg3: #86868b;
    --blue: #007aff; --green: #34c759; --orange: #ff9500; --red: #ff3b30; --purple: #af52de;
    --shadow: 0 1px 3px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.04);
    --radius: 14px;
  }
  html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--fg); line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh; padding: 0 0 80px;
  }
  .container { max-width: 920px; margin: 0 auto; padding: 24px 16px; }

  .header { padding: 8px 0 24px; }
  .eyebrow { font-size: 12px; color: var(--fg3); font-weight: 600; letter-spacing: .08em; text-transform: uppercase; margin-bottom: 6px; }
  h1.title { font-size: 32px; font-weight: 700; letter-spacing: -.02em; line-height: 1.2; }
  .subtitle { color: var(--fg2); font-size: 15px; margin-top: 6px; }

  .card { background: var(--card); border-radius: var(--radius); padding: 20px 22px; margin-bottom: 14px; box-shadow: var(--shadow); }
  .section-title { font-size: 17px; font-weight: 700; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
  .section-title .count { font-size: 13px; font-weight: 500; color: var(--fg3); margin-left: auto; }
  .empty { color: var(--fg3); font-size: 14px; text-align: center; padding: 24px 0; }

  .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
  .kpi { background: var(--card); border-radius: var(--radius); padding: 16px 18px; box-shadow: var(--shadow); }
  .kpi .label { font-size: 12px; color: var(--fg2); margin-bottom: 6px; font-weight: 500; }
  .kpi .value { font-size: 26px; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .kpi .unit { font-size: 13px; color: var(--fg2); font-weight: 400; margin-left: 4px; }
  .kpi.blue .value { color: var(--blue); }
  .kpi.green .value { color: var(--green); }
  .kpi.orange .value { color: var(--orange); }
  .kpi.red .value { color: var(--red); }
  .kpi.purple .value { color: var(--purple); }

  .saving-bar { background: var(--card); border-radius: var(--radius); padding: 16px 18px; margin-bottom: 10px; box-shadow: var(--shadow); }
  .saving-bar .head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; gap: 10px; flex-wrap: wrap; }
  .saving-bar .name { font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
  .saving-bar .stats { font-size: 12.5px; color: var(--fg2); font-variant-numeric: tabular-nums; }
  .saving-bar .stats b { color: var(--fg); font-weight: 700; font-size: 15px; }
  .saving-bar .track { height: 12px; background: var(--bg); border-radius: 6px; overflow: hidden; }
  .saving-bar .fill { height: 100%; border-radius: 6px; }
  .saving-bar .foot { display: flex; justify-content: space-between; margin-top: 7px; font-size: 12px; color: var(--fg3); gap: 10px; flex-wrap: wrap; }
  .saving-bar .proj { margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--border); font-size: 12px; color: var(--fg2); }
  .saving-bar .proj b { color: var(--blue); font-weight: 700; }
  .status-chip { font-size: 11px; font-weight: 700; padding: 2px 9px; border-radius: 999px; background: rgba(0,0,0,.05); }
  .status-chip.done { color: var(--green); background: rgba(52,199,89,.12); }
  .status-chip.on_track { color: var(--blue); background: rgba(0,122,255,.1); }
  .status-chip.behind { color: var(--red); background: rgba(255,59,48,.1); }
  .status-chip.na { color: var(--fg3); background: rgba(0,0,0,.05); }

  .footer { text-align: center; color: var(--fg3); font-size: 12px; margin-top: 32px; padding-top: 16px; border-top: 1px solid var(--border); }
  .footer code { background: var(--bg); padding: 2px 6px; border-radius: 4px; font-size: 11px; color: var(--fg2); }

  .error-card { background: rgba(255,59,48,.08); border: 1px solid rgba(255,59,48,.2); border-radius: var(--radius); padding: 24px; text-align: center; }
  .error-card h3 { color: var(--red); margin-bottom: 8px; font-size: 18px; }
  .error-card p { color: var(--fg2); font-size: 14px; }

  /* #300 Base 统一:复制数据/日志 = Base actionBar 控件(样式由公共组件决定) */

  .offline { background: #fff7e8; border: 1px solid #ffe3b3; border-radius: var(--radius); padding: 14px 18px; margin-bottom: 14px; color: #b25b00; font-size: 13.5px; }

  @media (max-width: 640px) {
    .container { padding: 16px 12px; }
    h1.title { font-size: 26px; }
    .kpi .value { font-size: 22px; }
    .saving-bar .stats { font-size: 11.5px; }
    .saving-bar .stats b { font-size: 13px; }
  }
</style>
<style><!--SHARED-CSS--></style>
</head>
<body>
<div class="container">
  <header class="header" id="header"></header>
  <main id="app"></main>
  <!-- 动作区(#300 Base 统一:复制数据/复制日志 = actionBar 控件) -->
  <div id="actionbar-zone"></div>
  <footer class="footer" id="footer"></footer>
</div>

<!-- 注入点:goal/render.py 把 CLI JSON 包成 {status, data, message} 信封后经 Base 注入器注入 -->
<script id="payload" type="application/json"><!--INJECT-DATA--></script><script><!--SHARED-HELPERS--></script>

<script>
(function() {
  'use strict';

  // ── 工具函数 ──────────────────────────────────────────────
  const $ = (sel) => document.querySelector(sel);
  const fmtMoney = (n) => (Math.round((n || 0) * 100) / 100).toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const fmtPct = (n) => (Math.round((n || 0) * 10) / 10).toFixed(1) + '%';
  const escapeHTML = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  const STATUS_META = {
    done:     { label: '已达成',  color: 'var(--green)' },
    on_track: { label: '进行中',  color: 'var(--blue)' },
    behind:   { label: '进度落后', color: 'var(--red)' },
    na:       { label: '暂无进度', color: 'var(--fg3)' },
  };

  // ── 主路由 ────────────────────────────────────────────────
  function init() {
    const raw = document.getElementById('payload').textContent;
    let payload;
    try {
      payload = JSON.parse(raw);
    } catch (e) {
      renderError('JSON 解析失败：' + e.message);
      return;
    }
    if (!payload || payload.status === 'empty') {
      renderError('数据未注入（payload 为空）');
      return;
    }
    if (payload.status === 'error') {
      renderError(payload.message || '查询失败');
      renderActionBar(payload);
      return;
    }
    const data = payload.data || {};
    const type = data.type;
    const title = data.title || payload.message || '饼干记账 · 查看目标进度';

    renderHeader(title, data);
    if (data.offline) {
      $('#app').insertAdjacentHTML('afterbegin', '<div class="offline">⚠️ 离线态:展示本地缓存数据,可能过期</div>');
    }
    if (type !== 'saving') {
      renderError('未知视图类型：' + escapeHTML(type));
      return;
    }
    renderSaving(data);
    renderActionBar(payload);
    renderFooter(data);
  }

  function renderHeader(title, data) {
    const subtitle = data.subtitle || data.message || '';
    $('#header').innerHTML = `
      <div class="eyebrow">饼干记账 · 目标视图</div>
      <h1 class="title">${escapeHTML(title)}</h1>
      ${subtitle ? `<div class="subtitle">${escapeHTML(subtitle)}</div>` : ''}
    `;
  }

  function renderFooter(data) {
    $('#footer').innerHTML = `
      生成于 ${escapeHTML(data.generated_at || new Date().toLocaleString('zh-CN'))} · 类型 <code>saving</code><br>
      数据载体: <code>goals.json(目标) + bills 聚合(目标期内收入-支出)</code>
    `;
  }

  function renderError(msg) {
    $('#app').innerHTML = `
      <div class="error-card">
        <h3>⚠️ 出错了</h3>
        <p>${escapeHTML(msg)}</p>
      </div>
    `;
  }

  // ── #300 Base 统一:复制数据/复制日志 = actionBar 控件 ──
  function renderActionBar(p) {
    const zone = document.getElementById('actionbar-zone');
    if (!zone || !window.actionBar) return;
    const ab = (p && p.data && p.data.scene) ? p : {
      status: 'error',
      message: (p && p.message) || '未知错误',
      data: {
        meta: { command_cn: '操作失败', occurred_at: '' },
        scene: { snapshot: { title: '操作失败', summary: [(p && p.message) || '未知错误'], sections: [] } },
      },
    };
    zone.innerHTML = window.actionBar(ab);
  }

  // ── 看目标 saving(已存/目标/百分比/剩余/预计达成日 · 进度条) ──
  function renderSaving(data) {
    const savings = data.savings || [];
    const totalSaved = savings.reduce((s, g) => s + (g.saved || 0), 0);
    const totalGoal = savings.reduce((s, g) => s + (g.amount || 0), 0);
    $('#app').innerHTML = `
      <div class="kpi-grid">
        ${kpiCard('目标数', data.count || 0, '个', 'blue')}
        ${kpiCard('已完成', data.done_count || 0, '个', 'green')}
        ${kpiCard('累计已存', fmtMoney(totalSaved), '元', 'purple')}
        ${kpiCard('目标总额', fmtMoney(totalGoal), '元', 'orange')}
      </div>
      ${savings.length ? `
        <div class="card" style="margin-top:14px;">
          <div class="section-title">目标进度 <span class="count">${savings.length} 个</span></div>
          ${savings.map(s => savingCard(s)).join('')}
        </div>
      ` : '<div class="card empty" style="margin-top:14px;">还没有储蓄目标,说「设定目标」即可开始</div>'}
    `;
  }

  function savingCard(s) {
    const sm = STATUS_META[s.status] || STATUS_META.na;
    const pct = Math.min(Math.max(s.pct, 0), 100);
    const etaText = s.status === 'done' ? '🎉 目标已达成'
      : (s.eta ? `预计 ${escapeHTML(s.eta)} 达成` : '暂无预计(先存一笔吧)');
    const deadlineText = s.deadline ? ` · 截止 ${escapeHTML(s.deadline)}` : ' · 无截止日期';
    // 达标所需月存(有截止日且未达成)
    let neededText = '';
    if (s.needed_monthly != null) {
      neededText = `<div class="proj">截止前达标还需 <b>每月 ${fmtMoney(s.needed_monthly)} 元</b>(${s.remaining >= 0 ? '还差 ' + fmtMoney(s.remaining) + ' 元' : '已超出 ' + fmtMoney(Math.abs(s.remaining)) + ' 元'})</div>`;
    }
    return `
      <div class="saving-bar">
        <div class="head">
          <span class="name">${escapeHTML(s.name)} <span class="status-chip ${s.status}">${sm.label}</span></span>
          <span class="stats">已存 <b>${fmtMoney(s.saved)}</b> / ${fmtMoney(s.amount)} 元</span>
        </div>
        <div class="track"><div class="fill" style="width:${pct}%;background:${sm.color}"></div></div>
        <div class="foot">
          <span>进度 ${fmtPct(Math.max(s.pct, 0))} · 月均净存 ${fmtMoney(s.monthly_avg)} 元</span>
          <span>${etaText}${deadlineText}</span>
        </div>
        ${neededText}
      </div>
    `;
  }

  // ── 组件：KPI 卡 ─────────────────────────────────────────
  function kpiCard(label, value, unit, color) {
    return `<div class="kpi ${color || ''}">
      <div class="label">${escapeHTML(label)}</div>
      <div class="value">${escapeHTML(value)}${unit ? `<span class="unit">${escapeHTML(unit)}</span>` : ''}</div>
    </div>`;
  }

  // ── 启动 ──────────────────────────────────────────────────
  document.addEventListener('DOMContentLoaded', () => {
    init();
  });
})();
</script>
</body>
</html>
