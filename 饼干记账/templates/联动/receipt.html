<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>饼干记账 · 联动回执</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --bg:#f5f5f7; --card:#fff; --line:#e5e5ea; --fg:#1d1d1f; --fg2:#6e6e73; --fg3:#86868b; --blue:#007aff; --blue2:#0a63ce; --green:#34c759; --orange:#ff9500; --red:#ff3b30; --purple:#af52de; --soft:#f5f8ff; --shadow:0 1px 3px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.05); }
  body { font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--fg); line-height:1.6; -webkit-font-smoothing:antialiased; padding:0 0 90px; }
  .wrap { max-width:640px; margin:0 auto; padding:24px 16px; }
  .header { padding:6px 0 18px; }
  .eyebrow { font-size:12px; color:var(--fg3); font-weight:600; letter-spacing:.06em; margin-bottom:6px; }
  h1 { font-size:27px; font-weight:700; letter-spacing:-.02em; line-height:1.25; }
  .chips { display:flex; gap:8px; margin-top:8px; flex-wrap:wrap; }
  .chip { font-size:11.5px; font-weight:600; padding:3px 10px; border-radius:999px; background:var(--soft); color:var(--blue2); border:1px solid #d7e6ff; }
  .done-chip { background:#e7f8ee; color:#1a7a3a; border-color:#b9e6c9; }
  .card { background:var(--card); border-radius:16px; box-shadow:var(--shadow); padding:18px 20px; margin-bottom:14px; }
  .card h2 { font-size:14.5px; font-weight:700; margin-bottom:10px; }
  .row { display:flex; justify-content:space-between; gap:12px; padding:7px 0; border-bottom:1px dashed #eef0f3; font-size:13.5px; }
  .row:last-child { border-bottom:0; }
  .row .k { color:var(--fg2); font-weight:600; flex-shrink:0; }
  .row .v { text-align:right; word-break:break-all; font-variant-numeric:tabular-nums; }
  .row .v.amt { font-weight:700; color:var(--red); }
  .row .v.empty { color:var(--fg3); }
  .ok { display:flex; align-items:center; gap:8px; color:#1a7a3a; font-size:13px; font-weight:600; margin-bottom:4px; }

  /* 联动卡(预告式 · 08 §4 下一步按钮) */
  .link-card { background:linear-gradient(180deg,#f5f8ff,#eef4ff); border:1px solid #cfe0ff; border-radius:16px; padding:18px 20px; margin-bottom:14px; }
  .link-card h2 { font-size:15px; font-weight:700; color:var(--blue2); margin-bottom:4px; }
  .link-card .sub { font-size:12.5px; color:var(--fg2); margin-bottom:12px; }
  .link-fields { background:#fff; border:1px solid var(--line); border-radius:12px; padding:4px 14px; margin-bottom:12px; }
  .link-fields .row { font-size:13px; padding:6px 0; }
  .link-btn { display:flex; align-items:center; justify-content:center; gap:6px; width:100%; border:0; background:var(--blue); color:#fff; border-radius:999px; padding:12px 18px; font-size:14.5px; font-weight:700; cursor:pointer; font-family:inherit; transition:background .15s; box-shadow:0 4px 14px rgba(0,122,255,.28); }
  .link-btn:hover { background:var(--blue2); }
  .link-hint { text-align:center; font-size:11.5px; color:var(--fg3); margin-top:8px; }

  /* 动作区(08 §2:底部右对齐) */
  .actions { display:flex; justify-content:flex-end; gap:8px; margin:4px 0 16px; }
  .actions .btn-main, .actions .btn { flex:1; min-width:0; justify-content:center; }
  .btn-main { display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line); background:#fff; color:var(--fg); border-radius:999px; padding:10px 18px; font-size:14px; font-weight:600; cursor:pointer; font-family:inherit; transition:background .15s; }
  .btn-main:hover { background:var(--bg); }
  .btn { display:inline-flex; align-items:center; justify-content:center; gap:5px; border:0; background:#fff; color:var(--fg); border:1px solid var(--line); border-radius:999px; padding:8px 14px; font-size:13px; font-weight:600; cursor:pointer; font-family:inherit; transition:background .15s; }
  .btn:hover { background:var(--bg); }
  .btn.danger { color:var(--red); border-color:#ffd1cd; }

  /* B1 toast */
  .toast { position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom,0)); transform:translateX(-50%) scale(.9); opacity:0; background:rgba(28,28,30,.94); -webkit-backdrop-filter:blur(20px) saturate(180%); backdrop-filter:blur(20px) saturate(180%); color:#f0f0f0; border-radius:14px; padding:13px 14px 13px 16px; display:flex; align-items:flex-start; gap:12px; max-width:480px; min-width:300px; box-shadow:0 10px 32px rgba(0,0,0,.32); pointer-events:none; transition:opacity .22s ease-out, transform .22s cubic-bezier(.34,1.56,.64,1); z-index:99; }
  .toast.show { opacity:1; transform:translateX(-50%) scale(1); pointer-events:auto; }
  .toast-title { font-weight:600; font-size:12.5px; color:#fff; margin-bottom:2px; }
  .toast-detail { font-size:11px; color:#c8c8cc; }
  .toast-close { background:rgba(255,255,255,.10); color:#34c759; border:0; border-radius:8px; padding:5px 9px; font-size:10.5px; margin-left:6px; cursor:pointer; flex-shrink:0; }
  @media (max-width:640px) { .wrap { padding:18px 12px 70px; } .actions .btn-main, .actions .btn { font-size:12.5px; padding:9px 8px; white-space:nowrap; } h1 { font-size:23px; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="header">
    <div class="eyebrow" id="eyebrow">饼干记账 · 联动回执</div>
    <h1 id="title">买东西联动 · 已记账</h1>
    <div class="chips" id="chips"></div>
  </header>

  <main>
    <!-- 已记录账单(回执主信息) -->
    <div class="card">
      <div class="ok">✓ 已记账(如需联动,看下方)</div>
      <div id="billRows"></div>
    </div>

    <!-- 联动卡(回执按钮 · 预告式:点击复制联动 prompt → AI 调目标技能) -->
    <div class="link-card">
      <h2 id="linkTitle">要同步到目标技能吗?</h2>
      <div class="sub" id="linkSub">点击下方按钮,复制联动指令发给 AI 即可(可选,只记账也 OK)</div>
      <div class="link-fields" id="linkFields"></div>
      <button class="link-btn" id="linkBtn">🔗 同时录入居家管家</button>
      <div class="link-hint" id="linkHint">复制后粘贴给 AI → AI 自动加载目标技能</div>
    </div>
  </main>

  <!-- 动作区(08 §2 底部右对齐 · 回执带撤销) -->
  <div class="actions">
    <button class="btn danger" id="undoBtn">↩ 撤销这笔</button>
    <button class="btn-main" id="copyDataBtn">复制数据</button>
    <button class="btn" id="copyLogBtn">🛠 复制日志</button>
  </div>

  <script id="payload" type="application/json"><!--INJECT-DATA--></script>

  <div class="toast" id="toast">
    <div class="toast-title">已复制 <em id="toastFmt" style="font-style:normal;color:#34c759;font-weight:600"></em></div>
    <div class="toast-detail" id="toastDetail"></div>
    <button class="toast-close" id="toastClose">✓ 知道了</button>
  </div>
</div>

<script>
(function () {
  'use strict';
  var esc = function (s) { return String(s ?? '').replace(/[&<>"']/g, function (c) { return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]); }); };

  var payload;
  try { payload = JSON.parse(document.getElementById('payload').textContent); } catch (e) { return; }
  if (!payload || payload.status !== 'ok') return;
  var d = payload.data || {};
  var meta = d.meta || {};
  var rc = d.receipt || {};
  var bill = rc.bill || {};
  var link = rc.link || {};
  var undo = rc.undo || {};
  var WAKE = meta.wake_word || '买东西';
  var TARGET = link.target || '';
  var KEY = rc.key || {};

  document.getElementById('eyebrow').textContent = '饼干记账 · 联动回执';
  document.getElementById('title').textContent = d.title || '联动回执';
  document.getElementById('chips').innerHTML =
    '<span class="chip">⚡ ' + esc(WAKE) + '</span>' +
    '<span class="chip done-chip">● 已完成</span>' +
    '<span class="chip">🕒 ' + esc(d.generated_at || '') + '</span>';

  // ── 已记录账单 ──
  function row(k, v, cls) {
    var val = v || '';
    var css = 'v' + (cls ? ' ' + cls : '') + (val ? '' : ' empty');
    var disp = val ? esc(val) : '未填写';
    return '<div class="row"><span class="k">' + esc(k) + '</span><span class="' + css + '">' + disp + '</span></div>';
  }
  document.getElementById('billRows').innerHTML =
    row('ID', bill.id) +
    row('金额', bill.amount_sign, 'amt') +
    row('分类', bill.category) +
    row('账户', bill.account) +
    row('账本', bill.ledger) +
    row('时间', bill.time) +
    row('备注', bill.note);

  // ── 联动卡 ──
  var keyVals = [];
  for (var kk in KEY) keyVals.push(String(KEY[kk] || ''));
  var keyTxt = keyVals.join(' ');
  document.getElementById('linkTitle').textContent =
    (keyTxt ? '要把「' + keyTxt + '」也同步到' : '要把这笔也同步到') + (TARGET || '目标技能') + '吗?';
  document.getElementById('linkFields').innerHTML = (link.fields || []).map(function (f) {
    return row(f.label, f.value, f.value ? '' : 'empty');
  }).join('');
  document.getElementById('linkBtn').textContent = '🔗 ' + (link.button || '同时录入');
  document.getElementById('linkHint').textContent =
    '复制后粘贴给 AI → AI 加载「' + TARGET + '」技能执行' + (link.wake_word || '');

  // ── 复制 ──
  var toastTimer = null;
  function showToast(fmt, detail) {
    var detailMap = { prompt: detail || '粘贴给 AI 即可', data: '粘贴到聊天/笔记', log: '发给开发者排障' };
    document.getElementById('toastFmt').textContent = fmt === 'log' ? '日志' : fmt.toUpperCase();
    document.getElementById('toastDetail').textContent = detailMap[fmt] || '';
    document.getElementById('toast').classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { document.getElementById('toast').classList.remove('show'); }, 4500);
  }
  function doCopy(text, fmt, detail) {
    function done() { showToast(fmt, detail); }
    function fb() { var t = document.createElement('textarea'); t.value = text; document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove(); done(); }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done).catch(fb);
    else fb();
  }

  // 联动按钮(预告式:复制联动 prompt → AI 调目标技能)
  document.getElementById('linkBtn').onclick = function () {
    doCopy(link.prompt || '', 'prompt', '粘贴给 AI 即可联动' + (TARGET || '目标技能'));
  };
  // 撤销(回执契约:成功回执带撤销)
  document.getElementById('undoBtn').onclick = function () {
    doCopy(undo.prompt || '', 'prompt', '粘贴给 AI 即可撤销这笔');
  };
  document.getElementById('copyDataBtn').onclick = function () {
    var data = { scene_id: meta.scene_id || '', command_cn: meta.command_cn || '', occurred_at: d.generated_at || '',
      target: '账单 ID=' + (bill.id || ''), payload: { bill: bill, link: { target: TARGET, button: link.button, prompt: link.prompt } } };
    doCopy(JSON.stringify(data, null, 2), 'data');
  };
  document.getElementById('copyLogBtn').onclick = function () {
    var lines = [];
    lines.push('① 场景标识');
    lines.push('  command_cn: ' + (meta.command_cn || '联动回执'));
    lines.push('  唤醒词: ' + WAKE);
    lines.push('  场景名: ' + (d.title || ''));
    lines.push('');
    lines.push('② AI 思考链: 联动采集确认 → write add 记支出 → 回执渲染(带联动按钮)');
    lines.push('');
    lines.push('③ 底层数据结构');
    lines.push('  bill: ' + JSON.stringify(bill));
    lines.push('  link: ' + JSON.stringify({ target: TARGET, button: link.button, prompt: link.prompt }));
    lines.push('  DB 操作: INSERT bills(已由 write add 执行)');
    lines.push('');
    lines.push('④ 调用链');
    lines.push('  渲染脚本: ' + (meta.render_cmd || '(未知)'));
    lines.push('');
    lines.push('⑤ 时间戳 + 版本');
    lines.push('  本地时间: ' + (d.generated_at || '(未知)'));
    lines.push('  skill 版本: ' + (meta.version || '(未知)'));
    lines.push('');
    lines.push('⑥ 异常信息: 无');
    doCopy(lines.join('\n'), 'log');
  };
  document.getElementById('toastClose').onclick = function () {
    document.getElementById('toast').classList.remove('show');
    clearTimeout(toastTimer);
  };
})();
</script>
</body>
</html>
