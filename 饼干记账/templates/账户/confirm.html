<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>饼干记账 · 改账户确认</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --bg:#f5f5f7; --card:#fff; --line:#e5e5ea; --fg:#1d1d1f; --fg2:#6e6e73; --fg3:#86868b; --blue:#007aff; --blue2:#0a63ce; --green:#34c759; --soft:#f5f8ff; --shadow:0 1px 3px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.05); }
  body { font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--fg); line-height:1.6; -webkit-font-smoothing:antialiased; padding:0 0 90px; }
  .wrap { max-width:640px; margin:0 auto; padding:24px 16px; }
  .header { padding:6px 0 18px; }
  .eyebrow { font-size:12px; color:var(--fg3); font-weight:600; letter-spacing:.06em; margin-bottom:6px; }
  h1 { font-size:27px; font-weight:700; letter-spacing:-.02em; }
  .chips { display:flex; gap:8px; margin-top:8px; flex-wrap:wrap; }
  .chip { font-size:11.5px; font-weight:600; padding:3px 10px; border-radius:999px; background:var(--soft); color:var(--blue2); border:1px solid #d7e6ff; }
  .card { background:var(--card); border-radius:16px; box-shadow:var(--shadow); padding:18px 20px; margin-bottom:14px; }
  .card h2 { font-size:14.5px; font-weight:700; margin-bottom:10px; }
  .orig { background:#f8f8fa; border-radius:12px; padding:12px 14px; font-size:13px; }
  .orig .row { display:flex; gap:8px; padding:2px 0; }
  .orig .k { color:var(--fg3); min-width:52px; font-size:12px; }
  table { width:100%; border-collapse:collapse; font-size:13.5px; }
  th { text-align:left; font-size:11px; color:var(--fg3); font-weight:600; padding:7px 8px; border-bottom:1px solid var(--line); }
  td { padding:8px; border-bottom:1px dashed var(--line); }
  .old { color:var(--fg3); text-decoration:line-through; }
  .new { color:var(--blue); font-weight:700; }
  .tip { font-size:12px; color:var(--fg3); margin-top:8px; }
  .actions { display:flex; justify-content:flex-end; gap:8px; margin:4px 0 16px; }
  .actions .btn-main, .actions .btn { flex:1; min-width:0; justify-content:center; }
  .btn-main { display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line); background:#fff; color:var(--fg); border-radius:999px; padding:10px 18px; font-size:14px; font-weight:600; cursor:pointer; font-family:inherit; transition:background .15s; }
  .btn-main:hover { background:var(--bg); }
  .btn { display:inline-flex; align-items:center; justify-content:center; border:1px solid var(--line); background:#fff; color:var(--fg); border-radius:999px; padding:10px 18px; font-size:14px; font-weight:600; cursor:pointer; font-family:inherit; }
  .btn:hover { background:var(--bg); }
  /* #300 Base 统一:复制/提示全部走公共组件 */
  @media (max-width:640px) { .wrap { padding:18px 12px 70px; } h1 { font-size:23px; } .actions .btn-main, .actions .btn { font-size:12.5px; padding:9px 8px; white-space:nowrap; } }
</style>
<style><!--SHARED-CSS--></style>
</head>
<body>
<div class="wrap">
  <header class="header">
    <div class="eyebrow">饼干记账 · 账户管理</div>
    <h1>修改账户</h1>
    <div class="chips" id="chips"></div>
  </header>

  <main>
    <div class="card">
      <h2>原账户</h2>
      <div class="orig" id="orig"></div>
    </div>

    <div class="card">
      <h2>待修改</h2>
      <table>
        <thead><tr><th>字段</th><th>原值</th><th>新值</th></tr></thead>
        <tbody id="diff"></tbody>
      </table>
      <div class="tip" id="tip">执行后历史流水保留;改名会同步更新该账户的历史记录。</div>
    </div>
  </main>

  <div class="actions">
    <button class="btn-main" id="copyPromptBtn">📋 确认</button>
  </div>
  <div id="actionbar-zone"></div>

  <script id="payload" type="application/json"><!--INJECT-DATA--></script><script><!--SHARED-HELPERS--></script>

</div>

<script>
(function () {
  'use strict';
  var esc = function (s) { return String(s ?? '').replace(/[&<>"']/g, function (c) { return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]); }); };
  var payload;
  try { payload = JSON.parse(document.getElementById('payload').textContent); } catch (e) { return; }
  if (!payload || payload.status !== 'ok') return;
  var d = payload.data || {};
  var meta = d.meta || {};
  var form = d.form || {};
  var acct = form.account || {};
  var changes = form.changes || [];

  document.getElementById('chips').innerHTML =
    '<span class="chip">⚡ ' + esc(meta.wake_word || '改账户') + '</span>' +
    '<span class="chip">● diff 确认</span>' +
    '<span class="chip">🕒 ' + esc(d.generated_at || '') + '</span>';

  document.getElementById('orig').innerHTML = [
    ['账户名', acct.name], ['类型', acct.type || '—'],
    ['状态', acct.disabled ? '已停用' : '使用中'],
  ].map(function (r) {
    return '<div class="row"><span class="k">' + esc(r[0]) + '</span><span>' + esc(String(r[1])) + '</span></div>';
  }).join('');

  document.getElementById('diff').innerHTML = changes.map(function (c) {
    return '<tr><td>' + esc(c.field) + '</td><td class="old">' + esc(c.old) + '</td><td class="new">' + esc(c.new) + '</td></tr>';
  }).join('');

  // 确认 prompt(对齐 scenes/account.yaml 账户-2-1)
  function buildPrompt() {
    var lines = [];
    lines.push('请加载「饼干记账」技能,帮我修改账户(唤醒词:改账户):');
    lines.push('');
    lines.push('  账\u2003户: ' + acct.name);
    lines.push('  改成什么:');
    changes.forEach(function (c) {
      lines.push('  ' + c.field + ': ' + c.old + ' → ' + c.new);
    });
    return lines.join('\n');
  }

  // ── #300 Base 统一:复制/提示走公共组件 ──
  document.getElementById('copyPromptBtn').onclick = function () { window.copyText(buildPrompt()); };

  if (window.actionBar) {
    var abPayload = (payload.data && payload.data.scene) ? payload : {
      status: 'error', message: '数据未注入',
      data: { meta: { command_cn: '操作失败', occurred_at: '' },
              scene: { snapshot: { title: '操作失败', summary: ['数据未注入'], sections: [] } } },
    };
    var abZone = document.getElementById('actionbar-zone');
    if (abZone) abZone.innerHTML = window.actionBar(abPayload);
  }
})();
</script>
</body>
</html>
