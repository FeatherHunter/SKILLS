<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>饼干记账 · 账户转账</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --bg:#f5f5f7; --card:#fff; --line:#e5e5ea; --fg:#1d1d1f; --fg2:#6e6e73; --fg3:#86868b; --blue:#007aff; --blue2:#0a63ce; --green:#34c759; --orange:#ff9500; --soft:#f5f8ff; --shadow:0 1px 3px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.05); }
  body { font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--fg); line-height:1.6; -webkit-font-smoothing:antialiased; padding:0 0 90px; }
  .wrap { max-width:640px; margin:0 auto; padding:24px 16px; }
  .header { padding:6px 0 18px; }
  .eyebrow { font-size:12px; color:var(--fg3); font-weight:600; letter-spacing:.06em; margin-bottom:6px; }
  h1 { font-size:27px; font-weight:700; letter-spacing:-.02em; line-height:1.25; }
  .chips { display:flex; gap:8px; margin-top:8px; flex-wrap:wrap; }
  .chip { font-size:11.5px; font-weight:600; padding:3px 10px; border-radius:999px; background:var(--soft); color:var(--blue2); border:1px solid #d7e6ff; }
  .note { background:#fff7e8; border:1px solid #ffe3b3; border-radius:12px; padding:11px 14px; font-size:13px; color:#8a5a00; margin-bottom:12px; }
  .card { background:var(--card); border-radius:16px; box-shadow:var(--shadow); padding:18px 20px; margin-bottom:14px; }
  label.field { display:block; font-size:12px; font-weight:600; color:var(--fg2); margin:14px 0 5px; }
  label.field:first-child { margin-top:0; }
  input[type=text], input[type=number] { width:100%; border:1px solid var(--line); border-radius:10px; padding:9px 12px; font-size:14px; font-family:inherit; background:#fff; outline:none; transition:border .15s, box-shadow .15s; }
  input:focus { border-color:var(--blue); box-shadow:0 0 0 3px rgba(0,122,255,.12); }
  input.amount { font-size:26px; font-weight:700; padding:12px 14px; font-variant-numeric:tabular-nums; }
  .prefix { position:relative; }
  .prefix input { padding-left:34px; }
  .prefix .cur { position:absolute; left:14px; top:50%; transform:translateY(-50%); color:var(--fg3); font-size:15px; font-weight:600; }
  .hint { font-size:11.5px; color:var(--fg3); margin-top:4px; }
  .sugg { display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; }
  .sugg-btn { border:1.5px solid var(--line); background:#fff; border-radius:999px; padding:6px 13px; font-size:13px; font-weight:600; cursor:pointer; font-family:inherit; transition:all .15s; }
  .sugg-btn:hover { border-color:var(--blue); }
  .sugg-btn.sel { border-color:var(--blue); background:var(--soft); }
  .sugg-btn.off { opacity:.45; text-decoration:line-through; }
  .actions { display:flex; justify-content:flex-end; gap:8px; margin:4px 0 16px; }
  .actions .btn-main, .actions .btn { flex:1; min-width:0; justify-content:center; }
  .btn-main { display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line); background:#fff; color:var(--fg); border-radius:999px; padding:10px 18px; font-size:14px; font-weight:600; cursor:pointer; font-family:inherit; transition:background .15s; }
  .btn-main:hover { background:var(--bg); }
  .btn { display:inline-flex; align-items:center; justify-content:center; border:1px solid var(--line); background:#fff; color:var(--fg); border-radius:999px; padding:10px 18px; font-size:14px; font-weight:600; cursor:pointer; font-family:inherit; }
  .btn:hover { background:var(--bg); }
  /* #300 Base 统一:复制/提示全部走公共组件 */
  @media (max-width:640px) { .wrap { padding:18px 12px 70px; } h1 { font-size:23px; } .actions .btn-main, .actions .btn { font-size:12.5px; padding:9px 8px; white-space:nowrap; } }
</style>
<style><!--SHARED-CSS--></style>
</head>
<body>
<div class="wrap">
  <header class="header">
    <div class="eyebrow">饼干记账 · 账户管理</div>
    <h1>账户间转账</h1>
    <div class="chips" id="chips"></div>
  </header>

  <main>
    <div class="note">💰 转账 = 钱从 A 账户移到 B 账户,<b>不影响收支统计</b>(余额会正确增减)</div>

    <div class="card">
      <label class="field">金额(元)</label>
      <div class="prefix"><span class="cur">¥</span><input type="number" step="0.01" class="amount" id="fAmount" placeholder="0.00"></div>

      <label class="field">从账户</label>
      <input type="text" id="fFrom" placeholder="如:支付宝">
      <div class="sugg" id="fromSugg"></div>

      <label class="field">到账户</label>
      <input type="text" id="fTo" placeholder="如:招行卡">
      <div class="sugg" id="toSugg"></div>

      <label class="field">时间(选填,默认现在)</label>
      <input type="text" id="fTime" placeholder="如:2026-08-09 12:00:00 / 昨天">
    </div>
  </main>

  <div class="actions">
    <button class="btn-main" id="copyPromptBtn">📋 确认</button>
  </div>
  <div id="actionbar-zone"></div>

  <script id="payload" type="application/json"><!--INJECT-DATA--></script><script><!--SHARED-HELPERS--></script>

</div>

<script>
(function () {
  'use strict';
  var esc = function (s) { return String(s ?? '').replace(/[&<>"']/g, function (c) { return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]); }); };
  var payload;
  try { payload = JSON.parse(document.getElementById('payload').textContent); } catch (e) { return; }
  if (!payload || payload.status !== 'ok') return;
  var d = payload.data || {};
  var meta = d.meta || {};
  var form = d.form || {};

  document.getElementById('chips').innerHTML =
    '<span class="chip">⚡ ' + esc(meta.wake_word || '账户转账') + '</span>' +
    '<span class="chip">● 填写确认</span>' +
    '<span class="chip">🕒 ' + esc(d.generated_at || '') + '</span>';

  var elAmount = document.getElementById('fAmount');
  var elFrom = document.getElementById('fFrom');
  var elTo = document.getElementById('fTo');
  var elTime = document.getElementById('fTime');
  elAmount.value = form.amount || '';
  elFrom.value = form.from || '';
  elTo.value = form.to || '';
  elTime.value = form.time || '';

  // 账户建议点选(从/到 各一排)
  var accounts = form.accounts || [];
  function renderSugg(containerId, inputEl) {
    var box = document.getElementById(containerId);
    if (!accounts.length) { box.innerHTML = '<div class="hint">账户表为空,可直接手填(或用「新增账户」登记)</div>'; return; }
    box.innerHTML = accounts.map(function (a) {
      var off = a.disabled ? ' off' : '';
      return '<button class="sugg-btn' + off + '" data-name="' + esc(a.name) + '">' + esc(a.name) + '</button>';
    }).join('');
    box.querySelectorAll('.sugg-btn').forEach(function (b) {
      b.onclick = function () {
        inputEl.value = this.getAttribute('data-name');
        box.querySelectorAll('.sugg-btn').forEach(function (x) { x.classList.remove('sel'); });
        this.classList.add('sel');
      };
    });
  }
  renderSugg('fromSugg', elFrom);
  renderSugg('toSugg', elTo);

  // 确认 prompt(对齐 scenes/account.yaml 账户-3-1)
  function buildPrompt() {
    var lines = [];
    lines.push('请加载「饼干记账」技能,帮我做账户间转账(唤醒词:账户转账):');
    lines.push('');
    lines.push('  金\u2003额: ' + (elAmount.value || '____'));
    lines.push('  从账户: ' + (elFrom.value || '____'));
    lines.push('  到账户: ' + (elTo.value || '____'));
    lines.push('  时\u2003间: ' + (elTime.value || '____ (选填,默认现在)'));
    return lines.join('\n');
  }

  // ── #300 Base 统一:复制/提示走公共组件 ──
  document.getElementById('copyPromptBtn').onclick = function () { window.copyText(buildPrompt()); };

  if (window.actionBar) {
    var abPayload = (payload.data && payload.data.scene) ? payload : {
      status: 'error', message: '数据未注入',
      data: { meta: { command_cn: '操作失败', occurred_at: '' },
              scene: { snapshot: { title: '操作失败', summary: ['数据未注入'], sections: [] } } },
    };
    var abZone = document.getElementById('actionbar-zone');
    if (abZone) abZone.innerHTML = window.actionBar(abPayload);
  }
})();
</script>
</body>
</html>
