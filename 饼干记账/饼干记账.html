<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HELP 原型 · V4 三级目录版</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  :root{--fg:#1d1d1f;--fg2:#6e6e73;--fg3:#86868b;--bg:#f2f2f7;--card:#fff;--line:#d1d1d6;--blue:#007aff;--blue2:#0a63ce;--soft:#f0f6ff;--ok:#34c759;--orange:#ff9500;--red:#ff3b30;--shadow:0 1px 2px rgba(0,0,0,.04),0 4px 14px rgba(0,0,0,.05)}
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--fg);line-height:1.5;-webkit-font-smoothing:antialiased;font-size:14px}
  button{font-family:inherit}
  .stage{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:24px 16px 60px;background:var(--bg)}
  .stage-title{color:#3a3a3c;font-size:15px;font-weight:700;text-align:center}
  .stage-sub{color:#6e6e73;font-size:12px;text-align:center;margin:3px 0 14px}
  .phone{width:680px;max-width:100%;height:auto;background:transparent;border-radius:0;border:0;overflow:visible;position:relative;box-shadow:none}
  .screen{height:auto;overflow:visible;-webkit-overflow-scrolling:touch;background:transparent;scrollbar-width:none;overscroll-behavior-y:auto}
  .screen::-webkit-scrollbar{display:none}
  .notch{display:none}
  .app{padding:12px 0 74px}
  .app-inner{padding:0 6px}
  .hero{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:8px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .h-left{flex:1;min-width:0}
  .eyebrow{font-size:9px;color:var(--blue);font-weight:800;letter-spacing:.07em;text-transform:uppercase}
  h1{font-size:19px;line-height:1.15;letter-spacing:-.02em}
  .lead{color:var(--fg2);font-size:11.5px}
  .hero-steps{display:flex;align-items:center;gap:4px;flex-basis:100%;margin-top:6px}
  .hero-steps .step{background:var(--soft);border:1px solid #d7e6ff;color:var(--blue2);font-weight:700;font-size:10.5px;padding:3px 10px;border-radius:999px;white-space:nowrap}
  .hero-steps .arrow{color:var(--blue);font-weight:800;font-size:11px}
  .h-badge{background:var(--soft);border:1px solid #d7e6ff;color:var(--blue2);font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap;flex-shrink:0}
  /* ===== D4 首次使用横幅（可配 · 未初始化时显示 · 可手动关闭）===== */
  .init-banner{background:linear-gradient(135deg,#0a63ce,#007aff 55%,#34c759);color:#fff;border-radius:12px;padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:relative}
  .init-banner .ib-text{flex:1;min-width:200px;padding-right:26px}
  .init-banner .ib-title{font-size:14px;font-weight:800;margin-bottom:2px}
  .init-banner .ib-sub{font-size:11.5px;opacity:.9;line-height:1.5}
  .init-banner .copy-btn{background:#fff;color:var(--blue);min-height:30px;font-weight:700;border-radius:999px;padding:0 11px;font-size:11.5px;flex-shrink:0;margin-right:26px}
  .init-banner .ib-close{position:absolute;top:8px;right:8px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(255,255,255,.22);color:#fff;font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1;flex-shrink:0}
  /* 初始化步骤卡（可选 · 技能传 steps 显示 · >4 步横向滑动）*/
  .init-steps{display:flex;gap:6px;flex-basis:100%;margin-top:4px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding-bottom:2px}
  .init-steps::-webkit-scrollbar{display:none}
  .init-step{flex:0 0 calc(25% - 4.5px);background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);border-radius:10px;padding:7px 5px;text-align:center;min-width:0}
  .init-step .s-n{width:20px;height:20px;border-radius:50%;background:#fff;color:var(--blue2);font-weight:800;font-size:10px;display:flex;align-items:center;justify-content:center;margin:0 auto 4px}
  .init-step .s-t{font-size:9.5px;font-weight:700;color:#fff;line-height:1.3;word-break:break-all}
  .init-step .s-d{font-size:8px;color:rgba(255,255,255,.75);margin-top:1px;line-height:1.3;word-break:break-all}
  /* ===== 关于 Tab（最后 · 域概览 + 联系作者 + 版本）===== */
  .about-sec{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:8px;overflow:hidden}
  .about-sec .as-head{padding:9px 12px;font-size:13px;font-weight:800;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:7px}
  .about-sec .as-body{padding:4px 12px 8px}
  .about-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:12.5px}
  .about-row:last-child{border-bottom:0}
  .about-row .a-ico{width:30px;height:30px;border-radius:9px;background:var(--soft);color:var(--blue2);display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
  .about-row .a-ico svg{width:17px;height:17px;display:block}
  .about-row .a-t{flex:1;min-width:0}
  .about-row .a-t b{font-size:12.5px;display:block}
  .about-row .a-t span{font-size:10.5px;color:var(--fg3)}
  .about-row .a-badge{font-size:9.5px;color:var(--fg3);background:var(--bg);border-radius:999px;padding:1px 8px;flex-shrink:0}
  .about-row .a-link{color:var(--blue);font-size:10.5px;word-break:break-all}
  .about-row .a-copy{min-height:28px;padding:0 10px;font-size:10.5px;border-radius:8px;flex-shrink:0}
  /* ===== D4 联系作者（可配）===== */
  .contact-box{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-top:10px;overflow:hidden}
  .contact-box>summary{min-height:44px;padding:0 13px;cursor:pointer;font-size:13.5px;font-weight:700;list-style:none;display:flex;align-items:center;gap:8px;user-select:none}
  .contact-box>summary::-webkit-details-marker{display:none}
  .contact-box>summary::before{content:"▸";font-size:11px;color:var(--fg3);transition:transform .15s;flex-shrink:0}
  .contact-box[open]>summary::before{transform:rotate(90deg);color:var(--blue)}
  .contact-body{padding:4px 13px 12px}
  .contact-item{display:flex;gap:10px;align-items:center;font-size:12.5px;color:var(--fg2);padding:7px 0;border-bottom:1px dashed var(--line)}
  .contact-item:last-child{border-bottom:0}
  .contact-item .k{font-weight:700;color:var(--fg);min-width:64px;flex-shrink:0}
  .contact-item a{color:var(--blue);text-decoration:none;word-break:break-all}
  .contact-copy{margin-top:10px}
  .search-wrap{position:sticky;top:0;z-index:400;background:rgba(242,242,247,.92);-webkit-backdrop-filter:saturate(180%) blur(14px);backdrop-filter:saturate(180%) blur(14px);padding:5px 0;margin-bottom:2px}
  .search-box{position:relative}
  .search-box input{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 34px 9px 34px;font-size:13.5px;background:#fff;outline:none}
  .search-box input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(0,122,255,.13)}
  .s-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);font-size:13px;color:var(--fg3);pointer-events:none}
  .s-clear{position:absolute;right:9px;top:50%;transform:translateY(-50%);width:20px;height:20px;border-radius:50%;border:0;background:var(--bg);color:var(--fg3);font-size:12px;cursor:pointer;display:none;align-items:center;justify-content:center;line-height:1}
  .hitcount{font-size:11px;color:var(--fg2);margin-bottom:5px;text-align:center}
  .search-empty{background:var(--card);border:1.5px dashed var(--line);border-radius:12px;padding:20px 12px;text-align:center;color:var(--fg3);font-size:12.5px}
  .chip{display:inline-block;background:var(--soft);color:var(--blue2);padding:1px 7px 1px 0;border-radius:999px;font-size:9.5px;font-weight:700;flex-shrink:0;line-height:1.55}
  .type-badge{display:inline-block;padding:1px 7px;border-radius:999px;font-size:9px;font-weight:700;flex-shrink:0;background:#e9e9ee;color:#666;line-height:1.55}
  .t-view{background:#e8f2ff;color:#0a63ce}
  .t-wizard{background:#e2f7f5;color:#00897b}
  .t-collect{background:#e7f8ee;color:#1a7a3a}
  .t-result{background:#e8f2ff;color:#0a63ce}
  .t-batch{background:#f3e9fb;color:#8e3fc9}
  .t-dev{background:#fff1e2;color:#b25b00}
  .copy-btn{display:inline-flex;align-items:center;justify-content:center;border:0;background:var(--blue);color:#fff;border-radius:8px;padding:0 9px;font-size:11.5px;font-weight:600;cursor:pointer;white-space:nowrap;flex-shrink:0;min-height:36px;transition:background .12s}
  .copy-btn:active{background:var(--blue2)}
  .copy-btn.ghost{background:#fff;color:var(--blue);border:1px solid var(--blue)}
  mark{background:#ffe08a;border-radius:3px;padding:0 1px;color:inherit}

  /* ===== 横向滑动容器（ViewPager）===== */
  .pages{display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;scrollbar-width:none;scroll-behavior:smooth;align-items:flex-start}
  .pages::-webkit-scrollbar{display:none}
  .page{flex:0 0 100%;scroll-snap-align:start}

  /* ===== 二级：子功能折叠组 ===== */
  .page{display:flex;flex-direction:column}
  .subgroup{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:8px;overflow:hidden;display:flex;flex-direction:column}
  .subgroup>summary{min-height:44px;padding:0 12px;display:flex;align-items:center;gap:8px;list-style:none;cursor:pointer;font-size:13.5px;font-weight:700;user-select:none;flex-shrink:0}
  .subgroup>summary::-webkit-details-marker{display:none}
  .subgroup>summary::before{content:"▸";font-size:11px;color:var(--fg3);transition:transform .15s;flex-shrink:0}
  .subgroup[open]>summary::before{transform:rotate(90deg);color:var(--blue)}
  .subgroup .sg-count{font-size:10px;color:var(--fg3);font-weight:600;margin-left:auto;background:var(--bg);border-radius:999px;padding:1px 8px}
  .subgroup .sg-body{padding:7px 8px 9px;display:flex;flex-direction:column;flex:1;min-height:0}
  .subgroup:not([open]) .sg-body{display:none}

  /* ===== 三级：2 列场景卡片 ===== */
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
  .mini{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:9px;display:flex;flex-direction:column;gap:6px;cursor:pointer;box-shadow:none;transition:transform .08s;min-width:0;overflow:hidden}
  .mini:active{transform:scale(.985);background:#eaeaef}
  .mini .m-top{display:flex;align-items:center;justify-content:flex-end;gap:2px;min-height:18px;flex-wrap:wrap}
  .mini .m-top .chip{max-width:65%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex-shrink:0;margin-right:auto}
  .mini .m-top .type-badge{flex-shrink:0;white-space:nowrap}
  .mini .m-bottom{display:flex;align-items:center;gap:8px;min-width:0}
  .mini .m-name{flex:1;min-width:0;font-size:12.5px;font-weight:700;line-height:1.35;word-break:break-all;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .mini .copy-btn{min-height:26px;padding:0 9px;font-size:11px;border-radius:9px;flex-shrink:0}

  /* ===== 底部 Tab（可横向滑动）===== */
  .tab-bar{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.94);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:1px solid var(--line);display:flex;z-index:600;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0));gap:6px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;touch-action:pan-x}
  /* 宽屏: Tab 栏宽度对齐主体内容区（居中限宽, 不横跨全屏）; 手机端保持全宽（见 media query）*/
  @media(min-width:501px){
    .tab-bar{width:680px;max-width:100%;left:50%;transform:translateX(-50%);border-left:1px solid var(--line);border-right:1px solid var(--line);border-radius:0}
  }
  .tab-bar::-webkit-scrollbar{display:none}
  .tab{flex:0 0 auto;min-width:66px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 10px 4px;cursor:pointer;font-size:10px;color:var(--fg3);font-weight:600;min-height:54px;justify-content:center;border:0;background:none;border-radius:14px;transition:background .08s,color .08s,box-shadow .08s;white-space:nowrap}
  .tab .t-ico{width:22px;height:22px;display:flex;align-items:center;justify-content:center;line-height:1}
  .tab .t-ico svg{width:20px;height:20px;display:block}
  .tab .t-ico .t-emoji{font-size:16px;line-height:1}
  .tab.active{background:var(--blue);color:#fff;box-shadow:0 4px 12px rgba(0,122,255,.3)}
  .tab.active .t-ico{transform:scale(1.05)}

  /* ===== Sheet 弹层（高度自适应内容 · 不满屏不滚动）===== */
  .sheet-mask{position:fixed;left:8px;right:8px;top:8px;bottom:8px;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .25s;z-index:900;border-radius:36px}
  .sheet-mask.show{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:8px;right:8px;bottom:8px;background:var(--card);border-radius:22px 22px 36px 36px;padding:10px 16px calc(8px + env(safe-area-inset-bottom,0));transform:translateY(105%);transition:transform .32s cubic-bezier(.32,.72,.24,1);z-index:901;max-height:82%;display:flex;flex-direction:column;box-shadow:0 -8px 40px rgba(0,0,0,.25)}
  .sheet.show{transform:translateY(0)}
  .sheet .grip{width:38px;height:4.5px;border-radius:999px;background:var(--line);margin:0 auto 12px;flex-shrink:0}
  .sheet .s-scroll{overflow-y:auto;flex:1;min-height:0;scrollbar-width:none;padding-bottom:66px}
  .sheet .s-scroll::-webkit-scrollbar{display:none}
  .sheet .s-head{display:flex;align-items:center;gap:3.5px;flex-wrap:wrap;margin-bottom:4px}
  .sheet .s-title{font-size:17px;font-weight:700;flex-basis:100%;line-height:1.3}
  .sheet .s-close{position:absolute;top:16px;right:16px;width:30px;height:30px;border-radius:50%;border:0;background:var(--bg);color:var(--fg3);font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .sheet .prompt-box{background:#1d1d1d;color:#f5f5f7;border-radius:12px;padding:11px 13px;white-space:pre-wrap;font-family:ui-monospace,Menlo,monospace;font-size:12px;line-height:1.65;margin-top:9px;word-break:break-all}
  .sheet .pform{margin-top:9px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:9px 10px}
  .sheet .pfield{display:flex;align-items:center;gap:7px;margin-bottom:7px}
  .sheet .pfield:last-of-type{margin-bottom:0}
  .sheet .pfield label{font-size:12px;color:var(--fg2);font-weight:600;flex-shrink:0;min-width:72px}
  .sheet .pfield label em{color:var(--fg3);font-weight:400;font-size:9px}
  .sheet .pfield input{flex:1;min-width:0;border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:13px;background:#fff;outline:none;font-family:inherit;color:var(--fg)}
  .sheet .pfield input:focus{border-color:var(--blue);box-shadow:0 0 0 2px rgba(0,122,255,.12)}
  /* 未填时：灰淡背景 + 提示文字（placeholder 由技能方提供）*/
  .sheet .pfield input:placeholder-shown{background:#f2f2f4;border-color:#e0e0e4;color:#8e8e93}
  .sheet .pfield input:placeholder-shown:focus{background:#fff;border-color:var(--blue)}
  .sheet .pprev{margin-top:9px;background:#1d1d1d;color:#f5f5f7;border-radius:12px;padding:11px 13px;font-size:12px;line-height:1.65;word-break:break-all;white-space:pre-wrap;font-family:ui-monospace,Menlo,monospace}
  .sheet .pprev .pv-label{font-size:9px;color:#8e8e93;display:block;letter-spacing:.05em;margin-bottom:4px}
  .sheet .s-actions{position:absolute;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0));display:flex;gap:8px;flex-shrink:0}
  .sheet .s-actions .copy-btn{flex:1;min-height:48px;font-size:13px;font-weight:600;border-radius:12px;background:var(--blue);color:#fff;border:0;box-shadow:none}
  @media(max-width:500px){
    body{background:var(--bg)}
    .stage{padding:0;background:var(--bg)}
    .stage-title,.stage-sub{display:none}
    .phone{width:100%;height:100vh;border:0;border-radius:0;max-height:none;background:var(--bg);overflow:hidden}
    .screen{height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--bg);overscroll-behavior-y:contain}
    .notch{display:none}
    .sheet-mask{left:0;right:0;top:0;bottom:0;border-radius:0}
    .sheet{left:0;right:0;bottom:0;border-radius:22px 22px 0 0}
  }
</style>
</head>
<body>

<div class="stage">
  <div class="stage-title">📱 HELP 原型 · V4 三级目录版（B1-B4 拍板全落地）</div>
  <div class="stage-sub">Tab→子功能折叠→场景卡 · 参数=prompt+key:value · 复制不自动关 · 无参数显prompt · 手机打开全屏真机</div>

  <div class="phone"><div class="notch"></div><div class="screen" id="screen"></div></div>

  <div class="sheet-mask" id="sheetMask"></div>
  <div class="sheet" id="sheet">
    <div class="grip"></div>
    <button class="s-close" id="sheetClose">✕</button>
    <div class="s-scroll">
      <div class="s-head" id="shHead"></div>
      <div id="shBody"></div>
    </div>
    <div class="s-actions">
      <button class="copy-btn" id="shCopy">复制</button>
    </div>
  </div>

  <div class="toast" id="toast" style="display:none"></div>
</div>

  var t = opts.toast || {}, okCfg = t.ok || {}, failCfg = t.fail || {};
  var okMsg = okCfg.msg !== undefined ? okCfg.msg : '已复制';
  var okDetail = okCfg.detail !== undefined ? okCfg.detail : '粘贴给 AI';
  var failMsg = failCfg.msg !== undefined ? failCfg.msg : '复制失败';
  var failDetail = failCfg.detail !== undefined ? failCfg.detail : '长按选择文本手动复制';
  function ok(){
    if(opts.onOk) opts.onOk();
    if(!opts.silent){
      var o = {};
      if(okCfg.icon) o.icon = okCfg.icon;
      toast(okMsg, okDetail, Object.keys(o).length ? o : undefined);
    }
  }
  function fail(){
    if(opts.onFail) opts.onFail();
    if(!opts.silent){
      var o = {badge:{text:'失败',type:'danger'}};
      if(failCfg.icon) o.icon = failCfg.icon;
      toast(failMsg, failDetail, o);
    }
  }
  if(navigator.clipboard&&navigator.clipboard.writeText){
    try{
      var pr=navigator.clipboard.writeText(s);
      if(pr&&pr.then){pr.then(function(){ok();}).catch(function(){_fbCopy(s)?ok():fail();});}
      else{ok();}
    }catch(e){_fbCopy(s)?ok():fail();}
  }else{_fbCopy(s)?ok():fail();}
}

/* ── toast 通用提示控件 v1.8（堆叠模式 · #304）──
 * toast(msg, detail?, options?)
 * options: { icon, badge:{text,type}, actions:[{label,onClick}], count, lines:[], code, timeout, maxStack }
 * 向后兼容: toast(msg, detail) = 等价 v1.1
 * 堆叠模式（v1.8 · #304 用户拍板）: 同屏最多 N 条同时可见（N 默认 5, opts.maxStack 可配,
 *   栈容量取栈内各 toast maxStack 最大值; ≤820px 视口自动收窄为 3）; 老上旧下（新 toast
 *   贴屏幕底部出现, 旧的向上顶, 间距 8px）; 超 N 挤掉最旧（FIFO）; 单条独立计时消失
 */
(function(){
  var stack = null;
  var styleInjected = false;
  var DEFAULT_MAX = 5;
  var MOBILE_MAX = 3;
  var ICONS = { copy:'📋', ok:'✅', warn:'⚠️', danger:'❌', info:'💡' };
  var CSS = '.hm-toast-stack{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0));transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;z-index:9999;pointer-events:none}.hm-toast{position:relative;transform:scale(.9);opacity:0;background:rgba(28,28,30,.94);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);color:#f0f0f0;border-radius:14px;padding:13px 14px 13px 16px;display:flex;align-items:flex-start;gap:12px;max-width:480px;min-width:300px;box-shadow:0 10px 32px rgba(0,0,0,.32),0 0 0 .5px rgba(255,255,255,.08) inset;pointer-events:none;transition:opacity .22s ease-out,transform .22s cubic-bezier(.34,1.56,.64,1)}.hm-toast.show{opacity:1;transform:scale(1);pointer-events:auto}.hm-toast-icon{font-size:20px;line-height:1;padding-top:1px;flex-shrink:0}.hm-toast-body{flex:1;min-width:0}.hm-toast-title-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.hm-toast-title{font-weight:600;font-size:12.5px;line-height:1.4;color:#fff;margin-bottom:2px}.hm-toast-detail{font-size:11px;line-height:1.5;color:#c8c8cc}.hm-toast-lines{font-size:11px;line-height:1.55;color:#c8c8cc}.hm-toast-code{background:rgba(0,0,0,.32);border-radius:8px;padding:8px 10px;font-size:10.5px;line-height:1.5;color:#aeb0b8;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre-wrap;margin-top:6px;max-height:140px;overflow:auto}.hm-toast-chip{font-size:10px;font-weight:700;padding:2px 8px;border-radius:999px;letter-spacing:.02em;flex-shrink:0}.hm-toast-chip.ok{background:rgba(52,199,89,.18);color:#4dd96b}.hm-toast-chip.warn{background:rgba(255,149,0,.18);color:#ffb340}.hm-toast-chip.danger{background:rgba(255,59,48,.18);color:#ff6961}.hm-toast-chip.gray{background:rgba(255,255,255,.12);color:#c8c8cc}.hm-toast-count{font-size:10px;font-weight:700;color:#c8c8cc;background:rgba(255,255,255,.08);padding:2px 8px;border-radius:6px;font-variant-numeric:tabular-nums;flex-shrink:0}.hm-toast-act{font-size:11px;font-weight:600;color:#4dd96b;border:none;background:none;cursor:pointer;padding:2px 4px;flex-shrink:0;font-family:inherit}.hm-toast-act:active{opacity:.7}.hm-toast-close{background:rgba(255,255,255,.10);color:#34c759;border:0;border-radius:8px;padding:5px 9px;font-size:10.5px;font-weight:500;font-family:inherit;cursor:pointer;white-space:nowrap;margin-left:6px;flex-shrink:0}.hm-toast-close:active{background:rgba(255,255,255,.2)}@media(max-width:820px){.hm-toast-stack{left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0));transform:none;align-items:stretch}.hm-toast{transform:scale(.95);max-width:none;min-width:0}.hm-toast.show{transform:scale(1)}}';

  function ensureStyle(){
    if(styleInjected) return;
    styleInjected = true;
    var st = document.createElement('style');
    st.id = 'hm-toast-style';
    st.textContent = CSS;
    document.head.appendChild(st);
  }

  function getStack(){
    if(!stack){
      stack = document.createElement('div');
      stack.id = 'hm-toast-stack';
      document.body.appendChild(stack);
    }
    return stack;
  }

  function isMobile(){
    return window.matchMedia('(max-width: 820px)').matches;
  }

  /* 栈容量 = 栈内各 toast maxStack 的最大值（空栈默认 5）; 移动端 ≤820px 收窄为 3 */
  function stackCap(){
    var cap = 0;
    if(stack) stack.querySelectorAll('.hm-toast').forEach(function(t){
      var m = parseInt(t.getAttribute('data-max')||DEFAULT_MAX, 10);
      if(m > cap) cap = m;
    });
    if(cap === 0) cap = DEFAULT_MAX;
    if(isMobile() && cap > MOBILE_MAX) cap = MOBILE_MAX;
    return cap;
  }

  /* 超 N 挤掉最旧（FIFO） */
  function evictOldest(){
    var cap = stackCap();
    while(stack.querySelectorAll('.hm-toast').length > cap){
      var oldest = stack.querySelector('.hm-toast');
      if(!oldest) break;
      clearTimeout(oldest._timer);
      oldest.remove();
    }
  }

  function dismiss(t){
    if(!t || !t.isConnected) return;
    clearTimeout(t._timer);
    t.classList.remove('show');
    setTimeout(function(){
      if(t.isConnected) t.remove();
    }, 250);
  }

  function show(item){
    var opts = item.opts;
    var container = getStack();
    ensureStyle();
    var msg = item.msg, detail = item.detail;
    var t = document.createElement('div');
    t.className = 'hm-toast';
    t.setAttribute('role','status');
    t.setAttribute('aria-live','polite');
    t.setAttribute('data-max', String(opts.maxStack || DEFAULT_MAX));
    var icon = ICONS[opts.icon] || opts.icon || '📋';
    var titleRow = '<span class="hm-toast-title">'+esc(msg)+'</span>';
    if(opts.badge){
      var b = opts.badge;
      var btype = ['ok','warn','danger'].indexOf(b.type)>=0 ? b.type : 'ok';
      titleRow += '<span class="hm-toast-chip '+btype+'">'+esc(b.text)+'</span>';
    }
    if(opts.count){
      titleRow += '<span class="hm-toast-count">'+esc(opts.count)+'</span>';
    }
    if(opts.actions && opts.actions.length){
      opts.actions.slice(0,2).forEach(function(a){
        titleRow += '<button class="hm-toast-act" data-act="'+esc(a.label)+'">'+esc(a.label)+'</button>';
      });
    }
    var bodyHtml = '<div class="hm-toast-title-row">'+titleRow+'</div>';
    if(detail){
      bodyHtml += '<div class="hm-toast-detail">'+esc(detail)+'</div>';
    }
    if(opts.lines && opts.lines.length){
      bodyHtml += '<div class="hm-toast-lines">'+opts.lines.map(function(l){return esc(l);}).join('<br>')+'</div>';
    }
    if(opts.code){
      bodyHtml += '<div class="hm-toast-code">'+esc(opts.code)+'</div>';
    }
    t.innerHTML = '<div class="hm-toast-icon">'+icon+'</div><div class="hm-toast-body">'+bodyHtml+'</div><button class="hm-toast-close">✓ 知道了</button>';
    container.appendChild(t);
    evictOldest();
    if(opts.actions && opts.actions.length){
      var actBtns = t.querySelectorAll('.hm-toast-act');
      opts.actions.slice(0,2).forEach(function(a, i){
        actBtns[i].addEventListener('click', function(){
          var f = a.onClick;
          dismiss(t);
          if(f) setTimeout(f, 0);
        });
      });
    }
    t.querySelector('.hm-toast-close').addEventListener('click', function(){ dismiss(t); });
    var timer = setTimeout(function(){ dismiss(t); }, opts.timeout || 4500);
    t._timer = timer;
    requestAnimationFrame(function(){ t.classList.add('show'); });
  }

  window.toast = function(msg, detail, options){
    options = options || {};
    show({ msg: msg, detail: detail || '', opts: options });
  };
  /* 清空栈（技能页面销毁/测试用）：移除当前全部显示 */
  window.__hmToastFlush = function(){
    if(!stack) return;
    stack.querySelectorAll('.hm-toast').forEach(function(t){ clearTimeout(t._timer); t.remove(); });
  };
})();

/* ── snapshot 结构校验（违规直接报错）── */
function _validateSnapshot(s){
  if(!s || typeof s !== 'object'){
    throw new Error('snapshot 违规: scene.snapshot 必须是对象');
  }
  if(typeof s.title !== 'string' || !s.title.trim()){
    throw new Error('snapshot 违规: title 必须是非空字符串');
  }
  if(!Array.isArray(s.summary)){
    throw new Error('snapshot 违规: summary 必须是数组');
  }
  if(!Array.isArray(s.sections)){
    throw new Error('snapshot 违规: sections 必须是数组');
  }
  s.sections.forEach(function(sec, i){
    if(!sec || typeof sec !== 'object' || typeof sec.heading !== 'string' || !Array.isArray(sec.rows)){
      throw new Error('snapshot 违规: sections['+i+'] 必须含 heading(字符串) + rows(数组)');
    }
  });
  return true;
}

/* 行渲染: 支持字符串 或 {text, sensitive}（脱敏）*/
function _rowText(r){
  if(r && typeof r === 'object' && !Array.isArray(r)){
    if(r.sensitive) return '****（敏感字段已脱敏）';
    return String(r.text ?? '');
  }
  return String(r ?? '');
}

/* ── buildDataText v1.2（snapshot 结构化 · 领域无关 · format 支持）──
 * buildDataText(p, format?)  format: 'text'(默认) | 'json' | 'csv'
 */
function buildDataText(p, format){
  var d = p && p.data || {};
  var me = d.meta || {};
  var s = d.scene || {};
  var snap = s.snapshot;
  _validateSnapshot(snap);
  format = format || 'text';

  if(format === 'json'){
    return JSON.stringify(snap, null, 2);
  }
  if(format === 'csv'){
    var out = [];
    out.push(snap.title);
    out.push(snap.summary.map(_rowText).join('; '));
    snap.sections.forEach(function(sec){
      out.push('[' + sec.heading + ']');
      sec.rows.forEach(function(r){ out.push(_rowText(r)); });
    });
    return out.join('\n');
  }

  var L = ['【'+(me.skill_name||me.command_cn||'')+' · '+(me.command_cn||'')+'】'];
  L.push('场景: '+(me.command_cn||'')+(s.scene_id?('('+s.scene_id+')'):'')+(me.wake_word?(' · 唤醒词「'+me.wake_word+'」'):''));
  L.push('时间: '+(me.occurred_at||''));
  if(snap.summary.length){
    snap.summary.forEach(function(x){ L.push(_rowText(x)); });
  }
  snap.sections.forEach(function(sec){
    if(!sec.rows.length) return;
    L.push('▍'+sec.heading);
    sec.rows.forEach(function(r){ L.push('  · '+_rowText(r)); });
  });
  return L.join('\n');
}

/* ── actionBar v1.2（场景按钮 + 复制数据/日志 ghost）──
 * actionBar(p, extra?, opts?)  opts: { preview, formatMenu, download }
 */
function actionBar(p, extra, opts){
  window.__hmPayload = p;
  opts = opts || {};
  var btns = arr(extra || []);
  var sb = opts.noSb ? [] : arr(p && p.data && p.data.scene && p.data.scene.buttons || []);
  var html = '<div class="hm-actions">';
  btns.concat(sb).forEach(function(b){
    html += '<button class="copy '+(b.kind||'')+'" onclick="copyText(this.dataset.t)" data-t="'+esc(b.text).replace(/"/g,'&quot;')+'">'+esc(b.label)+'</button>';
  });
  html += '<button class="copy ghost" onclick="'+(opts.preview?'window.__hmCopyData(true)':'copyText(buildDataText(window.__hmPayload))')+'">复制数据</button>';
  html += '<button class="copy ghost" onclick="'+(opts.preview?'window.__hmCopyLog(true)':'copyText(buildLogText(window.__hmPayload))')+'">复制日志</button>';
  html += '</div>';
  if(opts.preview){
    html += '<div class="hm-preview-overlay" id="hm-preview" style="display:none">'
      + '<div class="hm-preview-panel"><div class="hm-preview-head"><span id="hm-preview-title">复制预览</span>'
      + '<button class="hm-preview-close" onclick="document.getElementById(\'hm-preview\').style.display=\'none\'">✕</button></div>'
      + '<pre class="hm-preview-body" id="hm-preview-body"></pre>'
      + '<div class="hm-preview-actions"><button class="copy primary" id="hm-preview-confirm">复制</button>'
      + '<button class="copy" onclick="document.getElementById(\'hm-preview\').style.display=\'none\'">取消</button></div>'
      + '</div></div>';
  }
  return html;

/* 复制预览面板（actionBar preview 模式） */
function _showCopyPreview(kind){
  var p = window.__hmPayload;
  var body = document.getElementById('hm-preview-body');
  var title = document.getElementById('hm-preview-title');
  if(!body) return;
  var text = kind === 'log' ? buildLogText(p) : buildDataText(p);
  title.textContent = kind === 'log' ? '复制日志 · 预览' : '复制数据 · 预览';
  body.textContent = text;

  document.getElementById('hm-preview-confirm').onclick = function(){
    copyText(text);
    document.getElementById('hm-preview').style.display = 'none';
  };
}
window.__hmCopyData = function(){ _showCopyPreview('data'); };
window.__hmCopyLog = function(){ _showCopyPreview('log'); };

/* ── formPrompt（P0 · 用户填参数表单 + 实时预览 + 空值拦截）──
 * formPrompt(fields, template) → HTML 字符串
 * fields: [{ key, label, type:'text'|'number'|'select', options?, default?, placeholder? }]
 * template: 含 {key} 占位符的 prompt 模板
 */
function formPrompt(fields, template){
  fields = arr(fields);
  var uid = 'fp' + Math.random().toString(36).slice(2,7);
  var html = '<div class="fp" id="'+uid+'">';
  fields.forEach(function(f, i){
    var fid = uid + '-f' + i;
    html += '<div class="fp-field"><label class="fp-label">'+esc(f.label)+'</label>';
    if(f.type === 'select'){
      html += '<select class="fp-input" id="'+fid+'" data-key="'+esc(f.key)+'">';
      arr(f.options).forEach(function(o){
        var sel = (String(o.value ?? o) === String(f.default ?? '')) ? ' selected' : '';
        html += '<option value="'+esc(o.value ?? o)+'"'+sel+'>'+esc(o.label ?? o)+'</option>';
      });
      html += '</select>';
    } else {
      html += '<input class="fp-input" id="'+fid+'" type="'+(f.type==='number'?'number':'text')+'" data-key="'+esc(f.key)+'" value="'+esc(f.default ?? '')+'" placeholder="'+esc(f.placeholder ?? '')+'">';
    }
    html += '</div>';
  });
  html += '<div class="fp-preview"><div class="fp-preview-label">Prompt 预览</div><pre class="fp-preview-body" id="'+uid+'-preview"></pre></div>';
  html += '<div class="fp-actions"><button class="copy primary" id="'+uid+'-btn">复制 prompt</button></div>';
  html += '</div>';

  function renderPreview(){
    var vals = {};
    fields.forEach(function(f, i){
      var el = document.getElementById(uid + '-f' + i);
      vals[f.key] = el ? el.value : '';
    });
    var text = String(template || '').replace(/\{(\w+)\}/g, function(_, k){ return vals[k] ?? ''; });
    document.getElementById(uid + '-preview').textContent = text;
    var btn = document.getElementById(uid + '-btn');
    var emptyRequired = fields.some(function(f){ return f.required && !vals[f.key]; });
    if(emptyRequired){
      btn.disabled = true;
      btn.textContent = '请填写必填项';
    } else {
      btn.disabled = false;
      btn.textContent = '复制 prompt';
    }
  }

  setTimeout(function(){
    fields.forEach(function(f, i){
      var el = document.getElementById(uid + '-f' + i);
      if(el){
        el.addEventListener('input', renderPreview);
        el.addEventListener('change', renderPreview);
      }
    });
    document.getElementById(uid + '-btn').addEventListener('click', function(){
      if(this.disabled) { toast('请先填写','必填字段未填写',{badge:{text:'提示',type:'warn'}}); return; }
      var text = document.getElementById(uid + '-preview').textContent;
      copyText(text);
    });
    renderPreview();
  }, 0);

  return html;
}

/* ── selectList（P0 · 勾选列表 + 批量操作 + 计数联动 + 行内控件 v1.9）──
 * selectList(items, batchActions?, opts?)
 * items: [{ id, title, sub?, group?, widget? }]
 *   widget（v1.9 · #327）: { type:'date'|'text'|'select', key, label?, placeholder?, options? }
 *     - options: [ {value,label} | '原始值' ]（select 用; 缺省渲染占位「请选择」）
 *     - 非法 type 降级 text（宽容渲染, 不报错）; key 缺省 'w'+行号
 * batchActions: [{ label, kind:'ok'|'danger', onClick(ids, values?) }]
 *   - v1.9: onClick 第二参 values = 勾选条目对应的行内值 { [id]: { [key]: value } }
 *     （只读勾选条目; 未填 → null, 不报错; 未勾选条目不参与）
 * opts: { onSubmit(selectedIds, values) }  —— v1.9 读取接口（选定形态, 等价 getValues）
 *   - 任意批量操作按钮点击后触发（与 onClick 并列; 无勾选时不触发, 与既有拦截一致）
 *   - values = 全部行内值 { [id]: { [key]: value } }（含未勾选条目; 未填 → null; 无 widget 条目不出现）
 * 安全: 行内 label/placeholder/option value+label 渲染一律 esc, 零注入面
 * 兼容: 未声明 widget 的既有调用渲染输出与行为完全不变（守卫测试回归 outerHTML）
 */
function selectList(items, batchActions, opts){
  items = arr(items);
  batchActions = arr(batchActions);
  opts = opts || {};
  var uid = 'sl' + Math.random().toString(36).slice(2,7);
  var groups = {};
  items.forEach(function(it){
    var g = it.group || '';
    (groups[g] = groups[g] || []).push(it);
  });
  var groupNames = Object.keys(groups);

  /* 行内控件 HTML（v1.9 · #327）: 未声明 widget → 空串, 渲染零变化 */
  function widgetHtml(it, idx){
    var w = it.widget;
    if(!w || typeof w !== 'object') return '';
    var t = w.type === 'date' ? 'date' : (w.type === 'select' ? 'select' : 'text');  // 非法 type 降级 text
    var key = w.key != null ? String(w.key) : ('w' + idx);
    var lbl = w.label ? '<span class="sl-widget-label">'+esc(w.label)+'</span>' : '';
    var inner;
    if(t === 'select'){
      inner = '<select class="sl-widget-input" data-wkey="'+esc(key)+'">';
      var os = arr(w.options);
      if(!os.length) inner += '<option value="">请选择</option>';
      os.forEach(function(o){
        var ov = (o && typeof o === 'object') ? (o.value != null ? o.value : o.label) : o;
        var ol = (o && typeof o === 'object') ? (o.label != null ? o.label : o.value) : o;
        inner += '<option value="'+esc(String(ov == null ? '' : ov))+'">'+esc(String(ol == null ? '' : ol))+'</option>';
      });
      inner += '</select>';
    } else {
      inner = '<input class="sl-widget-input" data-wkey="'+esc(key)+'" type="'+t+'"'
        + (w.placeholder ? ' placeholder="'+esc(w.placeholder)+'"' : '')
        + '>';
    }
    return '<span class="sl-widget">'+lbl+inner+'</span>';
  }

  var html = '<div class="sl" id="'+uid+'">';
  if(batchActions.length){
    html += '<div class="sl-batchbar" id="'+uid+'-batch">';
    batchActions.forEach(function(a){
      html += '<button class="copy '+(a.kind==='danger'?'red':'primary')+'" data-batch="'+esc(a.label)+'">'+esc(a.label)+'</button>';
    });
    html += '<span class="sl-count" id="'+uid+'-count">已选 0/'+items.length+'</span>';
    html += '</div>';
  }
  groupNames.forEach(function(g){
    var gItems = groups[g];
    html += '<div class="sl-group"><div class="sl-group-head">'+esc(g||'全部');
    html += ' <span class="sl-group-count">本组已选 0/'+gItems.length+'</span></div>';
    html += '<div class="sl-group-items">';
    gItems.forEach(function(it, idx){
      html += '<label class="sl-item"><input type="checkbox" data-id="'+esc(it.id)+'" data-g="'+esc(g)+'">'
        + '<span class="sl-item-body"><span class="sl-item-title">'+esc(it.title)+'</span>'
        + (it.sub?'<span class="sl-item-sub">'+esc(it.sub)+'</span>':'')
        + widgetHtml(it, idx)
        + '</span></label>';
    });
    html += '</div></div>';
  });
  html += '</div>';

  setTimeout(function(){
    var root = document.getElementById(uid);
    var checkboxes = root.querySelectorAll('input[type="checkbox"]');
    var globalCount = document.getElementById(uid + '-count');
    function update(){
      var total = checkboxes.length;
      var checked = root.querySelectorAll('input[type="checkbox"]:checked').length;
      if(globalCount) globalCount.textContent = '已选 '+checked+'/'+total;
      root.querySelectorAll('.sl-group').forEach(function(gEl){
        var boxes = gEl.querySelectorAll('input[type="checkbox"]');
        var c = gEl.querySelectorAll('input[type="checkbox"]:checked').length;
        var lbl = gEl.querySelector('.sl-group-count');
        if(lbl) lbl.textContent = '本组已选 '+c+'/'+boxes.length;
      });
      return checked;
    }
    checkboxes.forEach(function(cb){
      cb.addEventListener('change', update);
    });
    /* 行内值读取（v1.9 · #327）: 计数只随勾选态, 控件值变化不干扰 */
    function widgetVal(el){
      var v = el.value;
      return (v === '' || v === null || v === undefined) ? null : v;  // 未填统一归一 null
    }
    function readAll(){
      var out = {};
      root.querySelectorAll('.sl-item').forEach(function(itemEl){
        var cb = itemEl.querySelector('input[type="checkbox"]');
        var id = cb ? cb.getAttribute('data-id') : null;
        if(id == null) return;
        itemEl.querySelectorAll('.sl-widget-input').forEach(function(el){
          var key = el.getAttribute('data-wkey');
          if(key == null) return;
          (out[id] = out[id] || {})[key] = widgetVal(el);
        });
      });
      return out;
    }
    function readChecked(){
      var out = {};
      root.querySelectorAll('input[type="checkbox"]:checked').forEach(function(cb){
        var id = cb.getAttribute('data-id');
        var itemEl = cb.closest('.sl-item');
        itemEl.querySelectorAll('.sl-widget-input').forEach(function(el){
          var key = el.getAttribute('data-wkey');
          if(key == null) return;
          (out[id] = out[id] || {})[key] = widgetVal(el);
        });
      });
      return out;
    }
    root.querySelectorAll('[data-batch]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var ids = root.querySelectorAll('input[type="checkbox"]:checked');
        if(!ids.length){ toast('请先勾选','勾选要处理的条目',{badge:{text:'提示',type:'warn'}}); return; }
        var idList = Array.prototype.map.call(ids, function(x){ return x.getAttribute('data-id'); });
        var a = batchActions.filter(function(x){ return x.label === btn.getAttribute('data-batch'); })[0];
        if(a && a.onClick) a.onClick(idList, readChecked());  // v1.9: 第二参 = 勾选条目行内值
        if(opts.onSubmit) opts.onSubmit(idList, readAll());   // v1.9: 读取接口 = 全部行内值
      });
    });
    update();
  }, 0);

  return html;
}

/* ── confirm（P0 · 危险操作二次确认）──
 * confirm({ title, detail?, danger?, onOk })
 */
function confirm(cfg){
  cfg = cfg || {};
  var overlay = document.createElement('div');
  overlay.className = 'hm-confirm-overlay';
  overlay.innerHTML = '<div class="hm-confirm-panel">'
    + '<div class="hm-confirm-title">'+(cfg.danger?'⚠️ ':'')+esc(cfg.title||'确认操作')+'</div>'
    + (cfg.detail?'<div class="hm-confirm-detail">'+esc(cfg.detail)+'</div>':'')
    + '<div class="hm-confirm-actions">'
    + '<button class="copy '+(cfg.danger?'red':'primary')+'" data-c="1">'+(cfg.danger?'确认删除':'确认')+'</button>'
    + '<button class="copy" data-c="0">取消</button>'
    + '</div></div>';
  document.body.appendChild(overlay);
  overlay.querySelector('[data-c="1"]').addEventListener('click', function(){
    overlay.remove();
    if(cfg.onOk) cfg.onOk();
  });
  overlay.querySelector('[data-c="0"]').addEventListener('click', function(){ overlay.remove(); });
  overlay.addEventListener('click', function(e){
    if(e.target === overlay) overlay.remove();
  });
}

/* ── foldBox（P1 · 折叠区）── */
function foldBox(title, contentHtml){
  return '<details class="hm-fold"><summary>'+esc(title)+'</summary><div class="hm-fold-body">'+(contentHtml||'')+'</div></details>';
}

/* ── statusBadge（P1 · 状态徽章）──
 * statusBadge(status, text?)
 *   status: 'ok'|'warn'|'danger'|'empty'（非法值降级 'empty', 防无样式徽章）
 *   text:   自定义文案（缺省用语义默认: 成功/警告/失败/无数据）
 * 安全: status 白名单后直拼 class（无注入面）; text 经 esc
 */
var STATUS_BADGE_MAP = { ok:'成功', warn:'警告', danger:'失败', empty:'无数据' };
function statusBadge(status, text){
  status = STATUS_BADGE_MAP[status] ? status : 'empty';  // 非法/未知值降级 empty
  var txt = (text === null || text === undefined || text === '') ? STATUS_BADGE_MAP[status] : String(text);
  return '<span class="hm-status '+status+'">'+esc(txt)+'</span>';
}

/* ── emptyState（P1 · 空状态）──
 * emptyState({icon?, text, hint?, action?})
 *   icon:   emoji/文本图标（esc）
 *   text:   主文案（缺省 '暂无数据', esc）
 *   hint:   次要提示（esc）
 *   action: 操作区 HTML —— 受信 HTML 透传（调用方负责其内容安全, 通常为按钮;
 *           如含用户数据必须先 esc）。其余字段一律 esc, 防 XSS。
 */
function emptyState(cfg){
  cfg = cfg || {};
  return '<div class="hm-empty">'
    + (cfg.icon?'<div class="hm-empty-icon">'+esc(cfg.icon)+'</div>':'')
    + '<div class="hm-empty-text">'+esc(cfg.text||'暂无数据')+'</div>'
    + (cfg.hint?'<div class="hm-empty-hint">'+esc(cfg.hint)+'</div>':'')
    + (cfg.action?('<div class="hm-empty-action">'+cfg.action+'</div>'):'')
    + '</div>';
}

/* ── errorReceipt（P1 · 错误回执 · 08 规范 §6.1 三层反馈）──
 * errorReceipt({message, retryPrompt?, data?, log?, payload?})
 *   message:     错误描述（esc, 缺省 '操作失败'）
 *   retryPrompt: 修正重试按钮文案（有则渲染「修正重试」按钮, 复制该 prompt）
 *   data:        复制数据按钮内容（字符串直传; 或省略时从 payload 生成）
 *   log:         复制日志按钮内容（字符串直传; 或省略时从 payload 生成）
 *   payload:     数据信封 {status, data:{meta, scene}} —— 显式传入, 优先于全局
 *   __hmPayload: 兼容全局兜底（actionBar 已设置; 显式 payload 优先）
 * 布局: 修正重试 primary 独立一行 + 复制数据/日志 ghost 一行 2 个（08 规范奇数按钮）
 * 安全: message/data/log 经 esc + data-t 中转（onclick 仅 copyText(this.dataset.t), 零注入面）
 */
function errorReceipt(cfg){
  cfg = cfg || {};
  var payload = cfg.payload || window.__hmPayload || null;
  var dataText = cfg.data != null ? String(cfg.data) : '';
  var logText = cfg.log != null ? String(cfg.log) : '';
  // 有效数据源 = payload 含 scene.snapshot（残缺 payload 视为无数据, 不生成垃圾复制内容）
  var pValid = !!(payload && payload.data && payload.data.scene && payload.data.scene.snapshot);
  if(!dataText && pValid){
    try { dataText = buildDataText(payload); } catch(e){ dataText = ''; }  // 数据不完整 → 不渲染复制数据按钮（错误回执容错）
  }
  if(!logText && pValid){
    try { logText = buildLogText(payload); } catch(e){ logText = ''; }     // 同上
  }
  var html = '<div class="hm-error">'
    + '<div class="hm-error-title">❌ '+esc(cfg.message||'操作失败')+'</div>';
  if(cfg.retryPrompt){
    html += '<div class="hm-actions"><button class="copy primary wide" onclick="copyText(this.dataset.t)" data-t="'+esc(cfg.retryPrompt).replace(/"/g,'&quot;')+'">修正重试</button></div>';
  }
  var btns = '';
  if(dataText) btns += '<button class="copy ghost" onclick="copyText(this.dataset.t)" data-t="'+esc(dataText).replace(/"/g,'&quot;')+'">复制数据</button>';
  if(logText) btns += '<button class="copy ghost" onclick="copyText(this.dataset.t)" data-t="'+esc(logText).replace(/"/g,'&quot;')+'">复制日志</button>';
  if(btns) html += '<div class="hm-actions">'+btns+'</div>';
  return html + '</div>';
}
</script>

/* ===== 自然滚动: 内容跟手, 搜索栏 sticky 吸顶(CSS) =====
   旧版两段式 transform 抵消导致: 吸顶前内容不跟手、短页(关于)滚不到吸顶 → 全部移除 */
/* 页面高度 = 内容自然高度（不撑高）: 内容短则页面短, 滑到底即停, 不出灰色空白
   （原实现 pg.style.minHeight = screen.clientHeight 把短页撑到一屏高,
     内容下方露出透明 page 背景 → 灰色底被顶上来;#289 用户验收拍板）*/

/* ===== 滑动切页（ViewPager）===== */
var pages = document.getElementById('pages');
var tabs = Array.prototype.slice.call(document.querySelectorAll('.tab'));
var screen = document.querySelector('.screen');
/* ③ 容器高度锁定: 用内容实际全高(而非首屏高), 防空白可滑也防内容被截断 */
function lockPagesHeight(idx){
  if (idx === undefined) idx = Math.min(curIndex(), pages.children.length - 1);
  var pg = pages.children[idx];
  if (!pg) return;
  pages.style.height = pg.scrollHeight + 'px';
}
function curIndex(){ return Math.round(pages.scrollLeft / pages.clientWidth); }
function syncTab(){
  var i = Math.min(curIndex(), tabs.length - 1);
  tabs.forEach(function(t, j){ t.classList.toggle('active', j === i); });
}
pages.addEventListener('scroll', function(){
  clearTimeout(syncTab._t);
  syncTab._t = setTimeout(function(){
    if (Date.now() < syncTab._lockUntil) return;  /* 点击后的滚动动画期不覆盖 active */
    syncTab();
    lockPagesHeight();  /* 横向滑动结束也校准高度 */
  }, 15);
}, {passive:true});
tabs.forEach(function(t){
  t.addEventListener('click', function(){
    var i = tabs.indexOf(t);
    tabs.forEach(function(x, j){ x.classList.toggle('active', j === i); });
    syncTab._lockUntil = Date.now() + 900;  /* 锁 ~0.9s: 覆盖点击动画期即可, 缩短滑动跟手延迟 */
    /* 切换立即: ① 归零纵向滚动(防旧位置灰色遮挡) ② 立即锁定新页高度(防内容截断/滑不动) */
    /* 手机端: .screen 是滚动容器, scrollTop=0 = 回到内容顶部（页面不跳）;
       宽屏: .screen overflow:visible, 真正滚动的是 window —— 定位到 pages 容器顶部(搜索栏处), 不跳整页最上层 */
    if (screen.scrollTop !== undefined && screen.clientHeight > 0 && screen.scrollHeight > screen.clientHeight) {
      screen.scrollTop = 0;
    } else {
      var pagesTop = pages.getBoundingClientRect().top + (window.pageYOffset || document.documentElement.scrollTop || 0);
      window.scrollTo(0, Math.max(0, pagesTop - 8));
    }
    pages.style.scrollSnapType = 'none';
    pages.scrollTo({left: i * pages.clientWidth, behavior:'smooth'});
    lockPagesHeight(i);  /* 直接传目标索引, 不等动画 */
    /* 点击的 Tab 尽可能居中显示(首尾贴边) */
    centerTab(t);
    setTimeout(function(){
      pages.style.scrollSnapType = '';
      syncTab._lockUntil = 0;  /* 动画结束立即解锁, 之后滑动变色实时跟手 */
      lockPagesHeight(i);  /* 动画结束后再校准一次 */
    }, 900);
  });
});
/* ===== Tab 条: 点击的 Tab 居中显示 ===== */
function centerTab(tab){
  var bar = document.getElementById('tabBar');
  var max = bar.scrollWidth - bar.clientWidth;
  var target = tab.offsetLeft + tab.offsetWidth / 2 - bar.clientWidth / 2;
  target = Math.max(0, Math.min(target, max));

}

  if (fm) fm.addEventListener('input', function(){
    var pv = sheet.querySelector('[data-prev]');
    if (pv) pv.textContent = buildPrompt(s, readParams(s.id));
  });
  mask.classList.add('show');
  sheet.classList.add('show');
  sheet.querySelector('.s-scroll').scrollTop = 0;
}
function closeSheet(){
  mask.classList.remove('show');
  sheet.classList.remove('show');
}
mask.addEventListener('click', closeSheet);
document.getElementById('sheetClose').addEventListener('click', closeSheet);

/* ===== 卡片交互 ===== */
screen.addEventListener('click', function(e){
  var mini = e.target.closest('.mini');
  if (mini) {
    if (e.target.closest('[data-c]')) return;
    openSheet(SCENE[mini.dataset.key]);
  }
});

/* ===== Toast（公共组件）===== */
function showToast(){
  toast('已复制', '粘贴给 AI,技能会自动执行,完成后你会拿到结果 HTML。', {icon:'copy'});
}
function toastMsg(msg){
  toast('请先填写: ' + msg, '填写完整后再复制 prompt', {icon:'warn', badge:{text:'未完成', type:'warn'}});
}
function doCopy(text){
  var ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); } catch(e){}
  document.body.removeChild(ta);
}

/* ===== 全局复制（含参数校验）===== */
document.addEventListener('click', function(e){
  var b = e.target.closest('[data-c]');
  if (!b) return;
  e.preventDefault(); e.stopPropagation();
  var s = SCENE[b.dataset.pid || (b.closest('.mini') ? b.closest('.mini').dataset.key : '')];
  var text = b.dataset.c;
  if (s && s.params && s.params.length) {
    var v = readParams(s.id);
    var miss = getMissing(s, v);
    if (miss.length) { toastMsg(miss.join('、')); return; }
    text = buildPrompt(s, v);
  }
  doCopy(text);
  showToast();
  /* B3: 复制后不自动关弹窗 */
});

/* ===== 搜索（全局跨 Tab + 自动跳转 + 高亮）===== */
var sB = document.getElementById('sB');
var sClear = document.getElementById('sClear');
var lastQuery = '';
function doSearch(){
  var q = sB.value.trim().toLowerCase();
  sClear.style.display = q ? 'flex' : 'none';
  if (!q) {
    var cur = curIndex();
    Array.prototype.forEach.call(pages.children, function(pg, i){
      pg.querySelectorAll('.mini').forEach(function(m){
        m.style.display = '';
        m.querySelector('.m-name').innerHTML = esc(SCENE[m.dataset.key].name);
      });
      pg.querySelectorAll('.subgroup').forEach(function(sg){ sg.style.display = ''; });
    });
    if (lastQuery) pages.scrollTo({left: cur * pages.clientWidth, behavior:'smooth'});
    lastQuery = '';
    document.getElementById('hitC').hidden = true;
    document.getElementById('emptyC').hidden = true;
    return;
  }
  lastQuery = q;
  var total = 0, firstHitPage = -1;
  Array.prototype.forEach.call(pages.children, function(pg, i){
    var pageHit = 0;
    pg.querySelectorAll('.mini').forEach(function(m){
      var show = m.textContent.toLowerCase().indexOf(q) > -1;
      m.style.display = show ? '' : 'none';
      if (show) pageHit++;
      var orig = SCENE[m.dataset.key].name;
      var i2 = orig.toLowerCase().indexOf(q);
      if (q && i2 >= 0) m.querySelector('.m-name').innerHTML = esc(orig.slice(0,i2)) + '<mark>' + esc(orig.slice(i2,i2+q.length)) + '</mark>' + esc(orig.slice(i2+q.length));
      else m.querySelector('.m-name').innerHTML = esc(orig);
    });
    /* 子功能组：无命中则隐藏 */
    pg.querySelectorAll('.subgroup').forEach(function(sg){
      var vis = sg.querySelectorAll('.mini:not([style*="none"])').length > 0;
      sg.style.display = vis ? '' : 'none';
      if (q && vis) sg.open = true;
    });
    total += pageHit;
    if (pageHit > 0 && firstHitPage === -1) firstHitPage = i;
  });
  if (firstHitPage >= 0 && firstHitPage !== curIndex()) {
    pages.scrollTo({left: firstHitPage * pages.clientWidth, behavior:'smooth'});
  }
  document.getElementById('hitC').hidden = false;
  document.getElementById('hitC').textContent = '匹配 ' + total + ' 个场景';
  document.getElementById('emptyC').hidden = total > 0;
}
sB.addEventListener('input', doSearch);
sClear.addEventListener('click', function(){ sB.value = ''; doSearch(); sB.focus(); });
/* 初始锁定 + 子功能组折叠/展开时高度校准 */
lockPagesHeight();
document.addEventListener('click', function(e){
  var sg = e.target.closest('.subgroup > summary');
  if (sg) setTimeout(lockPagesHeight, 60);  /* details 切换后重算 */
});
</script>
</body>
