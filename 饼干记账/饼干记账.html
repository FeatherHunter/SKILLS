<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>饼干记账 · 使用手册(HELP)</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--fg:#1d1d1f;--fg2:#6e6e73;--fg3:#86868b;--bg:#f5f5f7;--card:#fff;--line:#d2d2d7;--blue:#007aff;--blue2:#0a63ce;--soft:#f5f8ff;--ok:#34c759;--shadow:0 1px 2px rgba(0,0,0,.04),0 12px 36px rgba(0,0,0,.06)}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--fg);line-height:1.65;-webkit-font-smoothing:antialiased;padding-bottom:48px}
button{font-family:inherit}
mark{background:#ffe08a;border-radius:3px;padding:0 2px;color:inherit}

.wrap{max-width:860px;margin:0 auto;padding:28px 20px 40px}

/* ===== Hero ===== */
.hero{background:linear-gradient(180deg,#fff 0%,#f8fbff 100%);border-radius:24px;padding:28px 30px;margin-bottom:20px;box-shadow:var(--shadow)}
.eyebrow{font-size:12px;color:var(--blue);font-weight:800;letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px}
h1{font-size:30px;line-height:1.2;letter-spacing:-.02em;margin-bottom:8px}
.lead{color:var(--fg2);font-size:15px}
.hero-mode{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:14px}
.hero-steps{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.hero-steps .step{background:var(--soft);border:1px solid #d7e6ff;color:var(--blue2);font-weight:700;font-size:13px;padding:6px 14px;border-radius:999px;box-shadow:0 1px 3px rgba(0,122,255,.10);white-space:nowrap}
.hero-steps .arrow{color:var(--blue);font-weight:800;font-size:15px}
.hero-stats{display:flex;gap:8px;margin-left:auto}
.hero-stats .stat{background:#fff;border:1px solid var(--line);color:var(--fg2);font-size:12px;font-weight:700;padding:6px 12px;border-radius:999px;white-space:nowrap}
.meta{margin-top:12px;color:var(--fg3);font-size:12.5px}
@media(max-width:820px){.hero-mode{gap:8px}.hero-steps{order:-1;width:100%;gap:5px}.hero-steps .step{font-size:11.5px;padding:4px 7px}.hero-steps .arrow{font-size:12px;margin:0 -3px}.hero-stats{display:none}}

/* ===== 首次使用横幅(状态驱动:初始化完成即消失) ===== */
.init-banner{background:linear-gradient(135deg,#0a63ce,#007aff 55%,#34c759);color:#fff;border-radius:20px;padding:22px 24px;margin-bottom:18px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;box-shadow:0 12px 32px rgba(0,122,255,.25)}
.init-banner[hidden]{display:none}
.init-banner .ib-text{flex:1;min-width:220px}
.init-banner .ib-title{font-size:17px;font-weight:800;margin-bottom:2px}
.init-banner .ib-sub{font-size:12.5px;opacity:.9}
.init-banner .copy-btn{background:#fff;color:var(--blue);font-weight:700;padding:9px 16px}
.init-banner .copy-btn.copied{background:var(--ok);color:#fff}

/* ===== 搜索(sticky · 宽度与内容列一致) ===== */
.search-wrap{position:sticky;top:0;z-index:40;background:rgba(245,245,247,.92);-webkit-backdrop-filter:saturate(180%) blur(14px);backdrop-filter:saturate(180%) blur(14px);padding:8px 0;margin-bottom:6px}
.search-box{position:relative}
.search-box input{width:100%;border:1px solid var(--line);border-radius:999px;padding:10px 38px 10px 16px;font-size:14px;background:#fff;outline:none;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.search-box input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(0,122,255,.15)}
.search-box .s-icon{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:14px;color:var(--fg3)}
.hitcount{font-size:12.5px;color:var(--fg2);margin-bottom:10px;text-align:center}
.search-empty{background:var(--card);border:1.5px dashed var(--line);border-radius:14px;padding:28px;text-align:center;color:var(--fg3);font-size:13px}

/* ===== 场景卡片(共享组件 · 整卡点击即展开,详情 = prompt 仅 · P1 裁决 #4) ===== */
.copy-btn{display:inline-flex;align-items:center;justify-content:center;border:0;background:var(--blue);color:#fff;border-radius:999px;padding:7px 13px;font-size:12.5px;cursor:pointer;white-space:nowrap;flex-shrink:0;transition:background .15s}
.copy-btn:hover{background:var(--blue2)}
.copy-btn.copied{background:var(--ok)}
.copy-short{display:none}
.scene{background:var(--bg);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;scroll-margin-top:120px;overflow:hidden}
.scene:last-child{margin-bottom:0}
.scene>summary.scene-head{padding:14px 16px;cursor:pointer;user-select:none;display:flex;align-items:center;gap:8px;flex-wrap:wrap;list-style:none;transition:background .15s}
.scene>summary.scene-head::-webkit-details-marker{display:none}
.scene>summary.scene-head::before{content:"▸";font-size:11px;color:var(--fg3);transition:transform .15s;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;width:8px;margin-right:-8px;line-height:1}
.scene[open]>summary.scene-head::before{transform:rotate(90deg);color:var(--blue)}
.scene>summary.scene-head:hover{background:var(--soft)}
.scene-id{font-size:11px;color:var(--fg3);font-weight:700;font-family:ui-monospace,Menlo,monospace}
.scene-title{font-size:15px;font-weight:600;flex:1;min-width:180px}
.chip{display:inline-block;background:var(--soft);color:var(--blue2);padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:700;flex-shrink:0}
.type-badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:700;flex-shrink:0;background:#e9e9ee;color:#666}
.type-badge.t-view{background:#e8f2ff;color:#0a63ce}
.type-badge.t-collect{background:#e7f8ee;color:#1a7a3a}
.type-badge.t-select{background:#fff1e2;color:#c2540a}
.type-badge.t-wizard{background:#e2f7f5;color:#00897b}
.type-badge.t-mixed{background:#f3e9fb;color:#8e3fc9}
.scene-body{padding:0 16px 14px}
.scene-type{display:flex;align-items:center;gap:6px;margin:10px 0 0}
.scene-type .type-label{font-size:11px;color:var(--fg3)}
.prompt-box{background:#1d1d1d;color:#f5f5f7;border-radius:12px;padding:12px 14px;white-space:pre-wrap;font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:12.5px;line-height:1.7;position:relative;margin-top:8px}
.prompt-box .copy-inline{position:absolute;top:8px;right:8px;background:rgba(255,255,255,.14);color:#fff;border:0;border-radius:8px;padding:4px 10px;font-size:11px;cursor:pointer}
.prompt-box .copy-inline:hover{background:rgba(255,255,255,.25)}
.prompt-box .copy-inline.copied{background:var(--ok)}
.dev-banner{margin-top:10px;padding:8px 12px;background:#fff7e8;color:#b25b00;border-radius:10px;font-size:12.5px;font-weight:700;display:flex;gap:8px;align-items:center}
.dev-banner .mini{font-size:11px;font-weight:400;color:#c07a2a}

/* ===== 分类模块折叠(域 → 子功能 → 场景) ===== */
.module{background:var(--card);border-radius:16px;box-shadow:0 1px 3px rgba(0,0,0,.04);margin-bottom:12px;overflow:hidden}
.module>summary{padding:9px 14px;cursor:pointer;font-size:14.5px;font-weight:700;color:var(--fg);user-select:none;display:flex;align-items:center;gap:10px;list-style:none;transition:background .15s}
.module>summary::-webkit-details-marker{display:none}
.module>summary::before{content:"▶";display:inline-flex;align-items:center;justify-content:center;width:12px;margin-right:-2px;font-size:9px;color:var(--fg3);transition:transform .15s;flex-shrink:0}
.module[open]>summary::before{transform:rotate(90deg);color:var(--blue)}
.module>summary:hover{background:var(--soft)}
.module-body{padding:0 12px 8px}
.module-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.module-head .m-icon{font-size:17px}
.module-head .m-count{font-size:11.5px;color:var(--fg3);font-weight:600}
.module-head .m-tag{font-size:10.5px;color:var(--ok);font-weight:700;background:#e7f8ee;border-radius:999px;padding:2px 8px}
.sub-module{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:6px;overflow:hidden}
.sub-module>summary{padding:10px 14px;cursor:pointer;font-size:13px;font-weight:600;color:var(--fg2);user-select:none;list-style:none;display:flex;align-items:center;gap:8px;transition:background .15s}
.sub-module>summary::-webkit-details-marker{display:none}
.sub-module>summary::before{content:"▸";display:inline-flex;align-items:center;justify-content:center;width:8px;margin-right:-8px;font-size:10px;color:var(--fg3);transition:transform .15s;flex-shrink:0}
.sub-module[open]>summary::before{transform:rotate(90deg);color:var(--blue)}
.sub-module>summary:hover{background:var(--soft)}
.sub-module .module-body{padding:10px 12px 8px}
.sub-head{display:flex;align-items:center;gap:8px;justify-content:space-between;width:100%}
.sub-head .scount{font-size:11px;color:var(--fg3)}

/* ===== 联系作者(仅 HELP · G7) ===== */
.contact-box{background:var(--card);border-radius:16px;box-shadow:0 1px 3px rgba(0,0,0,.04);margin-top:22px;overflow:hidden}
.contact-box>summary{padding:14px 18px;cursor:pointer;font-size:14px;font-weight:700;list-style:none;user-select:none;display:flex;align-items:center;gap:10px;transition:background .15s}
.contact-box>summary::-webkit-details-marker{display:none}
.contact-box>summary::before{content:"▶";font-size:9px;color:var(--fg3);transition:transform .15s}
.contact-box[open]>summary::before{transform:rotate(90deg);color:var(--blue)}
.contact-box>summary:hover{background:var(--soft)}
.contact-body{padding:0 18px 18px}
.contact-item{display:flex;gap:10px;align-items:center;font-size:13.5px;color:var(--fg2);padding:7px 0;border-bottom:1px dashed var(--line)}
.contact-item:last-child{border-bottom:0}
.contact-item .k{font-weight:700;color:var(--fg);min-width:64px}
.contact-item a{color:var(--blue);text-decoration:none}
.contact-copy{margin-top:12px}
footer{text-align:center;color:var(--fg3);font-size:11px;padding:20px 0 0;margin-top:8px}

/* ===== Toast ===== */
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0));transform:translateX(-50%) scale(.9);opacity:0;background:rgba(28,28,30,.94);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);color:#f0f0f0;border-radius:14px;padding:13px 14px 13px 16px;display:flex;align-items:flex-start;gap:12px;max-width:480px;min-width:300px;box-shadow:0 10px 32px rgba(0,0,0,.32),0 0 0 .5px rgba(255,255,255,.08) inset;pointer-events:none;transition:opacity .22s ease-out,transform .22s cubic-bezier(.34,1.56,.64,1);z-index:9999}
.toast.show{opacity:1;transform:translateX(-50%) scale(1);pointer-events:auto}
.toast-icon{font-size:20px;line-height:1;padding-top:1px;flex-shrink:0}
.toast-body{flex:1;min-width:0}
.toast-title{font-weight:600;font-size:12.5px;line-height:1.4;color:#fff;margin-bottom:2px}
.toast-detail{font-size:11px;line-height:1.5;color:#c8c8cc}
.toast-close{background:rgba(255,255,255,.10);color:#34c759;border:0;border-radius:8px;padding:5px 9px;font-size:10.5px;font-weight:500;font-family:inherit;cursor:pointer;white-space:nowrap;margin-left:6px;flex-shrink:0}

  /* ===== 移动适配(390px) ===== */
@media(max-width:820px){
  .wrap{padding:18px 12px 60px}
  h1{font-size:24px}
  .hero{padding:20px 18px}
  .prompt-box{padding-top:44px;padding-right:12px}
  .toast{left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0));transform:translateX(0) scale(.95);max-width:none;min-width:0}
  .toast.show{transform:translateX(0) scale(1)}
  .init-banner{flex-direction:column;align-items:stretch;text-align:center}
  .init-banner .copy-btn{width:100%}
  /* 场景头部一行:隐藏低价值 id,标题截断,按钮紧凑 */
  .scene>summary.scene-head{flex-wrap:nowrap;gap:4px;padding:9px 10px}
  .scene-head .scene-id{display:none}
  .scene-head .scene-title{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13.5px}
  .scene-head .chip{font-size:10.5px;padding:1px 7px}
  .scene-head .type-badge{font-size:10px;padding:1px 7px}
  .scene-head .copy-btn{min-height:28px;min-width:56px;padding:0 10px;font-size:11px;margin-left:auto}
  .copy-btn .copy-short{display:inline}
  .copy-btn .copy-long{display:none}
}
</style>
</head>

<script>function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function arr(v){return Array.isArray(v)?v:[];}
function val(v){return v===null||v===undefined||v===''?'<span style="color:var(--fg3)">未填写</span>':esc(v);}
function yes(v){return v?'<span class="ok">通过</span>':'<span class="bad">未通过</span>';}
function validate(p){if(!p||typeof p!=='object')return{ok:false,msg:'数据未注入'};if(p.status!=='ok')return{ok:false,msg:p.message||'数据状态非 ok'};if(!p.data||typeof p.data!=='object')return{ok:false,msg:'data 缺失'};return{ok:true};}
function copyText(s){if(!s)return;if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(s).catch(()=>{});}else{var t=document.createElement('textarea');t.value=s;document.body.appendChild(t);t.select();document.execCommand('copy');document.body.removeChild(t);}toast('已复制');}
function toast(msg){var t=document.createElement('div');t.textContent=msg;t.style.cssText='position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:rgba(29,29,31,.92);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;z-index:999;animation:fadeup .25s ease';document.body.appendChild(t);setTimeout(()=>{t.style.opacity='0';t.style.transition='opacity .4s';setTimeout(()=>t.remove(),420);},1400);}
function metaHeader(p,m){var me=p.data.meta||{};var stage=m&&m.stage?('<span class="stage">'+esc(m.stage)+'</span>'):'';return '<header class="hero"><div class="eyebrow">'+esc(me.command_cn||'')+' · 唤醒词「'+esc(me.wake_word||'')+'」 · '+esc(me.occurred_at||'')+'</div><h1>'+esc(m&&m.title||me.command_cn||'')+'</h1>'+(m&&m.lead?'<p class="lead">'+esc(m.lead)+'</p>':'')+stage+'</header>';}
function remindersBlock(p){var rs=arr(p.data.reminders);if(!rs.length)return '';return '<section class="remind"><h2>顺路提醒</h2>'+rs.map(r=>'<div class="remind-item '+(r.type==='warn'?'warn':r.type==='danger'?'bad':'')+'">'+esc(r.text)+'</div>').join('')+'</section>';}
function actionBar(p,extra){var d=p.data;var cd=JSON.stringify(d.copy_data||{},null,2);var cl=JSON.stringify(d.copy_log||{},null,2);var btns=arr(extra||[]);var sb=arr(d.scene&&d.scene.buttons||[]);var html='<div class="actions"><button class="copy" onclick="copyText(this.dataset.t)" data-t="'+esc(cd).replace(/"/g,'&quot;')+'">复制数据</button><button class="copy alt" onclick="copyText(this.dataset.t)" data-t="'+esc(cl).replace(/"/g,'&quot;')+'">复制日志</button>';btns.concat(sb).forEach(b=>{html+='<button class="copy '+(b.kind||'')+'" onclick="copyText(this.dataset.t)" data-t="'+esc(b.text).replace(/"/g,'&quot;')+'">'+esc(b.label)+'</button>';});return html+'</div>';}</script>

<script>
(function(){
  const el = document.getElementById('payload');
  if (!el) return;
  let payload;
  try { payload = JSON.parse(el.textContent); } catch(e) { return; }
  const v = validate(payload);
  if (!v.ok) {
    document.getElementById('mods').innerHTML = '<div class="search-empty">加载失败:' + esc(v.msg) + '</div>';
    return;
  }
  const d = payload.data;
  const domains = arr(d.domains);
  const contact = (d.contact && typeof d.contact === 'object') ? d.contact : {};

  /* ===== 工具 ===== */
  var copyTimer = null;
  function flashBtn(btn,msg,ms){
    if(!btn)return;
    if(copyTimer){clearTimeout(copyTimer)}
    var lbl = btn.querySelector('.copy-short');
    if(!lbl || getComputedStyle(lbl).display==='none') lbl = btn.querySelector('.copy-long') || btn;
    var old=lbl.textContent;lbl.textContent=msg;btn.classList.add('copied');
    copyTimer=setTimeout(function(){lbl.textContent=old;btn.classList.remove('copied')},ms||1800);
  }
  function fallbackCopy(text){
    try{
      var ta=document.createElement('textarea');ta.value=text;
      ta.style.cssText='position:fixed;left:-9999px;top:0';
      document.body.appendChild(ta);ta.focus();ta.select();
      var ok=false;try{ok=document.execCommand('copy')}catch(e){ok=false}
      document.body.removeChild(ta);return ok;
    }catch(e){return false}
  }
  function safeWriteText(text){
    if(navigator.clipboard&&navigator.clipboard.writeText){
      return navigator.clipboard.writeText(text).then(function(){return true}).catch(function(){return fallbackCopy(text)});
    }
    return Promise.resolve(fallbackCopy(text));
  }
  var toastEl=document.getElementById('toast');
  var toastWakeEl=document.getElementById('toastWake');
  var toastTimer=null;
  function toastText(t){
    if(toastWakeEl)toastWakeEl.textContent=t;
    if(toastEl)toastEl.classList.add('show');
    if(toastTimer)clearTimeout(toastTimer);
    toastTimer=setTimeout(function(){if(toastEl)toastEl.classList.remove('show')},4500);
  }
  document.getElementById('toastClose').addEventListener('click',function(){
    toastEl.classList.remove('show');
    if(toastTimer)clearTimeout(toastTimer);
  });
  function copyPrompt(scene,btn){
    toastText((scene.wake_word||'prompt')+' · '+(scene.scenario_title||''));
    safeWriteText((scene.prompt||'').trim()).then(function(ok){flashBtn(btn,ok?'✓ 已复制':'✗ 复制失败',2000)});
  }

  function typeClass(t){
    if(!t)return 't-view';
    if(t.indexOf('向导')>=0)return 't-wizard';
    if(t.indexOf('采集')>=0)return 't-collect';
    if(t.indexOf('选择')>=0)return 't-select';
    if(t.indexOf('查看')>=0)return 't-view';
    return 't-mixed';
  }
  function typeBadge(t){return '<span class="type-badge '+typeClass(t)+'">'+esc(t||'查看')+'</span>'}
  function hl(text,q_){
    if(!q_||!text)return esc(text);
    var i=text.toLowerCase().indexOf(q_.toLowerCase());
    if(i<0)return esc(text);
    return esc(text.slice(0,i))+'<mark>'+esc(text.slice(i,i+q_.length))+'</mark>'+esc(text.slice(i+q_.length));
  }
  function sceneMatch(s,q_){
    if(!q_)return true;
    var hay=(s.wake_word+' '+s.scenario_title+' '+(s.sub||'')+' '+(s.id||'')+' '+(s.type||'')).toLowerCase();
    return hay.indexOf(q_.toLowerCase())>=0;
  }

  /* ===== 场景卡片(L3 复制按钮 + L4 详情复制按钮双放 · P1 裁决 #5) ===== */
  function buildSceneCard(s,q_){
    var card=document.createElement('details');card.className='scene';card.id='s-'+s.scenario_id;
    var head=document.createElement('summary');head.className='scene-head';
    head.innerHTML='<span class="scene-id">'+esc(s.id)+'</span>'
      +'<span class="chip">'+esc(s.wake_word)+'</span>'
      +'<span class="scene-title">'+hl(s.scenario_title,q_)+'</span>';
    var btn=document.createElement('button');btn.className='copy-btn';
    var bl=document.createElement('span');bl.className='copy-long';bl.textContent='📋 复制 prompt';
    var bs=document.createElement('span');bs.className='copy-short';bs.textContent='复制';
    btn.appendChild(bl);btn.appendChild(bs);
    btn.onclick=function(e){if(e){e.preventDefault();e.stopPropagation()};copyPrompt(s,btn)};
    head.appendChild(btn);
    card.appendChild(head);

    var body=document.createElement('div');body.className='scene-body';
    /* 类型徽章(08 流程类型)移入详情页:头部保持一行清爽,展开后可见 */
    var tl=document.createElement('div');tl.className='scene-type';
    tl.innerHTML='<span class="type-label">流程类型</span>'+typeBadge(s.type);
    body.appendChild(tl);
    var pb=document.createElement('div');pb.className='prompt-box';
    pb.textContent=(s.prompt||'').trim();
    var pin=document.createElement('button');pin.className='copy-inline';
    var pl=document.createElement('span');pl.className='copy-long';pl.textContent='复制此 prompt';
    var ps=document.createElement('span');ps.className='copy-short';ps.textContent='复制';
    pin.appendChild(pl);pin.appendChild(ps);
    pin.onclick=function(e){if(e)e.stopPropagation();copyPrompt(s,pin)};
    pb.appendChild(pin);
    body.appendChild(pb);

    if(s.status){
      var dev=document.createElement('div');dev.className='dev-banner';
      dev.innerHTML='⚠️ '+esc(s.status)+'<span class="mini">· AI 收到此 prompt 必须停止执行并明确告知,不绕过/不假装/不降级(07 契约)</span>';
      body.appendChild(dev);
    }
    card.appendChild(body);
    return card;
  }

  /* ===== 分类模块(域 → 子功能 → 场景 · 4 层折叠) ===== */
  function buildModule(domain){
    var m=document.createElement('details');m.className='module';
    var sum=document.createElement('summary');
    var total=domain.subs.reduce(function(n,sub){return n+sub.scenes.length},0);
    sum.innerHTML='<span class="module-head"><span class="m-icon">'+esc(domain.icon)+'</span>'+esc(domain.name)
      +(total?'<span class="m-count">'+total+' 场景</span>':'');
    m.appendChild(sum);
    var body=document.createElement('div');body.className='module-body';
    arr(domain.subs).forEach(function(sub){
      var se=document.createElement('details');se.className='sub-module';
      var ssum=document.createElement('summary');
      ssum.innerHTML='<span class="sub-head"><span>'+esc(sub.name)+'</span><span class="scount">'+sub.scenes.length+' 场景</span></span>';
      se.appendChild(ssum);
      var sbody=document.createElement('div');sbody.className='module-body';
      sub.scenes.forEach(function(s){sbody.appendChild(buildSceneCard(s,null))});
      se.appendChild(sbody);
      body.appendChild(se);
    });
    m.appendChild(body);
    return m;
  }

  /* ===== 渲染 ===== */
  var modsEl=document.getElementById('mods');
  function renderMods(){
    modsEl.innerHTML='';
    /* 首次打开默认全部折叠(P1 裁决 #4 整卡展开 + 用户 2026-08-05 拍板:
       不预展开任何域,目录保持一屏概览;#hash 直达时由 goToScene 展开目标链) */
    domains.forEach(function(dom){modsEl.appendChild(buildModule(dom,false))});
  }
  renderMods();

  /* hero meta + stats(用户友好文案:无 yaml 路径/总纲引用) */
  var sum=(d.summary&&typeof d.summary==='object')?d.summary:{};
  document.getElementById('heroStats').innerHTML=(arr(sum.metrics)||[]).map(function(m){
    return '<span class="stat">'+esc(m.value)+' '+esc(m.label)+'</span>';
  }).join('');
  document.getElementById('heroMeta').textContent=
    (sum.subtitle?esc(sum.subtitle):'');

  /* 首次使用横幅(状态驱动 · P1 裁决 #3) */
  var initBanner=document.getElementById('initBanner');
  var initScene=null;
  domains.forEach(function(dom){
    arr(dom.subs).forEach(function(sub){
      sub.scenes.forEach(function(s){if(s.scenario_id==='setup_init_wizard')initScene=s});
    });
  });
  if(!d.initialized&&initScene){
    initBanner.hidden=false;
    document.getElementById('initCopy').onclick=function(e){copyPrompt(initScene,this)};
  }

  /* 联系作者 */
  var cb=document.getElementById('contactBody');
  var contactItems=[];
  if(contact.email)contactItems.push(['邮箱',contact.email]);
  if(contact.github)contactItems.push(['GitHub',contact.github]);
  if(contact.issues)contactItems.push(['Issues',contact.issues]);
  if(contact.phone)contactItems.push(['手机号',contact.phone]);
  contactItems.forEach(function(it){
    var dd=document.createElement('div');dd.className='contact-item';
    var href=/^https?:/.test(it[1])?('href="'+esc(it[1])+'" target="_blank" rel="noopener"'):'';
    dd.innerHTML='<span class="k">'+esc(it[0])+'</span><span>'+(href?'<a '+href+'>'+esc(it[1])+'</a>':esc(it[1]))+'</span>';
    cb.appendChild(dd);
  });
  var cbtn=document.createElement('button');cbtn.className='copy-btn contact-copy';cbtn.textContent='一键复制全部联系信息';
  cbtn.onclick=function(){
    var t=contactItems.map(function(it){return it[0]+': '+it[1]}).join('\n');
    toastText('全部联系信息');safeWriteText(t).then(function(ok){flashBtn(cbtn,ok?'✓ 已复制':'✗ 复制失败',2000)});
  };
  cb.appendChild(cbtn);

  document.getElementById('footerLine').textContent='饼干记账 v2.0 HELP · 使用手册';

  /* ===== 场景直达(#hash 导航 · 分享/收藏/回访) ===== */
  function openChain(el){
    var n=el.parentNode;
    while(n&&n!==document.body){
      if(n.tagName==='DETAILS'){n.open=true}
      n=n.parentNode;
    }
  }
  function goToScene(scenario_id){
    var el=document.getElementById('s-'+scenario_id);
    if(!el)return;
    openChain(el);
    el.scrollIntoView({behavior:'smooth',block:'start'});
    el.style.transition='box-shadow .6s, border-color .6s';
    el.style.boxShadow='0 0 0 3px rgba(0,122,255,.35)';
    setTimeout(function(){el.style.boxShadow=''},2000);
  }

  /* 启动:URL #s-{scenario_id} → 展开祖先链 + 定位 */
  var initHash=(location.hash||'').replace(/^#/,'');
  if(initHash.indexOf('s-')===0){
    setTimeout(function(){goToScene(initHash.slice(2))},120);
  }

  /* ===== / 快捷键聚焦搜索(输入时忽略) ===== */
  document.addEventListener('keydown',function(e){
    var tag=(e.target.tagName||'').toLowerCase();
    if(tag==='input'||tag==='textarea'||e.target.isContentEditable)return;
    if(e.key==='/'){
      e.preventDefault();
      document.getElementById('sB').focus();
    }
  });

  /* ===== 搜索:有词 → 平铺命中结果;无词 → 目录(变体 B 一屏直达) ===== */
  var inpB=document.getElementById('sB');
  inpB.addEventListener('input',function(){
    var q_=this.value.trim();
    if(!q_){renderMods();return}
    var hits=[];
    domains.forEach(function(dom){
      arr(dom.subs).forEach(function(sub){
        sub.scenes.forEach(function(s){if(sceneMatch(s,q_))hits.push(s)});
      });
    });
    modsEl.innerHTML='';
    if(hits.length===0){
      var em=document.createElement('div');em.className='search-empty';
      em.textContent='没有找到匹配「'+q_+'」的场景,换个词试试(唤醒词 / 场景名 / 子功能)。';
      modsEl.appendChild(em);
      return;
    }
    var hc=document.createElement('div');hc.className='hitcount';hc.textContent='命中 '+hits.length+' 个场景';
    modsEl.appendChild(hc);
    hits.forEach(function(s){modsEl.appendChild(buildSceneCard(s,q_))});
  });
})();
</script>
</body>
</html>
